mission:
  # CORE-08-11: kho gốc CDN (S3 của Ceph RGW) và khoá nền tảng ký UI Pack; bucket rỗng thì giữ trong bộ nhớ,
  # thiếu khoá thì sinh khoá tạm. Giá trị thật chỉ nạp từ bí mật, không ghi ở đây.
  config:
    ui-pack:
      store:
        bucket: ${UI_PACK_BUCKET:}
        endpoint: ${UI_PACK_S3_ENDPOINT:}
        region: ${UI_PACK_S3_REGION:us-east-1}
        access-key: ${UI_PACK_S3_ACCESS_KEY:}
        secret-key: ${UI_PACK_S3_SECRET_KEY:}
      signing:
        key-id: ${UI_PACK_SIGNING_KEY_ID:vt-ui-pack-1}
        private-key: ${UI_PACK_SIGNING_PRIVATE_KEY:}
        public-key: ${UI_PACK_SIGNING_PUBLIC_KEY:}
  service:
    code: ${SERVICE_CODE:SVC-05}
    schema: task
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:35092}
      apicurio-registry-url: ${APICURIO_REGISTRY_URL:http://127.0.0.1:35081/apis/registry/v2}
      producer-ready: ${KAFKA_PRODUCER_READY:true}
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:35379}
    security:
      keycloak-issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:35080/realms/mission}
      opa-url: ${OPA_URL:http://127.0.0.1:35181/v1/data/mission/authz}
      openbao-url: ${OPENBAO_URL:http://127.0.0.1:35820}
    observability:
      otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:35317}
