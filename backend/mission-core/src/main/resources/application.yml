# CORE-00-01 · SVC-05 mission-core · TL-01 L760–894, TL-04 L883–969.
# - Bật luồng ảo Java 21 (spring.threads.virtual.enabled=true).
# - Tắt open-in-view và tắt Flyway lúc chạy (spring.flyway.enabled=false; đối chiếu bằng MissionCoreSchemaVersionGuard).
# - Hibernate chỉ validate lược đồ, batch_size=50, order_updates=true, cảnh báo truy vấn chậm > 500 ms.
# - Tám DataSource độc lập (okr, task, product, appraisal, policy, dossier, oversight, config) + org_replica
#   tương thích PgBouncer transaction pooling (prepareThreshold=0, ApplicationName=mission-core-<module>).
# - Tổng maximumPoolSize của 8 mô-đun nghiệp vụ = 8 + 4 + 4 + 3 + 2 + 1 + 1 + 1 = 24 <= 35.

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:35092}
  application:
    name: ${SERVICE_NAME:mission-core}
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_updates: true
        session:
          events:
            log:
              LOG_QUERIES_SLOWER_THAN_MS: 500
  modulith:
    events:
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: false
        schema: modulith
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:25s}
  # Token Keycloak realm mission (ADR-08): iss phải khớp issuer-uri; JWKS lấy theo jwk-set-uri (đường nội bộ tới
  # Keycloak khi khác tên máy công khai), nên khởi động không cần Keycloak sẵn sàng.
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:35080/realms/mission}
          jwk-set-uri: ${KEYCLOAK_JWKS_URI:${KEYCLOAK_ISSUER_URI:http://127.0.0.1:35080/realms/mission}/protocol/openid-connect/certs}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,missionCoreReadiness
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  observations:
    key-values:
      cell: ${CELL_ID:hcm}
  metrics:
    tags:
      application: ${spring.application.name}

okrkpi:
  # CORE-00-03: inbox ghi org_replica.inbox_* (bản sao tổ chức nhận EVT-14/15/16, org.bootstrap.v1).
  inbox:
    schema: org_replica
    registry:
      url: ${APICURIO_REGISTRY_V3_URL:http://127.0.0.1:35081/apis/registry/v3}
    listener-auto-startup: ${ORG_REPLICA_CONSUMERS_ENABLED:true}
  # OPA cùng pod (ADR-21). Timeout mặc định 50/100 ms theo TL-01; môi trường đi qua đường hầm (dev) nâng lên
  # bằng OPA_CONNECT_TIMEOUT, OPA_READ_TIMEOUT, nếu không mọi lời gọi quá hạn và bị từ chối (fail closed, 403).
  opa:
    enabled: ${OPA_ENABLED:false}
    base-url: ${OPA_BASE_URL:http://127.0.0.1:8181}
    connect-timeout: ${OPA_CONNECT_TIMEOUT:50ms}
    read-timeout: ${OPA_READ_TIMEOUT:100ms}
  # /api/** cần bearer token hợp lệ; chỉ tắt cho máy dev không có Keycloak (token gửi kèm vẫn được kiểm).
  security:
    auth-enabled: ${AUTH_ENABLED:true}
  tenant:
    claim: ${TENANT_JWT_CLAIM:tenant_id}
    db-setting: ${TENANT_DB_SETTING:app.tenant_id}
    # Client dịch vụ được uỷ quyền tenant qua X-Tenant-Id (wiki 14 mục 42): evidence-service hỏi cổng
    # nội bộ bản bọc khoá C3 (CORE-07-06); workflow-service gọi cổng bên tham gia saga chốt kỳ của MOD-08 (QA-06).
    delegating-clients: ${TENANT_DELEGATING_CLIENTS:analytics-api,evidence-service,integration-gateway,scoring-service,workflow-service}
  schema-guard:
    enabled: ${SCHEMA_GUARD_ENABLED:true}
    default-min-version: ${SCHEMA_MIN_VERSION:0.20}
    min-versions:
      okr: ${SCHEMA_MIN_VERSION_OKR:0.20}
      task: ${SCHEMA_MIN_VERSION_TASK:0.20}
      product: ${SCHEMA_MIN_VERSION_PRODUCT:0.20}
      appraisal: ${SCHEMA_MIN_VERSION_APPRAISAL:0.20}
      policy: ${SCHEMA_MIN_VERSION_POLICY:0.20}
      dossier: ${SCHEMA_MIN_VERSION_DOSSIER:0.20}
      oversight: ${SCHEMA_MIN_VERSION_OVERSIGHT:0.20}
      config: ${SCHEMA_MIN_VERSION_CONFIG:0.20}
      org_replica: ${SCHEMA_MIN_VERSION_ORG_REPLICA:0.20}
  datasources:
    okr:
      url: ${DB_OKR_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:35432}/${DB_NAME:mission}?currentSchema=okr&prepareThreshold=0&ApplicationName=mission-core-okr}
      username: ${DB_OKR_USER:svc_okr}
      password: ${DB_OKR_PASSWORD:${DB_PASSWORD:}}
      max-pool-size: ${DB_OKR_POOL_MAX:4}
      min-idle: ${DB_OKR_POOL_MIN:2}
      connection-timeout: 2000
      max-lifetime: 1500000
      idle-timeout: 300000
      leak-detection-threshold: 20000
      read-replica:
        enabled: ${DB_OKR_REPLICA_ENABLED:${DB_REPLICA_ENABLED:false}}
        url: ${DB_OKR_REPLICA_URL:jdbc:postgresql://${DB_RO_HOST:${DB_HOST:127.0.0.1}}:${DB_RO_PORT:${DB_PORT:35432}}/${DB_NAME:mission}?currentSchema=okr&prepareThreshold=0&ApplicationName=mission-core-okr}
        username: ${DB_OKR_RO_USER:ro_okr}
        password: ${DB_OKR_RO_PASSWORD:${DB_PASSWORD:}}
        max-lag-ms: ${DB_REPLICA_MAX_LAG_MS:1000}
    task:
      url: ${DB_TASK_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:35432}/${DB_NAME:mission}?currentSchema=task&prepareThreshold=0&ApplicationName=mission-core-task}
      username: ${DB_TASK_USER:svc_task}
      password: ${DB_TASK_PASSWORD:${DB_PASSWORD:}}
      max-pool-size: ${DB_TASK_POOL_MAX:8}
      min-idle: ${DB_TASK_POOL_MIN:2}
      connection-timeout: 2000
      max-lifetime: 1500000
      idle-timeout: 300000
      leak-detection-threshold: 20000
      read-replica:
        enabled: ${DB_TASK_REPLICA_ENABLED:${DB_REPLICA_ENABLED:false}}
        url: ${DB_TASK_REPLICA_URL:jdbc:postgresql://${DB_RO_HOST:${DB_HOST:127.0.0.1}}:${DB_RO_PORT:${DB_PORT:35432}}/${DB_NAME:mission}?currentSchema=task&prepareThreshold=0&ApplicationName=mission-core-task}
        username: ${DB_TASK_RO_USER:ro_task}
