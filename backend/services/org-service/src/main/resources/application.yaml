# SVC-04 org-service. Không chứa mật khẩu: thông tin kết nối và issuer nạp từ biến môi trường (Secret do External
# Secrets đồng bộ từ OpenBao, TL-03 "Không truy cập chéo và quyền tối thiểu").
spring:
  application:
    name: org-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${ORG_DB_URL:jdbc:postgresql://localhost:5432/td_dev}
    username: ${ORG_DB_USER:svc_org}
    password: ${ORG_DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${ORG_DB_POOL:20}
  flyway:
    # Ứng dụng không có quyền DDL; migration chạy bằng hồ sơ "migrate" với mig_org (Job Helm pre-upgrade).
    enabled: false
    schemas: org
    default-schema: org
    create-schemas: false
    locations: classpath:db/migration/org
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/mission}
  lifecycle:
    timeout-per-shutdown-phase: 25s
  servlet:
    multipart:
      # DV-04-05: tệp nhập cây tổ chức tối đa 10 MB (OrgImportService.MAX_FILE_BYTES).
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:0.1}
logging:
  structured:
    format:
      console: ecs
okrkpi:
  org:
    zone: Asia/Ho_Chi_Minh
    step-up-window: PT5M
    locked-periods: []
    auth-enabled: ${AUTH_ENABLED:true}
    dev-tenant-id: ${DEV_TENANT_ID:01960000-0000-7000-8000-000000000001}
    dev-user-id: ${DEV_USER_ID:01960000-0000-7000-8000-000000000101}
    # CORE-07-06: khoá ký danh bạ khoá công khai C3 trong OpenBao Transit (ecdsa-p256 mỗi tenant). Trống thì từ chối
    # ký (503). Token đọc từ tệp do OpenBao Agent cấp, không đặt trong cấu hình.
    directory-signer:
      base-url: ${OPENBAO_ADDR:}
      mount: ${OPENBAO_TRANSIT_MOUNT:transit}
      key-prefix: org-directory-
      token-file: ${OPENBAO_TOKEN_FILE:/vault/secrets/token}
      auto-create: ${OPENBAO_DIRECTORY_AUTO_CREATE:false}
---
spring:
  config:
    activate:
      on-profile: migrate
  main:
    web-application-type: none
  flyway:
    enabled: true
    user: ${ORG_MIG_DB_USER:mig_org}
    password: ${ORG_MIG_DB_PASSWORD:}
---
# DV-04-08: lệnh org-republish chạy như Job (không mở cổng web), đọc bằng svc_org, phát thẳng lên Kafka.
spring:
  config:
    activate:
      on-profile: republish
  main:
    web-application-type: none
okrkpi:
  org:
    republish:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      registry-url: ${APICURIO_REGISTRY_URL:http://localhost:8080/apis/registry/v3}
