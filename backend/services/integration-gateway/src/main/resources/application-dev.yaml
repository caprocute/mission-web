# NEN-019 · Hồ sơ môi trường phát triển cục bộ (infra/dev, kết nối qua SSH tunnel 127.0.0.1:35xxx).
# Không chứa mật khẩu hay khoá bí mật; mật khẩu truyền qua biến môi trường từ infra/dev/.env.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:35433}/${DB_NAME:mission}?currentSchema=${DB_SCHEMA:integ}}
    username: ${DB_USER:svc_integ}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

mission:
  service:
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:35092}
      apicurio-registry-url: ${APICURIO_REGISTRY_URL:http://127.0.0.1:35081/apis/registry/v2}
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:35379}
    security:
      keycloak-issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:35080/realms/mission}
      opa-url: ${OPA_URL:http://127.0.0.1:35181/v1/data/mission/authz}
      openbao-url: ${OPENBAO_URL:http://127.0.0.1:35820}
    observability:
      otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:35317}

# DV-13-08 · Hồ sơ mẫu cho HRM giả lập (YC-PT-13): địa chỉ, tài khoản và bí mật nằm ở bản ghi
# integ.connector của tenant; đổi sang hệ thật chỉ đổi bản ghi đó và ánh xạ trường dưới đây.
# Khoá mã kết nối và giá trị nguồn có dấu, khoảng trắng đặt trong ngoặc vuông để giữ nguyên.
okrkpi:
  integ:
    hrm:
      org:
        base-url: ${ORG_SERVICE_URL:}
      connectors:
        "[HRM]":
          period: PT15M
          rest:
            path: /api/persons
            updated-at: /updatedAt
          indicator:
            path: /api/indicators/{id}
            value: /value
            measured-at: /measuredAt
          fields:
            externalId: /maNhanSu
            fullName: /hoTen
            nationalId: /soDinhDanh
            birthDate: /ngaySinh
            employmentStatus: /trangThai
            partyMember: /dangVien
            orgUnit: /maDonVi
            jobTitle: /maChucDanh
          values:
            employmentStatus:
              "[Đang làm việc]": DANG_CONG_TAC
              "[Nghỉ hưu]": NGHI_HUU
              "[Thôi việc]": THOI_VIEC
        # DV-13-06: CSDL quốc gia CBCCVC qua NDXP, kéo hết trang trong lần đồng bộ (lịch đêm ở
        # connector.schedule_cron, "Đồng bộ ngay" từ SCR-0104). Tên trường là suy luận cho bản giả lập.
        "[CBCCVC]":
          trigger: RUN
          request-timeout: PT30S
          batch-size: 500
          rest:
            path: /api/cbccvc/v1/ho-so
            cursor-param: capNhatTu
            limit-param: gioiHan
            page-size: 200
            items: /duLieu
            next-cursor: /conTroTiep
            updated-at: /capNhatLuc
          fields:
            externalId: /maHoSo
            fullName: /hoTen
            nationalId: /soDinhDanh
            birthDate: /ngaySinh
            employmentStatus: /tinhTrang
            partyMember: /laDangVien
            orgUnit: /coQuan/maDinhDanh
            jobTitle: /chucVu/ma
            effectiveFrom: /ngayHieuLuc
          values:
            employmentStatus:
              "[Đang công tác]": DANG_CONG_TAC
              "[Nghỉ hưu]": NGHI_HUU
              "[Thôi việc]": THOI_VIEC
        "[HRM_SFTP]":
          period: PT1H
          batch:
            known-hosts: ${INTEG_SFTP_KNOWN_HOSTS:}
          fields:
            externalId: Mã cán bộ
            fullName: Họ và tên
            nationalId: Số định danh
            birthDate: Ngày sinh
            orgUnit: Mã đơn vị
            jobTitle: Mã chức danh
            partyMember: Đảng viên
