# NEN-019 · TL-04 WI-20, WI-23 "Nguyên tắc cấu hình chung cho mọi service".
# - Luồng ảo Java 21 bật mặc định.
# - Tắt open-in-view và Flyway lúc chạy (migration chạy ở InitContainer vt-db-migration).
# - Hibernate chỉ validate lược đồ.
# - Cổng ứng dụng SERVER_PORT (8080), cổng quản trị MANAGEMENT_PORT (8081).
# - Tắt êm (graceful shutdown) với pha chờ tối đa 25s (nhỏ hơn terminationGracePeriodSeconds=40s trừ preStop=5s).
# - Mọi thông số kết nối và cổng dùng biến môi trường ${BIEN_MOI_TRUONG:gia_tri_mac_dinh}, mặc định
#   trỏ tới 127.0.0.1 qua dải cổng SSH tunnel 35xxx của infra/dev để dễ dàng thay đổi động qua .env.

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8080/realms/mission}
  application:
    name: ${SERVICE_NAME:integration-gateway}
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}
  flyway:
    enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:25s}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:35432}/${DB_NAME:mission}?currentSchema=${DB_SCHEMA:integ}}
    username: ${DB_USER:svc_integ}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: integration-gateway-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        # Liveness chỉ kiểm tra nội tại JVM, tuyệt đối không phụ thuộc CSDL/Kafka/dịch vụ ngoài (TL-04 WI-20).
        liveness:
          include: livenessState,ping
        # Readiness kiểm tra pool CSDL và trạng thái sẵn sàng của kết nối hạ tầng (pool CSDL, producer Kafka).
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

mission:
  service:
    code: ${SERVICE_CODE:SVC-13}
    schema: ${DB_SCHEMA:integ}
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:35092}
      apicurio-registry-url: ${APICURIO_REGISTRY_URL:http://127.0.0.1:35081/apis/registry/v2}
      producer-ready: ${KAFKA_PRODUCER_READY:true}
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:35379}
    security:
      keycloak-issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:35080/realms/mission}
      opa-url: ${OPA_URL:http://127.0.0.1:35181/v1/data/mission/authz}
      openbao-url: ${OPENBAO_URL:http://127.0.0.1:35820}
    observability:
      otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:35317}

# SVC-13 (DV-13-01): outbox trong schema integ; thông số khung route Camel và pipeline chiều ra.
okrkpi:
  outbox:
    schema: integ
    registry:
      url: ${APICURIO_REGISTRY_URL:http://127.0.0.1:35081/apis/registry/v2}
  integ:
    # Cổng nội bộ /internal/** đòi token dịch vụ; chỉ tắt ở kiểm thử và môi trường giả lập.
    auth-enabled: ${INTEG_AUTH_ENABLED:true}
    # Thư mục OpenBao Agent/CSI kết xuất bí mật kết nối theo secret_path; trống ở bản giả lập.
    secrets-dir: ${INTEG_SECRETS_DIR:}
    voffice:
      enabled: ${INTEG_VOFFICE_ENABLED:true}
      codes: ${INTEG_VOFFICE_CODES:VOFFICE}
      period: ${INTEG_VOFFICE_PERIOD:PT30S}
      request-timeout: ${INTEG_VOFFICE_TIMEOUT:PT5S}
    # DV-13-08: số liệu nguồn cho KR (MOD-01 trả trong 3 giây nên gateway cắt sớm hơn).
    kr-source:
      timeout: ${INTEG_KR_SOURCE_TIMEOUT:PT2.5S}
      breaker-open: ${INTEG_KR_SOURCE_BREAKER_OPEN:PT30S}
    # DV-13-08: HRM, ERP, HIS, quản lý trường học. Hồ sơ theo mã kết nối (connectors.<MÃ>: rest |
    # batch, indicator, fields, values) khai báo ở giá trị triển khai, mẫu ở application-dev.yaml.
    hrm:
      enabled: ${INTEG_HRM_ENABLED:true}
      org:
        base-url: ${ORG_SERVICE_URL:}
        token-url: ${INTEG_TOKEN_URL:}
        client-id: ${INTEG_CLIENT_ID:integration-gateway}
        client-secret: ${INTEG_CLIENT_SECRET:}
    # DV-13-06: lần đồng bộ kéo hết trang cho org-service (CSDL CBCCVC qua NDXP, hồ sơ HRM có
    # trigger: RUN): lịch đêm ở connector.schedule_cron, "Đồng bộ ngay" và chạy lại thư chết.
    sync-run:
      enabled: ${INTEG_SYNC_RUN_ENABLED:true}
      period: ${INTEG_SYNC_RUN_PERIOD:PT10S}
      max-pages: ${INTEG_SYNC_RUN_MAX_PAGES:5000}
      fetch-attempts: ${INTEG_SYNC_RUN_FETCH_ATTEMPTS:3}
      fetch-backoff: ${INTEG_SYNC_RUN_FETCH_BACKOFF:PT2S}
      lease-seconds: ${INTEG_SYNC_RUN_LEASE_SECONDS:300}
    # DV-13-06: chỉ tiêu KT-XH qua LGSP tỉnh, bộ (BR-16-05 cờ da_cong_bo).
    lgsp:
      enabled: ${INTEG_LGSP_ENABLED:true}
      codes: ${INTEG_LGSP_CODES:LGSP}
      path: ${INTEG_LGSP_PATH:/api/chi-tieu-ktxh}
      period: ${INTEG_LGSP_PERIOD:PT15M}
    # DV-13-05: Trục liên thông văn bản quốc gia qua X-Road. inbound-codes là kết nối kéo văn bản
    # đến, outbound-codes là nơi nhận văn bản gửi ra (BTC_TW, VPTW); địa chỉ, mã thành viên X-Road
    # và mã cơ quan nằm ở endpoint của kết nối. Tắt ở Deployment chính khi chạy values-truc.yaml.
    truc:
      enabled: ${INTEG_TRUC_ENABLED:true}
      inbound-codes: ${INTEG_TRUC_INBOUND_CODES:TRUC}
      outbound-codes: ${INTEG_TRUC_OUTBOUND_CODES:BTC_TW,VPTW}
      period: ${INTEG_TRUC_PERIOD:PT1M}
      request-timeout: ${INTEG_TRUC_REQUEST_TIMEOUT:PT30S}
      max-bytes: ${INTEG_TRUC_MAX_BYTES:31457280}
      transfer-max-bytes: ${INTEG_TRUC_TRANSFER_MAX_BYTES:20971520}
    route:
      max-redeliveries: ${INTEG_MAX_REDELIVERIES:5}
      redelivery-delay: ${INTEG_REDELIVERY_DELAY:PT2S}
      back-off-multiplier: 2
      failure-rate-threshold: 50
      sliding-window-size: 20
      wait-in-open-state: ${INTEG_BREAKER_OPEN:PT30S}
      call-timeout: ${INTEG_CALL_TIMEOUT:PT5S}
    inbox:
      dedupe-window-days: ${INTEG_DEDUPE_WINDOW_DAYS:7}
    pull:
      enabled: ${INTEG_PULL_ENABLED:true}
    outbound:
      ack-timeout: ${INTEG_ACK_TIMEOUT:PT10M}
      dispatch:
        enabled: ${INTEG_DISPATCH_ENABLED:true}
        period: ${INTEG_DISPATCH_PERIOD:PT5S}
        batch: ${INTEG_DISPATCH_BATCH:100}
        # DV-13-05: worker chỉ gửi (include) hoặc bỏ qua (exclude) các mã kết nối này.
        include-codes: ${INTEG_DISPATCH_INCLUDE_CODES:}
        exclude-codes: ${INTEG_DISPATCH_EXCLUDE_CODES:}
      consumer:
        enabled: ${INTEG_OUTBOUND_CONSUMER_ENABLED:true}
    # DV-13-02: CloudEvents ra ngoài, ký JWS bằng khoá của cell, gửi qua mTLS 1.3. Chỉ có đường dẫn:
    # tệp JWK Set do OpenBao Agent kết xuất, thư mục chứng thư <tls-dir>/<mã kết nối viết thường>/
    # (tls.crt, tls.key PKCS#8, ca.crt) do cert-manager gắn vào. Kết nối chưa khai dùng mặc định
    # (C0, C1, chữ ký tách, bắt buộc mTLS).
    cloudevents:
      cell: ${INTEG_CELL_CODE:${vt.platform.routing.cell-code:cell-dev}}
      data-schema-base: ${INTEG_DATA_SCHEMA_BASE:https://api.okr.viettel.vn/schemas}
      signing-jwks-file: ${INTEG_SIGNING_JWKS_FILE:}
      tls-dir: ${INTEG_TLS_DIR:}
      connect-timeout: ${INTEG_CE_CONNECT_TIMEOUT:PT5S}
      request-timeout: ${INTEG_CE_REQUEST_TIMEOUT:PT10S}

camel:
  main:
    name: integration-gateway
