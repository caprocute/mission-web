# NEN-019 · TL-04 WI-20, WI-23 "Nguyên tắc cấu hình chung cho mọi service".
# - Luồng ảo Java 21 bật mặc định.
# - Tắt open-in-view và Flyway lúc chạy (migration chạy ở InitContainer vt-db-migration).
# - Hibernate chỉ validate lược đồ.
# - Cổng ứng dụng SERVER_PORT (8080), cổng quản trị MANAGEMENT_PORT (8081).
# - Tắt êm (graceful shutdown) với pha chờ tối đa 25s (nhỏ hơn terminationGracePeriodSeconds=40s trừ preStop=5s).
# - Mọi thông số kết nối và cổng dùng biến môi trường ${BIEN_MOI_TRUONG:gia_tri_mac_dinh}, mặc định
#   trỏ tới 127.0.0.1 qua dải cổng SSH tunnel 35xxx của infra/dev để dễ dàng thay đổi động qua .env.

spring:
  application:
    name: ${SERVICE_NAME:esign-service}
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    schemas: esign
    default-schema: esign
    locations: classpath:db/migration/esign
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:35080/realms/mission}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:25s}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:35432}/${DB_NAME:mission}?currentSchema=${DB_SCHEMA:esign}}
    username: ${DB_USER:svc_esign}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: esign-service-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        # Liveness chỉ kiểm tra nội tại JVM, tuyệt đối không phụ thuộc CSDL/Kafka/dịch vụ ngoài (TL-04 WI-20).
        liveness:
          include: livenessState,ping
        # Readiness kiểm tra pool CSDL và trạng thái sẵn sàng của kết nối hạ tầng (pool CSDL, producer Kafka).
        readiness:
          include: readinessState,db,templateReadiness,hsm
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

mission:
  service:
    code: ${SERVICE_CODE:SVC-10}
    schema: ${DB_SCHEMA:esign}
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:35092}
      apicurio-registry-url: ${APICURIO_REGISTRY_URL:http://127.0.0.1:35081/apis/registry/v2}
      producer-ready: ${KAFKA_PRODUCER_READY:true}
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:35379}
    security:
      keycloak-issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:35080/realms/mission}
      opa-url: ${OPA_URL:http://127.0.0.1:35181/v1/data/mission/authz}
      openbao-url: ${OPENBAO_URL:http://127.0.0.1:35820}
    observability:
      otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:35317}

# SVC-10 ký số (DV-10-01): outbox, idempotency trong schema esign; nhà cung cấp chọn theo mã → id().
okrkpi:
  # DV-10-05 · TL-04 khoá crypto.provider: standard (SaaS, mặc định) hoặc bcy (bản cách ly, thư viện
  # Ban Cơ yếu). Ở bcy, đường dẫn thư viện, lớp bọc, khe khoá và tệp mã PIN do cấu hình triển khai cấp.
  crypto:
    provider: ${CRYPTO_PROVIDER:standard}
    bcy:
      library-path: ${CRYPTO_BCY_LIBRARY_PATH:}
      library-class: ${CRYPTO_BCY_LIBRARY_CLASS:}
      allowed-algorithms: ${CRYPTO_BCY_ALLOWED_ALGORITHMS:}
      params:
        slot: ${CRYPTO_BCY_SLOT:}
        pin-file: ${CRYPTO_BCY_PIN_FILE:}
  outbox:
    schema: esign
    registry:
      url: ${APICURIO_REGISTRY_URL:http://127.0.0.1:35081/apis/registry/v2}
  idempotency:
    schema: esign
  esign:
    default-provider: ${ESIGN_DEFAULT_PROVIDER:MYSIGN}
    confirm-window: ${ESIGN_CONFIRM_WINDOW:120s}
    provider-ids:
      MYSIGN: ${ESIGN_PROVIDER_MYSIGN:mysign}
      VIETTEL_CA: ${ESIGN_PROVIDER_VIETTEL_CA:viettel-ca}
      CA_CHINH_PHU: ${ESIGN_PROVIDER_CA_CHINH_PHU:gov-ca}
      BAN_CO_YEU: ${ESIGN_PROVIDER_BAN_CO_YEU:bcy}
    fake-provider:
      enabled: ${ESIGN_FAKE_PROVIDER:false}
    # DV-10-05: nhãn khe khoá ký của Ban Cơ yếu; {signer} thay bằng mã người ký.
    bcy:
      key-label: ${ESIGN_BCY_KEY_LABEL:ky-van-ban}
    # DV-10-02: MySign theo CSC API v2. Bí mật client và khoá kho đối tượng nạp từ OpenBao qua biến
    # môi trường; đổi máy chủ CSC giả lập sang MySign thật chỉ đổi các giá trị này.
    mysign:
      enabled: ${ESIGN_MYSIGN_ENABLED:false}
      base-url: ${ESIGN_MYSIGN_BASE_URL:}
      token-url: ${ESIGN_MYSIGN_TOKEN_URL:}
      client-id: ${ESIGN_MYSIGN_CLIENT_ID:}
      client-secret: ${ESIGN_MYSIGN_CLIENT_SECRET:}
      scope: ${ESIGN_MYSIGN_SCOPE:}
      tsa-url: ${ESIGN_TSA_URL:}
      storage:
        endpoint: ${ESIGN_S3_ENDPOINT:}
        region: ${ESIGN_S3_REGION:us-east-1}
        bucket: ${ESIGN_S3_BUCKET:dossier}
        access-key: ${ESIGN_S3_ACCESS_KEY:}
        secret-key: ${ESIGN_S3_SECRET_KEY:}
    # DV-10-04: Viettel-CA và CA chuyên dùng Chính phủ ký từ xa theo CSC API. Chứng thư gốc, OCSP,
    # CRL và địa chỉ dịch vụ là cấu hình triển khai (tệp PEM gắn từ ConfigMap); bí mật client từ OpenBao.
    viettel-ca:
      enabled: ${ESIGN_VIETTEL_CA_ENABLED:false}
      base-url: ${ESIGN_VIETTEL_CA_BASE_URL:}
      token-url: ${ESIGN_VIETTEL_CA_TOKEN_URL:}
      client-id: ${ESIGN_VIETTEL_CA_CLIENT_ID:}
      client-secret: ${ESIGN_VIETTEL_CA_CLIENT_SECRET:}
      scope: ${ESIGN_VIETTEL_CA_SCOPE:}
      tsa-url: ${ESIGN_TSA_URL:}
      trust-anchors: ${ESIGN_VIETTEL_CA_TRUST_ANCHORS:}
      ocsp-url: ${ESIGN_VIETTEL_CA_OCSP_URL:}
      crl-url: ${ESIGN_VIETTEL_CA_CRL_URL:}
      storage:
        endpoint: ${ESIGN_S3_ENDPOINT:}
        region: ${ESIGN_S3_REGION:us-east-1}
        bucket: ${ESIGN_S3_BUCKET:dossier}
        access-key: ${ESIGN_S3_ACCESS_KEY:}
        secret-key: ${ESIGN_S3_SECRET_KEY:}
    gov-ca:
      enabled: ${ESIGN_GOV_CA_ENABLED:false}
      mode: ${ESIGN_GOV_CA_MODE:REMOTE}
      base-url: ${ESIGN_GOV_CA_BASE_URL:}
      token-url: ${ESIGN_GOV_CA_TOKEN_URL:}
      client-id: ${ESIGN_GOV_CA_CLIENT_ID:}
      client-secret: ${ESIGN_GOV_CA_CLIENT_SECRET:}
      scope: ${ESIGN_GOV_CA_SCOPE:}
      tsa-url: ${ESIGN_TSA_URL:}
      trust-anchors: ${ESIGN_GOV_CA_TRUST_ANCHORS:}
      ocsp-url: ${ESIGN_GOV_CA_OCSP_URL:}
      crl-url: ${ESIGN_GOV_CA_CRL_URL:}
      storage:
        endpoint: ${ESIGN_S3_ENDPOINT:}
        region: ${ESIGN_S3_REGION:us-east-1}
        bucket: ${ESIGN_S3_BUCKET:dossier}
        access-key: ${ESIGN_S3_ACCESS_KEY:}
        secret-key: ${ESIGN_S3_SECRET_KEY:}
    # DV-10-03: HSM qua PKCS#11 (dev: SoftHSM2). PIN nạp từ OpenBao qua biến môi trường, không
    # ghi vào tệp; khoá nằm trên token, không trích xuất được.
    hsm:
      enabled: ${ESIGN_HSM_ENABLED:false}
      library: ${ESIGN_HSM_LIBRARY:}
      slot: ${ESIGN_HSM_SLOT:}
      slot-list-index: ${ESIGN_HSM_SLOT_LIST_INDEX:}
      pin: ${ESIGN_HSM_PIN:}
      org-key-alias: ${ESIGN_HSM_ORG_KEY_ALIAS:mission-org-sign}
      seal-key-alias: ${ESIGN_HSM_SEAL_KEY_ALIAS:mission-seal}
      max-sessions: ${ESIGN_HSM_MAX_SESSIONS:8}
      acquire-timeout: ${ESIGN_HSM_ACQUIRE_TIMEOUT:2s}
      provision-dev-keys: ${ESIGN_HSM_PROVISION_DEV_KEYS:false}
    # Máy chủ dấu thời gian RFC 3161: danh sách theo thứ tự ưu tiên, phân tách bằng dấu phẩy.
    tsa:
      enabled: ${ESIGN_TSA_ENABLED:false}
      urls: ${ESIGN_TSA_URLS:}
      trust-anchors: ${ESIGN_TSA_TRUST_ANCHORS:}
    seal:
      allowed-clients: ${ESIGN_SEAL_ALLOWED_CLIENTS:ledger-service}
    # Gia hạn dấu thời gian lưu trữ PAdES-LTA hằng năm (mặc định 02:00 UTC ngày 15/01).
    archive-timestamp:
      enabled: ${ESIGN_ARCHIVE_TS_ENABLED:false}
      cron: ${ESIGN_ARCHIVE_TS_CRON:0 0 2 15 1 *}
      renew-before: ${ESIGN_ARCHIVE_TS_RENEW_BEFORE:400d}
      batch-size: ${ESIGN_ARCHIVE_TS_BATCH:200}
      bucket: ${ESIGN_S3_BUCKET:dossier}
    worker:
      enabled: ${ESIGN_WORKER_ENABLED:true}
      poll-interval: ${ESIGN_WORKER_POLL:2s}
      batch-size: ${ESIGN_WORKER_BATCH:100}
    # DV-10-06: ký lô một lần xác nhận. Worker ký lô chạy ở bản triển khai riêng (esign-batch-worker)
    # bật ESIGN_BATCH_WORKER_ENABLED; KEDA co giãn theo metric esign_batch_queue_items (ngưỡng ở values,
    # INF-16). parallelism giới hạn số chữ ký đồng thời mỗi bản sao để HSM dùng không quá 50% năng lực.
    # Thời gian chờ đọc của lời gọi CSC, bằng thời hạn 10 giây của instance esign-* (TL-01).
    csc:
      read-timeout: ${ESIGN_CSC_READ_TIMEOUT:10s}
    batch:
      max-items: ${ESIGN_BATCH_MAX_ITEMS:1000}
      max-attempts: ${ESIGN_BATCH_MAX_ATTEMPTS:5}
      backoff: ${ESIGN_BATCH_BACKOFF:2s}
      max-backoff: ${ESIGN_BATCH_MAX_BACKOFF:5m}
    batch-worker:
      enabled: ${ESIGN_BATCH_WORKER_ENABLED:false}
      poll-interval: ${ESIGN_BATCH_WORKER_POLL:1s}
      scan-size: ${ESIGN_BATCH_WORKER_SCAN:200}
      parallelism: ${ESIGN_BATCH_WORKER_PARALLELISM:16}
    # Cổng nội bộ của module nguồn trả tài liệu cần ký (suy luận, wiki trang 14).
    sources:
      task: ${ESIGN_SOURCE_CORE_URL:http://127.0.0.1:8080}
      appraisal: ${ESIGN_SOURCE_CORE_URL:http://127.0.0.1:8080}
      dossier: ${ESIGN_SOURCE_CORE_URL:http://127.0.0.1:8080}
      oversight: ${ESIGN_SOURCE_CORE_URL:http://127.0.0.1:8080}
      policy: ${ESIGN_SOURCE_CORE_URL:http://127.0.0.1:8080}

# DV-10-04: instance Resilience4j riêng cho từng nhà cung cấp, cùng mức với esign-mysign (TL-01).
resilience4j:
  circuitbreaker:
    instances:
      esign-viettel-ca: {baseConfig: default, waitDurationInOpenState: 60s}
      esign-gov-ca: {baseConfig: default, waitDurationInOpenState: 60s}
  timelimiter:
    instances:
      esign-viettel-ca: {timeoutDuration: 10s}
      esign-gov-ca: {timeoutDuration: 10s}
  bulkhead:
    instances:
      esign-viettel-ca: {maxConcurrentCalls: 50}
      esign-gov-ca: {maxConcurrentCalls: 50}
