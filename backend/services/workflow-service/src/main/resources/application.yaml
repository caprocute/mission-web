# Cấu hình dịch vụ SVC-06 workflow-service (TL-01 chương 8 mục 8.7 · TL-03 mục 6.13 · DV-06-01).
# - Luồng ảo Java 21 bật mặc định.
# - Tắt open-in-view, tắt tự nâng cấp DDL của Flowable (database-schema-update=false).
# - Cổng ứng dụng SERVER_PORT (8080), cổng quản trị MANAGEMENT_PORT (8081).
# - Tắt êm (graceful shutdown) với pha chờ tối đa 25s.

spring:
  application:
    name: ${SERVICE_NAME:workflow-service}
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    schemas: flowable
    default-schema: flowable
    locations: classpath:db/migration/flowable
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:25s}
  security:
    oauth2:
      resourceserver:
        jwt:
          # Bộ giải mã JWT dựng lười từ issuer Keycloak (ADR-08); realm theo môi trường.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:35080/realms/mission}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:35432}/${DB_NAME:mission}?currentSchema=${DB_SCHEMA:flowable}}
    username: ${DB_USER:svc_flowable}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: workflow-service-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:4}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

flowable:
  database-schema: flowable
  database-schema-update: false
  history-level: audit
  async-executor-activate: ${WF_ASYNC_ENABLED:false}
  # Mẫu luồng triển khai qua TemplateDeployer (linter + một lần triển khai không gắn tenant, DV-06-03).
  check-process-definitions: false
  task-invoker:
    core-pool-size: 16
    max-pool-size: 32
    queue-size: 256
  process:
    definition-cache-limit: 200
    async:
      executor:
        core-pool-size: 16
        max-pool-size: 32
        queue-capacity: 256
        max-async-jobs-due-per-acquisition: 64
        max-timer-jobs-per-acquisition: 64
        default-async-job-acquire-wait-time: 1s
        default-timer-job-acquire-wait-time: 5s
        async-job-lock-time: 5m
        timer-lock-time: 5m
        # Lượt saga thất bại được khoá tới hết thời gian lùi; luồng gỡ khoá hết hạn trả lượt về
        # hàng đợi, nên chu kỳ này quyết định độ trễ thêm của lần thử lại (DV-06-05).
        reset-expired-jobs-interval: ${WF_RESET_EXPIRED_INTERVAL:5s}
  dmn:
    enabled: true
    history-enabled: false
    # DMN chon-cap-duyet triển khai cùng BPMN trong TemplateDeployer.
    deploy-resources: false
  idm:
    enabled: false
  eventregistry:
    enabled: false

springdoc:
  api-docs:
    # Tài liệu /v3/api-docs chỉ bật ở kiểm thử hợp đồng; hợp đồng gốc nằm ở contracts/openapi.
    enabled: ${API_DOCS_ENABLED:false}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        liveness:
          include: livenessState,ping
        readiness:
          include: readinessState,db,templateReadiness
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

mission:
  service:
    code: ${SERVICE_CODE:SVC-06}
    schema: ${DB_SCHEMA:flowable}
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:35092}
      apicurio-registry-url: ${APICURIO_REGISTRY_URL:http://127.0.0.1:35081/apis/registry/v2}
      producer-ready: ${KAFKA_PRODUCER_READY:true}
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:35379}
    security:
      keycloak-issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:35080/realms/mission}
      opa-url: ${OPA_URL:http://127.0.0.1:35181/v1/data/mission/authz}
      openbao-url: ${OPENBAO_URL:http://127.0.0.1:35820}
    observability:
      otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:35317}
  workflow:
    batch:
      # Executor của duyệt hàng loạt: luồng và hàng đợi giới hạn (TL-01 "Cô lập tài nguyên").
      threads: ${WF_BATCH_THREADS:2}
      queue-capacity: ${WF_BATCH_QUEUE:50}
    templates:
      # Kiểm linter và triển khai ba mẫu luồng duyệt phần 1 khi khởi động (DV-06-03).
      deploy-on-start: ${WF_TEMPLATES_DEPLOY:true}
    core-callback:
      # External worker gọi lại API lõi chạy ở Deployment worker (cùng nơi bật async executor).
      enabled: ${WF_ASYNC_ENABLED:false}
      poll-interval: ${WF_CORE_CALLBACK_POLL:PT2S}
    core:
      base-url: ${CORE_BASE_URL:http://127.0.0.1:8080/api/v1}
      # Tệp token dịch vụ do ESO/CSI gắn từ OpenBao; không đặt token trong cấu hình.
      token-file: ${CORE_TOKEN_FILE:}
    # Giám sát tiến trình theo mẫu SCR-1506 (BS-01, DV-06-10).
    monitor:
      # Mã cell nơi dịch vụ chạy; trùng vt.platform.routing.cell-code khi bật định tuyến cell.
      cell-code: ${WF_CELL_CODE:${vt.platform.routing.cell-code:cell-shared-01}}
      # Số ngày làm việc tối đa được gia hạn một bước khi tenant chưa khai tham số
      # gia_han_toi_da_ngay_lam_viec trong wf_binding.params_json (suy luận).
      max-extension-working-days: ${WF_MAX_EXTENSION_DAYS:10}
      zone: ${WF_BUSINESS_ZONE:Asia/Ho_Chi_Minh}
    # Mẫu luồng nội bộ SCR-1505 (BS-01, DV-06-09).
    release:
      # Thứ tự cell triển khai cuốn chiếu, phân tách bằng dấu phẩy; không cố định mã cell trong mã nguồn.
      cells: ${WF_RELEASE_CELLS:}
      # Thời hạn chờ pipeline của repo mẫu luồng ký gói mẫu (cosign) trước khi thử lại bước chờ ký.
      signature-timeout: ${WF_RELEASE_SIGNATURE_TIMEOUT:PT30M}
      # Ngân sách câu SQL mỗi lần hoàn thành user task trên engine thử (BS-01: 20).
      sql-budget: ${WF_RELEASE_SQL_BUDGET:20}
      cell-retry:
        max-attempts: ${WF_RELEASE_CELL_ATTEMPTS:3}
        initial-backoff: ${WF_RELEASE_CELL_BACKOFF:PT30S}
        max-backoff: ${WF_RELEASE_CELL_MAX_BACKOFF:PT5M}
      window:
        zone: ${WF_RELEASE_ZONE:Asia/Ho_Chi_Minh}
        # Giờ cao điểm cấm triển khai (suy luận: giờ hành chính cao điểm sáng và chiều).
        peak-hours: ${WF_RELEASE_PEAK_HOURS:08:00-11:30,13:30-17:00}
        peak-on-weekends: ${WF_RELEASE_PEAK_WEEKENDS:false}
        # Ngày kết thúc kỳ (yyyy-MM-dd, phân tách bằng dấu phẩy); 3 ngày cuối kỳ cấm triển khai.
        period-ends: ${WF_RELEASE_PERIOD_ENDS:}
        freeze-days: ${WF_RELEASE_FREEZE_DAYS:3}
      test:
        queue-capacity: ${WF_RELEASE_TEST_QUEUE:8}
      local-cell:
        # Cell được đánh dấu sự cố của bộ chuyển engine cục bộ (chỉ dev, thử bù trừ).
        outage-cells: ${WF_RELEASE_LOCAL_OUTAGE:}
      code-host:
        # mailbox (mặc định, hộp thư lệnh wf_code_host_command) hoặc gitlab (API v4).
        type: ${WF_CODE_HOST_TYPE:mailbox}
        merge-request-base-url: ${WF_CODE_HOST_MR_BASE_URL:}
        api-base-url: ${WF_CODE_HOST_API_URL:}
        project: ${WF_CODE_HOST_PROJECT:}
        target-branch: ${WF_CODE_HOST_TARGET_BRANCH:main}
        # Tệp token do ESO/CSI gắn; không đặt token trong cấu hình.
        token-file: ${WF_CODE_HOST_TOKEN_FILE:}

# Khung saga (DV-06-05): outbox và khoá idempotency nằm trong schema flowable; worker chạy cùng bộ
# thực thi nền của Flowable.
okrkpi:
  opa:
    # OPA chạy cùng pod (ADR-21).
    base-url: ${OPA_BASE_URL:http://127.0.0.1:8181}
  paging:
    # Tệp khoá ký con trỏ do ESO/CSI gắn từ OpenBao; thiếu tệp thì sinh khoá tạm (chỉ đúng khi 1 bản sao).
    cursor-key-file: ${CURSOR_KEY_FILE:}
  outbox:
    schema: flowable
    registry:
      url: ${APICURIO_REGISTRY_URL:http://127.0.0.1:35081/apis/registry/v2}
  idempotency:
    schema: flowable
  # Token client credentials của mission-core không mang claim tenant: tenant đích của saga (chốt
  # kỳ, CORE-08-05) đọc từ header X-Tenant-Id, chỉ với tài khoản dịch vụ của các client này.
  tenant:
    delegating-clients: ${TENANT_DELEGATING_CLIENTS:mission-core}
  saga:
    enabled: ${SAGA_ENABLED:true}
    worker:
      enabled: ${WF_ASYNC_ENABLED:false}
      batch-size: ${SAGA_WORKER_BATCH:16}
      lock-duration: ${SAGA_WORKER_LOCK:5m}
      poll-interval: ${SAGA_WORKER_POLL:500ms}
      reconcile-interval: ${SAGA_WORKER_RECONCILE:5s}
