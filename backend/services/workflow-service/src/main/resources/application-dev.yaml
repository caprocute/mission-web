# NEN-019 · Hồ sơ môi trường phát triển cục bộ (infra/dev, kết nối qua SSH tunnel 127.0.0.1:35xxx).
# Không chứa mật khẩu hay khoá bí mật; mật khẩu truyền qua biến môi trường từ infra/dev/.env.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:35433}/${DB_NAME:mission}?currentSchema=${DB_SCHEMA:flowable}}
    username: ${DB_USER:svc_flowable}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

mission:
  service:
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:35092}
      apicurio-registry-url: ${APICURIO_REGISTRY_URL:http://127.0.0.1:35081/apis/registry/v2}
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:35379}
    security:
      keycloak-issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:35080/realms/mission}
      opa-url: ${OPA_URL:http://127.0.0.1:35181/v1/data/mission/authz}
      openbao-url: ${OPENBAO_URL:http://127.0.0.1:35820}
    observability:
      otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:35317}

# Saga chốt kỳ (DV-06-06): các bên tham gia chưa có API nội bộ nên giả lập ở môi trường phát
# triển để chạy thử SCR-0801; không dùng ở môi trường khác (wiki trang 14).
okrkpi:
  workflow:
    history-archive:
      # Dev không có kho phân tích nối sẵn: coi lịch sử đã chép (DV-06-11).
      mode: ${WF_HISTORY_ARCHIVE_MODE:GIA_LAP}
  saga:
    period-close:
      participants:
        mod-08: ${SAGA_PERIOD_CLOSE_MOD08:GIA_LAP}
        svc-07: ${SAGA_PERIOD_CLOSE_SVC07:GIA_LAP}
        svc-11: ${SAGA_PERIOD_CLOSE_SVC11:GIA_LAP}
        svc-10: ${SAGA_PERIOD_CLOSE_SVC10:GIA_LAP}
        svc-09: ${SAGA_PERIOD_CLOSE_SVC09:GIA_LAP}
