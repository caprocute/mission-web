# NEN-019 · TL-04 WI-20, WI-23 "Nguyên tắc cấu hình chung cho mọi service".
# - Luồng ảo Java 21 bật mặc định.
# - Tắt open-in-view và Flyway lúc chạy (migration chạy ở InitContainer vt-db-migration).
# - Hibernate chỉ validate lược đồ.
# - Cổng ứng dụng SERVER_PORT (8080), cổng quản trị MANAGEMENT_PORT (8081).
# - Tắt êm (graceful shutdown) với pha chờ tối đa 25s (nhỏ hơn terminationGracePeriodSeconds=40s trừ preStop=5s).
# - Mọi thông số kết nối và cổng dùng biến môi trường ${BIEN_MOI_TRUONG:gia_tri_mac_dinh}, mặc định
#   trỏ tới 127.0.0.1 qua dải cổng SSH tunnel 35xxx của infra/dev để dễ dàng thay đổi động qua .env.

spring:
  application:
    name: ${SERVICE_NAME:evidence-service}
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:true}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    schemas: evidence
    default-schema: evidence
    locations: classpath:db/migration/evidence
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:35080/realms/mission}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:25s}
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:35432}/${DB_NAME:mission}?currentSchema=${DB_SCHEMA:evidence}}
    username: ${DB_USER:svc_evidence}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: evidence-service-hikari
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:1000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1800000}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
      group:
        # Liveness chỉ kiểm tra nội tại JVM, tuyệt đối không phụ thuộc CSDL/Kafka/dịch vụ ngoài (TL-04 WI-20).
        liveness:
          include: livenessState,ping
        # Readiness kiểm tra pool CSDL và trạng thái sẵn sàng của kết nối hạ tầng (pool CSDL, producer Kafka).
        readiness:
          include: readinessState,db
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

mission:
  service:
    code: ${SERVICE_CODE:SVC-08}
    schema: ${DB_SCHEMA:evidence}
    kafka:
      bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:35092}
      apicurio-registry-url: ${APICURIO_REGISTRY_URL:http://127.0.0.1:35081/apis/registry/v2}
      producer-ready: ${KAFKA_PRODUCER_READY:true}
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:35379}
    security:
      keycloak-issuer-uri: ${KEYCLOAK_ISSUER_URI:http://127.0.0.1:35080/realms/mission}
      opa-url: ${OPA_URL:http://127.0.0.1:35181/v1/data/mission/authz}
      openbao-url: ${OPENBAO_URL:http://127.0.0.1:35820}
    observability:
      otlp-endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://127.0.0.1:35317}

# SVC-08 (DV-08-01): outbox, idempotency trong schema evidence; kho Ceph RGW qua S3 có Object Lock.
okrkpi:
  outbox:
    schema: evidence
    registry:
      url: ${APICURIO_REGISTRY_URL:http://127.0.0.1:35081/apis/registry/v2}
  idempotency:
    schema: evidence
  evidence:
    auth-enabled: ${EVIDENCE_AUTH_ENABLED:true}
    storage:
      endpoint: ${S3_ENDPOINT:http://127.0.0.1:35900}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
      # Mã cell trong tên bucket ev-<cell>-<tenant> (TL-03 SVC-08).
      cell: ${VT_CELL_ID:dev}
      # Thời hạn giữ mặc định của Object Lock chế độ compliance; lớp lưu giữ cụ thể ở chương 16 TL-03.
      lock-days: ${EVIDENCE_LOCK_DAYS:3650}
      # Địa chỉ RGW người dùng tới được (qua APISIX) để ký URL tải; mặc định trùng địa chỉ nội bộ.
      public-endpoint: ${S3_PUBLIC_ENDPOINT:${okrkpi.evidence.storage.endpoint}}
    # DV-08-02 · SEC-48: 50 MB mặc định (tenant cấu hình tối đa 200 MB), phần 8 MB, phiên sống 24 giờ.
    upload:
      max-file-bytes: ${EVIDENCE_MAX_FILE_BYTES:52428800}
      part-size: ${EVIDENCE_PART_SIZE:8388608}
      session-ttl: ${EVIDENCE_UPLOAD_TTL:PT24H}
      sweep-enabled: ${EVIDENCE_UPLOAD_SWEEP:true}
      sweep-interval: ${EVIDENCE_UPLOAD_SWEEP_INTERVAL:PT10M}
