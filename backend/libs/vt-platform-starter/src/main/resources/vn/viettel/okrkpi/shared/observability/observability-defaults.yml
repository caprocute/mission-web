# NEN-016 · ADR-12 · TL-01 "Chỉ số và SLI, SLO", "Log có cấu trúc", "Che dữ liệu nhạy cảm".
# Độ ưu tiên thấp nhất; service ghi đè có lý do.
management:
  server:
    # Cổng quản trị riêng, không lộ qua cổng API.
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    distribution:
      # Histogram độ trễ với các mốc 50, 100, 300, 800, 2.000 ms.
      slo:
        http.server.requests: 50ms,100ms,300ms,800ms,2000ms
spring:
  mvc:
    # Không ghi chi tiết yêu cầu (thân, header Authorization, cookie) vào nhật ký.
    log-request-details: false
  codec:
    log-request-details: false
okrkpi:
  observability:
    # Thuộc tính tài nguyên `cell` (cùng giá trị với OTEL_RESOURCE_ATTRIBUTES=cell=...).
    cell: ${OKRKPI_CELL:unknown}
