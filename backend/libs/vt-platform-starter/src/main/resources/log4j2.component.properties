# NEN-016 · TL-01 "Log có cấu trúc": hàng đợi AsyncLogger đầy thì bỏ dòng từ INFO trở xuống
# (giữ WARN, ERROR) thay vì chặn luồng nghiệp vụ, và đếm số dòng bị bỏ (CountingDiscardPolicy,
# metric log4j2.events.discarded). Tương đương -Dlog4j2.asyncQueueFullPolicy=Discard
# -Dlog4j2.discardThreshold=INFO của TL-01, có thêm bộ đếm.
log4j2.asyncQueueFullPolicy=vn.viettel.okrkpi.shared.observability.CountingDiscardPolicy
log4j2.discardThreshold=INFO
