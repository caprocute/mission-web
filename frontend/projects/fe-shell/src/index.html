<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <title>Mission · Giao nhiệm vụ theo OKR, KPI</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!-- WEB-052: tải sẵn hai tệp initFederation cần đầu tiên, không chờ main.js chạy xong -->
    <link rel="preload" href="federation.manifest.json" as="fetch" crossorigin="anonymous" />
    <link rel="preload" href="remoteEntry.json" as="fetch" crossorigin="anonymous" />
  </head>
  <body>
    <!-- WEB-014: nginx thay giá trị ngCspNonce bằng nonce của từng yêu cầu (CSP_NONCE của Angular) -->
    <!-- YC-PT-28: khung xương của khung trang trong lúc tải ứng dụng; Angular thay khi khởi động xong -->
    <vt-root ngCspNonce="__CSP_NONCE__">
      <div class="vt-boot" role="status" aria-busy="true">
        <span class="vt-boot__sr">Đang mở ứng dụng</span>
        <div class="vt-boot__top" aria-hidden="true">
          <span class="vt-boot__b vt-boot__logo"></span>
          <span class="vt-boot__b vt-boot__search"></span>
          <span class="vt-boot__b vt-boot__avatar"></span>
        </div>
        <div class="vt-boot__body" aria-hidden="true">
          <div class="vt-boot__nav">
            <span class="vt-boot__b"></span><span class="vt-boot__b"></span>
            <span class="vt-boot__b"></span><span class="vt-boot__b"></span>
            <span class="vt-boot__b"></span><span class="vt-boot__b"></span>
          </div>
          <div class="vt-boot__main">
            <span class="vt-boot__b vt-boot__h1"></span>
            <span class="vt-boot__b vt-boot__p"></span>
            <div class="vt-boot__cards">
              <span class="vt-boot__b"></span><span class="vt-boot__b"></span>
              <span class="vt-boot__b"></span><span class="vt-boot__b"></span>
            </div>
            <span class="vt-boot__b vt-boot__panel"></span>
          </div>
        </div>
      </div>
    </vt-root>
  </body>
</html>
