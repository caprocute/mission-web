<a class="skip-link" href="#main">Bỏ qua tới nội dung chính</a>
<header class="topbar">
  <button pButton type="button" icon="pi pi-bars" class="p-button-text menu-btn" aria-label="Mở menu" (click)="navOpen.set(!navOpen())"></button>
  <a routerLink="/" class="brand">
    @if (theme.logoUrl(); as logo) {
      <img [src]="logo" alt="" height="32" />
    }
    <span>Mission <small>Giao nhiệm vụ · OKR · KPI</small></span>
  </a>
  <span class="page-title">{{ pageTitle() }}</span>
  <span class="spacer"></span>
  <span class="cell-badge" pTooltip="Cell đang phục vụ">{{ cfg.cell }}</span>
  <button pButton type="button" class="p-button-text" [icon]="theme.mode() === 'elderly' ? 'pi pi-eye-slash' : 'pi pi-eye'"
    [label]="theme.mode() === 'elderly' ? 'Chữ thường' : 'Chữ lớn'" [attr.aria-pressed]="theme.mode() === 'elderly'"
    (click)="theme.toggleElderly()"></button>
  @if (session.user(); as u) {
    <p-avatar [label]="initials()" shape="circle" [attr.aria-label]="u.name" />
    <span class="user-name">{{ u.name }}</span>
    <button pButton type="button" icon="pi pi-sign-out" class="p-button-text" aria-label="Đăng xuất" (click)="session.logout()"></button>
  }
</header>
<div class="body">
  <nav class="sidenav" [class.open]="navOpen()" aria-label="Menu chính">
    @for (item of nav(); track item.link) {
      <a [routerLink]="item.link" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: item.link === '/' }" (click)="navOpen.set(false)">
        <i [class]="item.icon" aria-hidden="true"></i><span>{{ item.label }}</span>
      </a>
    }
  </nav>
  <main id="main" class="content" tabindex="-1">
    <router-outlet />
  </main>
</div>
