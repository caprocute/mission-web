# Tệp hợp đồng MẪU của mission-core (WEB-007), viết tay khi chưa có tệp OpenAPI 3.1 thật
# do springdoc sinh. Khi mission-core phát hành hợp đồng, thay tệp này bằng bản thật rồi chạy
# `npm run api:gen`. Phạm vi mẫu: MOD-02 `/api/v1/tasks` (QT-05, QT-06; SCR-0503, SCR-0601),
# `/api/v1/org/me` (QT-00, WEB-006) và `/api/v1/jobs/{id}` (tác vụ dài, baseline mục 13; TL-01 Phụ lục C).
# Lưu ý: kiểu nhiệm vụ trong mã (`models/task.ts`) vẫn viết tay vì WEB-031 mở rộng nhiều trường
# hơn bản mẫu này; khi có hợp đồng thật thì chuyển sang bí danh kiểu sinh như ProblemDetails, Job.
# Đường dẫn bám mã hiện tại; các điểm lệch với TL (tasks/mine, POST progress) xem wiki/06.
openapi: 3.1.0
info:
  title: mission-core (mẫu cho frontend)
  version: 0.1.0-mau
servers:
  - url: /api/v1
paths:
  /tasks/mine:
    get:
      operationId: listMyTasks
      summary: Việc của tôi (SCR-0503)
      parameters:
        - {
            name: limit,
            in: query,
            schema: { type: integer, minimum: 1, maximum: 200, default: 50 },
          }
        - { name: cursor, in: query, schema: { type: string } }
        - name: status
          in: query
          description: Danh sách trạng thái, phân tách bằng dấu phẩy
          schema: { type: string }
        - { name: overdue, in: query, schema: { type: boolean } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Một trang kết quả
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSummaryPage' }
        default: { $ref: '#/components/responses/Problem' }
  /tasks/{id}:
    get:
      operationId: getTask
      summary: Chi tiết nhiệm vụ (SCR-0601)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Nhiệm vụ
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        default: { $ref: '#/components/responses/Problem' }
  /tasks/{id}/progress:
    post:
      operationId: updateTaskProgress
      summary: Cập nhật tiến độ (QT-06)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProgressUpdate' }
      responses:
        '200':
          description: Nhiệm vụ sau khi cập nhật
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        default: { $ref: '#/components/responses/Problem' }
  /org/me:
    get:
      operationId: getMyOrgProfile
      summary: Người dùng hiện tại và các phân công còn hiệu lực (QT-00 bước 7, SCR-0001)
      responses:
        '200':
          description: Hồ sơ và phân công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyOrgProfile' }
        default: { $ref: '#/components/responses/Problem' }
  /org/me/context:
    put:
      operationId: setMyContext
      summary: Ghi ngữ cảnh phiên (phân công đang làm việc); client làm mới token để nhận claim org
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignmentId]
              properties:
                assignmentId: { type: string }
      responses:
        '200':
          description: Ngữ cảnh đã ghi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkContext' }
        default: { $ref: '#/components/responses/Problem' }
  /jobs/{id}:
    get:
      operationId: getJob
      summary: Trạng thái tác vụ dài (người khởi tạo)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Trạng thái hiện tại
          headers:
            Retry-After:
              description: Số giây nên chờ trước lần thăm dò kế tiếp
              schema: { type: integer }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        default: { $ref: '#/components/responses/Problem' }
components:
  headers:
    ETag:
      description: row_version của đối tượng, gửi lại trong If-Match
      schema: { type: string }
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Khoá duy nhất cho một ý định ghi (TL-01 ghi UUIDv7)
      schema: { type: string }
  responses:
    Problem:
      description: Lỗi theo RFC 9457
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    TaskStatus:
      description: Trạng thái chuẩn của task.task.status (baseline mục 9.1)
      type: string
      enum: [NHAP, DA_GIAO, DANG_THUC_HIEN, CHO_NGHIEM_THU, HOAN_THANH, TAM_DUNG, HUY]
    AssigneeRole:
      type: string
      enum: [CHU_TRI, PHOI_HOP]
    TaskSummary:
      type: object
      required:
        [
          id,
          code,
          title,
          status,
          overdue,
          dueDate,
          progress,
          role,
          assignerName,
          unitName,
          periodId,
          rowVersion,
        ]
      properties:
        id: { type: string }
        code: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        overdue: { type: boolean }
        dueDate: { type: string, format: date }
        progress: { type: integer, minimum: 0, maximum: 100 }
        role: { $ref: '#/components/schemas/AssigneeRole' }
        assignerName: { type: string }
        unitName: { type: string }
        periodId: { type: string }
        rowVersion:
          type: integer
          description: ETag = row_version, gửi lại trong If-Match khi cập nhật
    TaskDetail:
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          required: [description, coAssignees, progressLog, blockers]
          properties:
            description: { type: string }
            sourceDoc:
              type: object
              required: [number, title]
              properties:
                number: { type: string }
                title: { type: string }
            coAssignees:
              type: array
              items:
                type: object
                required: [personId, name, role]
                properties:
                  personId: { type: string }
                  name: { type: string }
                  role: { $ref: '#/components/schemas/AssigneeRole' }
            progressLog:
              type: array
              items:
                type: object
                required: [at, percent, note, by]
                properties:
                  at: { type: string, format: date-time }
                  percent: { type: integer }
                  note: { type: string }
                  by: { type: string }
            blockers:
              type: array
              items:
                type: object
                required: [id, content, resolved]
                properties:
                  id: { type: string }
                  content: { type: string }
                  resolved: { type: boolean }
    TaskSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskSummary' }
        nextCursor: { type: [string, 'null'] }
    ProgressUpdate:
      type: object
      required: [percent, note]
      properties:
        percent: { type: integer, minimum: 0, maximum: 100 }
        note: { type: string }
        blocker: { type: string }
    JobStatus:
      description: >-
        Trạng thái tác vụ dài. Giả định của WEB-007 khi chưa có hợp đồng thật, dùng lại
        giá trị đã có trong TL-03 (CHO, DANG_CHAY, HOAN_TAT, THAT_BAI, DA_HUY).
      type: string
      enum: [CHO, DANG_CHAY, HOAN_TAT, THAT_BAI, DA_HUY]
    Job:
      type: object
      required: [id, type, status]
      properties:
        id: { type: string }
        type: { type: string, description: 'Loại tác vụ, ví dụ PERIOD_LOCK, ESIGN_BATCH, EXPORT' }
        status: { $ref: '#/components/schemas/JobStatus' }
        progress: { type: integer, minimum: 0, maximum: 100 }
        message: { type: string, description: Mô tả bước đang chạy, tiếng Việt }
        resultLocation: { type: string, description: Đường dẫn kết quả khi HOAN_TAT }
        problem: { $ref: '#/components/schemas/ProblemDetails' }
        updatedAt: { type: string, format: date-time }
    AssignmentKind:
      description: Loại phân công (TL-03 org.assignment.kind)
      type: string
      enum: [CHINH, KIEM_NHIEM, DIEU_DONG, BIET_PHAI, TAM_GIU]
    Assignment:
      description: Phân công còn hiệu lực (org_replica.assignment_v) kèm vai trò (config.role_binding)
      type: object
      required: [id, orgUnitId, orgUnitName, jobTitleName, kind, branch, roles, validFrom]
      properties:
        id: { type: string }
        orgUnitId: { type: string }
        orgUnitName: { type: string }
        jobTitleName: { type: string }
        kind: { $ref: '#/components/schemas/AssignmentKind' }
        branch: { type: string, enum: [DANG, CHINH_QUYEN] }
        roles:
          type: array
          items: { type: string }
        validFrom: { type: string, format: date }
        validTo: { type: [string, 'null'], format: date }
    MyOrgProfile:
      type: object
      required: [personId, fullName, assignments]
      properties:
        personId: { type: string }
        fullName: { type: string }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/Assignment' }
        lastAssignmentId: { type: [string, 'null'], description: Phân công dùng lần trước (chọn sẵn) }
    WorkContext:
      type: object
      required: [assignmentId, orgUnitId, roles]
      properties:
        assignmentId: { type: string }
        orgUnitId: { type: string }
        roles:
          type: array
          items: { type: string }
    FieldError:
      type: object
      required: [field, message]
      properties:
        field: { type: string }
        message: { type: string }
    ProblemDetails:
      description: RFC 9457, mở rộng code, errors, traceId theo TL-01
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          { type: string, description: 'Dạng <MODULE>-<HTTP>-<TÊN>, ví dụ TASK-409-PERIOD-LOCKED' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }
        traceId: { type: string }
