# Bộ ca mẫu GIẢ LẬP cho gói khoi-dang/quy-dinh-moi (DL-03, YC-PT-14).
# Định dạng theo TL-01 (bo_ca_mau: ca[].id, mo_ta, dau_vao, mong_doi), thêm legal_ref, source, loai.
# Dữ liệu đều là giả lập, không lấy từ hồ sơ thật (SEC-52). Kỳ vọng do người soạn tính tay từ quy tắc,
# không sinh từ chính bộ quy tắc; chưa được nghiệp vụ ký (trang_thai_ky: NHAP, BR-15-08).
# Chạy: python -I data/golden/chay_ca_mau.py data/policy-pack
bo_ca_mau: bo-ca-mau-gia-lap-quy-dinh-moi
goi: khoi-dang/quy-dinh-moi
gia_lap: true
nguoi_ky: null
yeu_cau_dat: 1.0
trang_thai_ky: NHAP

# Giá trị mặc định ghép vào từng ca (ca ghi đè khoá nào thì dùng khoá đó)
mac_dinh:
  nhiem_vu: {ke_hoach: 10, so_luong_duyet: 10, muc_chat_luong: 1.0, so_lan_chinh_sua: 0,
             ngay_lam_viec_cham_chu_quan: 0, ngay_lich_cham_chu_quan: 0, diem_chuan: 10, khong_hoan_thanh_chu_quan: false}
  QUY: {ty_le_O: 1.0, ty_le_dap_ung_tieu_chi_chung: 1.0, giai_phap_dot_pha_da_kiem_chung: true, loai_tru: false,
        la_nguoi_dung_dau: false, tap_the_dat_05_chi_tieu: true, tap_the_dat_tat_ca_O: true, ty_le_don_vi_khtnv: 0.0,
        giu_chuc_vu: false, xep_loai_nha_nuoc: ""}
  NAM: {diem_toan_bo_nhiem_vu_nam: 0, ty_le_O_nam: 1.0, ty_le_vuot_nam: 0.35, giai_phap_dot_pha_da_kiem_chung: true,
        ty_le_dap_ung_tieu_chi_chung: 1.0, loai_tru: false, truot_then_chot_chu_quan_nam: false, khong_xet_htxsnv_nam: false}

