# Khung tham số DC-02 của hồ sơ TWĐ (DL-16; BS-03 DC-02, bảng policy.param_constraint). GIẢ LẬP theo YC-PT-14.
# Nguồn: UEB-BTCTW-QTCV-02 v1.2 mục 3.7, 3.8 (±20% điểm chuẩn), 13.34 (ngưỡng phân bố mức khó), R43; BS-03 DC-02.
# Mỗi dòng là một ParamConstraint: cấp dưới (khối → tỉnh → đơn vị) chỉ chỉnh được tham số trong khung này;
# tighten_direction TANG nghĩa là chỉ được đặt giá trị lớn hơn hoặc bằng giá trị cấp trên ("chỉ được siết").
# Khoá tham số trỏ vào params của gói twd/diem-cong-viec (tham_so.*), của bộ twd/diem-nghen (diem_nghen.*) hoặc
# thuộc tính dòng danh mục (danh_muc.*).
metadata:
  id: twd/ban-to-chuc-ueb/khung-twd
  version: 0.1.0
  gia_lap: true
  ghi_chu_gia_lap: "Thí điểm – dùng để đối chiếu; khung là giá trị thí điểm của bộ cấu hình mẫu."
items:
