# Policy Pack luồng Nhà nước: đánh giá, xếp loại cán bộ, công chức, viên chức theo NĐ 335/2025.
# BẢN NHÁP do agent soạn (DL-01b, DL-02, DL-04) để nghiệp vụ duyệt; chưa phê duyệt, chưa ký, chưa phát hành.
# Định danh khoi-chinh-quyen/nd335 lấy theo TL-01 (ví dụ wf_binding "khoi-chinh-quyen/nd335@1.4",
# UI Pack "requires.policyPack: khoi-chinh-quyen/nd335@>=1.2.0 <2.0.0"); xem CHANGELOG.md.
# Cơ cấu 30 điểm tiêu chí chung + 70 điểm kết quả nhiệm vụ; ngưỡng 90/70/50 (BR-09-11, BR-15-05).
# Kết quả lưu snapshot riêng, không ghi đè snapshot luồng Đảng (BR-09-11).
apiVersion: policy.okrkpi.vn/v1
kind: PolicyPack
metadata:
  id: khoi-chinh-quyen/nd335
  version: 1.4.0                     # theo TL-01 (ví dụ wf_binding @1.4); TL-02b SCR-0901 nhắc v1.3 đang áp dụng
  trang_thai: NHAP
  luong: NHA_NUOC
  ten: Bộ quy định đánh giá cán bộ, công chức, viên chức theo Nghị định số 335/2025/NĐ-CP
  ap_dung_cho:
    tenant_tags: [khoi-chinh-quyen]
    doi_tuong: [CAN_BO, CONG_CHUC, VIEN_CHUC]
  hieu_luc:
    tu_ky: 2027-Q1
    den_ky: null
  can_cu_phap_ly:                    # theo TL-02a mục "Căn cứ"; số hiệu, điều khoản cần đối chiếu bản gốc
    - "Nghị định số 335/2025/NĐ-CP về đánh giá, xếp loại chất lượng cán bộ, công chức, viên chức"
    - "Nghị định số 233/2026/NĐ-CP về đánh giá viên chức trong đơn vị sự nghiệp công lập"
    - "Luật Cán bộ, công chức (sửa đổi) năm 2025"
  phe_duyet:
    ky_so: []
    nguoi_soan: null
    nguoi_duyet: null
  ghi_chu_ban_nhap: "Bản nháp chờ cơ quan có thẩm quyền xác nhận cơ cấu điểm, cách tính tiêu chí chung và căn cứ."
  gia_lap: true                      # YC-PT-14 (quyết định 20/10/2026): bản giả lập dùng để phát triển và kiểm thử
  ghi_chu_gia_lap: "Bản giả lập soạn theo Nghị định 335/2025/NĐ-CP, chưa phải bản chính thức. Khi cơ quan có thẩm quyền ban hành nội dung chính thức, phát hành phiên bản mới của gói này với gia_lap: false; không sửa mã."

types:
  NhiemVu:
    ma:                          {type: string, source: task.aggregate.scored_tasks.code}
    nhom:                        {type: string, source: task.aggregate.scored_tasks.task_group, enum: [THUONG_XUYEN, THEN_CHOT]}
    ke_hoach:                    {type: int,    source: task.aggregate.planned_count, min: 0}
    so_luong_duyet:              {type: int,    source: task.aggregate.approved_count, min: 0}
    muc_chat_luong:              {type: double, source: product.aggregate.quality_avg, enum_scale: [1, 0.75, 0.5, 0.25, 0]}
    so_lan_chinh_sua:            {type: int,    source: product.aggregate.revision_count, min: 0}
    ngay_lam_viec_cham_chu_quan: {type: int,    source: task.aggregate.late_workdays, min: 0}
    ngay_lich_cham_chu_quan:     {type: int,    source: task.aggregate.late_calendar_days, min: 0}
    diem_chuan:                  {type: double, source: task.aggregate.catalog_base_score, min: 0, max: 100}
    khong_hoan_thanh_chu_quan:   {type: bool,   source: task.aggregate.key_missed_subjective}
  KetQuaNhiemVu:
    ma: {type: string}
    nhom: {type: string}
    diem_chuan: {type: double}
    kpi_nhiem_vu: {type: double}
    vuot_muc_tieu: {type: bool}
  Nhom:
    ma: {type: string}
    diem_toi_da: {type: int}
    nhom_nhiem_vu: {type: "list<string>"}
  KetQuaNhomDauVao:
    ma: {type: string}
    diem_toi_da: {type: int}
    ds_kpi: {type: "list<double>"}
  KetQuaNhom:
    ma: {type: string}
    diem_toi_da: {type: int}
    kpi_nhom: {type: double}
    diem_nhom: {type: double}

inputs:
  nhiem_vu:                     {type: "list<NhiemVu>", source: task.aggregate.scored_tasks}
  ty_le_dap_ung_tieu_chi_chung: {type: double, source: appraisal.aggregate.general_criteria_ratio, min: 0, max: 1}

ngu_canh:
  nv:               {type: NhiemVu,               pham_vi: nhiem_vu}
  g:                {type: KetQuaNhomDauVao,      pham_vi: nhom}
  ket_qua_nhiem_vu: {type: "list<KetQuaNhiemVu>", pham_vi: [ho_so]}
  ket_qua_nhom:     {type: "list<KetQuaNhom>",    pham_vi: [ho_so]}

params:
  tru_tien_do:           {type: double, mac_dinh: 0.05, mien: {min: 0.00, max: 0.20}, chu_so: 2, overridable: false, legal_ref: "NĐ 335/2025; PL 3 mục 3"}
  loai_ngay:             {type: string, mac_dinh: NGAY_LAM_VIEC, mien: {enum: [NGAY_LAM_VIEC, NGAY_LICH]}, overridable: false, legal_ref: "PL A4; BR-15-03"}
  cach_tinh_chat_luong:  {type: string, mac_dinh: NAM_MUC_PL3, mien: {enum: [NAM_MUC_PL3, TRU_25_MOI_LAN]}, overridable: false, legal_ref: "PL A4; BR-15-02"}
  tru_moi_lan_chinh_sua: {type: double, mac_dinh: 0.25, mien: {min: 0.00, max: 1.00}, overridable: false, legal_ref: "Bảng chấm điểm; BR-15-02"}
  lam_tron:              {type: map, mac_dinh: {digits: 1, mode: NUA_LEN}, overridable: false, legal_ref: "BR-09-03; SCR-1501"}
  diem_toi_da_tieu_chi_chung: {type: int, mac_dinh: 30, mien: {min: 30, max: 30}, overridable: false, legal_ref: "NĐ 335/2025; PL A5; BR-09-11; BR-15-05"}
  nhom:
    type: "list<Nhom>"
    mac_dinh:
      - {ma: KET_QUA_NHIEM_VU, diem_toi_da: 70, nhom_nhiem_vu: [THUONG_XUYEN, THEN_CHOT]}   # một nhóm 70 điểm (suy luận)
    rang_buoc: {tong_diem_toi_da: 70, cong_tieu_chi_chung: 100}   # BR-15-05: 30 và 70
    overridable: true
    legal_ref: "NĐ 335/2025; PL A5; BR-09-11; BR-15-05"
  htxs.cach_dem_vuot:    {type: string, mac_dinh: THEO_SO_NHIEM_VU, mien: {enum: [THEO_SO_NHIEM_VU, THEO_DIEM]}, overridable: false, legal_ref: "PL A3; BR-09-04"}
  phan_bo.toi_da_htxsnv: {type: double, mac_dinh: 0.20, mien: {min: 0.00, max: 1.00}, overridable: true, legal_ref: "BR-09-17 (áp cho luồng Nhà nước là suy luận)"}
  tham_dinh.so_lan_tra_lai_toi_da: {type: int, mac_dinh: 2, mien: {min: 0, max: 5}, overridable: true, legal_ref: "QT-09"}
  # --- vận hành (DL-04); cùng giá trị mặc định với gói luồng Đảng ---
  plan_approval_deadline_rule: {type: string, mac_dinh: NGAY_LAM_VIEC_CUOI_TUAN_LICH_THU_2, mien: {enum: [NGAY_LAM_VIEC_CUOI_TUAN_LICH_THU_2]}, overridable: false, legal_ref: "TL-02a QT-04"}
  plan_max_adjustments_per_quarter: {type: int, mac_dinh: 2, mien: {min: 0, max: 6}, overridable: true, legal_ref: "QT-04 bước 9"}
  extension_max_per_task_quarter:   {type: int, mac_dinh: 2, mien: {min: 0, max: 6}, overridable: true, legal_ref: "BR-06-06"}
  extension_escalation_days:        {type: int, mac_dinh: 10, mien: {min: 1, max: 30}, don_vi: NGAY_LAM_VIEC, overridable: true, legal_ref: "BR-06-06"}
  acceptance_sla_days:              {type: int, mac_dinh: 5, mien: {min: 1, max: 15}, don_vi: NGAY_LAM_VIEC, overridable: true, legal_ref: "BR-07-12"}
  kr_risk_low_streak:               {type: int, mac_dinh: 2, mien: {min: 1, max: 6}, overridable: true, legal_ref: "QT-03"}
  similarity_threshold:             {type: double, mac_dinh: 0.7, mien: {min: 0.5, max: 0.95}, overridable: false, legal_ref: "BR-05-06"}
  mfa_stepup_window_minutes:        {type: int, mac_dinh: 15, mien: {min: 1, max: 15}, overridable: false, legal_ref: "BR-07-11"}
  khieu_nai.thoi_han:               {type: int, mac_dinh: 10, mien: {min: 1, max: 30}, don_vi: NGAY_LAM_VIEC, overridable: false, legal_ref: "BR-12-01"}
  difficulty_coefficients: {type: "map<int,double>", mac_dinh: {4: 1.2}, gia_dinh: true, overridable: false, legal_ref: "TL-02a QT-04 (giả định chờ cơ quan tổ chức xác nhận)"}

definitions:
  nhiem_vu:
    kpi_A:
      expression: "nv.ke_hoach == 0 ? 1.0 : math.least(double(nv.so_luong_duyet) / double(nv.ke_hoach), 1.0)"
      result_type: DECIMAL
      legal_ref: "NĐ 335/2025; PL 3 mục 1"
      eval_order: 10
      overridable: false
    kpi_B:
      expression: "tham_so.cach_tinh_chat_luong == 'TRU_25_MOI_LAN' ? math.greatest(0.0, 1.0 - tham_so.tru_moi_lan_chinh_sua * double(nv.so_lan_chinh_sua)) : nv.muc_chat_luong"
      result_type: DECIMAL
      legal_ref: "NĐ 335/2025; PL 3 mục 2"
      eval_order: 20
      overridable: false
    ngay_cham:
      expression: "tham_so.loai_ngay == 'NGAY_LICH' ? nv.ngay_lich_cham_chu_quan : nv.ngay_lam_viec_cham_chu_quan"
      result_type: DECIMAL
      legal_ref: "PL 3 mục 3; BR-15-03"
      eval_order: 30
      overridable: false
    kpi_C:
      expression: "math.greatest(0.0, 1.0 - tham_so.tru_tien_do * double(ngay_cham))"
      result_type: DECIMAL
      legal_ref: "NĐ 335/2025; PL 3 mục 3"
      eval_order: 40
      overridable: false
    kpi_nhiem_vu:
      expression: "(kpi_A + kpi_B + kpi_C) / 3.0"
      result_type: DECIMAL
      legal_ref: "NĐ 335/2025; PL 3"
      eval_order: 50
      overridable: false
    vuot_muc_tieu:
      expression: "nv.ke_hoach > 0 && nv.so_luong_duyet > nv.ke_hoach"
      result_type: BOOLEAN
      legal_ref: "PL A3; BR-09-04"
      eval_order: 60
      overridable: false
  nhom:
    kpi_nhom:
      expression: "g.ds_kpi.size() == 0 ? 0.0 : sum(g.ds_kpi) / double(g.ds_kpi.size())"
      result_type: DECIMAL
      legal_ref: "PL A5; BR-09-03"
      eval_order: 70
      overridable: false
    diem_nhom:
      expression: "kpi_nhom * double(g.diem_toi_da)"
      result_type: DECIMAL
      legal_ref: "PL A5; BR-09-11"
      eval_order: 80
      overridable: false
  ho_so:
    diem_ket_qua:
      expression: "sum(ket_qua_nhom.map(k, k.diem_nhom))"
      result_type: DECIMAL
      legal_ref: "NĐ 335/2025; BR-09-11"
      eval_order: 90
      overridable: false
    diem_tieu_chi_chung:
      expression: "double(tham_so.diem_toi_da_tieu_chi_chung) * math.least(math.greatest(ty_le_dap_ung_tieu_chi_chung, 0.0), 1.0)"
      result_type: DECIMAL
      legal_ref: "NĐ 335/2025; PL A5; BR-09-11 (cách quy đổi là suy luận)"
      eval_order: 100
      overridable: false
    diem:
      expression: "diem_tieu_chi_chung + diem_ket_qua"
      result_type: DECIMAL
      rounding: {digits: 1, mode: NUA_LEN}
      legal_ref: "NĐ 335/2025; BR-09-11; BR-15-05"
      eval_order: 110
      overridable: false
    ty_le_vuot:
      expression: >-
        ket_qua_nhiem_vu.size() == 0 ? 0.0 :
        (tham_so.htxs.cach_dem_vuot == 'THEO_DIEM'
          ? (sum(ket_qua_nhiem_vu.map(k, k.diem_chuan)) == 0.0 ? 0.0
             : sum(ket_qua_nhiem_vu.filter(k, k.vuot_muc_tieu).map(k, k.diem_chuan)) / sum(ket_qua_nhiem_vu.map(k, k.diem_chuan)))
          : double(ket_qua_nhiem_vu.filter(k, k.vuot_muc_tieu).size()) / double(ket_qua_nhiem_vu.size()))
      result_type: DECIMAL
      rounding: {digits: 4, mode: NUA_LEN}
      legal_ref: "PL A3; BR-09-04 (ghi nhận trong snapshot, không dùng trong bảng xếp loại luồng Nhà nước)"
      eval_order: 120
      overridable: false

rounding:
  diem: {digits: 1, mode: NUA_LEN}

classification:
  thu_tu: [HTXSNV, HTTNV, HTNV, KHTNV]
  bang_quyet_dinh:
    - {table_key: xep_loai, dmn: dmn/xep-loai-nha-nuoc.dmn, hit_policy: FIRST, legal_ref: "NĐ 335/2025; PL A5; BR-09-11"}
  nhan_hien_thi:
    muc_xep_loai:
      HTXSNV: Hoàn thành xuất sắc nhiệm vụ
      HTTNV: Hoàn thành tốt nhiệm vụ
      HTNV: Hoàn thành nhiệm vụ
      KHTNV: Không hoàn thành nhiệm vụ
  mau_cau: {}                        # mỗi dòng DMN tự mang câu giải thích; luồng Nhà nước không có hạ mức liền kề

quotas:
  HTXSNV:
    ty_le_toi_da: 0.20
    tham_so: phan_bo.toi_da_htxsnv
    pham_vi: DON_VI_CAP_TREN
    hanh_dong: DANH_DAU_VUOT
    legal_ref: "BR-09-17 (suy luận áp cho luồng Nhà nước)"

ket_qua:
  snapshot_rieng: true               # BR-09-11: một snapshot cho mỗi luồng, mỗi snapshot một policy_version
  luu: [diem_tieu_chi_chung, diem_ket_qua, diem, ty_le_vuot, xep_loai]

task_lifecycle:
  tham_chieu: "khoi-dang/quy-dinh-moi@2.1.0#task_lifecycle"   # dùng chung bảng chuyển trạng thái nhiệm vụ (DL-04)
workflow_bindings:
  thu_muc: workflow-bindings/

tests:
  bo_ca_mau: tests/bo-ca-mau-gia-lap.yaml   # DL-03, bản giả lập chưa ký
  yeu_cau_dat: 1.0
templates:
  thu_muc: templates/                # DL-05
