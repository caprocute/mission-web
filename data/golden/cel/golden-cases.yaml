  # NHÓM 6: HÀM SỐ HỌC CỦA GÓI MẪU NĐ 335 (math, double(), chia số thực, chia số nguyên)
  # Phát hiện ở DV-07-03: công thức kpi_A, kpi_B, kpi_C, kpi_nhom phải chạy như nhau ở hai engine.
  # ============================================================================
  - id: G-CEL-068
    category: scoring_formula
    description: kpi_A tỷ lệ việc được duyệt so với kế hoạch, chặn trên bằng math.least
    expression: "nv.ke_hoach == 0 ? 1.0 : math.least(double(nv.so_luong_duyet) / double(nv.ke_hoach), 1.0)"
    returnType: DOUBLE
    variableTypes:
      nv: MAP_STRING_DYN
    inputs:
      nv:
        so_luong_duyet: 3
        ke_hoach: 4
    expected: 0.75

  - id: G-CEL-069
    category: scoring_formula
    description: kpi_A vượt kế hoạch thì lấy 1.0 (math.least)
    expression: "nv.ke_hoach == 0 ? 1.0 : math.least(double(nv.so_luong_duyet) / double(nv.ke_hoach), 1.0)"
    returnType: DOUBLE
    variableTypes:
      nv: MAP_STRING_DYN
    inputs:
      nv:
        so_luong_duyet: 6
        ke_hoach: 4
    expected: 1.0

  - id: G-CEL-070
    category: scoring_formula
    description: kpi_B trừ 25% mỗi lần chỉnh sửa, chặn dưới bằng math.greatest
    expression: "tham_so.cach_tinh_chat_luong == 'TRU_25_MOI_LAN' ? math.greatest(0.0, 1.0 - tham_so.tru_moi_lan_chinh_sua * double(so_lan_chinh_sua)) : 1.0"
    returnType: DOUBLE
    variableTypes:
      tham_so: MAP_STRING_DYN
      so_lan_chinh_sua: INT
    inputs:
      tham_so:
        cach_tinh_chat_luong: "TRU_25_MOI_LAN"
        tru_moi_lan_chinh_sua: 0.25
      so_lan_chinh_sua: 2
    expected: 0.5

  - id: G-CEL-071
    category: scoring_formula
    description: kpi_C trừ tiến độ theo ngày chậm, không âm (math.greatest)
    expression: "math.greatest(0.0, 1.0 - tru_tien_do * double(ngay_cham))"
