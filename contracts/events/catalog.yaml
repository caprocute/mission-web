    key: tenant:tenantId
    outbox: registry.outbox_event
    classification: C1
    producer: SVC-03
    consumers: [SVC-01]
    partitions: 3
    retention: compact
    note: Kafka toàn cục, MirrorMaker 2 sao xuống mọi cell; phục vụ bảng định tuyến tại cổng (TL-01/TL-03)
    schema: avro/registry/TenantChanged.avsc
    artifactId: registry.tenant.changed.v1-value

  - topic: org.bootstrap.v1
