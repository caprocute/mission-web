    key: tenant:entityId
    outbox: null
    classification: C1
    producer: SVC-04
    consumers: [org_replica, SVC-02, SVC-15]
    partitions: 12
    retention: 7d
    note: Lệnh org-republish phát trạng thái hiện hành của mọi thực thể tổ chức của một tenant (TL-03)
    schema: avro/org/OrgBootstrap.avsc
    artifactId: org.bootstrap.v1-value
    references:
      - vn.vtokr.org.v1.DonViDaThayDoi
      - vn.vtokr.org.v1.PhanCongDaThayDoi
      - vn.vtokr.org.v1.NhanSuDaThayDoi

  - topic: period.drain.marker
    name: DrainMarker
    key: tenant:periodId
    outbox: "*.outbox_event"
    classification: C0
    producer: "*"
    consumers: [SVC-06]
    partitions: 24
    retention: 7d
    note: Dòng outbox đặc biệt của bước 2 saga chốt kỳ (TL-03 "Saga điều phối chốt kỳ")
    schema: avro/period/DrainMarker.avsc
    artifactId: period.drain.marker-value

  - topic: agg.province.metric.v1
    name: AggregateMetric
    key: tenant:provinceUnitRef
    outbox: null
    classification: C0
    producer: SVC-15
    consumers: [analytics-national]
    partitions: 6
    retention: 30d
    note: Topic chuẩn đại diện họ agg.* đẩy số liệu tổng hợp vô danh C0 (qua ngưỡng k-anonymity k >= 5) từ cấp tỉnh về Trung ương (TL-01, TL-04 L768)
    schema: avro/agg/AggregateMetric.avsc
    artifactId: agg.province.metric.v1-value

# Quy ước họ topic kỹ thuật sinh theo mẫu (TL-01, TL-03, TL-04 L767–768):
technicalTopicFamilies:
  - pattern: "cdc.<db>.<schema>.<table>"
    producer: Debezium Kafka Connect
    consumers: [SVC-14, SVC-15]
    key: primaryKey
    partitions: 6
    retention: 3d
    classification: C1
    schemaConvention: "Debezium Envelope JSON/Avro chuẩn (before, after, source, op, ts_ms) tự sinh từ DDL bảng nguồn"
  - pattern: "<topic>.retry.<consumer>"
    producer: "<consumer>"
    consumers: ["<consumer>"]
    key: "giữ nguyên khoá của <topic>"
    partitions: 6
    retention: 7d
    classification: "giữ nguyên phân loại của <topic>"
    schemaConvention: "Giữ nguyên lược đồ Avro value của <topic> gốc (<topic>-value) và bộ header CloudEvents + đếm số lần thử lại"
  - pattern: "<topic>.dlq.<consumer>"
    producer: "<consumer>"
    consumers: [dlq-replayer, ops-alert]
    key: "giữ nguyên khoá của <topic>"
    partitions: 3
    retention: 30d
    classification: "giữ nguyên phân loại của <topic>"
    schemaConvention: "Giữ nguyên lược đồ Avro value của <topic> gốc (<topic>-value), đính kèm header lỗi đã lọc C2 (x-dlq-error-code, x-dlq-failed-at, x-dlq-consumer-group)"
  - pattern: "<topic>.replay.<consumer>"
    producer: dlq-replayer
    consumers: ["<consumer>"]
    key: "giữ nguyên khoá của <topic>"
    partitions: 6
    retention: 7d
    classification: "giữ nguyên phân loại của <topic>"
    schemaConvention: "Giữ nguyên lược đồ Avro value của <topic> gốc (<topic>-value), đính kèm header ce_replayed=true"
  - pattern: "agg.*"
    producer: SVC-15
    consumers: [analytics-national]
    key: tenant:provinceUnitRef
    partitions: 6
    retention: 30d
    classification: C0
    schemaConvention: "Dùng chung lược đồ khung avro/agg/AggregateMetric.avsc (vn.vtokr.agg.v1.AggregateMetric)"
