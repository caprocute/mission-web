# Topic kỹ thuật (TL-03 "Danh mục lược đồ", TL-01 "Quy ước topic", TL-04 L760–768): không thuộc
# danh mục EVT, không được ứng dụng nghiệp vụ tiêu thụ trực tiếp.
# NEN-021 chốt tên chuẩn (bảng giải quyết lệch tên ở wiki/18 và wiki/14), số phân vùng, thời gian
# giữ và lược đồ Avro cho từng topic kỹ thuật cũng như quy ước các họ topic mẫu.
technicalTopics:
  - topic: sys.ledger.append.v1
    name: LedgerAppend
    key: tenant:partition
    outbox: null
    classification: C1
    producer: SVC-09
    consumers: [SVC-09]
    partitions: 24
    retention: 30d
    note: Bộ thu ledger-ingester của SVC-09 chuyển tiếp từ topic nghiệp vụ; khoá theo phân vùng chuỗi (TL-03 chương 8, TL-04 L763)
    schema: avro/sys/LedgerAppend.avsc
    artifactId: sys.ledger.append.v1-value

  - topic: sys.audit.v1
    name: AuditEvent
    key: tenant:objectId
    outbox: "*.outbox_event"
    classification: C1
    producer: "*"
    consumers: [SVC-09, audit-archiver, SIEM]
    partitions: 24
    retention: 14d
    note: Sự kiện kiểm toán nội bộ phát qua outbox (TL-01 "Nhật ký kiểm toán", TL-04 L764)
    schema: avro/sys/AuditEvent.avsc
    artifactId: sys.audit.v1-value

  - topic: sys.evidence.object.stored.v1
    name: EvidenceObjectStored
    key: tenant:objectId
    outbox: evidence.outbox_event
    classification: C1
    producer: SVC-08
    consumers: [MOD-03]
    partitions: 12
    retention: 7d
    note: SVC-08 báo đối tượng minh chứng đã lưu và khoá Object Lock; chọn tên có tiền tố sys. (TL-02/TL-03/TL-04 L765)
    schema: avro/sys/EvidenceObjectStored.avsc
    artifactId: sys.evidence.object.stored.v1-value

  - topic: evidence.object.scanned.v1
    name: ObjectScanned
    key: tenant:objectId
    outbox: evidence.outbox_event
    classification: C1
    producer: SVC-08
    consumers: [MOD-03]
    partitions: 12
    retention: 7d
    note: SVC-08 báo kết quả quét mã độc từ bảng evidence.scan_result; giữ tên không tiền tố sys. thống nhất ở TL-02/TL-03/TL-04 L765
    schema: avro/evidence/ObjectScanned.avsc
    artifactId: evidence.object.scanned.v1-value

  - topic: sys.tenant.provisioned.v1
    name: TenantProvisioned
    key: tenant:tenantId
    outbox: registry.outbox_event
    classification: C1
    producer: SVC-03
    consumers: []
    partitions: 3
    retention: 30d
    note: SVC-03 báo tenant đã khởi tạo xong CSDL, realm, bucket (TL-01/TL-03)
    schema: avro/sys/TenantProvisioned.avsc
    artifactId: sys.tenant.provisioned.v1-value

  - topic: iam.auth.event.v1
    name: AuthEvent
    key: tenant:userId
    outbox: null
    classification: C1
    producer: SVC-02
    consumers: [SVC-15, SIEM]
    partitions: 12
    retention: 14d
    note: Keycloak đẩy qua SPI lắng nghe sự kiện (không có outbox); giữ tên iam.auth.event.v1 theo TL-03/TL-04 L766 (không dùng tiền tố sys.)
    schema: avro/iam/AuthEvent.avsc
    artifactId: iam.auth.event.v1-value

  - topic: registry.tenant.changed.v1
