# NEN-022 · ADR-03 · Danh mục nguồn outbox và connector Debezium theo schema.
#
# Nguồn:
#   - TL-03 "Transactional Outbox và Debezium" (L4205–4267: connector mẫu outbox-<db>,
#     table.include.list, publication pub_outbox, slot dbz_outbox_<db>, dọn bảng outbox
#     bằng pg_partman p_retention = '3 days', phát lại từ bảng outbox theo dải thời gian)
#   - TL-03 "Bảng outbox_event" (L768) và chương 2 "Bảng sở hữu dữ liệu"
#   - TL-01 mục "Outbox" và "Quy ước topic" (L1279–1283)
#   - TL-04 "Giữ outbox 72 giờ để phát lại sau chuyển vùng" (L2332) và OPS-24 (L3869)
#   - contracts/events/catalog.yaml (NEN-007)
#
# Điểm lệch đã chốt (mục 3 NEN-022):
#   - TL-01 đặt mỗi schema một connector và một slot; TL-03 chọn một connector cho mỗi CSDL
#     liệt kê mọi bảng outbox trong table.include.list (vì mỗi slot sao chép logic giải mã
#     toàn bộ WAL của CSDL). Danh mục này chọn theo TL-03 (connector `outbox-<db>`, slot
#     `dbz_outbox_<db>`), đồng thời cho phép tách một schema sang CSDL/connector riêng bằng
#     cách đổi trường `database`, `connector`, `slotName` trên dòng schema đó.
#   - Thời hạn giữ phân vùng outbox: TL-03 ghi `3 days` (pg_partman), TL-04 ghi `72h`; hai
#     giá trị tương đương (72 giờ = 3 ngày).
#
# Tệp này là đầu vào cho:
#   - CLI `services-go/outbox-replay` (NEN-022) để kiểm tra bảng nguồn, topic hợp lệ và ACL;
#   - Bộ sinh tài nguyên `KafkaConnector` trên Strimzi (INF-10);
#   - Quy trình phát lại sự kiện sau chuyển vùng DR-10 (INF-18) và lệnh `vtctl` (INF-26).

version: 1

defaults:
  publicationName: pub_outbox
  heartbeatTable: platform.dbz_heartbeat
  retentionDays: 3
  retentionHours: 72
  partmanRetention: "3 days"
  eventRouter:
    keyField: event_key
    payloadField: payload
    topicField: topic
    headerFields:
      - column: id
        header: ce_id
      - column: event_type
        header: ce_type
      - column: tenant_id
        header: ce_tenantid
      - column: aggregate_version
        header: aggregate_version
      - column: schema_version
        header: apicurio.value.globalId
      - jsonbKey: traceparent
        header: traceparent
      - jsonbKey: classification
        header: ce_classification

# Các topic kỹ thuật / thông báo có `outbox: "*.outbox_event"` trong catalog.yaml,
# được phép phát từ mọi bảng `<schema>.outbox_event`.
wildcardTopics:
  - notify.message.requested.v1
  - sys.audit.v1
  - period.drain.marker

# Các sự kiện / topic kỹ thuật không đi qua outbox PostgreSQL (`outbox: null` trong catalog.yaml).
nonOutboxTopics:
  - code: EVT-20
    topic: analytics.anomaly.detected.v1
    reason: Producer ClickHouse job đọc bảng anomaly_out, không có outbox PostgreSQL
  - topic: sys.ledger.append.v1
    reason: Bộ thu ledger-ingester của SVC-09 chuyển tiếp nội bộ từ topic nghiệp vụ
  - topic: iam.auth.event.v1
    reason: Keycloak đẩy trực tiếp qua Event Listener SPI
  - topic: org.bootstrap.v1
    reason: Lệnh org-republish của SVC-04 phát trực tiếp trạng thái tổ chức hiện hành
  - topic: agg.province.metric.v1
    reason: SVC-15 đẩy số liệu tổng hợp vô danh C0 từ ClickHouse cấp tỉnh về Trung ương, không có outbox PostgreSQL

