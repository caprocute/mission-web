          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Kết quả quét.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileScanResult' }
              examples:
                sach:
                  value:
                    objectId: 0192a1c3-5e6f-7a81-9c2d-3e4f5a6b7c03
                    objectVersionId: 0192a1c3-5e6f-7a81-9c2d-3e4f5a6b7c13
                    scanStatus: SACH
                    verdict: SACH
                    engine: ClamAV
                    engineVersion: 1.4.1/27431
                    scannedAt: '2026-10-19T09:06:40+07:00'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-07]
        scr: [SCR-0701, SCR-0702]
        owner: SVC-08
        roles: [member, manager]
        scope: B; Gn
        rules: [BR-07-04]
        source: TL-01 SVC-08 GET /files/{objectId}/scan; TL-03 evidence.scan_result; SEC-47

components:
  securitySchemes:
    keycloak:
      $ref: '../common/common.yaml#/components/securitySchemes/keycloak'

  parameters:
    VersionNo:
      name: v
      in: path
      required: true
      description: Số phiên bản minh chứng (`product.evidence_version.version_no`), bắt đầu từ 1.
      schema: { type: integer, minimum: 1 }
    UploadId:
      name: uploadId
      in: path
      required: true
      description: Mã phiên tải lên (`evidence.upload_session.id`).
      schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    ObjectId:
      name: objectId
      in: path
      required: true
      description: Mã đối tượng logic (`evidence.object_meta.id`).
      schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }

  examples:
    FileUploadSessionExample:
      summary: Phiên tải lên vừa mở
      value:
        uploadId: 0192a1c2-1a2b-7c3d-8e4f-5a6b7c8d9e10
        status: MO
        partSize: 8388608
        partCount: 1
        partsDone: 0
        receivedParts: []
        expiresAt: '2026-10-19T09:20:00+07:00'
    EvidenceVersionDraftExample:
      summary: Phiên bản 2 đang soạn, có tệp trùng mã băm
      value:
        id: 0192a1d4-6f70-7b92-8d3e-4f5a6b7c8d04
        evidenceId: 0192a1b2-4d5e-7f60-8b1c-2d3e4f5a6b02
        taskId: 0192a0f1-2b3c-7d4e-9f50-6a7b8c9d0e11
        versionNo: 2
        status: NHAP
        source: VAN_BAN_HE_THONG
        sourceDocRef: 47-BC/BTCĐUK
        objectId: 0192a1c3-5e6f-7a81-9c2d-3e4f5a6b7c03
        objectVersionId: 0192a1c3-5e6f-7a81-9c2d-3e4f5a6b7c13
        contentSha256: 9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08
        sizeBytes: 1843200
        mediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
        fileName: phu-luc-so-lieu.xlsx
        scanStatus: CHO_QUET
        isDuplicateSuspect: true
        duplicateOf:
          taskCode: NV-2026-Q3-0088
          ownerName: Phạm Thu Hà
          submittedAt: '2026-09-02T15:40:00+07:00'
        hasE2ee: false
        aiPrefill: false
        docNumber: 47-BC/BTCĐUK
        docDate: '2026-10-19'
        docSummary: Báo cáo chuyên đề công tác kiểm tra quý III năm 2026
        note: Đã bổ sung số liệu chi bộ 3 và chi bộ 6.
        rowVersion: 1
    EvidenceVersionInReviewExample:
      summary: Phiên bản 2 đang nghiệm thu, đã kiểm toàn vẹn
      value:
        id: 0192a1d4-6f70-7b92-8d3e-4f5a6b7c8d04
        evidenceId: 0192a1b2-4d5e-7f60-8b1c-2d3e4f5a6b02
        taskId: 0192a0f1-2b3c-7d4e-9f50-6a7b8c9d0e11
        versionNo: 2
        status: DANG_NGHIEM_THU
        source: VAN_BAN_HE_THONG
        sourceDocRef: 47-BC/BTCĐUK
        objectId: 0192a1c3-5e6f-7a81-9c2d-3e4f5a6b7c03
        objectVersionId: 0192a1c3-5e6f-7a81-9c2d-3e4f5a6b7c13
        contentSha256: 3a7bd3e2360a3d29eea436fcfb7e44c735d117c42d1c1835420b6b9942dd4f1b
        sizeBytes: 2457600
        mediaType: application/pdf
        fileName: 47-BC-BTCDUK.pdf
        scanStatus: SACH
        isDuplicateSuspect: false
        hasE2ee: false
        aiPrefill: false
        reuseJustification: null
        submittedBy: { id: 0192a0aa-1111-7222-8333-444455556666, name: Nguyễn Văn An }
        submittedAt: '2026-10-19T09:11:00+07:00'
        attestedAt: '2026-10-19T09:11:00+07:00'
        integrity: { verified: true, checkedAt: '2026-10-19T09:40:00+07:00' }
        qualityCriteria:
          - { code: TC-DV-03-1, text: Đủ số liệu theo mẫu }
          - { code: TC-DV-03-2, text: Đúng thể thức NĐ 30/2020 }
          - { code: TC-DV-03-3, text: Được lãnh đạo ban duyệt }
        hasPriorRevisionRequest: true
        rowVersion: 6

  schemas:
    DeliverableType:
      description: Loại sản phẩm (`product.deliverable.deliverable_type`, TL-03).
      type: string
      enum: [VAN_BAN, BAO_CAO, SO_LIEU, SU_KIEN, KHAC]
    DeliverableStatus:
      description: Trạng thái tổng hợp của sản phẩm (`product.deliverable.status`, TL-03).
      type: string
      enum: [CHUA_CO, DANG_THUC_HIEN, DA_XAC_NHAN_MOT_PHAN, DA_XAC_NHAN]
    Deliverable:
      description: Sản phẩm của nhiệm vụ (`product.deliverable`).
      type: object
      required: [id, taskId, name, deliverableType, unit, quantityPlanned, quantityAccepted, status, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        taskId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        name: { type: string, maxLength: 500 }
        deliverableType: { $ref: '#/components/schemas/DeliverableType' }
        unit: { type: string, maxLength: 32, description: 'Đơn vị tính' }
        quantityPlanned: { type: number, minimum: 0, description: 'Số lượng kế hoạch' }
        quantityAccepted: { type: number, minimum: 0, description: 'Số lượng đã được xác nhận (đầu vào cấu phần A)' }
        status: { $ref: '#/components/schemas/DeliverableStatus' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - id: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a01
          taskId: 0192a0f1-2b3c-7d4e-9f50-6a7b8c9d0e11
          name: Báo cáo chuyên đề công tác kiểm tra quý III
          deliverableType: BAO_CAO
          unit: báo cáo
          quantityPlanned: 1
          quantityAccepted: 1
          status: DA_XAC_NHAN
          rowVersion: 4
    DeliverableCreate:
      type: object
      required: [taskId, name, deliverableType, unit, quantityPlanned]
      properties:
        taskId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 500 }
        deliverableType: { $ref: '#/components/schemas/DeliverableType' }
        unit: { type: string, minLength: 1, maxLength: 32 }
        quantityPlanned: { type: number, exclusiveMinimum: 0 }
    DeliverableList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Deliverable' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }

    EvidenceVersionStatus:
      description: >-
        Trạng thái nghiệm thu của phiên bản minh chứng (`product.evidence_version.status`, baseline 9.1, TL-02a
        Hình 8.12). `YEU_CAU_BO_SUNG` và `TU_CHOI` là trạng thái kết thúc; nộp lại tạo phiên bản mới.
      type: string
      enum: [NHAP, DA_NOP, DANG_NGHIEM_THU, DA_XAC_NHAN, YEU_CAU_BO_SUNG, TU_CHOI]
    EvidenceSourceType:
      description: >-
        Nguồn minh chứng (`product.evidence.source_type`, TL-03). TL-02 SCR-0701 ghi bộ khác
        (`VAN_BAN`, `TEP`, `LIEN_KET`, `ANH_CHUP`); hợp đồng theo TL-03.
      type: string
      enum: [TAI_LEN, VAN_BAN, HE_THONG]
    EvidenceVersionSource:
      description: Nguồn của phiên bản (`product.evidence_version.source`, TL-03).
      type: string
      enum: [TAI_LEN, VAN_BAN_HE_THONG, OCR_DI_DONG, TICH_HOP]
    FileScanStatus:
      description: Trạng thái quét mã độc (`evidence.object_version.scan_status`, `product.evidence_version.scan_status`).
      type: string
      enum: [CHO_QUET, SACH, NHIEM, LOI]
    FileScanVerdict:
      description: Kết luận của bộ quét (`evidence.scan_result.verdict`).
      type: string
      enum: [SACH, NHIEM, NGHI_NGO, LOI]
    Sha256Hex:
      description: >-
        Mã băm SHA-256 dạng 64 ký tự hex chữ thường (cột `bytea` 32 byte của TL-03). Với tệp C3 là băm của bản mã.
      type: string
      pattern: '^[0-9a-f]{64}$'
      examples: ['9f86d081884c7d659a2feaa0c55ad015a3bf4f1b2b0b822cd15d6c15b0f00a08']
    ProductTaskRef:
      description: Nhiệm vụ rút gọn (`task.task`).
      type: object
      required: [id, code, name]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, examples: ['NV-2026-Q4-0142'] }
        name: { type: string }
    EvidenceDuplicateMatch:
      description: >-
        Minh chứng khác trong tenant có cùng mã băm (`evidence.dedup_index`); hiện ở vùng 3 SCR-0701 (MSG-07-01)
        và SCR-0703 (MSG-07-11). Không bao giờ so trùng giữa các tenant.
      type: object
      required: [taskCode]
      properties:
        taskCode: { type: string, description: 'Mã nhiệm vụ có minh chứng trùng' }
        ownerName: { type: string, description: 'Người nộp minh chứng trùng' }
        submittedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    EvidenceVersionSummary:
      description: Một dòng trong lịch sử phiên bản (vùng 4 SCR-0701).
      type: object
      required: [versionNo, status]
      properties:
        versionNo: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/EvidenceVersionStatus' }
        submittedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        decidedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        qualityLevel: { $ref: '../common/common.yaml#/components/schemas/QualityLevel' }
        decisionNote:
          type: string
          description: Tóm tắt nhận xét nghiệm thu, chỉ trả cho người có quyền đọc C2.
          x-classification: C2
    Evidence:
      description: Minh chứng của một sản phẩm (`product.evidence`) kèm lịch sử phiên bản.
      type: object
      required: [id, deliverableId, task, title, sourceType, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        deliverableId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        task: { $ref: '#/components/schemas/ProductTaskRef' }
        title: { type: string, maxLength: 500 }
        sourceType: { $ref: '#/components/schemas/EvidenceSourceType' }
        externalDocRef: { type: [string, 'null'], maxLength: 200, description: 'Văn bản bên ngoài làm minh chứng' }
        currentVersionNo: { type: [integer, 'null'], description: 'Số phiên bản mới nhất' }
        currentStatus:
          description: Trạng thái của phiên bản mới nhất (`current_status`); null khi chưa có phiên bản.
          oneOf:
            - $ref: '#/components/schemas/EvidenceVersionStatus'
            - type: 'null'
        isDuplicateSuspect: { type: boolean, description: 'Phiên bản mới nhất nghi trùng mã băm' }
        submittedBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        submittedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        versions:
          type: array
          description: Chỉ có ở `GET /evidences/{id}`; danh sách bỏ trống.
          items: { $ref: '#/components/schemas/EvidenceVersionSummary' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - id: 0192a1b2-4d5e-7f60-8b1c-2d3e4f5a6b02
          deliverableId: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a01
          task: { id: 0192a0f1-2b3c-7d4e-9f50-6a7b8c9d0e11, code: NV-2026-Q4-0142, name: Báo cáo chuyên đề công tác kiểm tra quý III }
          title: Báo cáo chuyên đề công tác kiểm tra quý III
          sourceType: VAN_BAN
          externalDocRef: 47-BC/BTCĐUK
          currentVersionNo: 2
          currentStatus: DA_NOP
          rowVersion: 4
    EvidenceCreate:
      type: object
      required: [deliverableId, title, sourceType]
      properties:
        deliverableId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        title: { type: string, minLength: 1, maxLength: 500 }
        sourceType: { $ref: '#/components/schemas/EvidenceSourceType' }
        externalDocRef: { type: string, maxLength: 200, description: 'Bắt buộc khi `sourceType` là `VAN_BAN`' }
    EvidenceList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Evidence' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    EvidenceExternalDoc:
      description: Văn bản đã ban hành lấy từ vOffice qua SVC-13 (`integ.mapping_xref`).
      type: object
      required: [ref, docNumber, docDate, summary]
      properties:
        ref: { type: string, maxLength: 200, description: 'Mã tham chiếu dùng cho `externalDocRef`, `sourceDocRef`' }
        docNumber: { type: string, description: 'Số, ký hiệu' }
        docDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        summary: { type: string, description: 'Trích yếu' }
        signerName: { type: string, description: 'Người ký' }
        signatureValid: { type: boolean, description: 'Chữ ký số gốc hợp lệ khi nhận (BR-07-13)' }
    EvidenceExternalDocList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EvidenceExternalDoc' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    EvidenceKeyWrap:
      description: >-
        Khoá nội dung của tệp C3 đã bọc bằng khoá công khai của một người nhận (`product.e2ee_key_wrap`,
        `object_type = EVIDENCE_FILE`, ADR-06). Máy chủ chỉ giữ bản bọc, không bao giờ thấy khoá rõ. Cấu trúc
        trường theo `task.e2ee_key_wrap` (suy luận).
      type: object
      required: [recipientId, wrappedKey, alg]
      properties:
        recipientId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        wrappedKey: { type: string, contentEncoding: base64, description: 'Khoá nội dung đã bọc' }
        alg: { type: string, enum: [ECDH-ES+A256KW, RSA-OAEP-256], description: 'Thuật toán bọc khoá' }
    EvidenceQualityCriterion:
      description: Tiêu chuẩn chất lượng của mục danh mục (`task.catalog_item.quality_criteria`).
      type: object
      required: [code, text]
      properties:
        code: { type: string }
        text: { type: string }
    EvidenceCriterionResult:
      description: Kết quả đối chiếu một tiêu chuẩn (`product.acceptance.criteria_results`).
      type: object
      required: [criterionCode, passed]
      properties:
        criterionCode: { type: string }
        passed: { type: boolean, description: 'Đạt hoặc Chưa đạt' }
        note: { type: string, maxLength: 500 }
    EvidenceVersion:
      description: >-
        Phiên bản minh chứng (`product.evidence_version`). Sau khi rời `NHAP`, các trường tệp và mã băm đóng
        băng (BR-07-01). Trường do AI điền chỉ có hiệu lực khi người nộp xác nhận (BR-07-09).
      type: object
      required: [id, evidenceId, taskId, versionNo, status, source, scanStatus, hasE2ee, aiPrefill, isDuplicateSuspect, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        evidenceId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        taskId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        versionNo: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/EvidenceVersionStatus' }
        source: { $ref: '#/components/schemas/EvidenceVersionSource' }
        sourceDocRef: { type: [string, 'null'], maxLength: 200 }
        objectId:
          description: Đối tượng ở SVC-08 (`evidence.object_meta.id`).
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
            - type: 'null'
        objectVersionId:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
            - type: 'null'
        contentSha256:
          oneOf:
            - $ref: '#/components/schemas/Sha256Hex'
            - type: 'null'
        sizeBytes: { type: [integer, 'null'], minimum: 0 }
        mediaType: { type: [string, 'null'], maxLength: 127 }
        fileName:
          type: [string, 'null']
          maxLength: 255
          description: >-
            Tên tệp gốc. TL-03 xếp `product.evidence_version.file_name` C1 nhưng `evidence.object_meta.file_name_enc`
            C2; hợp đồng xếp C2 để thống nhất.
          x-classification: C2
        scanStatus: { $ref: '#/components/schemas/FileScanStatus' }
        isDuplicateSuspect: { type: boolean }
        duplicateOf:
          oneOf:
            - $ref: '#/components/schemas/EvidenceDuplicateMatch'
            - type: 'null'
        reuseJustification: { type: [string, 'null'], minLength: 20, maxLength: 1000, description: 'Giải trình dùng lại khi trùng mã băm (BR-07-03)' }
        hasE2ee: { type: boolean, description: 'Tệp C3 mã hoá đầu cuối; máy chủ chỉ giữ bản mã' }
        keyWrap:
          description: Khoá nội dung đã bọc cho chính người gọi khi `hasE2ee` (suy luận).
          oneOf:
            - $ref: '#/components/schemas/EvidenceKeyWrap'
            - type: 'null'
        aiPrefill: { type: boolean, description: 'Có trường do AI, OCR điền sẵn (SCR-0702)' }
        aiSuggestionId:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
            - type: 'null'
        userConfirmedAt:
          description: Thời điểm người nộp xác nhận các ô do AI điền.
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/DateTime'
            - type: 'null'
        docNumber: { type: [string, 'null'], maxLength: 100, description: 'Số, ký hiệu văn bản (NĐ 30/2020)' }
        docDate:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Date'
            - type: 'null'
        docSummary: { type: [string, 'null'], maxLength: 2000, description: 'Trích yếu (SCR-0702 giới hạn 500 ký tự khi nhập)' }
        note: { type: [string, 'null'], maxLength: 2000, description: 'Ghi chú của người nộp' }
        submittedBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        submittedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        attestedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        acceptedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        excludedPeriodId:
          description: Kỳ mà phiên bản không được tính (còn `DA_NOP` khi khoá kỳ, QT-08).
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
            - type: 'null'
        integrity:
          description: Kết quả kiểm toàn vẹn mã băm lần mở gần nhất (SCR-0703).
          type: object
          required: [verified, checkedAt]
          properties:
            verified: { type: boolean }
            checkedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        qualityCriteria:
          type: array
          description: Tiêu chuẩn chất lượng của mục danh mục để đối chiếu ở SCR-0703.
          items: { $ref: '#/components/schemas/EvidenceQualityCriterion' }
        hasPriorRevisionRequest:
          type: boolean
          description: Có phiên bản trước bị yêu cầu bổ sung; khi đúng, nghiệm thu phải chọn nguyên nhân chỉnh sửa.
        acceptance:
          description: Quyết định nghiệm thu của phiên bản này, nếu đã có.
          oneOf:
            - $ref: '#/components/schemas/EvidenceAcceptance'
            - type: 'null'
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - id: 0192a1d4-6f70-7b92-8d3e-4f5a6b7c8d04
          evidenceId: 0192a1b2-4d5e-7f60-8b1c-2d3e4f5a6b02
          taskId: 0192a0f1-2b3c-7d4e-9f50-6a7b8c9d0e11
          versionNo: 2
          status: DA_NOP
          source: OCR_DI_DONG
