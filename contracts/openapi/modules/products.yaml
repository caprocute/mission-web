        5 phút, phạm vi đúng một khoá đối tượng. Với tệp C3, tệp tải về là bản mã; trình duyệt giải mã bằng
        khoá nội dung đã bọc trả trong `EvidenceVersion.keyWrap` (ADR-06). Không trả tệp nhiễm mã độc. Đây là
