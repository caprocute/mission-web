# Hợp đồng OpenAPI của MOD-03 `product` (sản phẩm, minh chứng, nghiệm thu) và SVC-08 evidence-service
# (tải tệp nhiều phần, băm SHA-256, URL tải có hạn, quét mã độc). WEB-063, ADR-32.
# Nguồn:
#   - Baseline mục 9 (EVT-06, EVT-07, EVT-08, EVT-21), 9.1 (trạng thái chuẩn, QualityLevel), 10 (vai trò AC), 13 (quy ước API).
#   - TL-01 chương "SVC-08 evidence-service" (bảng API, Object Lock, URL ký 5 phút), chương 9 (C2, C3, ADR-06),
#     Phụ lục C mục "Sản phẩm và minh chứng (MOD-03, SVC-08)".
#   - TL-02a QT-07: bảng các bước, trạng thái `product.evidence_version` (Hình 8.12), BR-07-01..BR-07-13,
#     ngoại lệ, SCR-0701, SCR-0702, SCR-0703 (bảng trường, bảng nút/hành động, MSG-07-01..MSG-07-14).
#   - TL-03 schema `product` (deliverable, evidence, evidence_version, acceptance, e2ee_key_wrap) và schema
#     `evidence` (object_meta, object_version, dedup_index, scan_result, upload_session); bảng EVT ở part-10.
#   - TL-04 SEC-47 (quét ClamAV), SEC-48 (giới hạn tải lên).
#   - Ma trận phân quyền `docs/phan-quyen/ma-tran.json` (SCR-0701.*, SCR-0702.dd, SCR-0703.*, API `products`, `evidences`).
# Điểm chốt khi ghép nguồn (TL-01 PL C với TL-02) ghi ở `info.description`.
openapi: 3.1.0
info:
  title: Mission – Sản phẩm và minh chứng (MOD-03, SVC-08)
  version: 1.0.0-draft.1
  description: >-
    Sản phẩm của nhiệm vụ, minh chứng có phiên bản chỉ ghi, nghiệm thu chất lượng năm mức (QT-07) do
    module product (MOD-03) của mission-core xử lý; lưu trữ tệp, băm SHA-256, khử trùng, quét mã độc và
    URL tải có hạn do evidence-service (SVC-08) xử lý. Trạng thái thực hiện của nhiệm vụ (`task.task.status`)
    và trạng thái nghiệm thu của phiên bản minh chứng (`product.evidence_version.status`) là hai máy trạng thái
    tách biệt (BR-07-10).


    Điểm chốt khi ghép nguồn: (1) đường dẫn minh chứng theo TL-02 SCR-0701..0703
    (`/evidences/{id}/versions/{v}/submit|open-review|accept|request-revision|reject`) thay cho TL-01 PL C
    (`/products/{id}/evidence-versions`, `/evidence-versions/{id}/acceptance`, `/evidence-versions/{id}/supplement-requests`),
    vì TL-02 chi tiết hơn, tách rõ lưu nháp và nộp, và ma trận phân quyền đã dùng đường dẫn TL-02;
    (2) giá trị liệt kê nguồn minh chứng lấy theo CHECK của TL-03 (`TAI_LEN`, `VAN_BAN`, `HE_THONG` cho
    minh chứng; `TAI_LEN`, `VAN_BAN_HE_THONG`, `OCR_DI_DONG`, `TICH_HOP` cho phiên bản) thay cho bộ
    `VAN_BAN`, `TEP`, `LIEN_KET`, `ANH_CHUP` ghi ở bảng trường SCR-0701; (3) nhận xét nghiệm thu xếp C2 theo
    TL-02 SCR-0703 và cột `comment_enc` của TL-03; (4) gửi từng phần tệp qua `PUT /files/uploads/{uploadId}/parts/{n}`
    theo TL-01; việc SVC-08 chuyển tiếp thẳng tới Ceph RGW bằng URL ký trước (TL-03) là chi tiết hiện thực phía máy chủ.
servers:
  - url: /api/v1
security:
  - keycloak: []
tags:
  - name: Sản phẩm
    description: Sản phẩm của nhiệm vụ (`product.deliverable`), số lượng kế hoạch và số lượng đã xác nhận (đầu vào cấu phần A).
  - name: Minh chứng
    description: Minh chứng và phiên bản minh chứng chỉ ghi (`product.evidence`, `product.evidence_version`), nộp để nghiệm thu (SCR-0701, SCR-0702).
  - name: Nghiệm thu
    description: Mở nghiệm thu, kiểm toàn vẹn, xác nhận mức chất lượng năm mức, yêu cầu bổ sung, từ chối (SCR-0703, `product.acceptance`).
  - name: Tệp
    description: Phiên tải lên nhiều phần, hoàn tất trả SHA-256, URL tải có hạn 5 phút, kết quả quét mã độc (SVC-08, schema `evidence`).

paths:
  /products:
    get:
      tags: [Sản phẩm]
      operationId: listDeliverables
      summary: Danh sách sản phẩm của một nhiệm vụ
      description: >-
        Trả các sản phẩm khai báo cho nhiệm vụ cùng số lượng kế hoạch, số lượng đã xác nhận và trạng thái tổng hợp.
        Dùng ở SCR-0701 (chọn sản phẩm cần nộp) và SCR-0703 (tính số lượng A). Thao tác đọc suy luận từ ma trận
        API `products` (GET cho AC-05, AC-06); TL-01 PL C chỉ ghi thao tác tạo.
      parameters:
        - name: task
          in: query
          required: true
          description: Mã nhiệm vụ (`task.task.id`).
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Danh sách sản phẩm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliverableList' }
              examples:
                bao-cao-chuyen-de:
                  value:
                    items:
                      - id: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a01
                        taskId: 0192a0f1-2b3c-7d4e-9f50-6a7b8c9d0e11
                        name: Báo cáo chuyên đề công tác kiểm tra quý III
                        deliverableType: BAO_CAO
                        unit: báo cáo
                        quantityPlanned: 1
                        quantityAccepted: 0
                        status: DANG_THUC_HIEN
                        rowVersion: 2
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-07]
        scr: [SCR-0701, SCR-0703]
        owner: MOD-03
        roles: [member, manager]
        scope: B; Gn
        source: TL-01 PL C MOD-03 (suy luận thao tác đọc); ma trận API products
    post:
      tags: [Sản phẩm]
      operationId: createDeliverable
      summary: Khai báo sản phẩm của nhiệm vụ
      description: >-
        Người được giao khai báo một sản phẩm cần nộp cho nhiệm vụ (tên, loại, đơn vị tính, số lượng kế hoạch).
        TL-02 không có SCR riêng cho thao tác này; sản phẩm thường được sinh khi giao việc từ mục danh mục (suy luận).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliverableCreate' }
            examples:
              khai-bao:
                value:
                  taskId: 0192a0f1-2b3c-7d4e-9f50-6a7b8c9d0e11
                  name: Báo cáo chuyên đề công tác kiểm tra quý III
                  deliverableType: BAO_CAO
                  unit: báo cáo
                  quantityPlanned: 1
      responses:
        '201':
          description: Đã tạo sản phẩm.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deliverable' }
              examples:
                da-tao:
                  value:
                    id: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a01
                    taskId: 0192a0f1-2b3c-7d4e-9f50-6a7b8c9d0e11
                    name: Báo cáo chuyên đề công tác kiểm tra quý III
                    deliverableType: BAO_CAO
                    unit: báo cáo
                    quantityPlanned: 1
                    quantityAccepted: 0
                    status: CHUA_CO
                    rowVersion: 0
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409':
          $ref: '../common/common.yaml#/components/responses/Conflict'
        '422':
          description: >-
            Dữ liệu không hợp lệ. Mã lỗi: `COMMON-422-VALIDATION`, `PRODUCT-422-TASK-NOT-OPEN` (nhiệm vụ
            không ở trạng thái cho phép khai báo sản phẩm).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-07]
        scr: []
        owner: MOD-03
        roles: [member]
        scope: B
        source: TL-01 PL C MOD-03 POST /products; ma trận API products
  /products/{id}:
    get:
      tags: [Sản phẩm]
      operationId: getDeliverable
      summary: Chi tiết một sản phẩm
      description: Trả sản phẩm kèm `ETag`. Thao tác đọc suy luận từ ma trận API `products`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdPath'
      responses:
        '200':
          description: Sản phẩm.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deliverable' }
              examples:
                san-pham:
                  value:
                    id: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a01
                    taskId: 0192a0f1-2b3c-7d4e-9f50-6a7b8c9d0e11
                    name: Báo cáo chuyên đề công tác kiểm tra quý III
                    deliverableType: BAO_CAO
                    unit: báo cáo
                    quantityPlanned: 1
                    quantityAccepted: 0
                    status: DANG_THUC_HIEN
                    rowVersion: 2
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-07]
        scr: [SCR-0701, SCR-0703]
        owner: MOD-03
        roles: [member, manager]
        scope: B; Gn
        source: Ma trận API products (suy luận)

  /evidences:
    get:
      tags: [Minh chứng]
      operationId: listEvidences
      summary: Danh sách minh chứng theo nhiệm vụ, sản phẩm hoặc hàng chờ nghiệm thu
      description: >-
        Danh sách minh chứng kèm trạng thái phiên bản mới nhất. Với `reviewer=me` và `status=DA_NOP,DANG_NGHIEM_THU`
        trả hàng chờ nghiệm thu của người gọi (menu "Đánh giá / Chờ tôi duyệt" dẫn vào SCR-0703); với `submitter=me`
        trả minh chứng của tôi (tab "Minh chứng" của SCR-0702). Bộ lọc là suy luận từ đường vào của SCR.
      parameters:
        - name: task
          in: query
          description: Lọc theo nhiệm vụ.
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: deliverable
          in: query
          description: Lọc theo sản phẩm.
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: status
          in: query
          description: Lọc theo trạng thái phiên bản mới nhất; nhiều giá trị cách nhau bằng dấu phẩy.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/EvidenceVersionStatus' }
        - name: reviewer
          in: query
          description: '`me` để lấy minh chứng mà người gọi là người nghiệm thu được chỉ định.'
          schema: { type: string, enum: [me] }
        - name: submitter
          in: query
          description: '`me` để lấy minh chứng do người gọi nộp hoặc đang soạn.'
          schema: { type: string, enum: [me] }
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Danh sách minh chứng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceList' }
              examples:
                cho-nghiem-thu:
                  value:
                    items:
                      - id: 0192a1b2-4d5e-7f60-8b1c-2d3e4f5a6b02
                        deliverableId: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a01
                        task: { id: 0192a0f1-2b3c-7d4e-9f50-6a7b8c9d0e11, code: NV-2026-Q4-0142, name: Báo cáo chuyên đề công tác kiểm tra quý III }
                        title: Báo cáo chuyên đề công tác kiểm tra quý III
                        sourceType: VAN_BAN
                        currentVersionNo: 2
                        currentStatus: DA_NOP
                        isDuplicateSuspect: true
                        submittedAt: '2026-10-19T09:11:00+07:00'
                        submittedBy: { id: 0192a0aa-1111-7222-8333-444455556666, name: Nguyễn Văn An }
                        rowVersion: 4
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-07]
        scr: [SCR-0701, SCR-0702, SCR-0703]
        owner: MOD-03
        roles: [member, manager, leader, appraiser, inspector]
        scope: B; Gn; Cd
        source: TL-02a SCR-0701..0703 (đường vào); ma trận API evidences (GET)
    post:
      tags: [Minh chứng]
      operationId: createEvidence
      summary: Tạo minh chứng cho một sản phẩm
      description: >-
        Tạo minh chứng (`product.evidence`) gắn với sản phẩm của nhiệm vụ mà người gọi chủ trì. Phiên bản đầu
        tiên tạo bằng `POST /evidences/{id}/versions`. TL-02 không ghi riêng thao tác này; nó cần thiết vì đường
        dẫn lưu nháp của SCR-0701 đã có `{id}` của minh chứng (suy luận). Thay cho phần tạo của TL-01 PL C
        `POST /products/{id}/evidence-versions`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EvidenceCreate' }
            examples:
              van-ban:
                value:
                  deliverableId: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a01
                  title: Báo cáo chuyên đề công tác kiểm tra quý III
                  sourceType: VAN_BAN
                  externalDocRef: 47-BC/BTCĐUK
      responses:
        '201':
          description: Đã tạo minh chứng (chưa có phiên bản).
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
              examples:
                da-tao:
                  value:
                    id: 0192a1b2-4d5e-7f60-8b1c-2d3e4f5a6b02
                    deliverableId: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a01
                    task: { id: 0192a0f1-2b3c-7d4e-9f50-6a7b8c9d0e11, code: NV-2026-Q4-0142, name: Báo cáo chuyên đề công tác kiểm tra quý III }
                    title: Báo cáo chuyên đề công tác kiểm tra quý III
                    sourceType: VAN_BAN
                    externalDocRef: 47-BC/BTCĐUK
                    currentVersionNo: null
                    currentStatus: null
                    versions: []
                    rowVersion: 0
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403':
          description: Người gọi không phải người chủ trì nhiệm vụ (`PRODUCT-403-NOT-TASK-OWNER`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '409':
          description: >-
            Kỳ đã khoá hoặc nhiệm vụ không ở trạng thái nhận minh chứng. Mã lỗi: `PRODUCT-409-PERIOD-LOCKED`,
            `PRODUCT-409-TASK-STATE`.
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-07]
        scr: [SCR-0701, SCR-0702]
        owner: MOD-03
        roles: [member]
        scope: B
        rules: [BR-07-13]
        source: TL-02a SCR-0701 (suy luận bước tạo); TL-01 PL C POST /products/{id}/evidence-versions
  /evidences/external-docs:
    get:
      tags: [Minh chứng]
      operationId: searchEvidenceExternalDocs
      summary: Tìm văn bản đã ban hành của đơn vị để làm minh chứng
      description: >-
        Tìm văn bản đã ban hành của đơn vị trong vOffice qua integration-gateway (SVC-13) để dùng làm minh chứng
        mà không tải lại tệp (BR-07-13). Trả số ký hiệu, ngày ban hành, trích yếu, người ký và trạng thái chữ ký số.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/Q'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Danh sách văn bản khớp từ khoá.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceExternalDocList' }
              examples:
                vanban:
                  value:
                    items:
                      - ref: 47-BC/BTCĐUK
                        docNumber: 47-BC/BTCĐUK
                        docDate: '2026-10-19'
                        summary: Báo cáo chuyên đề công tác kiểm tra quý III năm 2026
                        signerName: Trần Thị Bình
                        signatureValid: true
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-07]
        scr: [SCR-0701]
        owner: MOD-03
        roles: [member]
        scope: B
        rules: [BR-07-13]
        source: TL-02a SCR-0701 hành động "Chọn văn bản"
  /evidences/{id}:
    get:
      tags: [Minh chứng]
      operationId: getEvidence
      summary: Chi tiết minh chứng và lịch sử phiên bản
      description: >-
        Trả minh chứng cùng danh sách rút gọn mọi phiên bản (vùng 4 "Lịch sử phiên bản" của SCR-0701). Phiên bản
        không bao giờ bị xoá (BR-07-01).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdPath'
      responses:
        '200':
          description: Minh chứng.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Evidence' }
              examples:
                hai-phien-ban:
                  value:
                    id: 0192a1b2-4d5e-7f60-8b1c-2d3e4f5a6b02
                    deliverableId: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a01
                    task: { id: 0192a0f1-2b3c-7d4e-9f50-6a7b8c9d0e11, code: NV-2026-Q4-0142, name: Báo cáo chuyên đề công tác kiểm tra quý III }
                    title: Báo cáo chuyên đề công tác kiểm tra quý III
                    sourceType: VAN_BAN
                    externalDocRef: 47-BC/BTCĐUK
                    currentVersionNo: 2
                    currentStatus: NHAP
                    versions:
                      - versionNo: 1
                        status: YEU_CAU_BO_SUNG
                        submittedAt: '2026-10-14T16:20:00+07:00'
                        decisionNote: Bổ sung số liệu chi bộ 3, 6.
                      - versionNo: 2
                        status: NHAP
                    rowVersion: 3
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
