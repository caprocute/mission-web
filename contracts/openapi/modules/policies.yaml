        qt: [QT-15]
        scr: [SCR-1503]
        owner: MOD-05
        evt: [EVT-13]
        roles: [policy_author]
        scope: Tn
        source: TL-02b QT-15 "Ngoại lệ và xử lý" ("BA bấm phát hành lại mà không cần ký lại") (suy luận đường dẫn)

  # ───────────────────────────── Phân giải và tra cứu ─────────────────────────────
  /policies/resolve:
    get:
      tags: [Phân giải và tra cứu]
      operationId: resolvePolicyPack
      summary: Phân giải gói hiệu lực cho kỳ
      description: |
        Client nội bộ (SVC-07, SVC-06, MOD-04) tra phiên bản Policy Pack áp cho tổ hợp tenant, kỳ, luồng, khối và
        đơn vị theo `policy.policy_binding` (khớp cụ thể nhất trước). Trả mã băm và tham chiếu gói đã ký để bên gọi
        kiểm tra toàn vẹn trước khi dùng.
      security:
        - serviceClient: []
      parameters:
        - name: tenant
          in: query
          required: true
          description: Tenant (`tenant_id`).
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: period
          in: query
          required: true
          description: Kỳ đánh giá (`config.period.id`).
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: flow
          in: query
          required: true
          description: Luồng đánh giá.
          schema: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        - name: subjectGroup
          in: query
          description: Khối đối tượng (suy luận; cột `subject_group_id` của `policy_binding`).
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - $ref: '../common/common.yaml#/components/parameters/UnitId'
      responses:
        '200':
          description: Phiên bản hiệu lực.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResolvedPolicyPack' }
              examples:
                quy-iv:
                  value:
                    policyPackId: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a01
                    code: khoi-dang/quy-dinh-moi
                    versionId: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4b20
                    version: 2.0.0
                    contentHash: 9f2c4e1b7a6d3f08c5e2b1a49d7f6e3c2b1a0f9e8d7c6b5a4f3e2d1c0b9a8f7e
                    bundleObjectKey: policy-cell-nb/khoi-dang/quy-dinh-moi/2.0.0.bundle
                    bindingId: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4d01
                    frozen: false
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404':
          description: 'Không có gói nào gắn cho tổ hợp này. Mã lỗi: `POLICY-404-NO-BINDING`.'
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-09, QT-15]
        scr: []
        owner: MOD-05
        roles: [service_client]
        scope: N
        source: TL-01 PL C `GET /policies/resolve?tenant=&period=&flow=` (Client nội bộ)

  /policies/packs/{id}/prospect-criteria:
    parameters:
      - $ref: '#/components/parameters/PackId'
    get:
      tags: [Phân giải và tra cứu]
      operationId: getProspectCriteria
      summary: Tiêu chí phân nhóm triển vọng
      description: |
        Tiêu chí bốn nhóm triển vọng theo PL 5 trong phiên bản hiệu lực của gói (hoặc phiên bản chỉ định), kèm tham
        số `phan_nhom.mo_o_ky_quy` (BR-10-07) và mức xếp loại không được vào từng nhóm (BR-10-09). Mở từ ngăn
        "Xem tiêu chí PL 5" của SCR-1002.
      parameters:
        - name: version
          in: query
          description: Phiên bản cụ thể; bỏ trống là phiên bản đang phát hành.
          schema: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
      responses:
        '200':
          description: Tiêu chí nhóm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProspectCriteria' }
              examples:
                pl5:
                  value:
                    policyPackId: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a01
                    version: 2.0.0
                    openInQuarter: false
                    legalRef: QĐ khoản 12.1.5; PL 5
                    groups:
                      - groupCode: NHOM_1
                        name: Nhóm 1 – Có triển vọng phát triển cao
                        criteria: Hoàn thành xuất sắc nhiệm vụ nhiều năm liền, có khả năng đảm nhiệm vị trí cao hơn.
                        excludedRatingLevels: [KHTNV]
                        excludeReassignmentFlag: true
                      - groupCode: NHOM_4
                        name: Nhóm 4 – Cần bố trí lại
                        criteria: Không hoàn thành nhiệm vụ hoặc không đáp ứng yêu cầu vị trí đang đảm nhiệm.
                        excludedRatingLevels: []
                        excludeReassignmentFlag: false
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-10]
        scr: [SCR-1002]
        owner: MOD-05
        roles: [leader, appraiser]
        scope: Đv
        rules: [BR-10-07, BR-10-09]
        source: TL-02b SCR-1002 "Xem tiêu chí PL 5"; ma trận SCR-1002.xem

  # ───────────────────────────── Luồng duyệt (SCR-1504) ─────────────────────────────
  /policies/packs/{id}/versions/{v}/workflow-bindings:
    parameters:
      - $ref: '#/components/parameters/PackId'
      - $ref: '#/components/parameters/PackVersion'
    get:
      tags: [Luồng duyệt]
      operationId: listWorkflowBindings
      summary: Danh sách tham số luồng duyệt của phiên bản
      responses:
        '200':
          description: Các bản ghi `wf_binding` thuộc phiên bản.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WorkflowBinding' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1504]
        owner: MOD-05
        roles: [policy_author, decider]
        scope: Tn
        source: TL-02b SCR-1504 (suy luận đường dẫn danh sách)

  /policies/packs/{id}/versions/{v}/workflow-bindings/{key}:
    parameters:
      - $ref: '#/components/parameters/PackId'
      - $ref: '#/components/parameters/PackVersion'
      - $ref: '#/components/parameters/ProcessKind'
    get:
      tags: [Luồng duyệt]
      operationId: getWorkflowBinding
      summary: Xem tham số luồng duyệt theo loại quy trình
      responses:
        '200':
          description: Bản ghi `wf_binding`.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowBinding' }
              examples:
                ho-so-danh-gia:
                  $ref: '#/components/examples/WorkflowBindingHoSo'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1504]
        owner: MOD-05
        roles: [policy_author, decider]
        scope: Tn
        source: TL-03 `flowable.wf_binding`
    put:
      tags: [Luồng duyệt]
      operationId: saveWorkflowBinding
      summary: Lưu tham số luồng duyệt
      description: |
        Lưu `wf_binding` nháp thuộc phiên bản Policy Pack đang soạn, kiểm tra `params` theo `paramSchema` của mẫu,
        chạy linter và bộ test của mẫu với tham số này (BR-15-11, BR-15-12). Kỳ bắt đầu phải chưa khoá. Tham số
        được phát hành cùng Policy Pack. Lần lưu đầu dùng `If-Match: "0"` (suy luận).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowBindingUpdate' }
      responses:
        '200':
          description: Đã lưu, kèm kết quả linter và test mẫu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowBinding' }
              examples:
                ho-so-danh-gia:
                  $ref: '#/components/examples/WorkflowBindingHoSo'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: 'Xung đột. Mã lỗi: `POLICY-409-VERSION-CONFLICT`, `POLICY-409-VERSION-FROZEN`, `POLICY-409-PERIOD-LOCKED` (kỳ bắt đầu đã khoá).'
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422':
          description: |
            Không hợp lệ. Mã lỗi: `POLICY-422-WF-PARAMS` (MSG-15-09: tham số sai khai báo mẫu, linter hoặc test mẫu
            không đạt), `POLICY-422-CEL-TYPE` (điều kiện bỏ qua cấp), `POLICY-422-TEMPLATE-NOT-ACTIVE` (mẫu chưa
            `HIEU_LUC`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1504]
        owner: MOD-05
        roles: [policy_author]
        scope: Tn
        rules: [BR-15-11, BR-15-12]
        source: TL-02b SCR-1504 "Lưu tham số"

  /policies/workflow-bindings/simulate:
    post:
      tags: [Luồng duyệt]
      operationId: simulateWorkflowBinding
      summary: Mô phỏng luồng với tham số
      description: |
        Chạy mẫu với tham số trên engine Flowable thử (không phải engine của cell) cho một số hồ sơ mẫu, trả xem
        trước các bước sinh ra, nhãn linter và kết quả test của mẫu. Không ghi `wf_binding`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowSimulateRequest' }
      responses:
        '200':
          description: Kết quả mô phỏng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowSimulateResult' }
              examples:
                bon-cap:
                  value:
                    steps:
                      - { stepKey: TU_DANH_GIA, name: Tự đánh giá, role: member, signRequired: true, batchSign: false, skippable: false }
                      - { stepKey: THAM_DINH, name: Thẩm định, role: appraiser, signRequired: true, batchSign: false, skippable: false }
                      - { stepKey: DE_XUAT, name: Đề xuất, role: manager, signRequired: false, batchSign: false, skippable: true }
                      - { stepKey: QUYET_DINH, name: Quyết định, role: decider, signRequired: true, batchSign: true, skippable: false }
                    lint:
                      passed: true
                      issues: []
                    templateTests: { passed: 42, total: 42 }
                    sampleRuns:
                      - { sample: 'Chuyên viên, mức thẩm định bằng mức tự đề xuất', skippedSteps: [DE_XUAT], endState: KHOA_HO_SO }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422':
          description: 'Không hợp lệ. Mã lỗi: `POLICY-422-WF-PARAMS` (MSG-15-09).'
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1504]
        owner: MOD-05
        roles: [policy_author]
        scope: Tn
        rules: [BR-15-12]
        source: TL-02b SCR-1504 "Mô phỏng luồng"

  # ───────────────────────────── Mẫu luồng (SCR-1504, SCR-1505, SCR-1506) ─────────────────────────────
  /policies/workflow-templates:
    get:
      tags: [Mẫu luồng]
      operationId: listPolicyWorkflowTemplates
      summary: Danh mục mẫu luồng để chọn khi cấu hình luồng duyệt
      description: |
        Danh mục mẫu luồng đã phát hành (`HIEU_LUC`) phù hợp loại quy trình, cho vùng 1 của SCR-1504. Chỉ đọc. Thư
        viện đầy đủ mọi trạng thái, trình soạn, kiểm thử, phê duyệt, triển khai mẫu (SCR-1505) và giám sát tiến
        trình (SCR-1506) thuộc workflow-service ở `/workflow/templates`, `/workflow/instances` (platform.yaml, PC-05).
      parameters:
        - name: processKind
          in: query
          description: Lọc theo loại quy trình mà mẫu phục vụ (suy luận).
          schema: { type: string, maxLength: 32 }
        - $ref: '../common/common.yaml#/components/parameters/Q'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Trang danh mục mẫu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyWorkflowTemplateList' }
              examples:
                thu-vien:
                  value:
                    items:
                      - key: duyet-ho-so-danh-gia
                        name: Duyệt hồ sơ đánh giá
                        versionNo: 3
                        status: HIEU_LUC
                        processKind: DANH_GIA
                        testCount: 42
                      - key: duyet-ke-hoach-quy
                        name: Duyệt kế hoạch quý
                        versionNo: 2
                        status: HIEU_LUC
                        processKind: KE_HOACH_QUY
                        testCount: 28
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1504]
        owner: MOD-05
        roles: [policy_author]
        scope: Tn
        source: TL-02b part-06 `/api/v1/policies/workflow-templates`; SCR-1504 vùng 1, bảng trường dòng 1 (PC-05)
  /policies/workflow-templates/{key}/versions/{v}:
    parameters:
      - $ref: '#/components/parameters/TemplateKey'
      - $ref: '#/components/parameters/TemplateVersion'
    get:
      tags: [Mẫu luồng]
      operationId: getPolicyWorkflowTemplateVersion
      summary: Tải khai báo tham số của mẫu luồng
      description: |
        Trả khai báo tham số (`paramSchema`, JSON Schema, cột `param_schema` của BS-01) để sinh biểu mẫu tham số
        trên SCR-1504, cùng các bước xem trước của mẫu. Không trả BPMN XML (chỉ có ở `/workflow/templates/{id}`
        cho phạm vi nền tảng).
      responses:
        '200':
          description: Phiên bản mẫu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyWorkflowTemplateVersion' }
              examples:
                v3:
                  $ref: '#/components/examples/PolicyWorkflowTemplateV3'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1504]
        owner: MOD-05
        roles: [policy_author]
        scope: Tn
        source: TL-02b SCR-1504 "Chọn mẫu" `GET /api/v1/policies/workflow-templates/{key}/versions/{v}`

components:
  securitySchemes:
    keycloak:
      $ref: '../common/common.yaml#/components/securitySchemes/keycloak'
    serviceClient:
      $ref: '../common/common.yaml#/components/securitySchemes/serviceClient'
  parameters:
    PackId:
      name: id
      in: path
      required: true
      description: Gói Policy Pack (`policy.policy_pack.id`).
      schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    PackVersion:
      name: v
      in: path
      required: true
      description: Số phiên bản semver ba phần của gói (`policy_pack_version.version`, PC-03).
      schema: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$', examples: ['2.1.0'] }
    RuleKey:
      name: key
      in: path
      required: true
      description: Khoá quy tắc `rule_key`, ví dụ `kpi_nhiem_vu`, `A`, `muc_cuoi`, `nguoi_dung_dau`, `nhom`.
      schema: { type: string, pattern: '^[A-Za-z0-9_.]{1,64}$' }
    TableKey:
      name: key
      in: path
      required: true
      description: Khoá bảng quyết định `table_key`, ví dụ `xep_loai`, `tieu_chi_chung`.
      schema: { type: string, pattern: '^[A-Za-z0-9_.]{1,64}$' }
    RunId:
      name: runId
      in: path
      required: true
      description: Lần chạy kiểm thử (`policy.test_run.id`).
      schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    ProcessKind:
      name: key
      in: path
      required: true
      description: Loại quy trình của `wf_binding` (`process_kind`), ví dụ `DANH_GIA`, `KE_HOACH_QUY` (suy luận khoá).
      schema: { type: string, pattern: '^[A-Z0-9_]{1,32}$' }
    TemplateKey:
      name: key
      in: path
      required: true
      description: Mã mẫu luồng (`wf_template.template_code`), ví dụ `duyet-ho-so-danh-gia`.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' }
    TemplateVersion:
      name: v
      in: path
      required: true
      description: Số phiên bản mẫu (`wf_template.version_no`).
      schema: { type: integer, minimum: 1 }

  schemas:
    # ───── Liệt kê ─────
    PolicyPackVersionStatus:
      description: Trạng thái phiên bản Policy Pack (baseline mục 9.1; CHECK `ck_policy_pack_version__status`).
      type: string
      enum: [NHAP, DANG_KIEM_THU, DAT_KIEM_THU, CHO_PHE_DUYET, DA_PHAT_HANH, NGUNG]
    PolicyPackOrigin:
      description: Nguồn gói (`policy_pack.origin`).
      type: string
      enum: [GOC_TOAN_CUC, TENANT]
    PolicyRuleResultType:
      description: Kiểu kết quả của quy tắc (`policy_rule.result_type`).
      type: string
      enum: [DECIMAL, BOOLEAN, STRING]
    DecisionHitPolicy:
      description: Hit policy DMN 1.4 được hỗ trợ (`decision_table.hit_policy`).
      type: string
      enum: [FIRST, UNIQUE, PRIORITY]
    GoldenTestCaseStatus:
      description: Trạng thái ca kiểm thử vàng; chỉ ca `DA_DUYET` được tính vào tỷ lệ đạt.
      type: string
      enum: [NHAP, DA_DUYET, NGUNG]
    GoldenTestCaseSource:
      description: Nguồn ca kiểm thử (`golden_test_case.source`).
      type: string
      enum: [KHACH_HANG, BA, VAN_BAN]
    PolicyTestRunResult:
      description: Kết luận lần chạy (`test_run.result`).
      type: string
      enum: [DAT, KHONG_DAT, DANG_CHAY]
    PolicyEngine:
      description: Engine thực thi CEL (`test_run.engine`).
      type: string
      enum: [CEL_JAVA, CEL_JS]
    PolicyProspectGroupCode:
      description: Mã nhóm triển vọng (`appraisal.prospect_group.group_code`, PL 5).
      type: string
      enum: [NHOM_1, NHOM_2, NHOM_3, NHOM_4]
    WorkflowBindingStatus:
      description: Trạng thái bản ghi `wf_binding` (cột bổ sung của BS-01).
      type: string
      enum: [NHAP, HIEU_LUC, NGUNG]
    # ───── Gói và phiên bản ─────
    PolicyPack:
      description: Gói Policy Pack (`policy.policy_pack`) kèm tóm tắt phiên bản.
      type: object
      required: [id, code, name, flow, origin]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 100, description: 'Mã gói, ví dụ `khoi-dang/quy-dinh-moi`.' }
        name: { type: string, maxLength: 255 }
        sector: { type: string, maxLength: 24, description: Nhóm khách hàng. }
        flow: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        origin: { $ref: '#/components/schemas/PolicyPackOrigin' }
        parentPackId:
          description: Gói được kế thừa.
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
            - type: 'null'
        legalBasis: { type: string, description: Văn bản căn cứ. }
        versions:
          description: Tóm tắt các phiên bản gần nhất, mới nhất trước (suy luận số lượng do máy chủ chọn).
          type: array
          items: { $ref: '#/components/schemas/PolicyPackVersionSummary' }
    PolicyPackList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PolicyPack' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    PolicyPackVersionSummary:
      description: Tóm tắt một phiên bản (`policy.policy_pack_version`).
      type: object
      required: [id, policyPackId, version, status, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        policyPackId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
        status: { $ref: '#/components/schemas/PolicyPackVersionStatus' }
        effectiveFrom:
          description: Ngày bắt đầu của kỳ hiệu lực.
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Date'
            - type: 'null'
        goldenPassRate:
          description: Tỷ lệ ca vàng đạt của lần chạy gần nhất, 1 nghĩa là 100%.
          type: [number, 'null']
          minimum: 0
          maximum: 1
        publishedAt:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/DateTime'
            - type: 'null'
        changeNote: { type: string, description: Ghi chú thay đổi. }
        createdAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        createdBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    PolicyPackVersionList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PolicyPackVersionSummary' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    PolicyPackVersion:
      description: Chi tiết phiên bản Policy Pack.
      allOf:
        - $ref: '#/components/schemas/PolicyPackVersionSummary'
        - type: object
          properties:
            packCode: { type: string, description: 'Mã gói, để hiển thị thanh gói.' }
            manifest: { $ref: '#/components/schemas/PolicyManifest' }
            contentHash:
              description: SHA-256 dạng chuẩn hoá của quy tắc, DMN và manifest, mã hex; có từ `DAT_KIEM_THU`.
              type: [string, 'null']
            lastTestRunId:
              oneOf:
                - $ref: '../common/common.yaml#/components/schemas/Uuid'
                - type: 'null'
            approvedBy:
              oneOf:
                - $ref: '../common/common.yaml#/components/schemas/Ref'
                - type: 'null'
            approvedAt:
              oneOf:
                - $ref: '../common/common.yaml#/components/schemas/DateTime'
                - type: 'null'
            signedAt:
              oneOf:
                - $ref: '../common/common.yaml#/components/schemas/DateTime'
                - type: 'null'
            sourceVersionId:
              description: Phiên bản gốc toàn cục nếu nhân bản từ kho gốc.
              oneOf:
                - $ref: '../common/common.yaml#/components/schemas/Uuid'
                - type: 'null'
            bindings:
              description: Các gắn kỳ hiệu lực (`policy.policy_binding`).
              type: array
              items: { $ref: '#/components/schemas/PolicyBinding' }
    PolicyPackVersionCreate:
      type: object
      required: [baseVersion, changeNote]
      properties:
        baseVersion:
          description: Phiên bản nguồn để nhân bản (thường là phiên bản đang phát hành).
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        version:
          description: Số phiên bản mới; bỏ trống thì máy chủ tăng số phụ (suy luận).
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        changeNote: { type: string, minLength: 1, maxLength: 2000 }
    PolicyBinding:
      description: Gắn phiên bản cho tổ hợp tenant, kỳ, luồng, khối, đơn vị (`policy.policy_binding`).
      type: object
      required: [id, period, flow, isFrozen]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        flow: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        subjectGroupId:
          description: Khối đối tượng; null là mọi khối.
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
            - type: 'null'
        orgUnitId:
          description: Đơn vị phạm vi; null là toàn tenant.
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
            - type: 'null'
        isFrozen: { type: boolean, description: 'true khi kỳ đã `DA_KHOA`; không đổi phiên bản được nữa.' }
    PolicyVersionDiff:
      type: object
      required: [base, target, changes]
      properties:
        base: { type: string }
        target: { type: string }
        changes:
          type: array
          items:
            type: object
            required: [kind, key]
            properties:
              kind:
                description: Loại thành phần thay đổi (suy luận).
                type: string
                enum: [RULE, PARAM, DECISION_TABLE, WORKFLOW_BINDING, MANIFEST]
              key: { type: string, description: '`rule_key`, `table_key` hoặc `process_kind`.' }
              path: { type: string, description: 'Đường dẫn trường trong thành phần, dạng chấm.' }
              change:
                type: string
                enum: [THEM, SUA, XOA]
                description: Kiểu thay đổi (suy luận).
              before: { description: Giá trị cũ. }
              after: { description: Giá trị mới. }

    # ───── Quy tắc và bảng quyết định ─────
    PolicyManifest:
      description: >-
        Manifest của phiên bản (`manifest`): tham số chung, quy tắc làm tròn, nhãn hiển thị, tham chiếu điều khoản.
        Các khoá đã biết dưới đây phục vụ SCR-1501 (nhãn khối và ghi chú nguồn dữ liệu ở vùng 1) và SCR-1502
        (trường 8 "mọi biến phải tồn tại trong ngữ cảnh"); khoá khác được giữ nguyên.
      type: object
      additionalProperties: true
      properties:
        labels:
          type: object
          description: Nhãn hiển thị theo `ruleKey` hoặc khoá nhóm, ví dụ `kpi_nhiem_vu` → "KPI nhiệm vụ".
          additionalProperties: { type: string }
        notes:
          type: object
          description: Ghi chú nguồn dữ liệu theo `ruleKey`, hiện dưới thẻ biểu thức A, B, C.
          additionalProperties: { type: string }
        variables:
          type: array
          description: >-
            Biến ngữ cảnh khai báo cho biểu thức CEL và mẫu câu giải thích; dùng để gợi ý khi soạn và để kiểm biến
            chưa khai báo (MSG-15-05). Máy chủ vẫn kiểm lại khi lưu.
          items:
            type: object
            required: [name]
            properties:
              name: { type: string, maxLength: 64, examples: [ngay_cham_chu_quan] }
              label: { type: string, maxLength: 200 }
        lam_tron: { $ref: '#/components/schemas/PolicyRoundingParam' }
        ke_thua: { type: string, description: 'Dòng kế thừa, ví dụ "QĐ 366 v1.4 → dự thảo Quy định mới v2.x".' }
    PolicyRoundingMode:
      description: >-
        Kiểu làm tròn (SCR-1501 trường 8). TL-02b chỉ nêu "nửa lên" (BR-09-03); `CAT_BO` (bỏ phần thừa) là suy luận
        cho lựa chọn còn lại.
      type: string
      enum: [NUA_LEN, CAT_BO]
    PolicyRoundingParam:
      description: Quy tắc làm tròn dạng tham số của gói (`tham_so.lam_tron` trong TL-02b SCR-1501).
      type: object
      required: [chu_so, kieu]
      properties:
        chu_so: { type: integer, minimum: 0, maximum: 6 }
        kieu: { $ref: '#/components/schemas/PolicyRoundingMode' }
    PolicyQualityMethod:
      description: Cách tính chất lượng (SCR-1501 trường 4).
      type: string
      enum: [NAM_MUC_PL3, TRU_25_MOI_LAN]
    PolicyDayType:
      description: Loại ngày tính chậm (SCR-1501 trường 6).
      type: string
      enum: [NGAY_LAM_VIEC, NGAY_LICH]
    PolicyReturnReasonMode:
      description: >-
        Lý do trả lại tính vào chất lượng (SCR-1501 trường 7, "ba lựa chọn", mặc định "chỉ lý do cốt lõi"). TL-02b
        chỉ nêu tên lựa chọn mặc định; hai mã còn lại là suy luận: `TAT_CA` mọi lý do trả lại, `KHONG_TINH` không
        tính lý do trả lại vào chất lượng.
      type: string
      enum: [CHI_COT_LOI, TAT_CA, KHONG_TINH]
    PolicyRounding:
      description: Quy tắc làm tròn (`policy_rule.rounding`).
      type: object
      required: [digits, mode]
      properties:
        digits: { type: integer, minimum: 0, maximum: 6 }
        mode: { $ref: '#/components/schemas/PolicyRoundingMode' }
    PolicyRule:
      description: Quy tắc CEL (`policy.policy_rule`).
      type: object
      required: [id, ruleKey, expression, resultType, evalOrder, overridable, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        ruleKey: { type: string, maxLength: 64 }
        expression: { type: string, description: Biểu thức CEL. }
        resultType: { $ref: '#/components/schemas/PolicyRuleResultType' }
        rounding: { $ref: '#/components/schemas/PolicyRounding' }
        legalRef: { type: string, maxLength: 200, description: 'Điều khoản căn cứ, ví dụ "PL 3 mục 2".' }
        evalOrder: { type: integer, description: Thứ tự đánh giá. }
        params:
          description: |
            Tham số của quy tắc (`params_json`), khoá là tên biến CEL. Khoá đã biết (TL-02b SCR-1501):
            `cach_tinh_chat_luong` (`PolicyQualityMethod`), `tru_tien_do` (0,00 đến 0,20),
            `loai_ngay` (`PolicyDayType`), `ly_do_tra_lai` (`PolicyReturnReasonMode`), `lam_tron`
            (`PolicyRoundingParam`), `diem_toi_da` (quy tắc `nhom`), `nam.cach_tinh`, `phan_nhom.mo_o_ky_quy`.
          type: object
          additionalProperties: true
        overridable: { type: boolean, description: Tenant được điều chỉnh tham số của quy tắc này (BR-15-13). }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    PolicyRuleUpdate:
      type: object
      required: [expression, resultType]
      properties:
        expression: { type: string, minLength: 1, maxLength: 20000 }
        resultType: { $ref: '#/components/schemas/PolicyRuleResultType' }
        rounding: { $ref: '#/components/schemas/PolicyRounding' }
        legalRef: { type: string, maxLength: 200 }
        evalOrder: { type: integer }
        params:
          type: object
          additionalProperties: true
        overridable: { type: boolean, description: Chỉ có nghĩa với gói gốc toàn cục. }
    PolicyRuleSaved:
      description: Quy tắc sau khi lưu, kèm trạng thái phiên bản.
      allOf:
        - $ref: '#/components/schemas/PolicyRule'
        - type: object
          required: [versionStatus, statusReverted]
          properties:
            versionStatus: { $ref: '#/components/schemas/PolicyPackVersionStatus' }
            statusReverted: { type: boolean, description: 'true khi phiên bản vừa từ `DAT_KIEM_THU` về `NHAP` (MSG-15-03).' }
    DecisionInput:
      description: Khai báo cột đầu vào của bảng (suy luận từ bảng trường SCR-1502).
      type: object
      required: [name, type]
      properties:
        name: { type: string, description: 'Tên biến ngữ cảnh, ví dụ `diem`, `ty_le_viec_vuot`.' }
        label: { type: string }
        type: { type: string, enum: [number, string, boolean], description: Kiểu dữ liệu FEEL. }
    DecisionRule:
      description: Một dòng của bảng DMN (`rules_json`).
      type: object
      required: [inputs, ratingLevel, clause, explanation]
      properties:
        inputs:
          description: Biểu thức FEEL đơn giản theo tên cột; ô trống (`-` hoặc bỏ khoá) nghĩa là bất kỳ.
          type: object
          additionalProperties: { type: string }
        ratingLevel: { $ref: '../common/common.yaml#/components/schemas/RatingLevel' }
        clause: { type: string, minLength: 1, maxLength: 100, description: Điều khoản căn cứ. }
        explanation: { type: string, minLength: 1, maxLength: 200, description: Giải thích ngắn. }
    DecisionTable:
      description: Bảng quyết định DMN 1.4 (`policy.decision_table`).
      type: object
      required: [id, tableKey, hitPolicy, inputs, rules, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        tableKey: { type: string, maxLength: 64 }
        hitPolicy: { $ref: '#/components/schemas/DecisionHitPolicy' }
        legalRef: { type: string, maxLength: 200 }
        inputs:
          type: array
          items: { $ref: '#/components/schemas/DecisionInput' }
        rules:
          type: array
          items: { $ref: '#/components/schemas/DecisionRule' }
        explanationTemplates:
          description: Mẫu câu giải thích (`explanation_templates_json`), khoá là mã mẫu; mỗi mẫu tối đa 1.000 ký tự.
          type: object
          additionalProperties: { type: string, maxLength: 1000 }
        dmnHash: { type: string, description: 'Băm định nghĩa DMN, mã hex.' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    DecisionTableUpdate:
      type: object
      required: [hitPolicy, inputs, rules]
      properties:
        hitPolicy: { $ref: '#/components/schemas/DecisionHitPolicy' }
        legalRef: { type: string, maxLength: 200 }
        inputs:
          type: array
          items: { $ref: '#/components/schemas/DecisionInput' }
        rules:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/DecisionRule' }
        explanationTemplates:
          type: object
          additionalProperties: { type: string, maxLength: 1000 }
    DecisionTableSaved:
      allOf:
        - $ref: '#/components/schemas/DecisionTable'
        - type: object
          properties:
            warnings:
              description: Cảnh báo không chặn lưu, ví dụ dòng bị che theo hit policy FIRST (MSG-15-04).
              type: array
              items:
                type: object
                required: [msg, message]
                properties:
                  msg: { type: string, examples: [MSG-15-04] }
                  message: { type: string }
                  row: { type: integer, minimum: 1 }
                  shadowedBy: { type: integer, minimum: 1 }
    PolicyEvaluateRequest:
      type: object
      required: [caseCode]
      properties:
        caseCode: { type: string, maxLength: 64, description: 'Mã ca trong bộ vàng (chỉ ca của bộ vàng, SCR-1501 dòng 10).' }
    PolicyEvaluateOutputs:
      description: >-
        Giá trị các quy tắc theo `rule_key`. Khoá cấu trúc dưới đây phục vụ thẻ xem trước SCR-1501 vùng 4 (KPI từng
        nhiệm vụ, điểm từng nhóm, điểm tổng); các `rule_key` khác trả kèm theo tên của chúng.
      type: object
      additionalProperties: true
      properties:
        diem: { type: number, description: 'Điểm kết quả nhiệm vụ (`diem_ket_qua`, BR-09-03).' }
        nhom:
          type: array
          description: Kết quả từng nhóm nhiệm vụ.
          items:
            type: object
            required: [key, kpi_nhom, diem_toi_da, diem]
            properties:
              key: { type: string, examples: [then_chot] }
              kpi_nhom: { type: number, minimum: 0, maximum: 1 }
              diem_toi_da: { type: number }
              diem: { type: number }
        nhiem_vu:
          type: array
          description: Kết quả từng nhiệm vụ của ca kiểm thử.
          items:
            type: object
            required: [ma, kpi_nhiem_vu]
            properties:
              ma: { type: string, description: Mã nhiệm vụ trong dữ liệu ca }
              nhom: { type: string, description: Khoá nhóm }
              A: { type: number, minimum: 0, maximum: 1 }
              B: { type: number, minimum: 0, maximum: 1 }
              C: { type: number, minimum: 0, maximum: 1 }
              kpi_nhiem_vu: { type: number, minimum: 0, maximum: 1 }
    PolicyEvaluateResult:
      type: object
      required: [caseCode, engine, outputs]
      properties:
        caseCode: { type: string }
        engine: { $ref: '#/components/schemas/PolicyEngine' }
        outputs: { $ref: '#/components/schemas/PolicyEvaluateOutputs' }
        ratingLevel: { $ref: '../common/common.yaml#/components/schemas/RatingLevel' }
        explanation: { type: string, description: Lời giải thích sinh từ mẫu câu. }
        trace:
          description: Vết tính theo thứ tự đánh giá.
          type: array
          items:
            type: object
            required: [ruleKey]
            properties:
              ruleKey: { type: string }
              value: { description: Giá trị tính được. }

    # ───── Kiểm thử ─────
    GoldenTestCase:
      description: Ca kiểm thử vàng (`policy.golden_test_case`), gắn với gói.
      type: object
      required: [id, policyPackId, caseCode, description, input, expected, source, status, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        policyPackId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        caseCode: { type: string, maxLength: 64 }
        description: { type: string }
        input:
          description: Dữ liệu đầu vào giả lập (C1, không chứa dữ liệu cá nhân thật).
          type: object
          additionalProperties: true
        expected:
          description: Kết quả mong đợi (điểm, mức, lý do hạ mức).
          type: object
          additionalProperties: true
        legalRef: { type: [string, 'null'], maxLength: 200 }
        source: { $ref: '#/components/schemas/GoldenTestCaseSource' }
        status: { $ref: '#/components/schemas/GoldenTestCaseStatus' }
        note: { type: string, description: 'Ghi chú sai lệch khi kỳ vọng còn tranh cãi (TL-02b QT-15 ngoại lệ, suy luận).' }
        approvedBy:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Ref'
            - type: 'null'
        approvedAt:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/DateTime'
            - type: 'null'
        signed: { type: boolean, description: Đã có chữ ký số trên `input` và `expected`. }
        createdBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    GoldenTestCaseCreate:
      type: object
      required: [policyPackId, caseCode, description, input, expected, source]
      properties:
        policyPackId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        caseCode: { type: string, minLength: 1, maxLength: 64 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        input:
          type: object
          additionalProperties: true
        expected:
          type: object
          additionalProperties: true
        legalRef: { type: string, maxLength: 200 }
        source: { $ref: '#/components/schemas/GoldenTestCaseSource' }
        note: { type: string, maxLength: 2000 }
    GoldenTestSuite:
      description: Tóm tắt bộ test vàng của gói (SCR-1503 dòng 1; suy luận vì TL-03 không có bảng bộ test).
      type: object
      required: [total]
      properties:
        code: { type: string, examples: [bo-ca-mau-ban-to-chuc-v3] }
        total: { type: integer, minimum: 0, description: Số ca `DA_DUYET`. }
        pending: { type: integer, minimum: 0, description: Số ca chờ ký duyệt. }
        approvedBy: { type: string, description: Tên cơ quan hoặc người ký duyệt bộ. }
        approvedAt:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/DateTime'
            - type: 'null'
    GoldenTestCaseList:
      type: object
      required: [items, nextCursor]
      properties:
        suite: { $ref: '#/components/schemas/GoldenTestSuite' }
        items:
          type: array
          items: { $ref: '#/components/schemas/GoldenTestCase' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    PolicyTestRunCreate:
      type: object
      properties:
        compareWithVersion:
          description: Phiên bản dùng để so sánh tác động (PC-06, suy luận).
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        propertyDatasets:
          description: Số bộ dữ liệu ngẫu nhiên cho kiểm thử thuộc tính (suy luận tham số).
          type: integer
          minimum: 0
          maximum: 100000
          default: 10000
    PolicyTestRunSummary:
      description: Tóm tắt lần chạy (`policy.test_run`).
      type: object
      required: [id, policyPackVersionId, version, result, total, passed, failed, engineMatch, startedAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        runNo: { type: integer, minimum: 1, description: 'Số thứ tự lần chạy trong gói, ví dụ #14 (suy luận).' }
        policyPackVersionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        version: { type: string }
        result: { $ref: '#/components/schemas/PolicyTestRunResult' }
        engines:
          type: array
          items: { $ref: '#/components/schemas/PolicyEngine' }
        total: { type: integer, minimum: 0 }
        passed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        engineMatch: { type: boolean, description: cel-java và cel-js cho cùng kết quả ở mọi ca. }
        engineMatchedCount: { type: integer, minimum: 0, description: 'Số ca hai engine khớp (thẻ "Khớp hai engine", suy luận).' }
        startedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        finishedAt:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/DateTime'
            - type: 'null'
        durationMs: { type: [integer, 'null'], minimum: 0 }
        createdBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
    PolicyTestRunList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PolicyTestRunSummary' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    PolicyTestCaseResult:
      description: Kết quả một ca (`policy.test_case_result`).
      type: object
      required: [goldenTestCaseId, caseCode, passed]
      properties:
        goldenTestCaseId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        caseCode: { type: string }
        description: { type: string }
        expected:
          type: object
          additionalProperties: true
        actual:
          description: Kết quả cel-java.
          type: object
          additionalProperties: true
        actualJs:
          description: Kết quả cel-js khi khác cel-java (MSG-15-07).
          type: [object, 'null']
          additionalProperties: true
        passed: { type: boolean }
        engineMatch: { type: boolean }
        diff:
          description: Khác biệt so với mong đợi.
          type: [object, 'null']
          additionalProperties: true
    PolicyPropertyResult:
      description: Kết quả kiểm thử thuộc tính (`property_result_json`).
      type: object
      required: [datasets, violations]
      properties:
        datasets: { type: integer, minimum: 0 }
        invariants:
          type: array
          items: { type: string }
          examples: [['0 <= diem && diem <= 100', 'C >= 0']]
        violations: { type: integer, minimum: 0 }
    PolicyImpact:
      description: So sánh tác động với một phiên bản khác trên bộ ca (PC-06, suy luận).
      type: object
      required: [baseVersion, changedRatingCount]
      properties:
        baseVersion: { type: string }
        changedScoreCount: { type: integer, minimum: 0, description: Số ca có điểm khác. }
        changedRatingCount: { type: integer, minimum: 0, description: Số ca có mức xếp loại khác. }
        lockedPeriodNote: { type: string, description: 'Ghi chú tính lại kỳ đã khoá, ví dụ "Không áp dụng".' }
    PolicyTestRun:
      description: Kết quả đầy đủ một lần chạy.
      allOf:
        - $ref: '#/components/schemas/PolicyTestRunSummary'
        - type: object
          properties:
            propertyResult: { $ref: '#/components/schemas/PolicyPropertyResult' }
            cases:
              type: array
              items: { $ref: '#/components/schemas/PolicyTestCaseResult' }
            configDiff:
              description: Khác biệt cấu hình so với lần chạy trước (thẻ chi tiết lỗi SCR-1503).
              oneOf:
                - $ref: '#/components/schemas/PolicyVersionDiff'
                - type: 'null'
            impact:
              oneOf:
                - $ref: '#/components/schemas/PolicyImpact'
                - type: 'null'

    # ───── Phê duyệt và phát hành ─────
    PolicyPackSubmit:
      type: object
      required: [effectivePeriodId, scopes]
      properties:
        effectivePeriodId:
          description: Kỳ hiệu lực trong tương lai, chưa khoá (BR-15-10).
          allOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
        scopes:
          description: Phạm vi áp dụng; mỗi phần tử sinh một `policy_binding` khi phát hành.
          type: array
          minItems: 1
          items:
            type: object
            required: [flow]
            properties:
              flow: { $ref: '../common/common.yaml#/components/schemas/Flow' }
              subjectGroupId:
                oneOf:
                  - $ref: '../common/common.yaml#/components/schemas/Uuid'
                  - type: 'null'
              orgUnitId:
                oneOf:
                  - $ref: '../common/common.yaml#/components/schemas/Uuid'
                  - type: 'null'
        note: { type: string, maxLength: 2000 }
    PolicyPackApprove:
      type: object
      properties:
        comment: { type: string, maxLength: 2000 }
        esignSessionId:
          description: Phiên ký số đã mở ở SVC-10 (`/esign`), nếu ký từ xa cần xác nhận trên thiết bị (suy luận).
          allOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
    PolicyDecisionReason:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 2000, description: Ý kiến bắt buộc. }
    PolicyDecisionComment:
      type: object
      properties:
        comment: { type: string, maxLength: 2000 }

    # ───── Phân giải và tra cứu ─────
    ResolvedPolicyPack:
      type: object
      required: [policyPackId, code, versionId, version, contentHash, bindingId, frozen]
      properties:
        policyPackId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string }
        versionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        version: { type: string }
        contentHash: { type: string, description: 'SHA-256 đã ký, mã hex; bên gọi tính lại và so trước khi dùng.' }
        bundleObjectKey: { type: string, description: Khoá gói đã ký trên Ceph của cell. }
        bindingId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        frozen: { type: boolean, description: 'Kỳ đã khoá, phiên bản không đổi được nữa.' }
    ProspectCriteria:
      type: object
      required: [policyPackId, version, openInQuarter, groups]
      properties:
        policyPackId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        version: { type: string }
        openInQuarter: { type: boolean, description: 'Tham số `phan_nhom.mo_o_ky_quy` (BR-10-07).' }
        legalRef: { type: string }
        groups:
          type: array
          items:
            type: object
            required: [groupCode, name, criteria]
            properties:
              groupCode: { $ref: '#/components/schemas/PolicyProspectGroupCode' }
              name: { type: string }
              criteria: { type: string, description: Tiêu chí theo PL 5. }
              excludedRatingLevels:
                description: Mức xếp loại năm không được đưa vào nhóm (BR-10-09).
                type: array
                items: { $ref: '../common/common.yaml#/components/schemas/RatingLevel' }
              excludeReassignmentFlag: { type: boolean, description: Người có cờ bố trí lại không được vào nhóm (BR-10-09). }

    # ───── Luồng duyệt ─────
    WorkflowLintResult:
      description: Kết quả linter mẫu luồng (bốn quy tắc chống mạng nhện của TL-01 và giới hạn tải của BS-01).
      type: object
      required: [passed, issues]
      properties:
        passed: { type: boolean }
        issues:
          type: array
          items:
            type: object
            required: [rule, message]
            properties:
              rule: { type: string, description: 'Mã quy tắc linter, ví dụ `max-call-activity-depth`.' }
              elementId: { type: string, description: Phần tử BPMN vi phạm. }
              severity: { type: string, enum: [error, warning] }
              message: { type: string }
    WorkflowTestSummary:
      type: object
      required: [passed, total]
      properties:
        passed: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }
    WorkflowBindingScope:
      description: Phạm vi áp dụng (`scope_json` và các cột khoá của `wf_binding`).
      type: object
      required: [fromPeriodId]
      properties:
        flow: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        subjectGroupId:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
            - type: 'null'
        periodType: { type: string, maxLength: 8, description: 'Loại kỳ, ví dụ `QUY`, `NAM`.' }
        fromPeriodId:
          description: Kỳ bắt đầu, phải chưa khoá.
          allOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
    WorkflowBinding:
      description: Tham số luồng duyệt theo mẫu (`flowable.wf_binding`).
      type: object
      required: [id, processKind, templateKey, templateVersionNo, scope, params, status, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        processKind: { type: string, maxLength: 32 }
        templateKey: { type: string }
        templateVersionNo: { type: integer, minimum: 1 }
        scope: { $ref: '#/components/schemas/WorkflowBindingScope' }
        params:
          description: Tham số truyền vào tiến trình (`params_json`), hợp lệ theo `paramSchema` của mẫu.
          type: object
          additionalProperties: true
        status: { $ref: '#/components/schemas/WorkflowBindingStatus' }
        versionNo: { type: integer, minimum: 1, description: Phiên bản bản ghi (BS-01). }
        lint: { $ref: '#/components/schemas/WorkflowLintResult' }
        templateTests: { $ref: '#/components/schemas/WorkflowTestSummary' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    WorkflowBindingUpdate:
      type: object
      required: [templateKey, templateVersionNo, scope, params]
      properties:
        templateKey: { type: string, maxLength: 64 }
        templateVersionNo: { type: integer, minimum: 1 }
        scope: { $ref: '#/components/schemas/WorkflowBindingScope' }
        params:
          type: object
          additionalProperties: true
    WorkflowSimulateRequest:
      type: object
      required: [templateKey, templateVersionNo, params]
      properties:
        templateKey: { type: string, maxLength: 64 }
        templateVersionNo: { type: integer, minimum: 1 }
        params:
          type: object
          additionalProperties: true
        samples:
          description: Mã hồ sơ mẫu dùng để chạy thử; bỏ trống thì dùng bộ mẫu mặc định của mẫu luồng (suy luận).
          type: array
          maxItems: 20
          items: { type: string }
    WorkflowStepPreview:
      type: object
      required: [stepKey, name]
      properties:
        stepKey: { type: string }
        name: { type: string }
        role: { type: string, description: Vai trò baseline mục 10 xử lý bước. }
        signRequired: { type: boolean }
        batchSign: { type: boolean }
        skippable: { type: boolean, description: Bước có điều kiện bỏ qua. }
    WorkflowSimulateResult:
      type: object
      required: [steps, lint]
      properties:
        steps:
          type: array
          items: { $ref: '#/components/schemas/WorkflowStepPreview' }
        lint: { $ref: '#/components/schemas/WorkflowLintResult' }
        templateTests: { $ref: '#/components/schemas/WorkflowTestSummary' }
        sampleRuns:
          type: array
          items:
            type: object
            required: [sample, endState]
            properties:
              sample: { type: string }
              skippedSteps:
                type: array
                items: { type: string }
              endState: { type: string }

    # ───── Mẫu luồng (chỉ đọc cho SCR-1504) ─────
    PolicyWorkflowTemplateSummary:
      description: Một mẫu luồng đã phát hành trong danh mục chọn mẫu của SCR-1504 (`flowable.wf_template`).
      type: object
      required: [key, versionNo, status]
