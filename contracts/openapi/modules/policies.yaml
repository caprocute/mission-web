# Hợp đồng OpenAPI 3.1 của MOD-05 `policy` (WEB-063, ADR-32 trong BS-02).
# Nguồn:
#   - Baseline mục 9 (EVT-13, EVT-18, EVT-21), 9.1 (trạng thái phiên bản Policy Pack), 10 (AC-01..AC-12), 13 (quy ước API).
#   - TL-01 Phụ lục C mục "Policy Pack (MOD-05)" (part-14 dòng 437-442); TL-01 part-05a dòng 447 (tiền tố /api/v1/policies).
#   - TL-02b QT-15 (part-04): bảng bước, trạng thái, BR-15-01..BR-15-14, SCR-1501, SCR-1502, SCR-1503, SCR-1504
#     (bảng trường, bảng chức năng, MSG-15-01..MSG-15-10); TL-02b part-02 SCR-1002 (tiêu chí phân nhóm triển vọng,
#     BR-10-07, BR-10-09); TL-02b part-06 (ma trận QT-15 → API `/policies/packs`, `/policies/test-cases`,
#     `/policies/workflow-templates`).
#   - BS-01 (bổ sung, đã duyệt 19/10/2026): SCR-1505 thư viện và trình soạn mẫu luồng, SCR-1506 giám sát tiến trình
#     theo mẫu, vòng đời `wf_template` mở rộng, `wf_template_rollout`, cột mới của `wf_binding`.
#   - TL-03 part-04 schema `policy` (policy_pack, policy_pack_version, policy_rule, decision_table, golden_test_case,
#     test_run, test_case_result, policy_binding); TL-03 part-07 schema `flowable` (wf_template, wf_binding,
#     wf_task_projection); TL-03 part-06 `appraisal.prospect_group.group_code`.
#   - Ma trận phân quyền `docs/phan-quyen/ma-tran.json` (SCR-1501..SCR-1506, SCR-1002, module `policies`).
# Điểm chốt riêng của tệp này (PC-xx) được ghi trong `info.description`.
openapi: 3.1.0
info:
  title: Mission – Policy Pack và Config Studio (MOD-05)
  version: 1.0.0-draft.1
  description: |
    Hợp đồng API của MOD-05 `policy`: gói Policy Pack và phiên bản, quy tắc CEL, bảng quyết định DMN 1.4,
    test case vàng và lần chạy kiểm thử, so sánh phiên bản và tác động, trình duyệt, phê duyệt và phát hành
    (người duyệt khác người soạn, AAL2, ký số), phân giải gói hiệu lực cho client nội bộ, tiêu chí phân nhóm
    triển vọng, tham số luồng duyệt (`flowable.wf_binding`) và thư viện mẫu luồng (`flowable.wf_template`, do
    SVC-06 sở hữu dữ liệu nhưng cấu hình qua Config Studio).

    Vòng đời phiên bản (baseline mục 9.1): `NHAP` → `DANG_KIEM_THU` → `DAT_KIEM_THU` → `CHO_PHE_DUYET` →
    `DA_PHAT_HANH` → `NGUNG`. Mọi sửa nội dung khi đang `DAT_KIEM_THU` đưa phiên bản về `NHAP` (MSG-15-03);
    từ `CHO_PHE_DUYET` trở đi nội dung bị đóng băng (trigger TL-03).

    Điểm chốt khi ghép nguồn:

    | Mã | Chủ đề | Nguồn ghi khác nhau | Hợp đồng chọn |
    |---|---|---|---|
    | PC-01 | Tiền tố đường dẫn phiên bản | TL-01 PL C: `/policies/{id}/versions/{v}/...`; TL-02b SCR-1501..1504: `/policies/packs/{id}/versions/{v}/...` | `/policies/packs/{id}/versions/{v}/...`; `GET /policies` của PL C thành `GET /policies/packs` (TL-02b chi tiết hơn, tách được `/policies/test-cases`, `/policies/workflow-templates`) |
    | PC-02 | Phê duyệt phát hành | TL-01 PL C: `POST .../publish`, vai trò `policy_approver`; TL-02b SCR-1503: `POST .../approve` (202), AC-08 | `POST .../approve` trả 202, vai trò `decider` (AC-08 của baseline mục 10) |
    | PC-03 | Định danh phiên bản `{v}` | TL-03: semver ba phần `2.1.0`; TL-02b ghi `v2.1`, `base=2.0` | Chuỗi semver ba phần đúng CHECK của TL-03 |
    | PC-04 | Vòng đời mẫu luồng | TL-03: `NHAP`, `HIEU_LUC`, `NGUNG`; BS-01: thêm `DAT_KIEM_THU`, `CHO_PHE_DUYET` | Theo BS-01 |
    | PC-05 | Mẫu luồng: chọn mẫu (SCR-1504) và soạn mẫu (SCR-1505, SCR-1506) | TL-02b SCR-1504 và part-06: `/policies/workflow-templates/{key}/versions/{v}`; ma trận và BS-01 (suy luận): `/workflow/templates`, `/workflow/instances` | Tệp này chỉ giữ hai thao tác đọc của SCR-1504 dưới `/policies/workflow-templates` (danh mục `HIEU_LUC` và khai báo tham số, phạm vi tenant); SCR-1505, SCR-1506 nằm ở platform.yaml dưới `/workflow/...` (SVC-06 sở hữu `wf_template`) |
    | PC-06 | So sánh tác động | TL-01 PL C gộp vào `test-runs`; TL-02b không có nút riêng | Trường `compareWithVersion` khi tạo lần chạy và khối `impact` trong kết quả (suy luận) |
servers:
  - url: /api/v1
security:
  - keycloak: []
tags:
  - name: Gói chính sách
    description: Danh sách gói Policy Pack, phiên bản, nhân bản phiên bản nháp, so sánh phiên bản (SCR-1501).
  - name: Quy tắc và bảng quyết định
    description: Quy tắc CEL, tham số, bảng quyết định DMN 1.4 và xem trước với hồ sơ mẫu (SCR-1501, SCR-1502).
  - name: Kiểm thử
    description: Test case vàng, lần chạy kiểm thử trên cel-java và cel-js, kiểm thử thuộc tính (SCR-1503).
  - name: Phê duyệt và phát hành
    description: Gửi phê duyệt, ký số phê duyệt, từ chối, thu hồi và phát hành lại sau lỗi saga (SCR-1501, SCR-1503).
  - name: Phân giải và tra cứu
    description: Gói hiệu lực cho client nội bộ và tiêu chí phân nhóm triển vọng cho QT-10 (SCR-1002).
  - name: Luồng duyệt
    description: Tham số luồng duyệt theo mẫu (`flowable.wf_binding`) và mô phỏng luồng (SCR-1504).
  - name: Mẫu luồng
    description: Danh mục mẫu luồng đã phát hành và khai báo tham số để chọn ở SCR-1504 (chỉ đọc; trình soạn mẫu ở workflow-service).

paths:
  # ───────────────────────────── Gói và phiên bản ─────────────────────────────
  /policies/packs:
    get:
      tags: [Gói chính sách]
      operationId: listPolicyPacks
      summary: Danh sách gói Policy Pack và phiên bản
      description: |
        Trả các gói mà người gọi được xem trong tenant (gói gốc toàn cục đã đồng bộ và gói riêng của tenant), mỗi
        gói kèm tóm tắt các phiên bản gần nhất. Tương ứng `GET /policies` của TL-01 Phụ lục C (điểm chốt PC-01).
      parameters:
        - name: flow
          in: query
          description: Lọc theo luồng đánh giá.
          schema: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        - name: origin
          in: query
          description: Lọc theo nguồn gói.
          schema: { $ref: '#/components/schemas/PolicyPackOrigin' }
        - $ref: '../common/common.yaml#/components/parameters/Q'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Trang danh sách gói.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyPackList' }
              examples:
                mac-dinh:
                  value:
                    items:
                      - id: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a01
                        code: khoi-dang/quy-dinh-moi
                        name: Quy định đánh giá khối Đảng (dự thảo Quy định mới)
                        sector: KHOI_DANG
                        flow: DANG
                        origin: GOC_TOAN_CUC
                        parentPackId: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a00
                        legalBasis: QĐ 366-QĐ/TW; dự thảo Quy định mới về đánh giá cán bộ
                        versions:
                          - id: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4b21
                            policyPackId: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a01
                            version: 2.1.0
                            status: NHAP
                            changeNote: Đổi cách đếm ngày chậm theo ngày làm việc của tenant
                            createdAt: '2026-10-12T09:00:00+07:00'
                            rowVersion: 6
                          - id: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4b20
                            policyPackId: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4a01
                            version: 2.0.0
                            status: DA_PHAT_HANH
                            effectiveFrom: '2026-10-01'
                            goldenPassRate: 1
                            publishedAt: '2026-09-20T15:10:00+07:00'
                            changeNote: Phiên bản đầu theo dự thảo Quy định mới
                            createdAt: '2026-09-01T08:00:00+07:00'
                            rowVersion: 11
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1501]
        owner: MOD-05
        roles: [policy_author, tenant_admin, decider]
        scope: Tn
        source: TL-01 PL C `GET /policies`; ma trận SCR-1501.soan (AC-02 R), module policies (AC-08 GET)

  /policies/packs/{id}:
    parameters:
      - $ref: '#/components/parameters/PackId'
    get:
      tags: [Gói chính sách]
      operationId: getPolicyPack
      summary: Xem một gói Policy Pack
      description: Thông tin gói và tóm tắt các phiên bản, dùng cho thanh gói trên Config Studio.
      responses:
        '200':
          description: Gói và tóm tắt phiên bản.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyPack' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1501, SCR-1502, SCR-1503, SCR-1504]
        owner: MOD-05
        roles: [policy_author, tenant_admin, decider]
        scope: Tn
        source: TL-02b SCR-1501 bảng trường dòng 1 (suy luận đường dẫn)

  /policies/packs/{id}/versions:
    parameters:
      - $ref: '#/components/parameters/PackId'
    get:
      tags: [Gói chính sách]
      operationId: listPolicyPackVersions
      summary: Danh sách phiên bản của gói
      parameters:
        - name: status
          in: query
          description: Lọc theo trạng thái phiên bản.
          schema: { $ref: '#/components/schemas/PolicyPackVersionStatus' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Trang danh sách phiên bản, mới nhất trước.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyPackVersionList' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1501]
        owner: MOD-05
        roles: [policy_author, tenant_admin, decider]
        scope: Tn
        source: TL-01 PL C `GET /policies` (gói và phiên bản)
    post:
      tags: [Gói chính sách]
      operationId: createPolicyPackVersion
      summary: Nhân bản thành phiên bản nháp mới
      description: |
        Tạo phiên bản `NHAP` kế thừa toàn bộ quy tắc, bảng quyết định, tham số và tham số luồng duyệt của phiên bản
        nguồn (QT-15 bước 1). Với gói kế thừa của tenant, chỉ quy tắc có `overridable = true` của gói gốc được sửa
        về sau (BR-15-13).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyPackVersionCreate' }
            examples:
              nhan-ban:
                value:
                  baseVersion: 2.0.0
                  version: 2.1.0
                  changeNote: Đổi cách đếm ngày chậm theo ngày làm việc của tenant
      responses:
        '201':
          description: Đã tạo phiên bản nháp.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyPackVersion' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          $ref: '../common/common.yaml#/components/responses/Conflict'
        '422':
          description: |
            Dữ liệu không hợp lệ. Mã lỗi: `POLICY-422-VERSION-EXISTS` (số phiên bản đã có),
            `COMMON-422-VALIDATION` (thiếu ghi chú thay đổi, sai định dạng semver).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1501]
        owner: MOD-05
        roles: [policy_author]
        scope: Tn
        rules: [BR-15-13]
        source: TL-01 PL C `POST /policies/{id}/versions`; TL-02b QT-15 bước 1

  /policies/packs/{id}/versions/{v}:
    parameters:
      - $ref: '#/components/parameters/PackId'
      - $ref: '#/components/parameters/PackVersion'
    get:
      tags: [Gói chính sách]
      operationId: getPolicyPackVersion
      summary: Xem chi tiết một phiên bản
      description: Thông tin phiên bản, manifest tham số, kết quả kiểm thử gần nhất, chữ ký và các gắn kỳ hiệu lực.
      responses:
        '200':
          description: Chi tiết phiên bản.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyPackVersion' }
              examples:
                dang-soan:
                  $ref: '#/components/examples/PolicyPackVersionDraft'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1501, SCR-1502, SCR-1503, SCR-1504]
        owner: MOD-05
        roles: [policy_author, tenant_admin, decider]
        scope: Tn
        source: TL-03 `policy.policy_pack_version`; TL-02b SCR-1501 thanh gói (suy luận đường dẫn)

  /policies/packs/{id}/versions/{v}/diff:
    parameters:
      - $ref: '#/components/parameters/PackId'
      - $ref: '#/components/parameters/PackVersion'
    get:
      tags: [Gói chính sách]
      operationId: diffPolicyPackVersions
      summary: So sánh hai phiên bản
      description: |
        Trả khác biệt quy tắc, tham số, bảng quyết định và tham số luồng duyệt giữa phiên bản `{v}` và phiên bản
        `base` (nút "So sánh v2.0" ở SCR-1501; báo cáo khác biệt khi phê duyệt ở SCR-1503).
      parameters:
        - name: base
          in: query
          required: true
          description: Phiên bản gốc để so sánh (semver, xem PC-03).
          schema: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$', examples: ['2.0.0'] }
      responses:
        '200':
          description: Danh sách khác biệt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyVersionDiff' }
              examples:
                doi-loai-ngay:
                  value:
                    base: 2.0.0
                    target: 2.1.0
                    changes:
                      - kind: PARAM
                        key: kpi_nhiem_vu
                        path: params.loai_ngay
                        before: NGAY_LICH
                        after: NGAY_LAM_VIEC
                      - kind: RULE
                        key: C
                        path: expression
                        before: max(0.0, 1.0 - 0.05 * double(ngay_cham))
                        after: max(0.0, 1.0 - 0.05 * double(ngay_cham_chu_quan))
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1501, SCR-1503]
        owner: MOD-05
        roles: [policy_author, decider]
        scope: Tn
        source: TL-02b SCR-1501 "So sánh v2.0"; QT-15 bước 9

  # ───────────────────────────── Quy tắc và bảng quyết định ─────────────────────────────
  /policies/packs/{id}/versions/{v}/rules:
    parameters:
      - $ref: '#/components/parameters/PackId'
      - $ref: '#/components/parameters/PackVersion'
    get:
      tags: [Quy tắc và bảng quyết định]
      operationId: listPolicyRules
      summary: Danh sách quy tắc CEL của phiên bản
      description: Trả toàn bộ quy tắc theo `evalOrder` (số quy tắc mỗi phiên bản nhỏ nên không phân trang).
      responses:
        '200':
          description: Danh sách quy tắc.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PolicyRule' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1501, SCR-1502]
        owner: MOD-05
        roles: [policy_author, tenant_admin, decider]
        scope: Tn
        source: TL-03 `policy.policy_rule` (suy luận đường dẫn)

  /policies/packs/{id}/versions/{v}/rules/{key}:
    parameters:
      - $ref: '#/components/parameters/PackId'
      - $ref: '#/components/parameters/PackVersion'
      - $ref: '#/components/parameters/RuleKey'
    get:
      tags: [Quy tắc và bảng quyết định]
      operationId: getPolicyRule
      summary: Xem một quy tắc CEL
      responses:
        '200':
          description: Quy tắc.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyRule' }
              examples:
                kpi:
                  $ref: '#/components/examples/PolicyRuleKpi'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1501, SCR-1502]
        owner: MOD-05
        roles: [policy_author, tenant_admin, decider]
        scope: Tn
        source: TL-03 `policy.policy_rule`
    put:
      tags: [Quy tắc và bảng quyết định]
      operationId: savePolicyRule
      summary: Lưu nháp quy tắc và tham số
      description: |
        Kiểm tra kiểu CEL bằng cel-java với khai báo biến của ngữ cảnh tính điểm (BR-15-01), kiểm tra tổng điểm tối
        đa nhóm (BR-15-05) rồi lưu. Cho phép khi phiên bản ở `NHAP` hoặc `DAT_KIEM_THU`; nếu đang `DAT_KIEM_THU`
        thì phiên bản về `NHAP` và phản hồi có `statusReverted = true` để giao diện hiện MSG-15-03. Dùng cho quy tắc
        công thức (SCR-1501) và quy tắc `muc_cuoi`, `nguoi_dung_dau` (SCR-1502).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyRuleUpdate' }
            examples:
              kpi:
                value:
                  expression: (math.least(double(nv.so_luong_duyet) / double(nv.ke_hoach), 1.0) + nv.muc_chat_luong + math.greatest(0.0, 1.0 - tham_so.tru_tien_do * double(nv.ngay_cham_chu_quan))) / 3.0
                  resultType: DECIMAL
                  rounding: { digits: 3, mode: NUA_LEN }
                  legalRef: PL 3 mục 2
                  evalOrder: 10
                  params:
                    tru_tien_do: 0.05
                    loai_ngay: NGAY_LAM_VIEC
                    cach_tinh_chat_luong: NAM_MUC_PL3
      responses:
        '200':
          description: Đã lưu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyRuleSaved' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403':
          description: |
            Không có quyền. Mã lỗi: `COMMON-403-OUT-OF-SCOPE`, `POLICY-403-NOT-OVERRIDABLE` (tenant sửa quy tắc gói gốc
            không đánh dấu cho phép điều chỉnh, BR-15-13).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: |
            Xung đột. Mã lỗi: `POLICY-409-VERSION-CONFLICT`, `POLICY-409-VERSION-FROZEN` (phiên bản từ
            `CHO_PHE_DUYET` trở đi hoặc `DANG_KIEM_THU`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422':
          description: |
            Không hợp lệ. Mã lỗi: `POLICY-422-CEL-TYPE` (MSG-15-01, kèm `errors[]` theo khối),
            `POLICY-422-GROUP-SUM` (MSG-15-02), `COMMON-422-VALIDATION` (tham số ngoài miền, ví dụ mức trừ tiến độ
            ngoài 0,00 đến 0,20).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
              examples:
                sai-tong:
                  value:
                    type: https://okrkpi.vn/problems/validation
                    title: Dữ liệu chưa hợp lệ
                    status: 422
                    code: POLICY-422-GROUP-SUM
                    msg: MSG-15-02
                    detail: Tổng điểm tối đa các nhóm là 95, phải bằng 100.
                    errors: [{ field: params.diem_toi_da, message: 'Tổng điểm tối đa các nhóm là 95, phải bằng 100.', rule: BR-15-05 }]
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1501, SCR-1502]
        owner: MOD-05
        roles: [policy_author]
        scope: Tn
        rules: [BR-15-01, BR-15-02, BR-15-03, BR-15-05, BR-15-13]
        source: TL-02b SCR-1501 "Lưu nháp"; SCR-1502 bảng trường dòng 6, 7

