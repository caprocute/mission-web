          application/json:
            schema: { $ref: '#/components/schemas/PolicyDecisionReason' }
            examples:
              thieu-ca:
                value: { reason: Cần bổ sung ca kiểm thử cho trường hợp ngày nghỉ bù trùng ngày lễ trước khi phát hành. }
      responses:
        '200':
          description: Đã từ chối, phiên bản về nháp.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyPackVersion' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1503]
        owner: MOD-05
        evt: [EVT-21]
        roles: [decider]
        scope: Tn
        source: TL-02b QT-15 bước 9 "từ chối có ý kiến"; bảng trạng thái (suy luận đường dẫn và EVT-21 báo người soạn)

  /policies/packs/{id}/versions/{v}/revoke:
    parameters:
      - $ref: '#/components/parameters/PackId'
      - $ref: '#/components/parameters/PackVersion'
    post:
      tags: [Phê duyệt và phát hành]
      operationId: revokePolicyPackVersion
      summary: Thu hồi phiên bản đã phát hành
      description: |
        Người phê duyệt thu hồi phiên bản `DA_PHAT_HANH` khi phát hiện sai sót trước kỳ hiệu lực; phiên bản chuyển
        `NGUNG`, phiên bản trước tiếp tục áp dụng. Không thu hồi được khi kỳ hiệu lực đã khoá (`is_frozen`); khi kỳ
        đã bắt đầu, phải phát hành phiên bản sửa (TL-02b QT-15 "Ngoại lệ và xử lý").
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyDecisionReason' }
      responses:
        '200':
          description: Đã thu hồi.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyPackVersion' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: 'Xung đột. Mã lỗi: `POLICY-409-VERSION-CONFLICT`, `POLICY-409-PERIOD-STARTED` (kỳ hiệu lực đã bắt đầu), `POLICY-409-PERIOD-LOCKED`.'
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1503]
        owner: MOD-05
        evt: [EVT-13]
        roles: [decider]
        scope: Tn
        aal: 2
        rules: [BR-15-10]
        source: TL-02b QT-15 "Ngoại lệ và xử lý", bảng trạng thái `DA_PHAT_HANH` → `NGUNG` (suy luận đường dẫn; EVT-13 phát lại để cell nạp phiên bản trước)

  /policies/packs/{id}/versions/{v}/republish:
    parameters:
      - $ref: '#/components/parameters/PackId'
      - $ref: '#/components/parameters/PackVersion'
    post:
      tags: [Phê duyệt và phát hành]
      operationId: republishPolicyPackVersion
      summary: Phát hành lại sau khi saga lỗi
      description: |
        Chạy lại saga phát hành cho phiên bản đã ký nhưng saga bù trừ (vẫn `CHO_PHE_DUYET`, có chữ ký). Không cần
        ký lại nếu `content_hash` không đổi. Theo dõi bằng `Location` (`Job.type = POLICY_PUBLISH`).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: 'Xung đột. Mã lỗi: `POLICY-409-VERSION-CONFLICT`, `POLICY-409-NOT-SIGNED` (chưa có chữ ký hợp lệ trên nội dung hiện tại).'
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
