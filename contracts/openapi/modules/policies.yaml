  # ───────────────────────────── Phê duyệt và phát hành ─────────────────────────────
  /policies/packs/{id}/versions/{v}/submit:
    parameters:
      - $ref: '#/components/parameters/PackId'
      - $ref: '#/components/parameters/PackVersion'
    post:
      tags: [Phê duyệt và phát hành]
      operationId: submitPolicyPackVersion
      summary: Gửi phê duyệt phát hành
      description: |
        Chọn kỳ hiệu lực trong tương lai và phạm vi áp dụng, khởi động mẫu duyệt phát hành; phiên bản
        `DAT_KIEM_THU` → `CHO_PHE_DUYET`, phát EVT-21 tới người phê duyệt (BR-15-07, BR-15-10).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyPackSubmit' }
            examples:
              quy-1-2027:
                value:
                  effectivePeriodId: 0192a1b0-3c4d-7e5f-8a9b-0c1d2e3f4c27
                  scopes:
                    - { flow: DANG, subjectGroupId: null, orgUnitId: null }
                  note: Áp dụng cho toàn tenant từ Quý I/2027.
      responses:
        '200':
          description: Đã gửi phê duyệt.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyPackVersion' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: |
            Xung đột. Mã lỗi: `POLICY-409-VERSION-CONFLICT`, `POLICY-409-NOT-TESTED` (chưa `DAT_KIEM_THU`, MSG-15-06),
            `POLICY-409-PERIOD-LOCKED` (kỳ hiệu lực đã khoá hoặc không ở tương lai, BR-15-10).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1501, SCR-1503]
        owner: MOD-05
        evt: [EVT-21]
        roles: [policy_author]
        scope: Tn
        rules: [BR-15-07, BR-15-10]
        source: TL-01 PL C `POST /policies/{id}/versions/{v}/submit`; TL-02b SCR-1501, SCR-1503 "Gửi phê duyệt phát hành"

  /policies/packs/{id}/versions/{v}/approve:
    parameters:
      - $ref: '#/components/parameters/PackId'
      - $ref: '#/components/parameters/PackVersion'
    post:
      tags: [Phê duyệt và phát hành]
      operationId: approvePolicyPackVersion
      summary: Ký số phê duyệt và phát hành
      description: |
        Người phê duyệt (AC-08, khác người soạn) ký số trên `content_hash` qua SVC-10 rồi khởi động saga phát hành
        của SVC-06: gắn `policy_binding` với kỳ hiệu lực, đồng bộ xuống các cell, nạp vào scoring-service, kích hoạt
        `wf_binding`. Xong saga thì phiên bản `DA_PHAT_HANH` và phát EVT-13 (giao diện hiện MSG-15-08); saga lỗi thì
        bù trừ và giữ `CHO_PHE_DUYET`. Thay cho `POST /policies/{id}/versions/{v}/publish` của TL-01 PL C (PC-02).
        Theo dõi bằng `Location` (`Job.type = POLICY_PUBLISH`).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyPackApprove' }
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403':
          description: 'Không có quyền. Mã lỗi: `POLICY-403-SAME-AUTHOR` (người phê duyệt trùng người soạn, BR-15-09).'
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: 'Xung đột. Mã lỗi: `POLICY-409-VERSION-CONFLICT`, `POLICY-409-NOT-PENDING` (phiên bản không ở `CHO_PHE_DUYET`).'
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1503]
        owner: MOD-05
        evt: [EVT-18, EVT-13]
        roles: [decider]
        scope: Tn
        aal: 2
        fourEyes: true
        rules: [BR-15-09, BR-15-10, BR-15-14]
        source: TL-02b SCR-1503 "Ký số phê duyệt"; TL-01 PL C `publish` (PC-02)

  /policies/packs/{id}/versions/{v}/reject:
    parameters:
      - $ref: '#/components/parameters/PackId'
      - $ref: '#/components/parameters/PackVersion'
    post:
      tags: [Phê duyệt và phát hành]
      operationId: rejectPolicyPackVersion
      summary: Từ chối phát hành có ý kiến
      description: Phiên bản `CHO_PHE_DUYET` → `NHAP`, bắt buộc ý kiến (QT-15 bước 9, bảng trạng thái).
