      responses:
        '200':
          description: Trang lịch sử chạy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyTestRunList' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1503]
        owner: MOD-05
        roles: [policy_author, decider]
        scope: Tn
        source: TL-02b SCR-1503 bảng trường dòng 6
    post:
      tags: [Kiểm thử]
      operationId: runPolicyTests
      summary: Chạy bộ test case vàng
      description: |
        Chạy toàn bộ ca `DA_DUYET` của bộ vàng trên cel-java và cel-js, cùng kiểm thử thuộc tính. Phiên bản chuyển
        `NHAP` → `DANG_KIEM_THU`, rồi `DAT_KIEM_THU` khi 100% ca đạt và hai engine khớp, ngược lại về `NHAP`
        (BR-15-07). Khi có `compareWithVersion`, lần chạy kèm so sánh tác động với phiên bản đó (PC-06). Theo dõi
        bằng `Location` (`Job.type = TEST_RUN`); `resultLocation` trỏ tới lần chạy.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PolicyTestRunCreate' }
            examples:
              co-so-sanh:
                value: { compareWithVersion: 2.0.0, propertyDatasets: 10000 }
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: |
            Xung đột. Mã lỗi: `POLICY-409-VERSION-CONFLICT`, `POLICY-409-TEST-RUNNING` (đang có lần chạy),
            `POLICY-409-VERSION-FROZEN` (phiên bản đã `CHO_PHE_DUYET` trở đi).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422':
          description: 'Không hợp lệ. Mã lỗi: `POLICY-422-CEL-TYPE` (còn biểu thức sai kiểu, điều kiện chuyển `DANG_KIEM_THU`).'
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1501, SCR-1502, SCR-1503]
        owner: MOD-05
        roles: [policy_author]
        scope: Tn
        rules: [BR-15-07]
        source: TL-01 PL C `POST /policies/{id}/versions/{v}/test-runs`; TL-02b SCR-1501, SCR-1502, SCR-1503 "Chạy test case", "Chạy lại"

