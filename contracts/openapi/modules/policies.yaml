        versionNo: { type: integer, minimum: 1 }
        status:
          description: Trạng thái mẫu; danh mục này chỉ trả `HIEU_LUC`.
          type: string
          enum: [HIEU_LUC]
        processKind: { type: string, description: 'Loại quy trình phục vụ (suy luận).' }
        testCount: { type: integer, minimum: 0, description: Số test của mẫu. }
    PolicyWorkflowTemplateList:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PolicyWorkflowTemplateSummary' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    PolicyWorkflowTemplateVersion:
      description: Khai báo tham số và bước xem trước của một phiên bản mẫu luồng, dùng cho SCR-1504.
      allOf:
        - $ref: '#/components/schemas/PolicyWorkflowTemplateSummary'
        - type: object
          required: [paramSchema]
          properties:
            paramSchema:
              description: Khai báo tham số dạng JSON Schema (`param_schema`, BS-01), sinh biểu mẫu SCR-1504.
              type: object
              additionalProperties: true
            previewSteps:
              type: array
              items: { $ref: '#/components/schemas/WorkflowStepPreview' }
