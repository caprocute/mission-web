# Hợp đồng OpenAPI 3.1 của MOD-04 `appraisal` (kèm phần đọc điểm, giải thích, vết tính của SVC-07
# mà giao diện gọi qua tiền tố `/appraisals`). WEB-063, ADR-32 (BS-02).
#
# Nguồn:
#   - Baseline mục 7 (EVT-04, EVT-09, EVT-10, EVT-11, EVT-12, EVT-18, EVT-21, EVT-25), mục 9 (schema
#     `appraisal`), mục 9.1 (trạng thái hồ sơ đánh giá, RatingLevel, Flow), mục 10 (vai trò AC), mục 13.
#   - TL-01 Phụ lục C "Đánh giá, xếp loại (MOD-04, SVC-07)" (TL-01/part-14.md); TL-01 mục 5 bảng
#     tiền tố API (part-05a.md).
#   - TL-02b QT-09 (SCR-0901, SCR-0902, SCR-0903, SCR-0904; BR-09-01..BR-09-17; MSG-09-01..MSG-09-16),
#     QT-10 (SCR-1001, SCR-1002; BR-10-01..BR-10-10; MSG-10-01..MSG-10-07), QT-12 SCR-1202 (tính thử),
#     QT-18 SCR-1803 (luồng rút gọn tự đánh giá); bảng liên kết thiết kế TL-02b/part-06.md.
#   - TL-02a QT-07 SCR-0703 (xem trước điểm khi nghiệm thu).
#   - TL-03 schema `appraisal` (appraisal_profile, general_criteria_result, self_assessment,
#     score_snapshot, rating_proposal, rating_explanation, annual_rating, prospect_group,
#     batch_decision) và schema `scoring` (score_result, score_trace); `config.period.kind`.
#   - Ma trận phân quyền `docs/phan-quyen/ma-tran.json` (SCR-0703, SCR-0901..SCR-0904, SCR-1001,
#     SCR-1002, SCR-1202; dòng API `appraisals`).
#
# Điểm chốt riêng của tệp này (ngoài HD-01..HD-06 của README):
#   - AP-01: dùng kiểu đường dẫn TL-02b `/appraisals/profiles/{id}/...` và `/appraisals/batch-decisions`
#     thay cho `/appraisals/{id}/...` và `/appraisals/decisions/batch` của TL-01 Phụ lục C.
#   - AP-02: quyết định một hồ sơ (`POST /appraisals/{id}/decision` của PL C) gộp vào quyết định lô
#     (lô 1 hồ sơ), không tạo đường dẫn riêng.
#   - AP-03: `GET /appraisals?period=&flow=` (PL C, hồ sơ của tôi) thành `GET /appraisals/profiles/mine`,
#     theo cùng lý do HD-04; `GET /appraisals/profiles` dành cho hàng đợi theo đơn vị.
#   - AP-04: `GET /appraisals/{id}/score` (PL C) thành `GET /appraisals/profiles/{id}/scores?flow=`.
#   - AP-05: mọi thao tác ghi lên hồ sơ dùng ETag của `appraisal_profile.row_version`.
openapi: 3.1.0
info:
  title: Mission – Đánh giá, xếp loại (MOD-04)
  version: 1.0.0-draft.1
  description: >-
    Hồ sơ đánh giá theo kỳ và luồng (`DANG`, `NHA_NUOC`), phiếu tự đánh giá, thẩm định, đề xuất,
    quyết định xếp loại hàng loạt có ký số, phiếu xếp loại có giải thích, xếp loại năm liên thông
    quý–năm và phân nhóm triển vọng. Điểm số do SVC-07 scoring-service tính và chụp thành ảnh chụp
    bất biến; hợp đồng không có thao tác nào ghi điểm (BR-09-16). Ý chí con người được lưu thành bốn
    mức riêng `TU_DE_XUAT`, `THAM_DINH`, `DE_XUAT`, `QUYET_DINH` (BR-09-12).


    Trạng thái hồ sơ (baseline mục 9.1): `CHUA_LAP` → `TU_DANH_GIA` → `CHO_THAM_DINH` →
    `DA_THAM_DINH` → `CHO_QUYET_DINH` → `DA_QUYET_DINH` → `DA_KY_SO` → `DA_KHOA`; nhánh
    `KHIEU_NAI`. Các bước ký số chỉ hoàn tất khi nhận EVT-18 (BR-09-15), nên thao tác ký trả 202.


    Mọi thao tác ghi lên một hồ sơ dùng chung ETag của hồ sơ (`appraisal_profile.row_version`):
    lưu nháp, nộp, trả lại, thẩm định, đề xuất đều gửi `If-Match` bằng ETag đọc được ở
    `GET /appraisals/profiles/{id}`. Nhận xét, giải trình, lý do là dữ liệu C2 (mã hoá trường ở
    máy chủ, ADR-06) và đi trong hợp đồng ở dạng rõ qua TLS cho người có quyền.
servers:
  - url: /api/v1
security:
  - keycloak: []
tags:
  - name: Hồ sơ đánh giá
    description: Danh sách, chi tiết hồ sơ đánh giá theo kỳ và luồng; hàng đợi thẩm định và quyết định.
  - name: Tự đánh giá
    description: Phiếu tự đánh giá của cán bộ (SCR-0901, SCR-1803), lưu nháp và ký số nộp.
  - name: Thẩm định và đề xuất
    description: Thẩm định, trả lại bổ sung (SCR-0902) và ghi mức đề xuất của quản lý (SCR-0903).
  - name: Điểm và giải thích
    description: >-
      Ảnh chụp điểm, câu giải thích hạ mức, vết tính của SVC-07; xem trước và tính thử không lưu.
  - name: Quyết định hàng loạt
    description: Quyết định xếp loại và ký lô tới 1.000 hồ sơ (SCR-0904).
  - name: Xếp loại năm
    description: Tổng hợp bốn quý, liên thông quý–năm, đề xuất bố trí lại (SCR-1001).
  - name: Phân nhóm triển vọng
    description: Bảng phân nhóm bốn nhóm theo PL 5, lưu nháp và trình tập thể (SCR-1002).
  - name: Nội bộ
    description: Thao tác cho client nội bộ (scoring-service) và giám sát (tính lại, xuất danh sách).

paths:
  /appraisals/profiles/mine:
    get:
      tags: [Hồ sơ đánh giá]
      operationId: listMyAppraisalProfiles
      summary: Hồ sơ đánh giá của tôi
      description: >-
        Danh sách hồ sơ đánh giá của người đang đăng nhập theo kỳ và luồng (thẻ "Tự đánh giá quý"
        trên SCR-0002, menu Đánh giá › Phiếu tự đánh giá). Thay cho `GET /appraisals?period=&flow=`
        của TL-01 Phụ lục C (điểm chốt AP-03).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/FlowQuery'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Danh sách hồ sơ của tôi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppraisalProfilePage' }
              examples:
                quy-iv:
                  $ref: '#/components/examples/AppraisalProfilePageMine'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-09, QT-10]
        scr: [SCR-0901, SCR-1803]
        owner: MOD-04
        roles: [member]
        scope: B
        source: TL-01 PL C (GET /appraisals?period=&flow=); TL-02b SCR-0901 Đường vào

  /appraisals/profiles:
    get:
      tags: [Hồ sơ đánh giá]
      operationId: listAppraisalProfiles
      summary: Danh sách hồ sơ đánh giá theo đơn vị (hàng đợi thẩm định, quyết định)
      description: >-
        Hàng đợi thẩm định (SCR-0902, mặc định `status=CHO_THAM_DINH`, sắp theo hạn) và danh sách
        hồ sơ chờ quyết định (SCR-0904, `status=CHO_QUYET_DINH`) trong phạm vi ABAC cây tổ chức của
        người gọi. Mỗi dòng có bốn mức đã đưa ra và gợi ý bất thường (dấu hiệu số 1 của QT-14) để
        người dùng không phải mở từng hồ sơ. Phân bố mức trên SCR-0904 tính ở client từ danh sách.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/FlowQuery'
        - $ref: '../common/common.yaml#/components/parameters/UnitId'
        - name: status
          in: query
          description: Lọc theo trạng thái hồ sơ; lặp tham số để chọn nhiều giá trị.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/AppraisalProfileStatus' }
        - name: includeSubunits
          in: query
          description: Gồm cả cây đơn vị cấp dưới của `unit` (suy luận, phục vụ bộ lọc khối trên SCR-0904).
          schema: { type: boolean, default: true }
        - $ref: '../common/common.yaml#/components/parameters/Q'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang hồ sơ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppraisalProfilePage' }
              examples:
                cho-quyet-dinh:
                  $ref: '#/components/examples/AppraisalProfilePageQueue'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-09]
        scr: [SCR-0902, SCR-0904]
        owner: MOD-04
        roles: [appraiser, decider]
        scope: Cd
        rules: [BR-09-14]
        source: TL-02b SCR-0902 trường 1–2; SCR-0904 trường 1–3; TL-02b part-06 bảng liên kết

  /appraisals/profiles/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Hồ sơ đánh giá]
      operationId: getAppraisalProfile
      summary: Chi tiết hồ sơ đánh giá
      description: >-
        Chi tiết hồ sơ gồm trạng thái, tiêu chí chung, phiếu tự đánh giá hiện hành, vết bốn mức và
        thông tin chữ ký. Trường C2 chỉ trả cho người được xem theo OPA; việc đọc trường C2 được ghi
        nhật ký truy cập. Hồ sơ năm có thêm `quarterRatings`. Trả `ETag` dùng cho mọi thao tác ghi
        lên hồ sơ.
      responses:
        '200':
          description: Hồ sơ đánh giá.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppraisalProfile' }
              examples:
                cho-tham-dinh:
                  $ref: '#/components/examples/AppraisalProfileSample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-09, QT-10]
        scr: [SCR-0901, SCR-0902, SCR-0903, SCR-1803]
        owner: MOD-04
        roles: [member, manager, appraiser, decider]
        scope: B (member); Đv (manager); Cd (appraiser, decider)
        rules: [BR-09-14]
        source: TL-02b SCR-0902 "Chọn hồ sơ trong hàng đợi"; SCR-1803 "Bắt đầu"

  /appraisals/profiles/{id}/self-assessment:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    put:
      tags: [Tự đánh giá]
      operationId: saveAppraisalSelfAssessment
      summary: Lưu nháp phiếu tự đánh giá
      description: >-
        Lưu tiêu chí chung, mức tự đề xuất, giải pháp đột phá, giải trình và nội dung ưu điểm,
        hạn chế (trường 2, 9 đến 12 của SCR-0901). Lưu nháp không kiểm tra đủ trường bắt buộc; kiểm
        tra đầy đủ chạy khi nộp. Giao diện tự lưu 30 giây một lần, mỗi lần dùng `Idempotency-Key`
        mới và `If-Match` mới nhất. Chỉ chủ hồ sơ, khi hồ sơ ở `TU_DANH_GIA`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppraisalSelfAssessmentInput' }
            examples:
              nhap:
                value:
                  criteria:
                    - { criteriaCode: TCC-01, met: true }
                    - { criteriaCode: TCC-02, met: true }
                  selfRatingCode: HTXSNV
                  breakthrough: Đề xuất và triển khai quy trình tổng hợp báo cáo tuần trên nền tảng số, rút thời gian tổng hợp từ 3 ngày còn nửa ngày.
                  breakthroughEvidenceIds: [01928f3e-7b1a-7c3e-9a51-3f2d9c1b0e11]
                  reason: Đơn vị đánh giá cao giải pháp số hoá báo cáo nên tôi đề nghị mức xuất sắc.
                  content: Hoàn thành đúng hạn các nhiệm vụ then chốt; còn chậm một báo cáo chuyên đề do chủ quan.
      responses:
        '200':
          description: Đã lưu nháp; trả hồ sơ cập nhật.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppraisalProfile' }
              examples:
                da-luu:
                  $ref: '#/components/examples/AppraisalProfileSample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          $ref: '../common/common.yaml#/components/responses/Conflict'
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-09, QT-10, QT-18]
        scr: [SCR-0901, SCR-1803]
        owner: MOD-04
        roles: [member]
        scope: B
        rules: [BR-09-05]
        errors: [APPRAISAL-409-VERSION-CONFLICT, APPRAISAL-409-INVALID-STATUS, APPRAISAL-409-PERIOD-LOCKED]
        source: TL-02b SCR-0901 "Lưu nháp"; SCR-1803 "Tiếp tục, Quay lại"

  /appraisals/profiles/{id}/submit:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Tự đánh giá]
      operationId: submitAppraisalSelfAssessment
      summary: Ký số và nộp phiếu tự đánh giá
      description: >-
        Kiểm tra đủ trường và quy tắc (giải trình khi mức tự đề xuất khác mức tham khảo, giải pháp
        đột phá kèm minh chứng `DA_XAC_NHAN` khi tự đề xuất HTXSNV), chốt `content_hash` của phiếu,
        tạo yêu cầu ký ở SVC-10 rồi trả 202. Hồ sơ chỉ chuyển `CHO_THAM_DINH` khi nhận EVT-18
        (BR-09-15); trong lúc chờ, hồ sơ giữ `TU_DANH_GIA`. Thay cho `POST /appraisals/{id}/self-assessment`
        của TL-01 Phụ lục C (điểm chốt AP-01). Lỗi 422 mã `APPRAISAL-422-REASON-REQUIRED` (MSG-09-02),
        `APPRAISAL-422-BREAKTHROUGH-REQUIRED` (MSG-09-03); ký lỗi báo qua job với MSG-09-05.
        Theo dõi ký: `Location` trỏ `/jobs/{id}` (loại `ESIGN`, suy luận); job ở `DANG_CHAY` trong lúc chờ
        người ký xác nhận trên ứng dụng ký số, chuyển `HOAN_TAT` khi nhận EVT-18 và hồ sơ đã sang
        `CHO_THAM_DINH`, với `resultLocation` là `/appraisals/profiles/{id}`; chuyển `THAT_BAI` kèm `problem`
        (MSG-09-05) khi ký lỗi, bị từ chối hoặc hết hạn, hồ sơ giữ `TU_DANH_GIA` và nộp lại được với
        `Idempotency-Key` mới. Client không gọi `POST /esign/requests` riêng.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppraisalSignRequestInput' }
            examples:
              mysign:
                value: { signProvider: MYSIGN, formCode: MAU_2 }
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-09, QT-10]
        scr: [SCR-0901]
        owner: MOD-04
        evt: [EVT-11, EVT-18]
        roles: [member]
        scope: B
        aal: 2
        rules: [BR-09-05, BR-09-12, BR-09-15]
        errors: [APPRAISAL-422-REASON-REQUIRED, APPRAISAL-422-BREAKTHROUGH-REQUIRED, APPRAISAL-409-INVALID-STATUS, APPRAISAL-409-VERSION-CONFLICT]
        source: TL-02b SCR-0901 "Ký số và nộp"; TL-01 PL C POST /appraisals/{id}/self-assessment

  /appraisals/profiles/{id}/return:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Thẩm định và đề xuất]
      operationId: returnAppraisalProfile
      summary: Trả lại hồ sơ để cán bộ bổ sung
      description: >-
        Thẩm định viên trả hồ sơ từ `CHO_THAM_DINH` về `TU_DANH_GIA`, giữ nguyên các bản ghi cũ,
        hoàn thành user task với `ket_qua = TRA_LAI`. Bắt buộc lý do. Vượt số lần trả lại tối đa
        (tham số, mặc định 2) trả 409 mã `APPRAISAL-409-RETURN-LIMIT`. Thành công hiện MSG-09-09.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppraisalReturnInput' }
            examples:
              bo-sung:
                value:
                  reason: Đề nghị đồng chí bổ sung biên bản nghiệm thu nhiệm vụ then chốt số 3 và giải trình việc chậm hạn.
      responses:
        '200':
          description: Đã trả lại; trả hồ sơ ở `TU_DANH_GIA`.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppraisalProfile' }
              examples:
                da-tra-lai:
                  $ref: '#/components/examples/AppraisalProfileSample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-09]
        scr: [SCR-0902]
        owner: MOD-04
        evt: [EVT-11, EVT-21]
        roles: [appraiser]
        scope: Cd
        rules: [BR-09-14]
        errors: [APPRAISAL-409-RETURN-LIMIT, APPRAISAL-409-INVALID-STATUS, APPRAISAL-409-VERSION-CONFLICT]
        source: TL-02b SCR-0902 "Trả lại bổ sung"; QT-09 bảng trạng thái

