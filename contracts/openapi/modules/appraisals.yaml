        (BR-09-14, 403 kèm `msg` MSG-09-08). Thay cho `POST /appraisals/{id}/review` của TL-01
        Phụ lục C (điểm chốt AP-01). Cũng dùng cho thẩm định năm (SCR-0902 chế độ năm).
