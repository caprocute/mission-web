  /appraisals/batch-decisions:
    post:
      tags: [Quyết định hàng loạt]
      operationId: createAppraisalBatchDecision
      summary: Quyết định xếp loại và ký lô
      description: >-
        Tạo `appraisal.batch_decision` cho 1 đến 1.000 hồ sơ `CHO_QUYET_DINH`, ghi bản ghi mức
        `QUYET_DINH` cho từng hồ sơ (đổi mức so với mức đề xuất thì bắt buộc lý do ≥ 20 ký tự), yêu
        cầu xác thực bước lên một lần và tạo yêu cầu ký lô ở SVC-10 (mỗi hồ sơ một chữ ký PAdES).
        Trả 202 với `Location: /api/v1/jobs/{id}`; tiến độ theo SSE. Mỗi chữ ký thành công phát
        EVT-18 và hồ sơ chuyển `DA_KY_SO`, kèm EVT-12. Hồ sơ lỗi ký giữ `CHO_QUYET_DINH`.
        Quyết định một hồ sơ cũng đi qua đây (lô 1 hồ sơ, điểm chốt AP-02).


        Lỗi: 409 `APPRAISAL-409-DECISION-NO-DUPLICATE` khi trùng số quyết định trong năm của đơn vị;
        422 `APPRAISAL-422-HEAD-TOO-EARLY` (MSG-09-14, BR-09-13); 422 `APPRAISAL-422-REASON-REQUIRED`;
        409 `APPRAISAL-409-COMPLAINT-OPEN` (MSG-10-03) khi xếp loại năm còn khiếu nại quý chưa kết
        luận; 422 `APPRAISAL-422-CALIBRATION-REQUIRED` (MSG-09-13, BR-09-17) khi tỷ lệ HTXSNV vượt
        ngưỡng khối mà chưa xác nhận đã có phiên hiệu chỉnh. Mục có `rowVersion` lệch phiên bản hiện
        tại bị từ chối cả lô với 409 `APPRAISAL-409-VERSION-CONFLICT`, `errors[]` chỉ rõ mục.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppraisalBatchDecisionInput' }
            examples:
              qd-215:
                value:
                  periodId: 01928f3e-7b1a-7c3e-9a51-3f2d9c1b0001
                  flow: DANG
                  decisionNo: 215-QĐ/ĐUK
                  decisionDate: '2027-01-12'
                  signProvider: MYSIGN
                  calibrationAcknowledged: false
                  items:
                    - profileId: 01928f3e-7b1a-7c3e-9a51-3f2d9c1b0a01
                      ratingCode: HTTNV
                      rowVersion: 9
                    - profileId: 01928f3e-7b1a-7c3e-9a51-3f2d9c1b0a02
                      ratingCode: HTNV
                      reason: Tập thể Ban Thường vụ thống nhất hạ một mức do chưa hoàn thành nhiệm vụ then chốt về chuyển đổi số.
                      rowVersion: 6
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-09, QT-10]
        scr: [SCR-0904]
        owner: MOD-04
        evt: [EVT-11, EVT-18, EVT-12]
        roles: [decider]
        scope: Cd
        aal: 2
        rules: [BR-09-12, BR-09-13, BR-09-14, BR-09-15, BR-09-17, BR-10-03]
        errors: [APPRAISAL-409-DECISION-NO-DUPLICATE, APPRAISAL-422-HEAD-TOO-EARLY, APPRAISAL-422-REASON-REQUIRED, APPRAISAL-409-COMPLAINT-OPEN, APPRAISAL-422-CALIBRATION-REQUIRED, APPRAISAL-409-VERSION-CONFLICT]
        source: TL-02b SCR-0904 "Quyết định và ký lô"; TL-01 PL C POST /appraisals/decisions/batch và POST /appraisals/{id}/decision

  /appraisals/batch-decisions/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Quyết định hàng loạt]
      operationId: getAppraisalBatchDecision
      summary: Chi tiết lô quyết định
      description: >-
        Trạng thái lô, số hồ sơ đã ký, lỗi từng hồ sơ. Đường dẫn suy luận: TL-02b chỉ ghi theo dõi
        qua `GET /jobs/{id}`, nhưng cần đọc lô để lấy `ETag` cho thao tác huỷ và để mở lại màn hình
        sau khi đóng.
      responses:
        '200':
          description: Lô quyết định.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppraisalBatchDecision' }
              examples:
                dang-ky:
                  $ref: '#/components/examples/AppraisalBatchDecisionSample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-09, QT-10]
        scr: [SCR-0904]
        owner: MOD-04
        roles: [decider]
        scope: Cd
        source: suy luận từ TL-02b SCR-0904 "Theo dõi tiến độ", "Huỷ lô"; TL-03 appraisal.batch_decision

  /appraisals/batch-decisions/{id}/cancel:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Quyết định hàng loạt]
      operationId: cancelAppraisalBatchDecision
      summary: Huỷ lô quyết định chưa hoàn tất
      description: >-
        Dừng các chữ ký chưa thực hiện; hồ sơ đã ký giữ `DA_KY_SO`, hồ sơ chưa ký giữ
        `CHO_QUYET_DINH`. Lô chuyển `HUY` nếu chưa ký hồ sơ nào, ngược lại `LOI_MOT_PHAN` (suy luận
        cách chọn trạng thái). Lô đã `DA_KY` trả 409 `APPRAISAL-409-BATCH-COMPLETED`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      responses:
        '200':
          description: Đã huỷ phần chưa ký.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AppraisalBatchDecision' }
              examples:
                da-huy:
                  $ref: '#/components/examples/AppraisalBatchDecisionSample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-09, QT-10]
        scr: [SCR-0904]
        owner: MOD-04
        roles: [decider]
        scope: Cd
        errors: [APPRAISAL-409-BATCH-COMPLETED, APPRAISAL-409-VERSION-CONFLICT]
        source: TL-02b SCR-0904 "Huỷ lô"

  /appraisals/annual:
    get:
      tags: [Xếp loại năm]
      operationId: listAnnualAppraisalRatings
      summary: Tổng hợp xếp loại năm của đơn vị
      description: >-
        Bảng tổng hợp bốn quý, điểm năm, mức tự đề xuất năm, mức hệ thống đề xuất và quy tắc liên
        thông của từng hồ sơ năm, kèm bốn số đếm cho thẻ số liệu đầu trang (trả riêng trong `counts`
        theo SCR-1001 trường 3). `flag=lien_thong` chỉ hiện hồ sơ có `blockReason` hoặc `reassignFlag`.
      parameters:
        - name: period
          in: query
          required: true
          description: Mã kỳ năm (`config.period.kind = NAM`).
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - $ref: '../common/common.yaml#/components/parameters/UnitId'
        - $ref: '#/components/parameters/FlowQuery'
        - name: flag
          in: query
          description: Lọc hồ sơ có cảnh báo liên thông quý–năm.
          schema: { type: string, enum: [lien_thong] }
        - $ref: '../common/common.yaml#/components/parameters/Q'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang xếp loại năm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnualRatingPage' }
              examples:
                nam-2026:
                  $ref: '#/components/examples/AnnualRatingPageSample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-10]
        scr: [SCR-1001]
        owner: MOD-04
        roles: [leader, appraiser, decider]
        scope: Cd
        rules: [BR-10-03, BR-10-04]
        source: TL-02b SCR-1001 "Chỉ hiện hồ sơ có cảnh báo liên thông"

  /appraisals/annual/{id}/explanation:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Xếp loại năm]
      operationId: getAnnualAppraisalExplanation
      summary: Giải thích liên thông quý–năm của một hồ sơ năm
      description: >-
        `id` là mã `appraisal.annual_rating`. Trả công thức điểm năm theo tham số `nam.cach_tinh`,
        bốn kết quả quý với phiên bản Policy Pack đã dùng (BR-10-06), danh sách điều kiện, mức hệ
        thống đề xuất và câu giải thích có điều khoản (MSG-10-01).
      responses:
        '200':
          description: Giải thích.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnualRatingExplanation' }
              examples:
                ho-so-mau:
                  $ref: '#/components/examples/AnnualRatingExplanationSample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-10]
        scr: [SCR-1001]
        owner: MOD-04
        roles: [leader, appraiser, decider]
        scope: Cd
        rules: [BR-10-01, BR-10-02, BR-10-03, BR-10-05, BR-10-06]
        source: TL-02b SCR-1001 "Chọn dòng"

  /appraisals/annual/{id}/reassignment-proposal:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Xếp loại năm]
      operationId: createAnnualReassignmentProposal
      summary: Lập đề xuất bố trí lại công việc
      description: >-
        Với hồ sơ năm có `reassignFlag` (hai quý liên tiếp KHTNV, QĐ khoản 15.6), tạo việc cho cơ quan
        tổ chức trong MOD-02 với căn cứ khoản 15.6 và đặt `relocationProposed = true`. Không thay đổi
        mức xếp loại. Hồ sơ không có cờ trả 409 `APPRAISAL-409-NO-REASSIGN-FLAG`; đã lập trả 409
        `APPRAISAL-409-REASSIGN-EXISTS`. `If-Match` dùng `rowVersion` của dòng xếp loại năm.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnnualReassignmentInput' }
            examples:
              ghi-chu:
                value: { note: Đề nghị Ban Tổ chức xem xét bố trí công tác phù hợp trong quý I/2027. }
      responses:
        '201':
          description: Đã tạo việc đề xuất bố trí lại.
          headers:
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnualReassignmentResult' }
              examples:
                da-tao:
                  value:
                    annualRatingId: 01928f3e-7b1a-7c3e-9a51-3f2d9c1b0b02
                    taskId: 01928f3e-7b1a-7c3e-9a51-3f2d9c1b0c99
                    relocationProposed: true
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-10]
        scr: [SCR-1001]
        owner: MOD-04
        evt: [EVT-04]
        roles: [appraiser]
        scope: Cd
        rules: [BR-10-04]
        errors: [APPRAISAL-409-NO-REASSIGN-FLAG, APPRAISAL-409-REASSIGN-EXISTS, APPRAISAL-409-VERSION-CONFLICT]
        source: TL-02b SCR-1001 "Lập đề xuất bố trí lại"

  /appraisals/prospect-groups/{periodId}/{orgUnitId}:
    parameters:
      - $ref: '#/components/parameters/PeriodIdPath'
      - $ref: '#/components/parameters/OrgUnitIdPath'
    get:
      tags: [Phân nhóm triển vọng]
      operationId: getProspectGroupBoard
      summary: Bảng phân nhóm triển vọng của đơn vị trong kỳ năm
      description: >-
        Danh sách phân nhóm hiện hành (gồm nhóm gợi ý của hệ thống) của một đơn vị trong kỳ năm.
        Đường dẫn GET là suy luận: TL-02b chỉ ghi PUT và submit, nhưng màn hình cần tải bảng và ETag.
        Gọi ở kỳ quý trả 409 `APPRAISAL-409-PROSPECT-QUARTER` (MSG-10-05, BR-10-07). Dữ liệu C2,
        chỉ `leader` và `appraiser` của đơn vị (BR-10-10).
      responses:
        '200':
          description: Bảng phân nhóm.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProspectGroupBoard' }
              examples:
                nam-2026:
                  $ref: '#/components/examples/ProspectGroupBoardSample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-10]
        scr: [SCR-1002]
        owner: MOD-04
        roles: [leader, appraiser]
        scope: Đv
        rules: [BR-10-07, BR-10-10]
        source: suy luận từ TL-02b SCR-1002 bảng trường; TL-03 appraisal.prospect_group
    put:
      tags: [Phân nhóm triển vọng]
      operationId: saveProspectGroupBoard
      summary: Lưu nháp danh sách phân nhóm triển vọng
      description: >-
        Lưu toàn bộ danh sách (nhóm, thứ tự trong nhóm, lý do khi khác gợi ý, kế hoạch bồi dưỡng).
        Kiểm tra: thứ tự không trùng trong nhóm; người KHTNV năm hoặc có cờ bố trí lại không vào
        `NHOM_1`, `NHOM_2` (422 `APPRAISAL-422-PROSPECT-NOT-ELIGIBLE`, MSG-10-06, BR-10-09); khác gợi
        ý thì lý do 20 đến 1.000 ký tự (lỗi theo trường, MSG-10-07). Chỉ khi danh sách ở `NHAP`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProspectGroupBoardInput' }
            examples:
              nhap:
                value:
                  entries:
                    - personId: 01928f3e-7b1a-7c3e-9a51-3f2d9c1b0201
                      groupCode: NHOM_2
                      rankInGroup: 1
                    - personId: 01928f3e-7b1a-7c3e-9a51-3f2d9c1b0205
                      groupCode: NHOM_1
                      rankInGroup: 2
                      reason: Đồng chí chủ trì thành công đề án chuyển đổi số của Ban, được tập thể đánh giá có khả năng đảm nhận vị trí cao hơn.
                      trainingPlanRef: KH-BD-2027-04
      responses:
        '200':
          description: Đã lưu nháp.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProspectGroupBoard' }
              examples:
                da-luu:
                  $ref: '#/components/examples/ProspectGroupBoardSample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-10]
        scr: [SCR-1002]
        owner: MOD-04
        roles: [leader, appraiser]
        scope: Đv
        rules: [BR-10-07, BR-10-08, BR-10-09, BR-10-10]
        errors: [APPRAISAL-409-PROSPECT-QUARTER, APPRAISAL-422-PROSPECT-NOT-ELIGIBLE, APPRAISAL-409-INVALID-STATUS, APPRAISAL-409-VERSION-CONFLICT]
        source: TL-02b SCR-1002 "Lưu nháp"

  /appraisals/prospect-groups/{periodId}/{orgUnitId}/submit:
    parameters:
      - $ref: '#/components/parameters/PeriodIdPath'
      - $ref: '#/components/parameters/OrgUnitIdPath'
    post:
      tags: [Phân nhóm triển vọng]
      operationId: submitProspectGroupBoard
      summary: Trình tập thể lãnh đạo danh sách phân nhóm
      description: >-
        Khởi động user task thông qua tập thể và khoá chỉnh sửa; danh sách chuyển `DA_TRINH`. Thiếu
        lý do cho điều chỉnh khác gợi ý trả 422. Việc thông qua và ký số danh sách (bước 9 QT-10) do
        workflow-service và esign-service xử lý, không có đường dẫn riêng ở đây.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      responses:
        '200':
          description: Đã trình.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProspectGroupBoard' }
              examples:
                da-trinh:
                  $ref: '#/components/examples/ProspectGroupBoardSample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-10]
        scr: [SCR-1002]
        owner: MOD-04
        evt: [EVT-11]
        roles: [leader]
        scope: Đv
        rules: [BR-10-08, BR-10-09]
        errors: [APPRAISAL-422-REASON-REQUIRED, APPRAISAL-409-INVALID-STATUS, APPRAISAL-409-VERSION-CONFLICT]
        source: TL-02b SCR-1002 "Trình tập thể lãnh đạo"

components:
  securitySchemes:
    keycloak:
      $ref: '../common/common.yaml#/components/securitySchemes/keycloak'
    serviceClient:
      $ref: '../common/common.yaml#/components/securitySchemes/serviceClient'
  parameters:
    FlowQuery:
      name: flow
      in: query
      description: Luồng đánh giá; bỏ trống thì lấy luồng của hồ sơ hoặc mọi luồng tenant bật.
      schema: { $ref: '../common/common.yaml#/components/schemas/Flow' }
    PeriodIdPath:
      name: periodId
      in: path
      required: true
      description: Mã kỳ năm.
      schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    OrgUnitIdPath:
      name: orgUnitId
      in: path
      required: true
      description: Mã đơn vị (`org.org_unit.id`).
      schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }

  schemas:
    AppraisalProfileStatus:
      description: Trạng thái hồ sơ đánh giá `appraisal.appraisal_profile.status` (baseline mục 9.1).
      type: string
      enum: [CHUA_LAP, TU_DANH_GIA, CHO_THAM_DINH, DA_THAM_DINH, CHO_QUYET_DINH, DA_QUYET_DINH, DA_KY_SO, DA_KHOA, KHIEU_NAI]
    AppraisalPeriodKind:
      description: Loại kỳ (`config.period.kind`, TL-03).
      type: string
      enum: [THANG, QUY, NAM, NAM_HOC]
    RatingLevelKind:
      description: Loại mức trong `appraisal.rating_proposal.level_kind` (TL-03).
      type: string
      enum: [TU_DE_XUAT, THAM_DINH, DE_XUAT, QUYET_DINH]
    GeneralCriteriaLevel:
      description: Mức tiêu chí chung (`appraisal.general_criteria_result.level`, BR-09-05).
      type: string
      enum: [THUC_HIEN_TOT, DAM_BAO, CO_BAN_DAM_BAO, KHONG_DAM_BAO]
    GeneralCriteriaStage:
      description: Bước ghi kết quả tiêu chí chung (`general_criteria_result.stage`).
      type: string
      enum: [TU_DANH_GIA, THAM_DINH]
    ScoreSnapshotKind:
      description: Loại ảnh chụp điểm (`score_snapshot.snapshot_kind`).
      type: string
      enum: [TAM_TINH, CHOT_KY, TINH_LAI_HAU_KIEM]
    RatingExplanationType:
      description: Loại giải trình (`rating_explanation.explanation_type`).
      type: string
      enum: [HA_MUC, KHAC_MUC_TRUOC, BAO_LUU]
    AppraisalBatchDecisionStatus:
      description: Trạng thái ký lô (`appraisal.batch_decision.status`).
      type: string
      enum: [NHAP, CHO_KY, DA_KY, LOI_MOT_PHAN, HUY]
    ProspectGroupCode:
      description: Nhóm triển vọng theo PL 5 (`prospect_group.group_code`); dữ liệu C2 dạng rõ có kiểm soát.
      type: string
      enum: [NHOM_1, NHOM_2, NHOM_3, NHOM_4]
    ProspectBoardStatus:
      description: >-
        Trạng thái danh sách phân nhóm của một đơn vị trong kỳ (suy luận: TL-02b nêu "nháp", "trình
        tập thể", "đã ký" và việc không thông qua đưa về nháp; TL-03 chưa có cột trạng thái).
      type: string
      enum: [NHAP, DA_TRINH, DA_KY]
    AppraisalSignProvider:
      description: Nhà cung cấp chữ ký số (`esign` provider, TL-03).
      type: string
      enum: [MYSIGN, VIETTEL_CA, CA_CHINH_PHU, BAN_CO_YEU]
    AppraisalHash:
      description: Băm SHA-256 dạng hex chữ thường (64 ký tự).
      type: string
      pattern: '^[0-9a-f]{64}$'
      examples: ['9f2c4e1a7b3d5f60a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718']

    AppraisalRatingLevels:
      description: Bốn mức đã đưa ra cho một hồ sơ (dòng hiện hành theo từng `level_kind`); `null` khi chưa có.
      type: object
      properties:
        selfProposed:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/RatingLevel'
            - type: 'null'
        appraised:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/RatingLevel'
            - type: 'null'
        proposed:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/RatingLevel'
            - type: 'null'
        decided:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/RatingLevel'
            - type: 'null'
    AppraisalAnomalyHint:
      description: Gợi ý bất thường từ QT-14 hiển thị trên hàng đợi; chỉ để lưu ý, không đổi kết quả.
      type: object
      required: [code, label]
      properties:
        code: { type: string, description: 'Mã dấu hiệu, ví dụ `DAU_HIEU_1`', examples: [DAU_HIEU_1] }
        label: { type: string, examples: ['Tự chấm cao 3 quý'] }
        alertId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }

    AppraisalProfileRow:
      description: Một dòng danh sách hồ sơ (hàng đợi thẩm định, quyết định, hồ sơ của tôi).
      type: object
      required: [id, person, orgUnit, period, periodKind, flow, status, levels, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        person: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        jobTitle: { type: string, description: 'Chức vụ (`org_replica.person_v`)' }
        orgUnit: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        periodKind: { $ref: '#/components/schemas/AppraisalPeriodKind' }
        flow: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        status: { $ref: '#/components/schemas/AppraisalProfileStatus' }
        isHead: { type: boolean, description: 'Người đứng đầu (BR-09-13)' }
        totalScore: { type: [number, 'null'], minimum: 0, maximum: 100, description: 'Điểm của ảnh chụp hiện hành' }
        autoRatingCode:
          description: Mức hệ thống tính (tham khảo).
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/RatingLevel'
            - type: 'null'
        levels: { $ref: '#/components/schemas/AppraisalRatingLevels' }
        differsExplained: { type: boolean, description: 'Có mức khác bước trước và đã giải trình (cột ghi chú SCR-0904)' }
        noSelfAssessment: { type: boolean, description: 'Quá hạn không tự đánh giá, chuyển thẩm định với mức tự đề xuất trống (QT-09 ngoại lệ 3)' }
        dueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        anomalyHints:
          type: array
          items: { $ref: '#/components/schemas/AppraisalAnomalyHint' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    AppraisalProfilePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AppraisalProfileRow' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }

    GeneralCriteriaItem:
      description: Kết quả một nhóm tiêu chí chung (`appraisal.general_criteria_result`).
      type: object
      required: [criteriaCode, met]
      properties:
        criteriaCode: { type: string, maxLength: 16, examples: [TCC-01] }
        label: { type: string, description: 'Tên tiêu chí lấy từ Policy Pack (suy luận)', examples: ['Bản lĩnh chính trị, tư tưởng'] }
        met: { type: boolean }
        comment:
          type: string
          maxLength: 2000
          x-classification: C2
          description: Nhận xét theo tiêu chí (C2).
    GeneralCriteriaResult:
      description: Tiêu chí chung của một bước, kèm tỷ lệ đáp ứng và mức quy đổi (BR-09-05).
      type: object
      required: [stage, items, complianceRatio, level]
      properties:
        stage: { $ref: '#/components/schemas/GeneralCriteriaStage' }
        items:
          type: array
          items: { $ref: '#/components/schemas/GeneralCriteriaItem' }
        complianceRatio: { type: number, minimum: 0, maximum: 1 }
        level: { $ref: '#/components/schemas/GeneralCriteriaLevel' }
    AppraisalTaskClaim:
      description: >-
        B, C cán bộ tự nhận cho một nhiệm vụ (`self_assessment.claims_json`), dùng cho bảng so sánh
        trên SCR-0902 (cấu trúc suy luận).
      type: object
      required: [taskId]
      properties:
        taskId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        qualityLevel: { $ref: '../common/common.yaml#/components/schemas/QualityLevel' }
        delayDays: { type: integer, minimum: 0 }
        delayFactor:
          type: number
          minimum: 0
          maximum: 1
          readOnly: true
          description: >-
            Hệ số C quy đổi từ `delayDays` theo bảng tiến độ của Policy Pack hồ sơ đang ghim; máy chủ tính,
            client không gửi (SCR-0902 trường 5, suy luận tên trường).
    AppraisalSelfAssessment:
      description: Phiếu tự đánh giá hiện hành (`appraisal.self_assessment` cùng mức `TU_DE_XUAT`).
      type: object
      required: [versionNo]
      properties:
        versionNo: { type: integer, minimum: 1, description: 'Lần nộp; nộp lại sau trả lại tạo phiên bản mới' }
        formCode: { type: string, examples: [MAU_2] }
        formVersion: { type: string, examples: ['1.0'] }
        selfRatingCode:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/RatingLevel'
            - type: 'null'
        breakthrough:
          type: string
          maxLength: 2000
          x-classification: C2
          description: Giải pháp đột phá (`breakthrough_enc`).
        breakthroughEvidenceIds:
          type: array
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        reason:
          type: string
          maxLength: 2000
          x-classification: C2
          description: Giải trình khác mức tham khảo (`rating_proposal.reason_enc`).
        content:
          type: string
          maxLength: 2000
          x-classification: C2
          description: Ưu điểm, hạn chế, hướng khắc phục (`content_enc`).
        strengths: { type: string, maxLength: 2000, x-classification: C2, description: 'Ưu điểm (`strengths_enc`)' }
        weaknesses: { type: string, maxLength: 2000, x-classification: C2, description: 'Hạn chế (`weaknesses_enc`)' }
        remedialPlan: { type: string, maxLength: 2000, x-classification: C2, description: 'Hướng khắc phục (`remedial_plan_enc`)' }
        claims:
          type: array
          items: { $ref: '#/components/schemas/AppraisalTaskClaim' }
        claimedScore:
          type: [number, 'null']
          readOnly: true
          description: >-
            Điểm tự tính theo B, C cán bộ tự nhận, thẻ "Điểm tự tính (theo minh chứng nộp)" của SCR-0902 trường 4.
            Máy chủ (SVC-07) tính bằng cùng công thức Policy Pack với điểm chính thức nhưng thay B, C bằng
            `claims`; không phải ảnh chụp điểm bất biến; `null` khi phiếu chưa có `claims` (suy luận tên trường).
        contentHash: { $ref: '#/components/schemas/AppraisalHash' }
        savedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        submittedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        signedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    AppraisalSignature:
      description: Thông tin chữ ký của một mốc (SCR-0902 trường 3).
      type: object
      required: [signedAt, provider]
      properties:
        signedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        provider: { $ref: '#/components/schemas/AppraisalSignProvider' }
        signRequestId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        contentHash: { $ref: '#/components/schemas/AppraisalHash' }
        valid: { type: boolean, description: 'Kết quả kiểm tra chữ ký khi mở' }
    AppraisalRatingProposal:
      description: Một mức do con người đưa ra (`appraisal.rating_proposal`).
      type: object
      required: [id, levelKind, ratingCode, actor, actorRole, proposedAt, isCurrent]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        levelKind: { $ref: '#/components/schemas/RatingLevelKind' }
        ratingCode: { $ref: '../common/common.yaml#/components/schemas/RatingLevel' }
        actor: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        actorRole:
          type: string
          description: Vai trò khi đưa ra mức (TL-03 `actor_role`, giữ đúng giá trị CHECK).
          enum: [staff, appraiser, manager, decider]
        isCurrent: { type: boolean }
        differsFromPrev: { type: boolean }
        explanationRequired: { type: boolean }
        isBulkDecision: { type: boolean }
        batchDecisionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        scoreSnapshotId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        reason:
          type: string
          maxLength: 2000
          x-classification: C2
          description: Lý do đưa ra mức (`reason_enc`).
        comment:
          type: string
          maxLength: 4000
          x-classification: C2
          description: Nhận xét (`comment_enc`).
        proposedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        signedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    AppraisalQuarterRating:
      description: Kết quả một quý dùng cho hồ sơ năm.
      type: object
      required: [period, ratingCode]
      properties:
        period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        ratingCode:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/RatingLevel'
            - type: 'null'
        totalScore: { type: [number, 'null'] }
        policyVersion: { type: string, examples: ['KHOI_DANG v1.4'] }
        snapshotId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        inputHash: { $ref: '#/components/schemas/AppraisalHash' }
    AppraisalProfile:
      description: Hồ sơ đánh giá của một người, một kỳ, một luồng (`appraisal.appraisal_profile`).
      type: object
      required: [id, person, orgUnit, period, periodKind, flow, status, availableFlows, ratingTrail, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        person: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        jobTitle: { type: string }
        orgUnit: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        periodKind: { $ref: '#/components/schemas/AppraisalPeriodKind' }
        flow: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        availableFlows:
          description: Các luồng tenant bật cho người này trong kỳ (thẻ luồng SCR-0901).
          type: array
          items: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        status: { $ref: '#/components/schemas/AppraisalProfileStatus' }
        isHead: { type: boolean }
        isLeadership: { type: boolean }
        policyVersion: { type: string, description: 'Nhãn phiên bản Policy Pack gắn với hồ sơ', examples: ['KHOI_DANG v2.0'] }
        currentSnapshotId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        finalRatingCode:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/RatingLevel'
            - type: 'null'
        selfAssessDue: { $ref: '../common/common.yaml#/components/schemas/Date' }
        workingDaysLeft: { type: integer, description: 'Số ngày làm việc còn lại tới hạn nộp, tính theo lịch nghỉ của tenant' }
        returnCount: { type: integer, minimum: 0, description: 'Số lần đã trả lại (suy luận, phục vụ MSG-09-09)' }
        returnLimit: { type: integer, minimum: 0, description: 'Số lần trả lại tối đa theo tham số luồng (suy luận)' }
        noSelfAssessment: { type: boolean }
        complaintDeadline: { $ref: '../common/common.yaml#/components/schemas/Date' }
        submittedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        decidedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        lockedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        appraiser: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        decider: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        generalCriteria:
          type: array
          description: Kết quả tiêu chí chung theo từng bước đã có.
          items: { $ref: '#/components/schemas/GeneralCriteriaResult' }
        selfAssessment:
          oneOf:
            - $ref: '#/components/schemas/AppraisalSelfAssessment'
            - type: 'null'
        submissionSignature: { $ref: '#/components/schemas/AppraisalSignature' }
        ratingTrail:
          description: Vết các mức (mọi dòng `rating_proposal`, gồm dòng không còn hiện hành), theo thời gian.
          type: array
          items: { $ref: '#/components/schemas/AppraisalRatingProposal' }
        quarterRatings:
          description: Chỉ có ở hồ sơ năm; bốn kết quả quý chỉ đọc.
          type: array
          maxItems: 4
          items: { $ref: '#/components/schemas/AppraisalQuarterRating' }
        anomalyHints:
          type: array
          items: { $ref: '#/components/schemas/AppraisalAnomalyHint' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }

    AppraisalSelfAssessmentInput:
      description: Nội dung lưu nháp phiếu tự đánh giá; mọi trường tuỳ chọn khi lưu nháp.
      type: object
      properties:
        criteria:
          type: array
          maxItems: 30
          items:
            type: object
            required: [criteriaCode, met]
            properties:
              criteriaCode: { type: string, maxLength: 16 }
              met: { type: boolean }
        selfRatingCode: { $ref: '../common/common.yaml#/components/schemas/RatingLevel' }
        breakthrough:
          type: string
          maxLength: 2000
          x-classification: C2
          description: Bắt buộc khi nộp với HTXSNV, kèm ít nhất một minh chứng `DA_XAC_NHAN`.
        breakthroughEvidenceIds:
          type: array
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        reason:
          type: string
          maxLength: 2000
          x-classification: C2
          description: Bắt buộc 20 đến 2.000 ký tự khi nộp nếu mức tự đề xuất khác mức tham khảo.
        content:
          type: string
          maxLength: 2000
          x-classification: C2
          description: Bắt buộc khi nộp.
        strengths: { type: string, maxLength: 2000, x-classification: C2 }
        weaknesses: { type: string, maxLength: 2000, x-classification: C2 }
        remedialPlan: { type: string, maxLength: 2000, x-classification: C2 }
        claims:
          type: array
          items: { $ref: '#/components/schemas/AppraisalTaskClaim' }
    AppraisalSignRequestInput:
      description: Tham số tạo yêu cầu ký khi nộp phiếu.
      type: object
      properties:
        signProvider: { $ref: '#/components/schemas/AppraisalSignProvider' }
        formCode:
          type: string
          description: Biểu mẫu sinh bản ký (Mẫu 1B hoặc Mẫu 2); bỏ trống thì theo khối đối tượng.
          examples: [MAU_2]
        contentHash:
          $ref: '#/components/schemas/AppraisalHash'
          description: Băm phiếu client đã xem trước; lệch với máy chủ trả 409 (suy luận, chống ký nội dung khác).
    AppraisalReturnInput:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 20
          maxLength: 2000
          x-classification: C2
          description: Lý do trả lại (độ dài suy luận theo quy ước lý do của TL-02b).
    AppraisalReviewInput:
      description: Kết luận thẩm định (SCR-0902 trường 6 đến 8).
      type: object
      required: [ratingCode, comment]
      properties:
        ratingCode: { $ref: '../common/common.yaml#/components/schemas/RatingLevel' }
        comment:
          type: string
          minLength: 1
          maxLength: 4000
          x-classification: C2
        reason:
          type: string
          minLength: 20
          maxLength: 2000
          x-classification: C2
          description: Bắt buộc khi mức thẩm định khác mức tự đề xuất (BR-09-12).
        generalCriteria:
          description: Kết quả tiêu chí chung ở bước thẩm định nếu khác tự đánh giá (suy luận từ `stage = THAM_DINH`).
          type: array
          items:
            type: object
            required: [criteriaCode, met]
            properties:
              criteriaCode: { type: string, maxLength: 16 }
              met: { type: boolean }
        signProvider: { $ref: '#/components/schemas/AppraisalSignProvider' }
    AppraisalProposalInput:
      type: object
      required: [ratingCode]
      properties:
        ratingCode: { $ref: '../common/common.yaml#/components/schemas/RatingLevel' }
        reason:
          type: string
          minLength: 20
          maxLength: 2000
          x-classification: C2
          description: Bắt buộc khi khác mức thẩm định (MSG-09-12).
        comment: { type: string, maxLength: 4000, x-classification: C2 }

    AppraisalRuleCheck:
      description: Một điều kiện của mức xếp loại, đạt hay chưa (`rule_checks`, `conditions_json`).
      type: object
      required: [ratingCode, label, met]
      properties:
        ratingCode: { $ref: '../common/common.yaml#/components/schemas/RatingLevel' }
        label: { type: string, examples: ['≥ 30% nhiệm vụ vượt mục tiêu'] }
        met: { type: boolean }
        actual: { type: string, description: 'Giá trị thực tế đã định dạng', examples: ['22%'] }
        threshold: { type: string, examples: ['30%'] }
        legalRef: { type: string, examples: ['QĐ Điều 11'] }
    AppraisalDowngradeReason:
      description: Một lý do hạ mức (`downgrade_reasons`).
      type: object
      required: [fromRating, toRating, text]
      properties:
        fromRating: { $ref: '../common/common.yaml#/components/schemas/RatingLevel' }
        toRating: { $ref: '../common/common.yaml#/components/schemas/RatingLevel' }
        text: { type: string, maxLength: 1000 }
        legalRef: { type: string }
    AppraisalScoreTaskLine:
      description: Một nhiệm vụ trong bảng kết quả (`group_scores_json`, `detail_json`).
      type: object
      required: [taskId, title, kpi]
      properties:
        taskId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        title: { type: string }
        approvedQuantity: { type: number }
        plannedQuantity: { type: number }
        a: { type: number, minimum: 0, maximum: 1 }
        b: { $ref: '../common/common.yaml#/components/schemas/QualityLevel' }
        c: { type: number, minimum: 0, maximum: 1 }
        kpi: { type: number, minimum: 0, maximum: 1 }
        exceedsTarget: { type: boolean }
        acceptanceId:
          $ref: '../common/common.yaml#/components/schemas/Uuid'
          description: Lần nghiệm thu quyết định B, C của dòng (`product.acceptance.id`).
        acceptanceNote:
          type: string
          maxLength: 500
          description: >-
            Căn cứ điều chỉnh B, C so với tự nhận, ghép từ `product.acceptance` (ví dụ "B: phải sửa nội dung
            cơ bản (biên bản nghiệm thu 18/12)"); SCR-0902 trường 5 (suy luận tên trường).
        evidenceId:
          $ref: '../common/common.yaml#/components/schemas/Uuid'
          description: Minh chứng đã được nghiệm thu, mở bằng `GET /evidences/{id}/versions/{v}`.
        evidenceVersionNo:
          type: integer
          minimum: 1
          description: Số phiên bản minh chứng đã nghiệm thu, đi cùng `evidenceId`.
    AppraisalScoreGroup:
      description: Một nhóm nhiệm vụ (then chốt, thường xuyên) với KPI nhóm và điểm (BR-09-03).
      type: object
      required: [code, label, kpi, maxScore, score]
      properties:
        code: { type: string, examples: [THEN_CHOT] }
        label: { type: string, examples: ['Nhiệm vụ then chốt'] }
        kpi: { type: number, minimum: 0, maximum: 1 }
        maxScore: { type: number }
        score: { type: number }
        tasks:
          type: array
          items: { $ref: '#/components/schemas/AppraisalScoreTaskLine' }
    AppraisalScoreSnapshot:
      description: Ảnh chụp điểm bất biến do SVC-07 tính (`appraisal.score_snapshot`); chỉ đọc.
      type: object
      required: [id, profileId, flow, snapshotKind, policyVersion, inputHash, snapshotHash, totalScore, autoRatingCode, ruleChecks, downgradeReasons, groups, computedAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        profileId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        flow: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        snapshotKind: { $ref: '#/components/schemas/ScoreSnapshotKind' }
        scoreResultId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        policyPackVersionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        policyVersion: { type: string, maxLength: 32 }
        policyContentHash: { $ref: '#/components/schemas/AppraisalHash' }
        inputHash: { $ref: '#/components/schemas/AppraisalHash' }
