                      Số lệch theo trường lệch cho các thẻ lọc của vùng 2 ("Chức vụ 168, Đơn vị 121…"); khoá là
                      giá trị `OrgDiscrepancyField`, tính trên cùng bộ lọc `unresolved` và `severity`, bỏ qua
                      bộ lọc `field`. Trường không có lệch có thể vắng (suy luận).
                    propertyNames: { $ref: '#/components/schemas/OrgDiscrepancyField' }
                    additionalProperties: { type: integer, minimum: 0 }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-01]
        scr: [SCR-0104]
        owner: SVC-04
        roles: [tenant_admin]
        scope: Tn
        source: 'TL-02a SCR-0104 vùng 2'

  /org/discrepancies/resolve:
    post:
      tags: [Đồng bộ nhân sự]
      operationId: resolveOrgDiscrepancies
      summary: Xử lý lệch hàng loạt
      description: >-
        Lấy theo nguồn (ghi phiên bản mới, phát EVT-15 hoặc EVT-16) hoặc giữ dữ liệu nội bộ (bỏ qua cho
        tới khi nguồn đổi). Áp dụng hàng loạt cần phiên AAL2. Mức Cao còn tồn chặn kích hoạt tenant.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, resolution]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
                resolution: { $ref: '#/components/schemas/DiscrepancyResolution' }
                effectiveFrom: { $ref: '../common/common.yaml#/components/schemas/Date' }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Kết quả từng mục.
          content:
            application/json:
              schema:
                type: object
                required: [results, assignmentsUpdated]
                properties:
                  results:
                    type: array
                    items: { $ref: '../common/common.yaml#/components/schemas/BatchItemResult' }
                  assignmentsUpdated:
                    type: integer
                    minimum: 0
                    description: >-
                      Số phân công đã ghi phiên bản mới với ngày hiệu lực theo quyết định gốc ({m} của
                      MSG-01-13); 0 khi chỉ giữ dữ liệu nội bộ.
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-01]
        scr: [SCR-0104]
        owner: SVC-04
        evt: [EVT-15, EVT-16]
        roles: [tenant_admin]
        scope: Tn
        aal: 2
        source: 'TL-02a SCR-0104 "Lấy theo nguồn", "Giữ dữ liệu nội bộ"'

  /org/discrepancies/{id}/map:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Đồng bộ nhân sự]
      operationId: mapOrgDiscrepancy
      summary: Ánh xạ thủ công bản ghi người
      description: Chọn bản ghi người đúng cho dòng không khớp, ghi `integ.mapping_xref`, phát EVT-16.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [personId]
              properties:
                personId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
      responses:
        '200':
          description: Dòng lệch sau khi ánh xạ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgDiscrepancy' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409':
          description: Mã ngoài đã ánh xạ tới người khác (`ORG-409-XREF-EXISTS`).
          $ref: '../common/common.yaml#/components/responses/Conflict'
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-01]
        scr: [SCR-0104]
        owner: SVC-04
        evt: [EVT-16]
        roles: [tenant_admin]
        scope: Tn
        source: 'TL-02a SCR-0104 "Ánh xạ thủ công"'

  /org/discrepancies/{id}/assign:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Đồng bộ nhân sự]
      operationId: assignOrgDiscrepancy
      summary: Ghi chú, giao xử lý
      description: Giao cho cán bộ tổ chức đơn vị kiểm tra; phát EVT-21.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assigneeId]
              properties:
                assigneeId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
                note: { type: string, maxLength: 1000 }
      responses:
        '200':
          description: Dòng lệch sau khi giao.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OrgDiscrepancy' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-01]
        scr: [SCR-0104]
        owner: SVC-04
        evt: [EVT-21]
        roles: [tenant_admin]
        scope: Tn
        source: 'TL-02a SCR-0104 "Ghi chú, giao xử lý"'

  /org/persons/me/public-keys:
    post:
      tags: [Khoá mã hoá đầu cuối]
      operationId: registerMyPublicKey
      summary: Đăng ký khoá công khai của thiết bị hoặc chứng thư số vào danh bạ khoá
      description: >-
        Thiết bị sinh cặp khoá ECDH P-256 không trích xuất được và đăng ký khoá công khai khi người dùng đăng
        nhập có MFA lần đầu trên thiết bị (ADR-27). Máy chủ kiểm dạng SubjectPublicKeyInfo đúng thuật toán, tính
        vân tay SHA-256 của SPKI, ký bản ghi bằng khoá danh bạ của tenant qua OpenBao Transit (không giữ khoá
        trong mã) và ghi sổ cái `sys.audit.v1` trong cùng giao dịch. Vân tay đã có trong tenant trả 409
        (`ORG-409-PUBLIC-KEY-EXISTS`).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicKeyRegistration' }
      responses:
        '201':
          description: Khoá công khai đã đăng ký và ký.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonPublicKey' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409':
          description: Vân tay khoá đã có trong danh bạ của tenant (`ORG-409-PUBLIC-KEY-EXISTS`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: '../common/common.yaml#/components/responses/ServiceUnavailable' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-00]
        scr: [SCR-0001]
        owner: SVC-04
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        aal: 2
        source: 'TL-01 "Quản lý khoá người nhận" (ADR-27); TL-03 org.person_public_key; TL-04 SEC-25'

  /org/persons/{id}/public-keys:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Khoá mã hoá đầu cuối]
      operationId: listPersonPublicKeys
      summary: Khoá công khai của một cán bộ trong danh bạ khoá
      description: >-
        Trình duyệt người gửi lấy khoá công khai của từng người nhận để bọc khoá nội dung C3 (TL-01 "Mô hình
        mã hoá" bước 1). Mặc định chỉ trả khoá còn hiệu lực; khoá quá `validTo` trả trạng thái `HET_HAN`. Mỗi
        khoá kèm chữ ký của danh bạ để thiết bị kiểm trước khi dùng.
      parameters:
        - name: includeInactive
          in: query
          description: Trả cả khoá đã thu hồi hoặc hết hạn (đối chiếu lịch sử).
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Danh sách khoá công khai.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PersonPublicKey' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05]
        scr: [SCR-0501]
        owner: SVC-04
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: Tn
        source: 'TL-01 "Mô hình mã hoá" bước 1, "Quản lý khoá người nhận"'

  /org/public-keys/{id}/revoke:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Khoá mã hoá đầu cuối]
      operationId: revokePublicKey
      summary: Thu hồi khoá công khai (mất thiết bị, đổi chứng thư)
      description: >-
        Chủ khoá hoặc quản trị tenant thu hồi khoá; khoá chuyển `THU_HOI`, không dùng để bọc khoá nội dung mới.
        Thu hồi được ghi sổ cái. Thu hồi lại khoá đã thu hồi trả 200 với bản ghi hiện tại.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PublicKeyRevocation' }
      responses:
        '200':
          description: Khoá sau khi thu hồi.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PersonPublicKey' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-00]
        scr: [SCR-0001]
        owner: SVC-04
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        aal: 2
        source: 'TL-01 "Khôi phục khi mất khoá"; TL-03 org.person_public_key.status'

  /org/e2ee/directory-keys:
    get:
      tags: [Khoá mã hoá đầu cuối]
      operationId: listE2eeDirectoryKeys
      summary: Khoá công khai của danh bạ khoá tenant để kiểm chữ ký
      description: >-
        Các phiên bản khoá ký ECDSA P-256 của danh bạ khoá tenant (OpenBao Transit). Thiết bị dùng để kiểm
        chữ ký `signature` của khoá người nhận và khoá phục hồi trước khi bọc khoá nội dung.
      responses:
        '200':
          description: Các phiên bản khoá ký.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DirectoryKey' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '503': { $ref: '../common/common.yaml#/components/responses/ServiceUnavailable' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05]
        scr: [SCR-0501]
        owner: SVC-04
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: Tn
        source: 'TL-01 "Quản lý khoá người nhận" (bản ghi đăng ký được ký bằng khoá danh bạ của tenant)'

  /org/e2ee/recovery-key:
    get:
      tags: [Khoá mã hoá đầu cuối]
      operationId: getRecoveryKey
      summary: Khoá phục hồi của tổ chức đang hiệu lực
      description: >-
        Mỗi khoá nội dung C3 luôn được bọc thêm cho khoá phục hồi của tenant (ADR-27). Người gửi lấy khoá công
        khai phục hồi ở đây; `id` là mã người nhận đại diện dùng trong bản bọc. Chưa khai báo trả 404. Tài khoản
        dịch vụ (`service_client`, tenant trong `X-Tenant-Id`) của mission-core đọc để đồng bộ cấu hình tenant
        `e2ee.recovery-key`.
      responses:
        '200':
          description: Khoá phục hồi đang hiệu lực.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryKey' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05]
        scr: [SCR-0501]
        owner: SVC-04
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector, service_client]
        scope: Tn
        source: 'TL-01 "Khôi phục khi mất khoá"; TL-04 SEC-25'

  /org/e2ee/recovery-keys:
    post:
      tags: [Khoá mã hoá đầu cuối]
      operationId: rotateRecoveryKey
      summary: Khai báo hoặc thay khoá phục hồi của tổ chức
      description: >-
        Quản trị tenant ghi khoá công khai phục hồi sinh ở máy trạm cách ly; khoá riêng chia Shamir 3 trên 5
        cho năm cán bộ giữ mảnh theo biên bản, không đi qua máy chủ. Khoá mới có hiệu lực ngay, khoá cũ chuyển
        `THU_HOI` nhưng vẫn mở được bản bọc đã có ở máy trạm. Ghi sổ cái.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryKeyInput' }
      responses:
        '201':
          description: Khoá phục hồi mới.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryKey' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409':
          description: Vân tay khoá đã có trong danh bạ của tenant (`ORG-409-PUBLIC-KEY-EXISTS`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: '../common/common.yaml#/components/responses/ServiceUnavailable' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-01]
        scr: [SCR-0103]
        owner: SVC-04
        roles: [tenant_admin]
        scope: Tn
        aal: 2
        source: 'TL-01 "Khôi phục khi mất khoá"; TL-04 SEC-25 (mảnh khoá giao trực tiếp theo biên bản)'

  /org/e2ee/recoveries:
    post:
      tags: [Khoá mã hoá đầu cuối]
      operationId: recordE2eeRecovery
      summary: Ghi một lần phục hồi tổ chức
      description: >-
        Ghi lần phục hồi đã làm ở máy trạm cách ly: ít nhất ba người giữ mảnh của khoá phục hồi cùng có mặt,
        khoá nội dung của đối tượng được bọc lại cho khoá thiết bị mới của người nhận. Máy chủ chỉ lưu nhật ký
        (không nhận mảnh khoá hay khoá riêng), ký bản ghi và ghi sổ cái.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecoveryRecordInput' }
      responses:
        '201':
          description: Nhật ký lần phục hồi.
          headers:
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryRecord' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '503': { $ref: '../common/common.yaml#/components/responses/ServiceUnavailable' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-01]
        scr: [SCR-0103]
        owner: SVC-04
        roles: [tenant_admin]
        scope: Tn
        aal: 2
        source: 'TL-01 "Khôi phục khi mất khoá" (mọi lần khôi phục ghi sổ cái)'
    get:
      tags: [Khoá mã hoá đầu cuối]
      operationId: listE2eeRecoveries
      summary: Nhật ký các lần phục hồi tổ chức
      parameters:
        - name: objectId
          in: query
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang nhật ký, mới nhất trước.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RecoveryRecord' }
                  nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-12]
        scr: [SCR-0103]
        owner: SVC-04
        roles: [tenant_admin, inspector]
        scope: Tn
        aal: 2
        source: 'TL-01 "Khôi phục khi mất khoá"; TL-04 SEC-25'

  /org/e2ee/recoveries/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Khoá mã hoá đầu cuối]
      operationId: getE2eeRecovery
      summary: Một biên bản khôi phục khoá (đối chiếu nội bộ)
      description: >-
        mission-core đọc biên bản khôi phục để đối chiếu trước khi nhận khoá bọc khôi phục
        (`restoreTaskSecretKeyWrap`, `restoreEvidenceKeyWrap`). Chỉ tài khoản dịch vụ (`service_client`,
        tenant trong `X-Tenant-Id`); người dùng xem nhật ký qua `listE2eeRecoveries`.
      responses:
        '200':
          description: Biên bản khôi phục.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecoveryRecord' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05, QT-07]
        scr: [SCR-0103]
        owner: SVC-04
        roles: [service_client]
        scope: Tn
        source: 'TL-01 "Khôi phục khi mất khoá" (mọi lần khôi phục ghi sổ cái)'

components:
  securitySchemes:
    keycloak:
      $ref: '../common/common.yaml#/components/securitySchemes/keycloak'
  parameters:
    AsOf:
      name: asOf
      in: query
      description: Ngày trên trục hiệu lực (`valid_from`/`valid_to`); bỏ trống là hôm nay.
      schema: { $ref: '../common/common.yaml#/components/schemas/Date' }
    RecordedAsOf:
      name: recordedAsOf
      in: query
      description: Thời điểm trên trục ghi nhận (`recorded_from`/`recorded_to`); bỏ trống là hiện tại.
      schema: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
  schemas:
    AssignmentKind:
      description: Loại phân công (`org.assignment.kind`).
      type: string
      enum: [CHINH, KIEM_NHIEM, DIEU_DONG, BIET_PHAI, TAM_GIU]
    Assignment:
      description: Phân công còn hiệu lực (`org_replica.assignment_v`) kèm vai trò (`config.role_binding`).
      type: object
      required: [id, orgUnitId, orgUnitName, jobTitleName, kind, branch, roles, validFrom]
      properties:
        id: { type: string }
        orgUnitId: { type: string }
        orgUnitName: { type: string }
        jobTitleName: { type: string }
        kind: { $ref: '#/components/schemas/AssignmentKind' }
        branch: { $ref: '../common/common.yaml#/components/schemas/Branch' }
        roles:
          type: array
          items: { type: string }
        validFrom: { $ref: '../common/common.yaml#/components/schemas/Date' }
        validTo: { type: [string, 'null'], format: date }
    MyOrgProfile:
      type: object
      required: [personId, fullName, assignments]
      properties:
        personId: { type: string }
        fullName: { type: string }
        assignments:
          type: array
          items: { $ref: '#/components/schemas/Assignment' }
        lastAssignmentId: { type: [string, 'null'], description: Phân công dùng lần trước (chọn sẵn) }
      examples:
        - personId: 01928f3e-1111-7000-8000-000000000001
          fullName: Nguyễn Văn An
          lastAssignmentId: 01928f3e-2222-7000-8000-000000000001
          assignments:
            - id: 01928f3e-2222-7000-8000-000000000001
              orgUnitId: 01928f3e-3333-7000-8000-000000000001
              orgUnitName: Ban Tổ chức Đảng uỷ khối
              jobTitleName: Chuyên viên
              kind: CHINH
              branch: DANG
              roles: [member]
              validFrom: '2024-01-01'
              validTo: null
    WorkContext:
      type: object
      required: [assignmentId, orgUnitId, roles]
      properties:
        assignmentId: { type: string }
        orgUnitId: { type: string }
        roles:
          type: array
          items: { type: string }
    OrgPerson:
      description: Cán bộ trong bản sao cây tổ chức (`org_replica.person_v`); không chứa dữ liệu C2.
      type: object
      required: [id, name, title, unitId, unitName]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        name: { type: string }
        title: { type: string, description: Chức danh }
        unitId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        unitName: { type: string }
    OrgUnitRef:
      type: object
      required: [id, name, parentId]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        name: { type: string }
        parentId: { type: [string, 'null'], format: uuid }
    OrgUnitType:
      description: Loại đơn vị (`org.org_unit.unit_type`).
      type: string
      enum: [TO_CHUC_DANG, CHI_BO, CO_QUAN, DON_VI_SU_NGHIEP, PHONG_BAN, XA_PHUONG, DOANH_NGHIEP]
    OrgTreeKind:
      description: Cây tổ chức (`org.org_unit_relation.tree`).
      type: string
      enum: [DANG, CHUYEN_MON]
    OrgUnitInput:
      description: Nội dung sửa đơn vị (SCR-0103 trường 3–9, 11).
      type: object
      required: [code, name, level, unitType, subjectGroupId, flows, validFrom]
      properties:
        code: { type: string, maxLength: 30, description: 'TL-02 giới hạn 30 ký tự, TL-03 cột `varchar(50)`' }
        nationalCode: { type: string, description: Mã CSDL CBCCVC (`integ.mapping_xref.external_id`) }
        name: { type: string, minLength: 1, maxLength: 255 }
        shortName: { type: string, maxLength: 100 }
        level: { type: string, description: 'Cấp (TW, tỉnh, xã); TL-03 chưa có CHECK IN' }
        unitType: { $ref: '#/components/schemas/OrgUnitType' }
        subjectGroupId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        flows:
          type: array
          minItems: 1
          items: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        parentId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        validFrom: { $ref: '../common/common.yaml#/components/schemas/Date' }
        validTo: { type: [string, 'null'], format: date }
    OrgUnit:
      description: Một phiên bản đơn vị (`org.org_unit`) theo hai trục thời gian.
      allOf:
        - $ref: '#/components/schemas/OrgUnitInput'
        - type: object
          required: [id, versionId, recordedFrom, rowVersion]
          properties:
            id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            versionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            parentName: { type: string }
            subjectGroupName: { type: string }
            predecessorIds:
              type: array
              items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            recordedFrom: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
            recordedByName: { type: string }
            assignmentCount: { type: integer }
            rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    OrgUnitSearchHit:
      description: Đơn vị khớp tìm kiếm kèm chuỗi tổ tiên để mở cây.
      type: object
      required: [id, code, name, unitType, ancestors]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string }
        name: { type: string }
        unitType: { $ref: '#/components/schemas/OrgUnitType' }
        ancestors:
          type: array
          description: Tổ tiên từ gốc tới cha trực tiếp tại thời điểm hỏi; rỗng khi là gốc.
          items:
            type: object
            required: [id, name]
            properties:
              id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
              code: { type: string }
              name: { type: string }
    OrgUnitVersion:
      description: Một phiên bản đơn vị trên hai trục thời gian, cho vùng "Lịch sử thay đổi".
      type: object
      required: [versionId, code, name, validFrom, recordedFrom]
      properties:
        versionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string }
        name: { type: string }
        parentName: { type: string }
        subjectGroupName: { type: string }
        validFrom: { $ref: '../common/common.yaml#/components/schemas/Date' }
        validTo: { type: [string, 'null'], format: date }
        recordedFrom: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        recordedTo:
          type: [string, 'null']
          format: date-time
          description: Có khi phiên bản đã bị đính chính trên trục ghi nhận.
        recordedByName: { type: string }
        changeType: { $ref: '#/components/schemas/OrgChangeType' }
        changeOrder:
          type: object
          description: Quyết định làm phát sinh phiên bản; vắng với sửa thông tin không cần quyết định.
          required: [id, orderNo]
          properties:
            id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            orderNo: { type: string }
            orderDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
            signedDocRef: { type: string }
        changedFields:
          type: array
          description: 'Tên trường đổi so với phiên bản trước, ví dụ `name`, `parentId` (suy luận)'
          items: { type: string }
    OrgUnitAssignment:
      description: Phân công thuộc đơn vị tại thời điểm hỏi (SCR-0103 trường 13).
      type: object
      required: [id, personId, personName, jobTitleName, kind, validFrom]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        personId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        personName: { type: string }
        jobTitleName: { type: string }
        kind: { $ref: '#/components/schemas/AssignmentKind' }
        branch: { $ref: '../common/common.yaml#/components/schemas/Branch' }
        validFrom: { $ref: '../common/common.yaml#/components/schemas/Date' }
        validTo: { type: [string, 'null'], format: date }
    SubjectGroup:
      description: Khối đối tượng đánh giá (`org.subject_group`, PL 2A).
      type: object
      required: [id, code, name, flow]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 16, examples: [K1] }
        name: { type: string, maxLength: 255 }
        flow:
          type: string
          enum: [DANG, NHA_NUOC, CA_HAI]
        description: { type: string }
        validFrom: { $ref: '../common/common.yaml#/components/schemas/Date' }
        validTo: { type: [string, 'null'], format: date }
    OrgTreeNode:
      type: object
      required: [id, name, unitType, hasChildren]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string }
        name: { type: string }
        unitType: { $ref: '#/components/schemas/OrgUnitType' }
        hasChildren: { type: boolean }
        children:
          type: array
          items: { $ref: '#/components/schemas/OrgTreeNode' }
    OrgTree:
      type: object
      required: [asOf, recordedAsOf, readOnly, roots]
      properties:
        asOf: { $ref: '../common/common.yaml#/components/schemas/Date' }
        recordedAsOf: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        readOnly: { type: boolean, description: Đúng khi xem quá khứ }
        roots:
          type: array
          items: { $ref: '#/components/schemas/OrgTreeNode' }
    OrgChangeType:
      description: >-
        Loại thay đổi tổ chức theo hộp chọn SCR-0103 (thành lập, đổi tên, sáp nhập, hợp nhất, chia tách,
        giải thể). Mã giá trị là suy luận; TL-03 `org.org_change_order.kind` gộp chung với quyết định nhân
        sự và chưa có THANH_LAP, DOI_TEN, HOP_NHAT.
      type: string
      enum: [THANH_LAP, DOI_TEN, SAP_NHAP, HOP_NHAT, CHIA_TACH, GIAI_THE]
    OrgChangeRequest:
      type: object
      required: [changeType, effectiveOn, orderNo, orderDate]
      properties:
        changeType: { $ref: '#/components/schemas/OrgChangeType' }
        effectiveOn: { $ref: '../common/common.yaml#/components/schemas/Date' }
        orderNo: { type: string, maxLength: 64, description: Số quyết định }
        orderDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        signedDocRef: { type: string, maxLength: 200 }
        newName: { type: string, maxLength: 255 }
        relatedUnitIds:
          type: array
          description: Đơn vị bị sáp nhập, hợp nhất cùng, hoặc đơn vị mới sau chia tách.
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        newUnits:
          type: array
          items: { $ref: '#/components/schemas/OrgUnitInput' }
        moveAssignmentsTo: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    OrgChangeOrder:
      description: Quyết định thay đổi (`org.org_change_order`).
      type: object
      required: [id, changeType, orderNo, effectiveOn, status]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        changeType: { $ref: '#/components/schemas/OrgChangeType' }
        orderNo: { type: string }
        effectiveOn: { $ref: '../common/common.yaml#/components/schemas/Date' }
        status: { type: string, enum: [NHAP, DA_AP_DUNG, DA_HUY] }
        appliedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        affectedUnitIds:
          type: array
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        createdUnitIds:
          type: array
          description: Đơn vị mới sinh ra khi hợp nhất hoặc chia tách (bổ sung WEB-072).
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        movedAssignmentCount:
          type: integer
          minimum: 0
          description: Số phân công đã chuyển sang đơn vị mới, điền {n} của MSG-01-11 (bổ sung WEB-072).
        lockedPeriodName:
          type: string
          description: >-
            Tên kỳ đã khoá mà ngày hiệu lực rơi vào, điền {kỳ} của MSG-01-10; vắng khi không ghi muộn vào kỳ đã khoá
            (bổ sung WEB-072).
    OrgImportReport:
      description: Báo cáo một lần nhập cây tổ chức từ Excel (bổ sung WEB-072).
      type: object
      required: [jobId, status, totalRows, createdUnits, errors]
      properties:
        jobId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        status: { type: string, enum: [CHO, DANG_CHAY, HOAN_TAT, THAT_BAI, DA_HUY] }
        totalRows: { type: integer, minimum: 0 }
        createdUnits: { type: integer, minimum: 0 }
        changeOrderId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        errors:
          type: array
          items: { $ref: '#/components/schemas/OrgImportError' }
    OrgImportError:
      description: Một lỗi của tệp nhập; `row = 0` là lỗi cả tệp.
      type: object
      required: [row, column, message]
      properties:
        row: { type: integer, minimum: 0 }
        column: { type: string, description: 'Tên cột trong mẫu, rỗng khi lỗi cả dòng hoặc cả tệp' }
        field: { type: string, description: 'Trường tương ứng của `OrgUnitInput`, ví dụ `parentCode`' }
        message: { type: string, description: 'Lý do tiếng Việt, ghi rõ dòng và cột' }
        rule: { type: string, description: 'Quy tắc vi phạm, ví dụ BR-01-05' }
    SyncSource:
      description: Nguồn đồng bộ (`integ.connector.code`, suy luận về mã).
      type: string
      enum: [CBCCVC, DANG_VIEN, SCIM, HRM]
    OrgSyncRun:
      description: Một lần đồng bộ (`org.scim_sync_log` tổng hợp, `integ.sync_cursor`).
      type: object
      required: [id, connector, startedAt, status, records, changes, errors]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        connector: { $ref: '#/components/schemas/SyncSource' }
        startedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        finishedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        status: { type: string, enum: [DANG_CHAY, THANH_CONG, THANH_CONG_MOT_PHAN, LOI] }
        records: { type: integer }
        changes: { type: integer }
        errors: { type: integer }
        deadLetters: { type: integer }
        reason:
          type: string
          maxLength: 500
          description: >-
            Lý do lỗi tiếng Việt khi `status = LOI` hoặc `THANH_CONG_MOT_PHAN`, điền vào {lý do} của MSG-01-14
            (ví dụ "hết thời gian chờ NDXP"); không chứa dữ liệu C2 (suy luận).
    OrgSyncSchedule:
      type: object
      required: [connector, enabled, cron]
      properties:
        connector: { $ref: '#/components/schemas/SyncSource' }
        enabled: { type: boolean }
        cron: { type: string, description: 'Biểu thức cron, ví dụ `0 2 * * *`' }
    DiscrepancySeverity:
      type: string
      enum: [CAO, VUA, THAP]
    OrgDiscrepancyField:
      description: >-
        Trường lệch (`org.sync_discrepancy.field`), sáu loại của TL-02a SCR-0104 trường 4: chức vụ, đơn vị,
        không khớp người, đảng tịch, trạng thái, kiêm nhiệm. Mã khoá là suy luận (TL-03 chưa liệt kê).
      type: string
      enum: [job_title_id, org_unit_id, person_match, party_membership, employment_status, concurrent_assignment]
    OrgSuggestedAction:
      description: >-
        Đề xuất xử lý (`org.sync_discrepancy.suggested_action`) theo TL-02a SCR-0104 trường 7. Khác bộ
        `DiscrepancyResolution` của TL-03: `LAY_THEO_NGUON` ứng `NHAN_NGUON`, `GIU_NOI_BO` ứng `GIU_HIEN_TAI`,
        `DOI_SOAT_THU_CONG` ứng `SUA_TAY` (ánh xạ thủ công); `TAO_DIEU_DONG_TUONG_LAI` và
        `KET_THUC_PHAN_CONG` được xử lý bằng `NHAN_NGUON` kèm `effectiveFrom` (suy luận, TL-03 cần bổ sung).
      type: string
      enum: [LAY_THEO_NGUON, GIU_NOI_BO, DOI_SOAT_THU_CONG, TAO_DIEU_DONG_TUONG_LAI, KET_THUC_PHAN_CONG]
    DiscrepancyResolution:
      description: Cách xử lý (`org.sync_discrepancy.resolution`, TL-03).
      type: string
      enum: [NHAN_NGUON, GIU_HIEN_TAI, SUA_TAY, BO_QUA]
    OrgDiscrepancy:
      description: >-
        Một dòng lệch (`org.sync_discrepancy`). Giá trị hai phía là C2 và chỉ trả dạng đã che
        (ví dụ CCCD che 4 số cuối).
      type: object
      required: [id, field, sourceConnector, severity, suggestedAction, syncRunId]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        personId: { type: [string, 'null'], format: uuid }
        personName: { type: string }
        maskedNationalId: { type: string, x-classification: C2 }
        field: { $ref: '#/components/schemas/OrgDiscrepancyField' }
        sourceConnector: { $ref: '#/components/schemas/SyncSource' }
        sourceValueMasked: { type: string, x-classification: C2 }
        currentValueMasked: { type: string, x-classification: C2 }
        severity: { $ref: '#/components/schemas/DiscrepancySeverity' }
        suggestedAction: { $ref: '#/components/schemas/OrgSuggestedAction' }
        resolution: { $ref: '#/components/schemas/DiscrepancyResolution' }
        resolvedByName: { type: string }
        resolvedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        assigneeName: { type: string }
        externalId: { type: string }
        matchedBy:
          type: string
          description: >-
            Tiêu chí khớp người hiển thị ở vùng 4 "Khớp theo", ví dụ "Số định danh (băm HMAC) và ngày sinh"
            (TL-02a QT-01 bước 7; suy luận tên trường).
        effectiveFrom:
          $ref: '../common/common.yaml#/components/schemas/Date'
          description: Ngày hiệu lực theo quyết định nguồn (trường 10), dùng làm `org.assignment.valid_from` khi lấy theo nguồn.
        syncRunId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    OrgAssignmentCreateRequest:
      type: object
      required: [personId, jobTitleId, assignmentKind, validFrom]
      properties:
        personId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        jobTitleId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        subjectGroupCode: { type: string }
        assignmentKind: { type: string, enum: [CHINH, KIEM_NHIEM, BIET_PHAI], default: CHINH }
        weightRatio: { type: number, minimum: 0, maximum: 1, default: 1 }
        validFrom: { $ref: '../common/common.yaml#/components/schemas/Date' }
        validTo: { type: [string, 'null'], format: date }
        signedDocRef: { type: string, maxLength: 200 }
    OrgAssignmentCreateInput:
      type: object
      required: [orgUnitId, personId, jobTitleId, assignmentKind, validFrom]
      properties:
        orgUnitId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        personId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        jobTitleId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        subjectGroupCode: { type: string }
        assignmentKind: { type: string, enum: [CHINH, KIEM_NHIEM, BIET_PHAI], default: CHINH }
        weightRatio: { type: number, minimum: 0, maximum: 1, default: 1 }
        validFrom: { $ref: '../common/common.yaml#/components/schemas/Date' }
        validTo: { type: [string, 'null'], format: date }
        signedDocRef: { type: string, maxLength: 200 }
    OrgAssignmentUpdateRequest:
      type: object
      properties:
        jobTitleId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        subjectGroupCode: { type: string }
        assignmentKind: { type: string, enum: [CHINH, KIEM_NHIEM, BIET_PHAI] }
        weightRatio: { type: number, minimum: 0, maximum: 1 }
        effectiveFrom: { $ref: '../common/common.yaml#/components/schemas/Date' }
        signedDocRef: { type: string, maxLength: 200 }
    OrgAssignmentEndRequest:
      type: object
      required: [validTo, reason]
      properties:
        validTo: { $ref: '../common/common.yaml#/components/schemas/Date' }
        reason: { type: string, minLength: 5, maxLength: 1000 }
        signedDocRef: { type: string, maxLength: 200 }
    OrgChangeCorrectionRequest:
      type: object
      required: [reason, signedDocRef, correctedOrder]
      properties:
        reason: { type: string, minLength: 10, maxLength: 2000 }
        signedDocRef: { type: string, minLength: 1, maxLength: 200 }
        correctedOrder: { $ref: '#/components/schemas/OrgChangeRequest' }
    PublicKeyAlg:
      description: Thuật toán khoá công khai (`org.person_public_key.key_alg`).
      type: string
      enum: [ECDH-P256, RSA-OAEP-3072, BCY]
    DirectorySignature:
      description: >-
        Chữ ký của danh bạ khoá tenant (ECDSA P-256, SHA-256, chữ ký DER mã base64) trên chuỗi chuẩn
        `v1|<tenantId>|<loại>|<id>|<chủ khoá>|<keyAlg>|<fingerprint>|<validFrom>|<validTo>` với thời điểm dạng
        ISO 8601 UTC; `<loại>` là `PERSON_KEY` hoặc `RECOVERY_KEY`, `<validTo>` rỗng khi không giới hạn.
      type: object
      required: [keyVersion, value, signedAt]
      properties:
        keyVersion: { type: integer, minimum: 1, description: Phiên bản khoá ký trong `listE2eeDirectoryKeys` }
        value: { type: string, description: Chữ ký DER dạng base64 }
        signedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    DirectoryKey:
      type: object
      required: [keyVersion, publicKeyPem]
      properties:
        keyVersion: { type: integer, minimum: 1 }
        publicKeyPem: { type: string, description: Khoá công khai ECDSA P-256 dạng PEM }
    PublicKeyRegistration:
      type: object
      required: [keyAlg, publicKeySpki, source]
      properties:
        keyAlg: { $ref: '#/components/schemas/PublicKeyAlg' }
        publicKeySpki: { type: string, maxLength: 2048, description: SubjectPublicKeyInfo DER dạng base64 }
        source: { type: string, enum: [THIET_BI, CHUNG_THU] }
        validTo:
          type: [string, 'null']
          format: date-time
          description: Hết hiệu lực (theo chứng thư); bỏ trống là ba năm kể từ khi đăng ký.
    PersonPublicKey:
      description: Khoá công khai trong danh bạ (`org.person_public_key`).
      type: object
      required: [id, personId, keyAlg, publicKeySpki, fingerprint, source, status, validFrom, validTo, signature]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        personId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        keyAlg: { $ref: '#/components/schemas/PublicKeyAlg' }
        publicKeySpki: { type: string, description: SubjectPublicKeyInfo DER dạng base64 }
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$', description: 'SHA-256 của SPKI dạng hex, là `deviceId` của bản bọc' }
        source: { type: string, enum: [THIET_BI, CHUNG_THU] }
        status: { type: string, enum: [HIEU_LUC, THU_HOI, HET_HAN] }
        validFrom: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        validTo: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        signature: { $ref: '#/components/schemas/DirectorySignature' }
    PublicKeyRevocation:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 1000 }
    RecoveryKeyInput:
      type: object
      required: [keyAlg, publicKeySpki, custodianIds, ceremonyRef]
      properties:
        keyAlg: { type: string, enum: [ECDH-P256, RSA-OAEP-3072] }
        publicKeySpki: { type: string, maxLength: 2048, description: SubjectPublicKeyInfo DER dạng base64 }
        custodianIds:
          description: Năm cán bộ giữ mảnh khoá (Shamir 3 trên 5).
          type: array
          minItems: 5
          maxItems: 5
          uniqueItems: true
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        ceremonyRef: { type: string, minLength: 1, maxLength: 200, description: Số biên bản tạo và giao mảnh khoá }
    RecoveryKey:
      description: Khoá phục hồi của tổ chức.
      type: object
      required: [id, keyAlg, publicKeySpki, fingerprint, threshold, custodianIds, ceremonyRef, status, validFrom, signature]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        keyAlg: { type: string, enum: [ECDH-P256, RSA-OAEP-3072] }
        publicKeySpki: { type: string }
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        threshold: { type: integer, description: Số mảnh tối thiểu để phục hồi }
        custodianIds:
          type: array
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        ceremonyRef: { type: string }
        status: { type: string, enum: [HIEU_LUC, THU_HOI] }
        validFrom: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        validTo: { type: [string, 'null'], format: date-time }
        signature: { $ref: '#/components/schemas/DirectorySignature' }
    RecoveryObjectType:
      type: string
      enum: [TASK_CONTENT, EVIDENCE_FILE]
    RecoveryRecordInput:
      type: object
      required: [recoveryKeyId, objectType, objectId, newRecipientId, newKeyFingerprint, custodianIds, reason, ceremonyRef, performedAt]
      properties:
        recoveryKeyId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        objectType: { $ref: '#/components/schemas/RecoveryObjectType' }
        objectId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        newRecipientId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        newKeyFingerprint: { type: string, pattern: '^[0-9a-f]{64}$', description: Vân tay khoá thiết bị mới đã có trong danh bạ }
        custodianIds:
          description: Những người giữ mảnh có mặt (ít nhất ngưỡng của khoá phục hồi).
          type: array
          minItems: 3
          maxItems: 5
          uniqueItems: true
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        reason: { type: string, minLength: 10, maxLength: 2000 }
        ceremonyRef: { type: string, minLength: 1, maxLength: 200, description: Số biên bản phục hồi }
        performedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    RecoveryRecord:
      type: object
      required: [id, recoveryKeyId, objectType, objectId, newRecipientId, newKeyFingerprint, custodianIds, reason, ceremonyRef, performedAt, recordedBy, recordedAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        recoveryKeyId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        objectType: { $ref: '#/components/schemas/RecoveryObjectType' }
        objectId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        newRecipientId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        newKeyFingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        custodianIds:
          type: array
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        reason: { type: string }
        ceremonyRef: { type: string }
        performedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        recordedBy: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        recordedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
