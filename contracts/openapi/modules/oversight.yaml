          in: query
          description: true chỉ đợt chưa đóng, false chỉ đợt đã đóng.
          schema: { type: boolean }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang đợt hậu kiểm.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PostAudit' }
                  nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    post:
      tags: [post-audits]
      operationId: createPostAudit
      summary: Khởi tạo đợt hậu kiểm
      description: >-
        Tạo `oversight.post_audit` (mở) theo loại kế hoạch, đột xuất hoặc theo phản ánh, với đối tượng
        và căn cứ (QT-13 bước 1). TL-02b không ghi API; đường dẫn là suy luận.
      x-mission:
        qt: [QT-13]
        scr: [SCR-1301]
        owner: MOD-07
        roles: [appraiser, inspector]
        scope: 'Cd (appraiser), Tn (inspector)'
        source: TL-02b QT-13 bước 1; TL-03 post_audit (suy luận đường dẫn)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
