# Hợp đồng OpenAPI của MOD-07 `oversight` và SVC-09 ledger-service (WEB-063, ADR-32 trong BS-02).
# Nguồn:
#   - Baseline mục 9 (cột chung, `_enc` + `dek_id`), 9.1 (trạng thái hồ sơ `KHIEU_NAI`, trạng thái kỳ),
#     10 (vai trò AC-06..AC-10), 13 (quy ước API); ADR-06 (C2), ADR-09 (sổ cái chuỗi băm).
#   - TL-01 Phụ lục C mục "Giám sát, hậu kiểm (MOD-07)"; _ghi-chu-TL-01 mục 13 (`/oversight/ledger/proofs`).
#   - TL-02b QT-12 (SCR-1201, SCR-1202, BR-12-01..BR-12-11, MSG-12-01..MSG-12-08),
#     QT-13 (SCR-1301, SCR-1302, BR-13-01..BR-13-12, MSG-13-01..MSG-13-07),
#     QT-14 (SCR-1401, BR-14-01..BR-14-09, MSG-14-01..MSG-14-04); TL-02b part-06 bảng liên kết;
#     _ghi-chu-TL-02b (danh mục đường dẫn `oversight/alerts/*`, `ledger/*`).
#   - TL-03 schema `oversight` (complaint, complaint_response, reopen_request, reopen_approval,
#     post_audit, anomaly_alert, alert_action) và `ledger` (ledger_entry, merkle_seal, cell_seal,
#     anchor_receipt, verify_run); TL-03 chương 8 (niêm phong Merkle hai mức), bảng sự kiện EVT-18..EVT-25.
#   - Ma trận phân quyền docs/phan-quyen/ma-tran.json (SCR-1201..SCR-1401, module `oversight`, `ledger`).
openapi: 3.1.0
info:
  title: Mission – Giám sát, hậu kiểm và sổ cái (MOD-07, SVC-09)
  version: 1.0.0-draft.1
  description: >-
    Khiếu nại, giải trình và bảo lưu ý kiến (QT-12); hậu kiểm, mở lại kỳ theo nguyên tắc hai người
    duyệt (QT-13); tra cứu sổ cái chỉ ghi thêm, kiểm tra toàn vẹn chuỗi băm, bằng chứng bao hàm Merkle
    và xuất bằng chứng (QT-13, SVC-09); trung tâm cảnh báo bất thường (QT-14). Nội dung khiếu nại,
    giải trình, trả lời và phát hiện hậu kiểm là dữ liệu C2 (ADR-06): máy chủ mã hoá trường, mỗi lần
    giải mã để đọc được ghi sổ cái (BR-12-10). Mọi lần tra cứu sổ cái cũng được ghi sổ cái.
servers:
  - url: /api/v1
security:
  - keycloak: []
tags:
  - name: complaints
    description: Khiếu nại, giải trình bổ sung, bảo lưu ý kiến về kết quả đánh giá và việc xử lý, trả lời bằng văn bản ký số (QT-12).
  - name: reopen-requests
    description: Yêu cầu mở lại kỳ đã khoá trong phạm vi giới hạn, hai người duyệt khác nhau và khác người đề nghị (QT-13).
  - name: post-audits
    description: Đợt hậu kiểm theo kế hoạch, đột xuất hoặc theo phản ánh và báo cáo kết luận (QT-13).
  - name: alerts
    description: Trung tâm cảnh báo bất thường tám dấu hiệu và các hành động xử lý (QT-14).
  - name: ledger
    description: Sổ cái chỉ ghi thêm của SVC-09, kiểm tra toàn vẹn, bằng chứng bao hàm Merkle và xuất bằng chứng (QT-13).

paths:
  # ───────────────────────────── Khiếu nại (QT-12) ─────────────────────────────
  /oversight/complaints/eligible-profiles:
    get:
      tags: [complaints]
      operationId: listComplainableProfiles
      summary: Kết quả đánh giá của tôi còn có thể khiếu nại
      description: >-
        Trả các kết quả đánh giá của người gọi đã `DA_KY_SO` kèm ngày công bố, hạn khiếu nại, các
        hình thức còn được phép và danh sách cấu phần của snapshot để chọn ở SCR-1201 (trường 1, 2, 3).
        Khi quá hạn chỉ còn hình thức `BAO_LUU` (BR-12-01, MSG-12-01). Thao tác suy luận: TL-02b
        không ghi API riêng cho danh sách chọn này.
      x-mission:
        qt: [QT-12]
        scr: [SCR-1201]
        owner: MOD-07
        roles: [member]
        scope: B
        rules: [BR-12-01, BR-12-02]
        source: TL-02b SCR-1201 bảng trường 1..3 (suy luận)
      responses:
        '200':
          description: Danh sách kết quả có thể khiếu nại.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ComplainableProfile' }
              examples:
                quy-iv:
                  value:
                    items:
                      - profileId: 01929a10-1c2d-7e3f-8a4b-5c6d7e8f9a01
                        period: { id: 01929a10-0000-7000-8000-000000000204, label: Quý IV/2026, startDate: '2026-10-01', endDate: '2026-12-31' }
                        rating: HTTNV
                        score: 91.2
                        publishedAt: '2027-01-12T08:00:00+07:00'
                        publishDecision: QĐ 215-QĐ/ĐUK
                        complaintDeadline: '2027-01-22'
                        workingDaysLeft: 7
                        allowedKinds: [KHIEU_NAI, GIAI_TRINH, BAO_LUU]
                        targets:
                          - key: NV-THEN-CHOT-2.B
                            stage: THAM_DINH
                            label: Nhiệm vụ then chốt 2 · B = 0,50
                          - key: NV-THEN-CHOT-3.C
                            stage: THAM_DINH
                            label: Nhiệm vụ then chốt 3 · C = 0,85
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/complaints:
    get:
      tags: [complaints]
      operationId: listComplaints
      summary: Danh sách khiếu nại trong phạm vi
      description: >-
        Với `member` trả khiếu nại của chính mình (theo dõi tiến trình ở SCR-1201). Với người xử lý
        và người ký trả các khiếu nại được giao hoặc trong phạm vi, mặc định sắp theo hạn trả lời
        (SCR-1202 trường 1). Danh sách không chứa nội dung C2, chỉ `subjectLine`.
      x-mission:
        qt: [QT-12]
        scr: [SCR-1201, SCR-1202]
        owner: MOD-07
        roles: [member, appraiser, decider]
        scope: 'B (member), Gn (appraiser, decider)'
        source: TL-02b SCR-1202 bảng trường 1
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - name: status
          in: query
          description: Lọc theo một hoặc nhiều trạng thái.
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/ComplaintStatus' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/ComplaintKind' }
        - name: assignedToMe
          in: query
          description: Chỉ khiếu nại có task xử lý hoặc ký đang giao cho người gọi.
          schema: { type: boolean, default: false }
        - $ref: '../common/common.yaml#/components/parameters/Q'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang khiếu nại.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ComplaintSummary' }
                  nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
              examples:
                dang-giai-trinh:
                  value:
                    items:
                      - id: 01929a20-3b4c-7d5e-8f60-718293a4b501
                        code: KN-2027-0031
                        complainant: { id: 01929a00-aaaa-7bbb-8ccc-000000000101, name: Trần Minh Hoàng }
                        subjectLine: Khiếu nại kết quả xếp loại Quý IV/2026
                        kind: KHIEU_NAI
                        targetStage: THAM_DINH
                        status: DANG_GIAI_TRINH
                        filedAt: '2027-01-15T09:12:00+07:00'
                        responseDeadline: '2027-02-05'
                        workingDaysLeft: 11
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    post:
      tags: [complaints]
      operationId: createComplaint
      summary: Lưu nháp khiếu nại mới
      description: >-
        Tạo khiếu nại ở dạng nháp (chưa gửi, `status` là `null`). Nội dung lý do, đề nghị cụ thể được
        máy chủ mã hoá trường (C2). Tệp kèm theo tải lên trước qua `POST /api/v1/files` (SVC-08) rồi
        gửi mã đối tượng ở `attachmentObjectIds`. Kiểm tra đủ trường bắt buộc chỉ áp khi gửi.
      x-mission:
        qt: [QT-12]
        scr: [SCR-1201]
        owner: MOD-07
        roles: [member]
        scope: B
        rules: [BR-12-01, BR-12-02, BR-12-03, BR-12-10]
        source: TL-02b SCR-1201 "Lưu nháp"; TL-01 PL C
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComplaintInput' }
            examples:
              nhap:
                value:
                  profileId: 01929a10-1c2d-7e3f-8a4b-5c6d7e8f9a01
                  kind: KHIEU_NAI
                  targetStage: THAM_DINH
                  targets:
                    - { key: NV-THEN-CHOT-3.C, stage: THAM_DINH, label: 'Nhiệm vụ then chốt 3 · C = 0,85' }
                  content: Nhiệm vụ then chốt 3 bị trừ hệ số C do chậm 6 ngày. Nguyên nhân chậm là Đảng uỷ cơ sở X gửi hồ sơ muộn, có công văn 45-CV/ĐU xác nhận; đề nghị áp miễn trừ chậm do khách quan theo PL 3 mục 2.
                  requestText: Đề nghị không trừ hệ số C của nhiệm vụ then chốt 3.
                  attachmentObjectIds: [01929a15-7777-7aaa-8bbb-00000000c045]
                  reserveOpinion: true
      responses:
        '201':
          description: Đã lưu nháp.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422':
          description: >-
            Dữ liệu không hợp lệ. Mã: `OVERSIGHT-422-DEADLINE-PASSED` (quá hạn, chỉ còn `BAO_LUU`,
            MSG-12-01), `COMMON-422-VALIDATION`.
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/complaints/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [complaints]
      operationId: getComplaint
      summary: Chi tiết khiếu nại
      description: >-
        Trả khiếu nại kèm nội dung C2 đã giải mã cho người có quyền (chủ hồ sơ, người xử lý, người
        ký); mỗi lần giải mã được ghi sổ cái (BR-12-10). Dòng thời gian lấy từ sổ cái và luồng xử lý
        (SCR-1202 trường 3).
      x-mission:
        qt: [QT-12]
        scr: [SCR-1201, SCR-1202]
        owner: MOD-07
        roles: [member, appraiser, decider]
        scope: 'B (member), Gn (appraiser, decider)'
        rules: [BR-12-10]
        source: TL-02b SCR-1202 bảng trường 2, 3
      responses:
        '200':
          description: Khiếu nại.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
              examples:
                kn-0031: { $ref: '#/components/examples/ComplaintKn0031' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    put:
      tags: [complaints]
      operationId: updateComplaint
      summary: Sửa khiếu nại nháp
      description: Ghi đè nội dung khiếu nại khi chưa gửi. Khiếu nại đã gửi trả 409 `OVERSIGHT-409-INVALID-STATE`.
      x-mission:
        qt: [QT-12]
        scr: [SCR-1201]
        owner: MOD-07
        roles: [member]
        scope: B
        rules: [BR-12-02, BR-12-10]
        source: TL-02b SCR-1201 "Lưu nháp"
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComplaintInput' }
      responses:
        '200':
          description: Đã lưu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/complaints/{id}/submit:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [complaints]
      operationId: submitComplaint
      summary: Ký số và gửi khiếu nại
      description: >-
        Khởi động ký số nội dung khiếu nại qua SVC-10 (cần xác thực bước lên khi ký), sau đó chuyển hồ
        sơ đánh giá sang nhánh `KHIEU_NAI`, đặt khiếu nại `MOI`, phát EVT-25 để SVC-06 khởi động mẫu
        luồng `xu-ly-khieu-nai` v2 và chọn người xử lý theo tách vai trò. Kết quả hiện hành vẫn có
        hiệu lực (BR-12-06, MSG-12-02). Trả 202; job hoàn tất khi chữ ký xong (EVT-18).
      x-mission:
        qt: [QT-12]
        scr: [SCR-1201]
        owner: MOD-07
        evt: [EVT-25, EVT-18]
        roles: [member]
        scope: B
        aal: 2
        rules: [BR-12-01, BR-12-02, BR-12-03, BR-12-06]
        source: TL-02b SCR-1201 "Ký số và gửi"; ma trận SCR-1201.ky-gui (step-up theo TL-01)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            Xung đột phiên bản (`OVERSIGHT-409-VERSION-CONFLICT`), khiếu nại đã gửi hoặc hồ sơ không
            còn ở `DA_KY_SO` (`OVERSIGHT-409-INVALID-STATE`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422':
          description: >-
            Thiếu trường bắt buộc hoặc quá hạn. Mã: `OVERSIGHT-422-NO-TARGET` (MSG-12-03),
            `OVERSIGHT-422-DEADLINE-PASSED` (MSG-12-01), `COMMON-422-VALIDATION`.
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
              examples:
                thieu-cau-phan:
                  value:
                    type: https://okrkpi.vn/problems/validation
                    title: Dữ liệu chưa hợp lệ
                    status: 422
                    code: OVERSIGHT-422-NO-TARGET
                    msg: MSG-12-03
                    errors: [{ field: targets, message: Vui lòng chọn ít nhất một cấu phần bị khiếu nại., rule: BR-12-02 }]
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/complaints/{id}/withdraw:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [complaints]
      operationId: withdrawComplaint
      summary: Rút khiếu nại
      description: >-
        Đóng khiếu nại với lý do rút trước khi có kết luận; trạng thái `RUT` rồi `DONG`, hồ sơ đánh
        giá trở lại `DA_KY_SO`, nội dung khiếu nại vẫn được lưu.
      x-mission:
        qt: [QT-12]
        scr: [SCR-1201]
        owner: MOD-07
        evt: [EVT-21]
        roles: [member]
        scope: B
        source: TL-02b SCR-1201 "Rút khiếu nại"; QT-12 Ngoại lệ
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OversightReasonInput' }
            examples:
              rut:
                value: { reason: Đã trao đổi trực tiếp với người nghiệm thu và thống nhất kết quả. }
      responses:
        '200':
          description: Đã rút.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/complaints/{id}/reserve:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [complaints]
      operationId: reserveComplaintOpinion
      summary: Xác nhận bảo lưu ý kiến
      description: >-
        Sau khi có văn bản trả lời (`DA_TRA_LOI`), người khiếu nại không đồng ý xác nhận bảo lưu; ý
        kiến (C2) được lưu thành `complaint_response` loại `BAO_LUU` và in trên Mẫu 3 (BR-12-09).
        Thời hạn xác nhận 5 ngày làm việc (MSG-12-04).
      x-mission:
        qt: [QT-12]
        scr: [SCR-1201]
        owner: MOD-07
        roles: [member]
        scope: B
        rules: [BR-12-09]
        source: TL-02b SCR-1201 "Xác nhận bảo lưu"
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [opinion]
              properties:
                opinion:
                  type: string
                  minLength: 1
                  maxLength: 8000
                  description: Ý kiến bảo lưu (`oversight.complaint.reserve_opinion_enc`).
                  x-classification: C2
            examples:
              bao-luu:
                value: { opinion: Tôi vẫn cho rằng việc chậm do nguyên nhân khách quan và đề nghị lưu ý kiến này vào hồ sơ. }
      responses:
        '200':
          description: Đã lưu ý kiến bảo lưu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/complaints/{id}/accept:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [complaints]
      operationId: acceptComplaint
      summary: Tiếp nhận khiếu nại
      description: Chuyển `MOI` sang `DA_TIEP_NHAN`. OPA kiểm tra tách vai trò (BR-12-04, MSG-12-05).
      x-mission:
        qt: [QT-12]
        scr: [SCR-1202]
        owner: MOD-07
        evt: [EVT-21]
        roles: [appraiser]
        scope: Gn
        rules: [BR-12-04]
        source: TL-02b SCR-1202 "Tiếp nhận hoặc không thụ lý"
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 2000, description: Ghi chú tiếp nhận (suy luận). }
      responses:
        '200':
          description: Đã tiếp nhận.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SeparationOfDuties' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/complaints/{id}/reject:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [complaints]
      operationId: rejectComplaint
      summary: Không thụ lý khiếu nại
      description: >-
        Chuyển `MOI` sang `KHONG_THU_LY` (rồi tự động `DONG` sau khi gửi thông báo). Bắt buộc lý do
        (quá hạn, sai thẩm quyền, trùng nội dung đã trả lời theo BR-12-11).
      x-mission:
        qt: [QT-12]
        scr: [SCR-1202]
        owner: MOD-07
        evt: [EVT-21]
        roles: [appraiser]
        scope: Gn
        rules: [BR-12-04, BR-12-11]
        source: TL-02b SCR-1202 "Tiếp nhận hoặc không thụ lý"
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reasonCode, reason]
              properties:
                reasonCode:
                  type: string
                  enum: [QUA_HAN, SAI_THAM_QUYEN, TRUNG_NOI_DUNG]
                  description: Nhóm lý do không thụ lý theo bảng trạng thái QT-12 (suy luận mã).
                reason: { type: string, minLength: 20, maxLength: 2000 }
            examples:
              trung:
                value: { reasonCode: TRUNG_NOI_DUNG, reason: 'Nội dung trùng khiếu nại KN-2027-0012 đã được trả lời bằng văn bản 03-CV/BTC, không có căn cứ mới.' }
      responses:
        '200':
          description: Đã ghi không thụ lý.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SeparationOfDuties' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/complaints/{id}/duplicate-candidates:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [complaints]
      operationId: listComplaintDuplicateCandidates
      summary: Tra cứu các khiếu nại nghi trùng nội dung đã trả lời
      description: >-
        Hỗ trợ cán bộ thụ lý kiểm tra điều kiện trùng nội dung đã trả lời không có tình tiết mới (BR-12-11)
        trước khi quyết định thụ lý hoặc không thụ lý ở SCR-1202.
      x-mission:
        qt: [QT-12]
        scr: [SCR-1202]
        owner: MOD-07
        roles: [appraiser]
        scope: Gn
        rules: [BR-12-11]
        source: 'TL-02b QT-12 BR-12-11; SCR-1202 (suy luận đường dẫn)'
      responses:
        '200':
          description: Danh sách khiếu nại tương tự của cùng người khiếu nại hoặc cùng nội dung mục tiêu.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ComplaintDuplicateCandidate' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/complaints/{id}/explanation-requests:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [complaints]
      operationId: requestComplaintExplanations
      summary: Yêu cầu giải trình
      description: >-
        Tạo một `complaint_response` loại `YEU_CAU` cho mỗi bên (người hoặc đơn vị), gửi thông báo,
        đặt hạn (mặc định 3 ngày làm việc); khiếu nại chuyển `DANG_GIAI_TRINH`.
      x-mission:
        qt: [QT-12]
        scr: [SCR-1202]
        owner: MOD-07
        evt: [EVT-21]
        roles: [appraiser]
        scope: Gn
        rules: [BR-12-04]
        source: TL-02b SCR-1202 "Yêu cầu giải trình", bảng trường 4
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parties, content]
              properties:
                parties:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/ExplanationParty' }
                content:
                  type: string
                  minLength: 1
                  maxLength: 8000
                  description: Nội dung yêu cầu giải trình bằng văn bản.
                  x-classification: C2
                dueDate:
                  $ref: '../common/common.yaml#/components/schemas/Date'
                  description: Hạn giải trình; bỏ trống thì máy chủ đặt 3 ngày làm việc theo lịch tenant.
            examples:
              hai-ben:
                value:
                  parties:
                    - { kind: NGUOI, id: 01929a00-aaaa-7bbb-8ccc-000000000205 }
                    - { kind: DON_VI, id: 01929a00-bbbb-7ccc-8ddd-000000000031 }
                  content: Đề nghị giải trình lý do hồ sơ nhiệm vụ then chốt 3 được gửi sau hạn và căn cứ áp hệ số C = 0,85.
      responses:
        '200':
          description: Đã gửi yêu cầu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SeparationOfDuties' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/complaints/{id}/explanations:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [complaints]
      operationId: submitComplaintExplanation
      summary: Bên liên quan gửi giải trình
      description: >-
        Bên được yêu cầu trả lời yêu cầu giải trình, kèm tài liệu (SCR-1202 chế độ bên liên quan,
        QT-12 bước 6). Tạo `complaint_response` loại `GIAI_TRINH`. Khi mọi yêu cầu đã trả lời hoặc quá
        hạn, khiếu nại tự chuyển `CHO_KET_LUAN`. TL-02b không ghi API cho bước này; đường dẫn là suy luận.
      x-mission:
        qt: [QT-12]
        scr: [SCR-1202]
        owner: MOD-07
        roles: [manager, appraiser]
        scope: Gn
        source: TL-02b QT-12 bước 6 (suy luận đường dẫn); ma trận SCR-1202.giai-trinh
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, content]
              properties:
                requestId:
                  $ref: '../common/common.yaml#/components/schemas/Uuid'
                  description: Mã `complaint_response` loại `YEU_CAU` đang trả lời.
                content:
                  type: string
                  minLength: 1
                  maxLength: 8000
                  x-classification: C2
                attachmentObjectIds:
                  type: array
                  items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            examples:
              dang-uy:
                value:
                  requestId: 01929a21-0000-7000-8000-00000000e002
                  content: Đảng uỷ cơ sở X thừa nhận gửi hồ sơ muộn 6 ngày do sáp nhập chi bộ, kèm công văn 51-CV/ĐU.
                  attachmentObjectIds: [01929a15-7777-7aaa-8bbb-00000000c051]
      responses:
        '201':
          description: Đã ghi giải trình.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplaintResponseRecord' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/complaints/{id}/responses:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [complaints]
      operationId: listComplaintResponses
      summary: Các bản ghi trả lời của khiếu nại
      description: >-
        Yêu cầu giải trình, giải trình đã nhận, kết luận và bảo lưu (`oversight.complaint_response`)
        của một khiếu nại, theo thời gian. Nội dung C2 được giải mã cho người có quyền và ghi sổ cái.
      x-mission:
        qt: [QT-12]
        scr: [SCR-1201, SCR-1202]
        owner: MOD-07
        roles: [member, manager, appraiser, decider]
        scope: 'B (member), Gn'
        rules: [BR-12-10]
        source: TL-02b SCR-1202 bảng trường 3, 5
      parameters:
        - name: recordKind
          in: query
          schema: { $ref: '#/components/schemas/ComplaintRecordKind' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang bản ghi.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ComplaintResponseRecord' }
                  nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/complaints/{id}/conclusion:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    put:
      tags: [complaints]
      operationId: saveComplaintConclusion
      summary: Ghi kết luận xử lý khiếu nại
      description: >-
        Người xử lý (AC-07) ghi kết quả xử lý, điều chỉnh đề nghị và số văn bản trả lời sinh từ mẫu
        TL-KN-01 (QT-12 bước 8, SCR-1202 trường 6, 7, 9) trước khi người có thẩm quyền ký (bước 10).
        Từ `DA_TIEP_NHAN` không qua giải trình thì bắt buộc `noExplanationNote`. Khiếu nại ở
        `CHO_KET_LUAN`. Kết luận có điều chỉnh với kỳ `DA_KHOA` trả kèm cảnh báo MSG-12-07 và phải
        tạo yêu cầu mở lại kỳ (BR-12-07); không có API điều chỉnh trực tiếp. TL-02b không tách API
        cho bước này; đường dẫn là suy luận.
      x-mission:
        qt: [QT-12]
        scr: [SCR-1202]
        owner: MOD-07
        roles: [appraiser]
        scope: Gn
        rules: [BR-12-04, BR-12-07, BR-12-08]
        source: TL-02b QT-12 bước 8, SCR-1202 bảng trường 6, 7, 9 (suy luận đường dẫn)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComplaintConclusionInput' }
            examples:
              chap-nhan-mot-phan:
                value:
                  outcome: CHAP_NHAN_MOT_PHAN
                  adjustments:
                    - { targetKey: NV-THEN-CHOT-3.C, oldValue: 0.85, newValue: 1.0, reason: Miễn trừ chậm do khách quan theo PL 3 mục 2. }
                  responseText: Chấp nhận một phần nội dung khiếu nại; điều chỉnh hệ số C của nhiệm vụ then chốt 3 từ 0,85 thành 1,00.
                  responseDocRef: 08-CV/BTC
      responses:
        '200':
          description: Đã ghi kết luận.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Complaint' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SeparationOfDuties' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/complaints/{id}/respond:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [complaints]
      operationId: respondComplaint
      summary: Ký số văn bản trả lời khiếu nại
      description: >-
        Người có thẩm quyền (AC-08) ký số văn bản trả lời đã sinh từ mẫu và gửi người khiếu nại;
        khiếu nại chuyển `DA_TRA_LOI` (rồi `DANG_THI_HANH` nếu có điều chỉnh gắn yêu cầu mở lại kỳ).
        Đây là thao tác `POST /oversight/complaints/{id}/responses` của TL-01 Phụ lục C. Trả 202; job
        hoàn tất khi chữ ký xong (EVT-18), sau đó gửi MSG-12-04 cho người khiếu nại.
      x-mission:
        qt: [QT-12]
        scr: [SCR-1202]
        owner: MOD-07
        evt: [EVT-18, EVT-21]
        roles: [decider]
        scope: Gn
        aal: 2
        rules: [BR-12-04, BR-12-05]
        source: TL-02b SCR-1202 "Ký số và trả lời"; TL-01 PL C (ánh xạ `/responses`)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: { type: string, maxLength: 2000, description: Ý kiến người ký (suy luận). }
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/SeparationOfDuties' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422':
          description: Chưa có kết luận hoặc văn bản trả lời (`OVERSIGHT-422-CONCLUSION-MISSING`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ───────────────────────────── Mở lại kỳ (QT-13) ─────────────────────────────
  /oversight/reopen-requests:
    get:
      tags: [reopen-requests]
      operationId: listReopenRequests
      summary: Danh sách yêu cầu mở lại kỳ
      description: Yêu cầu do người gọi tạo, được giao duyệt hoặc trong phạm vi.
      x-mission:
        qt: [QT-13]
        scr: [SCR-1301]
        owner: MOD-07
        roles: [appraiser, inspector, decider, second_approver]
        scope: 'Cd (appraiser), Tn (inspector), Gn (decider, second_approver)'
        source: TL-02b SCR-1301 (suy luận danh sách từ đường vào "Menu Giám sát › Hậu kiểm, mở lại kỳ")
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/ReopenRequestStatus' }
        - name: awaitingMyApproval
          in: query
          description: Chỉ yêu cầu đang chờ chính người gọi duyệt.
          schema: { type: boolean, default: false }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang yêu cầu.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ReopenRequest' }
                  nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    post:
      tags: [reopen-requests]
      operationId: createReopenRequest
      summary: Tạo yêu cầu mở lại kỳ
      description: >-
        Lưu yêu cầu ở `CHO_DUYET_1`, gọi OPA chỉ định người duyệt thứ nhất (`decider`) và thứ hai
        (`second_approver`) loại trừ người tạo và người đã tham gia hồ sơ, khởi động mẫu luồng
        `mo-lai-ky-hai-nguoi` v1. Kỳ phải `DA_KHOA`; phạm vi ít nhất một đối tượng, không chọn
        `TOAN_KY` nếu không có quyết định hậu kiểm toàn diện (BR-13-05). Gọi từ SCR-1202 khi kết luận
        khiếu nại có điều chỉnh (BR-12-07) hoặc từ SCR-1401 khi kết luận có vi phạm.
      x-mission:
        qt: [QT-13, QT-12, QT-14]
        scr: [SCR-1301, SCR-1202]
        owner: MOD-07
        evt: [EVT-21]
        roles: [appraiser, inspector]
        scope: 'Cd (appraiser), Tn (inspector)'
        aal: 2
        rules: [BR-12-07, BR-13-02, BR-13-05]
