                targetType: { $ref: '#/components/schemas/PostAuditTargetType' }
                targetId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
                basis: { type: string, maxLength: 200, description: 'Căn cứ (số quyết định, mã phản ánh, mã cảnh báo).' }
            examples:
              dot-xuat:
                value:
                  periodId: 01929a10-0000-7000-8000-000000000204
                  auditKind: DOT_XUAT
                  targetType: DON_VI
                  targetId: 01929a00-bbbb-7ccc-8ddd-000000000043
                  basis: QĐ 12-QĐ/UBKT ngày 05/02/2027
      responses:
        '201':
          description: Đã tạo.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
