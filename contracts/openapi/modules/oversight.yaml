        verdict:
          type: string
          enum: [CO_VI_PHAM, KHONG_VI_PHAM]
          description: Bắt buộc khi `KET_LUAN`.
    AlertSubject:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [CA_NHAN, DON_VI, NGUOI_DUYET] }
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        name: { type: string }
    AnomalyAlertSummary:
      type: object
      required: [id, severity, signalCode, subject, status, detectedAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        severity: { $ref: '#/components/schemas/AnomalySeverity' }
        signalCode: { $ref: '#/components/schemas/AnomalySignalCode' }
        subject: { $ref: '#/components/schemas/AlertSubject' }
        period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        status: { $ref: '#/components/schemas/AnomalyAlertStatus' }
        detectedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    AnomalyAlertCounts:
      description: Thẻ phân bố 90 ngày (SCR-1401 trường 3).
      type: object
      required: [windowDays, newCount, validCount, assignedCount, violationCount]
      properties:
        windowDays: { type: integer, default: 90 }
        newCount: { type: integer }
        validCount: { type: integer }
        assignedCount: { type: integer }
        violationCount: { type: integer }
    EvidenceChainNode:
      description: Một nút của chuỗi truy vết (`evidence_chain`), chỉ chứa mã, không chứa C2/C3.
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [DIEM, CAU_PHAN, KPI, NHIEM_VU, SAN_PHAM, MINH_CHUNG, BAN_GHI_SO_CAI, BAM_TRUNG]
          description: Loại nút (suy luận mã từ SCR-1401 trường 4).
        id: { type: string }
        label: { type: string }
        children:
          type: array
          items: { $ref: '#/components/schemas/EvidenceChainNode' }
    AlertSourceRow:
      description: Dòng bảng nguồn (SCR-1401 trường 5).
      type: object
      properties:
        submitter: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        task: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        submittedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        sha256: { type: string }
    AlertAction:
      description: Hành động xử lý (`oversight.alert_action`).
      type: object
      required: [id, action, actedAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        action: { $ref: '#/components/schemas/AlertActionType' }
        actor: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        assignedTo: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        verdict: { type: [string, 'null'], enum: [CO_VI_PHAM, KHONG_VI_PHAM, null] }
        note: { type: [string, 'null'] }
        active: { type: boolean, description: 'Với hành động tự động: cờ chặn còn hiệu lực (BR-14-04).' }
        actedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    AnomalyAlert:
      description: Cảnh báo bất thường (`oversight.anomaly_alert`).
      allOf:
        - $ref: '#/components/schemas/AnomalyAlertSummary'
        - type: object
          required: [evidenceChain, actions, rowVersion]
          properties:
            evidenceChain:
              type: array
              items: { $ref: '#/components/schemas/EvidenceChainNode' }
            sources:
              type: array
              items: { $ref: '#/components/schemas/AlertSourceRow' }
            ledgerEntryIds:
              type: array
              items: { type: string }
            modelVersion: { type: string }
            actions:
              type: array
              items: { $ref: '#/components/schemas/AlertAction' }
            rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }

    # ─────────── Sổ cái ───────────
    LedgerHashHex:
      description: Băm SHA-256 ghi dạng hex chữ thường 64 ký tự (cột `bytea` của TL-03; cách mã hoá là suy luận).
      type: string
      pattern: '^[0-9a-f]{64}$'
    LedgerEntry:
      description: Bản ghi sổ cái (`ledger.ledger_entry`).
      type: object
      required: [id, chainPartition, seqNo, eventId, eventType, aggregateType, aggregateId, actorKind, occurredAt, recordedAt, entryHash]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        chainPartition: { type: integer, minimum: 0, maximum: 63 }
        seqNo: { type: integer, format: int64 }
        eventId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        eventType: { type: string }
        aggregateType: { type: string }
        aggregateId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        actor: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        actorKind: { type: string, enum: [NGUOI, DICH_VU, HE_THONG] }
        occurredAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        recordedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        metadata:
          type: object
          description: Siêu dữ liệu rút gọn (trước, sau, mã yêu cầu mở lại); không chứa C2, trường nhạy cảm đã che.
          additionalProperties: true
        entryHash: { $ref: '#/components/schemas/LedgerHashHex' }
    LedgerSeal:
      description: Niêm phong Merkle mức tenant (`ledger.merkle_seal`) và niêm phong cell chứa nó.
      type: object
      required: [id, windowStart, windowEnd, tenantRoot]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        windowStart: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        windowEnd: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        entryCount: { type: integer, format: int64 }
        tenantRoot: { $ref: '#/components/schemas/LedgerHashHex' }
        prevTenantRoot:
          oneOf:
            - $ref: '#/components/schemas/LedgerHashHex'
            - type: 'null'
        cellSealId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        cellRoot: { $ref: '#/components/schemas/LedgerHashHex' }
        signatureValid: { type: boolean }
        tsaGenTime: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        tsaLate: { type: boolean, description: 'Dấu thời gian gắn bù do TSA không phản hồi lúc niêm phong.' }
    LedgerAnchorReceipt:
      description: Biên nhận neo (`ledger.anchor_receipt`).
      type: object
      required: [anchorTarget, anchoredAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        anchorTarget: { type: string, enum: [CELL_KHAC, KHO_VPTW, TSA_DOC_LAP, OBJECT_LOCK] }
        receipt: { type: string, contentEncoding: base64, description: Biên nhận đã ký của nơi nhận. }
        anchoredAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    LedgerEntryDetail:
      allOf:
        - $ref: '#/components/schemas/LedgerEntry'
        - type: object
          required: [prevHash, payloadHash, metadataHash]
          properties:
            prevHash: { $ref: '#/components/schemas/LedgerHashHex' }
            payloadHash: { $ref: '#/components/schemas/LedgerHashHex' }
            metadataHash: { $ref: '#/components/schemas/LedgerHashHex' }
            seal:
              oneOf:
                - $ref: '#/components/schemas/LedgerSeal'
                - type: 'null'
            anchors:
              type: array
              items: { $ref: '#/components/schemas/LedgerAnchorReceipt' }
    LedgerVerifyKind:
      type: string
      enum: [DAU_CHUOI, NIEM_PHONG, TOAN_BO, LUU_TRU]
    LedgerChainLink:
      description: Một mắt chuỗi minh hoạ quanh vị trí sai (SCR-1302 trường 5).
      type: object
      required: [seqNo, prevHash, storedHash, matches]
      properties:
        seqNo: { type: integer, format: int64 }
        entryId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        prevHash: { $ref: '#/components/schemas/LedgerHashHex' }
        storedHash: { $ref: '#/components/schemas/LedgerHashHex' }
        recomputedHash: { $ref: '#/components/schemas/LedgerHashHex' }
        matches: { type: boolean }
    LedgerVerifyRun:
      description: Lần kiểm tra toàn vẹn (`ledger.verify_run`).
      type: object
      required: [id, verifyKind, rangeFrom, rangeTo, entriesChecked, mismatches, startedAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, description: 'Mã hiển thị VR-yyyy-nnnn (suy luận, TL-03 không có cột mã).' }
        verifyKind: { $ref: '#/components/schemas/LedgerVerifyKind' }
        chainPartition: { type: [integer, 'null'], minimum: 0, maximum: 63 }
        rangeFrom: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        rangeTo: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        entriesChecked: { type: integer, format: int64 }
        sealsChecked: { type: integer, format: int64, description: '(suy luận)' }
        partitionsTotal: { type: integer, description: '(suy luận)' }
        partitionsMatched: { type: integer, description: '(suy luận)' }
        mismatches: { type: integer }
        firstMismatch:
          type: [object, 'null']
          description: Bản ghi sai đầu tiên (`first_mismatch`).
          properties:
            chainPartition: { type: integer }
            seqNo: { type: integer, format: int64 }
            entryId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            storedHash: { $ref: '#/components/schemas/LedgerHashHex' }
            recomputedHash: { $ref: '#/components/schemas/LedgerHashHex' }
            sealId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            anchorMatches: { type: boolean }
        chain:
          type: array
          description: Các mắt chuỗi quanh vị trí sai để vẽ sơ đồ khối.
          items: { $ref: '#/components/schemas/LedgerChainLink' }
        alertId:
          type: [string, 'null']
          format: uuid
          description: Cảnh báo mức Cao đã tạo khi phá vỡ.
        startedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        finishedAt: { type: [string, 'null'], format: date-time }
    MerkleProofStep:
      type: object
      required: [side, hash]
      properties:
        side: { type: string, enum: [TRAI, PHAI], description: 'Vị trí của nút anh em so với nút đang tính.' }
        hash: { $ref: '#/components/schemas/LedgerHashHex' }
    LedgerInclusionProof:
      description: >-
        Bằng chứng bao hàm hai mức. Lá `SHA-256(0x01 || entry_hash)`, nút `SHA-256(0x02 || trái || phải)`
        (ADR-26 của TL-01).
      type: object
      required: [entry, leafHash, tenantPath, tenantRoot, seal]
      properties:
        entry: { $ref: '#/components/schemas/LedgerEntry' }
        leafHash: { $ref: '#/components/schemas/LedgerHashHex' }
        tenantPath:
          type: array
          items: { $ref: '#/components/schemas/MerkleProofStep' }
        tenantRoot: { $ref: '#/components/schemas/LedgerHashHex' }
        cellLeafIndex: { type: integer }
        cellPath:
          type: array
          items: { $ref: '#/components/schemas/MerkleProofStep' }
        seal: { $ref: '#/components/schemas/LedgerSeal' }
        signature: { type: string, contentEncoding: base64, description: Chữ ký gốc cell bằng khoá SVC-09. }
        signerCertSha256: { $ref: '#/components/schemas/LedgerHashHex' }
        tsaToken: { type: string, contentEncoding: base64, description: Token RFC 3161. }
        anchors:
          type: array
          items: { $ref: '#/components/schemas/LedgerAnchorReceipt' }
    ComplaintDuplicateCandidate:
      description: Khiếu nại trước đó nghi trùng nội dung để đối chiếu theo BR-12-11.
