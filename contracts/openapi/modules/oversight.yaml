  /oversight/reopen-requests/{id}/approvals:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [reopen-requests]
      operationId: approveReopenRequest
      summary: Phê duyệt yêu cầu mở lại kỳ (lượt 1 hoặc 2)
      description: >-
        Người duyệt được OPA chỉ định, đúng lượt, sau xác thực bước lên (MSG-13-02) ký số phê duyệt.
        Lượt 1 (`decider`) chuyển `CHO_DUYET_2`; lượt 2 (`second_approver`, khác người duyệt 1 và khác
        người tạo) chuyển `DA_DUYET`, MOD-08 đưa kỳ sang `MO_LAI_HAU_KIEM` trong phạm vi đã duyệt và
        phát EVT-22 (MSG-13-03). Đây là thao tác `POST /oversight/reopen-requests/{id}/approve` của
        TL-01 Phụ lục C. Hai phê duyệt đồng thời được tuần tự hoá bằng khoá dòng (TL-03).
      x-mission:
        qt: [QT-13]
        scr: [SCR-1301]
        owner: MOD-07
        evt: [EVT-18, EVT-22]
        roles: [decider, second_approver]
        scope: Gn
        aal: 2
        fourEyes: true
        rules: [BR-13-02, BR-13-03, BR-13-04, BR-13-05]
        source: TL-02b SCR-1301 "Xác thực MFA và duyệt"; TL-01 PL C (ánh xạ `/approve`); TL-03 reopen_approval
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [comment]
              properties:
                comment:
                  type: string
                  minLength: 10
                  maxLength: 2000
                  description: Ý kiến người duyệt (`oversight.reopen_approval.comment`).
            examples:
              dong-y:
                value: { comment: 'Đồng ý mở lại trong phạm vi một hồ sơ, chỉ sửa hệ số C của nhiệm vụ then chốt 3.' }
      responses:
        '200':
          description: Đã ghi phê duyệt; trả yêu cầu với trạng thái mới.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReopenRequest' }
              examples:
                mlk-007: { $ref: '#/components/examples/ReopenRequestMlk007' }
        '401':
          description: >-
            Thiếu xác thực bước lên: `WWW-Authenticate` mang `error="insufficient_user_authentication",
            acr_values="aal2"` (RFC 9470, MSG-13-02).
          headers:
            WWW-Authenticate:
              schema: { type: string }
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '403':
          description: >-
            Vi phạm nguyên tắc bốn mắt hoặc tách vai trò (`OVERSIGHT-403-FOUR-EYES`, MSG-13-01): người
            duyệt trùng người tạo, trùng người duyệt lượt trước, đã tham gia thẩm định hoặc quyết định
            hồ sơ bị mở, hoặc không phải người được chỉ định cho lượt này.
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
              examples:
                bon-mat:
                  value:
                    type: https://okrkpi.vn/problems/four-eyes
                    title: Không đáp ứng nguyên tắc hai người duyệt
                    status: 403
                    code: OVERSIGHT-403-FOUR-EYES
                    msg: MSG-13-01
                    detail: Hai người duyệt phải là hai người khác nhau, khác người tạo yêu cầu và chưa tham gia thẩm định, quyết định hồ sơ bị mở (PL 4 V.1).
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

