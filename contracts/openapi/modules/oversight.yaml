        qt: [QT-14]
        scr: [SCR-1401]
        owner: MOD-07
        roles: [appraiser, inspector]
        scope: Cd
        rules: [BR-14-03]
        source: TL-02b SCR-1401; TL-01 PL C (ánh xạ `/anomalies`)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - $ref: '../common/common.yaml#/components/parameters/UnitId'
        - name: signal
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/AnomalySignalCode' }
        - name: severity
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/AnomalySeverity' }
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/AnomalyAlertStatus' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang cảnh báo và số đếm phân bố.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AnomalyAlertSummary' }
                  nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
                  counts: { $ref: '#/components/schemas/AnomalyAlertCounts' }
              examples:
                quy-iv:
                  value:
                    items:
                      - id: 01929b40-1111-7222-8333-000000001401
                        severity: CAO
                        signalCode: MINH_CHUNG_TRUNG
                        subject: { type: DON_VI, id: 01929a00-bbbb-7ccc-8ddd-000000000043, name: Phòng C }
                        period: { id: 01929a10-0000-7000-8000-000000000204, label: Quý IV/2026, startDate: '2026-10-01', endDate: '2026-12-31' }
                        status: MOI
                        detectedAt: '2027-01-08T02:04:00+07:00'
                    nextCursor: null
                    counts: { windowDays: 90, newCount: 23, validCount: 14, assignedCount: 7, violationCount: 2 }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/alerts/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [alerts]
      operationId: getAnomalyAlert
      summary: Chi tiết cảnh báo và chuỗi truy vết
      description: >-
        Trả cảnh báo, chuỗi bằng chứng, bảng nguồn và các hành động (kể cả hành động tự động). Theo
        TL-02b, lần mở đầu tiên của người xử lý chuyển `MOI` sang `DANG_XEM`; đây là hiệu ứng phụ ghi
        trạng thái trên một GET, máy chủ thực hiện luỹ đẳng và không đổi ETag của lần đọc khác.
      x-mission:
        qt: [QT-14]
        scr: [SCR-1401]
        owner: MOD-07
        roles: [appraiser, inspector]
        scope: Cd
        rules: [BR-14-03]
        source: TL-02b SCR-1401 "Chọn cảnh báo", bảng trường 4..6
      responses:
        '200':
          description: Cảnh báo.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnomalyAlert' }
              examples:
                minh-chung-trung: { $ref: '#/components/examples/AlertDuplicateEvidence' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/alerts/{id}/actions:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [alerts]
      operationId: createAlertAction
      summary: Xử lý cảnh báo (xác nhận hợp lệ, giao kiểm tra, kết luận, ghi chú)
      description: >-
        Mọi hành động có ghi chú 20 đến 2.000 ký tự và được ghi sổ cái (BR-14-05). `XAC_NHAN_HOP_LE`
        (từ `DANG_XEM`): cảnh báo `HOP_LE` rồi `DONG`, gỡ cờ chặn (MSG-14-03). `GIAO_KIEM_TRA` (từ
        `DANG_XEM`): `DA_GIAO_KIEM_TRA`, bắt buộc `assignedTo`. `KET_LUAN` (chỉ `inspector`, từ
        `DA_GIAO_KIEM_TRA`): `CO_VI_PHAM` hoặc `KHONG_VI_PHAM` theo `verdict`; có vi phạm với kỳ đã
        khoá thì giao diện mở SCR-1301 tạo yêu cầu mở lại kỳ (MSG-14-04, BR-14-02). Người xử lý không
        được là đối tượng (BR-14-08). Thao tác này thay `POST /oversight/anomalies/{id}/resolution`
        của TL-01 Phụ lục C.
      x-mission:
        qt: [QT-14]
        scr: [SCR-1401]
        owner: MOD-07
        evt: [EVT-21]
        roles: [appraiser, inspector]
        scope: Cd
        rules: [BR-14-02, BR-14-04, BR-14-05, BR-14-08]
        source: TL-02b SCR-1401 "Xác nhận hợp lệ", "Giao kiểm tra", "Kết luận"; TL-01 PL C (ánh xạ `/resolution`)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertActionInput' }
            examples:
              hop-le:
                value:
                  type: XAC_NHAN_HOP_LE
                  note: Ba báo cáo tháng dùng chung một tệp tổng hợp quý theo hướng dẫn của Văn phòng; nội dung từng tháng nằm ở các phụ lục khác nhau.
              giao-kiem-tra:
                value:
                  type: GIAO_KIEM_TRA
                  assignedTo: 01929a00-aaaa-7bbb-8ccc-000000000310
                  note: Đề nghị Uỷ ban kiểm tra xác minh việc dùng lại cùng một tệp minh chứng cho ba sản phẩm.
              ket-luan:
                value:
                  type: KET_LUAN
                  verdict: CO_VI_PHAM
                  note: Xác minh ba sản phẩm dùng cùng một minh chứng không phản ánh kết quả từng tháng; đề nghị hậu kiểm.
      responses:
        '200':
          description: Đã ghi hành động; trả cảnh báo với trạng thái mới.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnomalyAlert' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403':
          description: >-
            OPA từ chối: người xử lý là đối tượng của cảnh báo (BR-14-08) hoặc không phải `inspector`
            khi kết luận (BR-14-02). Mã `OVERSIGHT-403-SEPARATION-OF-DUTIES`, `COMMON-403-OUT-OF-SCOPE`.
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ───────────────────────────── Sổ cái (SVC-09) ─────────────────────────────
  /ledger/entries:
    get:
      tags: [ledger]
      operationId: listLedgerEntries
      summary: Tra cứu sổ cái
      description: >-
        Lọc bản ghi sổ cái theo đối tượng, khoảng thời gian (mặc định 90 ngày gần nhất, tối đa 2 năm
        mỗi lần) và loại sự kiện. Trường C2 trong giá trị trước, sau hiện dạng che. Mỗi lần tra cứu
        được ghi sổ cái. Bản ghi cũ hơn 24 tháng đọc từ kho lưu trữ Parquet nên chậm hơn.
      x-mission:
        qt: [QT-13, QT-14]
        scr: [SCR-1302]
        owner: SVC-09
        roles: [appraiser, inspector]
        scope: 'Đv (appraiser), Tn (inspector)'
        rules: [BR-13-07, BR-13-09]
        source: TL-02b SCR-1302 "Tìm", bảng trường 1..4
      parameters:
        - name: aggregateType
          in: query
          description: Loại đối tượng (`ledger_entry.aggregate_type`), ví dụ `appraisal_profile`.
          schema: { type: string, maxLength: 32 }
        - name: aggregateId
          in: query
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: from
          in: query
          schema: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        - name: to
          in: query
          schema: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        - name: eventType
          in: query
          description: Topic sự kiện, ví dụ `product.evidence.accepted.v1`.
          schema: { type: string, maxLength: 64 }
        - name: chainPartition
          in: query
          schema: { type: integer, minimum: 0, maximum: 63 }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang bản ghi.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LedgerEntry' }
                  nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
              examples:
                ho-so:
                  value:
                    items:
                      - id: 01929c50-0000-7000-8000-000000088412
                        chainPartition: 17
                        seqNo: 1042
                        eventId: 01929c4f-aaaa-7bbb-8ccc-000000001042
                        eventType: product.evidence.accepted.v1
                        aggregateType: appraisal_profile
                        aggregateId: 01929a10-1c2d-7e3f-8a4b-5c6d7e8f9a01
                        actor: { id: 01929a00-aaaa-7bbb-8ccc-000000000205, name: Ngô Thanh Tâm }
                        actorKind: NGUOI
                        occurredAt: '2026-12-18T14:21:07+07:00'
                        recordedAt: '2026-12-18T14:21:08+07:00'
                        metadata: { before: { c: null }, after: { c: 0.85 } }
                        entryHash: 4b07c1d2e3f405162738495a6b7c8d9e0f1a2b3c4d5e6f708192a3b4c5d6e7f8
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422':
          description: Khoảng thời gian quá 2 năm (`LEDGER-422-RANGE-TOO-LONG`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /ledger/entries/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [ledger]
      operationId: getLedgerEntry
      summary: Chi tiết bản ghi sổ cái
      description: Bản ghi kèm các băm, niêm phong Merkle chứa bản ghi (nếu đã niêm phong) và các biên nhận neo của niêm phong cell.
      x-mission:
        qt: [QT-13]
        scr: [SCR-1302]
        owner: SVC-09
        roles: [appraiser, inspector]
        scope: 'Đv (appraiser), Tn (inspector)'
        source: TL-02b SCR-1302 "Xem bản ghi", bảng trường 7
      responses:
        '200':
          description: Bản ghi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerEntryDetail' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /ledger/verify-runs:
    get:
      tags: [ledger]
      operationId: listLedgerVerifyRuns
      summary: Các lần kiểm tra toàn vẹn
      description: Lần kiểm tra gần nhất trước (SCR-1302 trường 6), gồm lần chạy theo lịch và theo yêu cầu.
      x-mission:
        qt: [QT-13]
        scr: [SCR-1302]
        owner: SVC-09
        roles: [appraiser, inspector]
        scope: 'Đv (appraiser), Tn (inspector)'
        source: TL-02b SCR-1302 bảng trường 6; TL-03 verify_run
      parameters:
        - name: verifyKind
          in: query
          schema: { $ref: '#/components/schemas/LedgerVerifyKind' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang lần kiểm tra.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/LedgerVerifyRun' }
                  nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    post:
      tags: [ledger]
      operationId: createLedgerVerifyRun
      summary: Chạy kiểm tra toàn vẹn chuỗi băm
      description: >-
        Tạo tác vụ kiểm tra toàn bộ hoặc một phân vùng chuỗi: tính lại chuỗi băm, đối chiếu niêm phong
        Merkle và bản neo, chỉ ra phân vùng và bản ghi đầu tiên bị phá vỡ (BR-13-10). Phát hiện phá vỡ
        thì ledger-service khoá ghi phân vùng và phát EVT-20 mức Cao (BR-13-11, MSG-13-06); hoàn tất
        không phá vỡ thì MSG-13-05. Job có `resultLocation` trỏ tới `/api/v1/ledger/verify-runs/{id}`.
      x-mission:
        qt: [QT-13]
        scr: [SCR-1302]
        owner: SVC-09
        evt: [EVT-20]
        roles: [inspector]
        scope: Tn
        rules: [BR-13-10, BR-13-11]
        source: TL-02b SCR-1302 "Chạy kiểm tra toàn vẹn" (202)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verifyKind]
              properties:
                verifyKind: { $ref: '#/components/schemas/LedgerVerifyKind' }
                chainPartition:
                  type: integer
                  minimum: 0
                  maximum: 63
                  description: Bỏ trống để kiểm tra cả 64 phân vùng của tenant.
                rangeFrom: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
                rangeTo: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
            examples:
              toan-bo:
                value: { verifyKind: TOAN_BO }
              mot-phan-vung:
                value: { verifyKind: TOAN_BO, chainPartition: 17, rangeFrom: '2026-10-01T00:00:00+07:00', rangeTo: '2027-01-20T00:00:00+07:00' }
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /ledger/verify-runs/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [ledger]
      operationId: getLedgerVerifyRun
      summary: Kết quả một lần kiểm tra toàn vẹn
      x-mission:
        qt: [QT-13]
        scr: [SCR-1302]
        owner: SVC-09
        roles: [appraiser, inspector]
        scope: 'Đv (appraiser), Tn (inspector)'
        source: TL-02b SCR-1302 bảng trường 5, 6; TL-03 verify_run
      responses:
        '200':
          description: Lần kiểm tra.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerVerifyRun' }
              examples:
                vr-0112: { $ref: '#/components/examples/VerifyRunBroken' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /ledger/exports:
    post:
      tags: [ledger]
      operationId: createLedgerExport
      summary: Xuất bằng chứng sổ cái (JSON kèm chữ ký)
      description: >-
        Xuất các bản ghi, niêm phong và bản neo trong phạm vi lọc, ký bằng khoá của ledger-service để
        kiểm tra độc lập bằng CLI `ledger-verify` (BR-13-12, MSG-13-07). Trả 202; `resultLocation` của
        job trỏ tới tệp tải về.
      x-mission:
        qt: [QT-13]
        scr: [SCR-1302]
        owner: SVC-09
        roles: [inspector]
        scope: Tn
        rules: [BR-13-12]
        source: TL-02b SCR-1302 "Xuất bằng chứng" (202)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                aggregateType: { type: string, maxLength: 32 }
                aggregateId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
                eventType: { type: string, maxLength: 64 }
                from: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
                to: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
                includeVerifyRunId:
                  $ref: '../common/common.yaml#/components/schemas/Uuid'
                  description: Đính kèm kết quả một lần kiểm tra toàn vẹn (suy luận).
            examples:
              ho-so:
                value:
                  aggregateType: appraisal_profile
                  aggregateId: 01929a10-1c2d-7e3f-8a4b-5c6d7e8f9a01
                  from: '2026-10-01T00:00:00+07:00'
                  to: '2027-01-20T00:00:00+07:00'
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /oversight/ledger/proofs:
    get:
      tags: [ledger]
      operationId: getLedgerInclusionProof
      summary: Bằng chứng bao hàm Merkle của một sự kiện
      description: >-
        Trả đường dẫn Merkle từ lá `SHA-256(0x01 || entry_hash)` lên gốc tenant, rồi từ gốc tenant lên
        gốc cell, kèm chữ ký gốc cell, token RFC 3161 và biên nhận neo (TL-03 chương 8). Sự kiện chưa
        được niêm phong trả 409 `LEDGER-409-NOT-SEALED`. Đường dẫn giữ đúng TL-01 Phụ lục C; dịch vụ sở
        hữu là SVC-09 dù tiền tố là `/oversight`.
      x-mission:
        qt: [QT-13]
        scr: [SCR-1302]
        owner: SVC-09
        roles: [inspector]
        scope: Tn
        rules: [BR-13-09, BR-13-12]
        source: TL-01 PL C; _ghi-chu-TL-01 mục 13; TL-03 chương 8
      parameters:
        - name: event
          in: query
          required: true
          description: Mã sự kiện nguồn (`ledger_entry.event_id`).
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
      responses:
        '200':
          description: Bằng chứng bao hàm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerInclusionProof' }
              examples:
                ban-ghi-1041: { $ref: '#/components/examples/InclusionProof1041' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: Sự kiện chưa được niêm phong (`LEDGER-409-NOT-SEALED`); thử lại sau cửa sổ niêm phong kế tiếp.
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

components:
  securitySchemes:
    keycloak: { $ref: '../common/common.yaml#/components/securitySchemes/keycloak' }
  responses:
    SeparationOfDuties:
      description: >-
        OPA từ chối theo quy tắc tách vai trò PL 4 V.1 (BR-12-04): người gọi đã nghiệm thu, thẩm định,
        đề xuất hoặc quyết định hồ sơ bị khiếu nại. Mã `OVERSIGHT-403-SEPARATION-OF-DUTIES`, MSG-12-05.
      content:
        application/problem+json:
          schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
          examples:
            tach-vai-tro:
              value:
                type: https://okrkpi.vn/problems/separation-of-duties
                title: Không thể xử lý khiếu nại này
                status: 403
                code: OVERSIGHT-403-SEPARATION-OF-DUTIES
                msg: MSG-12-05
                detail: Đồng chí không thể xử lý khiếu nại này vì đã tham gia thẩm định hồ sơ liên quan (PL 4 V.1).
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736

  schemas:
    # ─────────── Khiếu nại ───────────
    ComplaintKind:
      description: Hình thức (`oversight.complaint.kind`, BR-12-03).
      type: string
      enum: [KHIEU_NAI, GIAI_TRINH, BAO_LUU]
    ComplaintTargetStage:
      description: Bước bị khiếu nại (`oversight.complaint.target_stage`).
      type: string
      enum: [THAM_DINH, DE_XUAT, QUYET_DINH]
    ComplaintStatus:
      description: >-
        Trạng thái khiếu nại (`oversight.complaint.status`, bộ của TL-02b thêm `RUT`). TL-03 không có
        trạng thái nháp; khiếu nại chưa gửi có `status` là `null`.
      type: string
      enum: [MOI, DA_TIEP_NHAN, DANG_GIAI_TRINH, CHO_KET_LUAN, DA_TRA_LOI, DANG_THI_HANH, KHONG_THU_LY, RUT, DONG]
    ComplaintOutcome:
      description: Kết quả của khiếu nại (`oversight.complaint.outcome`).
      type: string
      enum: [GIU_NGUYEN, DIEU_CHINH, BAO_LUU]
    ComplaintResolution:
      description: >-
        Kết quả xử lý ghi ở kết luận (`oversight.complaint_response.outcome`, SCR-1202 trường 6). Máy
        chủ suy ra `complaint.outcome`: `GIU_NGUYEN` giữ nguyên, hai giá trị còn lại thành `DIEU_CHINH`.
      type: string
      enum: [GIU_NGUYEN, CHAP_NHAN_MOT_PHAN, CHAP_NHAN]
    ComplaintRecordKind:
      description: Loại bản ghi trả lời (`oversight.complaint_response.record_kind`).
      type: string
      enum: [YEU_CAU, GIAI_TRINH, KET_LUAN, BAO_LUU]
    ComplaintTarget:
      description: Một cấu phần bị khiếu nại lấy từ snapshot (`targets_json`).
      type: object
      required: [key, stage]
      properties:
        key: { type: string, maxLength: 100, description: 'Khoá cấu phần trong snapshot, ví dụ `NV-THEN-CHOT-3.C`.' }
        stage: { $ref: '#/components/schemas/ComplaintTargetStage' }
        label: { type: string, maxLength: 200, description: Nhãn hiển thị. }
    ComplainableProfile:
      description: Kết quả đánh giá có thể khiếu nại (suy luận, SCR-1201 trường 1..3).
      type: object
      required: [profileId, period, complaintDeadline, allowedKinds, targets]
      properties:
        profileId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        rating: { $ref: '../common/common.yaml#/components/schemas/RatingLevel' }
        score: { type: number }
        publishedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        publishDecision: { type: string, description: Số quyết định công bố. }
        complaintDeadline: { $ref: '../common/common.yaml#/components/schemas/Date' }
        workingDaysLeft: { type: integer, description: Số ngày làm việc còn lại; âm khi quá hạn. }
        allowedKinds:
          type: array
          items: { $ref: '#/components/schemas/ComplaintKind' }
        targets:
          type: array
          items: { $ref: '#/components/schemas/ComplaintTarget' }
    ComplaintInput:
      description: Nội dung khiếu nại khi lưu nháp (SCR-1201 bảng trường).
      type: object
      required: [profileId, kind, targetStage]
      properties:
        profileId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/ComplaintKind' }
        targetStage: { $ref: '#/components/schemas/ComplaintTargetStage' }
        targets:
          type: array
          description: Ít nhất một cấu phần khi gửi (BR-12-02).
          items: { $ref: '#/components/schemas/ComplaintTarget' }
        subjectLine:
          type: string
          maxLength: 255
          description: Tiêu đề chung không chứa nội dung nhạy cảm; bỏ trống thì máy chủ sinh từ kết quả bị khiếu nại.
        content:
          type: string
          maxLength: 8000
          description: Lý do, căn cứ, 50 đến 8.000 ký tự khi gửi (`content_enc`).
          x-classification: C2
        requestText:
          type: string
          maxLength: 500
          description: Đề nghị cụ thể (`request_text_enc`).
          x-classification: C2
        attachmentObjectIds:
          type: array
          description: Tệp kèm ở SVC-08 (`attachment_object_ids`), đã quét mã độc và tính SHA-256.
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        reserveOpinion:
          type: boolean
          default: false
          description: Bảo lưu ý kiến nếu không được chấp nhận (SCR-1201 trường 7; TL-03 chỉ có `reserve_opinion_enc`, cờ này là suy luận).
    ComplaintSummary:
      description: Dòng danh sách khiếu nại (không chứa C2).
      type: object
      required: [id, code, kind, status]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, description: 'Mã khiếu nại dạng KN-yyyy-nnnn (suy luận, TL-03 không có cột mã).' }
        complainant: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        subjectLine: { type: string }
        kind: { $ref: '#/components/schemas/ComplaintKind' }
        targetStage: { $ref: '#/components/schemas/ComplaintTargetStage' }
        status:
          oneOf:
            - $ref: '#/components/schemas/ComplaintStatus'
            - type: 'null'
        filedAt: { type: [string, 'null'], format: date-time }
        responseDeadline: { type: [string, 'null'], format: date }
        workingDaysLeft: { type: [integer, 'null'] }
    ComplaintTimelineItem:
      type: object
      required: [at, action]
      properties:
        at: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        action: { type: string, description: 'Mô tả hành động, ví dụ "Tiếp nhận".' }
        actor: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        ledgerEntryId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    Complaint:
      description: Khiếu nại (`oversight.complaint`).
      allOf:
        - $ref: '#/components/schemas/ComplaintSummary'
        - type: object
          required: [profileId, period, rowVersion]
          properties:
            profileId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
            targets:
              type: array
              items: { $ref: '#/components/schemas/ComplaintTarget' }
            content:
              type: string
              description: Lý do, căn cứ đã giải mã; chỉ có khi người gọi có quyền đọc C2.
              x-classification: C2
            requestText:
              type: string
              x-classification: C2
            reserveOpinion: { type: boolean }
            reservedOpinion:
              type: [string, 'null']
              description: Ý kiến bảo lưu đã xác nhận.
              x-classification: C2
            attachmentObjectIds:
              type: array
              items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            handlerUnit: { $ref: '../common/common.yaml#/components/schemas/Ref' }
            handler: { $ref: '../common/common.yaml#/components/schemas/Ref' }
            outcome:
              oneOf:
                - $ref: '#/components/schemas/ComplaintOutcome'
                - type: 'null'
            conclusion: { $ref: '#/components/schemas/ComplaintConclusion' }
            reopenRequestId:
              type: [string, 'null']
              format: uuid
              description: Yêu cầu mở lại kỳ thi hành kết luận, nếu có.
            timeline:
              type: array
              items: { $ref: '#/components/schemas/ComplaintTimelineItem' }
            rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    ExplanationParty:
      description: Bên được yêu cầu giải trình (SCR-1202 trường 4).
      type: object
      required: [kind, id]
      properties:
        kind: { type: string, enum: [NGUOI, DON_VI], description: Người hoặc đơn vị (suy luận mã). }
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    ComplaintAdjustment:
      description: Một điều chỉnh đề nghị (SCR-1202 trường 7, `adjustment_json`).
      type: object
      required: [targetKey, newValue, reason]
      properties:
        targetKey: { type: string, maxLength: 100 }
        oldValue: { type: [number, string, 'null'] }
        newValue: { type: [number, string] }
        reason: { type: string, maxLength: 1000 }
    ComplaintConclusionInput:
      type: object
      required: [outcome, responseText]
      properties:
        outcome: { $ref: '#/components/schemas/ComplaintResolution' }
        adjustments:
          type: array
          description: Bắt buộc khi `outcome` khác `GIU_NGUYEN`.
          items: { $ref: '#/components/schemas/ComplaintAdjustment' }
        responseText:
          type: string
          minLength: 1
          maxLength: 16000
          description: Nội dung văn bản trả lời (`response_enc`).
          x-classification: C2
        responseDocRef: { type: string, maxLength: 200, description: 'Số văn bản trả lời sinh từ mẫu TL-KN-01.' }
        noExplanationNote:
          type: string
          maxLength: 2000
          description: Ghi chú khi kết luận thẳng từ `DA_TIEP_NHAN` không qua giải trình (suy luận).
    ComplaintConclusion:
      description: Kết luận hiện hành của khiếu nại (bản ghi `KET_LUAN`).
      type: [object, 'null']
      properties:
        outcome: { $ref: '#/components/schemas/ComplaintResolution' }
        adjustments:
          type: array
          items: { $ref: '#/components/schemas/ComplaintAdjustment' }
        responseDocRef: { type: [string, 'null'] }
        signRequestId: { type: [string, 'null'], format: uuid }
        periodLocked: { type: boolean, description: 'Kỳ đã `DA_KHOA`, điều chỉnh phải qua mở lại kỳ (MSG-12-07).' }
    ComplaintResponseRecord:
      description: Bản ghi `oversight.complaint_response`.
      type: object
      required: [id, complaintId, recordKind, respondedAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        complaintId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        recordKind: { $ref: '#/components/schemas/ComplaintRecordKind' }
        responder: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        party: { $ref: '#/components/schemas/ExplanationParty' }
        requestId:
          type: [string, 'null']
          format: uuid
          description: Với `GIAI_TRINH`, yêu cầu được trả lời (suy luận).
        dueDate: { type: [string, 'null'], format: date }
        content:
          type: string
          x-classification: C2
        attachmentObjectIds:
          type: array
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        outcome:
          oneOf:
            - $ref: '#/components/schemas/ComplaintResolution'
            - type: 'null'
        adjustments:
          type: array
          items: { $ref: '#/components/schemas/ComplaintAdjustment' }
        responseDocRef: { type: [string, 'null'] }
        signRequestId: { type: [string, 'null'], format: uuid }
        respondedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    OversightReasonInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 2000 }

    # ─────────── Mở lại kỳ ───────────
    ReopenRequestStatus:
      description: >-
        Trạng thái yêu cầu (`oversight.reopen_request.status`); bốn giá trị đầu của TL-02b, TL-03 thêm
        `DA_THUC_HIEN` (kỳ đã mở lại, EVT-22) và `DA_DONG`.
      type: string
      enum: [CHO_DUYET_1, CHO_DUYET_2, DA_DUYET, TU_CHOI, DA_THUC_HIEN, DA_DONG]
    ReopenScope:
      description: Phạm vi chuẩn hoá (`oversight.reopen_request.scope`).
      type: string
      enum: [TOAN_KY, DON_VI, HO_SO]
    ReopenAuditKind:
      description: >-
        Loại hậu kiểm làm căn cứ (`reopen_request.audit_kind`, SCR-1301 trường 3). TL-03 không đặt
        CHECK cho cột này và dùng bộ khác ở `post_audit.audit_kind`; hợp đồng giữ bộ của SCR-1301.
      type: string
      enum: [KE_HOACH, DOT_XUAT, PHAN_ANH]
    ReopenScopeItem:
      type: object
      required: [table]
      properties:
        profileId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        unitId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        table: { type: string, description: 'Bảng được sửa, ví dụ `product.acceptance`.' }
        recordId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        fields:
          type: array
          description: Cột được phép sửa.
          items: { type: string }
    ReopenBasis:
      description: Căn cứ của yêu cầu (`basis_ref`).
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [KHIEU_NAI, CANH_BAO, HAU_KIEM, QUYET_DINH], description: Loại căn cứ (suy luận mã). }
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 200, description: 'Mã hiển thị hoặc số quyết định.' }
    ReopenRequestInput:
      type: object
      required: [periodId, auditKind, scope, scopeIds, scopeDetail, openWorkingDays, reason, basis]
      properties:
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        auditKind: { $ref: '#/components/schemas/ReopenAuditKind' }
        scope: { $ref: '#/components/schemas/ReopenScope' }
        scopeIds:
          type: array
          description: Đơn vị hoặc hồ sơ; khác rỗng khi `scope` khác `TOAN_KY`.
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        scopeDetail:
          type: object
          description: Phạm vi chi tiết (`scope_json`).
          required: [items]
          properties:
            items:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/ReopenScopeItem' }
        openWorkingDays:
          type: integer
          minimum: 1
          maximum: 10
          default: 3
          description: Thời hạn mở theo ngày làm việc; máy chủ tính `openUntil` theo lịch tenant.
        reason: { type: string, minLength: 50, maxLength: 4000 }
        basis: { $ref: '#/components/schemas/ReopenBasis' }
    ReopenApproval:
      description: Một phê duyệt (`oversight.reopen_approval`).
      type: object
      required: [approver, approverRole, decision, decidedAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        approver: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        approverRole: { type: string, enum: [decider, second_approver] }
        decision: { type: string, enum: [DONG_Y, TU_CHOI] }
        mfaAcr: { type: string, description: 'Claim `acr` của phiên step-up.' }
        signRequestId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        comment: { type: [string, 'null'] }
        decidedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    ReopenApproverSlot:
      description: Người duyệt được OPA chỉ định cho một lượt (suy luận, SCR-1301 trường 9).
      type: object
      required: [round, role]
      properties:
        round: { type: integer, enum: [1, 2] }
        role: { type: string, enum: [decider, second_approver] }
        assignee: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        approval:
          oneOf:
            - $ref: '#/components/schemas/ReopenApproval'
            - type: 'null'
    ReopenRequest:
      description: Yêu cầu mở lại kỳ (`oversight.reopen_request`).
      type: object
      required: [id, code, period, status, scope, reason, requestedBy, approvalsRequired, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, description: 'MLK-yyyy-nnn, duy nhất trong tenant.' }
        period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        periodStatus: { $ref: '../common/common.yaml#/components/schemas/PeriodStatus' }
        auditKind: { $ref: '#/components/schemas/ReopenAuditKind' }
        scope: { $ref: '#/components/schemas/ReopenScope' }
        scopeIds:
          type: array
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        scopeDetail:
          type: object
          properties:
            items:
              type: array
              items: { $ref: '#/components/schemas/ReopenScopeItem' }
        openUntil: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        reason: { type: string }
        basis: { $ref: '#/components/schemas/ReopenBasis' }
        requestedBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        approvalsRequired: { type: integer, minimum: 2 }
        status: { $ref: '#/components/schemas/ReopenRequestStatus' }
        approvers:
          type: array
          items: { $ref: '#/components/schemas/ReopenApproverSlot' }
        executedAt: { type: [string, 'null'], format: date-time }
        relockedAt: { type: [string, 'null'], format: date-time }
        createdAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    ReopenImpact:
      description: Ảnh hưởng dự kiến (tính thử, không lưu).
      type: object
      required: [policyVersion, rows]
      properties:
        policyVersion: { type: string }
        rows:
          type: array
          items:
            type: object
            required: [metric, before, after]
            properties:
              profileId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
              metric: { type: string }
              before: { type: string }
              after: { type: string }
        formsToRegenerate: { type: integer, minimum: 0 }

    # ─────────── Hậu kiểm ───────────
    PostAuditKind:
      description: Loại hậu kiểm (`oversight.post_audit.audit_kind`, QĐ 15.3).
      type: string
      enum: [THEO_KE_HOACH, DOT_XUAT, THEO_PHAN_ANH]
    PostAuditTargetType:
      type: string
      enum: [HO_SO, DON_VI, NHIEM_VU, MINH_CHUNG]
    PostAuditConclusion:
      type: string
      enum: [KHONG_SAI_LECH, HUY_KET_QUA, DANH_GIA_LAI]
    PostAudit:
      description: Đợt hậu kiểm (`oversight.post_audit`).
      type: object
      required: [id, periodId, auditKind, targetType, targetId, inspector, openedAt, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        auditKind: { $ref: '#/components/schemas/PostAuditKind' }
        targetType: { $ref: '#/components/schemas/PostAuditTargetType' }
        targetId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        basis: { type: [string, 'null'] }
        inspector: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        findings:
          type: [string, 'null']
          x-classification: C2
        conclusion:
          oneOf:
            - $ref: '#/components/schemas/PostAuditConclusion'
            - type: 'null'
        reopenRequestId: { type: [string, 'null'], format: uuid }
        openedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        closedAt: { type: [string, 'null'], format: date-time }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - id: 01929b60-1111-7222-8333-000000000001
          periodId: 01929a10-0000-7000-8000-000000000204
          auditKind: DOT_XUAT
          targetType: DON_VI
          targetId: 01929a00-bbbb-7ccc-8ddd-000000000043
          basis: QĐ 12-QĐ/UBKT ngày 05/02/2027
          inspector: { id: 01929a00-aaaa-7bbb-8ccc-000000000310, name: Đỗ Văn Lâm }
          findings: null
          conclusion: null
          reopenRequestId: null
          openedAt: '2027-02-06T08:00:00+07:00'
          closedAt: null
          rowVersion: 1

    # ─────────── Cảnh báo ───────────
    AnomalySignalCode:
      description: Tám dấu hiệu bất thường (`oversight.anomaly_alert.signal_code`, slide 31).
      type: string
      enum: [TU_CHAM_CAO, CAO_BANG, MUC_TIEU_DE, MINH_CHUNG_TRUNG, CAP_NHAT_DON, SUA_SAU_KHOA, CHE_NHO, MIEN_TRU_LAP]
    AnomalySeverity:
      type: string
      enum: [CAO, VUA, THAP]
    AnomalyAlertStatus:
      description: Trạng thái cảnh báo (`oversight.anomaly_alert.status`).
      type: string
      enum: [MOI, DANG_XEM, HOP_LE, DA_GIAO_KIEM_TRA, CO_VI_PHAM, KHONG_VI_PHAM, TU_DONG_DONG, DONG]
    AlertActionType:
      description: >-
        Loại hành động (`oversight.alert_action.action`). TL-03 CHECK gồm `GIAO_KIEM_TRA`,
        `XAC_NHAN_HOP_LE`, `GHI_CHU`, `DONG`; hợp đồng thêm `KET_LUAN` theo TL-02b SCR-1401 (TL-03 thiếu)
        và `TU_DONG` cho hành động tự động của hệ thống (suy luận). `DONG`, `TU_DONG` chỉ do hệ thống ghi.
      type: string
      enum: [XAC_NHAN_HOP_LE, GIAO_KIEM_TRA, KET_LUAN, GHI_CHU, DONG, TU_DONG]
    AlertActionInput:
      type: object
      required: [type, note]
      properties:
        type:
          type: string
