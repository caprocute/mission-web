# Hợp đồng OpenAPI của MOD-06 `dossier`, SVC-11 document-service và SVC-10 esign-service (WEB-063, ADR-32).
# Nguồn:
#   - Baseline mục 9 (schema dossier, docgen, esign), 9.1, 10 (vai trò AC), 13 (quy ước API); bảng EVT (EVT-17, EVT-18, EVT-21).
#   - TL-01 Phụ lục C mục "Kiểm điểm và hồ sơ số (MOD-06, SVC-11)" và hai dòng `/esign/sessions` ở mục "Dịch vụ nền";
#     TL-01 mục SVC-10 esign-service (SignatureProvider, ký bất đồng bộ), SVC-11 document-service (render-jobs 202),
#     chương 11 (ký từ xa chờ xác nhận tới 120 giây).
#   - TL-02b QT-11 (các bước, trạng thái gói hồ sơ, BR-11-01..BR-11-11, ngoại lệ), SCR-1101, SCR-1102 (bảng trường,
#     bảng chức năng, MSG-11-01..MSG-11-07); TL-02b SCR-0901, SCR-0903, SCR-0904, SCR-1202 (dùng `/dossiers/forms...`);
#     TL-02a SCR-0403 và TL-02b SCR-0901 (dùng `/esign/requests`).
#   - TL-03 schema dossier (review_meeting, review_comment, dossier_package, form_instance, special_case,
#     remediation_item), docgen (template, render_job, render_output), esign (sign_request, sign_item, certificate_ref).
#   - Ma trận phân quyền `docs/phan-quyen/ma-tran.json` (SCR-1101.*, SCR-1102.*, SCR-0901, SCR-0903, SCR-0904, SCR-1202;
#     dòng API `dossiers`, `esign`).
openapi: 3.1.0
info:
  title: Mission – Kiểm điểm, hồ sơ số và ký số (MOD-06)
  version: 1.0.0-draft.1
  description: >-
    Hợp đồng của quy trình QT-11 "Kiểm điểm và hồ sơ số": hội nghị kiểm điểm (SCR-1101), góp ý (dữ liệu C2),
    biên bản, theo dõi khắc phục hạn chế, gói hồ sơ số quý và năm có manifest SHA-256 và ký số (SCR-1102),
    sinh biểu mẫu Mẫu 1A đến 1D, Mẫu 2, Mẫu 3, bảng chấm điểm qua document-service (SVC-11), chuyển gói con diện
    Trung ương quản lý, và yêu cầu ký số qua esign-service (SVC-10) dùng chung cho mọi mốc pháp lý.
    Tác vụ dài trả 202 và được theo dõi qua `GET /jobs/{id}` (tệp `jobs.yaml`) hoặc luồng SSE thông báo.
servers:
  - url: /api/v1
security:
  - keycloak: []
tags:
  - name: Hội nghị kiểm điểm
    description: Lập hội nghị, gửi dự thảo, kiểm tra thời hạn 03 ngày làm việc, biên bản, kết thúc hội nghị (SCR-1101).
  - name: Góp ý kiểm điểm
    description: Góp ý trước và tại hội nghị; nội dung là dữ liệu C2, có chế độ ẩn danh (BR-11-06).
  - name: Khắc phục hạn chế
    description: Danh sách hạn chế cần khắc phục rút ra từ biên bản và theo dõi qua các kỳ (BR-11-08).
  - name: Gói hồ sơ số
    description: Gói hồ sơ quý, năm, diện TW; danh sách kiểm tra trước khi ký, ký số gói, tải gói, chuyển gói con (SCR-1102).
  - name: Biểu mẫu
    description: Biểu mẫu sinh từ dữ liệu đã quyết định (SVC-11), xem trước, tải tệp PDF/A, yêu cầu sinh trả 202.
  - name: Trường hợp đặc thù
    description: 13 trường hợp đặc thù của PL 6 do MOD-06 phát hiện và xử lý theo Policy Pack (BR-11-05).
  - name: Ký số
    description: Yêu cầu ký số từ xa và trạng thái yêu cầu ký (SVC-10), chứng thư của người ký.

components:
  securitySchemes:
    keycloak: { $ref: '../common/common.yaml#/components/securitySchemes/keycloak' }
    serviceClient: { $ref: '../common/common.yaml#/components/securitySchemes/serviceClient' }

  responses:
    DossierSignAccepted:
      description: >-
        Đã nhận yêu cầu ký gói (trả trong 200 ms). Theo dõi job bằng `Location` và yêu cầu ký bằng
        `GET /esign/requests/{signRequestId}`.
      headers:
        Location: { $ref: '../common/common.yaml#/components/headers/Location' }
        Retry-After: { $ref: '../common/common.yaml#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DossierSignJob' }
          examples:
            cho-ky:
              value:
                id: 01928f3e-7b1a-7c3e-9a51-3f2d9c1b0a78
                type: ESIGN_BATCH
                status: DANG_CHAY
                progress: 10
                message: Đang chờ người ký xác nhận trên ứng dụng ký số.
                signRequestId: 0192a3f4-1810-7000-8000-000000000001

  examples:
    DossierMeetingExample:
      summary: Hội nghị kiểm điểm cuối năm đã gửi dự thảo
      value: &meetingEx
        id: 0192a3f4-1101-7000-8000-000000000001
        title: Hội nghị kiểm điểm cuối năm 2026 của Chi bộ Ban Tổ chức
        period: { id: 0192a3f4-0002-7000-8000-000000002026, label: Năm 2026, startDate: '2026-01-01', endDate: '2026-12-31' }
        orgUnit: { id: 0192a3f4-0001-7000-8000-000000000010, name: Chi bộ Ban Tổ chức }
        meetingType: KIEM_DIEM_NAM
        scheduledAt: '2027-01-14T08:00:00+07:00'
        location: Phòng họp tầng 3, trụ sở Ban Tổ chức
        subjectPerson: { id: 0192a3f4-0003-7000-8000-000000000103, name: Trần Thị Mai }
        chair: { id: 0192a3f4-0003-7000-8000-000000000101, name: Nguyễn Văn Hùng }
        secretary: { id: 0192a3f4-0003-7000-8000-000000000102, name: Lê Thu Hà }
        status: DA_GUI_DU_THAO
        myRole: THANH_VIEN
        draftSentAt: '2027-01-08T16:20:00+07:00'
        deadlineCheck:
          workingDays: 3
          requiredWorkingDays: 3
          passed: true
          legalRef: QĐ Điều 6
        participants:
          - { person: { id: 0192a3f4-0003-7000-8000-000000000104, name: Phạm Quốc Bảo }, role: THANH_VIEN, status: DA_GOP_Y }
          - { person: { id: 0192a3f4-0003-7000-8000-000000000105, name: Đỗ Minh Châu }, role: THANH_VIEN, status: VANG_CO_LY_DO }
        draftForms:
          - { id: 0192a3f4-1103-7000-8000-000000000001, formCode: MAU_1B, status: DA_SINH }
        proposedLevel: HTTNV
        vote: null
        commentsLocked: false
        rowVersion: 4

    DossierCommentExample:
      summary: Góp ý loại hạn chế trước hội nghị
      value: &commentEx
        id: 0192a3f4-1104-7000-8000-000000000001
        meetingId: 0192a3f4-1101-7000-8000-000000000001
        subjectPersonId: 0192a3f4-0003-7000-8000-000000000103
        commenter: { id: 0192a3f4-0003-7000-8000-000000000104, name: Phạm Quốc Bảo }
