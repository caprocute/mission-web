        createdAt: '2027-01-10T09:15:00+07:00'

    DossierRemediationItemExample:
      summary: Hạn chế kỳ trước đang khắc phục
      value: &remediationEx
        id: 0192a3f4-1105-7000-8000-000000000001
        person: { id: 0192a3f4-0003-7000-8000-000000000103, name: Trần Thị Mai }
        meetingId: 0192a3f4-1101-7000-8000-000000000000
        sourcePeriod: { id: 0192a3f4-0002-7000-8000-000000002025, label: Năm 2025, startDate: '2025-01-01', endDate: '2025-12-31' }
        content: Nâng cao chất lượng thẩm định hồ sơ nhân sự, giảm số hồ sơ phải trả lại.
        status: DANG_KHAC_PHUC
        rowVersion: 2

    DossierPackageExample:
      summary: Gói hồ sơ năm đang chờ ký
      value: &packageEx
        id: 0192a3f4-1102-7000-8000-000000000142
