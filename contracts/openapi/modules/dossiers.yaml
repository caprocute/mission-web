    DossierSpecialCaseExample:
      summary: Điều động dưới hai tháng
      value: &specialCaseEx
        id: 0192a3f4-1106-7000-8000-000000000001
        person: { id: 0192a3f4-0003-7000-8000-000000000107, name: Vũ Hoàng Long }
        caseCode: DIEU_DONG_DUOI_2_THANG
        legalRef: PL 6 §1
        handling: Đơn vị cũ đánh giá, đơn vị mới cho ý kiến
        detectedBy: TU_DONG
        effect: XEP_LOAI_TAI_DON_VI_CU
        effectiveFrom: '2026-11-15'
        effectiveTo: '2026-12-31'

    EsignRequestExample:
      summary: Yêu cầu ký biên bản đang chờ xác nhận
      value: &esignReqEx
        id: 0192a3f4-1810-7000-8000-000000000002
        purpose: BIEN_BAN
        sourceModule: dossier
        sourceRefId: 0192a3f4-1101-7000-8000-000000000001
        provider: MYSIGN
        isBatch: false
        status: CHO_XAC_NHAN
        expiresAt: '2027-01-14T11:02:00+07:00'
        itemCount: 1
        signedCount: 0

  schemas:
    # ------------------------------------------------------------ Liệt kê
    DossierMeetingType:
      description: Loại hội nghị (`dossier.review_meeting.meeting_type`).
      type: string
      enum: [KIEM_DIEM_QUY, KIEM_DIEM_NAM, CHUYEN_DE]
    DossierMeetingStatus:
      description: Trạng thái hội nghị (`dossier.review_meeting.status`).
      type: string
      enum: [DU_KIEN, DA_GUI_DU_THAO, DA_HOP, DA_LAP_BIEN_BAN, DA_KY]
    DossierMeetingRole:
      description: Vai trò của một người trong hội nghị (suy luận; `participants_json` của TL-03 không quy định giá trị).
      type: string
      enum: [CHU_TRI, THU_KY, THANH_VIEN, NGUOI_DUOC_KIEM_DIEM]
    DossierParticipantStatus:
      description: >-
        Trạng thái của thành phần dự trên thẻ thành phần SCR-1101 (đã góp ý, đã đọc, chưa mở, vắng có lý do), cộng
        `CO_MAT` khi điểm danh (suy luận; TL không quy định mã).
      type: string
      enum: [DA_GOP_Y, DA_DOC, CHUA_MO, CO_MAT, VANG_CO_LY_DO]
    DossierCommentKind:
      description: Loại nội dung góp ý (`dossier.review_comment.kind`).
      type: string
      enum: [UU_DIEM, HAN_CHE, KIEN_NGHI]
    DossierCommentPhase:
      description: Giai đoạn góp ý (`dossier.review_comment.phase`).
      type: string
      enum: [TRUOC_HOI_NGHI, HOI_NGHI]
    DossierCommentSource:
      description: >-
        Nguồn góp ý (`dossier.review_comment.comment_kind`): góp ý của thành viên, phần tự kiểm điểm, kết luận.
      type: string
      enum: [GOP_Y, TU_KIEM_DIEM, KET_LUAN]
    DossierRemediationStatus:
      description: Trạng thái khắc phục (`dossier.remediation_item.status`).
      type: string
      enum: [MO, DANG_KHAC_PHUC, DA_KHAC_PHUC, CHUA_KHAC_PHUC]
    DossierPackageKind:
      description: Loại gói (`dossier.dossier_package.package_kind`).
      type: string
      enum: [QUY, NAM, DIEN_TW]
    DossierPackageStatus:
      description: Trạng thái gói hồ sơ (`dossier.dossier_package.status`, bộ trạng thái của TL-02b QT-11).
      type: string
      enum: [DANG_LAP, DANG_SINH, CHO_KY, DA_KY, DA_NOP, DA_LUU_TRU]
    DossierTransferDestination:
      description: Nơi chuyển hồ sơ diện TW (`dossier.dossier_package.transferred_to`).
      type: string
      enum: [BTC_TW, VPTW]
    DossierFormCode:
      description: Mã biểu mẫu (`dossier.form_instance.form_code`).
      type: string
      enum: [MAU_1A, MAU_1B, MAU_1C, MAU_1D, MAU_2, MAU_3, BANG_CHAM_DIEM]
    DossierFormStatus:
      description: Trạng thái biểu mẫu (`dossier.form_instance.status`).
      type: string
      enum: [CHO_SINH, DA_SINH, DA_KY, LOI]
    DocgenRenderStatus:
      description: Trạng thái tác vụ sinh ở SVC-11 (`docgen.render_job.status`).
      type: string
      enum: [CHO, DANG_SINH, XONG, LOI]
    DossierSpecialCaseDetectedBy:
      description: Cách phát hiện (`dossier.special_case.detected_by`).
      type: string
      enum: [TU_DONG, THU_CONG]
    DossierSpecialCaseEffect:
      description: Hệ quả với việc xếp loại (`dossier.special_case.effect`).
      type: string
      enum: [KHONG_XEP_LOAI, XEP_LOAI_TAI_DON_VI_CU, BAO_LUU, XEP_LOAI_BINH_THUONG, CHO_KET_LUAN]
    EsignPurpose:
      description: Mốc pháp lý của yêu cầu ký (`esign.sign_request.purpose`).
      type: string
      enum: [TU_DANH_GIA, THAM_DINH, QUYET_DINH, BIEN_BAN, GOI_HO_SO, PHE_DUYET_MO_LAI, PHAT_HANH_POLICY]
    EsignProvider:
      description: Nhà cung cấp chữ ký số (`esign.sign_request.provider`).
      type: string
      enum: [MYSIGN, VIETTEL_CA, CA_CHINH_PHU, BAN_CO_YEU]
    EsignRequestStatus:
      description: Trạng thái yêu cầu ký (`esign.sign_request.status`).
      type: string
      enum: [TAO, CHO_XAC_NHAN, DA_KY, TU_CHOI, HET_HAN, LOI]
    EsignSignatureFormat:
      description: Định dạng chữ ký (`esign.sign_item.signature_format`).
      type: string
      enum: [PADES_LTA, CADES_T, JWS]
    DossierSha256:
      description: Giá trị SHA-256 (cột `bytea` của TL-03) biểu diễn dạng 64 ký tự hex chữ thường.
      type: string
      pattern: '^[0-9a-f]{64}$'
      examples: ['9f2c4e7a1b3d5f60718293a4b5c6d7e8f90123456789abcdef0123456789abcd']

    # ------------------------------------------------------------ Hội nghị
    DossierDeadlineCheck:
      description: >-
        Kết quả kiểm tra thời hạn gửi dự thảo (QT-11 bước 5, BR-11-01), tính theo `config.holiday_calendar` và tham số
        `kiem_diem.cach_dem_ngay` của Policy Pack.
      type: object
      required: [requiredWorkingDays, passed]
      properties:
        workingDays:
          type: [integer, 'null']
          minimum: 0
          description: Số ngày làm việc trọn vẹn giữa thời điểm gửi và ngày hội nghị; rỗng khi chưa gửi dự thảo.
        requiredWorkingDays: { type: integer, description: 'Số ngày tối thiểu theo Policy Pack, mặc định 3.', examples: [3] }
        passed: { type: boolean, description: Đạt yêu cầu thời hạn. }
        legalRef: { type: string, examples: ['QĐ Điều 6'] }
        msg: { type: string, description: 'Mã thông báo khi không đạt, `MSG-11-01`.' }
        overrideReason:
          type: [string, 'null']
          maxLength: 2000
          description: Lý do được cấp uỷ chấp thuận để giữ nguyên ngày họp; in vào biên bản.
    DossierMeetingParticipant:
      type: object
      required: [person, role]
      properties:
        person: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        role: { $ref: '#/components/schemas/DossierMeetingRole' }
        status: { $ref: '#/components/schemas/DossierParticipantStatus' }
    DossierVote:
      description: >-
        Kết quả biểu quyết theo mức xếp loại (`dossier.review_meeting.vote_json`). Tổng không vượt số người có mặt; không
        thay mức quyết định (BR-11-07).
      type: object
      properties:
        HTXSNV: { type: integer, minimum: 0 }
        HTTNV: { type: integer, minimum: 0 }
        HTNV: { type: integer, minimum: 0 }
        KHTNV: { type: integer, minimum: 0 }
    DossierFormSummary:
      description: Biểu mẫu rút gọn gắn với hội nghị (dự thảo Mẫu 1A đến 1D, biên bản).
      type: object
      required: [id, formCode, status]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        formCode: { $ref: '#/components/schemas/DossierFormCode' }
        status: { $ref: '#/components/schemas/DossierFormStatus' }
    DossierMeetingSummary:
      description: Hội nghị rút gọn cho danh sách.
      type: object
      required: [id, meetingType, orgUnit, period, scheduledAt, status]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        title: { type: string, description: 'Tên hiển thị do máy chủ ghép từ loại, kỳ và tập thể (suy luận).' }
        meetingType: { $ref: '#/components/schemas/DossierMeetingType' }
        orgUnit: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        scheduledAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        status: { $ref: '#/components/schemas/DossierMeetingStatus' }
        myRole:
          $ref: '#/components/schemas/DossierMeetingRole'
          description: Vai trò của người gọi trong hội nghị; rỗng khi người gọi chỉ xem theo quyền đơn vị.
    DossierMeeting:
      description: Hội nghị kiểm điểm (`dossier.review_meeting`) như SCR-1101 hiển thị.
      allOf:
        - $ref: '#/components/schemas/DossierMeetingSummary'
        - type: object
          required: [chair, secretary, deadlineCheck, rowVersion]
          properties:
            location: { type: string, maxLength: 500, description: 'Địa điểm (SCR-1101 trường 2; TL-03 chưa có cột, suy luận).' }
            meetingAt:
              type: [string, 'null']
              format: date-time
              description: Thời điểm họp thực tế (`meeting_at`).
            subjectPerson:
              description: Người được kiểm điểm khi hội nghị dành cho một người (`subject_person_id`).
              oneOf:
                - $ref: '../common/common.yaml#/components/schemas/Ref'
                - type: 'null'
            chair: { $ref: '../common/common.yaml#/components/schemas/Ref' }
            secretary: { $ref: '../common/common.yaml#/components/schemas/Ref' }
            draftSentAt:
              type: [string, 'null']
              format: date-time
              description: Thời điểm gửi dự thảo (`draft_sent_at`).
            deadlineCheck: { $ref: '#/components/schemas/DossierDeadlineCheck' }
            participants:
              type: array
              items: { $ref: '#/components/schemas/DossierMeetingParticipant' }
            draftForms:
              type: array
              description: Dự thảo biểu mẫu của người được kiểm điểm.
              items: { $ref: '#/components/schemas/DossierFormSummary' }
            proposedLevel:
              $ref: '../common/common.yaml#/components/schemas/RatingLevel'
              description: Mức đề xuất của hệ thống, hiển thị cạnh biểu quyết (vùng 4).
            vote:
              oneOf:
                - $ref: '#/components/schemas/DossierVote'
                - type: 'null'
            minutesSha256:
              oneOf:
                - $ref: '#/components/schemas/DossierSha256'
                - type: 'null'
            signRequestId:
              description: Yêu cầu ký biên bản (`sign_request_id`).
              oneOf:
                - $ref: '../common/common.yaml#/components/schemas/Uuid'
                - type: 'null'
            commentsLocked: { type: boolean, description: 'Góp ý đã khoá sau khi chủ trì kết thúc hội nghị.' }
            rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - *meetingEx
    DossierMeetingPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DossierMeetingSummary' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    DossierMeetingCreate:
      type: object
      required: [periodId, orgUnitId, meetingType, scheduledAt, chairPersonId, secretaryPersonId]
      properties:
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        orgUnitId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        meetingType: { $ref: '#/components/schemas/DossierMeetingType' }
        scheduledAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        location: { type: string, maxLength: 500 }
        chairPersonId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        secretaryPersonId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        subjectPersonId:
          $ref: '../common/common.yaml#/components/schemas/Uuid'
          description: Bỏ trống khi hội nghị kiểm điểm tập thể.
        participantPersonIds:
          type: array
          maxItems: 200
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    DossierMeetingUpdate:
      description: Các trường sửa được trước khi họp; trường không gửi giữ nguyên (JSON Merge Patch).
      type: object
      minProperties: 1
      properties:
        scheduledAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        location: { type: string, maxLength: 500 }
        participantPersonIds:
          type: array
          maxItems: 200
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        deadlineOverrideReason:
          type: string
          minLength: 10
          maxLength: 2000
          description: Lý do giữ ngày họp khi thời hạn không đạt (chỉ chủ trì ghi).
    DossierAttendance:
      type: object
      required: [personId, attendance]
      properties:
        personId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        attendance:
          type: string
          enum: [CO_MAT, VANG_CO_LY_DO]
          description: Điểm danh (suy luận, cùng tập giá trị với `DossierParticipantStatus`).
    DossierMinutesRequest:
      type: object
      required: [attendance, vote]
      properties:
        meetingAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        attendance:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '#/components/schemas/DossierAttendance' }
        vote: { $ref: '#/components/schemas/DossierVote' }

    # ------------------------------------------------------------ Góp ý
    DossierComment:
      description: Góp ý kiểm điểm (`dossier.review_comment`). Nội dung là C2.
      type: object
      required: [id, meetingId, subjectPersonId, kind, phase, content, createdAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        meetingId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        subjectPersonId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        commenter:
          description: Người góp ý; `null` khi tenant bật ẩn danh và người xem là người được kiểm điểm (BR-11-06).
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Ref'
            - type: 'null'
        source: { $ref: '#/components/schemas/DossierCommentSource' }
        kind: { $ref: '#/components/schemas/DossierCommentKind' }
        phase: { $ref: '#/components/schemas/DossierCommentPhase' }
        content:
          type: string
          maxLength: 4000
          description: Nội dung góp ý (giải mã từ `comment_enc`).
          x-classification: C2
        createdAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
      examples:
        - *commentEx
    DossierCommentPage:
      type: object
      required: [items, nextCursor]
      properties:
        anonymous: { type: boolean, description: 'Tenant bật chế độ ẩn danh người góp ý.' }
        items:
          type: array
          items: { $ref: '#/components/schemas/DossierComment' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    DossierCommentCreate:
      type: object
      required: [subjectPersonId, kind, phase, content]
      properties:
        subjectPersonId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        kind: { $ref: '#/components/schemas/DossierCommentKind' }
        phase: { $ref: '#/components/schemas/DossierCommentPhase' }
        content:
          type: string
          minLength: 1
          maxLength: 4000
          x-classification: C2

    # ------------------------------------------------------------ Khắc phục
    DossierRemediationItem:
      description: Hạn chế cần khắc phục (`dossier.remediation_item`).
      type: object
      required: [id, person, meetingId, content, status, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        person: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        meetingId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        reviewCommentId:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
            - type: 'null'
        sourcePeriod: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        duePeriodId:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
            - type: 'null'
        content:
          type: string
          maxLength: 4000
          description: Nội dung hạn chế và yêu cầu khắc phục (giải mã từ `content_enc`).
          x-classification: C2
        status: { $ref: '#/components/schemas/DossierRemediationStatus' }
        verifiedBy:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Ref'
            - type: 'null'
        verifiedAt:
          type: [string, 'null']
          format: date-time
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - *remediationEx
    DossierRemediationItemPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DossierRemediationItem' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    DossierRemediationItemUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/DossierRemediationStatus' }
        note: { type: string, maxLength: 2000, description: 'Ghi chú xác nhận (suy luận).', x-classification: C2 }

    # ------------------------------------------------------------ Gói hồ sơ
    DossierPackageFormCounts:
      description: Tiến độ sinh và ký tệp của gói, ví dụ "104/106 tệp xong".
      type: object
      required: [total, rendered, failed]
      properties:
        total: { type: integer, minimum: 0 }
        rendered: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        signed: { type: integer, minimum: 0 }
    DossierCentralTransfer:
      description: Thẻ chuyển hồ sơ diện TW (SCR-1102 vùng 4).
      type: object
      required: [profileCount, transferStatus]
      properties:
        profileCount: { type: integer, minimum: 0 }
        destination:
          oneOf:
            - $ref: '#/components/schemas/DossierTransferDestination'
            - type: 'null'
        transferStatus:
          type: string
          enum: [CHUA_GUI, DANG_GUI, DA_GUI, LOI]
          description: Trạng thái gửi gói con (suy luận; trạng thái chi tiết nằm ở `integ` của SVC-13).
    DossierPackage:
      description: >-
        Gói hồ sơ số (`dossier.dossier_package`). Hợp đồng theo TL-02b: một gói cho mỗi đơn vị, kỳ và loại gói; `person`
        chỉ có khi gói thuộc một cá nhân (TL-03 khai `person_id`).
      type: object
      required: [id, code, packageKind, period, status, formCounts, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, pattern: '^DP-\d{4}-[QN]-\d{4}$', examples: ['DP-2026-N-0142'] }
        packageKind: { $ref: '#/components/schemas/DossierPackageKind' }
        period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        orgUnit: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        person:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Ref'
            - type: 'null'
        status: { $ref: '#/components/schemas/DossierPackageStatus' }
        deadline:
          type: [string, 'null']
          format: date
          description: Hạn nộp cấp trên (`deadline`).
        submittedAt:
          type: [string, 'null']
          format: date-time
        versionNo: { type: integer, minimum: 1, description: 'Phiên bản gói, tăng khi lập lại sau mở lại kỳ (suy luận).' }
        formCounts: { $ref: '#/components/schemas/DossierPackageFormCounts' }
        profileCount: { type: integer, minimum: 0 }
        manifestHash:
          oneOf:
            - $ref: '#/components/schemas/DossierSha256'
            - type: 'null'
        packageSha256:
          oneOf:
            - $ref: '#/components/schemas/DossierSha256'
            - type: 'null'
        central: { $ref: '#/components/schemas/DossierCentralTransfer' }
        transferredTo:
          oneOf:
            - $ref: '#/components/schemas/DossierTransferDestination'
            - type: 'null'
        signRequestId:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
            - type: 'null'
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - *packageEx
    DossierPackagePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DossierPackage' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    DossierPackageCreate:
      type: object
      required: [periodId, orgUnitId, packageKind]
      properties:
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        orgUnitId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        packageKind: { $ref: '#/components/schemas/DossierPackageKind' }
        deadline: { $ref: '../common/common.yaml#/components/schemas/Date' }
    DossierChecklistItem:
      type: object
      required: [code, label, status]
      properties:
        code:
          type: string
          description: Mã mục kiểm tra (suy luận), ví dụ `HO_SO_DA_KY_SO`, `MA_BAM_KHOP`, `CA_NHAN_DA_KY`, `MAU_3_DA_KY`, `KHONG_KHIEU_NAI_MO`.
        label: { type: string }
        status:
          type: string
          enum: [DAT, CANH_BAO]
          description: Đạt hoặc cảnh báo (SCR-1102 trường 4; mã suy luận).
        count: { type: integer, minimum: 0, description: 'Số mục chưa đạt nếu có.' }
    DossierPackageChecklist:
      description: Danh sách kiểm tra trước khi ký gói (BR-11-09).
      type: object
      required: [passed, items]
      properties:
        passed: { type: boolean }
        evaluatedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        items:
          type: array
          items: { $ref: '#/components/schemas/DossierChecklistItem' }
    DossierRegenerateRequest:
      type: object
      properties:
        formIds:
          type: array
          maxItems: 200
          description: Chỉ sinh lại các biểu mẫu lỗi này; bỏ trống là mọi biểu mẫu `LOI` của gói.
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    DossierTransferRequest:
      type: object
      required: [destination]
      properties:
        destination: { $ref: '#/components/schemas/DossierTransferDestination' }
        profileIds:
          type: array
          maxItems: 200
          description: Hồ sơ diện TW cần gửi; bỏ trống là mọi hồ sơ diện TW của gói.
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    DossierPackageSignRequest:
      type: object
      properties:
        provider: { $ref: '#/components/schemas/EsignProvider' }
        certificateId:
          $ref: '../common/common.yaml#/components/schemas/Uuid'
          description: Chứng thư chọn để ký (`esign.certificate_ref.id`); bỏ trống dùng chứng thư mặc định của người ký.
    DossierSignJob:
      description: Job ký gói kèm mã yêu cầu ký ở SVC-10.
      allOf:
        - $ref: '../common/common.yaml#/components/schemas/Job'
        - type: object
          required: [signRequestId]
          properties:
            signRequestId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }

    # ------------------------------------------------------------ Biểu mẫu
    DossierForm:
      description: Biểu mẫu đã hoặc đang sinh (`dossier.form_instance` kết hợp `docgen.render_job`).
      type: object
      required: [id, formCode, profileId, templateVersion, status]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        formCode: { $ref: '#/components/schemas/DossierFormCode' }
        packageId:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
            - type: 'null'
        profileId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        subjectPerson: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        templateVersion: { type: string, maxLength: 32, description: 'Phiên bản mẫu, in thành tem chân trang (BR-11-03).' }
        status: { $ref: '#/components/schemas/DossierFormStatus' }
        renderStatus: { $ref: '#/components/schemas/DocgenRenderStatus' }
        renderError:
          type: [string, 'null']
          maxLength: 2000
          description: Lỗi sinh (`docgen.render_job.error`), dùng cho MSG-11-07.
        format: { type: string, examples: ['PDF/A-2b'], description: 'Định dạng tệp và chuẩn PDF/A.' }
        draft: { type: boolean, description: 'Bản nháp có dấu "Bản nháp" (suy luận).' }
        dataSnapshotHash: { $ref: '#/components/schemas/DossierSha256' }
        pdfSha256:
          oneOf:
            - $ref: '#/components/schemas/DossierSha256'
            - type: 'null'
        signedAt:
          type: [string, 'null']
          format: date-time
      examples:
        - *formEx
    DossierFormPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/DossierForm' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    DossierRenderJobRequest:
      type: object
      required: [packageId]
      properties:
        packageId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        formCodes:
          type: array
          description: Chỉ sinh các mẫu này; bỏ trống là đủ danh mục theo Policy Pack.
          items: { $ref: '#/components/schemas/DossierFormCode' }
    DossierDraftFormsRequest:
      type: object
      required: [formCode, periodId, profileIds]
      properties:
        formCode: { $ref: '#/components/schemas/DossierFormCode' }
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        profileIds:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    DossierFormPreviewRequest:
      type: object
      required: [formCode, sourceModule, sourceRefId]
      properties:
        formCode:
          type: string
          description: >-
            Mã biểu mẫu hoặc mã mẫu văn bản ở `docgen.template`, ví dụ `MAU_1B`; văn bản trả lời khiếu nại dùng mã mẫu của
            Policy Pack (suy luận).
          maxLength: 16
        sourceModule:
          type: string
          enum: [appraisal, oversight, dossier]
          description: Module sở hữu bản ghi nguồn.
        sourceRefId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }

    # ------------------------------------------------------------ Trường hợp đặc thù
    DossierSpecialCase:
      description: Trường hợp đặc thù PL 6 (`dossier.special_case`).
      type: object
      required: [id, person, caseCode, legalRef, detectedBy, effect]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        person: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        caseCode:
          type: string
          maxLength: 32
          description: Mã trường hợp theo danh mục 13 trường hợp của Policy Pack, ví dụ `DIEU_DONG_DUOI_2_THANG`.
        legalRef: { type: string, maxLength: 100, examples: ['PL 6 §1'] }
        handling: { type: string, description: 'Cách xử lý theo Policy Pack.' }
        detectedBy: { $ref: '#/components/schemas/DossierSpecialCaseDetectedBy' }
        effect: { $ref: '#/components/schemas/DossierSpecialCaseEffect' }
        effectiveFrom:
          type: [string, 'null']
          format: date
        effectiveTo:
          type: [string, 'null']
          format: date
        detail:
          type: [string, 'null']
          description: Chi tiết (giải mã từ `detail_enc`); chỉ trả ở đọc một đối tượng.
          x-classification: C2
        confirmedBy:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Ref'
            - type: 'null'
        confirmedAt:
          type: [string, 'null']
          format: date-time
      examples:
        - *specialCaseEx
    DossierSpecialCaseGroup:
      type: object
      required: [legalRef, caseCode, count]
      properties:
        legalRef: { type: string }
        caseCode: { type: string }
        handling: { type: string }
        count: { type: integer, minimum: 0 }
    DossierSpecialCasePage:
      type: object
      required: [items, nextCursor]
      properties:
        groups:
          type: array
          description: Gom nhóm theo mục PL 6 kèm số hồ sơ.
          items: { $ref: '#/components/schemas/DossierSpecialCaseGroup' }
        items:
          type: array
          items: { $ref: '#/components/schemas/DossierSpecialCase' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }

    # ------------------------------------------------------------ Ký số
    EsignCertificate:
      description: Chứng thư đã dùng hoặc đã đăng ký (`esign.certificate_ref`); chỉ phần công khai.
      type: object
      required: [id, subjectDn, issuerDn, serialNo, notBefore, notAfter]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        certSha256: { $ref: '#/components/schemas/DossierSha256' }
        subjectDn: { type: string, maxLength: 512 }
        issuerDn: { type: string, maxLength: 512 }
        serialNo: { type: string, maxLength: 64 }
        notBefore: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        notAfter: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        lastOcspStatus:
          type: [string, 'null']
          description: Kết quả OCSP gần nhất (`last_ocsp_status`), ví dụ GOOD, REVOKED, UNKNOWN.
        lastOcspAt:
          type: [string, 'null']
          format: date-time
    EsignRequest:
      description: Yêu cầu ký (`esign.sign_request`) kèm tiến độ các tài liệu (`esign.sign_item`).
      type: object
      required: [id, purpose, sourceModule, sourceRefId, provider, isBatch, status, expiresAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        purpose: { $ref: '#/components/schemas/EsignPurpose' }
        sourceModule: { type: string, maxLength: 32, examples: ['dossier'], description: 'Module của bản ghi yêu cầu ký.' }
        sourceRefId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        provider: { $ref: '#/components/schemas/EsignProvider' }
        isBatch: { type: boolean }
        status: { $ref: '#/components/schemas/EsignRequestStatus' }
        expiresAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        completedAt:
          type: [string, 'null']
          format: date-time
        itemCount: { type: integer, minimum: 0, description: 'Tổng số tài liệu.' }
        signedCount: { type: integer, minimum: 0, description: 'Số tài liệu đã ký (tiến độ ký lô).' }
        signatureFormat: { $ref: '#/components/schemas/EsignSignatureFormat' }
        certificate:
          oneOf:
            - $ref: '#/components/schemas/EsignCertificate'
            - type: 'null'
        problem: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
      examples:
        - *esignReqEx
    EsignRequestPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/EsignRequest' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    EsignRequestCreate:
      type: object
      required: [purpose, sourceModule, sourceRefId]
      properties:
        purpose: { $ref: '#/components/schemas/EsignPurpose' }
        sourceModule:
          type: string
          maxLength: 32
          enum: [task, appraisal, dossier, oversight, policy]
          description: >-
            Module sở hữu bản ghi cần ký (giá trị suy luận theo tên module baseline; TL-03 để `source_module` tự do).
        sourceRefId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        provider: { $ref: '#/components/schemas/EsignProvider' }
        certificateId:
          $ref: '../common/common.yaml#/components/schemas/Uuid'
          description: Chứng thư chọn để ký; bỏ trống dùng chứng thư mặc định.
    DossierFormDraftContentInput:
      description: Nội dung tự nhận xét dự thảo bản kiểm điểm trước khi gửi thành viên góp ý (QT-11 bước 4).
      type: object
      required: [sections, commitmentConfirmed]
      properties:
        sections:
          type: object
          additionalProperties: { type: string, maxLength: 10000 }
          description: Nội dung từng mục tự kiểm điểm theo mẫu biểu mẫu.
        selfRating: { type: string, enum: [HTXSNV, HTTNV, HTNV, KHTNV] }
        commitmentConfirmed: { type: boolean }
    DossierSpecialCaseUpdate:
      description: Xác minh và ghi cách xử lý trường hợp đặc thù PL 6 (BR-11-05, `dossier.special_case`).
      type: object
      required: [verified]
      properties:
        verified: { type: boolean }
        caseCode: { type: string, maxLength: 32 }
        detail: { type: object, additionalProperties: true }
        handlingNote: { type: string, maxLength: 2000 }
    EsignCertificateCreateInput:
      description: Đăng ký chứng thư số cá nhân/tổ chức cho người gọi (`esign.certificate_ref`).
      type: object
      required: [provider, serialNumber, subjectDn, issuerDn, validFrom, validTo]
      properties:
        provider: { $ref: '#/components/schemas/EsignProvider' }
        serialNumber: { type: string, minLength: 1, maxLength: 128 }
        subjectDn: { type: string, minLength: 1, maxLength: 500 }
        issuerDn: { type: string, minLength: 1, maxLength: 500 }
        validFrom: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        validTo: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        isDefault: { type: boolean, default: false }

paths:
  # ---------------------------------------------------------------- Hội nghị kiểm điểm
  /dossiers/meetings:
    get:
      tags: [Hội nghị kiểm điểm]
      operationId: listDossierMeetings
      summary: Danh sách hội nghị kiểm điểm trong phạm vi người gọi
      description: >-
        Trả các hội nghị mà người gọi là thành phần (chủ trì, thư ký, thành viên, người được kiểm điểm) hoặc thuộc
        đơn vị người gọi chuẩn bị (cơ quan tổ chức). Đường vào "Hồ sơ số › Kiểm điểm" của SCR-1101 (suy luận:
        bảng chức năng SCR-1101 không ghi API danh sách).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - $ref: '../common/common.yaml#/components/parameters/UnitId'
        - name: status
          in: query
          description: Lọc theo trạng thái hội nghị.
          schema: { $ref: '#/components/schemas/DossierMeetingStatus' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang hội nghị.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierMeetingPage' }
              examples:
                trang-dau:
                  value:
                    items:
                      - id: 0192a3f4-1101-7000-8000-000000000001
                        meetingType: KIEM_DIEM_NAM
                        title: Hội nghị kiểm điểm cuối năm 2026 của Chi bộ Ban Tổ chức
                        orgUnit: { id: 0192a3f4-0001-7000-8000-000000000010, name: Chi bộ Ban Tổ chức }
                        period: { id: 0192a3f4-0002-7000-8000-000000002026, label: Năm 2026, startDate: '2026-01-01', endDate: '2026-12-31' }
                        scheduledAt: '2027-01-14T08:00:00+07:00'
                        status: DA_GUI_DU_THAO
                        myRole: THANH_VIEN
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1101]
        owner: MOD-06
        roles: [leader, manager, member, appraiser]
        scope: Gn
        source: TL-02b SCR-1101 (suy luận); ma trận dòng API dossiers
    post:
      tags: [Hội nghị kiểm điểm]
      operationId: createDossierMeeting
      summary: Tạo hội nghị kiểm điểm
      description: >-
        Bước 1 của QT-11: cơ quan tổ chức lập kế hoạch kiểm điểm với đối tượng, chủ trì, thư ký, thành phần, ngày giờ
        và địa điểm. Hội nghị bắt đầu ở `DU_KIEN`. Khi tạo, MOD-06 chạy phát hiện trường hợp đặc thù (bước 2) và yêu cầu
        SVC-11 sinh dự thảo Mẫu 1A đến 1D cho đối tượng (bước 3, EVT-17 khi xong).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierMeetingCreate' }
            examples:
              kiem-diem-nam:
                value:
                  periodId: 0192a3f4-0002-7000-8000-000000002026
                  orgUnitId: 0192a3f4-0001-7000-8000-000000000010
                  meetingType: KIEM_DIEM_NAM
                  scheduledAt: '2027-01-14T08:00:00+07:00'
                  location: Phòng họp tầng 3, trụ sở Ban Tổ chức
                  chairPersonId: 0192a3f4-0003-7000-8000-000000000101
                  secretaryPersonId: 0192a3f4-0003-7000-8000-000000000102
                  subjectPersonId: 0192a3f4-0003-7000-8000-000000000103
                  participantPersonIds:
                    - 0192a3f4-0003-7000-8000-000000000104
                    - 0192a3f4-0003-7000-8000-000000000105
      responses:
        '201':
          description: Đã tạo hội nghị.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierMeeting' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409':
          description: >-
            Kỳ đã khoá với thao tác lập kế hoạch hoặc đã có hội nghị cùng loại cho đối tượng trong kỳ
            (`DOSSIER-409-PERIOD-LOCKED`, `DOSSIER-409-MEETING-EXISTS`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422':
          description: >-
            Dữ liệu không hợp lệ, ví dụ chủ trì trùng thư ký hoặc người ngoài đơn vị (`DOSSIER-422-VALIDATION`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1101]
        owner: MOD-06
        evt: [EVT-17]
        roles: [appraiser]
        scope: Đv
        source: TL-01 PL C (`org_officer`); TL-02b QT-11 bước 1–3; ma trận SCR-1101.tao (AC-07 suy luận)

  /dossiers/meetings/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Hội nghị kiểm điểm]
      operationId: getDossierMeeting
      summary: Chi tiết hội nghị kiểm điểm
      description: >-
        Dữ liệu ba cột của SCR-1101: thẻ kiểm tra thời hạn gửi dự thảo (vùng 1), thành phần và trạng thái từng người,
        dự thảo biểu mẫu, kết quả biểu quyết so với mức đề xuất của hệ thống (vùng 4). Danh sách góp ý và hạn chế kỳ trước
        đọc ở hai đường dẫn con.
      responses:
        '200':
          description: Hội nghị.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierMeeting' }
              examples:
                dang-hop:
                  $ref: '#/components/examples/DossierMeetingExample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1101]
        owner: MOD-06
        roles: [leader, manager, member, appraiser]
        scope: Gn
        source: TL-02b SCR-1101 bảng trường 1–5, 9 (đường dẫn suy luận)
    patch:
      tags: [Hội nghị kiểm điểm]
      operationId: updateDossierMeeting
      summary: Sửa kế hoạch hội nghị (dời ngày, địa điểm, thành phần, lý do giữ ngày)
      description: >-
        Dùng khi kiểm tra thời hạn không đạt (MSG-11-01): cơ quan tổ chức dời ngày hội nghị, hoặc chủ trì ghi lý do được
        cấp uỷ chấp thuận để giữ nguyên ngày (lý do in vào biên bản, BR-11-01). Chỉ sửa được khi hội nghị ở `DU_KIEN`
        hoặc `DA_GUI_DU_THAO`. Thao tác này là suy luận từ mục "Ngoại lệ và xử lý" của QT-11; bảng chức năng SCR-1101
        không ghi API.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierMeetingUpdate' }
            examples:
              giu-ngay:
                value:
                  deadlineOverrideReason: Cấp uỷ thống nhất giữ ngày họp do lịch công tác của đoàn kiểm tra cấp trên.
      responses:
        '200':
          description: Hội nghị sau khi sửa; thời hạn được tính lại.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierMeeting' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            Xung đột phiên bản (`DOSSIER-409-VERSION-CONFLICT`) hoặc hội nghị đã họp (`DOSSIER-409-MEETING-HELD`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1101]
        owner: MOD-06
        roles: [leader, appraiser]
        scope: Gn
        rules: [BR-11-01]
        source: TL-02b QT-11 Ngoại lệ và xử lý (suy luận)

  /dossiers/meetings/{id}/send-draft:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Hội nghị kiểm điểm]
      operationId: sendDossierMeetingDraft
      summary: Gửi dự thảo bản kiểm điểm tới thành viên
      description: >-
        Bước 4–5 của QT-11. Người được kiểm điểm gửi dự thảo đã hoàn thiện; máy chủ ghi `draftSentAt`, gửi thông báo mời
        góp ý (MSG-11-02, EVT-21) và đếm số ngày làm việc trọn vẹn giữa thời điểm gửi và ngày hội nghị theo
        `config.holiday_calendar` và tham số `kiem_diem.cach_dem_ngay`. Thời hạn không đạt không làm hỏng thao tác:
        phản hồi 200 mang `deadlineCheck.passed = false` và `msg = MSG-11-01` để giao diện cảnh báo (BR-11-01).
        Hội nghị chuyển `DA_GUI_DU_THAO`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      responses:
        '200':
          description: Đã gửi dự thảo; kèm kết quả kiểm tra thời hạn.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierMeeting' }
              examples:
                dat-thoi-han:
                  $ref: '#/components/examples/DossierMeetingExample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403':
          description: Người gọi không phải người được kiểm điểm của hội nghị (`DOSSIER-403-NOT-SUBJECT`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            Xung đột phiên bản (`DOSSIER-409-VERSION-CONFLICT`) hoặc hội nghị không còn ở `DU_KIEN`
            (`DOSSIER-409-INVALID-STATE`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1101]
        owner: MOD-06
        evt: [EVT-21]
        roles: [member]
        scope: B
        rules: [BR-11-01]
        source: TL-02b SCR-1101 "Gửi dự thảo"; ma trận SCR-1101.gui-du-thao

  /dossiers/meetings/{id}/comments:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Góp ý kiểm điểm]
      operationId: listDossierMeetingComments
      summary: Danh sách góp ý của hội nghị
      description: >-
        Vùng 2 của SCR-1101: góp ý trước hội nghị và ý kiến thư ký ghi tại hội nghị, phân loại ưu điểm, hạn chế, kiến nghị.
        Nội dung là C2, máy chủ giải mã theo quyền và ghi nhật ký truy cập. Khi tenant bật chế độ ẩn danh, OPA lọc trường
        `commenter` với người được kiểm điểm (BR-11-06).
      parameters:
        - name: phase
          in: query
          description: Lọc theo giai đoạn góp ý.
          schema: { $ref: '#/components/schemas/DossierCommentPhase' }
        - name: kind
          in: query
          description: Lọc theo loại nội dung.
          schema: { $ref: '#/components/schemas/DossierCommentKind' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang góp ý.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierCommentPage' }
              examples:
                co-an-danh:
                  value:
                    anonymous: false
                    items:
                      - *commentEx
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1101]
        owner: MOD-06
        roles: [leader, manager, member, appraiser]
        scope: Gn
        rules: [BR-11-06]
        source: TL-02b SCR-1101 vùng 2, bảng trường 6–7 (đường dẫn đọc suy luận)
    post:
      tags: [Góp ý kiểm điểm]
      operationId: createDossierMeetingComment
      summary: Gửi góp ý hoặc ghi ý kiến tại hội nghị
      description: >-
        Bước 6–7 của QT-11. Thành viên gửi góp ý trước hoặc trong hội nghị (`phase = TRUOC_HOI_NGHI`); chỉ thư ký được ghi
        ý kiến tại hội nghị (`phase = HOI_NGHI`). Nội dung C2 được mã hoá trường ở máy chủ (`comment_enc`, `dek_id`).
        Không nhận góp ý sau khi chủ trì kết thúc hội nghị.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierCommentCreate' }
            examples:
              han-che:
                value:
                  subjectPersonId: 0192a3f4-0003-7000-8000-000000000103
                  kind: HAN_CHE
                  phase: TRUOC_HOI_NGHI
                  content: Việc tham mưu rà soát quy hoạch cán bộ quý III còn chậm so với kế hoạch khoảng hai tuần.
      responses:
        '201':
          description: Đã lưu góp ý.
          headers:
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierComment' }
              examples:
                da-luu:
                  $ref: '#/components/examples/DossierCommentExample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403':
          description: >-
            Người gọi không phải thành phần hội nghị, hoặc ghi `phase = HOI_NGHI` mà không phải thư ký
            (`DOSSIER-403-NOT-PARTICIPANT`, `DOSSIER-403-NOT-SECRETARY`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: Hội nghị đã kết thúc, góp ý đã khoá (`DOSSIER-409-COMMENTS-LOCKED`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1101]
        owner: MOD-06
        roles: [leader, manager, member, appraiser]
        scope: Gn
        rules: [BR-11-06]
        source: TL-02b SCR-1101 "Gửi góp ý"; TL-01 PL C; ma trận SCR-1101.gop-y, SCR-1101.thu-ky

  /dossiers/meetings/{id}/minutes:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Hội nghị kiểm điểm]
      operationId: createDossierMeetingMinutes
      summary: Ghi biểu quyết và sinh biên bản hội nghị
      description: >-
        Bước 7–8 của QT-11. Thư ký gửi kết quả điểm danh và biểu quyết; máy chủ ghi `vote_json`, `participants_json`,
        chuyển hội nghị `DA_HOP` và yêu cầu SVC-11 sinh biên bản (trả 202). Khi EVT-17 đến, hội nghị chuyển
        `DA_LAP_BIEN_BAN`. Biểu quyết không thay mức quyết định của cấp có thẩm quyền (BR-11-07). Lý do giữ ngày họp
        (nếu có) được in vào biên bản. Theo TL-01 PL C, thao tác này cần phiên AAL2.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierMinutesRequest' }
            examples:
              bieu-quyet:
                value:
                  meetingAt: '2027-01-14T08:05:00+07:00'
                  attendance:
                    - { personId: 0192a3f4-0003-7000-8000-000000000104, attendance: CO_MAT }
                    - { personId: 0192a3f4-0003-7000-8000-000000000105, attendance: VANG_CO_LY_DO }
                  vote: { HTXSNV: 1, HTTNV: 5, HTNV: 0, KHTNV: 0 }
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403':
          description: Người gọi không phải thư ký hội nghị (`DOSSIER-403-NOT-SECRETARY`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            Xung đột phiên bản (`DOSSIER-409-VERSION-CONFLICT`) hoặc hội nghị chưa gửi dự thảo hay đã kết thúc
            (`DOSSIER-409-INVALID-STATE`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422':
          description: Tổng số phiếu biểu quyết vượt số người có mặt (`DOSSIER-422-VOTE-EXCEEDS-ATTENDEES`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1101]
        owner: MOD-06
        evt: [EVT-17]
        roles: [member, appraiser]
        scope: Gn
        aal: 2
        rules: [BR-11-07]
        source: TL-02b SCR-1101 "Sinh biên bản" (202); TL-01 PL C (thư ký, AAL2); ma trận SCR-1101.thu-ky

  /dossiers/meetings/{id}/close:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Hội nghị kiểm điểm]
      operationId: closeDossierMeeting
      summary: Kết thúc hội nghị và yêu cầu ký biên bản
      description: >-
        Chủ trì kết thúc hội nghị: khoá góp ý, tạo `dossier.remediation_item` từ các góp ý loại `HAN_CHE` (bước 9,
        BR-11-08), và khi biên bản đã sinh thì tạo yêu cầu ký biên bản (mục đích `BIEN_BAN`) cho chủ trì và thư ký.
        Phản hồi kèm MSG-11-03. Hội nghị chuyển `DA_KY` khi nhận đủ EVT-18 của hai chữ ký; EVT-11 phát cho hồ sơ
        liên quan theo TL-02b.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      responses:
        '200':
          description: Đã kết thúc hội nghị.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierMeeting' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403':
          description: Người gọi không phải chủ trì hội nghị (`DOSSIER-403-NOT-CHAIR`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            Xung đột phiên bản (`DOSSIER-409-VERSION-CONFLICT`) hoặc chưa có biểu quyết (`DOSSIER-409-NO-VOTE`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1101]
        owner: MOD-06
        evt: [EVT-11, EVT-18]
        roles: [leader]
        scope: Gn
        rules: [BR-11-08]
        source: TL-02b SCR-1101 "Kết thúc hội nghị"; ma trận SCR-1101.ket-thuc (AC-04 suy luận)

  # ---------------------------------------------------------------- Khắc phục hạn chế
  /dossiers/meetings/{id}/remediation-items:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Khắc phục hạn chế]
      operationId: listDossierMeetingRemediationItems
      summary: Hạn chế kỳ trước và hạn chế phát sinh của hội nghị
      description: >-
        Vùng 3 của SCR-1101: các hạn chế của người được kiểm điểm từ biên bản các kỳ trước kèm trạng thái khắc phục,
        cùng hạn chế do hội nghị này tạo. Nội dung là C2 (`content_enc`). Đường dẫn là suy luận.
      parameters:
        - name: origin
          in: query
          description: '`KY_TRUOC` chỉ lấy hạn chế từ kỳ trước, `HOI_NGHI_NAY` chỉ lấy hạn chế do hội nghị này tạo (suy luận).'
          schema: { type: string, enum: [KY_TRUOC, HOI_NGHI_NAY] }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang hạn chế.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierRemediationItemPage' }
              examples:
                ky-truoc:
                  value:
                    items:
                      - *remediationEx
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1101]
        owner: MOD-06
        roles: [leader, manager, member, appraiser]
        scope: Gn
        rules: [BR-11-08]
        source: TL-02b SCR-1101 vùng 3, bảng trường 8; TL-03 dossier.remediation_item

  /dossiers/remediation-items/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    patch:
      tags: [Khắc phục hạn chế]
      operationId: updateDossierRemediationItem
      summary: Cập nhật trạng thái khắc phục một hạn chế
      description: >-
        Thư ký cập nhật trạng thái khắc phục hạn chế kỳ trước (SCR-1101 bảng trường 8: "Thư ký cập nhật trạng thái").
        Chuyển sang `DA_KHAC_PHUC` hoặc `CHUA_KHAC_PHUC` ghi `verified_by`, `verified_at`. Đường dẫn là suy luận vì bảng
        chức năng SCR-1101 không ghi API.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierRemediationItemUpdate' }
            examples:
              da-khac-phuc:
                value: { status: DA_KHAC_PHUC }
      responses:
        '200':
          description: Hạn chế sau khi cập nhật.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierRemediationItem' }
              examples:
                da-cap-nhat:
                  $ref: '#/components/examples/DossierRemediationItemExample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1101]
        owner: MOD-06
        roles: [member, appraiser]
        scope: Gn
        rules: [BR-11-08]
        source: TL-02b SCR-1101 bảng trường 8 (suy luận); TL-03 dossier.remediation_item

  # ---------------------------------------------------------------- Gói hồ sơ số
  /dossiers/packages:
    get:
      tags: [Gói hồ sơ số]
      operationId: listDossierPackages
      summary: Danh sách gói hồ sơ số
      description: Đường vào "Hồ sơ số › Gói hồ sơ số" của SCR-1102 (đường dẫn suy luận).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - $ref: '../common/common.yaml#/components/parameters/UnitId'
        - name: kind
          in: query
          description: Loại gói.
          schema: { $ref: '#/components/schemas/DossierPackageKind' }
        - name: status
          in: query
          description: Trạng thái gói.
          schema: { $ref: '#/components/schemas/DossierPackageStatus' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang gói hồ sơ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierPackagePage' }
              examples:
                trang-dau:
                  value:
                    items:
                      - *packageEx
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1102]
        owner: MOD-06
        roles: [appraiser, decider]
        scope: Đv
        source: TL-02b SCR-1102 (suy luận); ma trận SCR-1102.chuan-bi
    post:
      tags: [Gói hồ sơ số]
      operationId: createDossierPackage
      summary: Lập gói hồ sơ quý, năm hoặc diện Trung ương
      description: >-
        Đóng gói hồ sơ cho một đơn vị và kỳ (TL-01 PL C "Đóng gói hồ sơ quý, năm"). Thông thường MOD-06 tự lập gói ở
        `DANG_LAP` khi nhận EVT-12; thao tác này cho cơ quan tổ chức lập thủ công khi gói chưa có (ví dụ sau mở lại kỳ,
        gói phiên bản mới). Mỗi đơn vị, kỳ và loại gói chỉ có một gói đang hiệu lực.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierPackageCreate' }
            examples:
              goi-nam:
                value:
                  periodId: 0192a3f4-0002-7000-8000-000000002026
                  orgUnitId: 0192a3f4-0001-7000-8000-000000000010
                  packageKind: NAM
                  deadline: '2027-02-01'
      responses:
        '201':
          description: Đã lập gói ở `DANG_LAP`.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierPackage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409':
          description: >-
            Đã có gói hiệu lực cho đơn vị, kỳ và loại gói (`DOSSIER-409-PACKAGE-EXISTS`), hoặc kỳ chưa có quyết định
            xếp loại (`DOSSIER-409-PERIOD-NOT-DECIDED`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1102]
        owner: MOD-06
        roles: [appraiser]
        scope: Đv
        source: TL-01 PL C `POST /dossiers/{id}/packages` (ánh xạ sang `/dossiers/packages`); TL-02b QT-11 trạng thái gói

  /dossiers/packages/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Gói hồ sơ số]
      operationId: getDossierPackage
      summary: Chi tiết gói hồ sơ số
      description: >-
        Phần đầu trang và vùng 1, 4, 5 của SCR-1102: mã gói, hạn nộp, tiến độ sinh tệp, thẻ chuyển hồ sơ diện TW, thẻ ký
        số gói (người ký, nhà cung cấp, mã băm manifest). Danh sách biểu mẫu, trường hợp đặc thù và danh sách kiểm tra
        đọc ở các đường dẫn riêng.
      responses:
        '200':
          description: Gói hồ sơ.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierPackage' }
              examples:
                cho-ky:
                  $ref: '#/components/examples/DossierPackageExample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1102]
        owner: MOD-06
        roles: [appraiser, decider]
        scope: Đv
        source: TL-02b SCR-1102 bảng trường 1, 5–7 (đường dẫn suy luận)

  /dossiers/packages/{id}/forms:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Biểu mẫu]
      operationId: listDossierPackageForms
      summary: Danh sách biểu mẫu sinh từ dữ liệu của gói
      description: >-
        Vùng 1 của SCR-1102: mỗi dòng là một biểu mẫu (Mẫu 1A đến 1D, 2, 3, bảng chấm điểm), đối tượng, trạng thái sinh và
        ký, định dạng PDF/A-2b kèm tem phiên bản. Đường dẫn là suy luận.
      parameters:
        - name: status
          in: query
          description: Lọc theo trạng thái biểu mẫu, ví dụ `LOI` để xem tệp sinh lỗi.
          schema: { $ref: '#/components/schemas/DossierFormStatus' }
        - name: formCode
          in: query
          description: Lọc theo mã mẫu.
          schema: { $ref: '#/components/schemas/DossierFormCode' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang biểu mẫu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierFormPage' }
              examples:
                trang-dau:
                  value:
                    items:
                      - *formEx
                    nextCursor: 'eyJpZCI6IjAxOTJhM2Y0In0'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1102]
        owner: MOD-06
        roles: [appraiser, decider]
        scope: Đv
        source: TL-02b SCR-1102 bảng trường 2; TL-03 dossier.form_instance, docgen.render_job

  /dossiers/packages/{id}/checklist:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Gói hồ sơ số]
      operationId: getDossierPackageChecklist
      summary: Danh sách kiểm tra trước khi ký gói
      description: >-
        Vùng 3 của SCR-1102, tính tức thời theo BR-11-09: mọi hồ sơ `DA_KY_SO`, mã băm từng tệp khớp manifest, các cá nhân
        đã ký bản kiểm điểm, Mẫu 3 đã ký, không còn khiếu nại mở. Nút "Ký số gói và nộp" chỉ bật khi `passed = true`.
        Đường dẫn là suy luận.
      responses:
        '200':
          description: Kết quả danh sách kiểm tra.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DossierPackageChecklist' }
              examples:
                con-canh-bao:
                  value:
                    passed: false
                    evaluatedAt: '2027-01-25T10:00:00+07:00'
                    items:
                      - { code: HO_SO_DA_KY_SO, label: 48/48 hồ sơ đã ký số, status: DAT }
                      - { code: MA_BAM_KHOP, label: Mã băm từng tệp khớp manifest, status: DAT }
                      - { code: CA_NHAN_DA_KY, label: Mẫu 1C còn 2 người chưa ký, status: CANH_BAO, count: 2 }
                      - { code: MAU_3_DA_KY, label: Mẫu 3 chờ Trưởng ban ký, status: CANH_BAO, count: 1 }
                      - { code: KHONG_KHIEU_NAI_MO, label: Không còn khiếu nại mở, status: DAT }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1102]
        owner: MOD-06
        roles: [appraiser, decider]
        scope: Đv
        rules: [BR-11-09]
        source: TL-02b SCR-1102 vùng 3, bảng trường 4 (đường dẫn suy luận)

  /dossiers/packages/{id}/regenerate:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Biểu mẫu]
      operationId: regenerateDossierPackageForms
      summary: Sinh lại các biểu mẫu lỗi của gói
      description: >-
        Gửi lại các render job ở `LOI`, giữ các tệp đã sinh (QT-11 Ngoại lệ). Gói chuyển `DANG_SINH`; khi EVT-17 của tệp
        cuối đến, gói chuyển `CHO_KY`, nếu vẫn có tệp lỗi thì quay về `DANG_LAP` và giao diện hiện MSG-11-07.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierRegenerateRequest' }
            examples:
              tat-ca-tep-loi:
                value: {}
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            Xung đột phiên bản (`DOSSIER-409-VERSION-CONFLICT`), không có tệp lỗi (`DOSSIER-409-NO-FAILED-FORMS`) hoặc gói
            đã ký, đã nộp bị khoá (`DOSSIER-409-PACKAGE-LOCKED`, BR-11-10).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1102]
        owner: MOD-06
        evt: [EVT-17]
        roles: [appraiser]
        scope: Đv
        rules: [BR-11-02, BR-11-10]
        source: TL-02b SCR-1102 "Sinh lại mẫu lỗi" (202); ma trận SCR-1102.chuan-bi

  /dossiers/packages/{id}/export:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Gói hồ sơ số]
      operationId: exportDossierPackage
      summary: Tạo tệp ZIP của gói kèm manifest có chữ ký
      description: >-
        Tạo tệp ZIP gồm các tệp PDF/A và manifest JSON (băm SHA-256 từng tệp, chữ ký gói khi đã ký). Chỉ cho gói từ
        `CHO_KY` trở đi. Kết quả tải ở `resultLocation` của job khi `HOAN_TAT`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: Gói chưa tới `CHO_KY` (`DOSSIER-409-PACKAGE-NOT-READY`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1102]
        owner: MOD-06
        roles: [appraiser, decider]
        scope: Đv
        source: TL-02b SCR-1102 "Tải gói (ZIP và manifest)" (202); ma trận SCR-1102.tai-goi

  /dossiers/packages/{id}/transfers:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Gói hồ sơ số]
      operationId: createDossierPackageTransfer
      summary: Gửi gói con hồ sơ diện Trung ương quản lý
      description: >-
        Bước 14 của QT-11 (BR-11-11): tách gói con cho hồ sơ diện TW quản lý, mã hoá theo chứng thư bên nhận và gửi
        EdXML qua integration-gateway (SVC-13). Chỉ khi gói đã ký và có hồ sơ diện TW. Gửi thất bại thì SVC-13 thử lại
        theo lịch và thông báo MSG-11-06; gói chính vẫn nộp bình thường.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DossierTransferRequest' }
            examples:
              btc-tw:
                value: { destination: BTC_TW }
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            Gói chưa ký (`DOSSIER-409-PACKAGE-NOT-SIGNED`) hoặc không có hồ sơ diện TW (`DOSSIER-409-NO-CENTRAL-PROFILES`).
          content:
            application/problem+json:
