        packageKind: NAM
        period: { id: 0192a3f4-0002-7000-8000-000000002026, label: Năm 2026, startDate: '2026-01-01', endDate: '2026-12-31' }
        orgUnit: { id: 0192a3f4-0001-7000-8000-000000000010, name: Ban Tổ chức Tỉnh uỷ }
        status: CHO_KY
        deadline: '2027-02-01'
        versionNo: 1
        formCounts: { total: 106, rendered: 106, failed: 0, signed: 104 }
        profileCount: 48
