      description: >-
        Danh sách yêu cầu ký mà người gọi là người ký, ví dụ biên bản chờ chủ trì và thư ký ký, bản kiểm điểm chờ cá nhân
        ký (QT-11 bước 11). Đường dẫn là suy luận.
      parameters:
        - name: status
          in: query
          description: Lọc theo trạng thái yêu cầu ký.
          schema: { $ref: '#/components/schemas/EsignRequestStatus' }
        - name: purpose
          in: query
          description: Lọc theo mốc pháp lý.
          schema: { $ref: '#/components/schemas/EsignPurpose' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang yêu cầu ký.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EsignRequestPage' }
              examples:
                cho-xac-nhan:
                  value:
                    items:
                      - *esignReqEx
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-11]
        scr: [SCR-1101, SCR-1102]
        owner: SVC-10
        roles: [leader, member, appraiser, decider, second_approver]
        scope: B
        source: TL-03 esign.sign_request (đường dẫn suy luận)
    post:
      tags: [Ký số]
      operationId: createEsignRequest
      summary: Mở yêu cầu ký số từ xa
      description: >-
        Tạo yêu cầu ký tại một mốc pháp lý cho chính người gọi (chủ thể ký) và đẩy sang nhà cung cấp (MySign, Viettel-CA,
        CA chuyên dùng Chính phủ, Ban Cơ yếu). Client chỉ gửi bản ghi nghiệp vụ nguồn; danh sách tài liệu và băm do máy
        chủ lấy từ module nguồn, client không bao giờ gửi băm để ký. Ký từ xa là bất đồng bộ: phản hồi 202 trả yêu cầu ở
        `CHO_XAC_NHAN` với `expiresAt` (thường 120 giây, MSG-04-09); giao diện theo dõi bằng `GET /esign/requests/{id}`
        hoặc SSE, và EVT-18 phát khi hoàn tất. Cần phiên AAL2 với `auth_time` không quá 5 phút. Hợp nhất `POST
        /esign/sessions` của TL-01 PL C.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EsignRequestCreate' }
            examples:
              ky-bien-ban:
                value:
                  purpose: BIEN_BAN
                  sourceModule: dossier
                  sourceRefId: 0192a3f4-1101-7000-8000-000000000001
                  provider: MYSIGN
      responses:
        '202':
          description: Đã tạo yêu cầu ký, đang chờ người ký xác nhận trên thiết bị.
          headers:
            Location:
              description: Đường dẫn theo dõi yêu cầu ký `/api/v1/esign/requests/{id}`.
              schema: { type: string, format: uri-reference, examples: ['/api/v1/esign/requests/0192a3f4-1810-7000-8000-000000000001'] }
            Retry-After: { $ref: '../common/common.yaml#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EsignRequest' }
              examples:
                cho-xac-nhan:
                  $ref: '#/components/examples/EsignRequestExample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403':
          description: >-
            Người gọi không phải chủ thể ký của bản ghi nguồn hoặc vi phạm tách vai trò (`ESIGN-403-NOT-SIGNER`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            Bản ghi nguồn chưa sẵn sàng để ký, ví dụ biên bản chưa sinh (`ESIGN-409-SOURCE-NOT-READY`), hoặc đã có yêu cầu
            ký đang chờ cho cùng bản ghi và người ký (`ESIGN-409-REQUEST-PENDING`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422':
          description: Chứng thư hết hạn, bị thu hồi hoặc nhà cung cấp chưa cấu hình (`ESIGN-422-CERTIFICATE-INVALID`, `ESIGN-422-PROVIDER-UNAVAILABLE`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '503': { $ref: '../common/common.yaml#/components/responses/ServiceUnavailable' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04, QT-09, QT-11, QT-12, QT-13, QT-15]
        scr: [SCR-0403, SCR-0901, SCR-0902, SCR-0904, SCR-1101, SCR-1102, SCR-1202, SCR-1301, SCR-1503]
        owner: SVC-10
        evt: [EVT-18]
        roles: [leader, member, appraiser, decider, second_approver]
        scope: B
        aal: 2
        source: TL-02b SCR-1102, SCR-0901; TL-02a SCR-0403 (`/esign/requests`); TL-01 PL C `POST /esign/sessions`; ma trận dòng API esign

  /esign/requests/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Ký số]
      operationId: getEsignRequest
      summary: Trạng thái yêu cầu ký
      description: >-
        Trạng thái yêu cầu ký và tiến độ ký lô (đã ký / tổng). Giao diện thăm dò tối đa tới `expiresAt` theo `Retry-After`
        (TL-01 chương 11: phiên chờ xác nhận tới 120 giây qua polling), hoặc nghe SSE. Hợp nhất `GET /esign/sessions/{id}`
        của TL-01 PL C.
      responses:
        '200':
          description: Yêu cầu ký.
          headers:
            Retry-After: { $ref: '../common/common.yaml#/components/headers/RetryAfter' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EsignRequest' }
              examples:
                da-ky:
                  value:
                    id: 0192a3f4-1810-7000-8000-000000000001
                    purpose: GOI_HO_SO
                    sourceModule: dossier
                    sourceRefId: 0192a3f4-1102-7000-8000-000000000142
                    provider: VIETTEL_CA
                    isBatch: false
                    status: DA_KY
                    expiresAt: '2027-01-30T09:02:00+07:00'
                    completedAt: '2027-01-30T09:00:41+07:00'
                    itemCount: 1
                    signedCount: 1
                    certificate:
                      id: 0192a3f4-1811-7000-8000-000000000001
                      subjectDn: CN=Ngô Thanh Tâm, O=Ban Tổ chức Tỉnh uỷ
                      issuerDn: CN=Viettel-CA SHA-256
                      serialNo: 5404FFFEB7033FB316D672201B7BA4FE
                      notBefore: '2026-03-01T00:00:00+07:00'
                      notAfter: '2028-03-01T00:00:00+07:00'
                      lastOcspStatus: GOOD
                      lastOcspAt: '2027-01-30T09:00:40+07:00'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04, QT-09, QT-11, QT-12, QT-13, QT-15]
        scr: [SCR-0403, SCR-0901, SCR-0902, SCR-0904, SCR-1101, SCR-1102, SCR-1202, SCR-1301, SCR-1503]
        owner: SVC-10
        roles: [leader, member, appraiser, decider, second_approver]
        scope: B
        source: TL-01 PL C `GET /esign/sessions/{id}`; TL-02b SCR-0904 bảng trường 8; TL-03 esign.sign_request

  /esign/certificates/mine:
    get:
      tags: [Ký số]
      operationId: listMyEsignCertificates
      summary: Chứng thư ký số của người gọi
      description: >-
        Chứng thư đã đăng ký của người gọi kèm hiệu lực và kết quả kiểm tra thu hồi gần nhất, để hiển thị "Người ký, nhà
        cung cấp" (SCR-1102 trường 6, SCR-0904 trường 7) và chặn ký khi chứng thư hết hạn. Đường dẫn là suy luận.
      responses:
        '200':
          description: Danh sách chứng thư.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/EsignCertificate' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-09, QT-11]
        scr: [SCR-0904, SCR-1102]
        owner: SVC-10
        roles: [leader, member, appraiser, decider, second_approver]
        scope: B
        source: TL-02b SCR-1102 bảng trường 6, SCR-0904 bảng trường 7; TL-03 esign.certificate_ref (đường dẫn suy luận)
    post:
      tags: [Ký số]
      operationId: registerMyEsignCertificate
      summary: Đăng ký chứng thư số cho người gọi
      description: >-
        Đăng ký chứng thư số (`esign.certificate_ref`) để dùng khi ký số biểu mẫu, gói hồ sơ hoặc quyết định (SVC-10).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EsignCertificateCreateInput' }
      responses:
        '201':
          description: Chứng thư số đã đăng ký.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EsignCertificate' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-09, QT-11]
        scr: [SCR-0904, SCR-1102]
        owner: SVC-10
        roles: [leader, member, appraiser, decider, second_approver]
        scope: B
        aal: 2
        source: 'TL-01 SVC-10; TL-03 esign.certificate_ref (suy luận đường dẫn)'

  /esign/certificates/mine/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    delete:
      tags: [Ký số]
      operationId: deleteMyEsignCertificate
      summary: Gỡ chứng thư số đã đăng ký của người gọi
      description: >-
        Gỡ chứng thư số không còn sử dụng khỏi danh sách chứng thư của người gọi (`esign.certificate_ref`).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Đã gỡ chứng thư số.
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-09, QT-11]
        scr: [SCR-0904, SCR-1102]
        owner: SVC-10
        roles: [leader, member, appraiser, decider, second_approver]
        scope: B
        aal: 2
        source: 'TL-01 SVC-10; TL-03 esign.certificate_ref (suy luận đường dẫn)'
