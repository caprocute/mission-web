                    status: 409
                    code: DOSSIER-409-CHECKLIST-NOT-PASSED
                    msg: MSG-11-04
                    detail: 'Chưa thể ký gói: 2 mục kiểm tra chưa đạt. Xem chi tiết ở danh sách kiểm tra.'
                    traceId: 4bf92f3577b34da6a3ce929d0e0e4736
        '422':
          description: Chứng thư của người ký hết hạn hoặc bị thu hồi (`ESIGN-422-CERTIFICATE-INVALID`).
