        `GOI_HO_SO` ở SVC-10 cho người gọi và trả 202 kèm `signRequestId`. Giao diện theo dõi yêu cầu ký bằng
        `GET /esign/requests/{id}` (chờ xác nhận trên ứng dụng ký từ xa). Khi EVT-18 đến, chữ ký được gắn dấu thời gian
        RFC 3161, gói chuyển `DA_KY` rồi `DA_NOP`, bị khoá (BR-11-10) và ghi sổ cái; giao diện hiện MSG-11-05.
      parameters:
