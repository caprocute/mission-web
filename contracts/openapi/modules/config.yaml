        - color:
            brand:
              primary: { $type: color, $value: '#0A7E8C' }
              on-primary: { $type: color, $value: '#FFFFFF' }
          radius:
            card: { $type: dimension, $value: 14px }
    SduiNode:
      description: >-
        Nút cây SDUI; `component` phải có trong registry (BR-18-02), `props` kiểm theo `propsSchema` của
        component, `visibleWhen` là biểu thức CEL chỉ đọc ngữ cảnh người dùng.
      type: object
      required: [component]
      properties:
        component: { type: string, maxLength: 64, pattern: '^[a-z][a-zA-Z0-9]*(\.[a-zA-Z0-9-]+)+$' }
        props:
          type: object
          additionalProperties: true
        visibleWhen: { type: string, maxLength: 500 }
