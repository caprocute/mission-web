      description: Bốn chỉ số đầu trang và tải theo cell của SCR-0101.
      type: object
      required: [activeTenants, tenantLimit, totalAccounts, accountLimit, onboardingTenants, cellCount]
      properties:
        activeTenants: { type: integer, minimum: 0, description: 'Số tenant `DANG_VAN_HANH`' }
        tenantLimit: { type: integer, description: 'Giới hạn thiết kế, 5.000' }
        totalAccounts: { type: integer, minimum: 0 }
        accountLimit:
          type: integer
          description: >-
            Giới hạn thiết kế về tài khoản (NFR-01), máy chủ trả theo cấu hình. Quy mô định cỡ đã chốt ngày
            19/10/2026 là 6,5 triệu tài khoản (AGENTS.md mục 1); baseline NFR-01 và TL-02a còn ghi 6 triệu.
        onboardingTenants: { type: integer, minimum: 0, description: 'Số tenant đang khởi tạo' }
        cellCount: { type: integer, minimum: 0 }
