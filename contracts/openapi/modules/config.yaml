          type: array
          description: Thứ trong tuần là ngày nghỉ, ISO 8601 (6 = thứ Bảy, 7 = Chủ nhật) (suy luận).
          items: { type: integer, minimum: 1, maximum: 7 }
        days:
          type: array
          description: Ngày đặc biệt trong năm.
          items:
            type: object
            required: [date, dayKind, name, scope]
            properties:
              date: { $ref: '../common/common.yaml#/components/schemas/Date' }
              dayKind: { $ref: '#/components/schemas/HolidayDayKind' }
              name: { type: string }
              scope: { $ref: '#/components/schemas/HolidayScope' }
        workingDaysByMonth:
          type: array
          description: Số ngày làm việc của 12 tháng (suy luận).
          minItems: 12
          maxItems: 12
          items: { type: integer, minimum: 0 }
      examples:
        - year: 2026
          weekendDays: [6, 7]
          days:
            - { date: '2026-09-02', dayKind: NGHI_LE, name: Quốc khánh, scope: QUOC_GIA }
            - { date: '2026-12-26', dayKind: LAM_BU, name: Làm bù cho ngày nghỉ 02/01/2027, scope: TENANT }
          workingDaysByMonth: [21, 15, 22, 21, 19, 22, 23, 21, 20, 22, 21, 23]

    # ------------------------------------------------------------ Cờ tính năng
    FeatureFlagRollout:
      description: Quy tắc bật dần (`config.feature_flag.rollout`).
      type: object
      properties:
        unitIds:
          type: array
          description: Chỉ bật cho các đơn vị này và cấp dưới; trống là toàn tenant.
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        percent: { type: integer, minimum: 0, maximum: 100, description: 'Tỷ lệ người dùng được bật' }
    FeatureFlag:
      type: object
      required: [flagKey, enabled, rowVersion]
      properties:
        flagKey: { type: string, maxLength: 100 }
        description: { type: string, readOnly: true, description: 'Mô tả cờ do nền tảng khai báo (suy luận)' }
        enabled: { type: boolean }
        rollout: { $ref: '#/components/schemas/FeatureFlagRollout' }
        validFrom: { type: ['string', 'null'], format: date-time }
        validTo: { type: ['string', 'null'], format: date-time }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - flagKey: ai.weeklySummary
          description: Khối "Tóm tắt tuần" do AI tạo trên trang chủ.
          enabled: true
          rollout: { unitIds: [], percent: 100 }
          validFrom: null
          validTo: null
          rowVersion: 2
    FeatureFlagInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        rollout: { $ref: '#/components/schemas/FeatureFlagRollout' }
        validFrom: { type: ['string', 'null'], format: date-time }
        validTo: { type: ['string', 'null'], format: date-time }
      examples:
        - enabled: false
    FeatureFlagPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeatureFlag' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }

    # ------------------------------------------------------------ Ngưỡng cảnh báo
    ConfigAnomalySignalCode:
      description: Tám dấu hiệu bất thường (`oversight.anomaly_alert.signal_code`).
      type: string
      enum: [TU_CHAM_CAO, CAO_BANG, MUC_TIEU_DE, MINH_CHUNG_TRUNG, CAP_NHAT_DON, SUA_SAU_KHOA, CHE_NHO, MIEN_TRU_LAP]
    AnomalySignalThreshold:
      description: Ngưỡng của một dấu hiệu; tham số theo từng dấu hiệu nên để dạng ánh xạ tên → số (suy luận).
      type: object
      required: [signalCode, enabled, params]
      properties:
        signalCode: { $ref: '#/components/schemas/ConfigAnomalySignalCode' }
        enabled: { type: boolean }
        params:
          type: object
          additionalProperties: { type: number }
          description: 'Ví dụ `{ "consecutiveQuarters": 3, "scoreGap": 5 }` cho dấu hiệu 1.'
    AnomalyThresholdSet:
      description: Phiên bản ngưỡng hiện hành của tenant (lưu trong `config.tenant_setting`).
      type: object
      required: [version, signals, rowVersion]
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: string }
        updatedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        updatedBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        signals:
          type: array
          minItems: 8
          maxItems: 8
          items: { $ref: '#/components/schemas/AnomalySignalThreshold' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - version: 3
          reason: Giảm ngưỡng dồn cập nhật cuối kỳ từ 70% xuống 60% theo kết quả quý III.
          updatedAt: '2026-10-05T14:20:00+07:00'
          updatedBy: { id: 0192f5d6-3c4d-7e5f-8a61-7b8c9d0e1f23, name: Lê Minh Châu }
          signals:
            - { signalCode: TU_CHAM_CAO, enabled: true, params: { consecutiveQuarters: 3, scoreGap: 5 } }
            - { signalCode: CAO_BANG, enabled: true, params: { sameLevelPercent: 90 } }
            - { signalCode: MUC_TIEU_DE, enabled: true, params: { earlyWeeks: 2, belowPreviousPercent: 20 } }
            - { signalCode: MINH_CHUNG_TRUNG, enabled: true, params: { ocrSimilarityPercent: 95 } }
            - { signalCode: CAP_NHAT_DON, enabled: true, params: { lastDaysPercent: 60, lastDays: 3 } }
            - { signalCode: SUA_SAU_KHOA, enabled: true, params: {} }
            - { signalCode: CHE_NHO, enabled: true, params: { taskIncreasePercent: 50 } }
            - { signalCode: MIEN_TRU_LAP, enabled: true, params: { exemptionsIn2Quarters: 3 } }
          rowVersion: 3
    AnomalyThresholdUpdate:
      type: object
      required: [signals, reason]
      properties:
        signals:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/AnomalySignalThreshold' }
        reason: { type: string, minLength: 20, maxLength: 2000, description: 'Lý do thay đổi (BR-14-09); độ dài tối thiểu là suy luận' }

    # ------------------------------------------------------------ Kỳ đánh giá
    PeriodKind:
      description: Loại kỳ (`config.period.kind`).
      type: string
      enum: [THANG, QUY, NAM, NAM_HOC]
    PeriodFlow:
      description: Luồng áp dụng của kỳ (`config.period.flow`); khác `Flow` vì có `CA_HAI`.
