          type: integer
          minimum: 0
          description: Số trung tâm dữ liệu chứa các cell, dòng phụ của thẻ Cell trên Hình 6.7 (suy luận tên trường).
        cellLoads:
          type: array
          items: { $ref: '#/components/schemas/CellLoad' }
        onboarding:
          type: array
          description: >-
            Mọi tenant đang khởi tạo của vùng (không phụ thuộc trang đang xem), để hiện MSG-01-02 "Tenant {tên}
            đang khởi tạo bước {n}/6".
          items:
            type: object
            required: [tenantId, name, step]
            properties:
              tenantId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
              name: { type: string }
              step: { type: integer, minimum: 1, maximum: 6 }
        pendingActions:
          type: array
          description: Danh sách việc cần xử lý của vùng điều phối toàn cục (SCR-0101 vùng 3, Hình 6.7).
          items: { $ref: '#/components/schemas/TenantPendingAction' }
