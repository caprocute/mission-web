        409 mã `PERIOD-409-SAGA-RUNNING`. Trả 202, job loại `PERIOD_LOCK`. Bước 1 phát EVT-09; bước 0
        không đạt làm job `THAT_BAI` với Problem mã `PERIOD-422-PRECONDITION` (MSG-08-02).
      x-mission:
        qt: [QT-08]
        scr: [SCR-0801]
        owner: MOD-08
