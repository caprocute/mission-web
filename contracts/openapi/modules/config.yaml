        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang phiên bản.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiPackVersionPage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    post:
      tags: [UI Pack]
      operationId: createUiPackVersion
      summary: Tạo phiên bản nháp UI Pack
      description: >-
        Tạo phiên bản `NHAP` bằng cách nhân bản phiên bản đang dùng hoặc từ bộ mặc định (QT-18 bước 1;
        TL-02 không ghi đường dẫn, suy luận theo quy ước).
      x-mission:
        qt: [QT-18]
        scr: [SCR-1801]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        source: TL-02b QT-18 bước 1 (suy luận)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UiPackVersionCreate' }
      responses:
        '201':
          description: Đã tạo phiên bản nháp.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiPackVersion' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /ui/packs/{id}/versions/{v}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
      - $ref: '#/components/parameters/UiPackVersionPath'
    get:
      tags: [UI Pack]
      operationId: getUiPackVersion
      summary: Chi tiết phiên bản UI Pack
      description: Trả token, bố cục, tài nguyên, cờ chế độ cao tuổi và trạng thái của một phiên bản.
      x-mission:
        qt: [QT-18]
        scr: [SCR-1801]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        source: TL-02b SCR-1801 bảng trường
      responses:
        '200':
          description: Phiên bản UI Pack.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiPackVersion' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    put:
      tags: [UI Pack]
      operationId: updateUiPackVersion
      summary: Lưu nháp UI Pack
      description: >-
        Lưu token, bố cục, tài nguyên và cờ của phiên bản `NHAP`. Máy chủ kiểm tra ngay: component lạ
        trả 422 mã `UI-422-UNKNOWN-COMPONENT` (MSG-18-02, BR-18-02); tương phản dưới AA trả 422 mã
        `UI-422-CONTRAST` (MSG-18-01, BR-18-01); quá 12 widget trên trang chủ trả 422. Phiên bản không
        còn `NHAP` trả 409 mã `UI-409-NOT-DRAFT`.
      x-mission:
        qt: [QT-18]
        scr: [SCR-1801]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        rules: [BR-18-01, BR-18-02, BR-18-03, BR-18-09]
        source: TL-02b SCR-1801 "Lưu nháp"; ma trận SCR-1801.soan
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UiPackVersionUpdate' }
      responses:
        '200':
          description: Đã lưu nháp.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiPackVersion' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

