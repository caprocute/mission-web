      examples:
        - componentKey: vt.widget.myTasksToday
          registryVersion: '2026.3'
          propsSchema: { type: object, additionalProperties: false, properties: { limit: { type: integer, maximum: 20 } } }
          allowedClassification: C1
          status: HIEU_LUC
          container: false
          mobile: true
          plugin: null
    UiComponentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UiComponent' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }

    # ------------------------------------------------------------ Biểu mẫu động
    UiFormStatus:
      description: Trạng thái biểu mẫu (`config.form_schema.status`).
      type: string
      enum: [NHAP, DA_PHAT_HANH, NGUNG]
    UiFormVersion:
      description: Một phiên bản biểu mẫu động (`config.form_schema`).
      type: object
      required: [formKey, version, status, schemaJson, uiJson, rowVersion]
      properties:
        formKey: { type: string, maxLength: 64 }
        version: { type: string, maxLength: 32 }
        status: { $ref: '#/components/schemas/UiFormStatus' }
        schemaJson:
          type: object
          additionalProperties: true
          description: JSON Schema 2020-12 của dữ liệu, có `x-cel` (quy tắc) và `x-classification` (C1, C2).
        uiJson:
          type: object
          additionalProperties: true
          description: Cấu hình trường Formly, điều kiện hiển thị CEL, thông báo lỗi.
        celRules:
          type: array
          items:
            type: object
            required: [field, expr, message]
            properties:
              field: { type: string, maxLength: 64 }
              expr: { type: string, maxLength: 1000 }
              message: { type: string, maxLength: 200 }
              serverOnly: { type: boolean, default: false }
        policyPack: { $ref: '#/components/schemas/PolicyPackVersionRef' }
        lastTestRun:
          oneOf:
            - { $ref: '#/components/schemas/UiFormTestRunResult' }
            - { type: 'null' }
        updatedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - formKey: phieu-vc-yte
          version: '12'
          status: NHAP
          schemaJson:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: object
            properties:
              ty_le_hsba_dat: { type: number, x-cel: 'self >= 0.0 && self <= 100.0', x-classification: C1 }
              mo_ta_su_co: { type: string, maxLength: 2000, x-classification: C2 }
          uiJson:
            mo_ta_su_co: { hideExpression: 'form.su_co_y_khoa != "CO"', label: Mô tả sự cố và biện pháp khắc phục }
          celRules:
            - { field: ty_le_hsba_dat, expr: 'self >= 0.0 && self <= 100.0', message: Giá trị phải từ 0 đến 100 }
          policyPack: { packVersionId: 0192e1c4-5d6e-7f80-9a1b-2c3d4e5f6a72, packCode: nn-335/so-y-te, version: '1.3' }
          lastTestRun: null
          updatedAt: '2026-10-19T09:30:00+07:00'
          rowVersion: 9
    UiFormVersionCreate:
      type: object
      required: [version]
      properties:
        version: { type: string, maxLength: 32 }
        cloneFromVersion: { type: ['string', 'null'], maxLength: 32 }
        policyPackVersionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
      examples:
        - version: '13'
          cloneFromVersion: '12'
    UiFormVersionUpdate:
      type: object
      required: [schemaJson, uiJson]
      properties:
        schemaJson:
          type: object
          additionalProperties: true
        uiJson:
          type: object
          additionalProperties: true
        celRules:
          type: array
          items:
            type: object
            required: [field, expr, message]
            properties:
              field: { type: string, maxLength: 64 }
              expr: { type: string, maxLength: 1000 }
              message: { type: string, maxLength: 200 }
              serverOnly: { type: boolean, default: false }
        policyPackVersionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    UiFormSummary:
      type: object
      required: [formKey, latestVersion, status]
      properties:
        formKey: { type: string }
        latestVersion: { type: string }
        status: { $ref: '#/components/schemas/UiFormStatus' }
        policyPack: { $ref: '#/components/schemas/PolicyPackVersionRef' }
        updatedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
      examples:
        - formKey: phieu-vc-yte
          latestVersion: '12'
          status: NHAP
          updatedAt: '2026-10-19T09:30:00+07:00'
    UiFormPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UiFormSummary' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    UiFormTestCaseInput:
      type: object
      required: [caseId, input, browserValid]
      properties:
        caseId: { type: string, maxLength: 64 }
        input:
          type: object
          additionalProperties: true
          description: Dữ liệu biểu mẫu mẫu (dữ liệu giả, không dữ liệu thật).
        browserValid: { type: boolean, description: 'Kết quả cel-js tại trình duyệt' }
        browserErrors:
          type: array
          items: { $ref: '../common/common.yaml#/components/schemas/FieldError' }
    UiFormTestRunRequest:
      type: object
      required: [cases]
      properties:
        cases:
          type: array
          minItems: 1
          maxItems: 500
          items: { $ref: '#/components/schemas/UiFormTestCaseInput' }
        renderMs50Fields: { type: number, minimum: 0, description: 'Thời gian dựng 50 trường đo ở trình duyệt (BR-18-08)' }
      examples:
        - cases:
            - caseId: TC-01
              input: { ty_le_hsba_dat: 104 }
              browserValid: false
              browserErrors: [{ field: ty_le_hsba_dat, message: Giá trị phải từ 0 đến 100 }]
          renderMs50Fields: 31
    UiFormTestRunResult:
      type: object
      required: [total, passed, parity, cases]
      properties:
        total: { type: integer, minimum: 0 }
        passed: { type: integer, minimum: 0 }
        parity: { type: boolean, description: 'Mọi ca cho cùng kết quả trên cel-js và cel-java (BR-18-05)' }
        renderMs50Fields: { type: ['number', 'null'] }
        cases:
          type: array
          items:
            type: object
            required: [caseId, serverValid, browserValid, match]
            properties:
              caseId: { type: string }
              serverValid: { type: boolean }
              browserValid: { type: boolean }
              match: { type: boolean }
              serverErrors:
                type: array
                items: { $ref: '../common/common.yaml#/components/schemas/FieldError' }
        ranAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
      examples:
        - total: 24
          passed: 24
          parity: true
          renderMs50Fields: 31
          cases:
            - { caseId: TC-01, serverValid: false, browserValid: false, match: true }
          ranAt: '2026-10-19T09:35:00+07:00'

    # ------------------------------------------------------------ Bố cục trang
    HomeLayout:
      description: Bố cục trang chủ đã phân giải cho người dùng hiện tại.
      type: object
      required: [uiPackVersion, registryVersion, layout]
      properties:
        uiPackVersion: { type: string }
        registryVersion: { type: string }
        mode: { type: string, enum: [default, elderly], description: 'Chế độ đang áp cho người dùng' }
        reducedSteps: { type: boolean, description: 'Cờ "ít bước" (NFR-11)' }
        layout: { $ref: '#/components/schemas/SduiNode' }
      examples:
        - uiPackVersion: 2.3.0
          registryVersion: '2026.3'
          mode: default
          reducedSteps: false
          layout:
            component: vt.layout.grid
            props: { columns: { xs: 1, md: 2, xl: 3 } }
            children:
              - { component: vt.widget.myTasksToday, props: { limit: 7 } }
              - { component: vt.widget.krCheckinDue }
              - { component: vt.widget.periodMilestones }
              - { component: vt.widget.weeklySummaryAi }
