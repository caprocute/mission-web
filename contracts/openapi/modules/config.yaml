  # ---------------------------------------------------------------- /ui/packs
  /ui/packs/current:
    get:
      tags: [UI Pack]
      operationId: getCurrentUiPack
      summary: UI Pack hiệu lực của tenant
      description: >-
        Trả phiên bản UI Pack `DA_PHAT_HANH` của tenant (siêu dữ liệu, token, chế độ cao tuổi, bố cục,
        biểu mẫu, plugin, i18n) kèm băm nội dung và chữ ký để shell kiểm trước khi áp. ETag theo phiên
        bản; gửi `If-None-Match` để nhận 304. Bản phát qua CDN (`/ui-packs/{tenant}/current.json`) có
        cùng nội dung; API này là nguồn dự phòng và cho ứng dụng di động.
      x-mission:
        qt: [QT-18, QT-00]
        scr: [SCR-0002, SCR-1801]
        owner: MOD-08
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: Tn
        source: TL-01 PL C; TL-01 chương 7 "Cấu trúc UI Pack", "Cơ chế bộ đệm"; ma trận dòng API ui
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: UI Pack hiện hành.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiPackRuntime' }
        '304':
          description: Phiên bản không đổi so với `If-None-Match`.
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /ui/packs:
    get:
      tags: [UI Pack]
      operationId: listUiPacks
      summary: Danh sách UI Pack của tenant
      description: Trả UI Pack của tenant kèm phiên bản đang phát hành và phiên bản nháp (suy luận, cần cho thẻ Phiên bản của SCR-1801).
      x-mission:
        qt: [QT-18]
        scr: [SCR-1801]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        source: TL-02b ma trận truy vết `/api/v1/ui/packs` (suy luận)
