      description: >-
        Đặt trạng thái và quy tắc bật dần của một cờ. Cờ do nền tảng khai báo sẵn cho mọi tenant (suy
        luận), nên thao tác luôn là cập nhật và cần `If-Match`; mã cờ lạ trả 404.
      x-mission:
        qt: [QT-18]
        scr: [SCR-1801]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        source: TL-01 PL C; TL-03 config.feature_flag
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeatureFlagInput' }
      responses:
        '200':
          description: Đã cập nhật cờ.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlag' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /config/anomaly-thresholds
  /config/anomaly-thresholds:
    get:
      tags: [Ngưỡng cảnh báo]
      operationId: getAnomalyThresholds
      summary: Ngưỡng phát hiện tám dấu hiệu bất thường
      description: Trả phiên bản ngưỡng hiện hành của tenant (suy luận, cần để màn hình "Ngưỡng phát hiện" đọc trước khi PUT).
      x-mission:
        qt: [QT-14]
        scr: [SCR-1401]
        owner: MOD-08
        roles: [policy_author]
        scope: Tn
        rules: [BR-14-01, BR-14-09]
        source: TL-02b SCR-1401 "Ngưỡng phát hiện" (suy luận)
      responses:
        '200':
          description: Bộ ngưỡng hiện hành.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnomalyThresholdSet' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    put:
      tags: [Ngưỡng cảnh báo]
      operationId: updateAnomalyThresholds
      summary: Lưu phiên bản ngưỡng mới
      description: >-
        Lưu phiên bản ngưỡng mới có lý do (BR-14-09); phiên bản cũ được giữ trong `config.tenant_setting`.
        Job phát hiện đêm (SVC-15) dùng phiên bản mới từ lần chạy kế tiếp.
      x-mission:
        qt: [QT-14]
        scr: [SCR-1401]
        owner: MOD-08
        roles: [policy_author]
        scope: Tn
        rules: [BR-14-01, BR-14-09]
        source: TL-02b SCR-1401; ma trận SCR-1401.nguong
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnomalyThresholdUpdate' }
      responses:
        '200':
          description: Đã lưu phiên bản ngưỡng mới.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnomalyThresholdSet' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /periods
  /periods:
    get:
      tags: [Kỳ đánh giá]
      operationId: listPeriods
      summary: Danh sách kỳ và trạng thái
      description: Trả các kỳ đánh giá của tenant theo năm, loại kỳ, luồng và trạng thái, mới nhất trước.
      x-mission:
        qt: [QT-08]
        scr: [SCR-0801, SCR-0002]
        owner: MOD-08
        roles: [tenant_admin, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: Tn
        source: TL-01 PL C; TL-02a SCR-0801; ma trận dòng API periods
      parameters:
        - $ref: '#/components/parameters/YearOptional'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/PeriodKind' }
        - name: flow
          in: query
          schema: { $ref: '#/components/schemas/PeriodFlow' }
        - name: status
          in: query
          schema: { $ref: '../common/common.yaml#/components/schemas/PeriodStatus' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang kỳ đánh giá.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodPage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    post:
      tags: [Kỳ đánh giá]
      operationId: createPeriod
      summary: Tạo kỳ đánh giá
      description: >-
        Tạo kỳ mới với lịch mốc mặc định theo Policy Pack và ghim phiên bản Policy Pack đang hiệu lực
        cho kỳ (BR-08-07). Kỳ chồng lấn cùng loại, cùng luồng trả 409 mã `PERIOD-409-OVERLAP`; lịch khoá
        muộn hơn tham số được trả kèm cảnh báo `warnings` (BR-08-12).
      x-mission:
        qt: [QT-08]
        scr: [SCR-0801]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        rules: [BR-08-07, BR-08-12]
        source: TL-02a SCR-0801 "Tạo kỳ"; ma trận SCR-0801.tao-ky
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeriodCreate' }
      responses:
        '201':
          description: Đã tạo kỳ.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Period' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /periods/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Kỳ đánh giá]
      operationId: getPeriod
      summary: Chi tiết kỳ đánh giá
      description: Trả kỳ, lịch mốc, Policy Pack ghim và lệnh khoá kỳ hiện hành (nếu có).
      x-mission:
        qt: [QT-08]
        scr: [SCR-0801]
        owner: MOD-08
        roles: [tenant_admin, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: Tn
        source: TL-02a SCR-0801 trường 1 đến 4
      responses:
        '200':
          description: Chi tiết kỳ.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Period' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /periods/{id}/lock-orders:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Khoá kỳ]
      operationId: createPeriodLockOrder
      summary: Lập lệnh khoá kỳ
      description: >-
        Lập lệnh khoá kỳ khi kỳ đang `MO` (hoặc `MO_LAI_HAU_KIEM`) và chưa có lệnh còn hiệu lực; lệnh
        vào `CHO_DUYET` và gửi lãnh đạo (AC-04) qua EVT-21. Đã có lệnh trả 409 mã `PERIOD-409-ORDER-EXISTS`.
      x-mission:
        qt: [QT-08]
        scr: [SCR-0801]
        owner: MOD-08
        evt: [EVT-21]
        roles: [tenant_admin]
        scope: Tn
        aal: 2
        rules: [BR-08-01]
        source: TL-02a SCR-0801 "Lập lệnh khoá kỳ"; ma trận SCR-0801.lap-lenh
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeriodLockOrderCreate' }
      responses:
        '201':
          description: Đã lập lệnh, chờ phê duyệt.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodLockOrder' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /periods/{id}/lock-orders/{oid}/approve:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
      - $ref: '#/components/parameters/LockOrderIdPath'
    post:
      tags: [Khoá kỳ]
      operationId: approvePeriodLockOrder
      summary: Phê duyệt lệnh khoá kỳ
      description: >-
        Lãnh đạo (AC-04) phê duyệt lệnh với MFA; người duyệt phải khác người lập (CHECK
        `approved_by <> requested_by`, mã `PERIOD-403-SAME-PERSON`). Lệnh chuyển `DA_DUYET` (MSG-08-01).
      x-mission:
        qt: [QT-08]
        scr: [SCR-0801]
        owner: MOD-08
        roles: [leader]
        scope: Tn
        aal: 2
        fourEyes: true
        rules: [BR-08-01, BR-08-02]
        source: TL-02a SCR-0801 "Phê duyệt lệnh"; ma trận SCR-0801.duyet-lenh
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeriodLockOrderApprove' }
      responses:
        '200':
          description: Lệnh đã được phê duyệt.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodLockOrder' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /periods/{id}/lock:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Khoá kỳ]
      operationId: getPeriodLockProgress
      summary: Tiến trình saga khoá kỳ
      description: >-
        Trả lệnh khoá kỳ, mã saga, khoá chống lặp, bốn chỉ số (số hồ sơ, đã tính, lỗi, dự kiến hoàn tất),
        sáu bước saga chiếu từ `config.period_lock_step`, đề nghị huỷ đang chờ và cảnh báo. Giao diện
        nhận cập nhật thời gian thực qua `/api/v1/notifications/stream` rồi đọc lại tài nguyên này.
        Kỳ chưa có saga trả 404.
      x-mission:
        qt: [QT-08]
        scr: [SCR-0801]
        owner: MOD-08
        roles: [tenant_admin, leader, second_approver, inspector]
        scope: Tn
