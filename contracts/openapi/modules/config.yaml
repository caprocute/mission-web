      required: [id, person, roleCode, orgUnit, scope, validFrom, validTo, status, sensitive, grantedBy, grantedAt, reason, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        person: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        personTitle: { type: ['string', 'null'], description: 'Chức danh của phân công chính' }
        roleCode: { $ref: '#/components/schemas/RoleCode' }
        orgUnit: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        scope: { $ref: '#/components/schemas/RoleBindingScope' }
        flow:
          description: Giới hạn theo luồng; `null` là cả hai luồng.
          oneOf:
            - { $ref: '../common/common.yaml#/components/schemas/Flow' }
            - { type: 'null' }
        validFrom: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        validTo: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        status: { $ref: '#/components/schemas/RoleBindingStatus' }
        sensitive: { type: boolean, description: 'Vai trò cần người duyệt thứ hai (`decider`, `second_approver`, `policy_author`)' }
        grantedBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        grantedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        reason: { type: string, maxLength: 500, description: 'Căn cứ cấp (quyết định, văn bản)' }
        approvedBy:
          oneOf:
            - { $ref: '../common/common.yaml#/components/schemas/Ref' }
            - { type: 'null' }
        approvedAt: { type: ['string', 'null'], format: date-time }
        endedBy:
          oneOf:
            - { $ref: '../common/common.yaml#/components/schemas/Ref' }
            - { type: 'null' }
        endedAt: { type: ['string', 'null'], format: date-time }
        endKind:
          oneOf:
            - { $ref: '#/components/schemas/AccessEndKind' }
            - { type: 'null' }
        endReason: { type: ['string', 'null'], maxLength: 500 }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - id: 0192f7a1-1111-7c3e-9a51-3f2d9c1b0a01
          person: { id: 0192f7a1-2222-7c3e-9a51-3f2d9c1b0a02, name: Lê Minh Châu }
          personTitle: Phó Trưởng ban
          roleCode: decider
          orgUnit: { id: 0192f7a1-3333-7c3e-9a51-3f2d9c1b0a03, name: Ban Tổ chức Tỉnh uỷ }
          scope: DON_VI_VA_CAP_DUOI
          flow: DANG
          validFrom: '2026-11-01T00:00:00+07:00'
          validTo: '2027-10-31T23:59:59+07:00'
          status: CHO_DUYET
          sensitive: true
          grantedBy: { id: 0192f7a1-4444-7c3e-9a51-3f2d9c1b0a04, name: Ngô Thị Lan }
          grantedAt: '2026-10-19T09:30:00+07:00'
          reason: Quyết định 152-QĐ/TU ngày 15/10/2026 giao quyết định xếp loại khối Đảng
