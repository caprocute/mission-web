        scr: [SCR-1801]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        source: TL-03 config.feature_flag; ma trận dòng API config (suy luận)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang cờ tính năng.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlagPage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/feature-flags/{key}:
    parameters:
      - $ref: '#/components/parameters/FlagKeyPath'
    put:
      tags: [Cờ tính năng]
      operationId: setFeatureFlag
      summary: Bật tắt tính năng theo tenant
      description: >-
        Đặt trạng thái và quy tắc bật dần của một cờ. Cờ do nền tảng khai báo sẵn cho mọi tenant (suy
        luận), nên thao tác luôn là cập nhật và cần `If-Match`; mã cờ lạ trả 404.
      x-mission:
        qt: [QT-18]
        scr: [SCR-1801]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        source: TL-01 PL C; TL-03 config.feature_flag
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FeatureFlagInput' }
      responses:
        '200':
          description: Đã cập nhật cờ.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FeatureFlag' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /config/anomaly-thresholds
  /config/anomaly-thresholds:
    get:
      tags: [Ngưỡng cảnh báo]
      operationId: getAnomalyThresholds
      summary: Ngưỡng phát hiện tám dấu hiệu bất thường
      description: Trả phiên bản ngưỡng hiện hành của tenant (suy luận, cần để màn hình "Ngưỡng phát hiện" đọc trước khi PUT).
      x-mission:
        qt: [QT-14]
        scr: [SCR-1401]
        owner: MOD-08
        roles: [policy_author]
        scope: Tn
        rules: [BR-14-01, BR-14-09]
        source: TL-02b SCR-1401 "Ngưỡng phát hiện" (suy luận)
      responses:
        '200':
          description: Bộ ngưỡng hiện hành.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnomalyThresholdSet' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    put:
      tags: [Ngưỡng cảnh báo]
      operationId: updateAnomalyThresholds
      summary: Lưu phiên bản ngưỡng mới
      description: >-
        Lưu phiên bản ngưỡng mới có lý do (BR-14-09); phiên bản cũ được giữ trong `config.tenant_setting`.
        Job phát hiện đêm (SVC-15) dùng phiên bản mới từ lần chạy kế tiếp.
      x-mission:
        qt: [QT-14]
        scr: [SCR-1401]
        owner: MOD-08
        roles: [policy_author]
        scope: Tn
        rules: [BR-14-01, BR-14-09]
        source: TL-02b SCR-1401; ma trận SCR-1401.nguong
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnomalyThresholdUpdate' }
      responses:
        '200':
          description: Đã lưu phiên bản ngưỡng mới.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnomalyThresholdSet' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /periods
  /periods:
    get:
      tags: [Kỳ đánh giá]
      operationId: listPeriods
      summary: Danh sách kỳ và trạng thái
      description: Trả các kỳ đánh giá của tenant theo năm, loại kỳ, luồng và trạng thái, mới nhất trước.
      x-mission:
        qt: [QT-08]
        scr: [SCR-0801, SCR-0002]
        owner: MOD-08
        roles: [tenant_admin, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: Tn
        source: TL-01 PL C; TL-02a SCR-0801; ma trận dòng API periods
      parameters:
        - $ref: '#/components/parameters/YearOptional'
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/PeriodKind' }
        - name: flow
          in: query
          schema: { $ref: '#/components/schemas/PeriodFlow' }
        - name: status
          in: query
          schema: { $ref: '../common/common.yaml#/components/schemas/PeriodStatus' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang kỳ đánh giá.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PeriodPage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    post:
      tags: [Kỳ đánh giá]
      operationId: createPeriod
      summary: Tạo kỳ đánh giá
      description: >-
        Tạo kỳ mới với lịch mốc mặc định theo Policy Pack và ghim phiên bản Policy Pack đang hiệu lực
        cho kỳ (BR-08-07). Kỳ chồng lấn cùng loại, cùng luồng trả 409 mã `PERIOD-409-OVERLAP`; lịch khoá
        muộn hơn tham số được trả kèm cảnh báo `warnings` (BR-08-12).
      x-mission:
        qt: [QT-08]
        scr: [SCR-0801]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        rules: [BR-08-07, BR-08-12]
        source: TL-02a SCR-0801 "Tạo kỳ"; ma trận SCR-0801.tao-ky
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PeriodCreate' }
