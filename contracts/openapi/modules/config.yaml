        - name: registry
          in: query
          description: Phiên bản registry, ví dụ `2026.3`.
          schema: { type: string, maxLength: 16 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/UiComponentStatus' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang component.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiComponentPage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /ui/forms
  /ui/forms:
    get:
      tags: [Biểu mẫu động]
      operationId: listUiForms
      summary: Danh sách biểu mẫu động
      description: Trả các biểu mẫu của tenant với phiên bản mới nhất và trạng thái (suy luận, cần để mở trình dựng).
      x-mission:
        qt: [QT-18]
        scr: [SCR-1802]
        owner: MOD-08
        roles: [tenant_admin, policy_author]
        scope: Tn
        source: TL-02b ma trận truy vết `/api/v1/ui/forms` (suy luận)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/Q'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang biểu mẫu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiFormPage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /ui/forms/{key}/versions:
    parameters:
      - $ref: '#/components/parameters/FormKeyPath'
    post:
      tags: [Biểu mẫu động]
      operationId: createUiFormVersion
      summary: Tạo phiên bản nháp biểu mẫu
      description: >-
        Tạo phiên bản `NHAP` mới của biểu mẫu (khoá mới thì tạo biểu mẫu mới), nhân bản từ phiên bản chỉ
        định hoặc trống (suy luận: TL-02b chỉ ghi PUT trên phiên bản đã có).
      x-mission:
        qt: [QT-18]
        scr: [SCR-1802]
        owner: MOD-08
        roles: [tenant_admin, policy_author]
        scope: Tn
        rules: [BR-18-06]
        source: TL-02b QT-18 bước 4 (suy luận)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UiFormVersionCreate' }
      responses:
        '201':
          description: Đã tạo phiên bản nháp.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiFormVersion' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /ui/forms/{key}/current:
    parameters:
      - $ref: '#/components/parameters/FormKeyPath'
    get:
      tags: [Biểu mẫu động]
      operationId: getCurrentUiForm
      summary: Biểu mẫu hiệu lực để dựng phiếu
      description: >-
        (suy luận) Trả phiên bản `DA_PHAT_HANH` đang áp dụng của biểu mẫu theo khoá cho người dùng nghiệp
        vụ, để `<vt-form>` dựng phiếu (ví dụ Mẫu 1B của SCR-0901). Máy chủ đã phân giải `schemaRef` của UI
        Pack sang JSON Schema dữ liệu của Policy Pack hiệu lực, nên `schemaJson` là lược đồ dữ liệu đầy đủ
        và `uiJson` là phần trình bày của UI Pack. Khi loader UI Pack (WEB-009) nạp được `forms` từ
        `GET /ui/packs/current`, thao tác này là nguồn dự phòng và cho ứng dụng di động. ETag theo phiên
        bản; gửi `If-None-Match` để nhận 304. Quy tắc CEL `serverOnly` vẫn chạy lại ở máy chủ khi lưu, nộp.
      x-mission:
        qt: [QT-18, QT-09]
        scr: [SCR-0901, SCR-1802]
        owner: MOD-08
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: Tn
        source: TL-01 chương 7 "Cấu trúc UI Pack" (biểu mẫu tham chiếu Policy Pack); TL-02b SCR-0901 (suy luận đường dẫn)
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Biểu mẫu hiệu lực.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiFormVersion' }
        '304':
          description: Phiên bản không đổi so với `If-None-Match`.
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /ui/forms/{key}/versions/{v}:
    parameters:
      - $ref: '#/components/parameters/FormKeyPath'
      - $ref: '#/components/parameters/FormVersionPath'
    get:
      tags: [Biểu mẫu động]
      operationId: getUiFormVersion
      summary: Chi tiết phiên bản biểu mẫu
      description: Trả JSON Schema có `x-cel`, `x-classification`, cấu hình Formly và quy tắc CEL của phiên bản.
      x-mission:
        qt: [QT-18]
        scr: [SCR-1802]
        owner: MOD-08
        roles: [tenant_admin, policy_author]
        scope: Tn
        source: TL-02b SCR-1802 bảng trường
      responses:
        '200':
          description: Phiên bản biểu mẫu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiFormVersion' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    put:
      tags: [Biểu mẫu động]
      operationId: updateUiFormVersion
      summary: Lưu nháp biểu mẫu
      description: >-
        Lưu schema và cấu hình hiển thị của phiên bản `NHAP`. Máy chủ kiểm tra biểu thức CEL bằng
        cel-java (mã `UI-422-CEL-INVALID`, MSG-18-06) và trường tính điểm theo Policy Pack (mã
        `UI-409-SCORED-FIELD`, MSG-18-07).
      x-mission:
        qt: [QT-18]
        scr: [SCR-1802]
        owner: MOD-08
        roles: [tenant_admin, policy_author]
        scope: Tn
        rules: [BR-18-04, BR-18-06, BR-18-11]
        source: TL-02b SCR-1802 "Lưu nháp"; ma trận SCR-1802.dung
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UiFormVersionUpdate' }
      responses:
        '200':
          description: Đã lưu nháp.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiFormVersion' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /ui/forms/{key}/versions/{v}/test-runs:
    parameters:
      - $ref: '#/components/parameters/FormKeyPath'
      - $ref: '#/components/parameters/FormVersionPath'
    post:
      tags: [Biểu mẫu động]
      operationId: runUiFormTests
      summary: Chạy bộ test biểu mẫu trên hai engine
      description: >-
        Chạy các ca test của biểu mẫu bằng cel-java tại máy chủ và so với kết quả cel-js trình duyệt gửi
        lên; ca cho kết quả khác nhau được đánh dấu (MSG-18-08, BR-18-05). Trả kết quả đồng bộ.
      x-mission:
        qt: [QT-18]
        scr: [SCR-1802]
        owner: MOD-08
        roles: [tenant_admin, policy_author]
        scope: Tn
        rules: [BR-18-04, BR-18-05, BR-18-08]
        source: TL-02b SCR-1802 "Chạy bộ test biểu mẫu"; ma trận SCR-1802.dung
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UiFormTestRunRequest' }
      responses:
        '200':
          description: Kết quả bộ test.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiFormTestRunResult' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /ui/layouts
  /ui/layouts/home:
    get:
      tags: [Bố cục trang]
      operationId: getHomeLayout
      summary: Bố cục trang chủ "Việc của tôi hôm nay"
      description: >-
        Trả cây SDUI của trang chủ từ UI Pack hiện hành, đã lọc theo vai trò trong ngữ cảnh phân công
        đang chọn (biểu thức `visibleWhen` được máy chủ đánh giá trước; trình duyệt chỉ đánh giá lại để
        phản hồi nhanh). Dữ liệu từng khối lấy từ API của module tương ứng.
      x-mission:
        qt: [QT-00]
        scr: [SCR-0002]
        owner: MOD-08
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        source: TL-02a SCR-0002 "Tải trang"; ma trận SCR-0002.xem
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Bố cục trang chủ.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeLayout' }
        '304':
          description: Bố cục không đổi so với `If-None-Match`.
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /ui/feature-flags (NEN-043)
  /ui/feature-flags:
    get:
      tags: [Cờ tính năng]
      operationId: getEffectiveFeatureFlags
      summary: Bản đồ cờ tính năng hiệu lực của người dùng hiện hành
      description: >-
        Tính tập cờ hiệu lực từ `config.feature_flag` theo tenant, đơn vị (`target_org_unit_ids`),
        vai trò (`target_roles`) và phần trăm triển khai tăng dần (`rollout_percent` băm ổn định theo
        `person_id`) để client web/di động kiểm tra mà không cần quyền `tenant_admin` (TL-04 OPS-04).
      x-mission:
        qt: [QT-00]
        scr: [SCR-0002]
        owner: MOD-08
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        source: 'TL-04 OPS-04; TL-03 config.feature_flag (suy luận đường dẫn)'
      responses:
        '200':
          description: Bản đồ `flagKey -> boolean`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EffectiveFeatureFlagMap' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /config/me (CNH-02, đề xuất CNH-01)
  /config/me/preferences:
    get:
      tags: [Tuỳ chọn cá nhân]
      operationId: getMyPreferences
      summary: Tuỳ chọn trình bày của người dùng đang đăng nhập
      description: >-
        Trả mọi khoá tuỳ chọn người dùng đã lưu (chế độ hiển thị, bố cục trang chủ, cột bảng, bảng
        điều khiển mặc định, kênh thông báo). Khoá chưa lưu không có trong `items`; máy khách dùng mặc
        định của UI Pack. ETag tính trên phiên bản mọi khoá nên `If-None-Match` khớp thì trả 304.
      x-mission:
        qt: [QT-00]
        scr: [SCR-0002, SCR-1803]
        owner: MOD-08
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        source: Đề xuất CNH-01 mục 4.1 (docs/de-xuat/de-xuat-ca-nhan-hoa.md), NFR-11
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Tuỳ chọn của người dùng.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferenceMap' }
        '304':
          description: Tuỳ chọn không đổi so với `If-None-Match`.
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/me/preferences/{prefKey}:
    parameters:
      - $ref: '#/components/parameters/PrefKeyPath'
    put:
      tags: [Tuỳ chọn cá nhân]
      operationId: putMyPreference
      summary: Lưu một khoá tuỳ chọn cá nhân
      description: >-
        Tạo hoặc thay giá trị một khoá. Giá trị kiểm theo lược đồ của khoá trong
        `contracts/schemas/user-preference.schema.json` và tối đa 16 KB; sai lược đồ trả 422. Khoá chưa
        có thì bỏ `If-Match` (trả 201); khoá đã có thì bắt buộc `If-Match`, lệch phiên bản trả 409 khi
        hai thiết bị cùng sửa.
      x-mission:
        qt: [QT-00]
        scr: [SCR-0002, SCR-1803]
        owner: MOD-08
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        source: Đề xuất CNH-01 mục 4.1; NFR-11
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatchWhenExists'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserPreferenceInput' }
      responses:
        '200':
          description: Đã cập nhật tuỳ chọn.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferenceItem' }
        '201':
          description: Đã lưu tuỳ chọn lần đầu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserPreferenceItem' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    delete:
      tags: [Tuỳ chọn cá nhân]
      operationId: deleteMyPreference
      summary: Khôi phục mặc định của một khoá tuỳ chọn
      description: Xoá lớp phủ cá nhân của khoá; giao diện trở về mặc định của UI Pack đơn vị.
      x-mission:
        qt: [QT-00]
        scr: [SCR-0002, SCR-1803]
        owner: MOD-08
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        source: Đề xuất CNH-01 mục 4.1
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      responses:
        '204':
          description: Đã xoá tuỳ chọn.
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/me/saved-filters:
    get:
      tags: [Tuỳ chọn cá nhân]
      operationId: listMySavedFilters
      summary: Bộ lọc đã lưu của người dùng trên một màn hình danh sách
      description: Tối đa 20 bộ lọc, bộ lọc mặc định đứng đầu rồi theo thứ tự hiển thị.
      x-mission:
        qt: [QT-00]
        scr: [SCR-0201, SCR-0301, SCR-0901, SCR-1001]
        owner: MOD-08
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        source: Đề xuất CNH-01 mục 4.1
      parameters:
        - name: screenCode
          in: query
          required: true
          description: Mã màn hình danh sách.
          schema: { type: string, pattern: '^SCR-[0-9]{4}$', examples: ['SCR-0201'] }
      responses:
        '200':
          description: Danh sách bộ lọc.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilterList' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    post:
      tags: [Tuỳ chọn cá nhân]
      operationId: createMySavedFilter
      summary: Lưu bộ lọc mới cho màn hình danh sách
      description: >-
        Điều kiện lọc chỉ gồm mã, mã định danh và khoảng giá trị (`SavedFilterCriteria`), không nhận
        văn bản tự do. Quá 20 bộ lọc trên một màn hình, trùng tên hoặc sai lược đồ trả 422. Đặt
        `isDefault` thì bộ lọc mặc định cũ của màn hình được bỏ cờ.
      x-mission:
        qt: [QT-00]
        scr: [SCR-0201, SCR-0301, SCR-0901, SCR-1001]
        owner: MOD-08
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        source: Đề xuất CNH-01 mục 4.1
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedFilterInput' }
      responses:
        '201':
          description: Đã lưu bộ lọc.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilter' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/me/saved-filters/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    put:
      tags: [Tuỳ chọn cá nhân]
      operationId: updateMySavedFilter
      summary: Sửa bộ lọc đã lưu
      description: Đổi tên, điều kiện, thứ tự hoặc cờ mặc định; bộ lọc của người khác trả 404.
      x-mission:
        qt: [QT-00]
        scr: [SCR-0201, SCR-0301, SCR-0901, SCR-1001]
        owner: MOD-08
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        source: Đề xuất CNH-01 mục 4.1
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedFilterInput' }
      responses:
        '200':
          description: Đã sửa bộ lọc.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedFilter' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    delete:
      tags: [Tuỳ chọn cá nhân]
      operationId: deleteMySavedFilter
      summary: Xoá bộ lọc đã lưu
      description: Bộ lọc của người khác trả 404.
      x-mission:
        qt: [QT-00]
        scr: [SCR-0201, SCR-0301, SCR-0901, SCR-1001]
        owner: MOD-08
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        source: Đề xuất CNH-01 mục 4.1
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      responses:
        '204':
          description: Đã xoá bộ lọc.
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /config/settings (NEN-043)
  /config/settings:
    get:
      tags: [Cấu hình tenant]
      operationId: listTenantSettings
      summary: Danh sách cấu hình chung của tenant hoặc đơn vị
      description: >-
        Đọc các dòng `config.tenant_setting` của tenant hiện hành (ngoài những khoá đã có đường dẫn
        chuyên biệt như `working_days`, `anomaly_thresholds`), lọc tuỳ chọn theo `unitId`.
      x-mission:
        qt: [QT-01]
        scr: [SCR-0102]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        source: 'TL-03 config.tenant_setting (suy luận đường dẫn)'
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/UnitId'
      responses:
        '200':
          description: Danh sách cấu hình.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantSettingList' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/settings/{key}:
    parameters:
      - $ref: '#/components/parameters/SettingKeyPath'
    put:
      tags: [Cấu hình tenant]
      operationId: setTenantSetting
      summary: Ghi cấu hình theo khoá của tenant hoặc đơn vị
      x-mission:
        qt: [QT-01]
        scr: [SCR-0102]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        aal: 2
        source: 'TL-03 config.tenant_setting (suy luận đường dẫn)'
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantSettingUpdate' }
      responses:
        '200':
          description: Cấu hình đã lưu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantSetting' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /config/role-bindings (WEB-058)
  /config/role-bindings:
    get:
      tags: [Vai trò và uỷ quyền]
      operationId: listRoleBindings
      summary: Vai trò đã cấp theo đơn vị hoặc theo người
      description: >-
        Trả các bản ghi `config.role_binding` của một đơn vị phạm vi (kèm đơn vị cấp dưới khi
        `includeSubunits=true`) hoặc của một người, lọc theo vai trò và trạng thái, phân trang con trỏ.
        `awaitingMe=true` chỉ trả đề nghị cấp vai trò nhạy cảm đang chờ người gọi duyệt thứ hai. Phần
        `counts` là số đếm cho thẻ lọc nhanh của SCR-0105 (SCR yêu cầu nên trả riêng). Mỗi lần đọc
        được ghi nhật ký truy cập (BR-13-07).
      x-mission:
        qt: [QT-01]
        scr: [SCR-0105, SCR-0106]
        owner: MOD-08
        roles: [tenant_admin, leader, inspector]
        scope: Tn
        source: WEB-058 đề xuất mục 3 F1, F2, F4 (đã duyệt 19/10/2026); TL-03 `config.role_binding`; ma trận SCR-0105.xem, SCR-0106.xem
      parameters:
        - name: orgUnitId
          in: query
          description: Đơn vị phạm vi; bỏ trống khi lọc theo `personId`.
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: includeSubunits
          in: query
          description: Gồm cả bản ghi cấp tại đơn vị cấp dưới.
          schema: { type: boolean, default: false }
        - name: personId
          in: query
          description: Người được cấp.
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/RoleCode' }
        - name: status
          in: query
          description: Trạng thái suy ra; bỏ trống là mọi trạng thái trừ `TU_CHOI`.
          schema: { $ref: '#/components/schemas/RoleBindingStatus' }
        - name: awaitingMe
          in: query
          description: Chỉ đề nghị đang chờ người gọi duyệt thứ hai (người gọi khác người cấp và người được cấp).
          schema: { type: boolean, default: false }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang vai trò đã cấp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleBindingPage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    post:
      tags: [Vai trò và uỷ quyền]
      operationId: grantRoleBinding
      summary: Cấp vai trò có thời hạn và phạm vi
      description: >-
        Tạo bản ghi `config.role_binding` với người cấp là người gọi. Vai trò `decider`,
        `second_approver`, `policy_author` vào trạng thái `CHO_DUYET` (cột `approved_by` rỗng) và chỉ có
        hiệu lực sau khi người duyệt thứ hai phê duyệt (BR-01-14, MSG-01-17); vai trò khác có hiệu lực
        theo `validFrom` và phát EVT-27. Tự cấp cho chính mình trả 403 mã `CONFIG-403-SELF-GRANT`
        (BR-01-13, MSG-01-16); thiếu `validTo` hoặc `validTo` không sau `validFrom` trả 422 mã
        `CONFIG-422-VALIDITY` (BR-01-16); đã có bản ghi còn hiệu lực trùng người, vai trò, đơn vị và
        phạm vi trả 409 mã `CONFIG-409-DUPLICATE-BINDING`. Phiên phải đạt `aal2` trong 15 phút (BR-01-15).
      x-mission:
        qt: [QT-01]
        scr: [SCR-0105]
        owner: MOD-08
        evt: [EVT-27]
        roles: [tenant_admin]
        scope: Tn
        aal: 2
        rules: [BR-01-13, BR-01-14, BR-01-15, BR-01-16]
        source: WEB-058 đề xuất F3; TL-01 mục Định danh và xác thực (thay đổi quyền cần step-up); ma trận SCR-0105.cap
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleBindingCreate' }
      responses:
        '201':
          description: Đã cấp (hoặc đã gửi duyệt thứ hai với vai trò nhạy cảm).
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleBinding' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/role-bindings/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Vai trò và uỷ quyền]
      operationId: getRoleBinding
      summary: Chi tiết một vai trò đã cấp
      description: Trả bản ghi vai trò kèm người cấp, người duyệt và thông tin kết thúc (thu hồi, từ chối).
      x-mission:
        qt: [QT-01]
        scr: [SCR-0105, SCR-0106]
        owner: MOD-08
        roles: [tenant_admin, leader, inspector]
        scope: Tn
        source: WEB-058 đề xuất F1, F2
      responses:
        '200':
          description: Chi tiết vai trò.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleBinding' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/role-bindings/{id}/approve:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Vai trò và uỷ quyền]
      operationId: approveRoleBinding
      summary: Duyệt thứ hai khi cấp vai trò nhạy cảm
      description: >-
        Người duyệt thứ hai (một `tenant_admin` khác người cấp, hoặc `leader` có thẩm quyền trên đơn vị
        phạm vi) phê duyệt đề nghị đang `CHO_DUYET`; ghi `approved_by` và phát EVT-27. Người duyệt trùng
        người cấp hoặc trùng người được cấp trả 403 mã `CONFIG-403-SELF-GRANT` (CHECK `approved_by <>
        granted_by`, BR-01-13, MSG-01-16). Đề nghị không còn chờ duyệt trả 409 mã `CONFIG-409-NOT-PENDING`.
      x-mission:
        qt: [QT-01]
        scr: [SCR-0105]
        owner: MOD-08
        evt: [EVT-27]
        roles: [tenant_admin, leader]
        scope: Tn
        aal: 2
        fourEyes: true
        rules: [BR-01-13, BR-01-14, BR-01-15]
        source: WEB-058 đề xuất F4; TL-03 `config.role_binding.approved_by`; ma trận SCR-0105.duyet
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoleBindingApprove' }
      responses:
        '200':
          description: Đã duyệt; vai trò có hiệu lực theo `validFrom`.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleBinding' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/role-bindings/{id}/reject:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Vai trò và uỷ quyền]
      operationId: rejectRoleBinding
      summary: Từ chối đề nghị cấp vai trò nhạy cảm
      description: >-
        Người duyệt thứ hai từ chối đề nghị đang `CHO_DUYET` kèm lý do; bản ghi được giữ với
        `end_kind = TU_CHOI` để tra cứu (không xoá). Cùng ràng buộc người duyệt như thao tác duyệt.
      x-mission:
        qt: [QT-01]
        scr: [SCR-0105]
        owner: MOD-08
        roles: [tenant_admin, leader]
        scope: Tn
        aal: 2
        fourEyes: true
        rules: [BR-01-13, BR-01-15]
        source: WEB-058 đề xuất F4; ma trận SCR-0105.duyet
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessEndInput' }
      responses:
        '200':
          description: Đã từ chối.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleBinding' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/role-bindings/{id}/revoke:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Vai trò và uỷ quyền]
      operationId: revokeRoleBinding
      summary: Thu hồi vai trò trước hạn
      description: >-
        Đặt `valid_to` bằng thời điểm hiện tại, ghi người thu hồi và lý do bắt buộc, không xoá bản ghi;
        phát EVT-27 để dữ liệu OPA và realm role Keycloak cập nhật. Phiên của người bị thu hồi không cần
        đăng xuất ngay vì OPA từ chối theo dữ liệu mới. Thu hồi vai trò của chính mình trả 403 mã
        `CONFIG-403-SELF-GRANT` (BR-01-13); vai trò đã kết thúc trả 409 mã `CONFIG-409-ALREADY-ENDED`.
      x-mission:
        qt: [QT-01]
        scr: [SCR-0105, SCR-0106]
        owner: MOD-08
        evt: [EVT-27]
        roles: [tenant_admin]
        scope: Tn
        aal: 2
        rules: [BR-01-13, BR-01-15]
        source: WEB-058 đề xuất F5; wiki/15 "Cấp, thu hồi quyền"; ma trận SCR-0105.thu-hoi
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessEndInput' }
      responses:
        '200':
          description: Đã thu hồi.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoleBinding' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/access-history:
    get:
      tags: [Vai trò và uỷ quyền]
      operationId: listAccessHistory
      summary: Lịch sử cấp, duyệt, thu hồi vai trò và uỷ quyền
      description: >-
        Dòng thời gian của một người (`personId`) hoặc một đơn vị (`orgUnitId`): cấp, duyệt, từ chối,
        thu hồi, hết hạn vai trò và tạo, thu hồi, hết hạn uỷ quyền, mới nhất trước. Đọc từ nhật ký kiểm
        toán `sys.audit.v1`; mỗi lần tra cứu được ghi lại (BR-13-07). Cần ít nhất một trong hai bộ lọc.
      x-mission:
        qt: [QT-01, QT-13]
        scr: [SCR-0106]
        owner: MOD-08
        roles: [tenant_admin, leader, inspector]
        scope: Tn
        source: WEB-058 đề xuất F8; TL-01 Nhật ký kiểm toán; ma trận SCR-0106.xem
      parameters:
        - name: personId
          in: query
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: orgUnitId
          in: query
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang sự kiện quyền.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccessEventPage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/access-history/export:
    get:
      tags: [Vai trò và uỷ quyền]
      operationId: exportAccessHistory
      summary: Xuất lịch sử quyền của một người ra CSV
      description: >-
        Xuất toàn bộ lịch sử quyền của một người thành CSV (UTF-8 có BOM). Xuất là thao tác nhạy cảm:
        phiên phải đạt `aal2` trong 15 phút và lần xuất được ghi nhật ký kiểm toán.
      x-mission:
        qt: [QT-01, QT-13]
        scr: [SCR-0106]
        owner: MOD-08
        roles: [tenant_admin, inspector]
        scope: Tn
        aal: 2
        source: WEB-058 đề xuất F8 (step-up khi xuất); ma trận SCR-0106.xuat
      parameters:
        - name: personId
          in: query
          required: true
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
      responses:
        '200':
          description: Tệp CSV.
          content:
            text/csv:
              schema: { type: string }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /config/delegations (WEB-058)
  /config/delegations:
    get:
      tags: [Vai trò và uỷ quyền]
      operationId: listDelegations
      summary: Uỷ quyền khi vắng mặt
      description: >-
        Trả bản ghi `config.delegation` (bảng bổ sung TL-03 theo WEB-058) của một đơn vị hoặc của một
        người (là người uỷ quyền hoặc người nhận), lọc theo loại và trạng thái.
      x-mission:
        qt: [QT-02, QT-03, QT-06, QT-07]
        scr: [SCR-0107, SCR-0106]
        owner: MOD-08
        roles: [tenant_admin, leader, inspector]
        scope: Cd
        source: WEB-058 đề xuất F6, F7; ma trận SCR-0107.xem
      parameters:
        - name: orgUnitId
          in: query
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: personId
          in: query
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: kind
          in: query
          schema: { $ref: '#/components/schemas/DelegationKind' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DelegationStatus' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang uỷ quyền.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DelegationPage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    post:
      tags: [Vai trò và uỷ quyền]
      operationId: createDelegation
      summary: Khai báo duyệt thay, nghiệm thu thay, check-in thay
      description: >-
        Lãnh đạo đơn vị khai báo người nhận uỷ quyền có thời hạn: duyệt thay (QT-02, QT-06), nghiệm thu
        thay (QT-07) hoặc check-in KR thay cho chủ sở hữu vắng dài ngày (QT-03, `subject` là KR). Phiếu
        duyệt, nghiệm thu và check-in do người nhận thực hiện ghi rõ "duyệt thay", "nghiệm thu thay",
        "check-in thay". Người nhận đang là người nhận uỷ quyền của chính người uỷ quyền khác không được
        uỷ quyền lại: 422 mã `CONFIG-422-REDELEGATION` (BR-01-17, MSG-01-18). Người uỷ quyền và người nhận
        trùng nhau trả 403 mã `CONFIG-403-SELF-GRANT` (BR-01-13). Thiếu thời hạn trả 422 mã
        `CONFIG-422-VALIDITY` (BR-01-16). Người nhận vẫn chịu ràng buộc tách vai trò của hồ sơ (BR-01-18).
      x-mission:
        qt: [QT-02, QT-03, QT-06, QT-07]
        scr: [SCR-0107]
        owner: MOD-08
        evt: [EVT-27]
        roles: [leader]
        scope: Cd
        aal: 2
        rules: [BR-01-13, BR-01-15, BR-01-16, BR-01-17, BR-01-18]
        source: WEB-058 đề xuất F6, F7; TL-02 QT-02, QT-03, QT-06, QT-07 ngoại lệ; ma trận SCR-0107.tao
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegationCreate' }
      responses:
        '201':
          description: Đã khai báo uỷ quyền.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/delegations/{id}/revoke:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Vai trò và uỷ quyền]
      operationId: revokeDelegation
      summary: Thu hồi uỷ quyền trước hạn
      description: >-
        Đặt `valid_to` bằng thời điểm hiện tại kèm lý do; phiếu đang giao cho người nhận quay về người
        uỷ quyền theo mẫu luồng. Uỷ quyền đã kết thúc trả 409 mã `CONFIG-409-ALREADY-ENDED`.
      x-mission:
        qt: [QT-02, QT-03, QT-06, QT-07]
        scr: [SCR-0107]
        owner: MOD-08
        evt: [EVT-27]
        roles: [leader]
        scope: Cd
        aal: 2
        rules: [BR-01-15]
        source: WEB-058 đề xuất F6, F7; ma trận SCR-0107.thu-hoi
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccessEndInput' }
      responses:
        '200':
          description: Đã thu hồi uỷ quyền.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /config/dashboard-defs (CORE-08-17)
  /config/dashboard-defs:
    get:
      tags: [Định nghĩa dashboard]
      operationId: listDashboardDefs
      summary: Định nghĩa dashboard người xem được dùng
      description: >-
        Client nội bộ analytics-api (SVC-15) lấy dashboard của người thực hiện và dashboard được chia sẻ cho họ: phạm
        vi `TENANT`, hoặc `DON_VI` có đơn vị nằm trong danh sách `viewerUnit` (đơn vị công tác của người xem và các
        đơn vị cấp trên, do analytics-api tra cây tổ chức). Chỉ trả định nghĩa, không có số liệu.
      security:
        - serviceClient: []
      parameters:
        - $ref: '#/components/parameters/ServiceTenant'
        - $ref: '#/components/parameters/ActingUser'
        - $ref: '#/components/parameters/ViewerUnit'
        - name: owner
          in: query
          description: '`me` chỉ lấy dashboard của người thực hiện.'
          schema: { type: string, enum: [me] }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Trang định nghĩa dashboard.
          content:
            application/json:
              schema: { $ref: './platform.yaml#/components/schemas/AnalyticsDashboardPage' }
              examples:
                cua-toi:
                  value:
                    items:
                      - id: 0192fa0c-d546-77f8-091a-2b3c4d5e6f01
                        title: Bảng của Bí thư
                        ownerUserId: 0192f1a2-2222-7aaa-8bbb-000000000b01
                        shareScope: DON_VI
                        widgetCount: 4
                        updatedAt: '2026-11-16T09:30:00+07:00'
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-16]
        scr: [SCR-1602]
        owner: MOD-08
        roles: [service_client]
        scope: N
        source: TL-03 "Bảng config.dashboard_def (bổ sung)"; TL-02b QT-16 bước 6, 7; cổng dịch vụ đề xuất CORE-08-17
    post:
      tags: [Định nghĩa dashboard]
      operationId: createDashboardDef
      summary: Lưu định nghĩa dashboard mới
      description: >-
        Tạo định nghĩa cho người thực hiện. Tên bắt buộc, tối đa 100 ký tự, không trùng trong các dashboard của
        người đó; tối đa 20 widget, mỗi widget đúng một chỉ số và tối đa 2 chiều; `sharedUnitIds` bắt buộc khi
        phạm vi `DON_VI`. Tên chỉ số và chiều chỉ kiểm cú pháp, analytics-api kiểm theo lớp ngữ nghĩa.
      security:
        - serviceClient: []
      parameters:
        - $ref: '#/components/parameters/ServiceTenant'
        - $ref: '#/components/parameters/ActingUser'
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardDefInput' }
            examples:
              bang-bi-thu:
                value:
                  title: Bảng của Bí thư
                  layout:
                    - { id: w1, x: 0, y: 0, w: 3, h: 2, measure: okr.tien_do_o, dimensions: [], chartType: THE_SO, filters: [], drillDown: true }
                  semanticModelVersion: '2026.4'
      responses:
        '201':
          description: Đã tạo.
          headers:
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: './platform.yaml#/components/schemas/AnalyticsDashboard' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409':
          description: 'Trùng tên dashboard của người thực hiện. Mã lỗi: `CONFIG-409-DUPLICATE-TITLE`.'
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-16]
        scr: [SCR-1602]
        owner: MOD-08
        roles: [service_client]
        scope: N
        rules: [BR-16-02]
        source: TL-02b SCR-1602 bảng trường; TL-03 `config.dashboard_def`; cổng dịch vụ đề xuất CORE-08-17

  /config/dashboard-defs/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Định nghĩa dashboard]
      operationId: getDashboardDef
      summary: Một định nghĩa dashboard
      description: >-
        Trả định nghĩa kèm ETag nếu người thực hiện là người tạo hoặc được chia sẻ (cùng quy tắc với
        `listDashboardDefs`); ngoài phạm vi thì trả 404.
      security:
        - serviceClient: []
      parameters:
        - $ref: '#/components/parameters/ServiceTenant'
        - $ref: '#/components/parameters/ActingUser'
        - $ref: '#/components/parameters/ViewerUnit'
      responses:
        '200':
          description: Định nghĩa dashboard.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: './platform.yaml#/components/schemas/AnalyticsDashboard' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-16]
        scr: [SCR-1602]
        owner: MOD-08
        roles: [service_client]
        scope: N
        source: TL-03 `config.dashboard_def`; cổng dịch vụ đề xuất CORE-08-17
    put:
      tags: [Định nghĩa dashboard]
      operationId: replaceDashboardDef
      summary: Thay định nghĩa dashboard
      description: >-
        Thay toàn bộ tên, bố cục và phạm vi chia sẻ; chỉ người tạo được sửa (403 `CONFIG-403-NOT-OWNER`). Dùng cho
        cả `updateDashboard` và `shareDashboard` của analytics-api; đổi phạm vi chia sẻ ghi sự kiện kiểm toán.
      security:
        - serviceClient: []
      parameters:
        - $ref: '#/components/parameters/ServiceTenant'
        - $ref: '#/components/parameters/ActingUser'
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DashboardDefInput' }
            examples:
              chia-se-don-vi:
                value:
                  title: Bảng của Bí thư
                  layout:
                    - { id: w1, x: 0, y: 0, w: 3, h: 2, measure: okr.tien_do_o, dimensions: [], chartType: THE_SO, filters: [], drillDown: true }
                  shareScope: DON_VI
                  sharedUnitIds: [0192f1a2-3333-7ccc-8ddd-000000000a01]
      responses:
        '200':
          description: Đã lưu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: './platform.yaml#/components/schemas/AnalyticsDashboard' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-16]
        scr: [SCR-1602]
        owner: MOD-08
        roles: [service_client]
        scope: N
        rules: [BR-16-02]
        source: TL-02b SCR-1602 "Lưu dashboard", "Chia sẻ"; cổng dịch vụ đề xuất CORE-08-17

components:
  securitySchemes:
    keycloak: { $ref: '../common/common.yaml#/components/securitySchemes/keycloak' }
    serviceClient: { $ref: '../common/common.yaml#/components/securitySchemes/serviceClient' }
  parameters:
    ServiceTenant:
      name: tenant
      in: query
      required: true
      description: Tenant của người thực hiện; OPA kiểm khớp tenant trong token client dịch vụ.
      schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    ActingUser:
      name: X-Acting-User
      in: header
      required: true
      description: Người dùng mà client dịch vụ đang thao tác thay (lấy từ token người dùng đã xác thực ở SVC-15).
      schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    ViewerUnit:
      name: viewerUnit
      in: query
      description: Đơn vị công tác của người xem và các đơn vị cấp trên, dùng để lọc dashboard chia sẻ `DON_VI`.
      style: form
      explode: true
      schema:
        type: array
        maxItems: 64
        items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    Year:
      name: year
      in: query
      required: true
      description: Năm dương lịch.
      schema: { type: integer, minimum: 2020, maximum: 2100, examples: [2026] }
    YearOptional:
      name: year
      in: query
      description: Năm dương lịch; bỏ trống thì trả mọi năm.
      schema: { type: integer, minimum: 2020, maximum: 2100, examples: [2026] }
    LockOrderIdPath:
      name: oid
      in: path
      required: true
      description: Mã lệnh khoá kỳ (`config.period_lock_order.id`).
      schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    FlagKeyPath:
      name: key
      in: path
      required: true
      description: Mã cờ tính năng (`config.feature_flag.flag_key`).
      schema: { type: string, maxLength: 100, pattern: '^[a-z0-9][a-z0-9._-]*$', examples: ['ai.weeklySummary'] }
    UiPackVersionPath:
      name: v
      in: path
      required: true
      description: Phiên bản ngữ nghĩa của UI Pack (`config.ui_pack_version.version`).
      schema: { type: string, maxLength: 32, examples: ['1.8.0'] }
    FormKeyPath:
      name: key
      in: path
      required: true
      description: Khoá biểu mẫu (`config.form_schema.form_key`).
      schema: { type: string, maxLength: 64, pattern: '^[a-z0-9][a-z0-9-]*$', examples: ['phieu-vc-yte'] }
    FormVersionPath:
      name: v
      in: path
      required: true
      description: Phiên bản biểu mẫu (`config.form_schema.version`).
      schema: { type: string, maxLength: 32, examples: ['12'] }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag đã lưu ở client; khớp thì máy chủ trả 304.
      schema: { type: string, examples: ['"uipack-1.8.0-9f2c"'] }
    PrefKeyPath:
      name: prefKey
      in: path
      required: true
      description: Khoá tuỳ chọn cá nhân (`config.user_preference.pref_key`).
      schema:
        type: string
        maxLength: 100
        pattern: '^(ui\.display|ui\.home\.layout|ui\.dashboard\.default|ui\.table\.SCR-[0-9]{4}|notify\.channel_pref)$'
        examples: ['ui.display']
    IfMatchWhenExists:
      name: If-Match
      in: header
      required: false
      description: >-
        ETag của khoá đã đọc. Bỏ trống khi lưu khoá lần đầu; khoá đã có mà thiếu header trả 428, lệch
        phiên bản trả 409 mã `CONFIG-409-VERSION-CONFLICT`.
      schema: { type: string, examples: ['"3"'] }
    SettingKeyPath:
      name: key
      in: path
      required: true
      description: Khoá cấu hình (`config.tenant_setting.key`).
      schema:
        type: string
        maxLength: 100
        pattern: '^[a-z0-9][a-z0-9._-]*$'

  schemas:
    DashboardDefInput:
      description: Định nghĩa dashboard gửi từ analytics-api (`config.dashboard_def`, CORE-08-17).
      type: object
      required: [title, layout]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        layout:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: './platform.yaml#/components/schemas/DashboardWidget' }
        shareScope: { $ref: './platform.yaml#/components/schemas/DashboardShareScope' }
        sharedUnitIds:
          type: array
          description: Bắt buộc, không rỗng khi `DON_VI`; rỗng ở phạm vi khác.
          maxItems: 200
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        semanticModelVersion: { type: string, maxLength: 32 }
    # ------------------------------------------------------------ Tenant
    TenancyModel:
      description: >-
        Mô hình thuê bao trong lần gắn cell (`registry.tenant_cell.tenancy_model`, CHECK chữ thường như
        TL-02a). `registry.tenant.tenancy_model` viết hoa và có thêm `AIRGAP`; hợp đồng theo TL-02a.
      type: string
      enum: [silo, bridge, pool]
    TenantStatus:
      description: Trạng thái vòng đời tenant (`registry.tenant.status`, TL-02a QT-01 cộng `DANG_CHUYEN_CELL` của TL-03).
      type: string
      enum: [KHOI_TAO, DANG_CAP_PHAT, DANG_CAU_HINH, SAN_SANG, DANG_VAN_HANH, TAM_NGUNG, DANG_CHUYEN_CELL, DA_CHAM_DUT]
    TenantSector:
      description: Nhóm khách hàng (`registry.tenant.sector`).
      type: string
      enum: [DANG, CHINH_QUYEN, SU_NGHIEP, TRUONG_HOC, BENH_VIEN, LLVT, DOANH_NGHIEP]
    TenantKekMode:
      description: >-
        Loại khoá mã hoá (SCR-0102 trường 9): riêng theo tenant hoặc dùng chung của cell; silo bắt buộc
        riêng (suy luận tên giá trị, TL-03 chỉ có cột `kek_ref`).
      type: string
      enum: [RIENG, DUNG_CHUNG_CELL]
    TenantStaffSourceType:
      description: Nguồn nhân sự (SCR-0102 trường 13; suy luận tên giá trị).
      type: string
      enum: [CSDL_CBCCVC, CSDL_DANG_VIEN, SCIM]
    ConfigTenantRow:
      description: Một dòng của bảng tenant trên SCR-0101.
      type: object
      required: [id, code, name, domain, cellCode, tenancyModel, accountCount, status]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 32, description: '`registry.tenant.code`' }
        name: { type: string, maxLength: 200, description: '`registry.tenant.name`' }
        domain: { type: string, maxLength: 253, description: 'Tên miền chính (`registry.tenant_domain.domain`)' }
        cellCode: { type: string, maxLength: 16, description: 'Mã cell, dạng `CELL-xxx`' }
        tenancyModel: { $ref: '#/components/schemas/TenancyModel' }
        accountCount: { type: integer, minimum: 0, description: 'Số tài khoản, đồng bộ từ cell' }
        policyPacks:
          type: array
