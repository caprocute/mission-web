    PeriodLockBatch:
      description: Một lô tính điểm (`scoring.score_job`).
      type: object
      required: [id, profileCount, status, attempts]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        unit: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        profileCount: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/ScoreBatchStatus' }
        attempts: { type: integer, minimum: 0, maximum: 3 }
        finishedAt: { type: ['string', 'null'], format: date-time }
      examples:
        - id: 0192f7f8-5e6f-7a81-9c83-9d0e1f2a3b56
          unit: { id: 0192f7f8-0000-7a81-9c83-9d0e1f2a3b00, name: Ban Tổ chức Đảng uỷ }
          profileCount: 1000
          status: XONG
          attempts: 1
          finishedAt: '2027-01-04T07:21:13+07:00'
    PeriodLockBatchPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PeriodLockBatch' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    PeriodLockFailure:
      description: Hồ sơ lỗi trong hàng đợi lỗi của bước tính điểm.
      type: object
      required: [profileId, error, attempts]
      properties:
        profileId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        person: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        unit: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        batchId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        error: { type: string, description: 'Mô tả lỗi, không chứa thông tin nội bộ' }
        attempts: { type: integer, minimum: 0 }
        lastAttemptAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
      examples:
        - profileId: 0192f8a9-6f70-7b82-8d94-0e1f2a3b4c67
          person: { id: 0192f8a9-1111-7b82-8d94-0e1f2a3b4c01, name: Nguyễn Thị Mai }
          unit: { id: 0192f8a9-2222-7b82-8d94-0e1f2a3b4c02, name: Văn phòng Đảng uỷ }
          batchId: 0192f7f8-5e6f-7a81-9c83-9d0e1f2a3b56
          error: Thiếu phân công chính tại ngày cuối kỳ.
          attempts: 3
          lastAttemptAt: '2027-01-04T07:30:02+07:00'
    PeriodLockFailurePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PeriodLockFailure' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    PeriodLockEvent:
      description: Một dòng nhật ký sự kiện của saga (`ledger.ledger_entry` lọc theo saga).
      type: object
      required: [at, event]
      properties:
        at: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        event: { type: string, description: 'Mô tả sự kiện, tiếng Việt' }
        evt: { type: ['string', 'null'], description: 'Mã EVT nếu có, ví dụ EVT-09' }
        actor:
          oneOf:
            - { $ref: '../common/common.yaml#/components/schemas/Ref' }
            - { type: 'null' }
        ledgerEntryId: { type: ['string', 'null'], format: uuid }
      examples:
        - at: '2027-01-04T07:05:40+07:00'
          event: Kỳ Quý IV/2026 chuyển DANG_KHOA, phát KyDaKhoa.
          evt: EVT-09
          actor: null
          ledgerEntryId: 0192f9ba-7081-7c93-8ea5-1f2a3b4c5d78
    PeriodLockEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PeriodLockEvent' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    PeriodLockDiagram:
      description: Định nghĩa BPMN và trạng thái các hoạt động của saga.
      type: object
      required: [bpmnXml, activeActivityIds, completedActivityIds, failedActivityIds]
      properties:
        templateKey: { type: string }
        templateVersion: { type: integer }
        bpmnXml: { type: string, description: 'BPMN 2.0 XML; chỉ hiển thị bằng trình xem BPMN' }
        activeActivityIds: { type: array, items: { type: string } }
        completedActivityIds: { type: array, items: { type: string } }
        failedActivityIds: { type: array, items: { type: string } }
      examples:
        - templateKey: chot-ky
          templateVersion: 3
          bpmnXml: '<?xml version="1.0" encoding="UTF-8"?><definitions xmlns="http://www.omg.org/spec/BPMN/20100524/MODEL">…</definitions>'
          activeActivityIds: [buoc2TinhDiem]
          completedActivityIds: [buoc0TienDieuKien, buoc1KhoaKy]
          failedActivityIds: []

    # ------------------------------------------------------------ UI Pack
    UiPackVersionStatus:
      description: Trạng thái phiên bản UI Pack (`config.ui_pack_version.status`, bộ trạng thái TL-02b).
      type: string
      enum: [NHAP, DANG_KIEM_TRA, CHO_DUYET, DA_PHAT_HANH, THAY_THE]
    DesignTokens:
      description: >-
        Design Token theo định dạng W3C Design Tokens (`$type`, `$value`), lưu ở
        `config.ui_pack_version.tokens_json`. Không có trường nhận HTML hay JavaScript.
      type: object
      additionalProperties: true
      examples:
        - color:
            brand:
              primary: { $type: color, $value: '#0A7E8C' }
              on-primary: { $type: color, $value: '#FFFFFF' }
          radius:
            card: { $type: dimension, $value: 14px }
    SduiNode:
      description: >-
        Nút cây SDUI; `component` phải có trong registry (BR-18-02), `props` kiểm theo `propsSchema` của
        component, `visibleWhen` là biểu thức CEL chỉ đọc ngữ cảnh người dùng.
      type: object
      required: [component]
      properties:
        component: { type: string, maxLength: 64, pattern: '^[a-z][a-zA-Z0-9]*(\.[a-zA-Z0-9-]+)+$' }
        props:
          type: object
          additionalProperties: true
        visibleWhen: { type: string, maxLength: 500 }
        id:
          type: string
          maxLength: 64
          description: Mã widget dùng cho lớp phủ cá nhân trang chủ (CNH-02); thiếu thì lấy `component`.
        mandatory:
          type: boolean
          description: Widget bắt buộc của đơn vị, người dùng không ẩn được (CNH-02).
        children:
          type: array
          items: { $ref: '#/components/schemas/SduiNode' }
      examples:
        - component: vt.layout.grid
          props: { columns: { xs: 1, md: 2, xl: 3 } }
          children:
            - { component: vt.widget.myTasksToday, props: { limit: 7 } }
    UiPackAsset:
      description: Tài nguyên của UI Pack (`assets_json`), ví dụ logo SVG đã làm sạch ≤ 50 KB.
      type: object
      required: [key, path, sha256]
      properties:
        key: { type: string, description: 'Ví dụ `logo`' }
        path: { type: string, maxLength: 512 }
        mediaType: { type: string, enum: ['image/svg+xml', 'image/png', 'font/woff2'] }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        sizeBytes: { type: integer, minimum: 0, maximum: 51200 }
    UiPackFormRef:
      description: Biểu mẫu gắn trong UI Pack.
      type: object
      required: [formKey, version]
      properties:
        formKey: { type: string, maxLength: 64 }
        version: { type: string, maxLength: 32 }
    PolicyPackVersionRef:
      description: Phiên bản Policy Pack tham chiếu (`policy_pack_ref`, `policy_pack_version_id`).
      type: object
      required: [packVersionId]
      properties:
        packVersionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        packCode: { type: string }
        version: { type: string }
    UiPackVersion:
      description: Một phiên bản UI Pack (`config.ui_pack_version`).
      type: object
      required: [id, uiPackId, version, status, tokens, layouts, componentRegistryVersion, elderMode, fewSteps, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        uiPackId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        version: { type: string, maxLength: 32 }
        status: { $ref: '#/components/schemas/UiPackVersionStatus' }
        tokens: { $ref: '#/components/schemas/DesignTokens' }
        layouts:
          type: object
          description: Bố cục theo bề mặt cấu hình được (ví dụ `home`); tối đa 12 widget trên trang chủ.
          additionalProperties: { $ref: '#/components/schemas/SduiNode' }
        assets:
          type: array
          items: { $ref: '#/components/schemas/UiPackAsset' }
        forms:
          type: array
          items: { $ref: '#/components/schemas/UiPackFormRef' }
        componentRegistryVersion: { type: string, maxLength: 32 }
        policyPack: { $ref: '#/components/schemas/PolicyPackVersionRef' }
        elderMode: { type: boolean }
        fewSteps: { type: boolean }
        bundleSha256: { type: ['string', 'null'], pattern: '^[0-9a-f]{64}$', readOnly: true }
        bundleSizeGzipBytes: { type: ['integer', 'null'], readOnly: true, description: 'Kích thước gói đã biên dịch (suy luận; ngân sách 30 KB)' }
        publishedAt: { type: ['string', 'null'], format: date-time, readOnly: true }
        reviewComment: { type: ['string', 'null'], readOnly: true, description: 'Ý kiến của người duyệt khi từ chối' }
        createdBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        updatedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - id: 0192fa0b-8192-7da4-9fb6-2a3b4c5d6e89
          uiPackId: 0192fa0b-0000-7da4-9fb6-2a3b4c5d6e00
          version: 1.8.0
          status: NHAP
          tokens:
            color:
              brand:
                primary: { $type: color, $value: '#0A7E8C' }
            radius:
              card: { $type: dimension, $value: 14px }
          layouts:
            home:
              component: vt.layout.grid
              children:
                - { component: vt.widget.myTasksToday, props: { limit: 7 } }
                - { component: vt.widget.kpiTile }
          assets:
            - { key: logo, path: assets/logo-so-y-te-x.svg, mediaType: image/svg+xml, sha256: 9f2c7a1e4b5d6c8f0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f6071, sizeBytes: 8421 }
          forms:
            - { formKey: phieu-vc-yte, version: '12' }
          componentRegistryVersion: '2026.3'
          policyPack: { packVersionId: 0192e1c4-5d6e-7f80-9a1b-2c3d4e5f6a72, packCode: nn-335/so-y-te, version: '1.3' }
          elderMode: true
          fewSteps: false
          bundleSha256: null
          bundleSizeGzipBytes: 11469
          publishedAt: null
          reviewComment: null
          createdBy: { id: 0192fa0b-1111-7da4-9fb6-2a3b4c5d6e01, name: Đỗ Thanh Tâm }
          updatedAt: '2026-10-19T09:40:00+07:00'
          rowVersion: 6
    UiPackVersionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UiPackVersion' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    UiPackVersionCreate:
      type: object
      required: [version]
      properties:
        version: { type: string, maxLength: 32 }
        cloneFromVersion:
          type: ['string', 'null']
          maxLength: 32
          description: Phiên bản nhân bản; `null` là bộ mặc định của `@vt/design-system`.
      examples:
        - version: 1.9.0
          cloneFromVersion: 1.8.0
    UiPackVersionUpdate:
      type: object
      required: [tokens, layouts, componentRegistryVersion, elderMode, fewSteps]
      properties:
        tokens: { $ref: '#/components/schemas/DesignTokens' }
        layouts:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SduiNode' }
        assets:
          type: array
          items: { $ref: '#/components/schemas/UiPackAsset' }
        componentRegistryVersion: { type: string, maxLength: 32 }
        policyPackVersionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        elderMode: { type: boolean }
        fewSteps: { type: boolean }
    UiPackSummary:
      description: Một UI Pack của tenant (`config.ui_pack`).
      type: object
      required: [id, code, name]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        currentVersionId: { type: ['string', 'null'], format: uuid }
        currentVersion: { type: ['string', 'null'] }
        draftVersion: { type: ['string', 'null'], description: 'Phiên bản đang soạn nếu có (suy luận)' }
      examples:
        - id: 0192fa0b-0000-7da4-9fb6-2a3b4c5d6e00
          code: so-y-te-x
          name: UI Pack Sở Y tế tỉnh X
          currentVersionId: 0192fa0b-7000-7da4-9fb6-2a3b4c5d6e70
          currentVersion: 1.7.0
          draftVersion: 1.8.0
    UiPackPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UiPackSummary' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    UiPackCheck:
      description: Một mục kiểm tra tự động của UI Pack.
      type: object
      required: [code, passed]
      properties:
        code: { type: string, enum: [SCHEMA, REGISTRY, CONTRAST, SIZE, CEL_PARITY, ELDER_MODE], description: 'Mã kiểm tra (suy luận tên giá trị)' }
        passed: { type: boolean }
        message: { type: string }
        msg: { type: string, description: 'Mã thông điệp TL-02b nếu có, ví dụ MSG-18-01' }
    UiPackPreview:
      description: Kết quả biên dịch thử một phiên bản UI Pack.
      type: object
      required: [version, mode, cssVariables, layouts, checks]
      properties:
        version: { type: string }
        mode: { type: string, enum: [default, elderly] }
        cssVariables:
          type: object
          description: CSS custom properties sinh từ token (tên → giá trị).
          additionalProperties: { type: string }
        primePreset:
          type: object
          additionalProperties: true
          description: Preset PrimeNG dạng JSON.
        layouts:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SduiNode' }
        checks:
          type: array
          items: { $ref: '#/components/schemas/UiPackCheck' }
        bundleSizeGzipBytes: { type: integer, minimum: 0 }
      examples:
        - version: 1.8.0
          mode: default
          cssVariables: { '--vt-color-primary': '#0A7E8C', '--vt-radius-card': 14px }
          primePreset: { semantic: { primary: { '500': 'var(--vt-color-primary)' } } }
          layouts:
            home: { component: vt.layout.grid, children: [{ component: vt.widget.myTasksToday }] }
          checks:
            - { code: CONTRAST, passed: true, message: 'Tương phản 4,9 : 1, đạt AA.' }
            - { code: SIZE, passed: true, message: 'Gói 11,2 KB gzip, trong ngân sách 30 KB.' }
          bundleSizeGzipBytes: 11469
    UiPackRuntime:
      description: >-
        UI Pack hiện hành cho shell và ứng dụng di động, theo cấu trúc năm phần của TL-01 chương 7 (siêu
        dữ liệu, token, bố cục, biểu mẫu, plugin) cộng `modes`, `i18n` và thông tin toàn vẹn.
      type: object
      required: [pack, version, requires, tokens, layouts, contentHash]
      properties:
        pack: { type: string, description: 'Mã gói, ví dụ `tinh-quang-ngai/ui`' }
        version: { type: string }
        requires:
          type: object
          required: [registry]
          properties:
            registry: { type: string, description: 'Dải phiên bản registry tương thích' }
            policyPack: { type: string, description: 'Dải phiên bản Policy Pack tương thích' }
        tokens: { $ref: '#/components/schemas/DesignTokens' }
        modes:
          type: object
          description: Ghi đè token theo chế độ; `elderly` kèm `flags.reducedSteps`.
          additionalProperties: true
        layouts:
          type: object
          additionalProperties: { $ref: '#/components/schemas/SduiNode' }
        forms:
          type: object
          description: Cấu hình trình bày biểu mẫu theo khoá; dữ liệu phiếu tham chiếu Policy Pack qua `schemaRef`.
          additionalProperties: true
        plugins:
          type: array
          items:
            type: object
            required: [name, remoteEntry]
            properties:
              name: { type: string }
              remoteEntry: { type: string, format: uri-reference }
              integrity: { type: string }
        i18n:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: string }
        contentHash: { type: string, description: 'SHA-256 của gói (`bundle_sha256`)' }
        signature: { type: string, description: 'Chữ ký số của gói, base64' }
        publishedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
      examples:
        - pack: tinh-quang-ngai/ui
          version: 1.3.0
          requires: { registry: '^2.4.0', policyPack: 'khoi-chinh-quyen/nd335@>=1.2.0 <2.0.0' }
          tokens:
            color:
              primary: { $type: color, $value: '#C8102E' }
          modes:
            elderly:
              font: { size: { body: { $value: 18px } } }
              flags: { reducedSteps: true, minTouchTarget: 48px }
          layouts:
            home:
              component: vt.layout.grid
              children:
                - { component: vt.widget.myTasksToday, props: { limit: 7 } }
          forms: {}
          plugins: []
          i18n: { vi: { home.notice.q4: Hạn nộp hồ sơ quý IV là ngày 10/01/2027. } }
          contentHash: 9f2c7a1e4b5d6c8f0a1b2c3d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f6071
          signature: MEUCIQDx…
          publishedAt: '2026-10-12T15:00:00+07:00'
    UiPackReviewInput:
      type: object
      properties:
        comment: { type: string, maxLength: 1000 }
    UiPackRejectInput:
      type: object
      required: [comment]
      properties:
        comment: { type: string, minLength: 1, maxLength: 1000, description: 'Ý kiến bắt buộc khi từ chối' }
      examples:
        - comment: Màu chữ phụ trên nền thẻ chưa đạt AA, đề nghị chỉnh lại.
    UiPackFormAttach:
      type: object
      required: [formKey, formVersion]
      properties:
        formKey: { type: string, maxLength: 64 }
        formVersion: { type: string, maxLength: 32 }
      examples:
        - formKey: phieu-vc-yte
          formVersion: '12'

    # ------------------------------------------------------------ Danh mục component
    UiComponentStatus:
      description: Trạng thái component trong registry (`config.component_registry.status`).
      type: string
      enum: [HIEU_LUC, NGUNG]
    UiComponent:
      description: Một component SDUI được phép (`config.component_registry`).
      type: object
      required: [componentKey, registryVersion, propsSchema, allowedClassification, status]
      properties:
        componentKey: { type: string, maxLength: 64 }
        registryVersion: { type: string, maxLength: 16 }
        propsSchema:
          type: object
          additionalProperties: true
          description: JSON Schema của thuộc tính được phép.
        allowedClassification: { $ref: '../common/common.yaml#/components/schemas/Classification' }
        status: { $ref: '#/components/schemas/UiComponentStatus' }
        container: { type: boolean, description: 'Được chứa children (TL-01 chương 7)' }
        mobile: { type: boolean, description: 'Hỗ trợ trên ứng dụng di động' }
        plugin: { type: ['string', 'null'], description: 'Plugin cung cấp, ví dụ `fe-plugin-yte`' }
      examples:
        - componentKey: vt.widget.myTasksToday
          registryVersion: '2026.3'
          propsSchema: { type: object, additionalProperties: false, properties: { limit: { type: integer, maximum: 20 } } }
          allowedClassification: C1
          status: HIEU_LUC
          container: false
          mobile: true
          plugin: null
    UiComponentPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/UiComponent' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }

    # ------------------------------------------------------------ Biểu mẫu động
    UiFormStatus:
      description: Trạng thái biểu mẫu (`config.form_schema.status`).
      type: string
      enum: [NHAP, DA_PHAT_HANH, NGUNG]
    UiFormVersion:
      description: Một phiên bản biểu mẫu động (`config.form_schema`).
      type: object
      required: [formKey, version, status, schemaJson, uiJson, rowVersion]
      properties:
        formKey: { type: string, maxLength: 64 }
        version: { type: string, maxLength: 32 }
        status: { $ref: '#/components/schemas/UiFormStatus' }
        schemaJson:
          type: object
          additionalProperties: true
          description: JSON Schema 2020-12 của dữ liệu, có `x-cel` (quy tắc) và `x-classification` (C1, C2).
        uiJson:
          type: object
          additionalProperties: true
          description: Cấu hình trường Formly, điều kiện hiển thị CEL, thông báo lỗi.
        celRules:
          type: array
          items:
            type: object
            required: [field, expr, message]
            properties:
              field: { type: string, maxLength: 64 }
              expr: { type: string, maxLength: 1000 }
              message: { type: string, maxLength: 200 }
              serverOnly: { type: boolean, default: false }
        policyPack: { $ref: '#/components/schemas/PolicyPackVersionRef' }
        lastTestRun:
          oneOf:
            - { $ref: '#/components/schemas/UiFormTestRunResult' }
            - { type: 'null' }
        updatedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - formKey: phieu-vc-yte
          version: '12'
          status: NHAP
          schemaJson:
            $schema: https://json-schema.org/draft/2020-12/schema
            type: object
            properties:
              ty_le_hsba_dat: { type: number, x-cel: 'self >= 0.0 && self <= 100.0', x-classification: C1 }
              mo_ta_su_co: { type: string, maxLength: 2000, x-classification: C2 }
          uiJson:
            mo_ta_su_co: { hideExpression: 'form.su_co_y_khoa != "CO"', label: Mô tả sự cố và biện pháp khắc phục }
          celRules:
