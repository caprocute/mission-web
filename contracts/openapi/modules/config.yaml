    # ------------------------------------------------------------ Tuỳ chọn cá nhân (CNH-02)
    UserPreferenceItem:
      description: >-
        Một khoá tuỳ chọn đã lưu. `value` theo lược đồ của khoá trong
        `contracts/schemas/user-preference.schema.json` (`ui.display` → `UiDisplayPreference`,
        `ui.home.layout` → `UiHomeLayoutOverlay`, `ui.table.SCR-xxxx` → `UiTableScreenPreference`…).
      type: object
      required: [prefKey, value, schemaVersion, rowVersion]
      properties:
        prefKey: { type: string, maxLength: 100 }
        value:
          type: object
          additionalProperties: true
        schemaVersion: { type: integer, minimum: 1 }
        updatedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    UserPreferenceMap:
      description: Mọi tuỳ chọn đã lưu của người dùng, theo khoá.
      type: object
      required: [schemaVersion, items]
      properties:
        schemaVersion: { type: integer, minimum: 1 }
        items:
          type: object
          additionalProperties: { $ref: '#/components/schemas/UserPreferenceItem' }
    UserPreferenceInput:
      description: Giá trị mới của một khoá tuỳ chọn.
      type: object
      required: [value]
      properties:
        value:
          type: object
          additionalProperties: true
        schemaVersion: { type: integer, minimum: 1, default: 1 }
    SavedFilter:
      description: Bộ lọc danh sách đã đặt tên (`config.saved_filter`).
      type: object
      required: [id, screenCode, name, criteria, isDefault, displayOrder, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        screenCode: { type: string, pattern: '^SCR-[0-9]{4}$' }
        name: { type: string, maxLength: 120 }
        criteria:
          description: Theo `SavedFilterCriteria` của `user-preference.schema.json`.
          type: object
          additionalProperties: true
        isDefault: { type: boolean }
        displayOrder: { type: integer, minimum: 0, maximum: 19 }
        updatedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    SavedFilterInput:
      description: Nội dung tạo hoặc sửa bộ lọc đã lưu; `screenCode` chỉ dùng khi tạo.
      type: object
      required: [name, criteria]
      properties:
        screenCode: { type: string, pattern: '^SCR-[0-9]{4}$' }
        name: { type: string, minLength: 1, maxLength: 120 }
        criteria:
          type: object
          additionalProperties: true
        isDefault: { type: boolean, default: false }
        displayOrder: { type: integer, minimum: 0, maximum: 19, default: 0 }
