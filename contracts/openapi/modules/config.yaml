    parameters:
      - $ref: '#/components/parameters/FormKeyPath'
      - $ref: '#/components/parameters/FormVersionPath'
    post:
      tags: [Biểu mẫu động]
      operationId: runUiFormTests
      summary: Chạy bộ test biểu mẫu trên hai engine
      description: >-
        Chạy các ca test của biểu mẫu bằng cel-java tại máy chủ và so với kết quả cel-js trình duyệt gửi
        lên; ca cho kết quả khác nhau được đánh dấu (MSG-18-08, BR-18-05). Trả kết quả đồng bộ.
      x-mission:
        qt: [QT-18]
        scr: [SCR-1802]
        owner: MOD-08
        roles: [tenant_admin, policy_author]
        scope: Tn
        rules: [BR-18-04, BR-18-05, BR-18-08]
        source: TL-02b SCR-1802 "Chạy bộ test biểu mẫu"; ma trận SCR-1802.dung
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UiFormTestRunRequest' }
      responses:
        '200':
          description: Kết quả bộ test.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UiFormTestRunResult' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /ui/layouts
  /ui/layouts/home:
    get:
      tags: [Bố cục trang]
      operationId: getHomeLayout
      summary: Bố cục trang chủ "Việc của tôi hôm nay"
      description: >-
        Trả cây SDUI của trang chủ từ UI Pack hiện hành, đã lọc theo vai trò trong ngữ cảnh phân công
        đang chọn (biểu thức `visibleWhen` được máy chủ đánh giá trước; trình duyệt chỉ đánh giá lại để
        phản hồi nhanh). Dữ liệu từng khối lấy từ API của module tương ứng.
      x-mission:
        qt: [QT-00]
        scr: [SCR-0002]
        owner: MOD-08
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        source: TL-02a SCR-0002 "Tải trang"; ma trận SCR-0002.xem
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Bố cục trang chủ.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HomeLayout' }
        '304':
          description: Bố cục không đổi so với `If-None-Match`.
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

components:
  securitySchemes:
    keycloak: { $ref: '../common/common.yaml#/components/securitySchemes/keycloak' }
  parameters:
    Year:
      name: year
      in: query
      required: true
      description: Năm dương lịch.
      schema: { type: integer, minimum: 2020, maximum: 2100, examples: [2026] }
    YearOptional:
      name: year
      in: query
      description: Năm dương lịch; bỏ trống thì trả mọi năm.
      schema: { type: integer, minimum: 2020, maximum: 2100, examples: [2026] }
    LockOrderIdPath:
      name: oid
      in: path
      required: true
      description: Mã lệnh khoá kỳ (`config.period_lock_order.id`).
      schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    FlagKeyPath:
      name: key
      in: path
      required: true
      description: Mã cờ tính năng (`config.feature_flag.flag_key`).
      schema: { type: string, maxLength: 100, pattern: '^[a-z0-9][a-z0-9._-]*$', examples: ['ai.weeklySummary'] }
    UiPackVersionPath:
      name: v
      in: path
      required: true
      description: Phiên bản ngữ nghĩa của UI Pack (`config.ui_pack_version.version`).
      schema: { type: string, maxLength: 32, examples: ['1.8.0'] }
    FormKeyPath:
      name: key
      in: path
      required: true
      description: Khoá biểu mẫu (`config.form_schema.form_key`).
      schema: { type: string, maxLength: 64, pattern: '^[a-z0-9][a-z0-9-]*$', examples: ['phieu-vc-yte'] }
    FormVersionPath:
      name: v
      in: path
      required: true
      description: Phiên bản biểu mẫu (`config.form_schema.version`).
      schema: { type: string, maxLength: 32, examples: ['12'] }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: ETag đã lưu ở client; khớp thì máy chủ trả 304.
      schema: { type: string, examples: ['"uipack-1.8.0-9f2c"'] }

  schemas:
    # ------------------------------------------------------------ Tenant
    TenancyModel:
      description: >-
        Mô hình thuê bao trong lần gắn cell (`registry.tenant_cell.tenancy_model`, CHECK chữ thường như
        TL-02a). `registry.tenant.tenancy_model` viết hoa và có thêm `AIRGAP`; hợp đồng theo TL-02a.
      type: string
      enum: [silo, bridge, pool]
    TenantStatus:
      description: Trạng thái vòng đời tenant (`registry.tenant.status`, TL-02a QT-01 cộng `DANG_CHUYEN_CELL` của TL-03).
      type: string
      enum: [KHOI_TAO, DANG_CAP_PHAT, DANG_CAU_HINH, SAN_SANG, DANG_VAN_HANH, TAM_NGUNG, DANG_CHUYEN_CELL, DA_CHAM_DUT]
    TenantSector:
      description: Nhóm khách hàng (`registry.tenant.sector`).
      type: string
      enum: [DANG, CHINH_QUYEN, SU_NGHIEP, TRUONG_HOC, BENH_VIEN, LLVT, DOANH_NGHIEP]
    TenantKekMode:
      description: >-
        Loại khoá mã hoá (SCR-0102 trường 9): riêng theo tenant hoặc dùng chung của cell; silo bắt buộc
        riêng (suy luận tên giá trị, TL-03 chỉ có cột `kek_ref`).
      type: string
      enum: [RIENG, DUNG_CHUNG_CELL]
    TenantStaffSourceType:
      description: Nguồn nhân sự (SCR-0102 trường 13; suy luận tên giá trị).
      type: string
      enum: [CSDL_CBCCVC, CSDL_DANG_VIEN, SCIM]
    ConfigTenantRow:
      description: Một dòng của bảng tenant trên SCR-0101.
      type: object
      required: [id, code, name, domain, cellCode, tenancyModel, accountCount, status]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 32, description: '`registry.tenant.code`' }
        name: { type: string, maxLength: 200, description: '`registry.tenant.name`' }
        domain: { type: string, maxLength: 253, description: 'Tên miền chính (`registry.tenant_domain.domain`)' }
        cellCode: { type: string, maxLength: 16, description: 'Mã cell, dạng `CELL-xxx`' }
        tenancyModel: { $ref: '#/components/schemas/TenancyModel' }
        accountCount: { type: integer, minimum: 0, description: 'Số tài khoản, đồng bộ từ cell' }
        policyPacks:
          type: array
          description: Policy Pack đang gắn, dạng "tên vX.Y" theo luồng.
          items: { type: string }
        uiPack: { type: string, description: 'UI Pack đang dùng, dạng "tên vX.Y"' }
        status: { $ref: '#/components/schemas/TenantStatus' }
        onboardingStep:
          type: [integer, 'null']
          minimum: 1
          maximum: 6
          description: Bước wizard hiện tại khi đang khởi tạo (MSG-01-02); `null` khi đã vận hành (suy luận).
      examples:
        - id: 0192f0a1-3b2c-7d4e-8f50-6a7b8c9d0e11
          code: thainguyen
          name: Tỉnh Thái Nguyên
          domain: thainguyen.okr.viettel.vn
          cellCode: CELL-G2
          tenancyModel: bridge
          accountCount: 0
          policyPacks: ['Khối Đảng · Quy định mới v2.0', 'Nhà nước · NĐ 335 v1.3']
          uiPack: Mặc định v3.0
          status: DANG_CAP_PHAT
          onboardingStep: 4
    CellLoad:
      description: Tải của một cell tính bằng số tài khoản chia sức chứa thiết kế (SCR-0101 trường 9).
      type: object
      required: [cellCode, accountCount, capacityAccounts, loadPercent]
      properties:
        cellCode: { type: string }
        accountCount: { type: integer, minimum: 0 }
        capacityAccounts: { type: integer, minimum: 1, description: '`registry.cell.capacity_accounts`' }
        loadPercent: { type: number, minimum: 0, maximum: 100 }
        overThreshold: { type: boolean, description: 'Vượt ngưỡng 85% (MSG-01-01, BR-01-02)' }
    ConfigTenantSummary:
      description: Bốn chỉ số đầu trang và tải theo cell của SCR-0101.
      type: object
      required: [activeTenants, tenantLimit, totalAccounts, accountLimit, onboardingTenants, cellCount]
      properties:
        activeTenants: { type: integer, minimum: 0, description: 'Số tenant `DANG_VAN_HANH`' }
        tenantLimit: { type: integer, description: 'Giới hạn thiết kế, 5.000' }
        totalAccounts: { type: integer, minimum: 0 }
        accountLimit: { type: integer, description: 'Giới hạn thiết kế, 6 triệu (NFR-01)' }
        onboardingTenants: { type: integer, minimum: 0, description: 'Số tenant đang khởi tạo' }
        cellCount: { type: integer, minimum: 0 }
        cellLoads:
          type: array
          items: { $ref: '#/components/schemas/CellLoad' }
    ConfigTenantPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ConfigTenantRow' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
        summary: { $ref: '#/components/schemas/ConfigTenantSummary' }
      examples:
        - items:
            - id: 0192f0a1-3b2c-7d4e-8f50-6a7b8c9d0e11
              code: thainguyen
              name: Tỉnh Thái Nguyên
              domain: thainguyen.okr.viettel.vn
              cellCode: CELL-G2
              tenancyModel: bridge
              accountCount: 0
              status: DANG_CAP_PHAT
              onboardingStep: 4
          nextCursor: eyJjIjoiMDE5MmYwYTEifQ
          summary:
            activeTenants: 1284
            tenantLimit: 5000
            totalAccounts: 2418760
            accountLimit: 6000000
            onboardingTenants: 3
            cellCount: 7
            cellLoads:
              - { cellCode: CELL-G2, accountCount: 640000, capacityAccounts: 1000000, loadPercent: 64, overThreshold: false }
    TenantPolicyBinding:
      description: Policy Pack gốc gắn theo luồng (SCR-0102 trường 10; `policy.policy_binding.pack_version_id`).
      type: object
      required: [flow, packVersionId]
      properties:
        flow: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        packVersionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        packCode: { type: string, readOnly: true }
        version: { type: string, readOnly: true }
    TenantIdp:
      description: >-
        IdP của tenant (`registry.tenant_idp`). TL-03 chỉ cho `OIDC`, `SAML`; LDAP liên kết mà TL-02a
        nhắc tới chưa có trong CHECK nên chưa đưa vào.
      type: object
      required: [idpAlias, protocol, issuer]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        idpAlias: { type: string, maxLength: 64 }
        protocol: { type: string, enum: [OIDC, SAML] }
        issuer: { type: string, maxLength: 255 }
        isVneid: { type: boolean, default: false }
        emailDomains:
          type: array
          items: { type: string, maxLength: 253 }
        status: { type: string, enum: [HOAT_DONG, TAM_DUNG], readOnly: true }
        lastTestedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        lastTestOk: { type: boolean, readOnly: true, description: 'Kết quả lần kiểm tra kết nối gần nhất (suy luận)' }
    TenantStaffSource:
      description: Nguồn nhân sự của tenant (SCR-0102 trường 13; `integ.connector`).
      type: object
      required: [type]
      properties:
        type: { $ref: '#/components/schemas/TenantStaffSourceType' }
        connectorId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        connected: { type: boolean, readOnly: true, description: 'Có kết nối hợp lệ' }
    TenantAdminContact:
      description: Đầu mối quản trị tenant (dữ liệu cá nhân).
      type: object
      required: [fullName, email]
      properties:
        fullName: { type: string, maxLength: 200, x-classification: C2 }
        email: { type: string, format: email, maxLength: 254, x-classification: C2 }
        phone: { type: string, maxLength: 20, x-classification: C2 }
    ReadinessCheck:
      description: Một mục kiểm tra tổng thể ở bước 6 (QT-01 bước 9).
      type: object
      required: [code, passed]
      properties:
        code:
          type: string
          enum: [CAPACITY, DOMAIN, TLS, POLICY_PACK_GOLDEN, IDP, ORG_TREE, HIGH_DISCREPANCY]
          description: Mã mục kiểm tra (suy luận tên giá trị).
        passed: { type: boolean }
        detail: { type: string }
    ConfigTenant:
      description: Chi tiết tenant và cấu hình wizard khởi tạo (SCR-0102).
      type: object
      required: [id, code, name, status, flows, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 32, pattern: '^[a-z0-9_]+$' }
        name: { type: string, maxLength: 200 }
        sector: { $ref: '#/components/schemas/TenantSector' }
        onboardingCode: { type: string, pattern: '^ONB-[0-9]{4}-[0-9]{4}$', readOnly: true }
        contractRef: { type: string, maxLength: 50 }
        contractValidTo: { $ref: '../common/common.yaml#/components/schemas/Date' }
        flows:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        expectedAccounts: { type: integer, minimum: 1 }
        expectedUnits: { type: integer, minimum: 1, description: 'Số đơn vị dự kiến (suy luận cột)' }
        maxAccounts: { type: integer, minimum: 1 }
        accountCount: { type: integer, minimum: 0, readOnly: true }
        tenancyModel: { $ref: '#/components/schemas/TenancyModel' }
        suggestedTenancyModel: { allOf: [{ $ref: '#/components/schemas/TenancyModel' }], readOnly: true, description: 'Gợi ý theo quy mô và BR-01-01' }
        cellCode: { type: string, maxLength: 16 }
        domain: { type: string, maxLength: 253 }
        dataRegion: { type: string, maxLength: 32 }
        kekMode: { $ref: '#/components/schemas/TenantKekMode' }
        policyBindings:
          type: array
          items: { $ref: '#/components/schemas/TenantPolicyBinding' }
        uiPackVersionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        idps:
          type: array
          items: { $ref: '#/components/schemas/TenantIdp' }
        staffSources:
          type: array
          items: { $ref: '#/components/schemas/TenantStaffSource' }
        adminContact: { $ref: '#/components/schemas/TenantAdminContact' }
        status: { $ref: '#/components/schemas/TenantStatus' }
        onboardingStep: { type: [integer, 'null'], minimum: 1, maximum: 6, readOnly: true }
        readinessChecks:
          type: array
          readOnly: true
          items: { $ref: '#/components/schemas/ReadinessCheck' }
        provisionJobId: { type: [string, 'null'], readOnly: true, description: 'Job saga cấp phát gần nhất' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
        createdAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        updatedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
      examples:
        - id: 0192f0a1-3b2c-7d4e-8f50-6a7b8c9d0e11
          code: thainguyen
          name: Tỉnh Thái Nguyên
          sector: CHINH_QUYEN
          onboardingCode: ONB-2026-0318
          contractRef: HĐ-2026/VTS-TN-118
          flows: [DANG, NHA_NUOC]
          expectedAccounts: 98420
          expectedUnits: 1260
          maxAccounts: 110000
          accountCount: 0
          tenancyModel: bridge
          suggestedTenancyModel: bridge
          cellCode: CELL-G2
          domain: thainguyen.okr.viettel.vn
          dataRegion: HOALAC
          kekMode: RIENG
          policyBindings:
            - { flow: DANG, packVersionId: 0192e1c4-5d6e-7f80-9a1b-2c3d4e5f6a70, packCode: khoi-dang/quy-dinh-moi, version: '2.0' }
            - { flow: NHA_NUOC, packVersionId: 0192e1c4-5d6e-7f80-9a1b-2c3d4e5f6a71, packCode: nn-335, version: '1.3' }
          uiPackVersionId: 0192e2d5-6e7f-7a81-8b2c-3d4e5f6a7b80
          status: KHOI_TAO
          onboardingStep: 2
          rowVersion: 3
          createdAt: '2026-10-19T08:30:00+07:00'
          updatedAt: '2026-10-19T09:05:00+07:00'
    ConfigTenantCreate:
      description: Thông tin bước 1 của wizard.
      type: object
      required: [code, name, sector, contractRef, flows, expectedAccounts, adminContact]
      properties:
        code: { type: string, maxLength: 32, pattern: '^[a-z0-9_]+$' }
        name: { type: string, maxLength: 200 }
        sector: { $ref: '#/components/schemas/TenantSector' }
        contractRef: { type: string, maxLength: 50 }
        contractValidTo: { $ref: '../common/common.yaml#/components/schemas/Date' }
        flows:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        expectedAccounts: { type: integer, minimum: 1 }
        expectedUnits: { type: integer, minimum: 1 }
        adminContact: { $ref: '#/components/schemas/TenantAdminContact' }
      examples:
        - code: thainguyen
          name: Tỉnh Thái Nguyên
          sector: CHINH_QUYEN
          contractRef: HĐ-2026/VTS-TN-118
          flows: [DANG, NHA_NUOC]
          expectedAccounts: 98420
          expectedUnits: 1260
          adminContact: { fullName: Trần Thị Hồng, email: quantri@thainguyen.gov.vn }
    ConfigTenantPatch:
      description: Thay đổi một phần cấu hình đang soạn (JSON Merge Patch); mọi trường tuỳ chọn.
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        contractRef: { type: string, maxLength: 50 }
        contractValidTo: { $ref: '../common/common.yaml#/components/schemas/Date' }
        flows:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        expectedAccounts: { type: integer, minimum: 1 }
        expectedUnits: { type: integer, minimum: 1 }
        tenancyModel: { $ref: '#/components/schemas/TenancyModel' }
        cellCode: { type: string, maxLength: 16 }
        domain: { type: string, maxLength: 253 }
        dataRegion: { type: string, maxLength: 32 }
        kekMode: { $ref: '#/components/schemas/TenantKekMode' }
        policyBindings:
          type: array
          items: { $ref: '#/components/schemas/TenantPolicyBinding' }
        uiPackVersionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        idps:
          type: array
          items: { $ref: '#/components/schemas/TenantIdp' }
        staffSources:
          type: array
          items: { $ref: '#/components/schemas/TenantStaffSource' }
        adminContact: { $ref: '#/components/schemas/TenantAdminContact' }
      examples:
        - tenancyModel: bridge
          cellCode: CELL-G2
          domain: thainguyen.okr.viettel.vn
          dataRegion: HOALAC
          kekMode: RIENG
    ConfigTenantActivateRequest:
      description: Ghi chú khi kích hoạt hoặc kích hoạt lại sau tạm ngừng.
      type: object
      properties:
        reason: { type: string, maxLength: 500, description: 'Lý do, số văn bản (ghi `registry.tenant_status_log.reason`)' }
    ConfigTenantExportRequest:
      description: Bộ lọc và định dạng tệp xuất (định dạng là suy luận).
      type: object
      properties:
        cell: { type: string, maxLength: 16 }
        model: { $ref: '#/components/schemas/TenancyModel' }
        status: { $ref: '#/components/schemas/TenantStatus' }
        format: { type: string, enum: [XLSX, CSV], default: XLSX }
    TenantIdpTestRequest:
      description: IdP cần kiểm tra; gửi `idpAlias` của IdP đã lưu hoặc cấu hình đang soạn.
      type: object
      properties:
        idpAlias: { type: string, maxLength: 64 }
        idp: { $ref: '#/components/schemas/TenantIdp' }
      examples:
        - idpAlias: idp-tinh-thainguyen
    TenantIdpTestResult:
      type: object
      required: [success, checkedAt]
      properties:
        success: { type: boolean }
        protocol: { type: string, enum: [OIDC, SAML] }
        latencyMs: { type: integer, minimum: 0 }
        message: { type: string, description: 'Mô tả kết quả hoặc lỗi, tiếng Việt' }
        checkedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
      examples:
        - success: true
          protocol: OIDC
          latencyMs: 412
          message: Đã lấy được tài liệu khám phá OIDC và khoá ký của IdP.
          checkedAt: '2026-10-19T10:12:00+07:00'

    # ------------------------------------------------------------ Bảo mật
    SuspiciousAccessReport:
      description: Báo cáo truy cập bất thường từ cảnh báo thiết bị mới.
      type: object
      properties:
        loginEventId: { type: string, maxLength: 64, description: 'Mã sự kiện đăng nhập của Keycloak trong cảnh báo' }
        occurredAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        note: { type: string, maxLength: 1000, x-classification: C2 }
      examples:
        - loginEventId: 7d2a9c1e-4b5f-4e8a-9c3d-1f2e3a4b5c6d
          occurredAt: '2026-10-19T06:42:00+07:00'
          note: Tôi không đăng nhập vào thời điểm này.
    SuspiciousAccessResult:
      type: object
      required: [reportId, sessionsRevoked, passwordChangeRequired]
      properties:
        reportId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        sessionsRevoked: { type: integer, minimum: 0 }
        passwordChangeRequired: { type: boolean }
        passwordChangeUrl: { type: string, format: uri-reference, description: 'Luồng đổi mật khẩu của Keycloak' }
      examples:
        - reportId: 0192f3b4-1a2b-7c3d-8e4f-5a6b7c8d9e01
          sessionsRevoked: 3
          passwordChangeRequired: true
          passwordChangeUrl: /realms/mission/login-actions/required-action?execution=UPDATE_PASSWORD

    # ------------------------------------------------------------ Lịch
    HolidayDayKind:
      description: Loại ngày (`config.holiday_calendar.day_kind`).
      type: string
      enum: [NGHI_LE, NGHI_BU, LAM_BU]
    HolidayScope:
      description: Lịch quốc gia hoặc lịch riêng tenant (`config.holiday_calendar.scope`).
      type: string
      enum: [QUOC_GIA, TENANT]
    HolidayCalendarDay:
      type: object
      required: [id, calendarDate, dayKind, name, scope, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        calendarDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        dayKind: { $ref: '#/components/schemas/HolidayDayKind' }
        name: { type: string, maxLength: 100 }
        scope: { $ref: '#/components/schemas/HolidayScope' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - id: 0192f4c5-2b3c-7d4e-9f50-6a7b8c9d0e12
          calendarDate: '2026-09-02'
          dayKind: NGHI_LE
          name: Quốc khánh
          scope: QUOC_GIA
          rowVersion: 0
    HolidayCalendarDayInput:
      type: object
      required: [calendarDate, dayKind, name]
      properties:
        calendarDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        dayKind: { $ref: '#/components/schemas/HolidayDayKind' }
        name: { type: string, maxLength: 100 }
      examples:
        - calendarDate: '2026-12-26'
          dayKind: LAM_BU
          name: Làm bù cho ngày nghỉ 02/01/2027
    HolidayCalendarDayPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HolidayCalendarDay' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    WorkingCalendar:
      description: Lịch ngày làm việc của tenant trong một năm (lịch quốc gia hợp lịch riêng).
      type: object
      required: [year, days]
      properties:
        year: { type: integer }
        weekendDays:
          type: array
          description: Thứ trong tuần là ngày nghỉ, ISO 8601 (6 = thứ Bảy, 7 = Chủ nhật) (suy luận).
          items: { type: integer, minimum: 1, maximum: 7 }
        days:
          type: array
          description: Ngày đặc biệt trong năm.
          items:
            type: object
            required: [date, dayKind, name, scope]
            properties:
              date: { $ref: '../common/common.yaml#/components/schemas/Date' }
              dayKind: { $ref: '#/components/schemas/HolidayDayKind' }
              name: { type: string }
              scope: { $ref: '#/components/schemas/HolidayScope' }
        workingDaysByMonth:
          type: array
          description: Số ngày làm việc của 12 tháng (suy luận).
          minItems: 12
          maxItems: 12
          items: { type: integer, minimum: 0 }
      examples:
        - year: 2026
          weekendDays: [6, 7]
          days:
            - { date: '2026-09-02', dayKind: NGHI_LE, name: Quốc khánh, scope: QUOC_GIA }
            - { date: '2026-12-26', dayKind: LAM_BU, name: Làm bù cho ngày nghỉ 02/01/2027, scope: TENANT }
          workingDaysByMonth: [21, 15, 22, 21, 19, 22, 23, 21, 20, 22, 21, 23]

    # ------------------------------------------------------------ Cờ tính năng
    FeatureFlagRollout:
      description: Quy tắc bật dần (`config.feature_flag.rollout`).
      type: object
      properties:
        unitIds:
          type: array
          description: Chỉ bật cho các đơn vị này và cấp dưới; trống là toàn tenant.
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        percent: { type: integer, minimum: 0, maximum: 100, description: 'Tỷ lệ người dùng được bật' }
    FeatureFlag:
      type: object
      required: [flagKey, enabled, rowVersion]
      properties:
        flagKey: { type: string, maxLength: 100 }
        description: { type: string, readOnly: true, description: 'Mô tả cờ do nền tảng khai báo (suy luận)' }
        enabled: { type: boolean }
        rollout: { $ref: '#/components/schemas/FeatureFlagRollout' }
        validFrom: { type: ['string', 'null'], format: date-time }
        validTo: { type: ['string', 'null'], format: date-time }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - flagKey: ai.weeklySummary
          description: Khối "Tóm tắt tuần" do AI tạo trên trang chủ.
          enabled: true
          rollout: { unitIds: [], percent: 100 }
          validFrom: null
          validTo: null
          rowVersion: 2
    FeatureFlagInput:
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }
        rollout: { $ref: '#/components/schemas/FeatureFlagRollout' }
        validFrom: { type: ['string', 'null'], format: date-time }
        validTo: { type: ['string', 'null'], format: date-time }
      examples:
        - enabled: false
    FeatureFlagPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FeatureFlag' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }

    # ------------------------------------------------------------ Ngưỡng cảnh báo
    ConfigAnomalySignalCode:
      description: Tám dấu hiệu bất thường (`oversight.anomaly_alert.signal_code`).
      type: string
      enum: [TU_CHAM_CAO, CAO_BANG, MUC_TIEU_DE, MINH_CHUNG_TRUNG, CAP_NHAT_DON, SUA_SAU_KHOA, CHE_NHO, MIEN_TRU_LAP]
    AnomalySignalThreshold:
      description: Ngưỡng của một dấu hiệu; tham số theo từng dấu hiệu nên để dạng ánh xạ tên → số (suy luận).
      type: object
      required: [signalCode, enabled, params]
      properties:
        signalCode: { $ref: '#/components/schemas/ConfigAnomalySignalCode' }
        enabled: { type: boolean }
        params:
          type: object
          additionalProperties: { type: number }
          description: 'Ví dụ `{ "consecutiveQuarters": 3, "scoreGap": 5 }` cho dấu hiệu 1.'
    AnomalyThresholdSet:
      description: Phiên bản ngưỡng hiện hành của tenant (lưu trong `config.tenant_setting`).
      type: object
      required: [version, signals, rowVersion]
      properties:
        version: { type: integer, minimum: 1 }
        reason: { type: string }
        updatedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        updatedBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        signals:
          type: array
          minItems: 8
          maxItems: 8
          items: { $ref: '#/components/schemas/AnomalySignalThreshold' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - version: 3
          reason: Giảm ngưỡng dồn cập nhật cuối kỳ từ 70% xuống 60% theo kết quả quý III.
          updatedAt: '2026-10-05T14:20:00+07:00'
          updatedBy: { id: 0192f5d6-3c4d-7e5f-8a61-7b8c9d0e1f23, name: Lê Minh Châu }
          signals:
            - { signalCode: TU_CHAM_CAO, enabled: true, params: { consecutiveQuarters: 3, scoreGap: 5 } }
            - { signalCode: CAO_BANG, enabled: true, params: { sameLevelPercent: 90 } }
            - { signalCode: MUC_TIEU_DE, enabled: true, params: { earlyWeeks: 2, belowPreviousPercent: 20 } }
            - { signalCode: MINH_CHUNG_TRUNG, enabled: true, params: { ocrSimilarityPercent: 95 } }
            - { signalCode: CAP_NHAT_DON, enabled: true, params: { lastDaysPercent: 60, lastDays: 3 } }
            - { signalCode: SUA_SAU_KHOA, enabled: true, params: {} }
            - { signalCode: CHE_NHO, enabled: true, params: { taskIncreasePercent: 50 } }
            - { signalCode: MIEN_TRU_LAP, enabled: true, params: { exemptionsIn2Quarters: 3 } }
          rowVersion: 3
    AnomalyThresholdUpdate:
      type: object
      required: [signals, reason]
      properties:
        signals:
          type: array
          minItems: 1
          maxItems: 8
          items: { $ref: '#/components/schemas/AnomalySignalThreshold' }
        reason: { type: string, minLength: 20, maxLength: 2000, description: 'Lý do thay đổi (BR-14-09); độ dài tối thiểu là suy luận' }

    # ------------------------------------------------------------ Kỳ đánh giá
    PeriodKind:
      description: Loại kỳ (`config.period.kind`).
      type: string
      enum: [THANG, QUY, NAM, NAM_HOC]
    PeriodFlow:
      description: Luồng áp dụng của kỳ (`config.period.flow`); khác `Flow` vì có `CA_HAI`.
      type: string
      enum: [DANG, NHA_NUOC, CA_HAI]
    PeriodMilestones:
      description: Lịch mốc của kỳ (`config.period.milestones`, TL-02a SCR-0801 trường 2).
      type: object
      properties:
        planApprovalDeadline: { $ref: '../common/common.yaml#/components/schemas/Date' }
        evidenceDeadline: { $ref: '../common/common.yaml#/components/schemas/Date' }
        acceptanceBacklogDeadline: { $ref: '../common/common.yaml#/components/schemas/Date' }
        plannedLockDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
    PeriodPinnedPolicyPack:
      description: Phiên bản Policy Pack ghim cho kỳ (`policy.policy_binding` theo `period_id`).
      type: object
      required: [flow, packVersionId]
      properties:
        flow: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        packVersionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        packCode: { type: string }
        version: { type: string }
    PeriodLockOrderStatus:
      description: Trạng thái lệnh khoá kỳ (`config.period_lock_order.status`).
      type: string
      enum: [NHAP, CHO_DUYET, DA_DUYET, DANG_CHAY, HOAN_TAT, DA_HUY]
    PeriodLockOrder:
      description: Lệnh khoá kỳ (`config.period_lock_order`).
      type: object
      required: [id, periodId, status, requestedBy, basisDoc, idempotencyKey, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        status: { $ref: '#/components/schemas/PeriodLockOrderStatus' }
        basisDoc: { type: string, maxLength: 200, description: 'Văn bản căn cứ' }
        plannedLockAt: { type: ['string', 'null'], format: date-time, description: 'Thời điểm dự kiến khởi chạy (suy luận cột)' }
        requestedBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        requestedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        approvedBy:
          oneOf:
            - { $ref: '../common/common.yaml#/components/schemas/Ref' }
            - { type: 'null' }
        approvedAt: { type: ['string', 'null'], format: date-time }
        startedBy:
          oneOf:
            - { $ref: '../common/common.yaml#/components/schemas/Ref' }
            - { type: 'null' }
        startedAt: { type: ['string', 'null'], format: date-time }
        sagaId: { type: ['string', 'null'], format: uuid, description: '`flowable.saga_instance.id`' }
        idempotencyKey: { type: string, maxLength: 64, readOnly: true, description: 'Khoá chống khởi chạy trùng, dạng `CK-{năm}{kỳ}`' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - id: 0192f6e7-4d5e-7f60-8b72-8c9d0e1f2a34
          periodId: 0192f6e7-0000-7f60-8b72-8c9d0e1f2a01
          status: DANG_CHAY
          basisDoc: Thông báo 21-TB/ĐUK ngày 28/12/2026
          plannedLockAt: '2027-01-04T07:00:00+07:00'
          requestedBy: { id: 0192f6e7-1111-7f60-8b72-8c9d0e1f2a02, name: Hoàng Đức Dũng }
          requestedAt: '2026-12-29T09:15:00+07:00'
          approvedBy: { id: 0192f6e7-2222-7f60-8b72-8c9d0e1f2a03, name: Phạm Quang Huy }
          approvedAt: '2026-12-30T16:40:00+07:00'
          startedBy: { id: 0192f6e7-3333-7f60-8b72-8c9d0e1f2a04, name: Vũ Thị Lan }
          startedAt: '2027-01-04T07:02:00+07:00'
          sagaId: 0192f6e7-5e6f-7a81-9c83-9d0e1f2a3b45
          idempotencyKey: CK-2026Q4
          rowVersion: 4
    Period:
      description: Kỳ đánh giá (`config.period`).
      type: object
      required: [id, code, name, kind, flow, startDate, endDate, status, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 32, description: 'Ví dụ `2026-Q4`, `2026`, `2027-03`' }
        name: { type: string, maxLength: 100 }
        kind: { $ref: '#/components/schemas/PeriodKind' }
        flow: { $ref: '#/components/schemas/PeriodFlow' }
        parentPeriodId: { type: ['string', 'null'], format: uuid }
        startDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        endDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        periodBucket: { type: integer, readOnly: true, description: 'Giá trị phân vùng, ví dụ 20264' }
        planDeadline: { type: ['string', 'null'], format: date }
        submissionDeadline: { type: ['string', 'null'], format: date }
        status: { $ref: '../common/common.yaml#/components/schemas/PeriodStatus' }
        notStarted: { type: boolean, readOnly: true, description: 'Kỳ đã tạo nhưng chưa tới ngày bắt đầu (hiển thị "Đã tạo")' }
        lockedAt: { type: ['string', 'null'], format: date-time }
        lockedBy:
          oneOf:
            - { $ref: '../common/common.yaml#/components/schemas/Ref' }
            - { type: 'null' }
        lockSagaId: { type: ['string', 'null'], format: uuid }
        reopenCount: { type: integer, minimum: 0 }
        milestones: { $ref: '#/components/schemas/PeriodMilestones' }
        pinnedPolicyPacks:
          type: array
          items: { $ref: '#/components/schemas/PeriodPinnedPolicyPack' }
        currentLockOrder:
          oneOf:
            - { $ref: '#/components/schemas/PeriodLockOrder' }
            - { type: 'null' }
        warnings:
          type: array
          readOnly: true
          description: Cảnh báo lịch, ví dụ khoá muộn hơn tham số (BR-08-12).
          items: { type: string }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - id: 0192f6e7-0000-7f60-8b72-8c9d0e1f2a01
          code: 2026-Q4
          name: Quý IV/2026
          kind: QUY
          flow: CA_HAI
          parentPeriodId: 0192f6e7-0000-7f60-8b72-8c9d0e1f2a00
          startDate: '2026-10-01'
          endDate: '2026-12-31'
          periodBucket: 20264
          planDeadline: '2026-10-09'
          submissionDeadline: '2027-01-08'
          status: DANG_KHOA
          notStarted: false
          lockedAt: null
          lockedBy: null
          lockSagaId: 0192f6e7-5e6f-7a81-9c83-9d0e1f2a3b45
          reopenCount: 0
          milestones:
            planApprovalDeadline: '2026-10-09'
            evidenceDeadline: '2026-12-31'
            acceptanceBacklogDeadline: '2027-01-03'
            plannedLockDate: '2027-01-04'
          pinnedPolicyPacks:
            - { flow: DANG, packVersionId: 0192e1c4-5d6e-7f80-9a1b-2c3d4e5f6a70, packCode: khoi-dang/quy-dinh-moi, version: '2.0' }
          warnings: []
          rowVersion: 12
    PeriodPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Period' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    PeriodCreate:
      type: object
      required: [code, name, kind, flow, startDate, endDate]
      properties:
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 100 }
        kind: { $ref: '#/components/schemas/PeriodKind' }
        flow: { $ref: '#/components/schemas/PeriodFlow' }
        parentPeriodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        startDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        endDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        planDeadline: { $ref: '../common/common.yaml#/components/schemas/Date' }
        submissionDeadline: { $ref: '../common/common.yaml#/components/schemas/Date' }
        milestones: { $ref: '#/components/schemas/PeriodMilestones' }
      examples:
        - code: 2027-Q1
          name: Quý I/2027
          kind: QUY
          flow: CA_HAI
          parentPeriodId: 0192f6e7-0000-7f60-8b72-8c9d0e1f2a10
          startDate: '2027-01-01'
          endDate: '2027-03-31'
          planDeadline: '2027-01-08'
    PeriodLockOrderCreate:
      type: object
      required: [basisDoc]
      properties:
        basisDoc: { type: string, maxLength: 200 }
        plannedLockAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
      examples:
        - basisDoc: Thông báo 21-TB/ĐUK ngày 28/12/2026
          plannedLockAt: '2027-01-04T07:00:00+07:00'
    PeriodLockOrderApprove:
      type: object
      properties:
        comment: { type: string, maxLength: 1000 }
    PeriodLockStart:
      type: object
      required: [lockOrderId]
      properties:
        lockOrderId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
      examples:
        - lockOrderId: 0192f6e7-4d5e-7f60-8b72-8c9d0e1f2a34
    PeriodLockControl:
      description: Ghi chú kèm hành động điều khiển (ghi sổ cái, BR-08-10).
      type: object
      properties:
        comment: { type: string, maxLength: 1000 }
    PeriodLockRetryRequest:
      type: object
      properties:
        profileIds:
          type: array
          description: Chỉ chạy lại các hồ sơ này; bỏ trống là toàn bộ hàng đợi lỗi.
          maxItems: 1000
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    PeriodLockCancelRequestInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 20, maxLength: 2000, description: 'Lý do huỷ (độ dài tối thiểu là suy luận)' }
      examples:
        - reason: Phát hiện sai sót cấu hình trọng số khối 3 khi đang tính điểm; cần sửa Policy Pack trước khi khoá lại.
    SagaStatus:
      description: Trạng thái saga (`flowable.saga_instance.status`).
      type: string
      enum: [DANG_CHAY, CHO_SU_KIEN, HOAN_TAT, DANG_BU_TRU, DA_BU_TRU, LOI_CAN_XU_LY]
    PeriodLockStepStatus:
      description: Trạng thái một bước saga (`config.period_lock_step.status`).
      type: string
      enum: [CHO, DANG_CHAY, DAT, DAT_CO_CANH_BAO, LOI, DA_BU_TRU]
    PeriodLockStep:
      description: Một bước saga chiếu từ `config.period_lock_step`.
      type: object
      required: [stepNo, name, status]
      properties:
        stepNo: { type: integer, minimum: 0, maximum: 5 }
        name: { type: string, maxLength: 64 }
        status: { $ref: '#/components/schemas/PeriodLockStepStatus' }
        startedAt: { type: ['string', 'null'], format: date-time }
        finishedAt: { type: ['string', 'null'], format: date-time }
        resultSummary:
          type: object
          additionalProperties: true
          description: Tóm tắt kết quả (số hồ sơ, cảnh báo).
        compensationAction: { type: ['string', 'null'], maxLength: 48 }
        compensatedAt: { type: ['string', 'null'], format: date-time }
    PeriodLockCancelState:
      description: Đề nghị huỷ và bù trừ đang có (cột `cancel_requested_by`, `cancel_approved_by`).
      type: object
      required: [requestedBy, requestedAt, reason]
      properties:
        requestedBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        requestedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        reason: { type: string }
        approvedBy:
          oneOf:
            - { $ref: '../common/common.yaml#/components/schemas/Ref' }
            - { type: 'null' }
        approvedAt: { type: ['string', 'null'], format: date-time }
    PeriodLockProgress:
      description: Tiến trình saga khoá kỳ trên SCR-0801.
      type: object
      required: [periodId, lockOrder, sagaStatus, totals, steps, pauseRequested]
      properties:
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        lockOrder: { $ref: '#/components/schemas/PeriodLockOrder' }
        sagaStatus: { $ref: '#/components/schemas/SagaStatus' }
        templateKey: { type: string, description: 'Mẫu saga, ví dụ `chot-ky`' }
        templateVersion: { type: integer }
        pauseRequested: { type: boolean, description: 'Đã đặt cờ tạm dừng sau bước hiện tại' }
        totals:
          type: object
          required: [profiles, scored, failed]
          properties:
            profiles: { type: integer, minimum: 0 }
            scored: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
        ratePerMinute: { type: ['number', 'null'], minimum: 0, description: 'Hồ sơ mỗi phút, tính lại sau mỗi lô' }
        estimatedFinishAt: { type: ['string', 'null'], format: date-time }
        budgetFinishAt: { type: ['string', 'null'], format: date-time, description: 'Hạn theo ngân sách NFR-06; vượt thì MSG-08-04' }
        excludedEvidenceCount: { type: integer, minimum: 0, description: 'Minh chứng không tính trong kỳ (BR-08-05, MSG-08-03)' }
        steps:
          type: array
          minItems: 6
          maxItems: 6
          items: { $ref: '#/components/schemas/PeriodLockStep' }
        cancelRequest:
          oneOf:
