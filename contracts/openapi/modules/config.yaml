        evt: [EVT-21]
        roles: [tenant_admin]
        scope: Tn
        rules: [BR-18-01, BR-18-02, BR-18-05, BR-18-08]
        source: TL-02b SCR-1801 "Gửi duyệt và phát hành"; ma trận SCR-1801.gui-duyet
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
