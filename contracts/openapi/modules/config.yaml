        kích thước ≤ 30 KB gzip, cel-js = cel-java). Đạt thì `CHO_DUYET` và gửi người duyệt qua EVT-21;
        lỗi thì về `NHAP` kèm danh sách lỗi trong job. Trả 202, job loại `TEST_RUN`.
