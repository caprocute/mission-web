# Hợp đồng OpenAPI của MOD-08 `config` (WEB-063, ADR-32 trong BS-02).
# Nguồn:
#   - Baseline mục 7 (EVT-09, EVT-21, EVT-23, EVT-26), 9 (schema config, registry), 9.1 (trạng thái kỳ),
#     10 (vai trò AC), 13 (quy ước API).
#   - TL-01 chương 7 (UI Pack: cấu trúc, registry component, bộ đệm CDN và ETag, CEL, ngân sách 30 KB);
#     TL-01 Phụ lục C mục "Cấu hình nền tảng (MOD-08)".
#   - TL-02a QT-00 SCR-0001 (báo cáo truy cập bất thường), SCR-0002 (bố cục trang chủ);
#     QT-01 SCR-0101, SCR-0102 (BR-01-01..BR-01-04, BR-01-10, MSG-01-01..MSG-01-07);
#     QT-08 SCR-0801 (BR-08-01..BR-08-12, MSG-08-01..MSG-08-08).
#   - TL-02b QT-14 SCR-1401 (ngưỡng phát hiện, BR-14-01, BR-14-09);
#     QT-18 SCR-1801, SCR-1802 (BR-18-01..BR-18-12, MSG-18-01..MSG-18-08); TL-02b ma trận truy vết.
#   - TL-03 schema config: tenant_setting, period, period_status_log, holiday_calendar, ui_pack,
#     ui_pack_version, form_schema, feature_flag, role_binding, period_lock_order, period_lock_step,
#     component_registry; registry.tenant, registry.tenant_cell, registry.tenant_domain,
#     registry.tenant_idp (tham khảo trạng thái tenant); flowable.saga_instance; scoring.score_job;
#     oversight.anomaly_alert.signal_code; TL-03 chương 10 (payload EVT-09, EVT-23, EVT-26).
#   - WEB-058 (đề xuất docs/phan-quyen/de-xuat-quan-tri-vai-tro.md, anh Hiếu duyệt 19/10/2026): SCR-0105,
#     SCR-0106, SCR-0107, BR-01-13..BR-01-18, MSG-01-16..MSG-01-18, EVT-27, bảng bổ sung config.delegation
#     và các cột bổ sung của config.role_binding.
#   - Ma trận phân quyền docs/phan-quyen/ma-tran.json (chức năng SCR-0001, SCR-0002, SCR-0101,
#     SCR-0102, SCR-0801, SCR-1401, SCR-1801, SCR-1802; dòng API config, periods, ui).
openapi: 3.1.0
info:
  title: Mission – Cấu hình nền tảng (MOD-08)
  version: 1.0.0-draft.1
  description: >-
    Hợp đồng của module `config` (MOD-08) trong mission-core với ba tiền tố: `/config` (tenant theo
    QT-01, lịch ngày làm việc và ngày nghỉ, cờ tính năng, ngưỡng cảnh báo bất thường, báo cáo truy cập
    bất thường), `/periods` (kỳ đánh giá và saga khoá kỳ QT-08) và `/ui` (UI Pack, danh mục component
    SDUI, biểu mẫu động, bố cục trang chủ theo QT-18). Tiền tố `/registry` thuộc `platform.yaml`.
    Thao tác ghi khai `Idempotency-Key`; thao tác sửa hoặc chuyển trạng thái khai `If-Match`; tác vụ
    dài trả 202 kèm `Location: /api/v1/jobs/{id}`. Mã lỗi nghiệp vụ dùng tiền tố `CONFIG-`, `PERIOD-`, `UI-`.
servers:
  - url: /api/v1
security:
  - keycloak: []
tags:
  - name: Định nghĩa dashboard
    description: >-
      Kho định nghĩa dashboard tự dựng `config.dashboard_def` (QT-16, SCR-1602) cho analytics-api (SVC-15) gọi
      bằng client credentials; người dùng cuối dùng `/analytics/dashboards*` của `platform.yaml` (CORE-08-17).
  - name: Tuỳ chọn cá nhân
    description: Tuỳ chọn trình bày và bộ lọc đã lưu của chính người dùng (CNH-01, CNH-02, NFR-11).
  - name: Tenant
    description: Danh sách tenant, wizard khởi tạo sáu bước, saga cấp phát, kiểm tra IdP, kích hoạt, xuất danh sách (QT-01, SCR-0101, SCR-0102).
  - name: Bảo mật tài khoản
    description: Báo cáo truy cập bất thường từ cảnh báo đăng nhập thiết bị mới (QT-00, SCR-0001).
  - name: Lịch làm việc
    description: Lịch ngày làm việc của tenant và danh mục ngày nghỉ lễ, nghỉ bù, làm bù (`config.holiday_calendar`).
  - name: Cờ tính năng
    description: Bật tắt tính năng theo tenant (`config.feature_flag`).
  - name: Ngưỡng cảnh báo
    description: Ngưỡng của tám dấu hiệu bất thường, lưu theo phiên bản trong `config.tenant_setting` (QT-14, SCR-1401).
  - name: Kỳ đánh giá
    description: Danh sách, tạo và xem kỳ đánh giá `config.period` (QT-08, SCR-0801).
  - name: Khoá kỳ
    description: Lệnh khoá kỳ, saga chốt kỳ, tiến trình, tạm dừng, chạy lại hồ sơ lỗi, huỷ và bù trừ có hai người duyệt (QT-08, SCR-0801).
  - name: UI Pack
    description: UI Pack hiện hành, phiên bản, xem trước, gửi duyệt, phát hành, quay lui (QT-18, SCR-1801).
  - name: Danh mục component
    description: Danh mục component SDUI được phép theo phiên bản registry (`config.component_registry`).
  - name: Biểu mẫu động
    description: Biểu mẫu JSON Schema kèm quy tắc CEL, phiên bản và bộ test hai engine (QT-18, SCR-1802).
  - name: Bố cục trang
    description: Bố cục SDUI đã phân giải cho trang chủ "Việc của tôi hôm nay" (SCR-0002).
  - name: Vai trò và uỷ quyền
    description: Cấp, duyệt thứ hai, thu hồi vai trò `config.role_binding`, lịch sử quyền và uỷ quyền khi vắng mặt `config.delegation` (QT-01, SCR-0105, SCR-0106, SCR-0107; WEB-058).
  - name: Cấu hình tenant
    description: Cấu hình dạng khoá–giá trị của tenant hoặc ghi đè theo đơn vị (`config.tenant_setting`).

paths:
  # ---------------------------------------------------------------- /config/tenants
  /config/tenants:
    get:
      tags: [Tenant]
      operationId: listConfigTenants
      summary: Danh sách tenant kèm tải theo cell
      description: >-
        Trả danh sách tenant của vùng điều phối toàn cục, lọc theo cell, mô hình thuê bao và trạng thái,
        phân trang con trỏ. Phần `summary` chứa bốn chỉ số đầu trang và tải theo cell của SCR-0101
        (số đếm được SCR yêu cầu nên trả riêng). Cell vượt 85% kèm MSG-01-01.
      x-mission:
        qt: [QT-01]
        scr: [SCR-0101]
        owner: MOD-08
        roles: [platform_admin]
        scope: N
        aal: 2
        source: TL-02a SCR-0101; ma trận SCR-0101.xem
      parameters:
        - name: cell
          in: query
          description: Mã cell, ví dụ `CELL-G2`.
          schema: { type: string, maxLength: 16 }
        - name: model
          in: query
          description: Mô hình thuê bao.
          schema: { $ref: '#/components/schemas/TenancyModel' }
        - name: status
          in: query
          description: Trạng thái tenant.
          schema: { $ref: '#/components/schemas/TenantStatus' }
        - $ref: '../common/common.yaml#/components/parameters/Q'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang tenant và chỉ số tổng hợp.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigTenantPage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    post:
      tags: [Tenant]
      operationId: createConfigTenant
      summary: Khai báo tenant mới (bước 1 của wizard)
      description: >-
        Tạo yêu cầu khởi tạo tenant ở trạng thái `KHOI_TAO`, sinh mã yêu cầu `ONB-yyyy-nnnn`. TL-02
        không ghi API riêng cho bước này (suy luận từ bước 1 QT-01 và quyền POST của AC-01 trong ma trận).
        Tên miền trùng trả 409 mã `CONFIG-409-DOMAIN-TAKEN` (MSG-01-04).
      x-mission:
        qt: [QT-01]
        scr: [SCR-0102]
        owner: MOD-08
        roles: [platform_admin]
        scope: N
        aal: 2
        rules: [BR-01-04]
        source: TL-02a QT-01 bước 1, SCR-0102; ma trận dòng API config (suy luận)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigTenantCreate' }
      responses:
        '201':
          description: Đã tạo yêu cầu khởi tạo.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigTenant' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/tenants/export:
    post:
      tags: [Tenant]
      operationId: exportConfigTenants
      summary: Xuất danh sách tenant
      description: Tạo tác vụ xuất danh sách tenant theo bộ lọc hiện tại; trả 202 và địa chỉ theo dõi.
      x-mission:
        qt: [QT-01]
        scr: [SCR-0101]
        owner: MOD-08
        roles: [platform_admin]
        scope: N
        aal: 2
        source: TL-02a SCR-0101; ma trận SCR-0101.xuat
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigTenantExportRequest' }
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/tenants/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Tenant]
      operationId: getConfigTenant
      summary: Chi tiết tenant và cấu hình wizard
      description: >-
        Trả cấu hình đang soạn hoặc đang vận hành của tenant, bước hiện tại của wizard và kết quả kiểm
        tra tổng thể của bước 6. Quản trị tenant chỉ xem được tenant của mình (bước 4, 5).
      x-mission:
        qt: [QT-01]
        scr: [SCR-0101, SCR-0102]
        owner: MOD-08
        roles: [platform_admin, tenant_admin]
        scope: N (platform_admin), Tn (tenant_admin)
        aal: 2
        source: TL-02a SCR-0101 "Chi tiết", SCR-0102
      responses:
        '200':
          description: Chi tiết tenant.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigTenant' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    patch:
      tags: [Tenant]
      operationId: updateConfigTenant
      summary: Lưu nháp cấu hình tenant
      description: >-
        Lưu cấu hình đang soạn của bất kỳ bước nào (JSON Merge Patch theo RFC 7396). Bước 1, 2, 3 do
        `platform_admin` sửa; bước 4, 5 (IdP, nguồn nhân sự) do `tenant_admin` của tenant sửa. Mã lỗi:
        `CONFIG-422-SILO-REQUIRED` (BR-01-01), `CONFIG-422-CELL-OVER-CAPACITY` (BR-01-02, MSG-01-03),
        `CONFIG-422-POLICY-PACK-NOT-READY` (BR-01-03, MSG-01-05), `CONFIG-422-FLOW-PACK-MISSING`
        (BR-01-04), `CONFIG-409-DOMAIN-TAKEN` (MSG-01-04), `CONFIG-409-VERSION-CONFLICT`.
      x-mission:
        qt: [QT-01]
        scr: [SCR-0102]
        owner: MOD-08
        roles: [platform_admin, tenant_admin]
        scope: N (platform_admin), Tn (tenant_admin)
        aal: 2
        rules: [BR-01-01, BR-01-02, BR-01-03, BR-01-04]
        source: TL-02a SCR-0102 "Lưu nháp"; ma trận SCR-0102.buoc-1-3, SCR-0102.buoc-4-5
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/ConfigTenantPatch' }
      responses:
        '200':
          description: Đã lưu nháp.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigTenant' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    delete:
      tags: [Tenant]
      operationId: cancelConfigTenant
      summary: Huỷ yêu cầu khởi tạo tenant
      description: >-
        Huỷ yêu cầu khi tenant còn `KHOI_TAO`, không cấp phát tài nguyên. Trạng thái khác trả 409 mã
        `CONFIG-409-TENANT-STATE`.
      x-mission:
        qt: [QT-01]
        scr: [SCR-0102]
        owner: MOD-08
        roles: [platform_admin]
        scope: N
        aal: 2
        source: TL-02a SCR-0102 "Huỷ"; ma trận SCR-0102.huy
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      responses:
        '204':
          description: Đã huỷ yêu cầu khởi tạo.
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/tenants/{id}/provision:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Tenant]
      operationId: provisionConfigTenant
      summary: Khởi chạy saga cấp phát tenant
      description: >-
        Ở cuối bước 3, kiểm tra cấu hình và khởi chạy saga cấp phát (SVC-03 khởi tạo, SVC-06 điều phối):
        tenant chuyển `KHOI_TAO` → `DANG_CAP_PHAT`, khi xong chuyển `DANG_CAU_HINH` (MSG-01-06); lỗi
        không khắc phục được thì bù trừ về `KHOI_TAO` (MSG-01-07). Trả 202, job loại `PROVISION`.
        Không phát EVT nghiệp vụ; saga ghi tiến độ.
      x-mission:
        qt: [QT-01]
        scr: [SCR-0102]
        owner: MOD-08
        roles: [platform_admin]
        scope: N
        aal: 2
        rules: [BR-01-01, BR-01-02, BR-01-03, BR-01-04]
        source: TL-02a SCR-0102 "Tiếp tục"; QT-01 bước 4
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/tenants/{id}/idp/test:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Tenant]
      operationId: testConfigTenantIdp
      summary: Kiểm tra kết nối IdP của tenant
      description: >-
        Thử luồng OIDC hoặc liên kết SAML với cấu hình IdP đang soạn (bước 4). Không đổi trạng thái
        tenant; kết quả được ghi để bước 6 kiểm tra "IdP hoạt động".
      x-mission:
        qt: [QT-01]
        scr: [SCR-0102]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        aal: 2
        source: TL-02a SCR-0102 "Kiểm tra kết nối IdP"; ma trận SCR-0102.buoc-4-5
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantIdpTestRequest' }
      responses:
        '200':
          description: Kết quả kiểm tra kết nối.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantIdpTestResult' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/tenants/{id}/activate:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Tenant]
      operationId: activateConfigTenant
      summary: Kích hoạt tenant
      description: >-
        Bước 6: khi mọi kiểm tra tổng thể đạt, chuyển `SAN_SANG` → `DANG_VAN_HANH` (hoặc `TAM_NGUNG` →
        `DANG_VAN_HANH` khi gia hạn), yêu cầu MFA bước lên; phát EVT-21 thông báo đầu mối quản trị tenant.
        Còn lệch mức Cao trả 422 mã `CONFIG-422-HIGH-DISCREPANCY` (BR-01-10); sai trạng thái trả 409
        mã `CONFIG-409-TENANT-STATE`.
      x-mission:
        qt: [QT-01]
        scr: [SCR-0102]
        owner: MOD-08
        evt: [EVT-21]
        roles: [platform_admin]
        scope: N
        aal: 2
        rules: [BR-01-10]
        source: TL-02a SCR-0102 "Kích hoạt"; ma trận SCR-0102.kich-hoat
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigTenantActivateRequest' }
      responses:
        '200':
          description: Tenant đã vào vận hành.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigTenant' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/tenants/{id}/suspend:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Tenant]
      operationId: suspendConfigTenant
      summary: Tạm ngừng tenant
      description: >-
        Chuyển `DANG_VAN_HANH` → `TAM_NGUNG` khi hết hạn hợp đồng hoặc có sự cố an ninh (TL-02a QT-01 "Trạng
        thái đối tượng", quyết định của AC-01), yêu cầu MFA bước lên. Dữ liệu giữ nguyên; người dùng của tenant
        thấy MSG-00-07 ở trang đăng nhập, chỉ quản trị nền tảng đăng nhập được. Lý do (số văn bản) bắt buộc, ghi
        `registry.tenant_status_log`; phát `registry.tenant.changed.v1`. Vận hành lại bằng `activateConfigTenant`.
        Sai trạng thái trả 409 mã `CONFIG-409-TENANT-STATE`.
      x-mission:
        qt: [QT-01]
        scr: [SCR-0101]
        owner: MOD-08
        roles: [platform_admin]
        scope: N
        aal: 2
        source: TL-02a QT-01 "Trạng thái đối tượng" (DANG_VAN_HANH → TAM_NGUNG); INF-26 (vtctl tenant suspend)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigTenantSuspendRequest' }
      responses:
        '200':
          description: Tenant đã tạm ngừng.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigTenant' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/tenants/{id}/terminate:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Tenant]
      operationId: terminateConfigTenant
      summary: Chấm dứt tenant
      description: >-
        Chuyển `TAM_NGUNG` → `DA_CHAM_DUT` khi đã xuất trả dữ liệu cho tổ chức và hết thời hạn lưu giữ theo hợp
        đồng (TL-02a QT-01 "Trạng thái đối tượng"; TL-04 mục 11.4), yêu cầu MFA bước lên. Đây là trạng thái cuối,
        không quay lại được. Lý do (số văn bản) và số biên bản bàn giao dữ liệu bắt buộc, ghi
        `registry.tenant_status_log`; phát `registry.tenant.changed.v1` để các service ngừng phục vụ tenant và quy
        trình huỷ KEK `kek-tenant-<id>` (TL-04 mục 8.4) bắt đầu. Sổ cái của tenant vẫn giữ theo NFR-09. Tenant
        chưa tạm ngừng trả 409 mã `CONFIG-409-TENANT-STATE`; hồ sơ còn ở `KHOI_TAO` thì huỷ bằng
        `cancelConfigTenant`.
      x-mission:
        qt: [QT-01]
        scr: [SCR-0101]
        owner: MOD-08
        roles: [platform_admin]
        scope: N
        aal: 2
        source: TL-02a QT-01 "Trạng thái đối tượng" (TAM_NGUNG → DA_CHAM_DUT); TL-04 mục 11.4; VH-04 (vtctl tenant terminate)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfigTenantTerminateRequest' }
      responses:
        '200':
          description: Tenant đã chấm dứt.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfigTenant' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /config/security
  /config/security/report-suspicious:
    post:
      tags: [Bảo mật tài khoản]
      operationId: reportSuspiciousAccess
      summary: Báo cáo truy cập bất thường
      description: >-
        Người dùng bấm "Báo cáo truy cập bất thường" trên cảnh báo thiết bị mới (MSG-00-08): máy chủ thu
        hồi mọi phiên của tài khoản, buộc đổi mật khẩu và phát EVT-21 thông báo quản trị. Phiên hiện tại
        cũng bị thu hồi sau khi trả phản hồi.
      x-mission:
        qt: [QT-00]
        scr: [SCR-0001]
        owner: MOD-08
        evt: [EVT-21]
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        rules: [BR-00-06]
        source: TL-02a SCR-0001; ma trận SCR-0001.bao-bat-thuong
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SuspiciousAccessReport' }
      responses:
        '200':
          description: Đã ghi nhận báo cáo và thu hồi phiên.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuspiciousAccessResult' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '429': { $ref: '../common/common.yaml#/components/responses/TooManyRequests' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  # ---------------------------------------------------------------- /config/calendar
  /config/calendar:
    get:
      tags: [Lịch làm việc]
      operationId: getWorkingCalendar
      summary: Lịch ngày làm việc của tenant theo năm
      description: >-
        Trả lịch quốc gia hợp với lịch riêng của tenant cho một năm: ngày nghỉ lễ, nghỉ bù, làm bù và số
        ngày làm việc từng tháng. Dùng để hiển thị hạn và số ngày chậm; máy chủ (SVC-07) là nơi tính điểm.
      x-mission:
        qt: [QT-08]
        scr: [SCR-0801]
        owner: MOD-08
        roles: [tenant_admin, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: Tn
        source: TL-01 PL C; ma trận dòng API config ("người dùng khác GET lịch ngày làm việc")
      parameters:
        - $ref: '#/components/parameters/Year'
      responses:
        '200':
          description: Lịch ngày làm việc của năm.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkingCalendar' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/holiday-calendars:
    get:
      tags: [Lịch làm việc]
      operationId: listHolidayCalendarDays
      summary: Danh sách ngày nghỉ, làm bù
      description: Danh mục ngày đặc biệt của tenant (kèm lịch quốc gia) để quản trị tenant chỉnh sửa.
      x-mission:
        qt: [QT-08]
        scr: [SCR-0801]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        source: TL-02a SCR-0801 "Lịch ngày nghỉ"; ma trận SCR-0801.tao-ky
      parameters:
        - $ref: '#/components/parameters/Year'
        - name: scope
          in: query
          description: Lọc theo lịch quốc gia hoặc lịch riêng.
          schema: { $ref: '#/components/schemas/HolidayScope' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang ngày đặc biệt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendarDayPage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    post:
      tags: [Lịch làm việc]
      operationId: createHolidayCalendarDay
      summary: Thêm ngày nghỉ hoặc làm bù
      description: >-
        Thêm một ngày vào lịch riêng của tenant. Ngày đã có trả 409 mã `CONFIG-409-DATE-EXISTS`. Lịch
        quốc gia chỉ do tenant hệ thống cập nhật.
      x-mission:
        qt: [QT-08]
        scr: [SCR-0801]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        source: TL-02a SCR-0801 "Lịch ngày nghỉ"; TL-03 config.holiday_calendar
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HolidayCalendarDayInput' }
      responses:
        '201':
          description: Đã thêm ngày.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendarDay' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

  /config/holiday-calendars/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    put:
      tags: [Lịch làm việc]
      operationId: updateHolidayCalendarDay
      summary: Sửa ngày nghỉ hoặc làm bù
      description: Sửa loại ngày hoặc tên ngày của lịch riêng tenant.
      x-mission:
        qt: [QT-08]
        scr: [SCR-0801]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        source: TL-02a SCR-0801 "Lịch ngày nghỉ"
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HolidayCalendarDayInput' }
      responses:
        '200':
          description: Đã sửa.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HolidayCalendarDay' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
    delete:
      tags: [Lịch làm việc]
      operationId: deleteHolidayCalendarDay
      summary: Xoá ngày nghỉ hoặc làm bù
      description: >-
        Xoá một ngày của lịch riêng tenant. Ngày thuộc kỳ đã khoá vẫn xoá được nhưng không làm tính lại
        kỳ đó (MSG-08-06 không áp dụng cho lịch; suy luận theo BR-08-07 về tính tất định).
      x-mission:
        qt: [QT-08]
        scr: [SCR-0801]
        owner: MOD-08
        roles: [tenant_admin]
        scope: Tn
        source: TL-02a SCR-0801 "Lịch ngày nghỉ" (suy luận)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      responses:
        '204':
          description: Đã xoá.
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }

