        mandatoryWidgetIds:
          type: array
          items: { type: string, maxLength: 64 }

    # ------------------------------------------------------------ Vai trò và uỷ quyền (WEB-058)
    RoleCode:
      description: Vai trò hệ thống gán theo đơn vị (`config.role_binding.role_code`, CHECK của TL-03).
      type: string
      enum: [tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
    RoleBindingScope:
      description: Phạm vi ABAC (`config.role_binding.scope`).
      type: string
      enum: [DON_VI, DON_VI_VA_CAP_DUOI]
    RoleBindingStatus:
      description: >-
        Trạng thái suy ra, không lưu thành cột (quyết định WEB-058 điểm 2): `CHO_DUYET` khi vai trò nhạy
        cảm chưa có `approved_by`; `TU_CHOI`, `DA_THU_HOI` theo `end_kind`; còn lại so `valid_from`,
        `valid_to` với thời điểm hiện tại.
      type: string
      enum: [CHO_DUYET, SAP_HIEU_LUC, HIEU_LUC, HET_HAN, DA_THU_HOI, TU_CHOI]
    AccessEndKind:
      description: Cách bản ghi kết thúc trước hạn (`end_kind`, cột bổ sung theo WEB-058).
      type: string
      enum: [THU_HOI, TU_CHOI]
    RoleBinding:
      description: >-
        Vai trò đã cấp (`config.role_binding`, TL-03; cột bổ sung `reason`, `granted_at`, `approved_at`,
        `ended_by`, `ended_at`, `end_kind`, `end_reason` theo WEB-058). Là nguồn sự thật của vai trò; mỗi
        thay đổi phát EVT-27 để cập nhật dữ liệu OPA và đồng bộ realm role sang Keycloak.
