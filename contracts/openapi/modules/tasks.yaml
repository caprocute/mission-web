        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04]
        scr: [SCR-0402, SCR-0403]
        owner: MOD-02
        roles: [leader]
        scope: Gn
        rules: [BR-04-10]
        source: 'TL-02a BR-04-10, MSG-04-07; SCR-0402 (suy luận đường dẫn)'

  /plans/{id}/versions/{v}/items/{itemId}/confirm-lead:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
      - $ref: '#/components/parameters/VersionNo'
      - $ref: '#/components/parameters/ItemId'
    post:
      tags: [Kế hoạch quý]
      operationId: confirmPlanItemLead
      summary: Xác nhận một người chủ trì cho dòng kế hoạch trước khi sinh nhiệm vụ
      description: >-
        Xác nhận một người chủ trì duy nhất cho dòng công việc trong kế hoạch quý trước khi sinh nhiệm vụ (QT-04 bước 2, QT-05 bước 1a).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanItemConfirmLeadRequest' }
      responses:
        '200':
          description: Dòng kế hoạch sau khi xác nhận người chủ trì.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanItem' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04, QT-05]
        scr: [SCR-0402, SCR-0501]
        owner: MOD-02
        roles: [manager, leader]
        scope: Đv
        source: 'TL-02a QT-04 bước 2, QT-05 bước 1a (suy luận đường dẫn)'

  # ──────────────────────── Danh mục công việc ────────────────────────
  /catalog:
    get:
      tags: [Danh mục công việc]
      operationId: listWorkCatalogs
      summary: Các phiên bản danh mục người dùng được xem
      description: Phiên bản đang áp dụng đứng trước.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/UnitId'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang phiên bản danh mục.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/WorkCatalog' }
                  nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04]
        scr: [SCR-0401]
        owner: MOD-02
        roles: [member, manager, leader, policy_author, appraiser]
        scope: Đv
        source: 'TL-02a SCR-0401'

  /catalog/items:
    get:
      tags: [Danh mục công việc]
      operationId: listApplicableCatalogItems
      summary: Mục danh mục đang áp dụng
      description: >-
        Mục `AP_DUNG` của phiên bản hiệu lực, dùng cho đăng ký nhiệm vụ (SCR-0503) và giao việc
        (SCR-0501). `applicable=me` chỉ lấy mục theo vị trí việc làm của người dùng.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/UnitId'
        - name: applicable
          in: query
          schema: { type: string, enum: [me] }
        - $ref: '../common/common.yaml#/components/parameters/Q'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang mục danh mục.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogItem' }
                  nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04, QT-05]
        scr: [SCR-0501, SCR-0503]
        owner: MOD-02
        roles: [member, manager, leader]
        scope: Đv
        source: 'TL-01 PL C "GET /catalog/items"'

  /catalog/{catalogId}/items:
    parameters:
      - $ref: '#/components/parameters/CatalogId'
    get:
      tags: [Danh mục công việc]
      operationId: listCatalogVersionItems
      summary: Mục của một phiên bản danh mục
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/Q'
        - name: position
          in: query
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: difficulty
          in: query
          schema: { type: integer, minimum: 1, maximum: 5 }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CatalogItemStatus' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang mục kèm tổng số.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItemsPage' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04]
        scr: [SCR-0401]
        owner: MOD-02
        roles: [member, manager, leader, policy_author, appraiser]
        scope: Đv
        source: 'TL-02a SCR-0401'
    post:
      tags: [Danh mục công việc]
      operationId: addCatalogItem
      summary: Thêm công việc vào danh mục
      description: >-
        Thêm mục vào phiên bản nháp; khi `catalogId` là phiên bản đang áp dụng, máy chủ ghi vào phiên bản
        nháp mới và trả `movedToNewVersion = true`. `code` trống thì máy chủ tự sinh. Thay cho
        `POST /catalog/items` của TL-01 Phụ lục C.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogItemInput' }
      responses:
        '201':
          description: Mục đã thêm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItemSaveResult' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04]
        scr: [SCR-0401]
        owner: MOD-02
        roles: [manager, policy_author]
        scope: Đv
        rules: [BR-04-14]
        source: 'TL-02a SCR-0401 "Thêm công việc"; TL-01 PL C'

  /catalog/{catalogId}/items/{itemId}:
    parameters:
      - $ref: '#/components/parameters/CatalogId'
      - name: itemId
        in: path
        required: true
        schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    put:
      tags: [Danh mục công việc]
      operationId: updateCatalogItem
      summary: Sửa mục danh mục
      description: >-
        Mục đã dùng ở kỳ đã khoá được lưu ở phiên bản mới, kỳ cũ giữ nguyên (BR-04-13, MSG-04-01).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogItemInput' }
      responses:
        '200':
          description: Kết quả lưu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogItemSaveResult' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04]
        scr: [SCR-0401]
        owner: MOD-02
        roles: [manager, policy_author]
        scope: Đv
        rules: [BR-04-13, BR-04-14]
        source: 'TL-02a SCR-0401 "Sửa"'

  /catalog/{catalogId}/positions:
    parameters:
      - $ref: '#/components/parameters/CatalogId'
    get:
      tags: [Danh mục công việc]
      operationId: listCatalogPositions
      summary: Vị trí việc làm có trong danh mục
      responses:
        '200':
          description: Vị trí việc làm (`org.position`).
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Position' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04]
        scr: [SCR-0401]
        owner: MOD-02
        roles: [member, manager, leader, policy_author]
        scope: Đv
        source: 'Mã frontend WEB-025 (suy luận)'

  /catalog/{catalogId}/versions:
    parameters:
      - $ref: '#/components/parameters/CatalogId'
    post:
      tags: [Danh mục công việc]
      operationId: cloneCatalogVersion
      summary: Nhân bản phiên bản danh mục
      description: Tạo phiên bản n+1 ở trạng thái `NHAP` từ phiên bản đang xem.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Phiên bản mới.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkCatalog' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04]
        scr: [SCR-0401]
        owner: MOD-02
        roles: [manager, policy_author]
        scope: Đv
        source: 'TL-02a SCR-0401 "Nhân bản phiên bản"'

  /catalog/{catalogId}/activate:
    parameters:
      - $ref: '#/components/parameters/CatalogId'
    post:
      tags: [Danh mục công việc]
      operationId: activateCatalogVersion
      summary: Áp dụng phiên bản danh mục công việc
      description: >-
        Chuyển phiên bản danh mục từ `NHAP` sang `AP_DUNG` và tự động chuyển phiên bản đang áp dụng trước đó
        của cùng đơn vị sang `HET_HIEU_LUC` (QT-04 bước 1).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Phiên bản danh mục đã chuyển sang `AP_DUNG`.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkCatalog' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04]
        scr: [SCR-0401]
        owner: MOD-02
        roles: [manager, policy_author]
        scope: Đv
        source: 'TL-02a QT-04 bước 1 (NHAP → AP_DUNG, bản cũ → HET_HIEU_LUC); SCR-0401 (suy luận đường dẫn)'

  /catalog/{catalogId}/imports:
    parameters:
      - $ref: '#/components/parameters/CatalogId'
    post:
      tags: [Danh mục công việc]
      operationId: importCatalogExcel
      summary: Nhập danh mục từ Excel
      description: >-
        Tải tệp Excel; máy chủ kiểm tra ở tác vụ nền và trả 202 với `Location` trỏ tới
        `/catalog/imports/{jobId}`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
      responses:
        '202':
          description: Đã nhận tệp.
          headers:
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogImportJob' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04]
        scr: [SCR-0401]
        owner: MOD-02
        roles: [manager, policy_author]
        scope: Đv
        source: 'TL-02a SCR-0401 "Nhập từ Excel"'

  /catalog/{catalogId}/imports/latest:
    parameters:
      - $ref: '#/components/parameters/CatalogId'
    get:
      tags: [Danh mục công việc]
      operationId: getLatestCatalogImport
      summary: Lần nhập Excel gần nhất của danh mục
      responses:
        '200':
          description: Lần nhập gần nhất, `null` khi chưa nhập lần nào.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CatalogImportJob'
                  - type: 'null'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04]
        scr: [SCR-0401]
        owner: MOD-02
        roles: [manager, policy_author]
        scope: Đv
        source: 'Mã frontend WEB-025 (suy luận)'

  /catalog/imports/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Danh mục công việc]
      operationId: getCatalogImport
      summary: Trạng thái một lần nhập Excel
      responses:
        '200':
          description: Lần nhập.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogImportJob' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04]
        scr: [SCR-0401]
        owner: MOD-02
        roles: [manager, policy_author]
        scope: Đv
        source: 'Mã frontend WEB-025'

  /catalog/imports/{jobId}/errors:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Danh mục công việc]
      operationId: downloadCatalogImportErrors
      summary: Tải tệp các dòng lỗi
      responses:
        '200':
          description: Tệp Excel các dòng lỗi kèm lý do (MSG-04-02).
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, contentMediaType: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04]
        scr: [SCR-0401]
        owner: MOD-02
        roles: [manager, policy_author]
        scope: Đv
        source: 'TL-02a SCR-0401 "Tải tệp lỗi"'

  /tasks/visibility-check:
    post:
      tags: [Nhiệm vụ]
      operationId: checkTaskVisibilityBatch
      summary: Kiểm quyền hiển thị theo lô cho kết quả tìm kiếm toàn văn của SVC-16
      description: >-
        Điểm vào nội bộ để `search-indexer` (SVC-16) kiểm quyền lại ở `mission-core` trên danh sách ứng viên
        `taskId`/`directiveId` trả về từ OpenSearch trước khi trả kết quả tìm kiếm cho người dùng (TL-01 mục
        SVC-16). Chỉ trả danh sách định danh mà `viewerPersonId` được phép nhìn thấy theo RLS và phạm vi đơn vị.
      security:
        - serviceClient: []
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskVisibilityCheckRequest' }
      responses:
        '200':
          description: Tập định danh được phép hiển thị cho người tìm kiếm.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskVisibilityCheckResponse' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-00]
        scr: [SCR-0002]
        owner: MOD-02
        roles: [service_client]
        scope: B
        source: 'TL-01 mục SVC-16 kiểm quyền lại ở lõi trước khi trả (suy luận đường dẫn)'

components:
  securitySchemes:
    keycloak:
      $ref: '../common/common.yaml#/components/securitySchemes/keycloak'
    serviceClient:
      $ref: '../common/common.yaml#/components/securitySchemes/serviceClient'
  parameters:
    VersionNo:
      name: v
      in: path
      required: true
      description: Số phiên bản kế hoạch (`task.plan_version.version_no`).
      schema: { type: integer, minimum: 1 }
    CatalogId:
      name: catalogId
      in: path
      required: true
      description: Mã phiên bản danh mục (`task.work_catalog.id`).
      schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      description: Mã dòng kế hoạch (`task.plan_item.id`).
      schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }

  schemas:
    # ── Liệt kê ──
    TaskStatus:
      description: Trạng thái `task.task.status` (baseline mục 9.1).
      type: string
      enum: [NHAP, DA_GIAO, DANG_THUC_HIEN, CHO_NGHIEM_THU, HOAN_THANH, TAM_DUNG, HUY]
    AssigneeRole:
      description: Vai trò trên nhiệm vụ (`task.task_assignee.role`).
      type: string
      enum: [CHU_TRI, PHOI_HOP]
    TaskGroup:
      description: Nhóm tính điểm (`task.task.task_group`); một nhiệm vụ chỉ tính ở một nhóm.
      type: string
      enum: [THUONG_XUYEN, THEN_CHOT]
    TaskSource:
      description: >-
        Nguồn nhiệm vụ (`task.task.source`, ràng buộc `ck_task__source` của TL-03). TL-02 gọi nguồn
        ngoài kế hoạch là "phát sinh"; giá trị giữ `DOT_XUAT` theo TL-03.
      type: string
      enum: [KE_HOACH, VAN_BAN, DANG_KY, DOT_XUAT]
    TaskPriority:
      type: string
      enum: [CAO, TRUNG_BINH, THAP]
    MyTasksQuickFilter:
      description: Bộ lọc nhanh của SCR-0503 trường 1.
      type: string
      enum: [TAT_CA, CHAM, SAP_HAN, CHO_NGHIEM_THU, HOAN_THANH]
    ProgressChannel:
      type: string
      enum: [WEB, MOBILE, TICH_HOP]
    BlockerStatus:
      type: string
      enum: [MO, DANG_XU_LY, DA_GIAI_QUYET, DONG]
    BlockerCauseCategory:
      type: string
      enum: [NGUON_LUC, PHOI_HOP, THU_TUC, KHACH_QUAN, KHAC]
    ImpactLevel:
      type: string
      enum: [CAO, TRUNG_BINH, THAP]
    CauseKind:
      description: Nguyên nhân khách quan hoặc chủ quan (`cause_claimed`, `cause_decided`).
      type: string
      enum: [KHACH_QUAN, CHU_QUAN]
    ChangeRequestType:
      description: >-
        Loại đề nghị theo TL-02 SCR-0602 trường 1. TL-03 ghi bộ giá trị khác (`DIEU_CHINH_KHOI_LUONG`,
        `DIEU_CHINH_NOI_DUNG`, không có `TAM_DUNG`); hợp đồng theo TL-02, TL-03 cần sửa ràng buộc CHECK.
      type: string
      enum: [GIA_HAN, DOI_SO_LUONG, DOI_SAN_PHAM, TAM_DUNG, HUY]
    ChangeRequestStatus:
      type: string
      enum: [NHAP, CHO_DUYET, DA_DUYET, TU_CHOI, DA_RUT]
    TaskTransition:
      description: Tên chuyển trạng thái dùng cho `/tasks/{id}/transitions`.
      type: string
      enum: [TIEP_TUC, TRINH_NGHIEM_THU, HOAN_THANH]

    # ── Nhiệm vụ ──
    TaskSummary:
      description: Tóm tắt nhiệm vụ cho danh sách (SCR-0503) và trang chủ (SCR-0002).
      type: object
      required:
        [id, code, title, status, overdue, dueDate, progress, role, assignerName, unitName, periodId,
         rowVersion, taskGroup, source, plannedQuantity, doneQuantity, unit, openBlockerCount, workingDaysLeft]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, examples: ['NV-2026-0157'] }
        title: { type: string, maxLength: 500 }
        status: { $ref: '#/components/schemas/TaskStatus' }
        overdue:
          type: boolean
          description: Cờ `task.task.is_overdue`, máy chủ đặt hằng ngày (QT-06 bước 8).
        dueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        progress:
          type: integer
          minimum: 0
          maximum: 100
          description: Phần trăm 0–100; máy chủ lưu `progress_pct` dạng 0–1.
        role: { $ref: '#/components/schemas/AssigneeRole' }
        assignerName: { type: string }
        unitName: { type: string }
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
        taskGroup: { $ref: '#/components/schemas/TaskGroup' }
        source: { $ref: '#/components/schemas/TaskSource' }
        keyResultId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        keyResultTitle: { type: string }
        plannedQuantity: { type: number, minimum: 0 }
        doneQuantity: { type: number, minimum: 0 }
        unit: { type: string, description: 'Đơn vị tính của sản phẩm' }
        openBlockerCount: { type: integer, minimum: 0 }
        workingDaysLeft:
          type: integer
          description: Số ngày làm việc còn lại tới hạn, âm khi đã quá hạn; máy chủ tính theo lịch nghỉ.
      examples:
        - id: 01928f3e-7b1a-7c3e-9a51-3f2d9c1b0a77
          code: NV-2026-0157
          title: Thẩm định hồ sơ kết nạp đảng viên đợt 2
          status: DANG_THUC_HIEN
          overdue: false
          dueDate: '2026-11-20'
          progress: 60
          role: CHU_TRI
          assignerName: Trần Thị Bình
          unitName: Ban Tổ chức Đảng uỷ khối
          periodId: 01928f3e-0000-7000-8000-000000004426
          rowVersion: 7
          taskGroup: THEN_CHOT
          source: 'KE_HOACH'
          plannedQuantity: 12
          doneQuantity: 7
          unit: hồ sơ
          openBlockerCount: 0
          workingDaysLeft: 22
    TaskSummaryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskSummary' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    MyTasksPage:
      description: Trang "Việc của tôi" kèm số đếm bộ lọc nhanh và danh sách KR để lọc.
      type: object
      required: [items, nextCursor, period, counts, keyResults]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TaskSummary' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
        period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        counts:
          type: object
          description: Số đếm cho từng bộ lọc nhanh, tính trên cùng điều kiện vai trò, nhóm, KR, từ khoá.
          required: [TAT_CA, CHAM, SAP_HAN, CHO_NGHIEM_THU, HOAN_THANH]
          properties:
            TAT_CA: { type: integer }
            CHAM: { type: integer }
            SAP_HAN: { type: integer }
            CHO_NGHIEM_THU: { type: integer }
            HOAN_THANH: { type: integer }
        keyResults:
          type: array
          items:
            type: object
            required: [id, title]
            properties:
              id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
              title: { type: string }
    ProgressLogEntry:
      description: Một dòng nhật ký tiến độ (`task.task_progress`), chỉ ghi thêm.
      type: object
      required: [at, by, percent, note]
      properties:
        at: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        by: { type: string, description: 'Tên người ghi' }
        byRole: { $ref: '#/components/schemas/AssigneeRole' }
        channel: { $ref: '#/components/schemas/ProgressChannel' }
        fromPercent: { type: integer, minimum: 0, maximum: 100 }
        percent: { type: integer, minimum: 0, maximum: 100 }
        note: { type: string, maxLength: 2000 }
    TaskBlocker:
      description: Điểm nghẽn (`task.task_blocker`).
      type: object
      required: [id, code, content, causeCategory, causeClaimed, impactLevel, status, createdAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, examples: ['BN-0157-01'] }
        content: { type: string, maxLength: 2000 }
        causeCategory: { $ref: '#/components/schemas/BlockerCauseCategory' }
        causeClaimed: { $ref: '#/components/schemas/CauseKind' }
        impactLevel: { $ref: '#/components/schemas/ImpactLevel' }
        handlerName: { type: string }
        resolveBy: { $ref: '../common/common.yaml#/components/schemas/Date' }
        status: { $ref: '#/components/schemas/BlockerStatus' }
        createdAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    BlockerReport:
      type: object
      required: [content, causeCategory, causeClaimed, impactLevel]
      properties:
        content: { type: string, minLength: 1, maxLength: 2000 }
        causeCategory: { $ref: '#/components/schemas/BlockerCauseCategory' }
        causeClaimed: { $ref: '#/components/schemas/CauseKind' }
        impactLevel: { $ref: '#/components/schemas/ImpactLevel' }
        resolveBy: { $ref: '../common/common.yaml#/components/schemas/Date' }
    BlockerPatch:
      description: Các trường người giao được sửa khi xử lý điểm nghẽn (JSON Merge Patch).
      type: object
      properties:
        handlerPersonId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        resolveBy: { $ref: '../common/common.yaml#/components/schemas/Date' }
        status: { $ref: '#/components/schemas/BlockerStatus' }
        resolutionNote: { type: string, maxLength: 2000 }
    ChangeRequest:
      description: Đề nghị gia hạn, điều chỉnh (`task.task_change_request`).
      type: object
      required: [id, type, status, causeClaimed, reason, approverName, submittedAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        type: { $ref: '#/components/schemas/ChangeRequestType' }
        status: { $ref: '#/components/schemas/ChangeRequestStatus' }
        newDueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        newQuantity: { type: number, minimum: 0 }
        newProduct: { type: string }
        causeClaimed: { $ref: '#/components/schemas/CauseKind' }
        blockerId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        reason: { type: string, maxLength: 2000 }
        approverName: { type: string }
        submittedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        escalated: { type: boolean, description: 'Vượt ngưỡng BR-06-06 đã chuyển cấp trên (MSG-06-07)' }
        decidedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        causeDecided: { $ref: '#/components/schemas/CauseKind' }
        decisionNote: { type: string, maxLength: 2000 }
    ChangeRequestDraft:
      type: object
      required: [type, causeClaimed, reason]
      properties:
        type: { $ref: '#/components/schemas/ChangeRequestType' }
        newDueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        newQuantity: { type: number, minimum: 0 }
        newProduct: { type: string, maxLength: 500 }
        causeClaimed: { $ref: '#/components/schemas/CauseKind' }
        blockerId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        reason: { type: string, minLength: 1, maxLength: 2000 }
    ChangeRequestDecision:
      type: object
      required: [approve, causeDecided]
      properties:
        approve: { type: boolean }
        causeDecided: { $ref: '#/components/schemas/CauseKind' }
        note: { type: string, maxLength: 2000, description: 'Bắt buộc khi từ chối' }
    ChangeRequestPreview:
      type: object
      required: [extraWorkingDays, objective, subjective, overThreshold, lateSubmission, cancelBlocked]
      properties:
        extraWorkingDays: { type: integer, description: 'Số ngày làm việc tăng thêm theo lịch nghỉ' }
        objective:
          type: object
          required: [scoreDueDate, c]
          properties:
            scoreDueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
            c: { type: number, description: 'Hệ số tiến độ C nếu nguyên nhân khách quan' }
        subjective:
          type: object
          required: [scoreDueDate, delayDays, c]
          properties:
            scoreDueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
            delayDays: { type: integer }
            c: { type: number }
        overThreshold: { type: boolean, description: 'Vượt ngưỡng BR-06-06' }
        escalateToName: { type: string }
        lateSubmission: { type: boolean, description: 'Gửi sau hạn thực hiện (BR-06-07)' }
        cancelBlocked: { type: boolean, description: 'Huỷ không được khi đã có sản phẩm được nghiệm thu (BR-06-09)' }
    StateLogEntry:
      description: Một lần chuyển trạng thái (`task.task_state_log`).
      type: object
      required: [at, from, to, transition, actorName]
      properties:
        at: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        from:
          oneOf:
            - $ref: '#/components/schemas/TaskStatus'
            - type: 'null'
        to: { $ref: '#/components/schemas/TaskStatus' }
        transition: { type: string }
        actorName: { type: string }
        reason: { type: string }
    DelayRisk:
      description: Dự báo trễ hạn do SVC-15 tính (`task.task.delay_risk`).
      type: object
      required: [level, neededWorkingDays, explanation]
      properties:
        level: { type: string, enum: [THAP, VUA, CAO] }
        neededWorkingDays: { type: integer }
        explanation: { type: string }
    TaskDelayRiskInput:
      description: Kết quả dự báo nguy cơ trễ hạn do SVC-15 gửi về (CORE-02-26, DV-15-10).
      type: object
      required: [level, neededWorkingDays, explanation, computedAt]
      properties:
        level: { type: string, enum: [THAP, VUA, CAO] }
        neededWorkingDays: { type: integer, minimum: 0 }
        explanation: { type: string, maxLength: 1000 }
        computedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        basedOnProgressId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    TaskDetail:
      description: Chi tiết nhiệm vụ (SCR-0601).
      allOf:
        - $ref: '#/components/schemas/TaskSummary'
        - type: object
          required:
            [description, acceptorName, scoreDueDate, products, extensionsUsed, extensionsMax, coAssignees,
             progressLog, blockers, changeRequests, stateLog]
          properties:
            description: { type: string }
            sourceDoc:
              type: object
              required: [number, title]
              properties:
                number: { type: string }
                title: { type: string }
            sourceRef: { type: string, description: 'Mô tả nguồn, ví dụ "Kế hoạch Q4 phiên bản 2 · dòng 1"' }
            catalogItemCode: { type: string }
            difficulty: { type: integer, minimum: 1, maximum: 5 }
            standardScore: { type: number }
            assignedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
            acceptorName: { type: string }
            scoreDueDate:
              $ref: '../common/common.yaml#/components/schemas/Date'
              description: Hạn tính hệ số tiến độ C, khác `dueDate` là hạn thực hiện (BR-06-04, BR-06-05).
            products:
              type: object
              required: [confirmed, pendingReview, required]
              properties:
                confirmed: { type: integer }
                pendingReview: { type: integer }
                required: { type: integer }
            delayRisk: { $ref: '#/components/schemas/DelayRisk' }
            extensionsUsed: { type: integer }
            extensionsMax: { type: integer }
            coAssignees:
              type: array
              items:
                type: object
                required: [personId, name, role]
                properties:
                  personId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
                  name: { type: string }
                  role: { $ref: '#/components/schemas/AssigneeRole' }
            progressLog:
              type: array
              items: { $ref: '#/components/schemas/ProgressLogEntry' }
            blockers:
              type: array
              items: { $ref: '#/components/schemas/TaskBlocker' }
            changeRequests:
              type: array
              items: { $ref: '#/components/schemas/ChangeRequest' }
            stateLog:
              type: array
              items: { $ref: '#/components/schemas/StateLogEntry' }
    TaskAssignee:
      description: Một người hoặc đơn vị được giao (`task.task_assignee`).
      type: object
      required: [kind, id, name, role]
      properties:
        kind: { type: string, enum: [PERSON, UNIT] }
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        name: { type: string }
        role: { $ref: '#/components/schemas/AssigneeRole' }
    ProgressUpdate:
      type: object
      required: [percent, note]
      properties:
        percent: { type: integer, minimum: 0, maximum: 100 }
        note: { type: string, maxLength: 2000 }
        doneQuantity: { type: number, minimum: 0, description: 'Số lượng sản phẩm đã làm (tuỳ chọn)' }
        channel: { $ref: '#/components/schemas/ProgressChannel' }
    ProgressBatchItem:
      type: object
      required: [taskId, rowVersion, percent, note]
      properties:
        taskId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
        percent: { type: integer, minimum: 0, maximum: 100 }
        note: { type: string, maxLength: 2000 }
    ProgressBatchResult:
      type: object
      required: [taskId, status]
      properties:
        taskId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        status: { type: integer, description: 'Mã HTTP tương đương cho dòng này' }
        task: { $ref: '#/components/schemas/TaskSummary' }
        problem: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
    TaskRegistration:
      description: Đăng ký nhiệm vụ từ danh mục (QT-05 bước 1c).
      type: object
      required: [catalogItemId, quantity, proposedDueDate]
      properties:
        catalogItemId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        quantity: { type: number, exclusiveMinimum: 0 }
        proposedDueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        note: { type: string, maxLength: 1000 }
    TaskExportRequest:
      description: Điều kiện lọc giống `/tasks/mine` hoặc `/tasks`.
      type: object
      properties:
        assignee: { type: string, enum: [me], description: '`me` xuất "Việc của tôi"; bỏ trống xuất theo đơn vị' }
        unit: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        period: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        filter: { $ref: '#/components/schemas/MyTasksQuickFilter' }
        status:
          type: array
          items: { $ref: '#/components/schemas/TaskStatus' }
        overdueOnly: { type: boolean }
        role: { $ref: '#/components/schemas/AssigneeRole' }
        group: { $ref: '#/components/schemas/TaskGroup' }
        keyResultId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        q: { type: string, maxLength: 200 }
    TaskTransitionRequest:
      type: object
      required: [transition]
      properties:
        transition: { $ref: '#/components/schemas/TaskTransition' }
        reason: { type: string, maxLength: 1000 }

    # ── Soạn và giao ──
    TaskMilestone:
      type: object
      required: [date, content]
      properties:
        date: { $ref: '../common/common.yaml#/components/schemas/Date' }
        content: { type: string, maxLength: 500 }
    AssigneeRef:
      description: Người hoặc đơn vị phối hợp.
      type: object
      required: [kind, id, name]
      properties:
        kind: { type: string, enum: [PERSON, UNIT] }
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        name: { type: string }
    TaskDraft:
      description: >-
        Nhiệm vụ đang soạn để giao (SCR-0501), tên trường theo `task.task` của TL-03. `id`, `code`,
        `rowVersion` chỉ có sau khi lưu nháp.
      type: object
      required:
        [status, periodId, unitName, assignerId, assignerName, source, title, taskGroup, priority,
         coAssignees, milestones, productName, quantity, unit, evidenceRequired, qualityCriteria]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
        status: { $ref: '#/components/schemas/TaskStatus' }
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        unitName: { type: string }
        assignerId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        assignerName: { type: string }
        source: { $ref: '#/components/schemas/TaskSource' }
        planItemId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        catalogItemId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        title: { type: string, maxLength: 500 }
        taskGroup: { $ref: '#/components/schemas/TaskGroup' }
        keyResultId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        priority: { $ref: '#/components/schemas/TaskPriority' }
        leadPersonId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        coAssignees:
          type: array
          items: { $ref: '#/components/schemas/AssigneeRef' }
        dueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        acceptorId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        milestones:
          type: array
          items: { $ref: '#/components/schemas/TaskMilestone' }
        productName: { type: string, maxLength: 500 }
        quantity: { type: [number, 'null'], minimum: 0 }
        unit: { type: string, maxLength: 50 }
        evidenceRequired: { type: string, maxLength: 1000 }
        qualityCriteria: { type: string, maxLength: 2000 }
        sourceDoc:
          type: object
          required: [number, title]
          properties:
            number: { type: string }
            title: { type: string }
        basis: { type: string, maxLength: 1000, description: 'Căn cứ của nhiệm vụ phát sinh ngoài kế hoạch (BR-05-09)' }
    TaskDraftTemplate:
      type: object
      required: [period, draft]
      properties:
        period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        draft: { $ref: '#/components/schemas/TaskDraft' }
    AssignCheckItem:
      type: object
      required: [rule, level, passed, message]
      properties:
        rule: { type: string, examples: ['BR-05-01'] }
        level: { type: string, enum: [CHAN, CANH_BAO], description: '`CHAN` không giao được; `CANH_BAO` giao được sau khi xử lý' }
        passed: { type: boolean }
        message: { type: string }
    SimilarTask:
      description: Nhiệm vụ gần giống (BR-05-06, MSG-05-03).
      type: object
      required: [id, code, title, status, similarity, unitName, leadName, dueDate, progress]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        similarity: { type: number, minimum: 0, maximum: 1 }
        unitName: { type: string }
        leadName: { type: string }
        dueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        progress: { type: integer, minimum: 0, maximum: 100 }
    PersonWorkload:
      description: Khối lượng việc của người chủ trì theo tuần (BR-05-11, MSG-05-04).
      type: object
      required: [personId, personName, leadCount, coCount, weeklyThreshold, weeks]
      properties:
        personId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        personName: { type: string }
        leadCount: { type: integer }
        coCount: { type: integer }
        weeklyThreshold: { type: integer }
        weeks:
          type: array
          items:
            type: object
            required: [label, count]
            properties:
              label: { type: string }
              count: { type: integer }
    AssignCheckResult:
      type: object
      required: [items, similar]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AssignCheckItem' }
        similar:
          type: array
          items: { $ref: '#/components/schemas/SimilarTask' }
        workingDays: { type: integer, description: 'Số ngày làm việc từ hôm nay tới hạn' }
        workload: { $ref: '#/components/schemas/PersonWorkload' }
    AssignRequest:
      type: object
      properties:
        similarReason: { type: string, maxLength: 1000, description: 'Lý do vẫn tạo mới khi có nhiệm vụ gần giống (BR-05-06)' }
    AssignResult:
      type: object
      required: [id, code, status, leadName]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string }
        status: { $ref: '#/components/schemas/TaskStatus' }
        leadName: { type: string }
    BulkAssignRequest:
      type: object
      required: [draft, unitIds]
      properties:
        draft: { $ref: '#/components/schemas/TaskDraft' }
        unitIds:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    AssignBatchResult:
      type: object
      required: [taskId, code, assigned, status]
      properties:
        taskId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string }
        assigned: { type: boolean }
        status: { $ref: '#/components/schemas/TaskStatus' }
        message: { type: string }

    # ── Văn bản đến ──
    SourceSystem:
      description: Hệ nguồn (`task.task_source_doc.source_system`).
      type: string
      enum: [VOFFICE, IOFFICE, EDXML, LGSP, THU_CONG]
    SourceDocStatus:
      description: Tình trạng xử lý văn bản đến ở đơn vị nhận (suy luận từ SCR-0502).
      type: string
      enum: [CHO_XU_LY, DA_XU_LY, DA_BO_QUA]
    SourceDocExtractionStatus:
      description: Tình trạng trích nhiệm vụ của SVC-14 (cùng giá trị với `ExtractionStatus` của platform.yaml).
      type: string
      enum: [DANG_TRICH, XONG, KHONG_TRICH_DUOC]
    SourceDocSummary:
      type: object
      required:
        [id, sourceSystem, docNumber, docDate, issuer, excerpt, receivedAt, format, status, extraction,
         pendingCount, suggestionCount]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        sourceSystem: { $ref: '#/components/schemas/SourceSystem' }
        docNumber: { type: string, description: 'Số, ký hiệu theo NĐ 30/2020' }
        docDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        issuer: { type: string }
        excerpt: { type: string, description: 'Trích yếu' }
        receivedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        format: { type: string, examples: [EdXML] }
        status: { $ref: '#/components/schemas/SourceDocStatus' }
        extraction: { $ref: '#/components/schemas/SourceDocExtractionStatus' }
        pendingCount: { type: integer }
        suggestionCount: { type: integer }
    SourceDoc:
      allOf:
        - $ref: '#/components/schemas/SourceDocSummary'
        - type: object
          required: [issuerHeader, title, preamble, paragraphs, recipients]
          properties:
            issuerHeader: { type: string }
            title: { type: string }
            preamble: { type: string }
            paragraphs:
              type: array
              items:
                type: object
                required: [no, text, assignment]
                properties:
                  no: { type: integer }
                  text: { type: string }
                  assignment: { type: boolean, description: 'Đoạn giao việc cho đơn vị nhận do AI xác định' }
            recipients: { type: string }
            dismissReason: { type: string }
    SuggestionDecision:
      description: Quyết định của người giao với một nhiệm vụ AI trích (`ai.suggestion_log.decision`).
      type: string
      enum: [CHO_XAC_NHAN, DA_XAC_NHAN, DA_BO, DA_GOP]
    SuggestionField:
      description: Tên ô ghi vào `edited_fields` khi người giao sửa (SCR-0502 trường 13).
      type: string
      enum: [title, leadUnitId, coUnits, dueDate, productName, catalogItemId, keyResultId]
    TaskSuggestionFields:
      description: Các ô AI điền trên thẻ nhiệm vụ (SCR-0502 trường 5–10), tên theo `task.task`.
      type: object
      required: [title, leadUnitId, leadUnitName, coUnits, dueDate, productName]
      properties:
        title: { type: string, maxLength: 500 }
        leadUnitId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        leadUnitName: { type: string }
        coUnits:
          type: array
          items: { $ref: '#/components/schemas/AssigneeRef' }
        dueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        productName: { type: string, maxLength: 500 }
        catalogItemId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        catalogItemCode: { type: string }
        keyResultId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        keyResultCode: { type: string }
    TaskSuggestion:
      description: >-
        Một nhiệm vụ do AI trích từ văn bản (`ai.suggestion_log`, use_case `GOI_Y_NHIEM_VU`), dùng chung
        giữa MOD-02 và SVC-14.
      type: object
      required: [id, paragraphNo, confidence, decision, fields, aiFields, editedFields, similar]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        paragraphNo: { type: integer, minimum: 1 }
        confidence: { type: number, minimum: 0, maximum: 1 }
        decision: { $ref: '#/components/schemas/SuggestionDecision' }
        fields: { $ref: '#/components/schemas/TaskSuggestionFields' }
        aiFields: { $ref: '#/components/schemas/TaskSuggestionFields' }
        editedFields:
          type: array
          items: { $ref: '#/components/schemas/SuggestionField' }
        similar:
          type: array
          items: { $ref: '#/components/schemas/SimilarTask' }
        taskId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        taskCode: { type: string }
        taskStatus: { $ref: '#/components/schemas/TaskStatus' }
        reason: { type: string }
    FromDocumentRequest:
      type: object
      required: [sourceDocId, suggestionId, paragraphNo, fields, editedFields]
      properties:
        sourceDocId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        suggestionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        paragraphNo: { type: integer, minimum: 1 }
        fields: { $ref: '#/components/schemas/TaskSuggestionFields' }
        editedFields:
          type: array
          items: { $ref: '#/components/schemas/SuggestionField' }
        similarReason: { type: string, maxLength: 1000 }

    # ── Kế hoạch ──
    PlanVersionStatus:
      description: Trạng thái `task.plan_version.status` (baseline mục 9.1).
      type: string
      enum: [NHAP, CHO_DUYET, DA_DUYET, TRA_LAI]
    Plan:
      description: Kế hoạch công tác quý của một đơn vị (`task.plan`).
      type: object
      required: [id, code, period, unitId, unitName, currentVersion, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, examples: ['KH-Q4-2026-BTC'] }
        period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        unitId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        unitName: { type: string }
        currentVersion: { $ref: '#/components/schemas/PlanVersionSummary' }
        effectiveVersionNo: { type: [integer, 'null'], description: 'Phiên bản `DA_DUYET` đang hiệu lực' }
        previousPeriod:
          description: Kỳ trước có kế hoạch đã duyệt của đơn vị, cho nút "Sao chép từ {nhãn}" (nguồn của `copy-from`).
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/PeriodRef'
            - type: 'null'
        approvalDeadline: { $ref: '../common/common.yaml#/components/schemas/Date' }
        adjustmentsUsed: { type: integer }
        adjustmentsMax: { type: integer }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    PlanVersionSummary:
      type: object
      required: [planId, versionNo, status, unitName, periodLabel, itemCount]
      properties:
        planId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        versionNo: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/PlanVersionStatus' }
        unitName: { type: string }
        periodLabel: { type: string }
        itemCount: { type: integer }
        submittedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        submittedByName: { type: string }
        submittedByTitle: { type: string, description: 'Chức vụ người trình (SCR-0403 vùng 3)' }
        approvedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        approvedByName: { type: string, description: 'Người duyệt' }
    PlanItemInput:
      description: Một dòng kế hoạch theo Bảng 1 (`task.plan_item`, SCR-0402 trường 5–14).
      type: object
      required: [title, taskGroup, leadAssignee, productName, quantity, dueDate]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        originItemId:
          $ref: '../common/common.yaml#/components/schemas/Uuid'
          description: Dòng tương ứng ở phiên bản trước, để tính thêm, sửa, bỏ (đề xuất của TL-02)
        title: { type: string, minLength: 1, maxLength: 500 }
        taskGroup: { $ref: '#/components/schemas/TaskGroup' }
        keyResultId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        leadAssignee: { $ref: '#/components/schemas/AssigneeRef' }
        coAssignees:
          type: array
          items: { $ref: '#/components/schemas/AssigneeRef' }
        catalogItemId:
          $ref: '../common/common.yaml#/components/schemas/Uuid'
          description: Bỏ trống khi là việc ngoài danh mục (chờ chấm điểm)
        productName:
          type: string
          maxLength: 500
          description: >-
            Tên sản phẩm. Tên chọn theo TL-02 SCR-0402 trường 11 (`product_name`); TL-03 chưa có cột này
            trong `task.plan_item` và cần bổ sung.
        quantity: { type: number, minimum: 0 }
        unit: { type: string, maxLength: 50 }
        dueDate:
          allOf:
            - $ref: '../common/common.yaml#/components/schemas/Date'
          description: >-
            Hạn của dòng. Với dòng lặp lại (`recurrence` khác null), là hạn của lần cuối trong kỳ, thường là ngày cuối
            kỳ; hạn từng lần do máy chủ sinh khi giao việc.
        recurrence:
          type: [string, 'null']
          enum: [HANG_THANG, HANG_QUY, null]
          description: >-
            Lặp lại thay cho một hạn cố định (`task.plan_item.recurrence`; TL-03 ghi "hằng tháng, hằng quý", TL-02
            SCR-0402 trường 12 chỉ nêu "Hằng tháng"). `HANG_QUY` dùng khi kế hoạch lập cho kỳ dài hơn một quý.
        standardScore:
          type: [number, 'null']
          minimum: 0
          maximum: 100
          description: >-
            Điểm của dòng, bắt buộc khi duyệt (BR-04-05). Tên chọn theo cột `standard_score` của TL-03;
            TL-02 SCR-0402 trường 13 gọi là `score_weight`.
        flows:
          type: array
          items: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        changeReason: { type: string, maxLength: 500, description: 'Bắt buộc với mỗi thay đổi ở phiên bản điều chỉnh (BR-04-10)' }
    PlanItem:
      allOf:
        - $ref: '#/components/schemas/PlanItemInput'
        - type: object
          required: [id, lineNo]
          properties:
            lineNo: { type: integer, minimum: 1 }
            catalogItemCode: { type: string }
            pendingScore: { type: boolean, description: 'Việc ngoài danh mục chờ chấm điểm' }
    PlanCheck:
      description: Một kết quả kiểm tra tức thì của kế hoạch.
      type: object
      required: [rule, level, message]
      properties:
        rule: { type: string, examples: ['BR-04-03'] }
        level: { type: string, enum: [CHAN, CANH_BAO] }
        lineNo: { type: integer }
        message: { type: string }
        msg: { type: string, examples: ['MSG-04-04'] }
    PlanVersion:
      description: Một phiên bản kế hoạch kèm các dòng (`task.plan_version`, `task.plan_item`).
      type: object
      required: [planId, versionNo, status, period, unitName, items, groupWeights, checks, rowVersion]
      properties:
        planId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        versionNo: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/PlanVersionStatus' }
        period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        unitName: { type: string }
        approvalDeadline: { $ref: '../common/common.yaml#/components/schemas/Date' }
        workingDaysToDeadline: { type: integer }
        contentHash: { type: [string, 'null'], description: 'SHA-256 tính khi gửi duyệt' }
        reviewComment: { type: [string, 'null'], maxLength: 2000 }
        items:
          type: array
          items: { $ref: '#/components/schemas/PlanItem' }
        groupWeights:
          type: object
          description: Điểm tối đa của từng nhóm theo Policy Pack (BR-04-06), kèm luồng và gói áp dụng (Hình 7.13 vùng 3).
          required: [THUONG_XUYEN, THEN_CHOT]
          properties:
            THUONG_XUYEN: { type: number }
            THEN_CHOT: { type: number }
            flow: { $ref: '../common/common.yaml#/components/schemas/Flow' }
            policyPackCode: { type: string, examples: ['PP-KHOI-DANG'] }
            policyPackName: { type: string, examples: ['Khối Đảng'] }
            policyPackVersion: { type: string, examples: ['2.0.0'] }
        checks:
          type: array
          items: { $ref: '#/components/schemas/PlanCheck' }
        changeReason: { type: [string, 'null'], maxLength: 1000, description: 'Lý do chung của lần điều chỉnh' }
        removedItems:
          type: array
          description: Dòng của phiên bản trước bị bỏ ở phiên bản điều chỉnh này, kèm lý do.
          items: { $ref: '#/components/schemas/PlanRemovedItem' }
        signRequestId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    PlanVersionInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 500
          items: { $ref: '#/components/schemas/PlanItemInput' }
        removedItems:
          type: array
          maxItems: 500
          description: >-
            Ở phiên bản điều chỉnh, các dòng của phiên bản trước bị bỏ cùng lý do (BR-04-10 chặn khi thiếu lý do).
            Dòng phiên bản trước không có trong `items` cũng không có ở đây bị coi là thiếu lý do.
          items: { $ref: '#/components/schemas/PlanRemovedItem' }
    PlanRemovedItem:
      type: object
      required: [originItemId, changeReason]
      properties:
        originItemId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        changeReason: { type: string, minLength: 1, maxLength: 500 }
    PlanDiffLine:
      type: object
      required: [change]
      properties:
        change: { type: string, enum: [THEM, SUA, BO, KHONG_DOI] }
        before: { $ref: '#/components/schemas/PlanItem' }
        after: { $ref: '#/components/schemas/PlanItem' }
        changedFields:
          type: array
          items: { type: string }
        reason: { type: string }
    PlanDiff:
      type: object
      required: [baseVersionNo, versionNo, added, modified, removed, lines]
      properties:
        baseVersionNo: { type: integer }
        versionNo: { type: integer }
        added: { type: integer }
        modified: { type: integer }
        removed: { type: integer }
        groupWeightChanged: { type: boolean }
        adjustmentNo: { type: integer, description: 'Lần điều chỉnh hiện tại' }
        adjustmentsMax: { type: integer }
        lines:
          type: array
          items: { $ref: '#/components/schemas/PlanDiffLine' }
    PlanItemRef:
      description: Dòng kế hoạch đã duyệt dùng làm nguồn giao việc (BR-05-04).
      type: object
      required: [id, planCode, version, lineNo, title, taskGroup, productName, quantity, unit, dueDate, evidenceRequired, qualityCriteria]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        planCode: { type: string }
        version: { type: integer }
        lineNo: { type: integer }
        title: { type: string }
        catalogItemId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        taskGroup: { $ref: '#/components/schemas/TaskGroup' }
        keyResultId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        productName: { type: string }
        quantity: { type: number }
        unit: { type: string }
        dueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        evidenceRequired: { type: string }
        qualityCriteria: { type: string }

    # ── Danh mục ──
    WorkCatalogStatus:
      description: Trạng thái phiên bản danh mục (`task.work_catalog.status`, suy luận).
      type: string
      enum: [NHAP, AP_DUNG, HET_HIEU_LUC]
    CatalogItemStatus:
      type: string
      enum: [AP_DUNG, NGUNG]
    WorkCatalog:
      description: Một phiên bản danh mục công việc theo vị trí việc làm (`task.work_catalog`).
      type: object
      required: [id, name, versionNo, status, itemCount, positionCount, rowVersion, difficultyFactors, scoreSuggestion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        name: { type: string }
        versionNo: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/WorkCatalogStatus' }
        effectiveFromLabel: { type: string, examples: ['Quý IV/2026'] }
        effectiveFromDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        parentCatalogName: { type: string }
        itemCount: { type: integer }
        positionCount: { type: integer }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
        difficultyFactors:
          type: object
          description: Hệ số mức khó từ Policy Pack, chỉ để gợi ý điểm.
          additionalProperties: { type: number }
        scoreSuggestion:
          type: object
          description: Điểm gợi ý cho từng mức khó.
          additionalProperties: { type: number }
    Position:
      description: Vị trí việc làm (`org.position`).
      type: object
      required: [id, name]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        name: { type: string }
    CatalogItem:
      description: Mục danh mục công việc theo Bảng 3 (`task.catalog_item`).
      type: object
      required: [id, code, name, productName, unit, difficulty, baseScore, qualityCriteria, defaultGroup]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        catalogId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, examples: ['TC-DV-06'] }
        name: { type: string, maxLength: 500 }
        positionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        positionName: { type: string }
        productName: { type: string }
        unit: { type: string }
        difficulty: { type: integer, minimum: 1, maximum: 5, description: 'Mức khó năm mức (BR-04-14)' }
        baseScore: { type: number, minimum: 0, maximum: 100, description: 'Điểm chuẩn (`base_score`)' }
        qualityCriteria: { type: string }
        evidenceRequired: { type: string }
        defaultGroup: { $ref: '#/components/schemas/TaskGroup' }
        standardDays: { type: integer, minimum: 1, description: 'Thời hạn chuẩn, ngày làm việc' }
        status: { $ref: '#/components/schemas/CatalogItemStatus' }
        usageCount: { type: integer }
        usagePeriods: { type: integer }
        usedInLockedPeriod: { type: boolean, description: 'Đã dùng ở kỳ đã khoá (BR-04-13)' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    CatalogItemInput:
      type: object
      required: [name, productName, unit, difficulty, baseScore, qualityCriteria, defaultGroup]
      properties:
        code: { type: string, description: 'Bỏ trống thì máy chủ tự sinh' }
        positionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        name: { type: string, minLength: 1, maxLength: 500 }
        productName: { type: string, maxLength: 500 }
        unit: { type: string, maxLength: 50 }
        difficulty: { type: integer, minimum: 1, maximum: 5 }
        baseScore: { type: number, minimum: 0, maximum: 100 }
        qualityCriteria: { type: string, maxLength: 2000 }
        evidenceRequired: { type: string, maxLength: 1000 }
        defaultGroup: { $ref: '#/components/schemas/TaskGroup' }
        standardDays: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/CatalogItemStatus' }
    CatalogItemSaveResult:
      type: object
      required: [item, catalog, movedToNewVersion]
      properties:
        item: { $ref: '#/components/schemas/CatalogItem' }
        catalog: { $ref: '#/components/schemas/WorkCatalog' }
        movedToNewVersion: { type: boolean, description: 'Thay đổi được lưu ở phiên bản khác phiên bản đang xem' }
    CatalogItemsPage:
      type: object
      required: [items, nextCursor, total, positionCount]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CatalogItem' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
        total: { type: integer, description: 'Tổng số mục theo bộ lọc (SCR-0401 cần hiển thị)' }
        positionCount: { type: integer }
    CatalogImportJob:
      description: Một lần nhập Excel danh mục.
      type: object
      required: [id, fileName, status, totalRows, validRows, errorGroups]
      properties:
        id: { type: string }
        fileName: { type: string }
        status: { type: string, enum: [DANG_XU_LY, XONG, LOI] }
        totalRows: { type: integer }
        validRows: { type: integer }
        errorGroups:
          type: array
          items:
            type: object
            required: [reason, count, kind]
            properties:
              reason: { type: string }
              count: { type: integer }
              kind: { type: string, enum: [THIEU, MO_HO, KHAC] }
        finishedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    TaskRegistrationDecision:
      type: object
      required: [approve]
      properties:
        approve: { type: boolean, description: 'true = duyệt giao việc (`DA_GIAO`), false = từ chối (`HUY`)' }
        reason: { type: string, maxLength: 1000, description: 'Bắt buộc khi `approve = false`' }
        dueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        quantity: { type: integer, minimum: 1, maximum: 99 }
    TaskBlockerEscalateRequest:
      type: object
      required: [note]
      properties:
        targetUnitId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        targetPersonId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        note: { type: string, minLength: 5, maxLength: 2000 }
    TaskKeyWrap:
      description: Khoá nội dung nhiệm vụ C3 đã bọc cho một thiết bị người nhận (`task.e2ee_key_wrap`, ADR-06).
      type: object
      required: [recipientPersonId, deviceId, algorithm, wrappedKey]
      properties:
        recipientPersonId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        deviceId: { type: string, maxLength: 64 }
        algorithm: { type: string, enum: [ECDH-ES+A256KW, RSA-OAEP-256], default: ECDH-ES+A256KW }
        ephemeralPublicKey: { type: string, contentEncoding: base64 }
        wrappedKey: { type: string, contentEncoding: base64 }
        createdAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    TaskSecretContentInput:
      type: object
      required: [ciphertext, nonce, aadHash, sha256, keyWraps]
      properties:
        ciphertext: { type: string, contentEncoding: base64 }
        nonce: { type: string, contentEncoding: base64 }
        aadHash: { type: string, pattern: '^[0-9a-f]{64}$' }
