          application/json:
            schema: { $ref: '#/components/schemas/PlanVersionInput' }
      responses:
        '200':
          description: Phiên bản sau khi lưu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
