    post:
      tags: [Kế hoạch quý]
      operationId: createPlanAdjustment
      summary: Tạo điều chỉnh kế hoạch
      description: >-
        Tạo phiên bản n+1 `NHAP` sao chép từ phiên bản `DA_DUYET` hiệu lực; vượt số lần điều chỉnh
        trong quý trả 422 (BR-04-10, MSG-04-07). Lý do chung của lần điều chỉnh ghi vào
        `task.plan_version.change_reason` (TL-03 bắt buộc khi `version_no > 1`); lý do từng dòng thêm, sửa ghi ở
        `PlanItemInput.changeReason`, dòng bỏ ghi ở `PlanVersionInput.removedItems` (TL-02 SCR-0403 trường 3).
      parameters:
