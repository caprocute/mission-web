    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
      - $ref: '#/components/parameters/VersionNo'
    post:
      tags: [Kế hoạch quý]
      operationId: approvePlanVersion
      summary: Duyệt và ký số kế hoạch
      description: >-
        Người duyệt khác người lập, phiên AAL2 trong 15 phút. Máy chủ tạo yêu cầu ký trên SVC-10 và trả
        202 kèm job. Đường chính thức để theo dõi: thăm dò `GET /jobs/{id}` theo `Location`; khi job `HOAN_TAT`,
        `Job.resultLocation` trỏ tới `/esign/requests/{signRequestId}` và `PlanVersion.signRequestId` được ghi, nên
        giao diện có thể đọc lại phiên bản rồi theo dõi yêu cầu ký. Khi ký xong (EVT-18) phiên bản chuyển `DA_DUYET`
        và phát EVT-03.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
