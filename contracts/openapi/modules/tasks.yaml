          schema: { type: integer, minimum: 0 }
        - name: mode
          in: query
          schema: { type: string, enum: [changes, all], default: changes }
      responses:
        '200':
          description: Khác biệt giữa hai phiên bản.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlanDiff' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04]
        scr: [SCR-0403]
        owner: MOD-02
        roles: [leader, manager, appraiser]
