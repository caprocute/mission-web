      description: >-
        Trả bản mã E2EE của nhiệm vụ C3 (`task.task_secret_blob`) và khoá nội dung đã bọc (`task.e2ee_key_wrap`)
        cho thiết bị của người gọi (ADR-06; TL-01 chương 9).
      responses:
        '200':
          description: Bản mã C3 và khoá bọc của người gọi.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSecretContent' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05, QT-06]
        scr: [SCR-0501, SCR-0502, SCR-0601]
        owner: MOD-02
        roles: [member, manager, leader]
        scope: B; Gn
        source: 'ADR-06; TL-01 chương 9; TL-03 task.task_secret_blob, task.e2ee_key_wrap'
    put:
      tags: [Nhiệm vụ]
      operationId: saveTaskSecretContent
      summary: Lưu bản mã C3 và danh sách khoá bọc ban đầu
      description: >-
        Lưu bản mã AES256-GCM (`ciphertext`, `nonce`, `aadHash`, `sha256`) và danh sách khoá bọc
        cho những người được phép giải mã (ADR-06).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskSecretContentInput' }
      responses:
        '200':
          description: Siêu dữ liệu bản mã C3 đã lưu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSecretContentMeta' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05]
        scr: [SCR-0501, SCR-0502]
        owner: MOD-02
        roles: [member, manager, leader]
        scope: B; Gn
        source: 'ADR-06; TL-01 chương 9; TL-03 task.task_secret_blob, task.e2ee_key_wrap'

