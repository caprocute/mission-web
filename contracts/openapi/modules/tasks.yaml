      x-mission:
        qt: [QT-04]
        scr: [SCR-0402]
        owner: MOD-02
        roles: [manager]
        scope: Đv
        rules: [BR-04-10]
        source: 'TL-02a SCR-0402 "Tạo điều chỉnh"'

