# Nguồn: baseline mục 9 (schema task), 9.1 (trạng thái nhiệm vụ, kế hoạch), 13 (quy ước API);
# TL-01 Phụ lục C mục "Giao việc và KPI (MOD-02)"; TL-02a SCR-0401 (part-05), SCR-0402, SCR-0403 (part-05),
# SCR-0501, SCR-0502, SCR-0503, SCR-0504 (part-06), SCR-0601, SCR-0602 (part-07), SCR-0002 (part-03);
# TL-02b SCR-1601 (nhắc, giao lại; part-05); TL-03 schema `task`; ma trận docs/phan-quyen/ma-tran.json.
# Tương thích: giữ đường dẫn và tên trường mà frontend đã dùng (frontend/projects/api-client/src/lib/models)
# khi không trái TL; các điểm chốt HD-03, HD-04 xem contracts/openapi/README.md.
openapi: 3.1.0
info:
  title: Mission – Giao việc và KPI (MOD-02)
  version: 1.0.0-draft.1
  description: >-
    Hợp đồng của module `task` trong mission-core (SVC-05): danh mục công việc theo Bảng 3, kế hoạch
    công tác quý có phiên bản theo Bảng 1, nhiệm vụ với chủ trì và phối hợp, tiến độ, điểm nghẽn, đề
    nghị gia hạn và điều chỉnh, văn bản chỉ đạo đến. Máy trạng thái nhiệm vụ là máy trạng thái khai báo
    trong mã (ADR-04 tầng 1), không qua BPMN.
servers:
  - url: /api/v1
security:
  - keycloak: []
tags:
  - name: Nhiệm vụ
    description: Giao việc, việc của tôi, chi tiết, chuyển trạng thái (QT-05, QT-06).
  - name: Tiến độ và điểm nghẽn
    description: Cập nhật tiến độ chỉ ghi thêm, báo và xử lý điểm nghẽn (QT-06).
  - name: Đề nghị điều chỉnh
    description: Gia hạn, điều chỉnh số lượng hoặc sản phẩm, tạm dừng, huỷ (SCR-0602).
  - name: Văn bản đến
    description: Văn bản chỉ đạo nhận qua SVC-13 và tạo nhiệm vụ từ văn bản (SCR-0502).
  - name: Kế hoạch quý
    description: Kế hoạch công tác quý có phiên bản, duyệt có ký số (QT-04).
  - name: Danh mục công việc
    description: Thư viện danh mục công việc theo vị trí việc làm (SCR-0401).

paths:
  # ───────────────────────────── Nhiệm vụ ─────────────────────────────
  /tasks:
    get:
      tags: [Nhiệm vụ]
      operationId: listUnitTasks
      summary: Việc của đơn vị
      description: >-
        Danh sách nhiệm vụ theo đơn vị và kỳ cho người giao việc và lãnh đạo. Danh sách "Việc của tôi"
        dùng `/tasks/mine` (điểm chốt HD-04). Lọc theo KR dùng tham số `kr` (SCR-0201 "Xem tất cả nhiệm
        vụ liên kết").
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/UnitId'
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - name: status
          in: query
          description: Danh sách trạng thái phân tách bằng dấu phẩy.
          schema: { type: string }
        - name: kr
          in: query
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: overdue
          in: query
          schema: { type: boolean }
        - name: includeSubunits
          in: query
          description: Gồm cả đơn vị cấp dưới (lãnh đạo, giám sát).
          schema: { type: boolean, default: false }
        - $ref: '../common/common.yaml#/components/parameters/Q'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang nhiệm vụ.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSummaryPage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05, QT-16]
        scr: [SCR-0201, SCR-1601]
        owner: MOD-02
        roles: [manager, leader, inspector, appraiser, ai_readonly]
        scope: Đv
        source: 'TL-01 PL C; TL-02a SCR-0201; TL-02b SCR-1601'
    post:
      tags: [Nhiệm vụ]
      operationId: createTaskDraft
      summary: Lưu nháp nhiệm vụ lần đầu
      description: Tạo nhiệm vụ ở trạng thái `NHAP` từ bản đang soạn của SCR-0501. Chưa phát sự kiện.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskDraft' }
      responses:
        '201':
          description: Bản nháp đã lưu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDraft' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409':
          description: Kỳ đã khoá (`TASK-409-PERIOD-LOCKED`).
          $ref: '../common/common.yaml#/components/responses/Conflict'
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05]
        scr: [SCR-0501]
        owner: MOD-02
        roles: [manager, leader]
        scope: Đv
        source: 'TL-01 PL C; TL-02a SCR-0501 "Lưu nháp"'

  /tasks/mine:
    get:
      tags: [Nhiệm vụ]
      operationId: listMyTasks
      summary: Việc của tôi
      description: >-
        Nhiệm vụ người dùng chủ trì hoặc phối hợp trong kỳ, kèm số đếm từng bộ lọc nhanh và danh sách
        KR để lọc (SCR-0503, SCR-0504, khối "Việc hôm nay" của SCR-0002). Điểm chốt HD-04: TL ghi
        `/tasks?assignee=me`, hợp đồng tách thành đường dẫn riêng vì lược đồ trả khác danh sách đơn vị.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - name: filter
          in: query
          description: Bộ lọc nhanh (SCR-0503 trường 1); bỏ trống tương đương `TAT_CA`.
          schema: { $ref: '#/components/schemas/MyTasksQuickFilter' }
        - name: view
          in: query
          description: '`today` cho khối việc hôm nay ở trang chủ (SCR-0002).'
          schema: { type: string, enum: [today] }
        - name: status
          in: query
          description: Danh sách trạng thái phân tách bằng dấu phẩy.
          schema: { type: string }
        - name: overdue
          in: query
          schema: { type: boolean }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/AssigneeRole' }
        - name: group
          in: query
          schema: { $ref: '#/components/schemas/TaskGroup' }
        - name: kr
          in: query
          description: Lọc theo KR liên kết.
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - $ref: '../common/common.yaml#/components/parameters/Q'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang "Việc của tôi".
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyTasksPage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05, QT-00]
        scr: [SCR-0503, SCR-0504, SCR-0002]
        owner: MOD-02
        roles: [member, manager, leader]
        scope: B
        source: 'TL-01 PL C "/tasks?assignee=me"; TL-02a SCR-0503; mã frontend `/tasks/mine`'

  /tasks/drafts/new:
    get:
      tags: [Nhiệm vụ]
      operationId: getNewTaskDraft
      summary: Khung soạn nhiệm vụ mới
      description: >-
        Máy chủ điền kỳ đang mở, đơn vị và người giao theo ngữ cảnh phân công, giá trị mặc định
        (SCR-0501). Không tạo bản ghi. (suy luận: TL-02 không ghi API riêng cho bước mở màn hình.)
      responses:
        '200':
          description: Khung soạn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDraftTemplate' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05]
        scr: [SCR-0501]
        owner: MOD-02
        roles: [manager, leader]
        scope: Đv
        source: 'Mã frontend WEB-028 (suy luận)'

  /tasks/assign-check:
    post:
      tags: [Nhiệm vụ]
      operationId: checkTaskAssignment
      summary: Kiểm tra trước khi giao
      description: >-
        Kiểm tra tức thì của MOD-02 cho bản đang soạn (QT-05 bước 5): BR-05-01 đến BR-05-04, BR-05-06,
        BR-05-09, BR-05-11; trả nhiệm vụ gần giống, số ngày làm việc tới hạn và khối lượng của người chủ
        trì. Không ghi dữ liệu nên không cần `Idempotency-Key`. (suy luận: TL-02 mô tả kiểm tra nhưng
        không đặt tên API.)
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskDraft' }
      responses:
        '200':
          description: Kết quả kiểm tra.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssignCheckResult' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05]
        scr: [SCR-0501]
        owner: MOD-02
        roles: [manager, leader]
        scope: Đv
        rules: [BR-05-01, BR-05-02, BR-05-03, BR-05-04, BR-05-06, BR-05-09, BR-05-11]
        source: 'TL-02a SCR-0501 "Danh sách kiểm tra"; mã frontend WEB-028'

  /tasks/bulk-assign:
    post:
      tags: [Nhiệm vụ]
      operationId: bulkAssignTasks
      summary: Giao đồng loạt cho nhiều đơn vị
      description: Tạo một nhiệm vụ cho mỗi đơn vị nhận và giao ngay; chạy nền, trả 202.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkAssignRequest' }
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05]
        scr: [SCR-0501]
        owner: MOD-02
        evt: [EVT-04, EVT-21]
        roles: [manager, leader]
        scope: ĐvD
        source: 'TL-02a SCR-0501 "Giao đồng loạt"'

  /tasks/assign-batch:
    post:
      tags: [Văn bản đến]
      operationId: assignTaskBatch
      summary: Giao các nhiệm vụ đã xác nhận từ văn bản
      description: >-
        Giao hàng loạt các nhiệm vụ `NHAP` đã xác nhận ở SCR-0502. Mỗi nhiệm vụ xử lý độc lập; nhiệm vụ
        lỗi không làm hỏng nhiệm vụ khác.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskIds]
              properties:
                taskIds:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
      responses:
        '200':
          description: Kết quả từng nhiệm vụ.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/AssignBatchResult' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05]
        scr: [SCR-0502]
        owner: MOD-02
        evt: [EVT-04]
        roles: [manager, leader]
        scope: Đv
        source: 'TL-02a SCR-0502 "Xác nhận và giao"'

  /tasks/progress-batch:
    post:
      tags: [Tiến độ và điểm nghẽn]
      operationId: updateTaskProgressBatch
      summary: Cập nhật tiến độ hàng loạt
      description: >-
        Mỗi dòng mang `rowVersion` riêng thay cho `If-Match`; máy chủ xử lý độc lập từng dòng và trả mã
        HTTP tương đương cho từng dòng (409 khi lệch phiên bản).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '#/components/schemas/ProgressBatchItem' }
      responses:
        '200':
          description: Kết quả từng dòng.
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/ProgressBatchResult' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-06]
        scr: [SCR-0503]
        owner: MOD-02
        evt: [EVT-05]
        roles: [member, manager]
        scope: B
        source: 'TL-02a SCR-0503 "Cập nhật tiến độ hàng loạt"'

  /tasks/registrations:
    post:
      tags: [Nhiệm vụ]
      operationId: registerTask
      summary: Cán bộ đăng ký nhiệm vụ từ danh mục
      description: Tạo nhiệm vụ `NHAP` có nguồn `DANG_KY`, gửi người quản lý trực tiếp xem xét (QT-05 bước 1c).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskRegistration' }
      responses:
        '201':
          description: Nhiệm vụ đăng ký đã tạo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskSummary' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05]
        scr: [SCR-0503]
        owner: MOD-02
        evt: [EVT-21]
        roles: [member]
        scope: B
        source: 'TL-02a SCR-0503 "Gửi đăng ký"'

  /tasks/{id}/registration-decision:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Nhiệm vụ]
      operationId: decideTaskRegistration
      summary: Duyệt hoặc từ chối nhiệm vụ do cán bộ đăng ký
      description: >-
        Người quản lý trực tiếp xem xét nhiệm vụ đăng ký (QT-05 bước 1c): duyệt chuyển sang `DA_GIAO`,
        hoặc từ chối chuyển sang `HUY` kèm lý do.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskRegistrationDecision' }
      responses:
        '200':
          description: Nhiệm vụ sau khi ra quyết định đăng ký.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05]
        scr: [SCR-0501, SCR-0503]
        owner: MOD-02
        evt: [EVT-04, EVT-21]
        roles: [manager, leader]
        scope: Đv
        source: 'TL-02a QT-05 bước 1c; SCR-0503 (suy luận đường dẫn)'

  /tasks/export:
    post:
      tags: [Nhiệm vụ]
      operationId: exportTasks
      summary: Xuất Excel danh sách đang lọc
      description: Tạo tác vụ xuất (tối đa 100.000 dòng); trả 202, tệp lấy ở `resultLocation` của job.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskExportRequest' }
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '429': { $ref: '../common/common.yaml#/components/responses/TooManyRequests' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05]
        scr: [SCR-0503]
        owner: MOD-02
        roles: [member, manager, leader]
        scope: B
        source: 'TL-02a SCR-0503 "Xuất Excel"'

  /tasks/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Nhiệm vụ]
      operationId: getTask
      summary: Chi tiết nhiệm vụ
      description: Chi tiết nhiệm vụ cho người được giao, người giao và cấp trên (SCR-0601).
      responses:
        '200':
          description: Nhiệm vụ.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDetail' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-06]
        scr: [SCR-0601]
        owner: MOD-02
        roles: [member, manager, leader, appraiser, inspector, ai_readonly]
        scope: B
        source: 'TL-01 PL C; TL-02a SCR-0601'
    put:
      tags: [Nhiệm vụ]
      operationId: saveTaskDraft
      summary: Lưu nháp nhiệm vụ
      description: Chỉ sửa được khi nhiệm vụ còn `NHAP`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskDraft' }
      responses:
        '200':
          description: Bản nháp đã lưu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskDraft' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: Lệch phiên bản (`TASK-409-VERSION-CONFLICT`) hoặc nhiệm vụ không còn `NHAP` (`TASK-409-NOT-DRAFT`).
          $ref: '../common/common.yaml#/components/responses/Conflict'
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-05]
        scr: [SCR-0501]
        owner: MOD-02
        roles: [manager, leader]
        scope: Đv
        source: 'TL-02a SCR-0501 "Lưu nháp"'
    delete:
      tags: [Nhiệm vụ]
      operationId: deleteTaskDraft
      summary: Huỷ bản nháp
