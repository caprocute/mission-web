      tags: [Kế hoạch quý]
      operationId: savePlanVersion
      summary: Lưu nháp phiên bản kế hoạch
      description: >-
        Ghi toàn bộ dòng của phiên bản `NHAP` hoặc `TRA_LAI`. Kiểm tra tức thì trả về trong `checks`
        của phản hồi; lỗi chặn chỉ ngăn gửi duyệt, không ngăn lưu nháp.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
