        qt: [QT-04]
        scr: [SCR-0402]
        owner: MOD-02
        roles: [manager]
        scope: Đv
        rules: [BR-04-02, BR-04-03, BR-04-04, BR-04-05, BR-04-06]
        source: 'TL-02a SCR-0402 "Lưu nháp"'

