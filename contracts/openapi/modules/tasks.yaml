        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-04]
        scr: [SCR-0403]
        owner: MOD-02
        evt: [EVT-03, EVT-18]
        roles: [leader]
        scope: Gn
        aal: 2
        fourEyes: true
        source: 'TL-02a SCR-0403 "Duyệt và ký số"; TL-01 PL C "/plans/{id}/approve"'

