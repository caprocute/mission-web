                    versionNo: 4
                    status: NHAP
                    bpmnXml: '<definitions xmlns="http://www.omg.org/spec/BPMN/20100524/MODEL">…</definitions>'
                    bpmnSha256: 1a2b3c4d5e6f708192a3b4c5d6e7f8091a2b3c4d5e6f708192a3b4c5d6e7f809
                    paramSchema: { type: object }
                    tenantBindingCount: 0
                    testCount: 24
                    updatedAt: '2026-10-19T11:00:00+07:00'
                    rowVersion: 0
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409':
          description: Đã có phiên bản `NHAP` khác của cùng mã mẫu (`WORKFLOW-409-DRAFT-EXISTS`).
