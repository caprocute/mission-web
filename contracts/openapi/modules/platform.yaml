  /ai/suggestions/{id}/decision:
    post:
      tags: [AI]
      operationId: decideAiSuggestion
      summary: Ghi quyết định của người dùng với một gợi ý AI
      description: >-
        Ghi `ai.suggestion_log.user_action` (`CHAP_NHAN`, `SUA`, `BO_QUA`), lý do, danh sách ô đã sửa và người chấp
        nhận. Thao tác này chỉ ghi nhật ký của SVC-14; nội dung nghiệp vụ được ghi bằng API của module dưới danh
        tính người dùng (ví dụ `POST /tasks/from-document`, `PUT /okr/objectives/{id}`), BR-02-11, BR-05-05.
        Một đường dẫn duy nhất thay cho `/accept` và `/dismiss` của SCR-1701. Với gợi ý trích nhiệm vụ
        (`use_case = GOI_Y_NHIEM_VU`) phản hồi là `TaskSuggestion` của tasks.yaml mà frontend SCR-0502 đang dùng
        (`decision = BO_QUA` cho ra `DA_BO`); với ca dùng khác là `AiSuggestion`. Không dùng `If-Match` vì
        `ai.suggestion_log` không có `row_version`; quyết định đã ghi rồi thì trả 409.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdPath'
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
