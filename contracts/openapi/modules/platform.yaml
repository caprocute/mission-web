components:
  securitySchemes:
    keycloak: { $ref: '../common/common.yaml#/components/securitySchemes/keycloak' }
    serviceClient: { $ref: '../common/common.yaml#/components/securitySchemes/serviceClient' }

  parameters:
    WorkflowTaskId:
      name: taskId
      in: path
      required: true
      description: Mã user task Flowable (`ACT_RU_TASK.ID_`, `flowable.wf_task_projection.task_id`), không phải UUID.
      schema: { type: string, maxLength: 64 }
    BusinessKey:
      name: businessKey
      in: path
      required: true
      description: >-
        Khoá nghiệp vụ của tiến trình dạng `<businessType>:<businessId>` (suy luận từ cặp `business_type`,
        `business_id` của `flowable.wf_task_projection`).
      schema: { type: string, maxLength: 128, examples: ['OKR_OBJECTIVE:0192f2c4-5d6e-7f80-91a2-b3c4d5e6f701'] }

  schemas:
    # ── Registry ──
    RegistryTenancyModel:
      description: Mô hình thuê bao (`registry.tenant.tenancy_model`, `registry.cell.tenancy_model`, ADR-07).
      type: string
      enum: [SILO, BRIDGE, POOL, AIRGAP]
    RegistryTenantStatus:
      description: Trạng thái vòng đời tenant (`registry.tenant.status`, TL-02a QT-01).
      type: string
      enum: [KHOI_TAO, DANG_CAP_PHAT, DANG_CAU_HINH, SAN_SANG, DANG_VAN_HANH, TAM_NGUNG, DANG_CHUYEN_CELL, DA_CHAM_DUT]
    CellStatus:
      description: Trạng thái cell (`registry.cell.status`).
      type: string
      enum: [HOAT_DONG, BAO_TRI, NGUNG]
    DataCenter:
      description: Trung tâm dữ liệu chính (`registry.cell.primary_dc`).
      type: string
      enum: [HOALAC, PHIANAM, TAICHO]
    DomainKind:
      description: Loại tên miền (`registry.tenant_domain.kind`).
      type: string
      enum: [PRIMARY, ALIAS, EMBED]
    RegistryCellRef:
      type: object
      required: [id, code]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 16, examples: [CELL-HN] }
        apiBaseUrl: { type: string, format: uri }
    TenantIdpInfo:
      description: IdP liên kết của tenant (`registry.tenant_idp`), chỉ phần cần cho khám phá IdP.
      type: object
      required: [idpAlias, protocol, issuer, isVneid]
      properties:
        idpAlias: { type: string, maxLength: 64 }
        protocol: { type: string, enum: [OIDC, SAML] }
        issuer: { type: string, maxLength: 255 }
        isVneid: { type: boolean }
        emailDomains:
          type: array
          items: { type: string }
    TenantResolution:
      description: Kết quả tra cell của tenant (TL-01 SVC-03 "Trả cell, URL IdP, trạng thái").
      type: object
      required: [tenantId, tenantCode, status, tenancyModel, cell, cacheTtlSeconds]
      properties:
        tenantId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        tenantCode: { type: string, maxLength: 32, pattern: '^[a-z0-9_]+$' }
        tenantName: { type: string, maxLength: 255 }
        status: { $ref: '#/components/schemas/RegistryTenantStatus' }
        tenancyModel: { $ref: '#/components/schemas/RegistryTenancyModel' }
        cell: { $ref: '#/components/schemas/RegistryCellRef' }
        idps:
          type: array
          items: { $ref: '#/components/schemas/TenantIdpInfo' }
        cacheTtlSeconds: { type: integer, minimum: 0, description: 'Thời gian được lưu đệm kết quả, mặc định 300.' }
      examples:
        - tenantId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
          tenantCode: dukcqtw
          status: DANG_VAN_HANH
          tenancyModel: BRIDGE
          cell: { id: 0192f1a2-0000-7c00-8a00-00000000c001, code: CELL-HN, apiBaseUrl: 'https://api.cell-hn.okrkpi.vn' }
          cacheTtlSeconds: 300
    RegistryCell:
      description: Cell (`registry.cell`) kèm tải hiện tại.
      type: object
      required: [id, code, name, primaryDc, tenancyModel, apiBaseUrl, capacityAccounts, status]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 16 }
        name: { type: string, maxLength: 255 }
        primaryDc: { $ref: '#/components/schemas/DataCenter' }
        standbyDc: { type: [string, 'null'], maxLength: 16 }
        tenancyModel: { $ref: '#/components/schemas/RegistryTenancyModel' }
        apiBaseUrl: { type: string, maxLength: 255 }
        capacityAccounts: { type: integer, minimum: 0 }
        status: { $ref: '#/components/schemas/CellStatus' }
        tenantCount: { type: integer, minimum: 0, description: 'Số tenant đang gắn (suy luận).' }
        accountCount: { type: integer, minimum: 0, description: 'Tổng tài khoản các tenant của cell (suy luận).' }
      examples:
        - id: 0192f1a2-0000-7c00-8a00-00000000c001
          code: CELL-HN
          name: Cell Hà Nội
          primaryDc: HOALAC
          tenancyModel: BRIDGE
          apiBaseUrl: 'https://api.cell-hn.okrkpi.vn'
          capacityAccounts: 1500000
          status: HOAT_DONG
    CellPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/RegistryCell' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    TenantDomain:
      type: object
      required: [domain, kind]
      properties:
        domain: { type: string, maxLength: 253 }
        kind: { $ref: '#/components/schemas/DomainKind' }
        verifiedAt:
          oneOf:
            - { $ref: '../common/common.yaml#/components/schemas/DateTime' }
            - { type: 'null' }
    TenantCellBinding:
      description: Lần gắn cell hiện hành (`registry.tenant_cell`).
      type: object
      required: [id, code, databaseName, validFrom]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 16 }
        databaseName: { type: string, maxLength: 63 }
        validFrom: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    RegistryTenantCreate:
      type: object
      required: [code, name, sector, tenancyModel, cellId, flows, maxAccounts]
      properties:
        code: { type: string, maxLength: 32, pattern: '^[a-z0-9_]+$' }
        name: { type: string, maxLength: 255 }
        sector: { $ref: './config.yaml#/components/schemas/TenantSector' }
        tenancyModel: { $ref: '#/components/schemas/RegistryTenancyModel' }
        cellId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        flows:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        maxAccounts: { type: integer, minimum: 1 }
        expectedAccounts: { type: integer, minimum: 0 }
        contractRef: { type: string, maxLength: 100 }
        contractValidTo: { $ref: '../common/common.yaml#/components/schemas/Date' }
        onboardingCode: { type: string, maxLength: 32 }
        domains:
          type: array
          items:
            type: object
            required: [domain, kind]
            properties:
              domain: { type: string, maxLength: 253 }
              kind: { $ref: '#/components/schemas/DomainKind' }
    RegistryTenant:
      description: Bản ghi danh bạ tenant (`registry.tenant`). Không chứa `kek_ref`.
      type: object
      required: [id, code, name, sector, tenancyModel, status, flows, maxAccounts, accountCount, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 32 }
        name: { type: string, maxLength: 255 }
        sector: { $ref: './config.yaml#/components/schemas/TenantSector' }
        tenancyModel: { $ref: '#/components/schemas/RegistryTenancyModel' }
        status: { $ref: '#/components/schemas/RegistryTenantStatus' }
        flows:
          type: array
          items: { $ref: '../common/common.yaml#/components/schemas/Flow' }
        maxAccounts: { type: integer }
        expectedAccounts: { type: integer }
        accountCount: { type: integer }
        contractRef: { type: string }
        contractValidTo: { $ref: '../common/common.yaml#/components/schemas/Date' }
        onboardingCode: { type: string }
        currentCell: { $ref: '#/components/schemas/TenantCellBinding' }
        domains:
          type: array
          items: { $ref: '#/components/schemas/TenantDomain' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
        createdAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
      examples:
        - id: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
          code: dukcqtw
          name: Đảng uỷ Khối các cơ quan Trung ương
          sector: DANG
          tenancyModel: BRIDGE
          status: DANG_VAN_HANH
          flows: [DANG]
          maxAccounts: 60000
          accountCount: 51870
          rowVersion: 5
    TenantMoveStatus:
      description: Trạng thái đề nghị chuyển cell (suy luận; TL-03 chưa có bảng riêng, vết nằm ở `registry.tenant_status_log`).
      type: string
      enum: [CHO_DUYET, DANG_CHUYEN, HOAN_TAT, THAT_BAI, DA_HUY]
    TenantMoveCreate:
      type: object
      required: [targetCellId, reason]
      properties:
        targetCellId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        targetTenancyModel: { $ref: '#/components/schemas/RegistryTenancyModel' }
        dataRegion: { type: string, maxLength: 32, description: '`registry.tenant_cell.data_region`.' }
        reason: { type: string, minLength: 1, maxLength: 2000, description: 'Lý do, số văn bản (`tenant_status_log.reason`).' }
        plannedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    TenantMove:
      type: object
      required: [id, tenantId, fromCell, toCell, status, reason, requestedBy, requestedAt, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        tenantId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        fromCell: { $ref: '#/components/schemas/RegistryCellRef' }
        toCell: { $ref: '#/components/schemas/RegistryCellRef' }
        targetTenancyModel: { $ref: '#/components/schemas/RegistryTenancyModel' }
        dataRegion: { type: string }
        status: { $ref: '#/components/schemas/TenantMoveStatus' }
        reason: { type: string }
        plannedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        requestedBy: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        requestedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        approvedBy: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        approvedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        currentStep:
          type: [string, 'null']
          enum: [PROVISION_TARGET, INITIAL_SNAPSHOT, WAL_CATCHUP, READ_ONLY_FREEZE, SWITCH_ACTIVE_CELL, REOPEN_WRITE, null]
          description: Bước hiện hành của saga 6 bước chuyển cell (ADR-29).
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    ApprovalComment:
      description: Ý kiến kèm thao tác phê duyệt hoặc đề nghị (tuỳ chọn).
      type: object
      properties:
        comment: { type: string, maxLength: 2000 }

    # ── Workflow ──
    WorkflowDecision:
      description: >-
        Quyết định khi hoàn thành user task, đặt vào biến `decision` của tiến trình (TL-01 chương 8 dùng
        `TRA_LAI`; `DUYET` là suy luận).
      type: string
      enum: [DUYET, TRA_LAI]
    WorkflowInboxItem:
      description: Một user task đang chờ (`flowable.wf_task_projection`).
      type: object
      required: [taskId, title, businessType, businessId, businessKey, createdAt, rowVersion]
      properties:
        taskId: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 255 }
        businessType: { type: string, maxLength: 32, description: 'Loại đối tượng nghiệp vụ, ví dụ `OKR_OBJECTIVE`, `PLAN`, `APPRAISAL_PROFILE`, `COMPLAINT`.' }
        businessId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        businessKey: { type: string, maxLength: 128 }
        templateCode: { type: string, maxLength: 64, description: 'Mã mẫu luồng (suy luận).' }
        assigneeId:
          oneOf:
            - { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            - { type: 'null' }
        candidateRole: { type: [string, 'null'], maxLength: 32 }
        candidateUnitId:
          oneOf:
            - { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            - { type: 'null' }
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        dueAt:
          oneOf:
            - { $ref: '../common/common.yaml#/components/schemas/DateTime' }
            - { type: 'null' }
        createdAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        overdue: { type: boolean, description: 'Quá hạn so với `due_at` (suy luận).' }
        deepLink: { type: string, maxLength: 512, description: 'Đường dẫn mở màn hình xử lý (suy luận).' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
      examples:
        - taskId: '7f3c2a10-8b1e-11f1-9c5a-0242ac120002'
          title: Phê duyệt OKR Quý I/2027 của Ban Tổ chức
          businessType: OKR_OBJECTIVE
          businessId: 0192f2c4-5d6e-7f80-91a2-b3c4d5e6f701
          businessKey: 'OKR_OBJECTIVE:0192f2c4-5d6e-7f80-91a2-b3c4d5e6f701'
          createdAt: '2027-01-06T09:12:00+07:00'
          rowVersion: 1
    WorkflowInboxPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkflowInboxItem' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
        counts:
          type: object
          description: Số đếm cho nhắc MSG-02-12 và thẻ trang chủ.
          properties:
            total: { type: integer, minimum: 0 }
            overdue: { type: integer, minimum: 0 }
            dueToday: { type: integer, minimum: 0 }
    WorkflowTaskCompletion:
      type: object
      required: [decision]
      properties:
        decision: { $ref: '#/components/schemas/WorkflowDecision' }
        comment: { type: string, maxLength: 2000, description: 'Bắt buộc khi `TRA_LAI` (BR-02-09, MSG-02-10).' }
    WorkflowTaskResult:
      type: object
      required: [taskId, businessKey, decision, completedAt]
      properties:
        taskId: { type: string }
        businessKey: { type: string }
        decision: { $ref: '#/components/schemas/WorkflowDecision' }
        completedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        processEnded: { type: boolean }
    WorkflowBatchCompletion:
      type: object
      required: [decision, items]
      properties:
        decision: { $ref: '#/components/schemas/WorkflowDecision' }
        comment: { type: string, maxLength: 2000 }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [taskId, rowVersion]
            properties:
              taskId: { type: string, maxLength: 64 }
              rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    WorkflowHistoryAction:
      description: Loại bước trong lịch sử tiến trình (suy luận).
      type: string
      enum: [TAO_TIEN_TRINH, DUYET, TRA_LAI, CHUYEN_NGUOI_XU_LY, GIA_HAN, NHAC_HAN, KET_THUC]
    WorkflowHistory:
      type: object
      required: [businessKey, businessType, status, entries]
      properties:
        businessKey: { type: string }
        businessType: { type: string }
        templateCode: { type: string }
        templateVersion: { type: integer }
        status: { type: string, enum: [DANG_CHAY, DA_KET_THUC], description: '(suy luận)' }
        entries:
          type: array
          items:
            type: object
            required: [at, action]
            properties:
              at: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
              action: { $ref: '#/components/schemas/WorkflowHistoryAction' }
              actorId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
              actorName: { type: string }
              activityName: { type: string }
              comment: { type: string }
      examples:
        - businessKey: 'OKR_OBJECTIVE:0192f2c4-5d6e-7f80-91a2-b3c4d5e6f701'
          businessType: OKR_OBJECTIVE
          status: DANG_CHAY
          entries:
            - { at: '2027-01-05T16:20:00+07:00', action: TAO_TIEN_TRINH, actorName: Lê Minh Châu }
    WorkflowInstanceSummary:
      type: object
      required: [businessKey, businessType, businessId, templateCode, templateVersion, startedAt, stuck]
      properties:
        businessKey: { type: string }
        businessType: { type: string }
        businessId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        title: { type: string }
        templateCode: { type: string }
        templateVersion: { type: integer }
        currentActivityName: { type: string }
        currentTaskId: { type: [string, 'null'] }
        assigneeId:
          oneOf:
            - { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            - { type: 'null' }
        candidateRole: { type: [string, 'null'] }
        startedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        dueAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        stuck: { type: boolean }
        stuckReason: { type: string }
        cellCode: { type: string }
        rowVersion:
          $ref: '../common/common.yaml#/components/schemas/RowVersion'
          description: >-
            `REV_` của user task đang chờ (`flowable.wf_task_projection.row_version`), gửi lại trong `If-Match` khi
            chuyển người xử lý hoặc gia hạn bước (bổ sung DV-06-10).
    WorkflowInstancePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/WorkflowInstanceSummary' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    WorkflowDiagram:
      type: object
      required: [businessKey, bpmnXml, activeActivityIds, completedActivityIds]
      properties:
        businessKey: { type: string }
        templateCode: { type: string }
        templateVersion: { type: integer }
        bpmnXml: { type: string, description: 'BPMN 2.0 XML; frontend hiển thị bằng bpmn-js ở chế độ chỉ xem.' }
        activeActivityIds:
          type: array
          items: { type: string }
        completedActivityIds:
          type: array
          items: { type: string }
    WorkflowTaskReassign:
      type: object
      required: [assigneeId, reason]
      properties:
        assigneeId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    WorkflowTaskExtend:
      type: object
      required: [dueAt, reason]
      properties:
        dueAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        reason: { type: string, minLength: 1, maxLength: 1000 }
    PeriodCloseSagaStart:
      description: Tham số saga `CHOT_KY` (`flowable.saga_instance.context`).
      type: object
      required: [periodId, lockOrderId, requestedBy]
      properties:
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        lockOrderId: { $ref: '../common/common.yaml#/components/schemas/Uuid', description: 'Lệnh khoá kỳ đã duyệt (`config.period_lock_order`), dùng làm `correlation_id`.' }
        unitIds:
          type: array
          description: Danh sách đơn vị; rỗng là toàn tenant.
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        requestedBy: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    PeriodCloseSagaCommand:
      description: Một lệnh của hộp lệnh `config.period_lock_command` chuyển tới saga `CHOT_KY`.
      type: object
      required: [command, commandId, requestedBy]
      properties:
        command:
          type: string
          description: >-
            `TAM_DUNG`, `TIEP_TUC`, `BU_TRU` cùng tên điều khiển của khung saga; `CHAY_LAI_LOI` chạy lại hồ sơ lỗi;
            `CHAP_NHAN_LOI` chấp nhận để lại hồ sơ lỗi kèm lý do.
          enum: [TAM_DUNG, TIEP_TUC, CHAY_LAI_LOI, CHAP_NHAN_LOI, BU_TRU]
        commandId: { $ref: '../common/common.yaml#/components/schemas/Uuid', description: 'Mã dòng hộp lệnh (`config.period_lock_command.id`).' }
        requestedBy: { $ref: '../common/common.yaml#/components/schemas/Uuid', description: 'Người đề nghị; với `BU_TRU` là người lập đề nghị huỷ.' }
        approvedBy: { $ref: '../common/common.yaml#/components/schemas/Uuid', description: 'Người duyệt thứ hai, bắt buộc với `BU_TRU`.' }
        profileIds:
          type: array
          maxItems: 5000
          description: Hồ sơ cần chạy lại với `CHAY_LAI_LOI`; rỗng là toàn bộ hàng đợi lỗi.
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        reason: { type: string, maxLength: 1000, description: 'Lý do, bắt buộc với `CHAP_NHAN_LOI`.' }
    WorkflowTemplateStatus:
      description: Trạng thái `flowable.wf_template.status` mở rộng theo BS-01.
      type: string
