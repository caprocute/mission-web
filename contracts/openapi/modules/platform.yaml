      operationId: createWorkflowTemplate
      summary: Tạo mẫu luồng mới hoặc phiên bản mới của mẫu
      description: >-
        Lưu BPMN 2.0 và khai báo tham số (JSON Schema) ở trạng thái `NHAP`. Máy chủ chạy lại linter bpmnlint với
        bốn quy tắc chống mạng nhện của TL-01 và giới hạn tải của BS-01 (≤ 12 user task mỗi nhánh, ≤ 50 phần tử
        đa thể hiện, một tầng call activity, chỉ external worker task); vi phạm trả 422 với `errors[].rule`.
        Khi `basedOnTemplateId` có giá trị, tạo phiên bản kế tiếp của cùng `templateCode`.
      parameters:
