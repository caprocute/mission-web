      type: string
      enum: [RIENG, DON_VI, TENANT]
    DashboardWidget:
      type: object
      required: [id, x, y, w, h, measure, chartType]
      properties:
        id: { type: string, maxLength: 32 }
        x: { type: integer, minimum: 0 }
        y: { type: integer, minimum: 0 }
        w: { type: integer, minimum: 1 }
        h: { type: integer, minimum: 1 }
        measure: { type: string }
        dimensions:
          type: array
          maxItems: 2
          items: { type: string }
        chartType: { $ref: '#/components/schemas/DashboardChartType' }
        filters:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsFilter' }
        drillDown: { type: boolean, default: true }
    AnalyticsDashboardInput:
      type: object
      required: [title, layout]
      properties:
        title: { type: string, minLength: 1, maxLength: 100 }
        layout:
          type: array
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/DashboardWidget' }
    AnalyticsDashboardSummary:
      type: object
      required: [id, title, ownerUserId, shareScope, updatedAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        title: { type: string }
        ownerUserId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        shareScope: { $ref: '#/components/schemas/DashboardShareScope' }
        widgetCount: { type: integer }
        updatedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    AnalyticsDashboardPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AnalyticsDashboardSummary' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    AnalyticsDashboard:
      description: Định nghĩa dashboard (`config.dashboard_def`) và số liệu khi được yêu cầu.
      type: object
      required: [id, title, ownerUserId, measures, dimensions, layout, shareScope, sharedUnitIds, rowVersion, updatedAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        title: { type: string, maxLength: 255 }
        ownerUserId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        measures:
          type: array
          items: { type: string }
        dimensions:
          type: array
          items: { type: string }
        layout:
          type: array
          items: { $ref: '#/components/schemas/DashboardWidget' }
        shareScope: { $ref: '#/components/schemas/DashboardShareScope' }
        sharedUnitIds:
          type: array
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        semanticModelVersion: { type: string }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
        updatedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        data:
          type: object
          properties:
            dataAsOf: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
            stale: { type: boolean }
            widgets:
              type: array
              items:
                type: object
                required: [widgetId, columns, rows]
                properties:
                  widgetId: { type: string }
                  columns:
                    type: array
                    items: { $ref: '#/components/schemas/AnalyticsColumn' }
                  rows:
                    type: array
                    items:
                      type: array
                      items: { type: [string, number, 'null'] }
      examples:
        - id: 0192fa0c-d546-77f8-091a-2b3c4d5e6f01
          title: Bảng của Bí thư
          ownerUserId: 0192f1a2-2222-7aaa-8bbb-000000000b01
          measures: [okr.tien_do_o]
          dimensions: []
          layout: []
          shareScope: RIENG
          sharedUnitIds: []
          rowVersion: 0
          updatedAt: '2026-11-16T09:00:00+07:00'
    DashboardShareRequest:
      type: object
      required: [shareScope]
      properties:
        shareScope: { $ref: '#/components/schemas/DashboardShareScope' }
        sharedUnitIds:
          type: array
          description: Bắt buộc khi `DON_VI`; chỉ đơn vị trong tenant.
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    AnalyticsReportRequest:
      type: object
      required: [templateCode, periodId, format]
      properties:
        templateCode: { type: string, maxLength: 48, description: 'Mã mẫu báo cáo (suy luận).' }
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        unitId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        dashboardId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        compareToPreviousPeriod: { type: boolean, default: false }
        format: { type: string, enum: [PDF, XLSX] }
    TraceObjectType:
      description: >-
        Loại mắt xích của chuỗi truy vết PL 4 III.2 (BR-16-03): điểm, cấu phần, KPI nhiệm vụ hoặc KR, sản phẩm,
        minh chứng, kế hoạch, mục tiêu O, căn cứ. Mã là suy luận.
      type: string
      enum: [DIEM, CAU_PHAN, KPI_NHIEM_VU, KET_QUA_THEN_CHOT, SAN_PHAM, MINH_CHUNG, KE_HOACH, MUC_TIEU, CAN_CU]
    TraceLink:
      type: object
      required: [objectType, id, label, masked]
      properties:
        objectType: { $ref: '#/components/schemas/TraceObjectType' }
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        label: { type: string }
        value: { type: string, description: 'Giá trị hiển thị đã định dạng tiếng Việt.' }
        status: { type: string, description: 'Trạng thái chuẩn của đối tượng (baseline mục 9.1).' }
        versionNo: { type: integer }
        unitName: { type: string }
        masked: { type: boolean, description: 'Mắt xích ngoài phạm vi quyền, hiển thị dạng che (MSG-16-06).' }
        msg: { type: string, description: 'Mã thông điệp TL-02 kèm theo, ví dụ `MSG-16-06`, `MSG-16-07`.' }
        details: { type: object, additionalProperties: true, description: 'Chi tiết theo loại mắt xích (bảng A, B, C của KPI, phiên bản minh chứng…).' }
    TraceChain:
      type: object
      required: [focus, links]
      properties:
        focus:
          type: object
          required: [objectType, id]
          properties:
            objectType: { $ref: '#/components/schemas/TraceObjectType' }
            id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        links:
          type: array
          items: { $ref: '#/components/schemas/TraceLink' }
        ledgerRef: { type: string, description: 'Mã bản ghi sổ cái của lần truy cập C2 (nếu có).' }
      examples:
        - focus: { objectType: DIEM, id: 0192fb1d-e657-7809-1a2b-3c4d5e6f7a01 }
          links:
            - { objectType: DIEM, id: 0192fb1d-e657-7809-1a2b-3c4d5e6f7a01, label: Điểm quý IV/2026, value: '91,2', masked: false }
    TraceExportRequest:
      type: object
      required: [objectType, id, formats]
      properties:
        objectType: { $ref: '#/components/schemas/TraceObjectType' }
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        formats:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [JSON, PDF] }

    # ── Search ──
    SearchResultType:
      description: Loại tài liệu được lập chỉ mục (TL-01 SVC-16; mã là suy luận).
      type: string
      enum: [TASK, SOURCE_DOC, CATALOG_ITEM]
    SearchResult:
      description: Một kết quả tìm kiếm; chỉ trường C0, C1.
      type: object
      required: [type, id, title, score]
      properties:
        type: { $ref: '#/components/schemas/SearchResultType' }
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string }
        title: { type: string }
        snippet: { type: string, description: 'Đoạn trích văn bản thuần, không HTML.' }
        highlights:
          type: array
          description: Vị trí phần khớp trong `snippet` (đếm theo ký tự UTF-16).
          items:
            type: object
            required: [start, length]
            properties:
              start: { type: integer, minimum: 0 }
              length: { type: integer, minimum: 1 }
        unitName: { type: string }
        periodLabel: { type: string }
        status: { type: string }
        deepLink: { type: string }
        score: { type: number }
      examples:
        - type: CATALOG_ITEM
          id: 0192fc2e-f768-791a-2b3c-4d5e6f7a8b01
          code: DM-TC-012
          title: Hướng dẫn kiểm điểm tổ chức đảng
          score: 8.2
    SearchResultPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }

    # ── IAM MFA Recovery (SVC-02, NEN-043) ──
    MfaRecoveryCodeIssueRequest:
      type: object
      required: [verificationMethod, reason]
      properties:
        verificationMethod:
          type: string
          enum: [TRUC_TIEP, VAN_BAN_DON_VI, GOI_VIDEO_NOI_BO]
          description: Hình thức quản trị viên đã xác minh danh tính cán bộ mất thiết bị SmartOTP.
        reason: { type: string, minLength: 10, maxLength: 500 }
        ttlMinutes: { type: integer, minimum: 5, maximum: 15, default: 15 }
    MfaRecoveryCodeIssued:
      type: object
      required: [codeId, personId, recoveryCode, expiresAt, issuedAt]
      properties:
        codeId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        personId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        recoveryCode:
          type: string
          x-classification: C2
          description: Mã khôi phục một lần (hiển thị đúng một lần cho quản trị viên trao cho cán bộ).
        expiresAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        issuedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
      examples:
        - codeId: 0195f3f0-0000-7000-8000-000000000501
          personId: 0195f3a0-0000-7000-8000-000000000101
          recoveryCode: '9482-7310-5521'
          expiresAt: '2026-04-01T08:15:00Z'
          issuedAt: '2026-04-01T08:00:00Z'
    MfaRecoveryCodeRevokeRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
    MfaRecoveryCodeRevokeResult:
      type: object
      required: [revokedCount]
      properties:
        revokedCount: { type: integer, minimum: 0 }

    # ── Notification Devices & Preferences (SVC-12, NEN-043) ──
    PushPlatform:
      type: string
      enum: [FCM, APNS, WEB_PUSH]
    PushDevice:
      type: object
      required: [id, platform, deviceName, registeredAt, lastSeenAt]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        platform: { $ref: '#/components/schemas/PushPlatform' }
        deviceName: { type: string, maxLength: 120 }
        appVersion: { type: string, maxLength: 32 }
        registeredAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        lastSeenAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    PushDeviceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PushDevice' }
    PushDeviceRegisterRequest:
      type: object
      required: [platform, pushToken, deviceName]
      properties:
        platform: { $ref: '#/components/schemas/PushPlatform' }
        pushToken: { type: string, minLength: 16, maxLength: 4096 }
        deviceName: { type: string, minLength: 1, maxLength: 120 }
        appVersion: { type: string, maxLength: 32 }
        webPushKeys:
          type: [object, 'null']
          properties:
            p256dh: { type: string }
            auth: { type: string }
    NotificationChannel:
      type: string
      enum: [IN_APP, PUSH, EMAIL, SMS]
    NotificationCategory:
      type: string
      enum: [NHIEM_VU, PHE_DUYET, DANH_GIA, KY_SO, CANH_BAO_BAO_MAT, HE_THONG]
    NotificationCategoryPreference:
      type: object
      required: [category, channels]
      properties:
        category: { $ref: '#/components/schemas/NotificationCategory' }
        channels:
          type: array
          items: { $ref: '#/components/schemas/NotificationChannel' }
    NotificationPreferences:
      type: object
      required: [categories, quietHoursEnabled, rowVersion, updatedAt]
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/NotificationCategoryPreference' }
        quietHoursEnabled: { type: boolean, default: false }
        quietHoursStart: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        quietHoursEnd: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
        updatedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    NotificationPreferencesInput:
      type: object
      required: [categories, quietHoursEnabled]
      properties:
        categories:
          type: array
          items: { $ref: '#/components/schemas/NotificationCategoryPreference' }
        quietHoursEnabled: { type: boolean }
        quietHoursStart: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        quietHoursEnd: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }

    # ── AI OCR (SVC-14, NEN-043) ──
    AiOcrRequest:
      type: object
      required: [objectKey, sha256, mimeType, classification]
      properties:
        objectKey: { type: string, minLength: 1, maxLength: 512 }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        mimeType: { type: string, enum: [application/pdf, image/jpeg, image/png] }
        classification:
          type: string
          enum: [C1, C2]
          description: Chỉ cho phép C1/C2; tài liệu C3 bị từ chối theo BR-17-07.
        languageHint: { type: string, default: vi }
    AiOcrPage:
      type: object
      required: [pageNumber, text, confidence]
      properties:
        pageNumber: { type: integer, minimum: 1 }
        text: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
    AiOcrResult:
      type: object
      required: [objectKey, sha256, pages, fullText, modelId, processedAt]
      properties:
        objectKey: { type: string }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        pages:
          type: array
          items: { $ref: '#/components/schemas/AiOcrPage' }
        fullText: { type: string }
        modelId: { type: string }
        processedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }

    # ── Analytics Embed Token (SVC-15, NEN-043) ──
    AnalyticsEmbedTokenRequest:
      type: object
      required: [dashboardCode]
      properties:
        dashboardCode: { type: string, minLength: 1, maxLength: 80 }
        unitId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    AnalyticsEmbedToken:
      type: object
      required: [token, embedUrl, expiresAt, lockedOrgPathPrefix]
      properties:
        token: { type: string }
        embedUrl: { type: string, format: uri }
        expiresAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        lockedOrgPathPrefix:
          type: string
          description: Tiền tố `org_path` đã khoá cứng trong guest token (BR-16-01).
