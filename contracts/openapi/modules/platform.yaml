      operationId: searchFullText
      summary: Tìm kiếm toàn văn nhiệm vụ, văn bản chỉ đạo, danh mục công việc
      description: >-
        Tìm trên OpenSearch (bí danh chỉ mục lọc theo `tenant_id` ở cell pool). Chỉ mục không chứa C2, C3 nên kết
        quả chỉ có trường C0, C1; đoạn trích là văn bản thuần, phần khớp đánh dấu bằng vị trí ký tự
        (`highlights`), không trả HTML. Kết quả được kiểm quyền lại ở lõi; mục ngoài phạm vi bị loại trước khi
        trả. Không có tổng số bản ghi.
      parameters:
        - name: q
          in: query
          required: true
          description: Từ khoá, không phân biệt dấu.
          schema: { type: string, minLength: 2, maxLength: 200 }
        - name: type
          in: query
          description: Lọc theo loại; bỏ trống tìm mọi loại.
