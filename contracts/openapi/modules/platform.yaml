  # ───────────────────────────── AI (SVC-14) ─────────────────────────────
  /ai/suggestions:
    post:
      tags: [AI]
      operationId: requestAiSuggestion
      summary: Yêu cầu một gợi ý AI chỉ đọc
      description: >-
        Điểm vào chung của trợ lý cho các ca dùng không có đường dẫn riêng (hỏi đáp quy định, giải thích điểm số,
        tóm tắt văn bản). ai-gateway xác thực, kiểm quyền qua OPA, áp rào chắn đầu vào, truy xuất RAG trong phạm
        vi quyền của người dùng (token exchange), gọi mô hình, áp rào chắn đầu ra, ghi `ai.suggestion_log`.
        Trả 200 khi xong trong thời gian chờ; trả 202 kèm job khi hàng đợi suy luận đầy (MSG-17-03), kết quả ở
        `GET /ai/suggestions/{id}`. Yêu cầu chấm điểm, đề xuất xếp loại hay nhận xét cán bộ bị chặn (BR-17-04):
        trả 200 với `blocked` (MSG-17-02) và ghi `ai.guardrail_event`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AiSuggestionRequest' }
            examples:
              hoi-quy-dinh:
                value:
                  useCase: HOI_DAP_QUY_DINH
                  question: Hệ số tiến độ bị trừ thế nào khi nộp sản phẩm chậm do nguyên nhân khách quan?
                  contextRefs: []
      responses:
        '200':
          description: Gợi ý đã sinh.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AiSuggestion' }
              examples:
                tra-loi:
                  value:
                    id: 0192f7b9-a213-74c5-d6e7-f8091a2b3c56
                    useCase: HOI_DAP_QUY_DINH
                    model: viettel-llm-vi-2026.3
                    createdAt: '2026-10-19T09:40:02+07:00'
                    aiGenerated: true
                    label: Nội dung do AI tạo
                    outputText: Chậm do nguyên nhân khách quan đã được người giao xác nhận thì không trừ hệ số tiến độ C.
                    sources:
                      - { kind: VAN_BAN, title: 'Dự thảo PL 1 – Hướng dẫn tính điểm', location: mục 4.3, ref: 0192f1a2-5555-7aaa-8bbb-00000000d001 }
                    decision: null
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '429': { $ref: '../common/common.yaml#/components/responses/TooManyRequests' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-17]
        scr: [SCR-1701]
        owner: SVC-14
        roles: [manager, member, ai_readonly]
        scope: B
        rules: [BR-17-01, BR-17-02, BR-17-03, BR-17-04, BR-17-07, BR-17-09]
        source: TL-01 PL C Dịch vụ nền (`POST /ai/suggestions`); TL-01 chương "Trí tuệ nhân tạo"; TL-02b QT-17
    get:
      tags: [AI]
      operationId: listAiSuggestions
      summary: Danh sách gợi ý AI theo loại, ví dụ tóm tắt tuần
      description: >-
        Đọc `ai.suggestion_log` của người gọi hoặc trong phạm vi quyền đọc của người gọi. Dùng cho khối "Tóm tắt
        tuần" của SCR-0002 (chỉ dữ liệu của chính người dùng) và SCR-1601 (`kind = TOM_TAT_TUAN`, theo đơn vị
        trong phạm vi). Không có tóm tắt thì trả danh sách rỗng ("Chưa có tóm tắt tuần này").
      parameters:
        - name: kind
          in: query
          description: Loại gợi ý chi tiết (`ai.suggestion_log.kind`), ví dụ `TOM_TAT_TUAN`.
          schema: { type: string, maxLength: 24 }
        - name: useCase
