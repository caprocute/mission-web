  /analytics/query:
    post:
      tags: [Analytics]
      operationId: queryAnalytics
      summary: Truy vấn chỉ số chuẩn trên lớp ngữ nghĩa
      description: >-
        Truy vấn đọc (dùng POST vì thân truy vấn phức tạp) chỉ trên measures, dimensions công bố của lớp ngữ nghĩa
        Cube (BR-16-02, không SQL tự do). analytics-api thêm securityContext gồm tenant và `org_path` của người
        xem (BR-16-01), lưu đệm Valkey 60 giây. Trả kèm thời điểm dữ liệu; trễ quá 5 phút thì `stale = true`
        (MSG-16-01, BR-16-08). Không có cột C2 rõ hay C3.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AnalyticsQuery' }
            examples:
              tien-do-theo-don-vi:
                value:
                  measures: [okr.tien_do_o]
                  dimensions: [org_unit.name]
                  periodId: 0192f1a2-4444-7eee-8fff-000000000f26
                  compareToPreviousPeriod: true
                  filters:
                    - { member: subject_group.code, operator: equals, values: [CQ_THAM_MUU] }
                  limit: 50
      responses:
        '200':
          description: Kết quả truy vấn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalyticsQueryResult' }
              examples:
                sau-don-vi:
                  value:
                    semanticModelVersion: '2026.4'
                    dataAsOf: '2026-11-16T08:55:00+07:00'
                    stale: false
                    columns:
                      - { name: org_unit.name, title: Đơn vị, type: string }
                      - { name: okr.tien_do_o, title: Tiến độ mục tiêu O, type: number, unit: '%' }
                      - { name: okr.tien_do_o.previous, title: Tiến độ mục tiêu O quý trước, type: number, unit: '%' }
                    rows:
                      - [Ban Tuyên giáo, 92, 88]
                      - [Ban Kiểm tra, 88, 85]
                      - [Văn phòng E, 41, 55]
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422':
          description: >-
            Chỉ số hoặc chiều không có trong lớp ngữ nghĩa, kết hợp không hợp lệ (`ANALYTICS-422-INVALID-COMBINATION`,
            MSG-16-04), quá 2 chiều.
