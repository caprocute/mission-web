        '429': { $ref: '../common/common.yaml#/components/responses/TooManyRequests' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-16]
        scr: [SCR-1601, SCR-1602]
        owner: SVC-15
        roles: [leader, manager, inspector]
        scope: Cd
        rules: [BR-16-01, BR-16-02, BR-16-04, BR-16-05, BR-16-08]
        source: TL-02b SCR-1601, SCR-1602 bảng chức năng; ma trận SCR-1601.xem

