  # ───────────────────────────── Notifications (SVC-12) ─────────────────────────────
  /notifications/stream:
    get:
      tags: [Notifications]
      operationId: streamNotifications
      summary: Luồng SSE thông báo thời gian thực
      description: |-
        Kết nối Server-Sent Events dài (`text/event-stream`, UTF-8). Mỗi sự kiện gồm các dòng:

        ```
        id: <mã sự kiện của Valkey Streams, tăng dần theo người nhận>
        event: <tên sự kiện>
        data: <một dòng JSON>

        ```

        Tên sự kiện và lược đồ của `data`:

        - `notification`: thông báo mới, `data` theo lược đồ `Notification`.
        - `job`: cập nhật tác vụ dài của chính người dùng (ký lô, khoá kỳ, xuất báo cáo), `data` theo lược đồ
          `Job` của `common.yaml`; `JobTracker` trộn luồng này với thăm dò `GET /jobs/{id}`.
        - `unread`: số thông báo chưa đọc thay đổi, `data` theo lược đồ `NotificationUnreadEvent`.
        - Dòng chú thích `: ping` mỗi 25 giây để giữ kết nối qua proxy; không mang `id`.

        Máy chủ gửi `retry: 5000` ở đầu luồng. Khi mất kết nối, trình duyệt tự nối lại và gửi header
        `Last-Event-ID`; máy chủ phát lại các sự kiện sau mã đó còn trong Valkey Streams (giữ tối thiểu 10 phút,
        suy luận), nếu mã quá cũ thì gửi một sự kiện `unread` để client tải lại hộp thông báo. Nối lại p95 ≤ 10 s,
        độ trễ phân phát p95 ≤ 2 s (TL-04 PERF-22). Nội dung không chứa dữ liệu C2. Khi pod tắt, máy chủ đóng
        luồng dần trong 30 giây. Token truyền qua `Authorization: Bearer`; client dùng `fetch` đọc luồng (qua
        `@vt/api-client`) vì `EventSource` không gửi được header.
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: Mã sự kiện cuối cùng client đã nhận, để phát lại phần bị lỡ.
          schema: { type: string, maxLength: 64 }
      responses:
        '200':
          description: Luồng sự kiện mở.
          headers:
            Cache-Control:
              description: '`no-cache`.'
              schema: { type: string }
          content:
            text/event-stream:
              schema:
                type: string
                description: Chuỗi sự kiện SSE theo định dạng ở phần mô tả thao tác.
              examples:
                hai-su-kien:
                  value: |
                    retry: 5000

                    id: 1729318200000-0
                    event: notification
                    data: {"id":"0192f6a8-9102-73b4-c5d6-e7f8091a2b45","templateCode":"OKR_CHO_DUYET","title":"Có bộ OKR cần phê duyệt","body":"Ban Tổ chức trình OKR Quý I/2027, hạn duyệt 08/01/2027.","deepLink":"/okr/phe-duyet","priority":"CAO","createdAt":"2027-01-06T09:12:05+07:00","readAt":null}

                    id: 1729318260000-0
                    event: job
                    data: {"id":"01928f3e-7b1a-7c3e-9a51-3f2d9c1b0a77","type":"EXPORT","status":"DANG_CHAY","progress":40}
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '429': { $ref: '../common/common.yaml#/components/responses/TooManyRequests' }
        '503': { $ref: '../common/common.yaml#/components/responses/ServiceUnavailable' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-sse-events:
        notification: '#/components/schemas/Notification'
        job: '../common/common.yaml#/components/schemas/Job'
        unread: '#/components/schemas/NotificationUnreadEvent'
      x-mission:
        qt: [QT-00]
        scr: [SCR-0002, SCR-0801, SCR-0904]
        owner: SVC-12
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        source: TL-01 PL C Dịch vụ nền; TL-01 SVC-12; TL-04 PERF-22; wiki/06 mục tác vụ dài

