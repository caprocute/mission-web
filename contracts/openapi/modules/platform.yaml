# Hợp đồng OpenAPI của các dịch vụ nền: SVC-03 tenant-registry, SVC-06 workflow-service,
# SVC-12 notification-service, SVC-14 ai-gateway, SVC-15 analytics, SVC-16 search (WEB-063, ADR-32).
# Nguồn: baseline mục 9, 9.1, 10, 13; TL-01 mục SVC-03, SVC-06, SVC-12, SVC-14, SVC-15, SVC-16 (part-05b, part-05c),
#   chương "Định tuyến tới cell", "Tiếp nhận tenant" (part-11), chương "Trí tuệ nhân tạo" (part-12),
#   Phụ lục C mục "Dịch vụ nền" (trừ `/org/...`, `/esign/...`) và các dòng SVC-15;
# TL-02a SCR-0002 (thông báo), SCR-0202 (AI soát KR), SCR-0203 (hộp việc), SCR-0302 (giọng nói),
#   SCR-0502 (AI trích nhiệm vụ), SCR-0702 (AI đọc minh chứng); TL-02b QT-16 SCR-1601, SCR-1602, SCR-1603,
#   QT-17 SCR-1701, SCR-1803 (giọng nói), BR-16-xx, BR-17-xx, MSG-16-xx, MSG-17-xx;
# BS-01 SCR-1505, SCR-1506 (mẫu luồng và giám sát tiến trình);
# TL-03 schema `registry` (tenant, cell, tenant_cell, tenant_domain), `flowable` (wf_template, wf_task_projection,
#   saga_instance), `notify` (notification, delivery), `ai` (suggestion_log, guardrail_event), `config.dashboard_def`;
# ma trận phân quyền `docs/phan-quyen/ma-tran.json`; mô hình frontend `api-client/src/lib/models/source-doc.ts`.
openapi: 3.1.0
info:
  title: Mission – Dịch vụ nền (SVC-03, SVC-06, SVC-12, SVC-14, SVC-15, SVC-16)
  version: 1.0.0-draft.1
  description: >-
    Các dịch vụ nền dùng chung cho mọi module: danh bạ tenant và cell toàn cục (SVC-03), hộp việc và
    luồng duyệt Flowable (SVC-06), thông báo thời gian thực (SVC-12), cổng AI chỉ đọc (SVC-14), phía đọc
    phân tích và bảng điều hành (SVC-15), tìm kiếm toàn văn (SVC-16). Mọi đường dẫn tương đối với `/api/v1`.
    AI không có quyền ghi dữ liệu nghiệp vụ (BR-17-01): mọi nội dung AI tạo chỉ vào hệ thống khi người
    dùng xác nhận và gọi API nghiệp vụ của module tương ứng dưới danh tính của chính họ.
servers:
  - url: /api/v1
security:
  - keycloak: []
tags:
  - name: Registry
    description: >-
      Danh bạ tenant toàn cục của SVC-03 tenant-registry (schema `registry`): tra cell của tenant, danh sách
      cell, tiếp nhận tenant, chuyển tenant sang cell khác với hai người duyệt. Chạy ở vùng điều phối toàn cục.
  - name: Workflow
    description: >-
      Luồng duyệt có con người tham gia của SVC-06 workflow-service (Flowable 7): hộp việc cần duyệt đọc từ
      `flowable.wf_task_projection`, hoàn thành user task, duyệt hàng loạt, lịch sử tiến trình, saga chốt kỳ,
      thư viện mẫu luồng (SCR-1505) và giám sát tiến trình (SCR-1506) theo BS-01.
  - name: Notifications
    description: >-
      Thông báo trong ứng dụng của SVC-12 notification-service (schema `notify`): luồng SSE thời gian thực,
      hộp thông báo, đánh dấu đã đọc. Nội dung thông báo không chứa dữ liệu C2.
  - name: AI
    description: >-
      Cổng AI chỉ đọc SVC-14 ai-gateway (vai trò kỹ thuật AC-12 `ai_readonly`, schema `ai`). Mọi gợi ý gắn nhãn
      "Nội dung do AI tạo", có nguồn trích dẫn và được ghi `ai.suggestion_log` (BR-17-02, BR-17-09). AI không
      chấm điểm, không đề xuất xếp loại (BR-17-04) và không nhận dữ liệu C3 (BR-17-07).
  - name: Analytics
    description: >-
      Phía đọc CQRS của SVC-15 analytics (ClickHouse, lớp ngữ nghĩa Cube): bảng điều hành, truy vấn chỉ số
      chuẩn, trình dựng dashboard, đi xuống tới minh chứng, xuất báo cáo. Mọi số liệu lọc theo phạm vi cây
      tổ chức của người xem (BR-16-01); dữ liệu C2 lấy từ mission-core có kiểm quyền (BR-16-04).
  - name: Search
    description: >-
      Tìm kiếm toàn văn SVC-16 trên OpenSearch: nhiệm vụ, văn bản chỉ đạo, danh mục công việc. Chỉ mục không
      chứa dữ liệu C2, C3; kết quả được kiểm quyền lại ở lõi trước khi hiển thị chi tiết.
  - name: IAM
    description: >-
      Quản trị xác thực và mã khôi phục MFA một lần của SVC-02 iam-adapter (TL-02a QT-00 ngoại lệ mất SmartOTP).

paths:
  # ───────────────────────────── Registry (SVC-03) ─────────────────────────────
  /registry/resolve:
    get:
      tags: [Registry]
      operationId: resolveTenantCell
      summary: Tra cell, IdP và trạng thái của một tenant
      description: >-
        Shell gọi sau đăng nhập qua điểm vào toàn cục với tenant lấy từ token; APISIX lớp ngoài gọi bằng
        client nội bộ theo `host` và lưu đệm 5 phút. Máy chủ kiểm tenant khớp claim `tid` của token người
        dùng, trả URL cổng API của cell và đặt cookie định tuyến ký HMAC hạn 5 phút. Phải có đúng một trong
        hai tham số `tenant` hoặc `host`. Khi tenant đang chuyển cell hoặc đã chuyển sang cell khác với cell
        mà request đi tới, trả 421 kèm URL mới để shell chuyển hướng (TL-01 "Định tuyến tới cell"). Khi
        registry ngừng và tenant chưa có trong đệm, trả 503 với `Retry-After: 30`.
      security:
        - keycloak: []
        - serviceClient: []
      parameters:
        - name: tenant
          in: query
          description: Mã tenant (`registry.tenant.code`) hoặc `tenant_id` lấy từ claim `tid`.
          schema: { type: string, maxLength: 64, examples: [dukcqtw] }
        - name: host
          in: query
          description: Tên miền người dùng truy cập (`registry.tenant_domain.domain`), do APISIX lớp ngoài gửi.
          schema: { type: string, maxLength: 253, examples: [kpi.dukcqtw.dcs.vn] }
      responses:
        '200':
          description: Cell hiện hành của tenant.
          headers:
            Set-Cookie:
              description: Cookie định tuyến ký HMAC, hạn 5 phút, để request sau đi thẳng tới cell.
              schema: { type: string }
            Cache-Control:
              description: '`private, max-age=300`.'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantResolution' }
              examples:
                dang-van-hanh:
                  value:
                    tenantId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                    tenantCode: dukcqtw
                    tenantName: Đảng uỷ Khối các cơ quan Trung ương
                    status: DANG_VAN_HANH
                    tenancyModel: BRIDGE
                    cell: { id: 0192f1a2-0000-7c00-8a00-00000000c001, code: CELL-HN, apiBaseUrl: 'https://api.cell-hn.okrkpi.vn' }
                    idps:
                      - { idpAlias: vneid, protocol: OIDC, issuer: 'https://sso.vneid.gov.vn', isVneid: true }
                    cacheTtlSeconds: 300
        '400': { $ref: '../common/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '421':
          description: >-
            Tenant đã chuyển sang cell khác (mã `REGISTRY-421-TENANT-MOVED`). Header `Location` mang URL cổng API
            của cell mới; shell gọi lại `registry/resolve` rồi chuyển hướng.
          headers:
            Location:
              description: URL cổng API của cell mới.
              schema: { type: string, format: uri }
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '503': { $ref: '../common/common.yaml#/components/responses/ServiceUnavailable' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-00]
        scr: [SCR-0001]
        owner: SVC-03
        roles: [platform_admin, tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector, service_client]
        scope: B
        source: TL-01 SVC-03, PL C Dịch vụ nền, part-11 "Định tuyến tới cell"; ma trận module registry (shell gọi không cần vai trò)

  /registry/cells:
    get:
      tags: [Registry]
      operationId: listCells
      summary: Danh sách cell, sức chứa và tải hiện tại
      description: >-
        Liệt kê các cell (`registry.cell`) cùng số tenant và số tài khoản đang phục vụ, để quản trị nền tảng
        chọn cell khi tiếp nhận hoặc chuyển tenant. Số tài khoản cập nhật hằng đêm từ SVC-02.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CellStatus' }
        - name: tenancyModel
          in: query
          schema: { $ref: '#/components/schemas/RegistryTenancyModel' }
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Trang danh sách cell.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CellPage' }
              examples:
                hai-cell:
                  value:
                    items:
                      - id: 0192f1a2-0000-7c00-8a00-00000000c001
                        code: CELL-HN
                        name: Cell Hà Nội
                        primaryDc: HOALAC
                        standbyDc: PHIANAM
                        tenancyModel: BRIDGE
                        apiBaseUrl: 'https://api.cell-hn.okrkpi.vn'
                        capacityAccounts: 1500000
                        status: HOAT_DONG
                        tenantCount: 42
                        accountCount: 812345
                      - id: 0192f1a2-0000-7c00-8a00-00000000c002
                        code: CELL-NB
                        name: Cell thí điểm Ninh Bình
                        primaryDc: PHIANAM
                        tenancyModel: POOL
                        apiBaseUrl: 'https://api.cell-nb.okrkpi.vn'
                        capacityAccounts: 300000
                        status: HOAT_DONG
                        tenantCount: 118
                        accountCount: 96120
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-01]
        scr: [SCR-0101, SCR-0102]
        owner: SVC-03
        roles: [platform_admin]
        scope: N
        aal: 2
        source: TL-01 SVC-03 (API chính); TL-03 `registry.cell`

  /registry/tenants:
    post:
      tags: [Registry]
      operationId: createRegistryTenant
      summary: Tiếp nhận tenant vào danh bạ và gán cell
      description: >-
        Tạo bản ghi `registry.tenant` ở trạng thái `KHOI_TAO`, gán cell đích (`registry.tenant_cell`) và tên
        miền, rồi khởi động tiến trình tiếp nhận tự động (Keycloak Organizations, KEK trong OpenBao, CSDL hoặc
        phân vùng, Policy Pack và UI Pack mặc định, kiểm thử khói, phát `sys.tenant.provisioned.v1`). Mỗi bước
        idempotent. Màn hình SCR-0102 đi qua `POST /config/tenants/{id}/provision` của MOD-08; saga cấp phát
        gọi thao tác này bằng client nội bộ, quản trị nền tảng cũng gọi được trực tiếp.
      security:
        - keycloak: []
        - serviceClient: []
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistryTenantCreate' }
            examples:
              tiep-nhan:
                value:
                  code: dukcqtw
                  name: Đảng uỷ Khối các cơ quan Trung ương
                  sector: DANG
                  tenancyModel: BRIDGE
                  cellId: 0192f1a2-0000-7c00-8a00-00000000c001
                  flows: [DANG]
                  maxAccounts: 60000
                  expectedAccounts: 52000
                  contractRef: HĐ-2026/VTS-123
                  contractValidTo: '2029-12-31'
                  onboardingCode: KT-2026-0042
                  domains:
                    - { domain: kpi.dukcqtw.dcs.vn, kind: PRIMARY }
      responses:
        '201':
          description: Đã tạo tenant và khởi động tiếp nhận.
          headers:
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryTenant' }
              examples:
                vua-tao:
                  value:
                    id: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                    code: dukcqtw
                    name: Đảng uỷ Khối các cơ quan Trung ương
                    sector: DANG
                    tenancyModel: BRIDGE
                    status: KHOI_TAO
                    flows: [DANG]
                    maxAccounts: 60000
                    expectedAccounts: 52000
                    accountCount: 0
                    contractRef: HĐ-2026/VTS-123
                    contractValidTo: '2029-12-31'
                    onboardingCode: KT-2026-0042
                    currentCell: { id: 0192f1a2-0000-7c00-8a00-00000000c001, code: CELL-HN, databaseName: td_dukcqtw, validFrom: '2026-10-19T09:00:00+07:00' }
                    domains:
                      - { domain: kpi.dukcqtw.dcs.vn, kind: PRIMARY, verifiedAt: null }
                    rowVersion: 0
                    createdAt: '2026-10-19T09:00:00+07:00'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409':
          description: >-
            Mã tenant, mã hồ sơ khởi tạo hoặc tên miền đã tồn tại (`REGISTRY-409-DUPLICATE`), hoặc cell đích không
            ở trạng thái `HOAT_DONG` (`REGISTRY-409-CELL-UNAVAILABLE`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-01]
        scr: [SCR-0102]
        owner: SVC-03
        roles: [platform_admin, service_client]
        scope: N
        aal: 2
        rules: [BR-00-01]
        source: TL-01 PL C Dịch vụ nền; TL-01 SVC-03; part-11 "Tiếp nhận tenant"; TL-03 `registry.tenant`

  /registry/tenants/{id}:
    get:
      tags: [Registry]
      operationId: getRegistryTenant
      summary: Xem bản ghi danh bạ của một tenant
      description: >-
        Trả thông tin danh bạ, cell hiện hành và lịch sử gắn cell (suy luận: cần để lấy ETag trước khi đề nghị
        chuyển cell và để theo dõi lần chuyển đang chạy).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdPath'
      responses:
        '200':
          description: Bản ghi tenant.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RegistryTenant' }
              examples:
                dang-van-hanh:
                  value:
                    id: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                    code: dukcqtw
                    name: Đảng uỷ Khối các cơ quan Trung ương
                    sector: DANG
                    tenancyModel: BRIDGE
                    status: DANG_VAN_HANH
                    flows: [DANG]
                    maxAccounts: 60000
                    accountCount: 51870
                    currentCell: { id: 0192f1a2-0000-7c00-8a00-00000000c001, code: CELL-HN, databaseName: td_dukcqtw, validFrom: '2026-10-19T09:00:00+07:00' }
                    domains:
                      - { domain: kpi.dukcqtw.dcs.vn, kind: PRIMARY, verifiedAt: '2026-10-19T10:15:00+07:00' }
                    rowVersion: 5
                    createdAt: '2026-10-19T09:00:00+07:00'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-01]
        scr: [SCR-0101]
        owner: SVC-03
        roles: [platform_admin]
        scope: N
        aal: 2
        source: TL-03 `registry.tenant`, `registry.tenant_cell` (suy luận)

  /registry/tenants/{id}/move:
    post:
      tags: [Registry]
      operationId: requestTenantMove
      summary: Đề nghị chuyển tenant sang cell khác
      description: >-
        Người đề nghị (quản trị nền tảng thứ nhất) tạo đề nghị chuyển cell ở trạng thái `CHO_DUYET`. Việc chuyển
        chỉ bắt đầu khi một quản trị nền tảng khác phê duyệt (`.../move/{moveId}/approve`). Khi chạy, tenant ở
        trạng thái `DANG_CHUYEN_CELL`, dữ liệu sao chép logic sang cell đích, khoá ghi vài phút rồi cập nhật
        `registry.tenant_cell` (ADR-29, TL-03 "registry").
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdPath'
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantMoveCreate' }
            examples:
              tot-nghiep-len-bridge:
                value:
                  targetCellId: 0192f1a2-0000-7c00-8a00-00000000c001
                  targetTenancyModel: BRIDGE
                  dataRegion: HOALAC
                  reason: Tenant vượt ngưỡng 50.000 tài khoản của cell pool, tốt nghiệp lên bridge theo ADR-29.
                  plannedAt: '2026-11-07T22:00:00+07:00'
      responses:
        '201':
          description: Đã tạo đề nghị chuyển cell, chờ người duyệt thứ hai.
          headers:
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantMove' }
              examples:
                cho-duyet:
                  value:
                    id: 0192f1b0-11aa-7b22-9c33-44d55e66f701
                    tenantId: 0192f1a2-3b4c-7d5e-8f60-718293a4b5c6
                    fromCell: { id: 0192f1a2-0000-7c00-8a00-00000000c002, code: CELL-NB }
                    toCell: { id: 0192f1a2-0000-7c00-8a00-00000000c001, code: CELL-HN }
                    targetTenancyModel: BRIDGE
                    dataRegion: HOALAC
                    status: CHO_DUYET
                    reason: Tenant vượt ngưỡng 50.000 tài khoản của cell pool, tốt nghiệp lên bridge theo ADR-29.
                    plannedAt: '2026-11-07T22:00:00+07:00'
                    requestedBy: 0192f1a2-1111-7aaa-8bbb-000000000a01
                    requestedAt: '2026-10-19T09:30:00+07:00'
                    rowVersion: 0
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            Xung đột ghi (`REGISTRY-409-VERSION-CONFLICT`), tenant đang có lần chuyển khác
            (`REGISTRY-409-MOVE-IN-PROGRESS`) hoặc cell đích trùng cell hiện tại (`REGISTRY-409-SAME-CELL`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-01]
        scr: [SCR-0101]
        owner: SVC-03
        roles: [platform_admin]
        scope: N
        aal: 2
        fourEyes: true
        source: TL-01 PL C Dịch vụ nền ("hai người duyệt"); TL-01 SVC-03; ADR-29

  /registry/tenants/{id}/move/{moveId}/approve:
    post:
      tags: [Registry]
      operationId: approveTenantMove
      summary: Phê duyệt lần chuyển cell và khởi động saga chuyển
      description: >-
        Người duyệt thứ hai, khác người đề nghị, phê duyệt đề nghị chuyển cell. Máy chủ chuyển tenant sang
        `DANG_CHUYEN_CELL`, khởi động saga sao chép logic và chuyển đổi (TL-04), trả 202. Kết thúc thành công
        thì tenant về `DANG_VAN_HANH`, `registry.tenant_cell` có dòng mới và phát `registry.tenant.changed.v1`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdPath'
        - name: moveId
          in: path
          required: true
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalComment' }
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403':
          description: >-
            Người duyệt trùng người đề nghị (`REGISTRY-403-SAME-APPROVER`) hoặc OPA từ chối.
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-01]
        scr: [SCR-0101]
        owner: SVC-03
        roles: [platform_admin]
        scope: N
        aal: 2
        fourEyes: true
        source: TL-01 PL C Dịch vụ nền ("hai người duyệt"), đường dẫn duyệt là suy luận

  /registry/tenants/{id}/move/{moveId}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
      - name: moveId
        in: path
        required: true
        description: Mã lệnh chuyển cell.
        schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    get:
      tags: [Registry]
      operationId: getTenantMove
      summary: Chi tiết và tiến độ lệnh chuyển cell
      description: >-
        Theo dõi trạng thái saga sáu bước chuyển cell của tenant (ADR-29: tạo đích, Debezium sao chép
        ban đầu, bắt kịp WAL, chuyển tenant sang chỉ đọc `TAM_KHOA`, đổi `registry.tenant_cell.active`,
        mở lại ghi ở cell mới).
      responses:
        '200':
          description: Chi tiết lệnh chuyển cell.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantMove' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-01]
        scr: [SCR-0101]
        owner: SVC-03
        roles: [platform_admin]
        scope: N
        aal: 2
        source: 'ADR-29; TL-03 registry.tenant_cell (suy luận đường dẫn)'

  /registry/tenants/{id}/move/{moveId}/cancel:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
      - name: moveId
        in: path
        required: true
        description: Mã lệnh chuyển cell.
        schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    post:
      tags: [Registry]
      operationId: cancelTenantMove
      summary: Huỷ lệnh chuyển cell trước khi cắt chuyển hoặc quay lui an toàn
      description: >-
        Huỷ đề nghị chuyển cell khi đang `CHO_DUYET`, hoặc dừng/quay lui an toàn trước khi đổi
        `registry.tenant_cell.active` (ADR-29). Yêu cầu AAL2 và hai người duyệt khi đang `DANG_CHUYEN`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalComment' }
      responses:
        '200':
          description: Lệnh chuyển cell đã chuyển sang `DA_HUY`.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantMove' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            Xung đột phiên bản hoặc lệnh đã hoàn tất cắt chuyển (`REGISTRY-409-MOVE-ALREADY-CUTOVER`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-01]
        scr: [SCR-0101]
        owner: SVC-03
        roles: [platform_admin]
        scope: N
        aal: 2
        fourEyes: true
        source: 'ADR-29; TL-01 SVC-03 (suy luận đường dẫn)'

  # ───────────────────────────── IAM (SVC-02) ─────────────────────────────
  /iam/users/{personId}/mfa-recovery-codes:
    parameters:
      - name: personId
        in: path
        required: true
        description: Mã nhân sự (`org.person.id`) cần cấp mã khôi phục MFA.
        schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    post:
      tags: [IAM]
      operationId: issueMfaRecoveryCode
      summary: Cấp mã khôi phục MFA một lần có thời hạn 15 phút
      description: >-
        Quản trị viên đơn vị xác minh ngoại tuyến và cấp mã khôi phục một lần khi người dùng mất thiết bị
        SmartOTP (TL-02a QT-00 mục 3.1.5). Mã có thời hạn tối đa 15 phút, chỉ dùng một lần để đăng nhập
        và đăng ký thiết bị mới, ghi nhật ký kiểm toán.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaRecoveryCodeIssueRequest' }
      responses:
        '201':
          description: Mã khôi phục một lần (chỉ trả dạng rõ đúng một lần khi cấp).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaRecoveryCodeIssued' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-00]
        scr: [SCR-0001]
        owner: SVC-02
        roles: [tenant_admin]
        scope: Tn
        aal: 2
        rules: [BR-00-01]
        source: 'TL-02a QT-00 ngoại lệ mất SmartOTP (suy luận đường dẫn)'

  /iam/users/{personId}/mfa-recovery-codes/revoke:
    parameters:
      - name: personId
        in: path
        required: true
        description: Mã nhân sự (`org.person.id`) cần thu hồi các mã khôi phục MFA chưa dùng.
        schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    post:
      tags: [IAM]
      operationId: revokeMfaRecoveryCodes
      summary: Thu hồi mọi mã khôi phục MFA đang còn hiệu lực của người dùng
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaRecoveryCodeRevokeRequest' }
      responses:
        '200':
          description: Số mã khôi phục đã thu hồi.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaRecoveryCodeRevokeResult' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-00]
        scr: [SCR-0001]
        owner: SVC-02
        roles: [tenant_admin]
        scope: Tn
        aal: 2
        rules: [BR-00-01]
        source: 'TL-02a QT-00 ngoại lệ mất SmartOTP (suy luận đường dẫn)'

  # ───────────────────────────── Workflow (SVC-06) ─────────────────────────────
  /workflow/inbox:
    get:
      tags: [Workflow]
      operationId: listWorkflowInbox
      summary: Hộp việc cần duyệt của người dùng
      description: >-
        Đọc từ `flowable.wf_task_projection` (không truy vấn `ACT_*`): user task gán trực tiếp cho người dùng
        và user task có nhóm ứng viên khớp vai trò, đơn vị trong ngữ cảnh đang chọn. Sắp theo hạn tăng dần.
        `counts` phục vụ MSG-02-12 "Còn {n} bộ chờ duyệt".
      parameters:
        - name: assignee
          in: query
          description: Chỉ hỗ trợ `me` (người gọi).
          schema: { type: string, enum: [me], default: me }
        - name: businessType
          in: query
          description: Lọc theo loại đối tượng nghiệp vụ, ví dụ `OKR_OBJECTIVE`, `PLAN`, `APPRAISAL_PROFILE`.
          schema: { type: string, maxLength: 32 }
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Trang hộp việc.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowInboxPage' }
              examples:
                okr-cho-duyet:
                  value:
                    items:
                      - taskId: '7f3c2a10-8b1e-11f1-9c5a-0242ac120002'
                        title: Phê duyệt OKR Quý I/2027 của Ban Tổ chức
                        businessType: OKR_OBJECTIVE
                        businessId: 0192f2c4-5d6e-7f80-91a2-b3c4d5e6f701
                        businessKey: 'OKR_OBJECTIVE:0192f2c4-5d6e-7f80-91a2-b3c4d5e6f701'
                        templateCode: duyet-okr
                        assigneeId: 0192f1a2-2222-7aaa-8bbb-000000000b04
                        candidateRole: leader
                        candidateUnitId: 0192f1a2-3333-7ccc-8ddd-000000000a01
                        periodId: 0192f1a2-4444-7eee-8fff-000000000f27
                        dueAt: '2027-01-08T17:00:00+07:00'
                        createdAt: '2027-01-06T09:12:00+07:00'
                        overdue: false
                        deepLink: /okr/phe-duyet/0192f2c4-5d6e-7f80-91a2-b3c4d5e6f701
                        rowVersion: 1
                    nextCursor: null
                    counts: { total: 6, overdue: 0, dueToday: 0 }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-02, QT-04, QT-09, QT-18]
        scr: [SCR-0203, SCR-1803]
        owner: SVC-06
        roles: [tenant_admin, policy_author, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        source: TL-01 PL C Dịch vụ nền; TL-01 SVC-06; TL-02a SCR-0203 trường 1; TL-03 `flowable.wf_task_projection`

  /workflow/tasks/{taskId}/complete:
    post:
      tags: [Workflow]
      operationId: completeWorkflowTask
      summary: Hoàn thành một user task với quyết định và lý do
      description: >-
        Người được gán (hoặc thuộc nhóm ứng viên) hoàn thành user task. Biến `decision` được đặt vào tiến trình
        (mẫu dùng `${decision == 'TRA_LAI'}`, TL-01 chương 8). Thao tác nghiệp vụ có API riêng của module (ví dụ
        `POST /okr/objectives/{id}/approve`) gọi thao tác này qua lõi; frontend dùng trực tiếp cho user task
        không có API nghiệp vụ riêng (suy luận). `If-Match` mang `REV_` của `ACT_RU_TASK` (trả trong
        `rowVersion` của hộp việc).
      parameters:
        - $ref: '#/components/parameters/WorkflowTaskId'
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowTaskCompletion' }
            examples:
              tra-lai:
                value:
                  decision: TRA_LAI
                  comment: KR 1.3 chưa có chỉ tiêu đo được, đề nghị bổ sung trước ngày 10/01/2027.
      responses:
        '200':
          description: Đã hoàn thành user task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowTaskResult' }
              examples:
                da-tra-lai:
                  value:
                    taskId: '7f3c2a10-8b1e-11f1-9c5a-0242ac120002'
                    businessKey: 'OKR_OBJECTIVE:0192f2c4-5d6e-7f80-91a2-b3c4d5e6f701'
                    decision: TRA_LAI
                    completedAt: '2027-01-07T10:05:00+07:00'
                    processEnded: true
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403':
          description: >-
            Người gọi không phải người được gán hay ứng viên, hoặc vi phạm tách vai trò (người duyệt là người soạn,
            `WORKFLOW-403-SELF-APPROVAL`, MSG-02-11).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409':
          description: >-
            User task đã được người khác hoàn thành (`WORKFLOW-409-TASK-COMPLETED`) hoặc lệch phiên bản
            (`WORKFLOW-409-VERSION-CONFLICT`).
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-02, QT-04, QT-09]
        scr: [SCR-0203]
        owner: SVC-06
        roles: [tenant_admin, leader, manager, member, appraiser, decider, second_approver, inspector]
        scope: B
        rules: [BR-02-08, BR-02-09]
        source: TL-01 PL C Dịch vụ nền ("Người được gán"); TL-01 SVC-06

  /workflow/tasks/batch-complete:
    post:
      tags: [Workflow]
      operationId: batchCompleteWorkflowTasks
      summary: Duyệt hàng loạt tối đa 200 user task
      description: >-
        Hoàn thành nhiều user task cùng một quyết định, mỗi mục một giao dịch; mục lỗi không làm hỏng mục khác.
        Kết quả từng mục (`BatchItemResult`) nằm ở `resultLocation` của job. Chỉ dùng cho mục không có cảnh
        báo (SCR-0203 "Duyệt hàng loạt (đủ điều kiện)").
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowBatchCompletion' }
            examples:
              duyet-ba-bo:
                value:
                  decision: DUYET
                  comment: Đồng ý.
                  items:
                    - { taskId: '7f3c2a10-8b1e-11f1-9c5a-0242ac120002', rowVersion: 1 }
                    - { taskId: '7f3c2a11-8b1e-11f1-9c5a-0242ac120002', rowVersion: 1 }
                    - { taskId: '7f3c2a12-8b1e-11f1-9c5a-0242ac120002', rowVersion: 2 }
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422':
          description: Quá 200 mục (`WORKFLOW-422-BATCH-TOO-LARGE`) hoặc dữ liệu không hợp lệ.
          content:
            application/problem+json:
              schema: { $ref: '../common/common.yaml#/components/schemas/ProblemDetails' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-02, QT-04, QT-09]
        scr: [SCR-0203]
        owner: SVC-06
        roles: [leader, manager, appraiser, decider, second_approver]
        scope: B
        source: TL-01 PL C Dịch vụ nền ("tới 200 mục"); TL-01 SVC-06

  /workflow/instances:
    get:
      tags: [Workflow]
      operationId: listWorkflowInstances
      summary: Danh sách tiến trình đang chạy theo mẫu, phát hiện tiến trình kẹt
      description: >-
        Giám sát tiến trình (BS-01 SCR-1506). Đọc từ `flowable.wf_task_projection` và chỉ số engine, không truy
        vấn `ACT_*` lúc cao điểm. Quản trị tenant thấy tiến trình của tenant mình; quản trị nền tảng xem tổng
        hợp theo cell (tham số `cell`). Tiến trình "kẹt" là tiến trình có user task quá hạn hoặc không có người
        xử lý hợp lệ (suy luận).
      parameters:
        - name: template
          in: query
          description: Mã mẫu luồng (`flowable.wf_template.template_code`).
          schema: { type: string, maxLength: 64 }
        - name: stuck
          in: query
          schema: { type: boolean }
        - name: cell
          in: query
          description: Mã cell, chỉ quản trị nền tảng dùng.
          schema: { type: string, maxLength: 16 }
        - name: unit
          in: query
          description: >-
            Lọc theo đơn vị xử lý của bước đang chờ (đơn vị trong nhóm ứng viên của user task,
            `flowable.wf_task_projection.candidate_unit_id`). Bước giao thẳng cho một người, không có nhóm ứng
            viên, không khớp bộ lọc này (bổ sung DV-06-10, suy luận).
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Trang tiến trình.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowInstancePage' }
              examples:
                mot-tien-trinh-ket:
                  value:
                    items:
                      - businessKey: 'APPRAISAL_PROFILE:0192f3d5-6e7f-7091-a2b3-c4d5e6f70812'
                        businessType: APPRAISAL_PROFILE
                        businessId: 0192f3d5-6e7f-7091-a2b3-c4d5e6f70812
                        title: Hồ sơ đánh giá năm 2026 – Trần Minh Hoàng
                        templateCode: duyet-ho-so-danh-gia
                        templateVersion: 3
                        currentActivityName: Duyệt theo cấp
                        currentTaskId: '9a1b2c3d-8b1e-11f1-9c5a-0242ac120002'
                        assigneeId: null
                        candidateRole: appraiser
                        startedAt: '2026-12-01T08:00:00+07:00'
                        dueAt: '2026-12-20T17:00:00+07:00'
                        stuck: true
                        stuckReason: Quá hạn 3 ngày, không có người xử lý trong đơn vị ứng viên.
                        cellCode: CELL-HN
                        rowVersion: 2
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-15]
        scr: [SCR-1506]
        owner: SVC-06
        roles: [platform_admin, tenant_admin]
        scope: Tn
        aal: 2
        source: BS-01 SCR-1506; ma trận SCR-1506.xem

  /workflow/instances/{businessKey}/history:
    get:
      tags: [Workflow]
      operationId: getWorkflowHistory
      summary: Lịch sử duyệt của một hồ sơ theo businessKey
      description: >-
