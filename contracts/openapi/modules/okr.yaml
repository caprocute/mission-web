                      - { type: OBJECTIVE, id: 0192a1b0-1111-7a00-8000-000000000001, code: O1, title: Nâng cao chất lượng tổ chức đảng và đảng viên, unitName: Ban Tổ chức Đảng uỷ khối, status: DA_DUYET, progress: 0.64 }
                    edges:
