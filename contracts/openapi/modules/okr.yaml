                        objectiveId: 0192a1b0-1111-7a00-8000-000000000001
                        objectiveCode: O1
                        unit: '%'
                        targetValue: 3
                        currentValue: 2.4
                        confidence: CAO
                        riskFlag: BINH_THUONG
                        dueDate: '2026-12-31'
                        nextCheckinDue: '2026-10-23'
                      - id: 0192a1b0-2222-7a00-8000-000000000013
                        code: KR 1.3
                        title: Tỷ lệ tổ chức đảng được kiểm tra chuyên đề đạt 90%
                        objectiveId: 0192a1b0-1111-7a00-8000-000000000001
                        objectiveCode: O1
                        unit: '%'
                        targetValue: 90
                        currentValue: 32.6
                        confidence: THAP
                        riskFlag: THEO_DOI
