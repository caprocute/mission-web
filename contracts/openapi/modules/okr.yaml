        periodId: 0192a000-0000-7000-8000-00000000a426
        checkinAt: '2026-10-22T15:30:00+07:00'
        value: 2.6
        confidence: CAO
        highlights: Kết nạp thêm 1 đảng viên tại Chi bộ 3.
        channel: WEB
        status: DA_GUI
        sourceValue: 2.6
        sourceFetchedAt: '2026-10-22T08:00:00+07:00'
        createdBy: { id: 0192a000-0000-7000-8000-00000000c005, name: Nguyễn Văn An }
        onBehalf: false

  schemas:
    OkrObjectiveStatus:
      description: Trạng thái mục tiêu (`okr.objective.status`, baseline mục 9.1). KR theo trạng thái của mục tiêu.
      type: string
      enum: [NHAP, CHO_DUYET, DA_DUYET, DONG]
    OkrOwnerType:
      description: Chủ thể sở hữu mục tiêu (`okr.objective.owner_type`).
      type: string
      enum: [TAP_THE, CA_NHAN]
    OkrMetricType:
      description: >-
        Loại đo của KR (`okr.key_result.metric_type`). `MOC` là mốc có thời hạn (BS-03 DC-04): KR gồm các mốc
        ở `/okr/key-results/{id}/milestones`, lõi ghi ngày đạt và số ngày làm việc chậm, cách quy đổi ra tỷ lệ
        hoàn thành nằm trong Policy Pack.
      type: string
      enum: [SO_LUONG, TY_LE, CO_KHONG, CHI_SO, MOC]
    OkrDirection:
      description: Chiều tốt của KR (`okr.key_result.direction`); `TOI_DA` là không được vượt quá chỉ tiêu (BS-03 DC-04).
      type: string
      enum: [TANG, GIAM, DAT, TOI_DA]
    OkrConfidence:
      description: Mức tự tin (`okr.kr_checkin.confidence`, `okr.key_result.confidence`).
      type: string
      enum: [CAO, TRUNG_BINH, THAP]
    OkrRiskFlag:
      description: Cờ rủi ro của KR (`okr.key_result.risk_flag`, TL-02a QT-03).
      type: string
      enum: [BINH_THUONG, THEO_DOI, RUI_RO]
    OkrContentSource:
      description: Nguồn nội dung (`okr.key_result.content_source`, BR-02-11).
      type: string
      enum: [HUMAN, AI_ACCEPTED, AI_EDITED]
    OkrCheckinFrequency:
      description: >-
        Tần suất check-in (`okr.key_result.checkin_frequency`). TL-03 không có CHECK IN; mã lấy từ
        nhãn "Tuần, Hai tuần, Tháng" của SCR-0202 (suy luận).
      type: string
      enum: [TUAN, HAI_TUAN, THANG]
    OkrCheckinStatus:
      description: Trạng thái lần check-in (`okr.kr_checkin.status`).
      type: string
      enum: [NHAP, DA_GUI]
    OkrCheckinChannel:
      description: Kênh nhập check-in (`okr.kr_checkin.channel`).
      type: string
      enum: [WEB, MOBILE, TICH_HOP]
    OkrBasisKind:
      description: Loại căn cứ (`okr.basis.basis_kind`).
      type: string
      enum: [NGHI_QUYET, KET_LUAN, CHI_THI, CHUONG_TRINH, KE_HOACH, CHI_TIEU_KTXH]
    OkrLinkFromType:
      description: Loại đầu nguồn của liên kết (`okr.okr_link.from_type`).
      type: string
      enum: [BASIS, OBJECTIVE, KEY_RESULT]
    OkrLinkToType:
      description: Loại đầu đích (`okr.okr_link.to_type`); `PROGRAM`, `TASK` là mã logic của schema `task`.
      type: string
      enum: [OBJECTIVE, KEY_RESULT, PROGRAM, TASK]
    OkrLinkKind:
      description: Loại liên kết (`okr.okr_link.link_kind`).
      type: string
      enum: [PHAN_RA, DONG_GOP, NGANG, CAN_CU]
    OkrReviewDecision:
      description: Quyết định của người duyệt (`okr.objective_review.decision`).
      type: string
      enum: [DUYET, TRA_LAI]

    OkrObjectiveRef:
      description: Mục tiêu rút gọn.
      type: object
      required: [id, code, title]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 16 }
        title: { type: string }
        status: { $ref: '#/components/schemas/OkrObjectiveStatus' }
        unitName: { type: string, description: Tên đơn vị sở hữu }
    OkrBasisRef:
      description: Căn cứ rút gọn.
      type: object
      required: [id, title]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        basisKind: { $ref: '#/components/schemas/OkrBasisKind' }
        docNumber: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 500 }
    OkrCheckResult:
      description: >-
        Một kết quả của bộ kiểm tra tự động MOD-01 (tính lại mỗi lần đọc, không lưu; SCR-0203 trường 3).
      type: object
      required: [level, rule, message]
      properties:
        level: { $ref: '#/components/schemas/OkrCheckLevel' }
        rule: { type: string, description: 'Mã quy tắc, ví dụ `BR-02-05`' }
        msg: { type: string, description: 'Mã thông điệp TL-02, ví dụ `MSG-02-05`' }
        message: { type: string, description: Thông điệp tiếng Việt đã điền tham số }
        keyResultId:
          $ref: '../common/common.yaml#/components/schemas/Uuid'
          description: KR liên quan; vắng khi quy tắc áp cho cả mục tiêu.
        similarTaskCode:
          type: string
          description: Mã nhiệm vụ có nội dung gần giống KR (BR-02-06), ví dụ `NV-2027-Q1-0012`.
    OkrApprovalInfo:
      description: Thông tin luồng duyệt `duyet-okr` đang mở (`flowable.wf_task_projection`).
      type: object
      properties:
        processInstanceId: { type: string, description: '`okr.objective.wf_process_instance_id`' }
        reviewer: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        onBehalfOf:
          $ref: '../common/common.yaml#/components/schemas/Ref'
          description: Người duyệt chính khi đang duyệt thay theo uỷ quyền.
        dueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        submittedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        lastComment: { type: string, maxLength: 2000, description: Ý kiến gần nhất của người duyệt }

    OkrObjective:
      description: Mục tiêu O (`okr.objective`) kèm KR, căn cứ, liên kết và kết quả kiểm tra.
      type: object
      required: [id, periodId, ownerType, ownerUnit, code, title, status, progress, versionNo, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        period: { $ref: '../common/common.yaml#/components/schemas/PeriodRef' }
        ownerType: { $ref: '#/components/schemas/OkrOwnerType' }
        ownerUnit: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        ownerPerson:
          $ref: '../common/common.yaml#/components/schemas/Ref'
          description: Có khi `ownerType = CA_NHAN`.
        code: { type: string, maxLength: 16, description: 'Mã hiển thị `O{n}`, duy nhất trong đơn vị và kỳ' }
        title: { type: string, maxLength: 200 }
        description: { type: string, description: Diễn giải chuyển biến cần đạt }
        tier: { type: integer, minimum: 1, maximum: 3, description: Tầng phân rã }
        parentObjective: { $ref: '#/components/schemas/OkrObjectiveRef' }
        bases:
          type: array
          items: { $ref: '#/components/schemas/OkrBasisRef' }
        status: { $ref: '#/components/schemas/OkrObjectiveStatus' }
        progress:
          type: number
          minimum: 0
          maximum: 1
          description: Tiến độ, trung bình có trọng số tiến độ các KR, từ 0 đến 1 (`okr.objective.progress`).
        overLimitReason: { type: string, maxLength: 500, description: Lý do vượt 3 mục tiêu (BR-02-01) }
        overLimit: { type: boolean, description: 'Nhãn "Vượt 3 O" cho người duyệt (suy luận)' }
        versionNo:
          type: integer
          minimum: 1
          description: Phiên bản mục tiêu (`okr.objective.version_no`, tăng khi tạo phiên bản điều chỉnh từ mục tiêu đã duyệt theo BR-02-10).
        aiAssisted: { type: boolean }
        aiSuggestionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        approvedBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        approvedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        approval: { $ref: '#/components/schemas/OkrApprovalInfo' }
        keyResults:
          type: array
          items: { $ref: '#/components/schemas/OkrKeyResult' }
        peerLinks:
          type: array
          description: Liên kết ngang (`link_kind = NGANG`).
          items: { $ref: '#/components/schemas/OkrLink' }
        checks:
          type: array
          description: Kết quả kiểm tra tự động; có trong phản hồi đọc một mục tiêu và phản hồi ghi.
          items: { $ref: '#/components/schemas/OkrCheckResult' }
        createdBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        createdAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        updatedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
        permittedActions:
          $ref: '../common/common.yaml#/components/schemas/PermittedActions'
          description: >-
            Thao tác của người gọi trên mục tiêu này: `SCR-0202.soan-don-vi`, `SCR-0202.soan-ca-nhan`,
            `SCR-0202.trinh` khi mục tiêu còn nháp (mục tiêu cá nhân chỉ của chính mình), `SCR-0203.duyet`,
            `SCR-0203.tra-lai` khi chờ duyệt và người gọi không phải người soạn (BR-02-08).
    OkrObjectivePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OkrObjective' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
        counts:
          type: object
          description: Số mục tiêu của đơn vị trong kỳ so với khuyến nghị (SCR-0201 vùng 1).
          properties:
            objectives: { type: integer, minimum: 0 }
            recommendedMax: { type: integer, minimum: 1 }
    OkrObjectiveWritable:
      description: Phần sửa được của mục tiêu nháp.
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 4000 }
        tier: { type: integer, minimum: 1, maximum: 3, default: 1 }
        parentObjectiveId:
          $ref: '../common/common.yaml#/components/schemas/Uuid'
          description: Mục tiêu cấp trên cùng kỳ; bắt buộc khi trình, trừ cấp cao nhất (BR-02-02). Ghi vào `okr.okr_link` loại `PHAN_RA`.
        basisIds:
          type: array
          description: Căn cứ (`okr.objective_basis`); ít nhất một khi trình (BR-02-02).
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        overLimitReason: { type: string, maxLength: 500 }
        aiSuggestionId:
          $ref: '../common/common.yaml#/components/schemas/Uuid'
          description: Gợi ý AI đã được người soạn chấp nhận cho tên mục tiêu (BR-02-11).
        keyResults:
          type: array
          maxItems: 5
          description: Danh sách KR đầy đủ của mục tiêu; tổng `weight` bằng 1 khi trình (BR-02-07).
          items: { $ref: '#/components/schemas/OkrKeyResultInput' }
    OkrObjectiveCreate:
      allOf:
        - $ref: '#/components/schemas/OkrObjectiveWritable'
        - type: object
          required: [periodId, ownerType, ownerUnitId]
          properties:
            periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            ownerType: { $ref: '#/components/schemas/OkrOwnerType' }
            ownerUnitId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            ownerPersonId:
              $ref: '../common/common.yaml#/components/schemas/Uuid'
              description: Bắt buộc khi `ownerType = CA_NHAN`.
    OkrObjectiveUpdate:
      allOf:
        - $ref: '#/components/schemas/OkrObjectiveWritable'
    OkrCopyFromPeriodRequest:
      type: object
      required: [fromPeriodId, toPeriodId, ownerUnitId]
      properties:
        fromPeriodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        toPeriodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        ownerUnitId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        objectiveIds:
          type: array
          description: Chỉ sao chép các mục tiêu này; vắng thì sao chép tất cả.
          items: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    OkrExportRequest:
      type: object
      required: [periodId, unitId]
      properties:
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        unitId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        format:
          type: string
          enum: [DOCX, PDF, XLSX]
          default: DOCX
          description: Định dạng tệp (suy luận).
    OkrReviewComment:
      type: object
      properties:
        comment: { type: string, maxLength: 2000 }
    OkrApproveRequest:
      type: object
      properties:
        comment: { type: string, maxLength: 2000, description: 'Ý kiến phê duyệt, không bắt buộc' }
        notifyPeers: { type: boolean, default: true, description: Thông báo cho các đơn vị liên kết ngang }
    OkrReturnRequest:
      type: object
      required: [comment]
      properties:
        comment: { type: string, minLength: 1, maxLength: 2000, description: Ý kiến bắt buộc (BR-02-09) }
        notifyPeers: { type: boolean, default: true }
    OkrCancelRequest:
      description: Yêu cầu huỷ mục tiêu từ `CHO_DUYET` hoặc `DA_DUYET` sang `DONG`, bắt buộc lý do.
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 2000 }
        notifyPeers: { type: boolean, default: true }
    OkrRevisionCreateRequest:
      description: Yêu cầu tạo phiên bản điều chỉnh (`versionNo + 1`) từ mục tiêu `DA_DUYET` (BR-02-10).
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 10
          maxLength: 2000
          description: Lý do điều chỉnh (sự kiện bất khả kháng hoặc thay đổi nhiệm vụ chính trị).
        basisDocRef:
          type: string
          maxLength: 200
          description: Số hiệu văn bản căn cứ điều chỉnh (nếu có).
        submitImmediately:
          type: boolean
          default: false
          description: Trình duyệt ngay phiên bản mới sau khi tạo; mặc định `false` (lưu ở `NHAP` để sửa chi tiết).
    KrCheckinDelegateInput:
      description: Thiết lập người được chủ KR uỷ quyền check-in thay (QT-03 bước 2).
      type: object
      required: [delegatePersonId]
      properties:
        delegatePersonId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        validUntil:
          type: [string, 'null']
          format: date
          description: Hạn hiệu lực uỷ quyền; bỏ trống là tới hết kỳ của KR.
        reason: { type: string, maxLength: 500 }
    OkrApproveBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: object
            required: [id, rowVersion]
            properties:
              id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
              rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
        comment: { type: string, maxLength: 2000 }
        notifyPeers: { type: boolean, default: true }
    OkrObjectiveHistoryEntry:
      description: Một mốc trong lịch sử mục tiêu (`okr.objective_review` và lịch sử luồng duyệt).
      type: object
      required: [at, action, versionNo, actor]
      properties:
        at: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        action:
          type: string
          description: Hành động (mã suy luận từ bảng trạng thái QT-02 và BR-02-10).
          enum: [TAO, LUU_NHAP, TRINH, RUT_LAI, DUYET, TRA_LAI, TAO_PHIEN_BAN, DONG]
        versionNo: { type: integer, minimum: 1 }
        status: { $ref: '#/components/schemas/OkrObjectiveStatus' }
        actor: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        onBehalfOf:
          $ref: '../common/common.yaml#/components/schemas/Ref'
          description: Người duyệt chính khi duyệt thay.
        decision: { $ref: '#/components/schemas/OkrReviewDecision' }
        comment: { type: string, maxLength: 4000 }
        aiAssisted: { type: boolean, description: Lần lưu có nội dung chèn từ gợi ý AI }
    OkrObjectiveHistoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OkrObjectiveHistoryEntry' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }

    OkrLastCheckin:
      description: Check-in `DA_GUI` gần nhất của KR.
      type: object
      required: [value, confidence, checkinAt]
      properties:
        value: { type: number }
        confidence: { $ref: '#/components/schemas/OkrConfidence' }
        checkinAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
    OkrKeyResult:
      description: Kết quả then chốt (`okr.key_result`).
      type: object
      required: [id, objectiveId, code, title, unit, targetValue, weight, dueDate, status, riskFlag, progress, rowVersion]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        objectiveId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 16, description: 'Mã `KR {o}.{n}`' }
        title: { type: string, maxLength: 300 }
        metricType: { $ref: '#/components/schemas/OkrMetricType' }
        unit: { type: string, maxLength: 32, description: 'Đơn vị đo: %, người, hồ sơ, ngày, lần, mốc' }
        baselineValue: { type: [number, 'null'] }
        targetValue:
          type: [number, 'null']
          description: >-
            Chỉ tiêu. Chỉ được `null` khi KR còn `NHAP` (bản nháp lưu tự động của SCR-0202 có thể chưa nhập);
            máy chủ chặn trình khi thiếu (BR-02-04).
        currentValue: { type: [number, 'null'], description: Giá trị từ check-in gần nhất }
        direction: { $ref: '#/components/schemas/OkrDirection' }
        weight: { type: number, minimum: 0, maximum: 1, description: 'Trọng số trong mục tiêu, từ 0 đến 1' }
        dueDate:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Date'
            - type: 'null'
          description: Hạn. Chỉ được `null` khi KR còn `NHAP`; máy chủ chặn trình khi thiếu (BR-02-04).
        verifier: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        owner:
          $ref: '../common/common.yaml#/components/schemas/Ref'
          description: >-
            Chủ sở hữu KR, người check-in (suy luận: TL-02 SCR-0002 nhắc `okr.key_result.owner_id` nhưng
            TL-03 không có cột này).
        checkinDelegate:
          $ref: '../common/common.yaml#/components/schemas/Ref'
          description: Người đang được giao check-in thay (suy luận).
        numeratorLabel:
          type: [string, 'null']
          maxLength: 200
          description: >-
            Nhãn tử số của KR kiểu `TY_LE` (`numerator_label`, BS-03 DC-04); khi có cả hai nhãn, check-in nhập tử
            số và mẫu số, máy chủ tính giá trị.
        denominatorLabel:
          type: [string, 'null']
          maxLength: 200
          description: Nhãn mẫu số của KR kiểu `TY_LE` (`denominator_label`, BS-03 DC-04).
        dataSource: { type: string, maxLength: 200 }
        formulaText: { type: string, maxLength: 1000 }
        confidence: { $ref: '#/components/schemas/OkrConfidence' }
        progress: { type: number, minimum: 0, maximum: 1 }
        status: { $ref: '#/components/schemas/OkrObjectiveStatus' }
        riskFlag: { $ref: '#/components/schemas/OkrRiskFlag' }
        checkinFrequency: { $ref: '#/components/schemas/OkrCheckinFrequency' }
        contentSource: { $ref: '#/components/schemas/OkrContentSource' }
        aiAssisted: { type: boolean }
        aiSuggestionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        lastCheckin: { $ref: '#/components/schemas/OkrLastCheckin' }
        myDraftCheckin: { $ref: '#/components/schemas/OkrCheckin' }
        nextCheckinDue:
          $ref: '../common/common.yaml#/components/schemas/Date'
          description: Hạn check-in của chu kỳ hiện tại (suy luận).
        objective:
          $ref: '#/components/schemas/OkrObjectiveRef'
          description: Mục tiêu chứa KR; có trong `GET /okr/key-results/{id}` (SCR-0301 vùng 2).
        viewerIsOwner:
          type: boolean
          description: Người gọi là chủ sở hữu hoặc người được giao check-in thay (máy chủ tính; suy luận).
        latestBlocker:
          type: [string, 'null']
          description: Ghi chú vướng mắc của check-in gần nhất, hiện ở SCR-0201 trường 6 (suy luận).
        linkedWork:
          type: array
          description: >-
            Một số chương trình, nhiệm vụ liên kết để hiển thị (SCR-0201 trường 6, SCR-0301 vùng 5); có trong
            `GET /okr/tree` và `GET /okr/key-results/{id}`.
          items: { $ref: '#/components/schemas/OkrLinkedWork' }
        linkedTaskCount:
          type: integer
          minimum: 0
          description: Tổng số nhiệm vụ liên kết, có thể nhiều hơn số phần tử `linkedWork`.
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
        permittedActions:
          $ref: '../common/common.yaml#/components/schemas/PermittedActions'
          description: >-
            Thao tác của người gọi trên KR này: `SCR-0201.check-in` khi mục tiêu đã duyệt và người gọi là
            chủ KR hoặc người được giao check-in thay (BR-03-01).
    OkrKeyResultInput:
      description: >-
        KR khi soạn (SCR-0202 trường 7-16). Khi mục tiêu còn `NHAP`, bản nháp được lưu dù thiếu `targetValue`
        hoặc `dueDate` (gửi `null` hoặc bỏ trường); khi trình, máy chủ kiểm lại đủ trường theo BR-02-04 và
        trả 422. Lưu KR thiếu hai trường này khi mục tiêu không còn `NHAP` cũng trả 422.
      type: object
      required: [title, unit, weight, verifierPersonId]
      properties:
        id:
          $ref: '../common/common.yaml#/components/schemas/Uuid'
          description: Có khi sửa KR đã có trong `PUT /okr/objectives/{id}`.
        title: { type: string, minLength: 1, maxLength: 300 }
        metricType:
          $ref: '#/components/schemas/OkrMetricType'
          description: Mặc định `SO_LUONG` khi vắng (suy luận; SCR-0202 không có trường này).
        unit: { type: string, minLength: 1, maxLength: 32 }
        baselineValue: { type: number, default: 0 }
        targetValue: { type: [number, 'null'] }
        direction:
          $ref: '#/components/schemas/OkrDirection'
          description: Mặc định `TANG` khi vắng (suy luận).
        weight: { type: number, minimum: 0, maximum: 1 }
        dueDate:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Date'
            - type: 'null'
          description: Mặc định ngày cuối kỳ khi vắng (TL-02a SCR-0202 trường 13).
        verifierPersonId:
          $ref: '../common/common.yaml#/components/schemas/Uuid'
          description: Người xác nhận, khác chủ sở hữu KR.
        numeratorLabel:
          type: [string, 'null']
          maxLength: 200
          description: >-
            Nhãn tử số của KR kiểu `TY_LE` (`numerator_label`, BS-03 DC-04); khi có cả hai nhãn, check-in nhập tử
            số và mẫu số, máy chủ tính giá trị.
        denominatorLabel:
          type: [string, 'null']
          maxLength: 200
          description: Nhãn mẫu số của KR kiểu `TY_LE` (`denominator_label`, BS-03 DC-04).
        dataSource: { type: string, maxLength: 200 }
        formulaText: { type: string, maxLength: 1000 }
        checkinFrequency:
          $ref: '#/components/schemas/OkrCheckinFrequency'
        contentSource:
          $ref: '#/components/schemas/OkrContentSource'
        aiSuggestionId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    OkrKeyResultCreate:
      allOf:
        - $ref: '#/components/schemas/OkrKeyResultInput'
        - type: object
          required: [objectiveId]
          properties:
            objectiveId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    OkrKeyResultListItem:
      description: KR rút gọn trong danh sách. Luôn có `id`, `code`, `title` (tương thích frontend WEB-028).
      type: object
      required: [id, code, title]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 16 }
        title: { type: string, maxLength: 300 }
        objectiveId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        objectiveCode: { type: string, maxLength: 16 }
        unit: { type: string, maxLength: 32 }
        targetValue: { type: number }
        currentValue: { type: [number, 'null'] }
        progress: { type: number, minimum: 0, maximum: 1 }
        confidence: { $ref: '#/components/schemas/OkrConfidence' }
        riskFlag: { $ref: '#/components/schemas/OkrRiskFlag' }
        dueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        nextCheckinDue: { $ref: '../common/common.yaml#/components/schemas/Date' }
        lastCheckin: { $ref: '#/components/schemas/OkrLastCheckin' }
    OkrKeyResultPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OkrKeyResultListItem' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
        period:
          $ref: '#/components/schemas/OkrPeriodInfo'
          description: Kỳ của danh sách, để dựng tiêu đề SCR-0301 (tuần, kỳ) (suy luận).
        counts:
          type: object
          description: Có khi `needCheckin=true`.
          properties:
            needCheckin: { type: integer, minimum: 0 }
    OkrSourceValue:
      type: object
      required: [value, fetchedAt]
      properties:
        value: { type: number }
        fetchedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        dataSource: { type: string, maxLength: 200 }

    OkrKrMilestone:
      description: Một mốc của KR kiểu `MOC` (`okr.kr_milestone`, BS-03 DC-04).
      type: object
      required: [id, seq, dueDate]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        seq: { type: integer, minimum: 1, description: Thứ tự mốc trong KR. }
        dueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
        recognitionCondition: { type: string, maxLength: 1000, description: Điều kiện công nhận đạt mốc. }
        achievedAt:
          description: Ngày đạt mốc; null khi chưa đạt.
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Date'
            - type: 'null'
        lateWorkdays:
          type: [integer, 'null']
          minimum: 0
          description: Số ngày làm việc chậm so với hạn, máy chủ tính theo lịch nghỉ của tenant.
        evidenceRef: { type: [string, 'null'], maxLength: 200, description: Tham chiếu minh chứng. }
    OkrKrMilestoneList:
      type: object
      required: [keyResultId, items]
      properties:
        keyResultId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        items:
          type: array
          items: { $ref: '#/components/schemas/OkrKrMilestone' }
    OkrKrMilestoneReplace:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [seq, dueDate]
            properties:
              id:
                $ref: '../common/common.yaml#/components/schemas/Uuid'
                description: Có khi giữ mốc đã có.
              seq: { type: integer, minimum: 1 }
              dueDate: { $ref: '../common/common.yaml#/components/schemas/Date' }
              recognitionCondition: { type: string, maxLength: 1000 }
    OkrKrMilestoneAchieve:
      type: object
      required: [achievedAt]
      properties:
        achievedAt: { $ref: '../common/common.yaml#/components/schemas/Date' }
        evidenceRef: { type: string, maxLength: 200 }
    OkrCheckin:
      description: Một lần check-in (`okr.kr_checkin`), chỉ ghi thêm.
      type: object
      required: [id, keyResultId, checkinAt, value, confidence, channel, status]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        keyResultId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        checkinAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        value: { type: number }
        confidence: { $ref: '#/components/schemas/OkrConfidence' }
        highlights: { type: string, maxLength: 1000 }
        blockerNote: { type: string, maxLength: 1000 }
        channel: { $ref: '#/components/schemas/OkrCheckinChannel' }
        status: { $ref: '#/components/schemas/OkrCheckinStatus' }
        sourceValue: { type: [number, 'null'] }
        sourceFetchedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        numeratorValue:
          type: number
          minimum: 0
          description: Tử số khi KR khai nhãn tử số và mẫu số (BS-03 DC-04); máy chủ tính `value` từ tử số và mẫu số.
        denominatorValue:
          type: number
          exclusiveMinimum: 0
          description: Mẫu số đi cùng `numeratorValue` (BS-03 DC-04).
        overrideReason: { type: string, maxLength: 500 }
        verifiedBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        verifiedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        createdBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        onBehalf: { type: boolean, description: 'Check-in thay chủ sở hữu KR (suy luận)' }
    OkrCheckinCreate:
      description: Thân yêu cầu lưu nháp hoặc gửi check-in (SCR-0301 trường 5-11, SCR-0302).
      type: object
      required: [status, value, confidence]
      properties:
        status:
          $ref: '#/components/schemas/OkrCheckinStatus'
        value:
          type: number
          description: Giá trị hiện tại, tối đa 4 chữ số lẻ (BR-03-02).
          multipleOf: 0.0001
        confidence: { $ref: '#/components/schemas/OkrConfidence' }
        numeratorValue:
          type: number
          minimum: 0
          description: Tử số khi KR khai nhãn tử số và mẫu số (BS-03 DC-04); máy chủ tính `value` từ tử số và mẫu số.
        denominatorValue:
          type: number
          exclusiveMinimum: 0
          description: Mẫu số đi cùng `numeratorValue` (BS-03 DC-04).
        sourceValue: { type: number, description: Giá trị nguồn đã lấy (nếu có) }
        sourceFetchedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        overrideReason:
          type: string
          maxLength: 500
          description: Bắt buộc khi `value` khác `sourceValue` (BR-03-04).
        highlights: { type: string, maxLength: 1000 }
        blockerNote:
          type: string
          maxLength: 1000
          description: Vướng mắc, đề nghị hỗ trợ; có thể bắt buộc khi tự tin `THAP` theo cấu hình tenant.
        channel:
          $ref: '#/components/schemas/OkrCheckinChannel'
        confirmLargeChange:
          type: boolean
          default: false
          description: Người dùng đã xác nhận cảnh báo chênh lệch lớn (BR-03-05, MSG-03-02).
    OkrCheckinResult:
      description: Kết quả ghi check-in kèm tiến độ đã tính lại (MSG-03-01).
      type: object
      required: [checkin, keyResult, objective]
      properties:
        checkin: { $ref: '#/components/schemas/OkrCheckin' }
        keyResult:
          type: object
          required: [id, code, progress, riskFlag]
          properties:
            id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            code: { type: string }
            currentValue: { type: [number, 'null'] }
            progress: { type: number, minimum: 0, maximum: 1 }
            confidence: { $ref: '#/components/schemas/OkrConfidence' }
            riskFlag: { $ref: '#/components/schemas/OkrRiskFlag' }
        objective:
          type: object
          required: [id, code, progress]
          properties:
            id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
            code: { type: string }
            progress: { type: number, minimum: 0, maximum: 1 }
    OkrCheckinPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OkrCheckin' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }

    OkrBasis:
      description: Căn cứ (`okr.basis`).
      type: object
      required: [id, basisKind, title]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        basisKind: { $ref: '#/components/schemas/OkrBasisKind' }
        docNumber: { type: string, maxLength: 64 }
        title: { type: string, maxLength: 500 }
        issuedByUnit: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        issuedOn: { $ref: '../common/common.yaml#/components/schemas/Date' }
        sourceDocRef: { type: string, maxLength: 200 }
        parentBasisId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        validFrom: { $ref: '../common/common.yaml#/components/schemas/Date' }
        validTo: { $ref: '../common/common.yaml#/components/schemas/Date' }
    OkrBasisPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OkrBasis' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    OkrLink:
      description: Liên kết đa hình (`okr.okr_link`).
      type: object
      required: [id, fromType, fromId, toType, toId, linkKind]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        fromType: { $ref: '#/components/schemas/OkrLinkFromType' }
        fromId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        toType: { $ref: '#/components/schemas/OkrLinkToType' }
        toId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        linkKind: { $ref: '#/components/schemas/OkrLinkKind' }
        contributionWeight: { type: [number, 'null'], minimum: 0, maximum: 1 }
        fromLabel: { type: string, description: 'Mã, tên đầu nguồn để hiển thị' }
        toLabel: { type: string, description: 'Mã, tên và đơn vị đầu đích để hiển thị' }
        rowVersion: { $ref: '../common/common.yaml#/components/schemas/RowVersion' }
    OkrLinkCreate:
      type: object
      required: [fromType, fromId, toType, toId, linkKind]
      properties:
        fromType: { $ref: '#/components/schemas/OkrLinkFromType' }
        fromId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        toType: { $ref: '#/components/schemas/OkrLinkToType' }
        toId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        linkKind: { $ref: '#/components/schemas/OkrLinkKind' }
        contributionWeight: { type: number, minimum: 0, maximum: 1 }
    OkrLinkPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/OkrLink' }
        nextCursor: { $ref: '../common/common.yaml#/components/schemas/NextCursor' }
    OkrAlignmentNode:
      type: object
      required: [type, id, title]
      properties:
        type:
          type: string
          enum: [BASIS, OBJECTIVE, KEY_RESULT, PROGRAM, TASK]
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string }
        title: { type: string }
        unitName: { type: string }
        status: { type: string, description: Trạng thái của đối tượng theo module sở hữu }
        progress: { type: number, minimum: 0, maximum: 1 }
        confidence: { $ref: '#/components/schemas/OkrConfidence' }
    OkrAlignmentEdge:
      type: object
      required: [fromType, fromId, toType, toId, linkKind]
      properties:
        fromType: { $ref: '#/components/schemas/OkrLinkFromType' }
        fromId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        toType: { $ref: '#/components/schemas/OkrLinkToType' }
        toId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        linkKind: { $ref: '#/components/schemas/OkrLinkKind' }
        contributionWeight: { type: [number, 'null'] }
    OkrAlignmentGraph:
      description: Đồ thị liên kết dọc và ngang.
      type: object
      required: [nodes, edges]
      properties:
        rootId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        nodes:
          type: array
          items: { $ref: '#/components/schemas/OkrAlignmentNode' }
        edges:
          type: array
          items: { $ref: '#/components/schemas/OkrAlignmentEdge' }

    OkrCheckLevel:
      description: >-
        Mức của một kết quả kiểm tra tự động MOD-01. Mã `DAT`, `CANH_BAO`, `LOI_CHAN` là suy luận từ nhãn
        "Đạt, cảnh báo, lỗi" của SCR-0203 trường 3.
      type: string
      enum: [DAT, CANH_BAO, LOI_CHAN]
    OkrPeriodInfo:
      description: >-
        Kỳ kèm trạng thái và vị trí tuần hiện tại để dựng tiêu đề SCR-0201, SCR-0203, SCR-0301 (ví dụ
        "Quý IV/2026 · Tuần 4/13"). `weekNo`, `weekCount` vắng với kỳ chưa bắt đầu (suy luận).
      allOf:
        - $ref: '../common/common.yaml#/components/schemas/PeriodRef'
        - type: object
          required: [status]
          properties:
            status: { $ref: '../common/common.yaml#/components/schemas/PeriodStatus' }
            weekNo: { type: integer, minimum: 1 }
            weekCount: { type: integer, minimum: 1 }
    OkrPersonOption:
      description: Người chọn được kèm chức danh, ví dụ người xác nhận KR (SCR-0202 trường 14) hay người duyệt.
      type: object
      required: [id, name]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        name: { type: string }
        title: { type: string, description: Chức danh }
    OkrLinkedWork:
      description: >-
        Chương trình hoặc nhiệm vụ gắn với KR qua `okr.okr_link` (SCR-0201 trường 6, SCR-0301 vùng 5),
        kèm tiến độ do module sở hữu cung cấp (suy luận).
      type: object
      required: [id, kind, code, title]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        kind:
          type: string
          enum: [PROGRAM, TASK]
        code: { type: string, description: 'Mã hiển thị, ví dụ `NV-2027-Q1-0012`' }
        title: { type: string }
        progress: { type: number, minimum: 0, maximum: 1 }
    OkrPeerLink:
      description: Liên kết ngang của cây mục tiêu, đã ghép nhãn hai đầu để hiển thị (SCR-0201 trường 5).
      type: object
      required: [id, fromLabel, peerUnitName, peerCode, peerTitle]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        fromLabel: { type: string, description: 'Đầu của đơn vị đang xem, ví dụ "O2 · KR 2.1"' }
        fromKeyResultId:
          oneOf:
            - $ref: '../common/common.yaml#/components/schemas/Uuid'
            - type: 'null'
          description: KR đầu nguồn; `null` khi liên kết đặt ở mức mục tiêu.
        peerUnitName: { type: string }
        peerCode: { type: string }
        peerTitle: { type: string }
    OkrTree:
      description: Cây mục tiêu của một đơn vị trong kỳ kèm ngữ cảnh SCR-0201 (`GET /okr/tree`).
      type: object
      required: [period, periods, unit, viewerOwnUnit, bases, parent, recommendedMax, objectives, peerLinks]
      properties:
        period: { $ref: '#/components/schemas/OkrPeriodInfo' }
        periods:
          type: array
          description: Các kỳ chọn được ở bộ lọc kỳ.
          items: { $ref: '#/components/schemas/OkrPeriodInfo' }
        unit: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        viewerOwnUnit:
          type: boolean
          description: Đơn vị đang xem là đơn vị trong ngữ cảnh làm việc của người gọi (máy chủ tính theo token).
        bases:
          type: array
          items: { $ref: '#/components/schemas/OkrBasisRef' }
        parent:
          description: Mục tiêu cấp trên mà cây này phân rã từ; `null` ở đơn vị cao nhất.
          oneOf:
            - $ref: '#/components/schemas/OkrObjectiveRef'
            - type: 'null'
        recommendedMax:
          type: integer
          minimum: 1
          description: Số mục tiêu khuyến nghị tối đa mỗi kỳ (BR-02-01, tham số Policy Pack).
        objectives:
          type: array
          description: Mọi mục tiêu của cây, phẳng, nối bằng `parentObjective.id`; mỗi mục tiêu kèm `keyResults`.
          items: { $ref: '#/components/schemas/OkrObjective' }
        peerLinks:
          type: array
          items: { $ref: '#/components/schemas/OkrPeerLink' }
    OkrRule:
      description: >-
        Quy tắc soát OKR viết bằng CEL trong Policy Pack (QT-02 bước 4). `scope` cho biết biểu thức chạy
        trên `objective` hay trên từng `kr`; `message` có thể chứa chỗ trống `{tên}` lấy từ biến cùng tên
        của ngữ cảnh. `serverOnly = true` thì trình duyệt không chạy (cần dữ liệu máy chủ, ví dụ so trùng
        nhiệm vụ của BR-02-06).
      type: object
      required: [id, br, scope, severity, when, assert, message]
      properties:
        id: { type: string }
        br: { type: string, description: 'Mã quy tắc nghiệp vụ, ví dụ `BR-02-05`' }
        scope:
          type: string
          enum: [objective, kr]
        severity:
          type: string
          enum: [CHAN, CANH_BAO]
          description: '`CHAN` chặn trình duyệt, `CANH_BAO` chỉ cảnh báo (cột "Xử lý" của bảng BR TL-02a).'
        when: { type: string, description: Biểu thức CEL điều kiện áp dụng }
        assert: { type: string, description: Biểu thức CEL phải đúng }
        message: { type: string }
        passLabel: { type: string, description: 'Nhãn khi đạt cho danh sách kiểm tra trước khi trình' }
        serverOnly: { type: boolean, default: false }
    OkrPolicy:
      description: Tham số soát OKR của Policy Pack đang áp dụng cho tenant (suy luận cách đóng gói).
      type: object
      required: [version, recommendedMax, vagueWords, taskVerbs, units, rules]
      properties:
        version: { type: string, description: Phiên bản Policy Pack }
        recommendedMax: { type: integer, minimum: 1, description: BR-02-01 }
        vagueWords:
          type: array
          description: Từ mơ hồ (BR-02-05), ví dụ "tăng cường", "đẩy mạnh".
          items: { type: string }
        taskVerbs:
          type: array
          description: Động từ mở đầu KR giống nhiệm vụ (BR-02-06), ví dụ "tổ chức", "ban hành".
          items: { type: string }
        units:
          type: array
          description: Đơn vị đo gợi ý (SCR-0202 trường 9).
          items: { type: string }
        rules:
          type: array
          items: { $ref: '#/components/schemas/OkrRule' }
    OkrParentOption:
      description: Mục tiêu cấp trên chọn được (SCR-0202 trường 2).
      allOf:
        - $ref: '#/components/schemas/OkrObjectiveRef'
        - type: object
          required: [periodId]
          properties:
            periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
    OkrComposeContext:
      description: Ngữ cảnh soạn mục tiêu của đơn vị trong kỳ (`GET /okr/compose-context`, SCR-0202).
      type: object
      required: [period, periods, unit, isTopLevel, bases, parentOptions, existingCount, verifiers, me, aiEnabled, policy]
      properties:
        period: { $ref: '#/components/schemas/OkrPeriodInfo' }
        periods:
          type: array
          description: Kỳ chưa khoá soạn được (trường 5).
          items: { $ref: '#/components/schemas/OkrPeriodInfo' }
        unit: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        isTopLevel:
          type: boolean
          description: Đơn vị cao nhất của tenant, không bắt buộc mục tiêu cấp trên (BR-02-02).
        bases:
          type: array
          items: { $ref: '#/components/schemas/OkrBasisRef' }
        parentOptions:
          type: array
          items: { $ref: '#/components/schemas/OkrParentOption' }
        existingCount:
          type: integer
          minimum: 0
          description: Số mục tiêu đã có của chủ thể trong kỳ, không tính mục tiêu đang sửa (BR-02-01).
        verifiers:
          type: array
          description: Người xác nhận KR chọn được (trường 14).
          items: { $ref: '#/components/schemas/OkrPersonOption' }
        me:
          $ref: '../common/common.yaml#/components/schemas/Ref'
          description: Người gọi, để mặc định người xác nhận khác chủ sở hữu.
        aiEnabled: { type: boolean, description: Tenant bật trợ lý AI soát OKR (AC-12) }
        policy: { $ref: '#/components/schemas/OkrPolicy' }
    OkrReviewCheck:
      description: Kết quả kiểm tra rút gọn một dòng của SCR-0203 trường 3 (tính lại khi đọc, không lưu).
      type: object
      required: [level, label]
      properties:
        level: { $ref: '#/components/schemas/OkrCheckLevel' }
        label:
          type: string
          description: 'Nhãn ngắn như "Có căn cứ", "Đo được", "Gần giống NV-2027-Q1-0012", "Vượt 3 O"'
    OkrReviewKr:
      type: object
      required: [id, code, title, targetText, weight, link, check]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 16 }
        title: { type: string, maxLength: 300 }
        targetText: { type: string, description: 'Chỉ tiêu kèm đơn vị đo, ví dụ "3 %"' }
        weight: { type: number, minimum: 0, maximum: 1 }
        link:
          type: [string, 'null']
          description: Nhãn liên kết lên mục tiêu hoặc KR cấp trên; `null` khi chưa liên kết.
        check: { $ref: '#/components/schemas/OkrReviewCheck' }
    OkrReviewObjective:
      type: object
      required: [id, code, title, parentCode, versionNo, rowVersion, check, keyResults]
      properties:
        id: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        code: { type: string, maxLength: 16 }
        title: { type: string, maxLength: 200 }
        parentCode: { type: [string, 'null'], description: Mã mục tiêu cấp trên }
        versionNo: { type: integer, minimum: 1 }
        rowVersion:
          $ref: '../common/common.yaml#/components/schemas/RowVersion'
          description: Gửi lại trong `If-Match` khi phê duyệt hoặc trả lại.
        check: { $ref: '#/components/schemas/OkrReviewCheck' }
        checks:
          type: array
          description: Toàn bộ kết quả kiểm tra chi tiết (tuỳ chọn, như `OkrObjective.checks`).
          items: { $ref: '#/components/schemas/OkrCheckResult' }
        keyResults:
          type: array
          items: { $ref: '#/components/schemas/OkrReviewKr' }
    OkrReviewSet:
      description: Một bộ OKR của đơn vị cấp dưới đã trình, đang chờ người gọi duyệt (SCR-0203 vùng 1).
      type: object
      required: [id, unit, periodId, submittedAt, submittedBy, versionNo, objectiveCount, krCount, summary, blockingCount, warningCount, viewerIsAuthor, objectives]
      properties:
        id:
          type: string
          description: Mã bộ trình duyệt, ổn định trong kỳ (suy luận; dùng mã phiên `duyet-okr` hoặc tổ hợp đơn vị và kỳ).
        unit: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        periodId: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        submittedAt: { $ref: '../common/common.yaml#/components/schemas/DateTime' }
        submittedBy: { $ref: '../common/common.yaml#/components/schemas/Ref' }
        versionNo: { type: integer, minimum: 1, description: Lần trình duyệt }
        objectiveCount: { type: integer, minimum: 0 }
        krCount: { type: integer, minimum: 0 }
        summary: { $ref: '#/components/schemas/OkrReviewCheck' }
        blockingCount: { type: integer, minimum: 0, description: Số kết quả `LOI_CHAN` }
        warningCount: { type: integer, minimum: 0, description: Số kết quả `CANH_BAO` }
        viewerIsAuthor:
          type: boolean
          description: Người gọi là người soạn bộ này nên không được duyệt (BR-02-08, MSG-02-11).
        objectives:
          type: array
          items: { $ref: '#/components/schemas/OkrReviewObjective' }
    OkrReviewQueue:
      description: Hàng chờ phê duyệt OKR của người gọi trong kỳ (`GET /okr/reviews`, SCR-0203).
      type: object
      required: [period, periods, reviewer, workflow, items]
      properties:
        period: { $ref: '#/components/schemas/OkrPeriodInfo' }
        periods:
          type: array
          items: { $ref: '#/components/schemas/OkrPeriodInfo' }
        dueDate:
          $ref: '../common/common.yaml#/components/schemas/Date'
          description: Hạn duyệt sớm nhất trong hàng chờ; vắng khi hàng chờ rỗng.
        reviewer: { $ref: '#/components/schemas/OkrPersonOption' }
        workflow:
          type: object
          description: Quy trình `duyet-okr` đang áp dụng (`flowable` process definition).
          required: [code, version]
          properties:
            code: { type: string, examples: [duyet-okr] }
            version: { type: integer, minimum: 1 }
        items:
          type: array
          items: { $ref: '#/components/schemas/OkrReviewSet' }
