  /okr/key-results:
    get:
      tags: [Kết quả then chốt]
      operationId: listOkrKeyResults
      summary: Danh sách KR
      description: >-
        Danh sách KR rút gọn dùng ở nhiều nơi: liên kết nhiệm vụ với KR (SCR-0501, `scope=unit`), khối
        "KR cần check-in" của trang chủ SCR-0002 (`owner=me&needCheckin=true`), danh sách check-in của
        SCR-0301 và SCR-0302. Mỗi dòng luôn có `id`, `code`, `title`. Khi `needCheckin=true`, phản hồi
        có `counts.needCheckin` cho số đếm trên menu và thẻ chỉ số.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - $ref: '../common/common.yaml#/components/parameters/UnitId'
        - name: scope
          in: query
          description: >-
            `unit` lấy KR của đơn vị trong ngữ cảnh đang chọn (hoặc của `unit`); `subtree` lấy cả cây
            cấp dưới (chỉ `leader`). Mặc định `unit`.
          schema:
            type: string
            enum: [unit, subtree]
            default: unit
        - name: owner
          in: query
          description: '`me` để chỉ lấy KR người gọi sở hữu hoặc được giao check-in thay.'
          schema:
            type: string
            enum: [me]
        - name: needCheckin
          in: query
          description: Chỉ lấy KR thuộc mục tiêu `DA_DUYET` chưa có check-in `DA_GUI` trong chu kỳ hiện tại.
          schema: { type: boolean }
        - name: objective
          in: query
          description: Chỉ lấy KR của một mục tiêu.
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: riskFlag
          in: query
          description: Lọc theo cờ rủi ro.
          schema: { $ref: '#/components/schemas/OkrRiskFlag' }
        - $ref: '../common/common.yaml#/components/parameters/Q'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang KR.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkrKeyResultPage' }
              examples:
                can-check-in:
