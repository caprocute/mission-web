        '400': { $ref: '../common/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-00, QT-03, QT-05]
        scr: [SCR-0002, SCR-0301, SCR-0302, SCR-0501]
        owner: MOD-01
        roles: [leader, manager, member, inspector, ai_readonly]
        scope: Đv
        source: TL-02a SCR-0002 "Tải trang" (`/okr/key-results?owner=me&needCheckin=true`); SCR-0301, SCR-0302 trường 1; mã frontend WEB-028
    post:
      tags: [Kết quả then chốt]
      operationId: createOkrKeyResult
      summary: Thêm một KR vào mục tiêu nháp
      description: >-
        Thêm một KR vào mục tiêu ở trạng thái `NHAP` (ví dụ khi người soạn dùng gợi ý của trợ lý AI ở
        SCR-1701). Thao tác này làm tăng `row_version` của mục tiêu chứa KR; giao diện đang sửa mục tiêu
