      operationId: listOkrLinks
      summary: Danh sách liên kết OKR
      description: >-
        Tra liên kết theo đầu nguồn hoặc đầu đích (truy vết hai chiều theo PL 4 III.2), ví dụ các liên
        kết ngang của một mục tiêu hoặc các nhiệm vụ phục vụ một KR.
      parameters:
        - name: fromType
          in: query
          schema: { $ref: '#/components/schemas/OkrLinkFromType' }
        - name: fromId
          in: query
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: toType
          in: query
          schema: { $ref: '#/components/schemas/OkrLinkToType' }
        - name: toId
          in: query
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - name: linkKind
          in: query
          schema: { $ref: '#/components/schemas/OkrLinkKind' }
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang liên kết.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkrLinkPage' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-02]
        scr: [SCR-0201, SCR-0202]
        owner: MOD-01
        roles: [leader, manager, member, inspector, ai_readonly]
        scope: Đv
        source: TL-02b ma trận truy vết QT-02 (`/okr/links`); TL-03 `okr.okr_link`
    post:
      tags: [Liên kết và căn cứ]
      operationId: createOkrLink
      summary: Tạo liên kết OKR
      description: >-
        Tạo liên kết, chủ yếu là liên kết ngang (`NGANG`) giữa mục tiêu, KR của hai đơn vị cùng kỳ
        (SCR-0201 trường 12) hoặc liên kết đóng góp. Liên kết căn cứ và mục tiêu cấp trên của một mục
        tiêu ghi qua `basisIds`, `parentObjectiveId` của mục tiêu. Trùng liên kết trả 409
        `OKR-409-LINK-EXISTS`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OkrLinkCreate' }
            examples:
              lien-ket-ngang:
                value:
                  fromType: KEY_RESULT
                  fromId: 0192a1b0-2222-7a00-8000-000000000021
                  toType: KEY_RESULT
                  toId: 0192a1b0-2222-7a00-8000-0000000e0021
                  linkKind: NGANG
      responses:
        '201':
          description: Đã tạo liên kết.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkrLink' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-02]
        scr: [SCR-0201, SCR-0202]
        owner: MOD-01
        roles: [manager, member]
        scope: Đv
        source: TL-02b ma trận truy vết QT-02 (`/okr/links`, suy luận phương thức); TL-03 `okr.okr_link`

