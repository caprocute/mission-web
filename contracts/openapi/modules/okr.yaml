        nghỉ của tenant (CORE-08-04) và cập nhật tiến độ KR như một check-in (phát EVT-02). Ghi nhận đã gửi là
        bất biến, đính chính bằng lần ghi nhận mới (suy luận theo BR-03-03). Lỗi: `OKR-409-OBJECTIVE-NOT-APPROVED`,
        `OKR-409-PERIOD-LOCKED`, `OKR-409-VERSION-CONFLICT`, `OKR-422-VALIDATION` (ngày đạt ở tương lai).
