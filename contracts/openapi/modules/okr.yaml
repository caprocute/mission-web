      description: >-
        Đồ thị liên kết (nút và cạnh) từ căn cứ, mục tiêu cấp trên, mục tiêu, KR xuống chương trình và
        nhiệm vụ của MOD-02, cùng liên kết ngang giữa đơn vị. Dùng cho chế độ "Bản đồ liên kết" của
        SCR-0201 và cây liên kết ở SCR-0203. Cần `objective`, hoặc cả `unit` và `period`; thiếu trả 400.
      parameters:
        - name: objective
          in: query
          description: Mục tiêu gốc của đồ thị.
          schema: { $ref: '../common/common.yaml#/components/schemas/Uuid' }
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - $ref: '../common/common.yaml#/components/parameters/UnitId'
        - name: depth
          in: query
          description: Số tầng đi lên và đi xuống từ nút gốc (suy luận). Mặc định 3.
