      description: >-
        Chủ sở hữu KR uỷ quyền cho chuyên viên đầu mối (`delegatePersonId`) thực hiện check-in thay trong
        thời hạn xác định (`validUntil`). Khi uỷ quyền còn hiệu lực, `viewerIsOwner` đúng cho cả chủ KR và
