  /okr/key-results/{id}/source-value:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Kết quả then chốt]
      operationId: getOkrKeyResultSourceValue
      summary: Lấy lại số liệu nguồn của KR
      description: >-
        Gọi lại hệ thống nguồn qua integration-gateway (SVC-13) để lấy giá trị gợi ý và thời điểm lấy
        (≤ 3 giây). Số liệu nguồn chỉ là gợi ý; chủ sở hữu KR xác nhận. TL-02 không ghi phương thức;
        hợp đồng chọn GET vì không đổi trạng thái. Nguồn lỗi trả 502 `OKR-502-SOURCE-UNAVAILABLE`
        (MSG-03-03), giao diện cho nhập tay.
      responses:
        '200':
          description: Giá trị nguồn.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkrSourceValue' }
