# Hợp đồng OpenAPI 3.1 của MOD-01 `okr` (mission-core SVC-05), WEB-063, ADR-32.
# Nguồn:
#   - Baseline mục 9 (schema `okr`), 9.1 (trạng thái `okr.objective.status`), 10 (vai trò AC), 13 (quy ước API);
#     bảng sự kiện EVT-01 MucTieuDaDuyet, EVT-02 KrDaCheckIn, EVT-21 YeuCauThongBao.
#   - TL-01 Phụ lục C mục "Mục tiêu và OKR (MOD-01)".
#   - TL-02a QT-02 (SCR-0201, SCR-0202, SCR-0203; BR-02-01..BR-02-11; MSG-02-01..MSG-02-12),
#     QT-03 (SCR-0301, SCR-0302; BR-03-01..BR-03-08; MSG-03-01..MSG-03-07), QT-00 SCR-0002 (khối KR cần check-in).
#   - TL-02b QT-17 SCR-1701 (đường dẫn okr dùng từ trợ lý AI: PUT objective, POST key-results, history);
#     TL-02b ma trận truy vết QT-02, QT-03 (`/okr/links`).
#   - TL-03 schema `okr`: `basis`, `objective`, `key_result`, `objective_basis`, `objective_review`, `okr_link`,
#     `kr_checkin`; cột chung (`row_version` là ETag); bảng sự kiện outbox EVT-01, EVT-02.
#   - Ma trận phân quyền `docs/phan-quyen/ma-tran.json` (SCR-0201..SCR-0203, SCR-0301, SCR-0302, SCR-1701; dòng API `okr`).
#   - BS-03 (ADR-33, 22/10/2026) điểm cắm DC-04: kiểu đo `MOC`, chiều `TOI_DA`, nhãn tử số và mẫu số của KR
#     tỷ lệ, bảng `okr.kr_milestone` và tài nguyên `/okr/key-results/{id}/milestones` (NEN-044).
# Trợ lý AI cho OKR (`/ai/...`) thuộc `platform.yaml`, không nằm ở đây.
openapi: 3.1.0
info:
  title: Mission – Mục tiêu và OKR (MOD-01)
  version: 1.0.0-draft.1
  description: >-
    API của module `okr` (MOD-01) trong mission-core (SVC-05): căn cứ, mục tiêu O, kết quả then chốt
    KR, liên kết dọc và ngang (phân rã ba tầng), luồng trình và phê duyệt OKR (QT-02, luồng duyệt
    `duyet-okr` chạy trên SVC-06) và check-in KR chỉ ghi thêm (QT-03, không qua BPMN theo ADR-04).
    Máy chủ là nơi kiểm tra cuối cùng mọi quy tắc BR-02-xx và BR-03-xx; bộ kiểm tra CEL ở trình duyệt
    chỉ để phản hồi nhanh. Mã lỗi nghiệp vụ có tiền tố `OKR-`.
servers:
  - url: /api/v1
security:
  - keycloak: []
tags:
  - name: Mục tiêu
    description: Mục tiêu O (`okr.objective`) với các KR đi kèm, trình duyệt, phê duyệt, trả lại, xuất mẫu báo cáo.
  - name: Kết quả then chốt
    description: Kết quả then chốt KR (`okr.key_result`), danh sách KR cần check-in, số liệu nguồn.
  - name: Check-in
    description: Lần check-in KR (`okr.kr_checkin`), chỉ ghi thêm; gửi rồi không sửa, không xoá (BR-03-03).
  - name: Liên kết và căn cứ
    description: Căn cứ (`okr.basis`), liên kết đa hình (`okr.okr_link`) và cây liên kết dọc, ngang.

paths:
  /okr/objectives:
    get:
      tags: [Mục tiêu]
      operationId: listOkrObjectives
      summary: Danh sách mục tiêu theo kỳ và đơn vị
      description: >-
        Trả các mục tiêu của đơn vị (hoặc của cá nhân) trong kỳ, kèm KR và tiến độ, phục vụ ba chế độ
        xem cây, bảng và bản đồ liên kết của SCR-0201. Máy chủ lọc theo phạm vi ABAC: thành viên đơn vị
        xem mục tiêu của đơn vị mình; `leader` xem cả cây cấp dưới. Khi `view=tree` mỗi mục tiêu kèm
        `keyResults` và `peerLinks`; khi `view=table` chỉ kèm `keyResults`; khi `view=map` nên dùng
        `GET /okr/alignment`. Màn hình SCR-0201 dựng cây bằng `GET /okr/tree` (một lần gọi kèm ngữ cảnh kỳ,
        căn cứ, mục tiêu cấp trên); thao tác này phục vụ danh sách phân trang và lọc.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/PeriodId'
        - $ref: '../common/common.yaml#/components/parameters/UnitId'
        - name: view
          in: query
          description: Chế độ xem của SCR-0201. Mặc định `tree`.
          schema:
            type: string
            enum: [tree, table, map]
            default: tree
        - name: ownerType
          in: query
          description: Lọc mục tiêu tập thể hay cá nhân (`okr.objective.owner_type`).
          schema: { $ref: '#/components/schemas/OkrOwnerType' }
        - name: owner
          in: query
          description: '`me` để chỉ lấy OKR cá nhân của người gọi.'
          schema:
            type: string
            enum: [me]
        - name: status
          in: query
          description: Lọc theo trạng thái mục tiêu; có thể lặp lại tham số.
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/OkrObjectiveStatus' }
        - $ref: '../common/common.yaml#/components/parameters/Q'
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang mục tiêu.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkrObjectivePage' }
              examples:
                cay-ban-to-chuc:
                  summary: Cây mục tiêu Ban Tổ chức Đảng uỷ khối, Quý IV/2026
                  value:
                    items:
                      - id: 0192a1b0-1111-7a00-8000-000000000001
                        periodId: 0192a000-0000-7000-8000-00000000a426
                        ownerType: TAP_THE
                        ownerUnit: { id: 0192a000-0000-7000-8000-000000000b70, name: Ban Tổ chức Đảng uỷ khối }
                        code: O1
                        title: Nâng cao chất lượng tổ chức đảng và đảng viên
                        tier: 1
                        status: DA_DUYET
                        progress: 0.64
                        versionNo: 1
                        aiAssisted: false
                        approvedAt: '2026-10-08T15:20:00+07:00'
                        rowVersion: 5
                        keyResults:
                          - id: 0192a1b0-2222-7a00-8000-000000000011
                            objectiveId: 0192a1b0-1111-7a00-8000-000000000001
                            code: KR 1.1
                            title: Kết nạp đảng viên mới đạt 3% tổng số đảng viên đầu kỳ
                            metricType: TY_LE
                            unit: '%'
                            baselineValue: 0
                            targetValue: 3
                            currentValue: 2.4
                            direction: TANG
                            weight: 0.4
                            dueDate: '2026-12-31'
                            confidence: CAO
                            riskFlag: BINH_THUONG
                            progress: 0.8
                            status: DA_DUYET
                            checkinFrequency: TUAN
                            contentSource: HUMAN
                            rowVersion: 9
                    nextCursor: null
                    counts: { objectives: 2, recommendedMax: 3 }
        '400': { $ref: '../common/common.yaml#/components/responses/BadRequest' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-02]
        scr: [SCR-0201, SCR-0203]
        owner: MOD-01
        roles: [leader, manager, member, inspector, ai_readonly]
        scope: Đv
        source: TL-01 PL C; TL-02a SCR-0201 (`/okr/objectives?unit=&period=&view=tree`); ma trận SCR-0201.xem
    post:
      tags: [Mục tiêu]
      operationId: createOkrObjective
      summary: Tạo mục tiêu ở trạng thái nháp
      description: >-
        Tạo mục tiêu `NHAP` (có thể kèm KR), liên kết căn cứ và mục tiêu cấp trên. Kỳ phải tồn tại và
        chưa khoá. Quy tắc chặn trình duyệt (BR-02-02, BR-02-04, BR-02-05, BR-02-07) không chặn lưu nháp;
        kết quả kiểm tra trả trong `checks`. Khi kỳ đã có từ 3 mục tiêu trở lên, phải có
        `overLimitReason` (BR-02-01, MSG-02-04). Mã `code` (`O{n}`) và mã KR do máy chủ sinh.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OkrObjectiveCreate' }
            examples:
              muc-tieu-moi:
                value:
                  periodId: 0192a000-0000-7000-8000-0000000a1270
                  ownerType: TAP_THE
                  ownerUnitId: 0192a000-0000-7000-8000-000000000b70
                  title: Nâng chất lượng sinh hoạt chi bộ khối cơ quan
                  parentObjectiveId: 0192a1b0-1111-7a00-8000-0000000d0001
                  basisIds: [0192a1b0-3333-7a00-8000-000000000101]
                  keyResults:
                    - title: Kiểm tra 100% chi bộ trực thuộc trước 31/3/2027
                      metricType: TY_LE
                      unit: '%'
                      baselineValue: 0
                      targetValue: 100
                      weight: 0.5
                      dueDate: '2027-03-31'
                      verifierPersonId: 0192a000-0000-7000-8000-00000000c001
                      checkinFrequency: TUAN
                      contentSource: AI_ACCEPTED
      responses:
        '201':
          description: Đã tạo mục tiêu nháp.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
            Location: { $ref: '../common/common.yaml#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkrObjective' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409':
          $ref: '../common/common.yaml#/components/responses/Conflict'
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-02, QT-17]
        scr: [SCR-0201, SCR-0202, SCR-1701]
        owner: MOD-01
        roles: [manager, member]
        scope: Đv
        rules: [BR-02-01, BR-02-11]
        source: TL-01 PL C; TL-02a QT-02 bước 1-3; ma trận SCR-0202.soan-don-vi, SCR-0202.soan-ca-nhan

  /okr/objectives/copy-from-period:
    post:
      tags: [Mục tiêu]
      operationId: copyOkrObjectivesFromPeriod
      summary: Sao chép mục tiêu kỳ trước làm điểm khởi đầu
      description: >-
        (suy luận) QT-02 bước 1 và MSG-02-02 cho phép sao chép mục tiêu kỳ trước nhưng TL không ghi
        API. Máy chủ tạo bản sao ở trạng thái `NHAP` trong kỳ đích, giữ căn cứ, bỏ giá trị hiện tại,
        check-in và liên kết cấp trên (người soạn chọn lại mục tiêu cấp trên của kỳ mới).
        Lỗi: `OKR-409-PERIOD-LOCKED` khi kỳ đích đã khoá.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OkrCopyFromPeriodRequest' }
      responses:
        '201':
          description: Các mục tiêu nháp đã tạo trong kỳ đích.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/OkrObjective' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-02]
        scr: [SCR-0201]
        owner: MOD-01
        roles: [manager, member]
        scope: Đv
        source: TL-02a QT-02 bước 1, MSG-02-02 (suy luận đường dẫn)

  /okr/objectives/export:
    post:
      tags: [Mục tiêu]
      operationId: exportOkrObjectives
      summary: Xuất mẫu báo cáo OKR
      description: >-
        Sinh tệp theo mẫu báo cáo OKR của tenant cho đơn vị và kỳ, chạy nền và trả 202. TL-02 không ghi
        phương thức; hợp đồng chọn POST vì tạo tác vụ. Kết quả lấy qua `resultLocation` của job.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OkrExportRequest' }
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-02]
        scr: [SCR-0201]
        owner: MOD-01
        roles: [leader, manager, member]
        scope: Đv
        source: TL-02a SCR-0201 "Xuất mẫu"; ma trận SCR-0201.xem

  /okr/objectives/approve-batch:
    post:
      tags: [Mục tiêu]
      operationId: approveOkrObjectivesBatch
      summary: Duyệt hàng loạt các bộ OKR đủ điều kiện
      description: >-
        Duyệt các bộ OKR "Đạt" (không cảnh báo) đã chọn, mỗi bộ một giao dịch; mục lỗi không làm hỏng
        mục khác. Trả 202; kết quả từng mục (`BatchItemResult`) nằm trong kết quả job. BR-02-08 áp cho
        từng bộ. Mỗi mục kèm `rowVersion` thay cho `If-Match`; lệch phiên bản thì mục đó lỗi 409.
        Mỗi bộ được duyệt phát EVT-01.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OkrApproveBatchRequest' }
      responses:
        '202': { $ref: '../common/common.yaml#/components/responses/Accepted' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-02]
        scr: [SCR-0203]
        owner: MOD-01
        evt: [EVT-01]
        roles: [leader]
        scope: Cd
        fourEyes: true
        rules: [BR-02-08]
        source: TL-02a SCR-0203 "Duyệt hàng loạt"; ma trận SCR-0203.duyet-lo

  /okr/objectives/{id}:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Mục tiêu]
      operationId: getOkrObjective
      summary: Xem chi tiết một mục tiêu
      description: >-
        Trả mục tiêu kèm KR, căn cứ, liên kết, thông tin luồng duyệt và kết quả kiểm tra tự động
        (`checks`, tính lại mỗi lần đọc, không lưu). Dùng cho SCR-0202 khi sửa và SCR-0203 khi xem chi tiết.
      responses:
        '200':
          description: Mục tiêu.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkrObjective' }
              examples:
                cho-duyet:
                  $ref: '#/components/examples/OkrObjectivePending'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-02]
        scr: [SCR-0201, SCR-0202, SCR-0203]
        owner: MOD-01
        roles: [leader, manager, member, inspector, ai_readonly]
        scope: Đv
        source: TL-02a SCR-0202, SCR-0203 (đọc trước khi sửa, xem chi tiết bộ OKR)
    put:
      tags: [Mục tiêu]
      operationId: updateOkrObjective
      summary: Lưu nháp mục tiêu và toàn bộ KR
      description: >-
        Ghi đè phần nội dung sửa được của mục tiêu ở trạng thái `NHAP`, kể cả danh sách KR (KR lưu cùng
        mục tiêu: KR có `id` được cập nhật, KR không có `id` được thêm, KR có trong bản cũ mà vắng mặt
        bị xoá). Giao diện gọi tự động mỗi 30 giây. Mục tiêu `CHO_DUYET` hoặc `DA_DUYET` không sửa tại
        chỗ (BR-02-10): trả 409 `OKR-409-INVALID-STATE`. Nội dung do AI gợi ý phải mang
        `contentSource` là `AI_ACCEPTED` hoặc `AI_EDITED` (BR-02-11).
        Lỗi: `OKR-409-VERSION-CONFLICT`, `OKR-409-PERIOD-LOCKED`, `OKR-409-INVALID-STATE`,
        `OKR-422-OVER-LIMIT-REASON-REQUIRED` (MSG-02-04).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OkrObjectiveUpdate' }
      responses:
        '200':
          description: Đã lưu nháp; trả mục tiêu kèm kết quả kiểm tra mới.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkrObjective' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-02, QT-17]
        scr: [SCR-0202, SCR-1701]
        owner: MOD-01
        roles: [manager, member]
        scope: Đv
        rules: [BR-02-01, BR-02-10, BR-02-11]
        source: TL-02a SCR-0202 "Lưu nháp" (PUT, If-Match); TL-02b SCR-1701; TL-01 PL C ghi PATCH

  /okr/objectives/{id}/submit:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    post:
      tags: [Mục tiêu]
      operationId: submitOkrObjective
      summary: Trình phê duyệt mục tiêu
      description: >-
        Kiểm tra lại toàn bộ quy tắc ở máy chủ, chuyển `NHAP` → `CHO_DUYET`, tạo tiến trình `duyet-okr`
        với người duyệt lấy từ `flowable.wf_binding`. Phản hồi trả người duyệt và hạn duyệt trong
        `approval` để hiển thị MSG-02-08. Lỗi chặn trả 422 `OKR-422-VALIDATION` với `errors[].rule`
        (BR-02-02, BR-02-04, BR-02-05, BR-02-07); mục tiêu cấp trên chưa duyệt trả 422
        `OKR-422-PARENT-NOT-APPROVED` (MSG-02-03). Trạng thái sai trả 409 `OKR-409-INVALID-STATE`;
        kỳ khoá trả 409 `OKR-409-PERIOD-LOCKED`.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      responses:
        '200':
          description: Đã trình; mục tiêu ở `CHO_DUYET`.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkrObjective' }
              examples:
                da-trinh:
                  $ref: '#/components/examples/OkrObjectivePending'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
