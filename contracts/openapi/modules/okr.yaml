          application/json:
            schema: { $ref: '#/components/schemas/OkrKrMilestoneReplace' }
            examples:
              hai-moc:
                value:
                  items:
                    - { seq: 1, dueDate: '2026-11-15', recognitionCondition: Dự thảo đề án được Ban Thường vụ cho ý kiến. }
                    - { seq: 2, dueDate: '2026-12-20', recognitionCondition: Đề án được ban hành. }
      responses:
        '200':
          description: Đã lưu danh sách mốc.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkrKrMilestoneList' }
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        '428': { $ref: '../common/common.yaml#/components/responses/PreconditionRequired' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-02]
        scr: [SCR-0202]
        owner: MOD-01
        roles: [manager, member]
        scope: B
        source: BS-03 DC-04; TL-02a SCR-0202 (soạn KR, suy luận đường dẫn và điều kiện sửa)

