      description: >-
        Dữ liệu dựng chế độ xem cây của SCR-0201 trong một lần gọi: kỳ đang xem và các kỳ chọn được,
        căn cứ, mục tiêu cấp trên, ngưỡng khuyến nghị số mục tiêu (BR-02-01, tham số Policy Pack), mọi
