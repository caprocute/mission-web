  /okr/key-results/{id}/checkins:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Check-in]
      operationId: listOkrCheckins
      summary: Lịch sử check-in của KR
      description: >-
        Các lần check-in `DA_GUI` của KR, mới nhất trước, để vẽ biểu đồ diễn biến và xem vướng mắc.
        Bản nháp `NHAP` chỉ trả cho chính người tạo.
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/Limit'
        - $ref: '../common/common.yaml#/components/parameters/Cursor'
      responses:
        '200':
          description: Một trang check-in.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkrCheckinPage' }
              examples:
                lich-su:
                  value:
                    items:
                      - { id: 0192a1b0-4444-7a00-8000-000000000201, keyResultId: 0192a1b0-2222-7a00-8000-000000000011, checkinAt: '2026-10-22T15:30:00+07:00', value: 2.6, confidence: CAO, channel: WEB, status: DA_GUI, highlights: Kết nạp thêm 1 đảng viên tại Chi bộ 3. }
                    nextCursor: null
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-03]
        scr: [SCR-0301, SCR-0201]
        owner: MOD-01
        roles: [leader, manager, member]
        scope: Đv
        source: TL-02a SCR-0301 "Lịch sử"; ma trận SCR-0301.lich-su
    post:
      tags: [Check-in]
      operationId: createOkrCheckin
      summary: Lưu nháp hoặc gửi check-in KR
      description: >-
        Một đường dẫn cho cả lưu nháp (`status=NHAP`) và gửi (`status=DA_GUI`). Mỗi người có tối đa
        một bản nháp cho mỗi KR; lưu nháp lần sau ghi đè bản nháp đó, gửi thì chuyển bản nháp thành
        `DA_GUI` (suy luận). Check-in đã gửi bất biến (BR-03-03); đính chính bằng check-in mới.
        Khi gửi: ghi `okr.kr_checkin`, cập nhật giá trị hiện tại, tiến độ KR và mục tiêu, cờ rủi ro,
        phát EVT-02, và EVT-21 nếu KR chuyển sang `RUI_RO` (BR-03-06). Ứng dụng di động gửi lại sau
        mất sóng với cùng `Idempotency-Key` (lưu vào `okr.kr_checkin.idempotency_key`).
        Lỗi: `OKR-409-OBJECTIVE-NOT-APPROVED` (BR-03-01), `OKR-409-PERIOD-LOCKED` (MSG-03-05),
        `OKR-422-VALIDATION` (BR-03-02), `OKR-422-OVERRIDE-REASON-REQUIRED` (BR-03-04, MSG-03-04),
        `OKR-422-LARGE-CHANGE-UNCONFIRMED` (BR-03-05, MSG-03-02; gửi lại với `confirmLargeChange=true`).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OkrCheckinCreate' }
            examples:
              gui-tu-web:
                value:
                  status: DA_GUI
                  value: 2.6
                  confidence: CAO
                  sourceValue: 2.6
                  sourceFetchedAt: '2026-10-22T08:00:00+07:00'
                  highlights: Kết nạp thêm 1 đảng viên tại Chi bộ 3.
                  channel: WEB
              gui-tu-di-dong:
                value:
                  status: DA_GUI
                  value: 37
                  confidence: THAP
                  blockerNote: Hai chi bộ chưa nộp báo cáo tự kiểm tra, đề nghị Văn phòng hỗ trợ đôn đốc.
                  channel: MOBILE
      responses:
        '201':
          description: Đã lưu nháp hoặc đã gửi; trả check-in và tiến độ sau khi tính lại.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkrCheckinResult' }
              examples:
                da-gui:
                  value:
                    checkin: { id: 0192a1b0-4444-7a00-8000-000000000201, keyResultId: 0192a1b0-2222-7a00-8000-000000000011, checkinAt: '2026-10-22T15:30:00+07:00', value: 2.6, confidence: CAO, channel: WEB, status: DA_GUI, highlights: Kết nạp thêm 1 đảng viên tại Chi bộ 3. }
                    keyResult:
                      id: 0192a1b0-2222-7a00-8000-000000000011
                      code: KR 1.1
                      currentValue: 2.6
                      progress: 0.8667
                      confidence: CAO
                      riskFlag: BINH_THUONG
                    objective:
                      id: 0192a1b0-1111-7a00-8000-000000000001
                      code: O1
                      progress: 0.6667
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        '409': { $ref: '../common/common.yaml#/components/responses/Conflict' }
        '422': { $ref: '../common/common.yaml#/components/responses/UnprocessableEntity' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-03]
        scr: [SCR-0301, SCR-0302, SCR-0201]
        owner: MOD-01
        evt: [EVT-02, EVT-21]
        roles: [manager, member]
        scope: B
        rules: [BR-03-01, BR-03-02, BR-03-03, BR-03-04, BR-03-05, BR-03-06]
        source: TL-01 PL C; TL-02a SCR-0301 "Lưu nháp", "Gửi check-in"; SCR-0302 "Gửi check-in"; ma trận SCR-0301.check-in

  /okr/key-results/{id}/milestones:
    parameters:
      - $ref: '../common/common.yaml#/components/parameters/IdPath'
    get:
      tags: [Kết quả then chốt]
      operationId: listOkrKrMilestones
      summary: Danh sách mốc của KR kiểu mốc
      description: >-
        Các mốc của KR `metricType = MOC` theo thứ tự (`okr.kr_milestone`, BS-03 DC-04), gồm cả mốc trung gian,
        kèm ngày đạt và số ngày làm việc chậm tính theo lịch nghỉ của tenant. ETag là `row_version` của KR.
      responses:
        '200':
          description: Danh sách mốc.
          headers:
            ETag: { $ref: '../common/common.yaml#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OkrKrMilestoneList' }
              examples:
                hai-moc:
                  $ref: '#/components/examples/OkrKrMilestoneListExample'
        '401': { $ref: '../common/common.yaml#/components/responses/Unauthorized' }
        '403': { $ref: '../common/common.yaml#/components/responses/Forbidden' }
        '404': { $ref: '../common/common.yaml#/components/responses/NotFound' }
        default: { $ref: '../common/common.yaml#/components/responses/Problem' }
      x-mission:
        qt: [QT-02, QT-03]
        scr: [SCR-0202, SCR-0301]
        owner: MOD-01
        roles: [leader, manager, member, inspector, ai_readonly]
        scope: Đv
        source: BS-03 DC-04 "Hợp đồng" (tài nguyên `milestones`); TL-03 bổ sung `okr.kr_milestone` (suy luận đường dẫn)
    put:
      tags: [Kết quả then chốt]
      operationId: replaceOkrKrMilestones
      summary: Khai báo các mốc của KR
      description: >-
        Thay toàn bộ danh sách mốc khi mục tiêu còn `NHAP` (suy luận: cùng điều kiện sửa KR của SCR-0202). Mốc
        sắp theo `seq`, hạn không giảm dần, hạn mốc cuối không sau hạn KR. Lỗi: `OKR-409-VERSION-CONFLICT`,
        `OKR-409-INVALID-STATE` (mục tiêu không còn `NHAP`), `OKR-422-NOT-MILESTONE-KR` (KR không phải kiểu `MOC`),
        `OKR-422-VALIDATION` (thứ tự, hạn).
      parameters:
        - $ref: '../common/common.yaml#/components/parameters/IdempotencyKey'
        - $ref: '../common/common.yaml#/components/parameters/IfMatch'
      requestBody:
        required: true
