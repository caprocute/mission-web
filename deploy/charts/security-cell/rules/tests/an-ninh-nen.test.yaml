# Ca kiểm promtool cho rules/an-ninh-nen.yaml: mỗi cảnh báo có ca kích hoạt và ca không kích hoạt.
rule_files:
- ../an-ninh-nen.yaml
evaluation_interval: 1m
tests:
- interval: 1m
  input_series:
  - series: kube_bench_checks{result="fail", node="cp-1", target="master", job="kube-bench"}
    values: 2x30
  - series: kube_bench_checks{result="fail", node="w-1", target="node", job="kube-bench"}
    values: 0x30
  alert_rule_test:
  - eval_time: 10m
    alertname: KubeBenchFail
    exp_alerts:
    - exp_labels: { severity: warning, doi: sre-nen-tang, sec: SEC-27, node: cp-1, target: master }
      exp_annotations:
        summary: kube-bench ghi 2 mục CIS FAIL trên cp-1 (master); mục tiêu 0
        runbook_url: https://runbook.vt.local/okr/an-ninh-kube-bench
- interval: 1h
  input_series:
  # Lần chạy gần nhất ở thời điểm 0; tới ngày thứ 9 thì quá 8 ngày.
  - series: kube_bench_last_run_timestamp_seconds{node="cp-1", target="master"}
    values: 0x240
  alert_rule_test:
  - eval_time: 7d
    alertname: KubeBenchStale
    exp_alerts: []
  - eval_time: 9d
    alertname: KubeBenchStale
    exp_alerts:
    - exp_labels: { severity: warning, doi: sre-nen-tang, sec: SEC-27, node: cp-1, target: master }
      exp_annotations:
        summary: kube-bench không có kết quả mới quá 8 ngày trên cp-1 (master)
        runbook_url: https://runbook.vt.local/okr/an-ninh-kube-bench
- interval: 1m
  input_series:
  - series: vt_egress_probe_reachable{namespace="core", target="ip-tai-lieu"}
    values: 0x10 1x10
  - series: vt_egress_probe_reachable{namespace="data-pg", target="ip-tai-lieu"}
    values: 0x20
  - series: vt_egress_probe_last_run_timestamp_seconds{namespace="core"}
    values: 0+60x20
  - series: vt_egress_probe_last_run_timestamp_seconds{namespace="data-pg"}
    values: 0x100
  alert_rule_test:
  - eval_time: 5m
    alertname: EgressProbeLeak
    exp_alerts: []
  - eval_time: 15m
    alertname: EgressProbeLeak
    exp_alerts:
    - exp_labels: { severity: critical, doi: soc, sec: SEC-36, namespace: core, target: ip-tai-lieu }
      exp_annotations:
        summary: Pod trong core kết nối thẳng ra ngoài được tới đích ip-tai-lieu (ngoài danh sách cổng ra)
        runbook_url: https://runbook.vt.local/okr/an-ninh-cong-ra
  - eval_time: 20m
    alertname: EgressProbeStale
    exp_alerts: []
  - eval_time: 90m
    alertname: EgressProbeStale
    exp_alerts:
    - exp_labels: { severity: warning, doi: sre-nen-tang, sec: SEC-36, namespace: data-pg }
      exp_annotations:
        summary: Thăm dò cổng ra của data-pg không chạy quá 1 giờ
        runbook_url: https://runbook.vt.local/okr/an-ninh-cong-ra
- interval: 1m
  input_series:
  - series: kube_daemonset_status_desired_number_scheduled{namespace="platform-privileged", daemonset="falco"}
    values: 6x40
  - series: kube_daemonset_status_number_ready{namespace="platform-privileged", daemonset="falco"}
    values: 6x10 5x30
  alert_rule_test:
  - eval_time: 10m
    alertname: FalcoNodeMissing
    exp_alerts: []
  - eval_time: 30m
    alertname: FalcoNodeMissing
    exp_alerts:
    - exp_labels: { severity: warning, doi: sre-nen-tang, sec: SEC-50, namespace: platform-privileged }
      exp_annotations:
        summary: 1 node chưa có Falco sẵn sàng
        runbook_url: https://runbook.vt.local/okr/runtime-security
- interval: 1m
  input_series:
  - series: falcosecurity_falcosidekick_outputs_total{destination="otlplogs", status="error"}
    values: 0x10 0+1x20
  alert_rule_test:
  - eval_time: 8m
    alertname: FalcosidekickDauRaLoi
    exp_alerts: []
  - eval_time: 25m
    alertname: FalcosidekickDauRaLoi
    exp_alerts:
    - exp_labels: { severity: critical, doi: soc, sec: SEC-50, destination: otlplogs }
      exp_annotations:
        summary: Falcosidekick không gửi được cảnh báo qua đầu ra otlplogs
        runbook_url: https://runbook.vt.local/okr/runtime-security
