{{- if .Values.falcosidekick.enabled }}
{{- $v := .Values }}
{{- $s := $v.falcosidekick }}
{{- $ns := $v.privilegedNamespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falcosidekick
  namespace: {{ $ns }}
  labels:
    {{- include "sec.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: falcosidekick
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: falcosidekick
    {{- include "sec.labels" . | nindent 4 }}
data:
  config.yaml: |
    # Falcosidekick (SEC-50): mọi cảnh báo từ mức {{ $v.falco.minimumPriority }} qua OTLP/HTTP có mTLS tới otel-siem, nơi
    # ghi Kafka sys.security.runtime.v1 rồi chuẩn hoá ECS sang sys.siem.v1. Mức Critical gửi thêm webhook trực SOC;
    # địa chỉ webhook lấy từ biến môi trường WEBHOOK_ADDRESS (Secret), không nằm trong ConfigMap.
    listenport: 2801
    debug: false
    customfields:
      cell: {{ $v.cell | quote }}
      nguon: falco
    otlp:
      logs:
        endpoint: {{ $s.otlp.endpoint | quote }}
        protocol: http/protobuf
        timeout: 10000
        checkcert: true
        minimumpriority: {{ $v.falco.minimumPriority }}
        extraenvvars:
          OTEL_EXPORTER_OTLP_LOGS_CERTIFICATE: /etc/falcosidekick/otlp/ca.crt
          OTEL_EXPORTER_OTLP_LOGS_CLIENT_CERTIFICATE: /etc/falcosidekick/otlp/tls.crt
          OTEL_EXPORTER_OTLP_LOGS_CLIENT_KEY: /etc/falcosidekick/otlp/tls.key
    {{- if $s.soc.enabled }}
    webhook:
      method: POST
      checkcert: true
      mutualtls: false
      minimumpriority: {{ $s.soc.minimumPriority }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falcosidekick
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: falcosidekick
    {{- include "sec.labels" . | nindent 4 }}
spec:
  replicas: {{ $s.replicas | int }}
  selector:
    matchLabels: { app.kubernetes.io/name: falcosidekick }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falcosidekick
        {{- include "sec.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ toJson $s | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: falcosidekick
      automountServiceAccountToken: false
      securityContext:
        {{- include "sec.restrictedPod" . | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: falcosidekick }
      containers:
        - name: falcosidekick
          image: {{ include "sec.image" (dict "root" . "name" "falcosidekick") }}
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/falcosidekick/config.yaml"]
          {{- if $s.soc.enabled }}
          env:
            - name: WEBHOOK_ADDRESS
              valueFrom:
                secretKeyRef: { name: {{ $s.soc.urlSecret.name }}, key: {{ $s.soc.urlSecret.key }} }
            # Ra ngoài cụm chỉ qua egress gateway (SEC-36); otel-siem trong cụm không đi qua proxy.
            - { name: HTTPS_PROXY, value: {{ $s.soc.httpsProxy | quote }} }
            - { name: NO_PROXY, value: ".svc,.svc.cluster.local,.cluster.local" }
          {{- end }}
          ports:
            - { name: http, containerPort: 2801 }
          resources:
            {{- toYaml $s.resources | nindent 12 }}
          securityContext:
            {{- include "sec.restrictedContainer" . | nindent 12 }}
          livenessProbe:
            httpGet: { path: /ping, port: http }
          readinessProbe:
            httpGet: { path: /ping, port: http }
          volumeMounts:
            - { name: config, mountPath: /etc/falcosidekick/config.yaml, subPath: config.yaml, readOnly: true }
            - { name: otlp-tls, mountPath: /etc/falcosidekick/otlp, readOnly: true }
      volumes:
        - name: config
          configMap: { name: falcosidekick }
        - name: otlp-tls
          secret: { secretName: {{ $s.otlp.tlsSecret }} }
---
# Chứng thư máy khách mTLS tới otel-siem (SEC-21, SEC-59), xoay vòng 90 ngày như các chứng thư nội bộ khác.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: falcosidekick-otlp
  namespace: {{ $ns }}
spec:
  secretName: {{ $s.otlp.tlsSecret }}
  commonName: falcosidekick.{{ $ns }}.svc
  dnsNames: [falcosidekick.{{ $ns }}.svc]
  usages: [client auth, digital signature, key encipherment]
  duration: 2160h
  renewBefore: 720h
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  issuerRef:
    {{- toYaml $s.otlp.issuerRef | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: falcosidekick
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: falcosidekick
spec:
  selector: { app.kubernetes.io/name: falcosidekick }
  ports:
    - { name: http, port: 2801 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: falcosidekick
  namespace: {{ $ns }}
spec:
  maxUnavailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: { app.kubernetes.io/name: falcosidekick }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: falcosidekick
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: falcosidekick }
  podMetricsEndpoints:
    - { port: http, path: /metrics, interval: 30s }
{{- end }}
