{{- if .Values.falco.enabled }}
{{- $v := .Values }}
{{- $f := $v.falco }}
{{- $ns := $v.privilegedNamespace }}
{{- $giamSat := concat $v.zones.app $v.zones.data $v.zones.secure $v.zones.edge }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: falco
  namespace: {{ $ns }}
  labels:
    {{- include "sec.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: falco
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: falco
    {{- include "sec.labels" . | nindent 4 }}
data:
  falco.yaml: |
    # Cấu hình Falco (SEC-50): eBPF hiện đại, đầu ra JSON tới Falcosidekick và stdout (Fluent Bit thu về Loki).
    # Không nạp /etc/falco/config.d của ảnh: plugin container khai tường minh bên dưới (tránh nạp hai lần).
    config_files: []
    engine:
      kind: {{ $f.driver }}
      modern_ebpf: { cpus_for_each_buffer: 2, buf_size_preset: 4, drop_failed_exit: false }
    # Plugin container (đi kèm ảnh Falco 0.41+) lấy siêu dữ liệu container và nhãn pod (k8s.ns.name, k8s.pod.name)
    # từ socket CRI của containerd trên node, không cần gọi Kubernetes API.
    load_plugins: [container]
    plugins:
      - name: container
        library_path: libcontainer.so
        init_config:
          label_max_len: 100
          with_size: false
          # engines để mặc định: plugin tự dò socket containerd, CRI dưới HOST_ROOT (/host/run/containerd).
    rules_files:
      - /etc/falco/falco_rules.yaml
      - /etc/falco/rules.d
    priority: {{ $f.minimumPriority }}
    json_output: true
    json_include_output_property: true
    json_include_tags_property: true
    buffered_outputs: false
    stdout_output: { enabled: true }
    syslog_output: { enabled: false }
    http_output:
      enabled: {{ $v.falcosidekick.enabled }}
      url: http://falcosidekick.{{ $ns }}.svc:2801/
      user_agent: falco
    webserver:
      enabled: true
      listen_port: 8765
      k8s_healthz_endpoint: /healthz
      prometheus_metrics_enabled: true
    metrics:
      enabled: true
      interval: 1m
      output_rule: false
      kernel_event_counters_enabled: true
      libbpf_stats_enabled: true
  vt-rules.yaml: |
    # Danh sách sinh từ values của chart security-cell (zones, falco.*).
    - list: vt_namespace_giam_sat
      items: {{ toJson $giamSat }}
    - list: vt_namespace_du_lieu
      items: {{ toJson $v.zones.data }}
    - list: vt_mang_noi_bo
      items: {{ toJson $f.internalNetworks }}
    - list: vt_doc_secret_hop_le
      items: {{ toJson $f.secretReaders }}
    - macro: vt_duong_dan_duoc_ghi
      condition: ({{ range $i, $p := $f.writablePrefixes }}{{ if $i }} or {{ end }}fd.name startswith {{ $p }}{{ end }})
    - macro: vt_duong_dan_du_lieu
      condition: ({{ range $i, $p := $f.dataWritablePrefixes }}{{ if $i }} or {{ end }}fd.name startswith {{ $p }}{{ end }})
    {{- $.Files.Get "files/falco/vt-rules.yaml" | nindent 4 }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: falco
    {{- include "sec.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: falco }
  updateStrategy:
    rollingUpdate: { maxUnavailable: 1 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco
        {{- include "sec.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ printf "%s%s" (toJson $f) ($.Files.Get "files/falco/vt-rules.yaml") | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: falco
      automountServiceAccountToken: false
      priorityClassName: system-node-critical
      # Chạy trên mọi node kể cả master và pool có taint (TL-04: "Falco ... chạy trên mọi node").
      tolerations:
        - { operator: Exists }
      containers:
        - name: falco
          image: {{ include "sec.image" (dict "root" . "name" "falco") }}
          imagePullPolicy: IfNotPresent
          args: ["/usr/bin/falco", "-c", "/etc/falco/falco.yaml"]
          env:
            - { name: HOST_ROOT, value: /host }
            - name: FALCO_HOSTNAME
              valueFrom: { fieldRef: { fieldPath: spec.nodeName } }
          ports:
            - { name: web, containerPort: 8765 }
          resources:
            {{- toYaml $f.resources | nindent 12 }}
          # Chế độ ít đặc quyền của trình điều khiển modern_ebpf: không privileged, chỉ các capability cần cho eBPF.
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsUser: 0
            appArmorProfile: { type: Unconfined }
            capabilities:
              drop: ["ALL"]
              add: [BPF, PERFMON, SYS_RESOURCE, SYS_PTRACE]
          livenessProbe:
            httpGet: { path: /healthz, port: web }
            initialDelaySeconds: 60
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: web }
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - { name: config, mountPath: /etc/falco/falco.yaml, subPath: falco.yaml, readOnly: true }
            - { name: config, mountPath: /etc/falco/rules.d/vt-rules.yaml, subPath: vt-rules.yaml, readOnly: true }
            - { name: proc, mountPath: /host/proc, readOnly: true }
            - { name: etc, mountPath: /host/etc, readOnly: true }
            - { name: containerd, mountPath: /host/run/containerd, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: config
          configMap: { name: falco }
        - name: proc
          hostPath: { path: /proc }
        - name: etc
          hostPath: { path: /etc }
        - name: containerd
          hostPath: { path: /run/containerd }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: falco-metrics
  namespace: {{ $ns }}
  labels:
    app.kubernetes.io/name: falco
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: falco }
  ports:
    - { name: web, port: 8765 }
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: falco
  namespace: {{ $ns }}
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: falco }
  podMetricsEndpoints:
    - { port: web, path: /metrics, interval: 30s }
{{- end }}
