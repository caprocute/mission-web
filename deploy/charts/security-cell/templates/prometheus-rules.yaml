{{- /* Mỗi tệp rules/*.yaml (định dạng nhóm luật Prometheus, kiểm bằng promtool) thành một PrometheusRule. */ -}}
{{- if .Values.alerts.enabled }}
{{- range $p, $_ := .Files.Glob "rules/*.yaml" }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vt-{{ base $p | trimSuffix ".yaml" }}
  namespace: observability
  labels: { app.kubernetes.io/part-of: vt-security }
spec:
  {{- $.Files.Get $p | fromYaml | toYaml | nindent 2 }}
{{- end }}
{{- end }}
