{{- if .Values.pushgateway.enabled }}
{{- $v := .Values }}
# Pushgateway của cell (observability): nhận chỉ số của Job ngắn (kube-bench, thăm dò cổng ra, xoay khoá OpenBao).
# Không lưu đĩa: mất pod thì mất chỉ số tới lần chạy sau, cảnh báo *Stale phát hiện điều đó.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pushgateway
  namespace: observability
  labels:
    app.kubernetes.io/name: pushgateway
    {{- include "sec.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: pushgateway }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pushgateway
        vt.io/needs-k8s-api: "false"
        {{- include "sec.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "sec.restrictedPod" . | nindent 8 }}
      containers:
        - name: pushgateway
          image: {{ include "sec.image" (dict "root" . "name" "pushgateway") }}
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 9091 }
          resources:
            {{- toYaml $v.pushgateway.resources | nindent 12 }}
          securityContext:
            {{- include "sec.restrictedContainer" . | nindent 12 }}
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
---
apiVersion: v1
kind: Service
metadata:
  name: pushgateway
  namespace: observability
  labels:
    app.kubernetes.io/name: pushgateway
spec:
  selector: { app.kubernetes.io/name: pushgateway }
  ports:
    - { name: http, port: 9091 }
---
# honorLabels giữ nhãn node, namespace, target do Job đẩy lên (grouping key).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: pushgateway
  namespace: observability
spec:
  selector:
    matchLabels: { app.kubernetes.io/name: pushgateway }
  endpoints:
    - { port: http, interval: 30s, honorLabels: true }
---
# Job ngắn ở các namespace khác được đẩy chỉ số vào Pushgateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pushgateway-ingress
  namespace: observability
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: pushgateway }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - { key: app.kubernetes.io/name, operator: In, values: [egress-probe, kube-bench, openbao-xoay-khoa] }
      ports:
        - { protocol: TCP, port: 9091 }
{{- end }}
