{{- /*
NetworkPolicy cho waypoint (cell-base mặc định từ chối mọi chiều). Ở chế độ ambient, lưu lượng mesh tới pod đích
đi trên cổng HBONE 15008 (Istio "Ambient and Kubernetes NetworkPolicy"): người gọi → waypoint:15008 → pod:15008.
*/}}
{{- range $ns, $w := .Values.waypoints }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $w.name }}
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels: { gateway.networking.k8s.io/gateway-name: {{ $w.name }} }
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - { key: kubernetes.io/metadata.name, operator: In, values: {{ toJson $.Values.meshNamespaces }} }
      ports:
        - { protocol: TCP, port: 15008 }
    # Số liệu Envoy của waypoint cho Prometheus (INF-14).
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: observability } }
          podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
      ports:
        - { protocol: TCP, port: 15020 }
  egress:
    # Cấu hình xDS và chứng thư từ istiod.
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: istio-system } }
          podSelector: { matchLabels: { app: istiod } }
      ports:
        - { protocol: TCP, port: 15012 }
    # Chuyển tiếp tới pod đích trong cùng namespace qua HBONE.
    - to:
        - podSelector: {}
      ports:
        - { protocol: TCP, port: 15008 }
---
# Pod trong {{ $ns }} nhận lưu lượng mesh từ waypoint của namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tu-{{ $w.name }}
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels: { gateway.networking.k8s.io/gateway-name: {{ $w.name }} }
      ports:
        - { protocol: TCP, port: 15008 }
{{- end }}
