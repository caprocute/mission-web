# Quyền hẹp nhất: chỉ get, list, patch ApisixPluginConfig ở namespace cổng và ScaledObject ở namespace tác
# vụ nền được khai; không create, không delete, không ClusterRole.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: degrade-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "degrade-controller.labels" . | nindent 4 }}
{{- range .Values.gatewayNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: degrade-controller-gateway
  namespace: {{ . }}
  labels:
    {{- include "degrade-controller.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["apisix.apache.org"]
    resources: ["apisixpluginconfigs"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: degrade-controller-gateway
  namespace: {{ . }}
  labels:
    {{- include "degrade-controller.labels" $ | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: degrade-controller-gateway }
subjects:
  - { kind: ServiceAccount, name: degrade-controller, namespace: {{ $.Release.Namespace }} }
{{- end }}
{{- range .Values.jobNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: degrade-controller-jobs
  namespace: {{ . }}
  labels:
    {{- include "degrade-controller.labels" $ | nindent 4 }}
rules:
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: degrade-controller-jobs
  namespace: {{ . }}
  labels:
    {{- include "degrade-controller.labels" $ | nindent 4 }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: degrade-controller-jobs }
subjects:
  - { kind: ServiceAccount, name: degrade-controller, namespace: {{ $.Release.Namespace }} }
{{- end }}
