{{- /* INF-25: token webhook của bộ điều khiển, cùng khoá OpenBao với Alertmanager của cell (observability-cell). */ -}}
{{- $v := .Values }}
{{- $e := $v.webhookToken.externalSecret }}
{{- if $e.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $v.webhookToken.secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "degrade-controller.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $e.refreshInterval }}
  secretStoreRef:
    kind: {{ $e.secretStore.kind }}
    name: {{ $e.secretStore.name }}
  target:
    name: {{ $v.webhookToken.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $v.webhookToken.key }}
      remoteRef:
        key: {{ $e.path | default (printf "kv/cell-%s/edge/degrade-webhook" (required "cell là bắt buộc" $v.cell)) }}
        property: {{ $e.property }}
{{- end }}
