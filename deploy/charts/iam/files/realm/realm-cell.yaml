# Mẫu realm Keycloak production theo cell (DV-02-01).
# Truy vết: QT-00 → SCR-0001 → OIDC /realms/<realm>/protocol/openid-connect/* → SVC-02 iam (Keycloak 26) → schema `iam`.
# ADR-08: một realm mỗi cell, mỗi tenant là một Organization (Organizations của Keycloak 26).
# Nạp bằng keycloak-config-cli (TL-04 SEC-13..SEC-17, SEC-54: cấu hình từ kho GitOps, không chỉnh tay),
# bật import.var-substitution.enabled=true; các biến MISSION_* do Job Helm truyền vào từ values và Secret.
# Không có mật khẩu, client secret hay khoá ký thật trong tệp này.
#
# Lớp mở rộng của các task khác đặt lên trên mẫu này, không sửa phần đã chốt ở đây:
#   DV-02-02 mapper claim ngữ cảnh; DV-02-03 MFA, step-up, luồng đăng nhập; DV-02-04 VNeID;
#   DV-02-05 event listener Kafka; DV-02-06 đồng bộ người dùng; WEB-020 theme đăng nhập.
realm: $(env:MISSION_REALM)
enabled: true
displayName: $(env:MISSION_REALM_DISPLAY_NAME)
attributes:
  mission.cell: $(env:MISSION_CELL)
  # DV-02-03: bậc xác thực (LoA) ↔ claim acr. Bậc 1 mật khẩu hoặc IdP, bậc 2 SmartOTP (TOTP) hoặc WebAuthn.
  acr.loa.map: '{"aal1":1,"aal2":2}'

# ADR-08: tenant là Organization; tenant-registry tạo Organization khi khởi tạo tenant (không khai trong mẫu).
organizationsEnabled: true

# Không cho tự đăng ký; tài khoản đến từ đồng bộ nhân sự (DV-02-06) hoặc IdP liên kết.
registrationAllowed: false
registrationEmailAsUsername: false
# SCR-0001 "Ghi nhớ thiết bị 30 ngày" không áp dụng cho vai trò AAL2: chờ luồng đăng nhập của DV-02-03.
rememberMe: false
resetPasswordAllowed: false
editUsernameAllowed: false
loginWithEmailAllowed: true
duplicateEmailsAllowed: false
verifyEmail: false
sslRequired: $(env:MISSION_SSL_REQUIRED)

internationalizationEnabled: true
supportedLocales:
  - vi
  - en
defaultLocale: vi
# Văn bản trang đăng nhập theo bảng MSG của QT-00 (TL-02a). Thông điệp Keycloak không có tham số
# số lần thử còn lại ({n}) hay giờ mở khoá ({giờ}); hai phần đó do theme của WEB-020 bổ sung.
localizationTexts:
  vi:
    # MSG-00-01
    invalidUserMessage: Tên đăng nhập hoặc mật khẩu không đúng.
    # MSG-00-02 (khoá tạm)
    accountTemporarilyDisabledMessage: Tài khoản tạm khoá do đăng nhập sai nhiều lần.
    # Khoá cố định sau 20 lần sai trong 24 giờ (TL-04 SEC-14): chỉ quản trị mở khoá.
    accountPermanentlyDisabledMessage: Tài khoản đã bị khoá do đăng nhập sai nhiều lần. Đồng chí liên hệ quản trị đơn vị để được mở khoá.
    # DV-02-04 · MSG-00-03 (VNeID mức 1, BR-00-03)
    vneidLevelMessage: Tài khoản VNeID của đồng chí chưa ở mức 2. Vui lòng nâng mức tài khoản hoặc dùng tài khoản cơ quan.
    # DV-02-04 · MSG-00-04 (VNeID quá thời gian, lỗi hoặc bộ ngắt mạch đang mở)
    vneidUnavailableMessage: Dịch vụ VNeID đang gián đoạn. Đồng chí có thể đăng nhập bằng tài khoản cơ quan.
    # DV-02-04 · TL-02a QT-00: không khớp hồ sơ thì không tự tạo tài khoản, hướng tới quản trị tenant (chưa có mã MSG)
    vneidNotLinkedMessage: Chưa tìm thấy hồ sơ cán bộ khớp với tài khoản VNeID của đồng chí. Đồng chí liên hệ quản trị đơn vị để được liên kết tài khoản.
    # DV-02-04 · BR-00-04: liên kết trùng bị từ chối, chuyển quản trị tenant xử lý (chưa có mã MSG)
    vneidAlreadyLinkedMessage: Hồ sơ cán bộ hoặc tài khoản VNeID này đã được liên kết với một danh tính khác. Đồng chí liên hệ quản trị đơn vị để được xử lý.

# ---------------------------------------------------------------------------
# Token và phiên (TL-04 SEC-16; TL-01 SVC-02; TL-02a QT-00). Xem điểm lệch ở wiki/14.
#   access token: MISSION_ACCESS_TOKEN_LIFESPAN (mặc định 300 s, TL-04)
#   phiên SSO nhàn rỗi 30 phút, tối đa 10 giờ (TL-01)
#   refresh token: trượt theo thời gian nhàn rỗi của phiên client, tối đa MISSION_CLIENT_SESSION_MAX (8 giờ, TL-04)
# ---------------------------------------------------------------------------
defaultSignatureAlgorithm: ES256
accessTokenLifespan: $(env:MISSION_ACCESS_TOKEN_LIFESPAN)
accessTokenLifespanForImplicitFlow: $(env:MISSION_ACCESS_TOKEN_LIFESPAN)
ssoSessionIdleTimeout: $(env:MISSION_SSO_IDLE)
ssoSessionMaxLifespan: $(env:MISSION_SSO_MAX)
clientSessionIdleTimeout: $(env:MISSION_CLIENT_SESSION_IDLE)
clientSessionMaxLifespan: $(env:MISSION_CLIENT_SESSION_MAX)
# Phiên offline (nếu client nào xin offline_access) cũng bị giới hạn như phiên SSO: nhàn rỗi 30 phút, tối đa 10 giờ.
offlineSessionMaxLifespanEnabled: true
offlineSessionIdleTimeout: $(env:MISSION_SSO_IDLE)
offlineSessionMaxLifespan: $(env:MISSION_SSO_MAX)
# Refresh token xoay vòng, dùng một lần; dùng lại bị từ chối (TL-01 D5).
revokeRefreshToken: true
refreshTokenMaxReuse: 0
accessCodeLifespan: 60
accessCodeLifespanLogin: 1800
accessCodeLifespanUserAction: 300

# ---------------------------------------------------------------------------
# Chống dò mật khẩu (BR-00-05; TL-04 SEC-14).
#   failureFactor 5, khoá tạm MISSION_BF_WAIT giây (900 = 15 phút);
#   khoá cố định khi số lần khoá tạm vượt MISSION_BF_MAX_TEMP_LOCKOUTS. Keycloak 26 tính một lần khoá tạm
#   cho mỗi lần sai từ lần thứ 5 trở đi, nên 15 tương ứng khoá cố định ở lần sai thứ 20.
#   maxDeltaTimeSeconds là khoảng lặng xoá bộ đếm: 86400 để bộ đếm giữ trong 24 giờ (xem wiki/14).
# ---------------------------------------------------------------------------
bruteForceProtected: true
bruteForceStrategy: MULTIPLE
failureFactor: $(env:MISSION_BF_FAILURE_FACTOR)
waitIncrementSeconds: $(env:MISSION_BF_WAIT)
maxFailureWaitSeconds: $(env:MISSION_BF_WAIT)
maxDeltaTimeSeconds: $(env:MISSION_BF_MAX_DELTA)
permanentLockout: true
maxTemporaryLockouts: $(env:MISSION_BF_MAX_TEMP_LOCKOUTS)
quickLoginCheckMilliSeconds: 1000
minimumQuickLoginWaitSeconds: 60

# ---------------------------------------------------------------------------
# Chính sách mật khẩu (TL-04 SEC-15: Argon2id; NFR-08 ASVS).
#   ASVS 2.1.1 dài tối thiểu 12, 2.1.2 cho phép tới 128; 2.1.9 không áp quy tắc thành phần ký tự;
#   cấm trùng tên đăng nhập, thư điện tử; cấm dùng lại 5 mật khẩu gần nhất (suy luận theo NFR-08).
#   Keycloak băm lại theo hashAlgorithm của chính sách ở lần đăng nhập thành công kế tiếp,
#   nên mật khẩu mang thuật toán cũ được băm lại bằng Argon2id ở lần đăng nhập đầu.
#   Danh sách mật khẩu đã lộ (passwordBlacklist) cần tệp trong ảnh Keycloak: chờ task INF dựng ảnh.
# ---------------------------------------------------------------------------
passwordPolicy: "hashAlgorithm(argon2) and length(12) and maxLength(128) and notUsername(undefined) and notEmail(undefined) and passwordHistory(5)"

# Sự kiện xác thực cho DV-02-05 (đẩy lên topic iam.auth.event.v1) và SOC.
eventsEnabled: true
eventsExpiration: 2592000
eventsListeners:
  - jboss-logging
enabledEventTypes:
  - LOGIN
  - LOGIN_ERROR
  - LOGOUT
  - LOGOUT_ERROR
  - CODE_TO_TOKEN
  - CODE_TO_TOKEN_ERROR
  - REFRESH_TOKEN
  - REFRESH_TOKEN_ERROR
  - USER_DISABLED_BY_TEMPORARY_LOCKOUT
  - USER_DISABLED_BY_PERMANENT_LOCKOUT
  - UPDATE_PASSWORD
  - UPDATE_PASSWORD_ERROR
  - UPDATE_TOTP
  - REMOVE_TOTP
  - UPDATE_CREDENTIAL
  - REMOVE_CREDENTIAL
  - IDENTITY_PROVIDER_LOGIN
  - IDENTITY_PROVIDER_LOGIN_ERROR
  - IDENTITY_PROVIDER_LINK_ACCOUNT
  # DV-02-04: kiểm toán liên kết danh tính VNeID (từ chối mức 1, không khớp, liên kết trùng BR-00-04).
  - IDENTITY_PROVIDER_LINK_ACCOUNT_ERROR
  - FEDERATED_IDENTITY_LINK
  - FEDERATED_IDENTITY_LINK_ERROR
adminEventsEnabled: true
adminEventsDetailsEnabled: false

# ---------------------------------------------------------------------------
# DV-02-03 · QT-00 bước 3–5 · Luồng đăng nhập trình duyệt theo bậc xác thực (LoA), BR-00-01, BR-00-06, TL-04 S06.
#   mission-forms (thay "forms" dựng sẵn, không có nhánh "chỉ hỏi OTP khi người dùng đã cài"):
#     1. mission-aal1 (điều kiện bậc 1): tên đăng nhập và mật khẩu;
#     2. mission-mfa-policy: nâng yêu cầu lên bậc 2 khi vai trò yêu cầu AAL2, tenant bật MFA cho mọi người
#        (thuộc tính Organization mission.mfa_all_users), hoặc thiết bị, vị trí mới, điểm rủi ro vượt ngưỡng;
#     3. mission-aal2 (điều kiện bậc 2, hiệu lực MISSION_AAL2_MAX_AGE giây = 15 phút của BR-00-02 và trạng thái
#        phiên TL-02a): SmartOTP hoặc WebAuthn; người chưa cài phải cài ngay (không bỏ qua được);
#     4. mission-device-remember: ghi thiết bị, vị trí đã biết sau khi mọi bước đạt.
#   Client xin bước lên bằng acr_values=aal2 (hoặc claims acr essential) và max_age; token mang acr, auth_time.
#   Đăng nhập VNeID mức 2 đi luồng first broker login của DV-02-04 và được coi là đạt bậc 2 (TL-04).
# ---------------------------------------------------------------------------
browserFlow: mission-browser
otpPolicyType: totp
otpPolicyAlgorithm: HmacSHA1
otpPolicyDigits: 6
otpPolicyPeriod: 30
# Chấp nhận thêm một chu kỳ liền kề: mã hết hạn sau khoảng 60 giây (QT-00 bước 5).
otpPolicyLookAheadWindow: 1
otpPolicyCodeReusable: false
authenticatorConfig:
  - alias: mission-aal1-loa
    config:
      loa-condition-level: "1"
      loa-max-age: "$(env:MISSION_SSO_MAX)"
  - alias: mission-aal2-loa
    config:
      loa-condition-level: "2"
      loa-max-age: "$(env:MISSION_AAL2_MAX_AGE)"
  - alias: mission-mfa-policy
    config:
      roles: "$(env:MISSION_MFA_ROLES)"
      weightNewDevice: "$(env:MISSION_MFA_WEIGHT_NEW_DEVICE)"
      weightNewNetwork: "$(env:MISSION_MFA_WEIGHT_NEW_NETWORK)"
      weightFailures: "$(env:MISSION_MFA_WEIGHT_FAILURES)"
      threshold: "$(env:MISSION_MFA_RISK_THRESHOLD)"
authenticationFlows:
  - alias: mission-browser
    description: Đăng nhập trình duyệt theo bậc xác thực (DV-02-03)
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: auth-cookie
        requirement: ALTERNATIVE
        priority: 10
        authenticatorFlow: false
      - authenticator: identity-provider-redirector
        requirement: ALTERNATIVE
        priority: 20
        authenticatorFlow: false
      - flowAlias: mission-organization
        requirement: ALTERNATIVE
        priority: 30
        authenticatorFlow: true
      - flowAlias: mission-forms
        requirement: ALTERNATIVE
        priority: 40
        authenticatorFlow: true
  - alias: mission-organization
    description: Đăng nhập hai bước theo Organization (tenant) như luồng dựng sẵn của Keycloak 26
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - flowAlias: mission-organization-conditional
        requirement: CONDITIONAL
        priority: 10
        authenticatorFlow: true
  - alias: mission-organization-conditional
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-configured
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - authenticator: organization
        requirement: ALTERNATIVE
        priority: 20
        authenticatorFlow: false
  - alias: mission-forms
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - flowAlias: mission-aal1
        requirement: CONDITIONAL
        priority: 10
        authenticatorFlow: true
      - authenticator: mission-mfa-policy
        authenticatorConfig: mission-mfa-policy
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
      - flowAlias: mission-aal2
        requirement: CONDITIONAL
        priority: 30
        authenticatorFlow: true
      - authenticator: mission-device-remember
        requirement: REQUIRED
        priority: 40
        authenticatorFlow: false
  - alias: mission-aal1
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-level-of-authentication
        authenticatorConfig: mission-aal1-loa
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - authenticator: auth-username-password-form
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
  - alias: mission-aal2
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-level-of-authentication
        authenticatorConfig: mission-aal2-loa
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - flowAlias: mission-aal2-methods
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: true
  # Người đã cài yếu tố thứ hai chọn SmartOTP hoặc WebAuthn; người chưa cài phải cài SmartOTP ngay
  # (required action CONFIGURE_TOTP, xác minh bằng một mã đúng trước khi phát token).
  - alias: mission-aal2-methods
    description: SmartOTP hoặc khoá FIDO2/WebAuthn (QT-00 bước 5)
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - flowAlias: mission-aal2-existing
        requirement: CONDITIONAL
        priority: 10
        authenticatorFlow: true
      - flowAlias: mission-aal2-enroll
        requirement: CONDITIONAL
        priority: 20
        authenticatorFlow: true
  - alias: mission-aal2-existing
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: conditional-user-configured
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - authenticator: auth-otp-form
        requirement: ALTERNATIVE
        priority: 20
        authenticatorFlow: false
      - authenticator: webauthn-authenticator
        requirement: ALTERNATIVE
        priority: 30
        authenticatorFlow: false
      # DV-02-08: "Phương thức khác" khi mất SmartOTP, chỉ hiện khi có mã khôi phục còn hạn do quản trị cấp.
      - authenticator: mission-recovery-code
        requirement: ALTERNATIVE
        priority: 40
        authenticatorFlow: false
  - alias: mission-aal2-enroll
    providerId: basic-flow
    topLevel: false
    builtIn: false
    authenticationExecutions:
      - authenticator: mission-condition-no-second-factor
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
      - authenticator: auth-otp-form
        requirement: REQUIRED
        priority: 20
        authenticatorFlow: false
  # DV-02-04 · QT-00 bước 3: luồng sau môi giới VNeID. Nhà cung cấp mission-vneid đã kiểm mức tài khoản, khớp người
  # qua org-service và chặn liên kết trùng; bước mission-vneid-link chỉ gắn danh tính vào người đã khớp (không có bước
  # tạo tài khoản) và đặt bậc xác thực 2 (VNeID mức 2 coi như đạt MFA, TL-04).
  - alias: mission-vneid-first-login
    description: Đăng nhập VNeID lần đầu, gắn vào người đã có (DV-02-04)
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: mission-vneid-link
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false
  - alias: mission-vneid-post-login
    description: Đăng nhập VNeID đã liên kết, đặt bậc xác thực 2 (DV-02-04)
    providerId: basic-flow
    topLevel: true
    builtIn: false
    authenticationExecutions:
      - authenticator: mission-vneid-link
        requirement: REQUIRED
        priority: 10
        authenticatorFlow: false

# ---------------------------------------------------------------------------
# DV-02-04 · VNeID qua môi giới danh tính (TL-01 bảng bộ kết nối: OIDC Authorization Code + PKCE, state, nonce; L03).
#   Keycloak tự kiểm state (chống CSRF) và nonce trong id_token; PKCE S256 bật ở cấu hình. Không lưu token VNeID
#   (storeToken false), không nhập hồ sơ ghi đè (syncMode IMPORT), không tin thư điện tử.
#   Tên claim mức tài khoản và số định danh chưa có tài liệu chính thức (suy luận, wiki/14): để biến.
#   client secret VNeID lấy từ OpenBao qua Secret của Job; khoá liên kết HMAC và tài khoản dịch vụ gọi org-service
#   nằm trong Secret của pod Keycloak (MISSION_VNEID_LINK_KEY, MISSION_IAM_BROKER_CLIENT_SECRET), không trong mẫu.
#   Tenant để so khớp lấy từ tham số tenant_id của yêu cầu xác thực (ứng dụng gửi sau resolveTenantCell).
# ---------------------------------------------------------------------------
identityProviders:
  - alias: vneid
    providerId: mission-vneid
    displayName: VNeID
    enabled: $(env:MISSION_VNEID_ENABLED)
    trustEmail: false
    storeToken: false
    addReadTokenRoleOnCreate: false
    linkOnly: false
    hideOnLogin: false
    firstBrokerLoginFlowAlias: mission-vneid-first-login
    postBrokerLoginFlowAlias: mission-vneid-post-login
    config:
      issuer: $(env:MISSION_VNEID_ISSUER)
      authorizationUrl: $(env:MISSION_VNEID_AUTHORIZATION_URL)
      tokenUrl: $(env:MISSION_VNEID_TOKEN_URL)
      jwksUrl: $(env:MISSION_VNEID_JWKS_URL)
      useJwksUrl: "true"
      validateSignature: "true"
      clientId: $(env:MISSION_VNEID_CLIENT_ID)
      clientSecret: $(env:MISSION_VNEID_CLIENT_SECRET)
      clientAuthMethod: $(env:MISSION_VNEID_CLIENT_AUTH_METHOD)
      pkceEnabled: "true"
      pkceMethod: S256
      defaultScope: $(env:MISSION_VNEID_SCOPE)
      disableUserInfo: "true"
      disableNonce: "false"
      syncMode: IMPORT
      backchannelSupported: "false"
      missionLevelClaim: $(env:MISSION_VNEID_LEVEL_CLAIM)
      missionNationalIdClaim: $(env:MISSION_VNEID_NATIONAL_ID_CLAIM)
      missionRequiredLevel: "2"
      missionTenantParam: tenant_id
      # QT-00: ngắt sau 10 giây; mở mạch sau 5 lần lỗi liên tiếp trong 30 giây.
      missionTimeoutMillis: "10000"
      missionBreakerFailures: $(env:MISSION_VNEID_BREAKER_FAILURES)
      missionBreakerOpenSeconds: $(env:MISSION_VNEID_BREAKER_OPEN_SECONDS)

# Khoá ký ES256 (P-256). Khoá sinh trong Keycloak của cell, xoay vòng bằng cách thêm khoá ưu tiên cao hơn.
components:
  org.keycloak.keys.KeyProvider:
    - name: mission-es256
      providerId: ecdsa-generated
      config:
        priority:
          - "$(env:MISSION_SIGNING_KEY_PRIORITY)"
        ecdsaEllipticCurveKey:
          - P-256
        active:
          - "true"
        enabled:
          - "true"

# ---------------------------------------------------------------------------
# Vai trò realm: đúng tập vai trò của docs/phan-quyen/ma-tran.json (AC-01..AC-10, AC-12;
# AC-11 là client credentials, không phải realm role), cộng vai trò con wf_template_author của AC-01 (BS-01).
# Không có composite role. Mô tả bắt đầu bằng mã AC để đối chiếu tự động.
# ---------------------------------------------------------------------------
roles:
  realm:
    - name: platform_admin
      description: AC-01 Quản trị nền tảng (Viettel)
    - name: wf_template_author
      description: AC-01 Vai trò con soạn mẫu luồng duyệt (BS-01, SCR-1505)
    - name: tenant_admin
      description: AC-02 Quản trị tenant
    - name: policy_author
      description: AC-03 Quản trị nghiệp vụ, BA cấu hình
    - name: leader
      description: AC-04 Lãnh đạo, người đứng đầu
    - name: manager
      description: AC-05 Cán bộ quản lý trực tiếp
    - name: member
      description: AC-06 Cán bộ, công chức, viên chức, đảng viên
    - name: appraiser
      description: AC-07 Cơ quan tổ chức cán bộ (thẩm định)
    - name: decider
      description: AC-08 Cấp có thẩm quyền quyết định
    - name: second_approver
      description: AC-09 Người duyệt thứ hai (four-eyes)
    - name: inspector
      description: AC-10 Cơ quan kiểm tra, giám sát
    - name: ai_readonly
      description: AC-12 Trợ lý AI (chỉ đọc)
    # Vai trò dịch vụ (không thuộc ma trận AC, không gán cho người): tài khoản dịch vụ môi giới VNeID gọi
    # cổng nội bộ tra người theo số định danh của org-service (DV-02-04).
    - name: svc_iam
      description: Dịch vụ môi giới danh tính của Keycloak gọi cổng nội bộ org-service

# ---------------------------------------------------------------------------
# DV-02-02 · QT-00 bước 7: client scope mang claim ngữ cảnh (tenant_id, tenant, cell, unit_id,
# active_assignment_id, flows, roles, org) do SPI mission-context-mapper (provider mission-keycloak-events)
# đọc từ thuộc tính người dùng mission_context_* mà org-service ghi qua PUT /org/me/context.
# Mapper chỉ đọc thuộc tính người dùng và realm, không đọc tham số hay header của client.
# ---------------------------------------------------------------------------
clientScopes:
  - name: mission-context
    description: Ngữ cảnh làm việc (tenant, đơn vị, phân công, luồng đánh giá)
    protocol: openid-connect
    attributes:
      include.in.token.scope: "false"
      display.on.consent.screen: "false"
    protocolMappers:
      - name: mission-context
        protocol: openid-connect
        protocolMapper: mission-context-mapper
        consentRequired: false
        config:
          access.token.claim: "true"
          id.token.claim: "true"
          userinfo.token.claim: "true"

# ---------------------------------------------------------------------------
# Client OIDC (SEC-17): Authorization Code + PKCE S256 bắt buộc; không implicit, không direct grant.
# state và nonce do thư viện OIDC của ứng dụng sinh và kiểm (angular-oauth2-oidc, AppAuth trên di động).
# ---------------------------------------------------------------------------
clients:
  - clientId: mission-web
    name: Phân hệ web Mission (SVC-17)
    protocol: openid-connect
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    frontchannelLogout: true
    fullScopeAllowed: true
    redirectUris: $(env:MISSION_WEB_REDIRECT_URIS)
    webOrigins: $(env:MISSION_WEB_ORIGINS)
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: $(env:MISSION_WEB_POST_LOGOUT_URIS)
      id.token.signed.response.alg: ES256
      access.token.signed.response.alg: ES256
      oauth2.device.authorization.grant.enabled: "false"
      oidc.ciba.grant.enabled: "false"
      use.refresh.tokens: "true"
      client_credentials.use_refresh_token: "false"
    defaultClientScopes:
      - basic
      - profile
      - email
      - roles
      - web-origins
      - acr
      - mission-context
    optionalClientScopes:
      - organization

  - clientId: mission-mobile
    name: Ứng dụng di động Mission
    protocol: openid-connect
    enabled: true
    publicClient: true
    standardFlowEnabled: true
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    fullScopeAllowed: true
    redirectUris: $(env:MISSION_MOBILE_REDIRECT_URIS)
    webOrigins: []
    attributes:
      pkce.code.challenge.method: S256
      post.logout.redirect.uris: $(env:MISSION_MOBILE_POST_LOGOUT_URIS)
      id.token.signed.response.alg: ES256
      access.token.signed.response.alg: ES256
      oauth2.device.authorization.grant.enabled: "false"
      oidc.ciba.grant.enabled: "false"
      use.refresh.tokens: "true"
    defaultClientScopes:
      - basic
      - profile
      - email
      - roles
      - web-origins
      - acr
      - mission-context
    optionalClientScopes:
      - organization

  # DV-02-04: tài khoản dịch vụ của chính Keycloak gọi org-service khi liên kết VNeID (client credentials).
  - clientId: mission-iam-broker
    name: Môi giới danh tính VNeID gọi org-service (SVC-02)
    protocol: openid-connect
    enabled: true
    publicClient: false
    clientAuthenticatorType: client-secret
    secret: $(env:MISSION_IAM_BROKER_CLIENT_SECRET)
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: true
    # Token chỉ mang svc_iam: tài khoản dịch vụ không có vai trò nào khác.
    fullScopeAllowed: true
    redirectUris: []
    webOrigins: []
    attributes:
      oauth2.device.authorization.grant.enabled: "false"
      oidc.ciba.grant.enabled: "false"
      access.token.signed.response.alg: ES256
    defaultClientScopes:
      - roles

  # Cổng APISIX (SVC-01) chỉ kiểm token (introspection, JWKS); không phát token cho người dùng.
  - clientId: apisix-gateway
    name: Cổng API (SVC-01), chỉ kiểm token
    protocol: openid-connect
    enabled: true
    publicClient: false
    bearerOnly: false
    clientAuthenticatorType: client-secret
    secret: $(env:MISSION_APISIX_CLIENT_SECRET)
    standardFlowEnabled: false
    implicitFlowEnabled: false
    directAccessGrantsEnabled: false
    serviceAccountsEnabled: false
    fullScopeAllowed: false
    redirectUris: []
    webOrigins: []
    attributes:
      oauth2.device.authorization.grant.enabled: "false"
      oidc.ciba.grant.enabled: "false"

# DV-02-04: vai trò của tài khoản dịch vụ mission-iam-broker (không phải tài khoản người, không có mật khẩu).
users:
  - username: service-account-mission-iam-broker
    enabled: true
    serviceAccountClientId: mission-iam-broker
    realmRoles:
      - svc_iam
