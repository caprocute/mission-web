{{- if .Values.networkPolicy.enabled }}
# Pod nạp realm không nhận kết nối vào; chỉ ra tới Keycloak và DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "iam.fullname" . }}-realm-import
  labels:
    {{- include "iam.labels" . | nindent 4 }}
    app.kubernetes.io/component: realm-import
spec:
  podSelector:
    matchLabels:
      {{- include "iam.realmImport.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.networkPolicy.keycloakPodLabels | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.keycloakPort }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
