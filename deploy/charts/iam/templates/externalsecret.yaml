{{- if .Values.externalSecret.enabled }}
# Bí mật của Job nạp realm, đồng bộ từ OpenBao (SEC-10, SEC-11); repo không chứa giá trị.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  namespace: {{ include "iam.namespace" . }}
  labels:
    {{- include "iam.labels" . | nindent 4 }}
    app.kubernetes.io/component: realm-import
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecret.secretStoreRef.kind }}
    name: {{ .Values.externalSecret.secretStoreRef.name }}
  target:
    name: {{ .Values.secrets.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.secrets.keys.configCliClientSecret }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteRefs.configCliClientSecret.key }}
        property: {{ .Values.externalSecret.remoteRefs.configCliClientSecret.property }}
    - secretKey: {{ .Values.secrets.keys.apisixClientSecret }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteRefs.apisixClientSecret.key }}
        property: {{ .Values.externalSecret.remoteRefs.apisixClientSecret.property }}
    - secretKey: {{ .Values.secrets.keys.vneidClientSecret }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteRefs.vneidClientSecret.key }}
        property: {{ .Values.externalSecret.remoteRefs.vneidClientSecret.property }}
    - secretKey: {{ .Values.secrets.keys.iamBrokerClientSecret }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteRefs.iamBrokerClientSecret.key }}
        property: {{ .Values.externalSecret.remoteRefs.iamBrokerClientSecret.property }}
    - secretKey: {{ .Values.secrets.keys.orgServiceClientSecret }}
      remoteRef:
        key: {{ .Values.externalSecret.remoteRefs.orgServiceClientSecret.key }}
        property: {{ .Values.externalSecret.remoteRefs.orgServiceClientSecret.property }}
{{- end }}
