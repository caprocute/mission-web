{{- $v := .Values }}
{{- if and $v.routingCookie.enabled $v.routingCookie.externalSecret.enabled }}
# Khoá HMAC cookie định tuyến dùng chung với SVC-03 và APISIX lớp ngoài (DV-01-04); bí mật chỉ nằm trong OpenBao.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $v.routingCookie.secretName }}
  namespace: edge
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $v.routingCookie.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ $v.routingCookie.externalSecret.storeKind }}
    name: {{ $v.routingCookie.externalSecret.storeName }}
  target:
    name: {{ $v.routingCookie.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $v.routingCookie.keyCurrent }}
      remoteRef: { key: {{ $v.routingCookie.externalSecret.path }}, property: current }
    - secretKey: {{ $v.routingCookie.keyPrevious }}
      remoteRef: { key: {{ $v.routingCookie.externalSecret.path }}, property: previous }
{{- end }}
