{{- $v := .Values }}
# Tài khoản dịch vụ riêng để danh tính mesh là cluster.local/ns/edge/sa/apisix (INF-09): AuthorizationPolicy của
# service phía sau (sinh từ ingressFrom của vt-service) nhận APISIX theo danh tính này. Không gắn token API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: apisix
  namespace: edge
  labels:
    app.kubernetes.io/name: apisix
    {{- include "api-gateway.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix
  namespace: edge
  labels:
    app.kubernetes.io/name: apisix
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
  {{- if not $v.apisix.autoscaling.enabled }}
  replicas: {{ $v.apisix.replicas | int }}
  {{- end }}
  selector:
    matchLabels: { app.kubernetes.io/name: apisix }
  strategy:
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apisix
        {{- include "api-gateway.labels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/apisix-config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: apisix
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 40
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
        runAsUser: 636
        runAsGroup: 636
        fsGroup: 636
      {{- include "api-gateway.scheduling" . | nindent 6 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: apisix }
      {{- if $v.coraza.enabled }}
      initContainers:
        - name: coraza-wasm
          image: {{ include "api-gateway.image" (list $v.coraza.image "coraza") }}
          imagePullPolicy: IfNotPresent
          command: ["cp", "{{ $v.coraza.wasmDir }}/coraza-proxy-wasm.wasm", "/opt/vt/wasm/"]
          securityContext:
            {{- include "api-gateway.containerSecurity" . | nindent 12 }}
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: wasm, mountPath: /opt/vt/wasm }
      {{- end }}
      containers:
        - name: apisix
          image: {{ include "api-gateway.image" (list $v.apisix.image "apisix") }}
          imagePullPolicy: IfNotPresent
          env:
            - name: APISIX_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $v.oidc.clientSecretRef.name }}, key: {{ $v.oidc.clientSecretRef.key }} }
          {{- if $v.routingCookie.enabled }}
            - name: VT_ROUTE_COOKIE_KEY
              valueFrom:
                secretKeyRef: { name: {{ $v.routingCookie.secretName }}, key: {{ $v.routingCookie.keyCurrent }} }
            - name: VT_ROUTE_COOKIE_KEY_PREVIOUS
              valueFrom:
                secretKeyRef: { name: {{ $v.routingCookie.secretName }}, key: {{ $v.routingCookie.keyPrevious }}, optional: true }
          {{- end }}
          {{- if eq $v.mode "controller" }}
            - name: APISIX_ADMIN_KEY
              valueFrom:
                secretKeyRef: { name: apisix-admin, key: admin-key }
          {{- end }}
          ports:
            - { name: http, containerPort: {{ $v.apisix.ports.http | int }} }
            - { name: https, containerPort: {{ $v.apisix.ports.https | int }} }
            - { name: metrics, containerPort: {{ $v.metrics.port | int }} }
            {{- if eq $v.mode "controller" }}
            - { name: admin, containerPort: 9180 }
            {{- end }}
          resources:
            {{- toYaml $v.apisix.resources | nindent 12 }}
          securityContext:
            {{- include "api-gateway.containerSecurity" . | nindent 12 }}
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15 && /usr/local/openresty/bin/openresty -s quit -p /usr/local/apisix"]
          volumeMounts:
            - { name: config, mountPath: /usr/local/apisix/conf/config.yaml, subPath: config.yaml }
            {{- if eq $v.mode "standalone" }}
            - { name: config, mountPath: /usr/local/apisix/conf/apisix.yaml, subPath: apisix.yaml }
            {{- end }}
            - { name: vt-plugins, mountPath: /opt/vt/lua/apisix/plugins }
            {{- if $v.coraza.enabled }}
            - { name: wasm, mountPath: /opt/vt/wasm }
            {{- end }}
      volumes:
        - name: config
          configMap: { name: apisix }
        - name: vt-plugins
          configMap: { name: apisix-vt-plugins }
        {{- if $v.coraza.enabled }}
        - name: wasm
          emptyDir: { sizeLimit: 64Mi }
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-gateway
  namespace: edge
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
  {{- with $v.apisix.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $v.apisix.service.type }}
  {{- if eq $v.apisix.service.type "LoadBalancer" }}
  externalTrafficPolicy: Local
  {{- end }}
  selector: { app.kubernetes.io/name: apisix }
  ports:
    - { name: http, port: 80, targetPort: http }
    - { name: https, port: 443, targetPort: https }
{{- if eq $v.mode "controller" }}
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-admin
  namespace: edge
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: apisix }
  ports:
    - { name: admin, port: 9180, targetPort: admin }
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: apisix
  namespace: edge
spec:
  minAvailable: {{ $v.apisix.pdb.minAvailable }}
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels: { app.kubernetes.io/name: apisix }
{{- if $v.apisix.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: apisix
  namespace: edge
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: apisix }
  minReplicas: {{ $v.apisix.autoscaling.minReplicas | int }}
  maxReplicas: {{ $v.apisix.autoscaling.maxReplicas | int }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ $v.apisix.autoscaling.cpuUtilization | int }} } }
{{- end }}
---
# Cổng nhận lưu lượng từ bộ cân bằng tải và mọi nguồn trong cụm (namespace edge mặc định từ chối, cell-base).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apisix-ingress
  namespace: edge
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: apisix }
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - { protocol: TCP, port: {{ $v.apisix.ports.http | int }} }
        - { protocol: TCP, port: {{ $v.apisix.ports.https | int }} }
    {{- if eq $v.mode "controller" }}
    - from:
        - podSelector:
            matchLabels: { app.kubernetes.io/name: apisix-ingress-controller }
      ports:
        - { protocol: TCP, port: 9180 }
    {{- end }}
{{- if $v.metrics.podMonitor }}
---
# Prometheus của cell thu metric APISIX làm SLI (TL-04 mục 7.1, 10.4); gắn nhãn cell để luật và dashboard lọc.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: apisix
  namespace: edge
  labels:
    {{- include "api-gateway.labels" . | nindent 4 }}
spec:
  selector: { matchLabels: { app.kubernetes.io/name: apisix } }
  podMetricsEndpoints:
    - port: metrics
      path: /apisix/prometheus/metrics
      interval: 15s
      relabelings:
        - { targetLabel: cell, replacement: {{ $v.cell | quote }} }
{{- end }}
