# Kiểm thử cục bộ bằng Docker (kiem-thu-cuc-bo.sh, DV-01-02): APISIX standalone, Keycloak giả lập (keycloak:8080),
# một Valkey đơn (valkey:6379), upstream giả lập mang bí danh mạng <service>.<namespace>.svc.cluster.local.
# Ngưỡng hạ thấp để kiểm nhanh; ngưỡng thật nằm ở values.yaml của chart.
cell: kind
mode: standalone
apisix:
  replicas: 1
  autoscaling: { enabled: false }
  nodePool: none
  workerProcesses: 1
oidc:
  baseUrl: http://keycloak:8080
rateLimit:
  policy: redis
  redisHost: valkey
  user: { count: 40, timeWindow: 60, group: vt-user }
  routeTiers:
    expensive: { count: 3, timeWindow: 60 }
    ai: { count: 30, timeWindow: 60 }
    search: { count: 60, timeWindow: 60 }
    analytics: { count: 30, timeWindow: 60 }
  tenantQuota:
    window: 30
    accountsPerUnit: 100
    rpsPerUnit: 2
    minRps: 20
    # tenant nhỏ: 1 rps → 30 request mỗi cửa sổ 30 s.
    overrides:
      - { tenant: t-nho, rps: 1 }
priority:
  classes:
    "1": { conn: 400, burst: 200 }
    "2": { conn: 200, burst: 100 }
    # Lớp 3 chỉ một request đồng thời để kiểm 503 khi quá tải.
    "3": { conn: 1, burst: 0 }
coraza:
  image: { ref: vt-local/coraza-proxy-wasm:0.5.0 }
routes:
  - name: mission-core
    namespace: core
    service: mission-core
    port: 8080
    hosts: ["*.danhgia.vn"]
    paths: ["/api/v1/tasks*", "/api/v1/plans*", "/api/v1/okr*", "/api/v1/evidences*", "/api/v1/appraisals*"]
    pluginConfig: protected-api
    timeout: { connect: 2, send: 10, read: 10 }
  # Chỉ ở kiểm thử: mọi tiền tố còn lại của hợp đồng đi qua Coraza tới upstream giả lập, không xác thực, để thử
  # ví dụ request của hợp đồng với WAF (không có ở values thật).
  - name: waf-thu
    namespace: core
    service: mission-core
    port: 8080
    hosts: ["*.danhgia.vn"]
    paths: ["/api/v1/*"]
    timeout: { connect: 2, send: 10, read: 10 }
# Không có OTel collector trong kiểm thử cục bộ.
opentelemetry:
  enabled: false
