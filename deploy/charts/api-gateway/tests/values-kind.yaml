# Cụm kind (deploy/environments/kind): APISIX standalone đọc apisix.yaml sinh từ values, không etcd và controller;
# Keycloak giả lập trong namespace identity; một Valkey đơn nên limit-count dùng policy redis.
cell: kind
mode: standalone
apisix:
  replicas: 3
  autoscaling: { enabled: false }
  pdb: { minAvailable: 2 }
  nodePool: none
  workerProcesses: 1
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 512Mi }
  service: { type: ClusterIP }
oidc:
  baseUrl: http://keycloak.identity.svc:8080
  # Keycloak giả lập trên kind (tests/gia-lap-keycloak.sh) ký RS256; vt-claims kiểm được cả RS256.
  signingAlg: RS256
rateLimit:
  policy: redis
  redisHost: valkey.data-kafka.svc.cluster.local
coraza:
  image:
    # Ảnh dựng cục bộ từ bản phát hành coraza-proxy-wasm 0.5.0 (kiem-thu-kind.sh), nạp bằng kind load.
    ref: vt-local/coraza-proxy-wasm:0.5.0
routes:
  - name: mission-core
    namespace: core
    service: mission-core
    port: 8080
    hosts: ["*.danhgia.vn"]
    paths: ["/api/v1/tasks*", "/api/v1/plans*", "/api/v1/okr*", "/api/v1/evidences*", "/api/v1/appraisals*"]
    pluginConfig: protected-api
    timeout: { connect: 2, send: 10, read: 10 }
