# Mã cell; vt-claims từ chối JWT có claim cell khác giá trị này.
cell: g4

# controller: APISIX đọc cấu hình từ etcd, APISIX Ingress Controller đồng bộ CRD ApisixRoute,
# ApisixPluginConfig, ApisixGlobalRule từ kho GitOps (TL-04 mục 3.7, dùng cho cụm thật).
# standalone: APISIX đọc conf/apisix.yaml sinh từ cùng values, không cần etcd và controller (dùng cho kind).
mode: controller

apisix:
  image:
    repository: docker.io/apache/apisix
    digest: sha256:c5c7a55ebb5c07abc210dbb963a37f41030e12c91d23bacedbaa168fec633bd7
  replicas: 3
  # Co giãn và PDB theo bảng TL-04 mục 5.2 (SVC-01: 3/8 replica, minAvailable 2), thêm ở INF-02.
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 8, cpuUtilization: 70 }
  pdb: { minAvailable: 2 }
  # Pool ingress theo TL-04 mục 3.3 (taint vt.io/pool=ingress:NoSchedule); none để bỏ ràng buộc.
  nodePool: ingress
  workerProcesses: 4
  resources:
    requests: { cpu: "2", memory: 2Gi }
    limits: { cpu: "4", memory: 2Gi }
  ports: { http: 9080, https: 9443 }
  service:
    type: LoadBalancer
    annotations: {}
  # TLS 1.3; TLS 1.2 với bộ mã AEAD chỉ bật cho danh sách thiết bị cũ (TL-04 mục 3.7) qua ApisixTls riêng.
  tls:
    protocols: TLSv1.3
    # Secret chứa tls.crt, tls.key (do cert-manager cấp); rỗng thì không sinh ApisixTls.
    secretName: ""
    hosts: []
  # Dải địa chỉ được tin header X-Forwarded-For (bộ cân bằng tải phía trước).
  trustedAddresses: []

etcd:
  image:
    repository: gcr.io/etcd-development/etcd
    digest: sha256:fd158fbe55240e252947bbd2e8dddc217997ff43978071fac2bd202b6ad15c03
  replicas: 3
  storage: 8Gi
  storageClassName: ""
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: "1", memory: 1Gi }

ingressController:
  image:
    repository: docker.io/apache/apisix-ingress-controller
    digest: sha256:5d279f14d0cc6b7f4413e8f7f4c86f91cc2698e6d15dbfc5d022eab3cc8a0246
  replicas: 2
  # Dải địa chỉ kube-apiserver để mở egress của controller (giá trị riêng của môi trường).
  apiServerCIDRs: []
  resources:
    requests: { cpu: 200m, memory: 256Mi }
    limits: { cpu: 500m, memory: 256Mi }

# Keycloak của cell (ADR-08). TL-04 viết realm platform; hợp đồng contracts/openapi/common và realm dev dùng
# mission, nên mặc định theo hợp đồng (API-first, xem wiki 14).
oidc:
  baseUrl: https://sso.cell-g4.danhgia.vn
  realm: mission
  clientId: apisix-gateway
  # Secret (do ExternalSecret từ OpenBao tạo) chứa client secret; APISIX 3.x bắt buộc trường này kể cả bearer_only.
  clientSecretRef: { name: apisix-oidc, key: client-secret }
  # Thuật toán ký token của realm (TL-01 SVC-01: ES256); token ký thuật toán khác bị từ chối 401.
  signingAlg: ES256
  # Plugin kiểm chữ ký JWT: vt-claims (kiểm qua JWKS, nhận ES256) hoặc openid-connect (lua-resty-openidc của
  # APISIX 3.13 chỉ nhận RS*/HS*, chỉ dùng khi realm ký RS256). Xem wiki 14 mục DV-01-01.
  verifier: vt-claims
  # Thời gian giữ JWKS trong bộ đệm của mỗi worker (giây); kid lạ thì nạp lại ngay, tối đa một lần mỗi 10 giây.
  jwksTtl: 300
  # Tên claim do mapper MissionContextMapper của realm phát (DV-02-02): tenant_id (và bí danh tenant), cell.
  # Hợp đồng platform.yaml nhắc claim tid cho client nội bộ; cổng dùng tenant_id như thư viện nền (wiki 14).
  claims:
    tenant: tenant_id
    cell: cell

# TL-04 mục 6.8.
rateLimit:
  user: { count: 600, timeWindow: 60 }
  tenant: { rate: 400, burst: 200 }
  # Tuyến công khai (public-routes.yaml), khoá theo địa chỉ client.
  public: { rate: 50, burst: 50 }
  retryAfter: 30
  problemType: https://danhgia.vn/problems/rate-limited
  problemTitle: Vượt giới hạn tần suất
  # redis-cluster cho cụm thật (Valkey 3 node, TLS); redis cho một Valkey đơn (kind).
  policy: redis-cluster
  redisClusterName: apisix-ratelimit
  redisClusterNodes:
    - valkey-a-0.valkey-headless.data-kafka.svc:6379
    - valkey-b-0.valkey-headless.data-kafka.svc:6379
    - valkey-c-0.valkey-headless.data-kafka.svc:6379
  redisSsl: true
  redisHost: valkey.data-kafka.svc
  redisPort: 6379

# SEC-34: Coraza (proxy-wasm) với OWASP CRS 4, paranoia 2, ngưỡng điểm bất thường 5.
coraza:
  enabled: true
  # Ảnh chỉ chứa tệp coraza-proxy-wasm.wasm ở wasmDir; init container chép sang emptyDir.
  image:
    repository: harbor.vt.local/platform/coraza-proxy-wasm
    # Bắt buộc khi bật Coraza; điền digest ảnh trên Harbor ở values của môi trường.
    digest: ""
  wasmDir: /wasm
  paranoiaLevel: 2
  anomalyThreshold: 5
  # On: chặn; DetectionOnly: chỉ ghi nhật ký (2 tuần đầu với tuyến mới, TL-04 SEC-34).
  ruleEngine: "On"
  # Quy tắc loại trừ theo tuyến, quản lý trong Git (TL-04 SEC-34); nạp trước CRS, dạng ctl lúc chạy
  # (coraza-proxy-wasm 0.5.0 lỗi khi gặp SecRuleUpdateTargetById). 932236 (PL2) coi tên tham số "id" là lệnh Unix.
  exclusions:
    - SecRule ARGS_NAMES "@streq id" "id:10001,phase:1,pass,nolog,ctl:ruleRemoveTargetById=932236;ARGS_NAMES:id"
    - SecRule ARGS_GET_NAMES "@streq id" "id:10002,phase:1,pass,nolog,ctl:ruleRemoveTargetById=932236;ARGS_GET_NAMES:id"

# SEC-24: header bảo mật gắn toàn cục. CSP của giao diện do SVC-17 (nginx của web-frontend) đặt theo TL-01.
securityHeaders:
  Strict-Transport-Security: max-age=63072000; includeSubDomains; preload
  X-Content-Type-Options: nosniff
  Referrer-Policy: strict-origin-when-cross-origin
  Permissions-Policy: camera=(), microphone=(), geolocation=()
  Cross-Origin-Opener-Policy: same-origin

# Sinh và truyền traceparent W3C (B2). APISIX ghi mọi span (always_on); quyết định lưu trace do lấy mẫu theo đuôi
# ở OTel gateway (TL-04 mục 10.2). Header X-Debug-Trace thành thuộc tính để gateway giữ 100% trace đó.
opentelemetry:
  enabled: true
  collector: otel-agent.observability.svc:4318

# Tuyến theo module (DV-01-01): mỗi tiền tố /api/v1/<module> của hợp đồng tới upstream theo x-mission.owner.
# ApisixRoute đặt ở namespace của backend (CRD chỉ trỏ được Service cùng namespace). Trường của một tuyến:
# paths (tiền tố kết thúc bằng *, hoặc đường dẫn chính xác), methods, uriRegex (lọc thêm đường dẫn có tham số),
# priority (cao thắng; tuyến hẹp đặt cao hơn tuyến tiền tố), rewrite, canary, deny (trả 404, xem internalOnly).
# Thiếu trường nào thì lấy ở routeDefaults. Không có tuyến Strangler /kpi-legacy/* (Mission là hệ mới độc lập).
# Kiểm đối chiếu với hợp đồng: tests/doi-chieu-hop-dong.py (mọi đường dẫn khớp một tuyến, thao tác chỉ dành
# cho client nội bộ không ra cổng ngoài).
routeDefaults:
  hosts: ["*.danhgia.vn"]
  pluginConfig: protected-api
  port: 8080
  priority: 0
  # Mẫu TL-01 "SVC-01 api-gateway": connect 2 s, send/read 10 s.
  timeout: { connect: 2, send: 10, read: 10 }

routes:
  # SVC-05 mission-core: MOD-01..MOD-08 và /jobs/{id} (owner SVC-05 theo hợp đồng, xem wiki 14 DV-01-01).
  - name: mission-core
    namespace: core
    service: mission-core
    paths:
      - /api/v1/okr*
      - /api/v1/tasks*
      - /api/v1/plans*
      - /api/v1/catalog*
      - /api/v1/products*
      - /api/v1/evidences*
      - /api/v1/appraisals*
      - /api/v1/policies*
      - /api/v1/dossiers*
      - /api/v1/oversight*
      - /api/v1/config*
      - /api/v1/periods*
      - /api/v1/ui*
      - /api/v1/jobs*
    # Rollout canary của mission-core điều khiển trọng số stable/canary của tuyến này (INF-04).
    canary: true
  # SVC-07 scoring-service: xem trước, mô phỏng, tính lại, truy vết điểm (owner SVC-07 trong appraisals.yaml).
  - name: scoring-preview
    namespace: workers
    service: scoring-service
    paths: ["/api/v1/appraisals/score-preview"]
    methods: [POST]
    priority: 20
  - name: scoring-profile
    namespace: workers
    service: scoring-service
    paths: ["/api/v1/appraisals/profiles/*"]
    uriRegex: "^/api/v1/appraisals/profiles/[^/]+/(score-trace|simulate|recompute)$"
    priority: 20
  # SVC-11 document-service: sinh biểu mẫu và lệnh dựng tệp; các đường dẫn /dossiers khác thuộc MOD-06.
  - name: document-render
    namespace: workers
    service: document-service
    paths: ["/api/v1/dossiers/render-jobs", "/api/v1/dossiers/forms", "/api/v1/dossiers/forms/preview"]
    methods: [POST]
    priority: 20
  # SVC-09 ledger-service: sổ cái và bằng chứng tra cứu của oversight.
  - name: ledger
    namespace: secure
    service: ledger-service
    paths: ["/api/v1/ledger*", "/api/v1/oversight/ledger/proofs"]
    priority: 20
  # SVC-10 esign-service.
  - name: esign
    namespace: secure
    service: esign-service
    paths: ["/api/v1/esign*"]
  # SVC-14 ai-gateway.
  - name: ai
    namespace: secure
    service: ai-gateway
    paths: ["/api/v1/ai*"]
    timeout: { connect: 2, send: 10, read: 60 }
  # SVC-04 org-service.
  - name: org
    namespace: identity
    service: org-service
    paths: ["/api/v1/org*"]
  # SVC-06 workflow-service (tiền tố workflow có trong hợp đồng, chưa có ở baseline mục 13; giữ theo hợp đồng).
  - name: workflow
    namespace: core
    service: workflow-service
    paths: ["/api/v1/workflow*"]
  # SVC-08 evidence-service: tải lên nhiều phần, tải xuống, quét.
  - name: files
    namespace: platform
    service: evidence-service
    paths: ["/api/v1/files*"]
    timeout: { connect: 2, send: 60, read: 60 }
  # SVC-12 notification-service; luồng SSE giữ kết nối lâu nên có tuyến riêng.
  - name: notifications
    namespace: platform
    service: notification-service
    paths: ["/api/v1/notifications*"]
  - name: notifications-stream
    namespace: platform
    service: notification-service
    paths: ["/api/v1/notifications/stream"]
    methods: [GET]
    priority: 20
    timeout: { connect: 2, send: 10, read: 3600 }
  # SVC-16 search.
  - name: search
    namespace: platform
    service: search-indexer
    paths: ["/api/v1/search", "/api/v1/search/*"]
  # SVC-15 analytics-api.
  - name: analytics
    namespace: analytics
    service: analytics-api
    paths: ["/api/v1/analytics*"]
    timeout: { connect: 2, send: 10, read: 30 }
  # SPI REST mission-iam trong Keycloak (DV-02-08: cấp, thu hồi mã khôi phục MFA). Gateway kiểm JWT như mọi API,
  # rồi đổi đường dẫn sang /realms/<realm>/mission-iam/ ({realm} lấy từ oidc.realm).
  - name: iam-mission-iam
    namespace: identity
    service: keycloak
    paths: ["/api/v1/iam/*"]
    rewrite: ["^/api/v1/iam/(.*)$", "/realms/{realm}/mission-iam/$1"]
  # Thao tác chỉ cho client nội bộ (security chỉ serviceClient trong hợp đồng) không ra cổng ngoài (DV-01-03):
  # cổng trả 404 Problem Details; dịch vụ gọi nhau trực tiếp trong mạng nội bộ cell.
  - name: internal-only
    namespace: core
    service: mission-core
    deny: true
    priority: 100
    paths:
      - /api/v1/appraisals/inputs*
      - /api/v1/config/dashboard-defs*
      - /api/v1/esign/seals
      - /api/v1/workflow/sagas/period-close*
      - /api/v1/ai/ocr
      - /api/v1/policies/resolve
      - /api/v1/tasks/visibility-check

# Tiền tố có trong hợp đồng nhưng không công bố ở cổng của cell. Kịch bản đối chiếu bỏ qua các tiền tố này.
# registry và config/tenants (SVC-03) ở APISIX lớp toàn cục (DV-01-04, wiki 14 DV-03-03); SCIM 2.0 (/scim/v2,
# chỉ serviceClient) không ra cổng người dùng.
notInCell:
  - { prefix: /api/v1/registry, reason: "SVC-03 ở vùng điều phối toàn cục (DV-01-04)" }
  - { prefix: /api/v1/config/tenants, reason: "SVC-03 tenant-registry hiện thực, định tuyến ở lớp toàn cục (DV-03-03)" }
  - { prefix: /scim/v2, reason: "SCIM chỉ serviceClient, không ra cổng người dùng (DV-01-03)" }

# Tuyến không cần token người dùng: chỉ khai trong public-routes.yaml (sinh bởi tests/tuyen-cong-khai.py từ hợp đồng
# và danh sách quy ước chuẩn), khớp chính xác đường dẫn và phương thức; thêm tuyến mới phải có duyệt bảo mật (wiki 07).
publicUpstreams:
  integration-gateway: { namespace: platform, service: integration-gateway, port: 8080 }

podSecurityContext:
  runAsNonRoot: true
  seccompProfile: { type: RuntimeDefault }

# Metric Prometheus của APISIX (INF-15): cổng xuất riêng, bucket độ trễ (ms) và PodMonitor cho Prometheus cell.
metrics:
  port: 9091
  buckets: [5, 10, 25, 50, 100, 200, 300, 500, 800, 1000, 2000, 5000, 10000, 30000]
  podMonitor: true
