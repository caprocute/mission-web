# Cụm kind: Tempo đơn khối lưu đĩa cục bộ, Loki một tiến trình lưu hệ tệp; không Thanos, Grafana, chép lạnh.
tempo-distributed: { enabled: false }
tempo:
  enabled: true
  fullnameOverride: tempo
  tempo:
    retention: 336h
    storage:
      trace: { backend: local, local: { path: /var/tempo/traces }, wal: { path: /var/tempo/wal } }
    receivers:
      otlp: { protocols: { grpc: { endpoint: "0.0.0.0:4317" } } }
loki:
  enabled: true
  deploymentMode: SingleBinary
  fullnameOverride: loki
  loki:
    auth_enabled: false
    commonConfig: { replication_factor: 1 }
    schemaConfig:
      configs:
        - from: "2026-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: { prefix: loki_index_, period: 24h }
    storage: { type: filesystem }
    limits_config: { retention_period: 2160h, allow_structured_metadata: true, volume_enabled: true }
    compactor: { retention_enabled: true, delete_request_store: filesystem }
  # Chart Loki mặc định xoá PVC khi thu về 0 bản sao (whenScaled: Delete), làm mất WAL và log chưa đẩy lên kho.
  singleBinary: { replicas: 1, persistence: { size: 2Gi, enableStatefulSetAutoDeletePVC: false } }
  write: { replicas: 0 }
  read: { replicas: 0 }
  backend: { replicas: 0 }
  gateway: { enabled: false }
  chunksCache: { enabled: false }
  resultsCache: { enabled: false }
  minio: { enabled: false }
  lokiCanary: { enabled: false }
  test: { enabled: false }
  sidecar: { rules: { enabled: false } }
lokiColdCopy: { enabled: false }
# Grafana trên kind để nạp thử dashboard (INF-15): đọc thẳng Prometheus của cell (uid thanos), Loki, Tempo
# đơn khối. Mật khẩu quản trị nằm trong Secret grafana-admin do kiem-thu-quan-sat.sh sinh ngẫu nhiên.
grafana:
  enabled: true
  image: { registry: docker.io, repository: grafana/grafana, tag: 12.3.1, sha: 2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f }
  initChownData: { enabled: false }
  testFramework: { enabled: false }
  persistence: { enabled: false }
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - { name: Prometheus, type: prometheus, uid: thanos, url: "http://prometheus-operated.observability.svc:9090", isDefault: true,
            jsonData: { exemplarTraceIdDestinations: [{ name: trace_id, datasourceUid: tempo }] } }
        - name: Loki
          type: loki
          uid: loki
          url: http://loki.observability.svc:3100
          jsonData:
            derivedFields:
              - { name: trace_id, matcherType: label, matcherRegex: trace_id, datasourceUid: tempo, url: "$${__value.raw}" }
        - { name: Tempo, type: tempo, uid: tempo, url: "http://tempo.observability.svc:3200" }
alertmanager: { enabled: false }
thanos: { enabled: false }
