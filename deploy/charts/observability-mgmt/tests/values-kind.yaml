# Cụm kind: Tempo đơn khối lưu đĩa cục bộ, Loki một tiến trình lưu hệ tệp; không Thanos, Grafana, chép lạnh.
tempo-distributed: { enabled: false }
tempo:
  enabled: true
  fullnameOverride: tempo
  tempo:
    retention: 336h
    storage:
      trace: { backend: local, local: { path: /var/tempo/traces }, wal: { path: /var/tempo/wal } }
    receivers:
      otlp: { protocols: { grpc: { endpoint: "0.0.0.0:4317" } } }
loki:
  enabled: true
  deploymentMode: SingleBinary
  fullnameOverride: loki
  loki:
    auth_enabled: false
    commonConfig: { replication_factor: 1 }
    schemaConfig:
      configs:
        - from: "2026-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index: { prefix: loki_index_, period: 24h }
    storage: { type: filesystem }
    limits_config: { retention_period: 2160h, allow_structured_metadata: true, volume_enabled: true }
    compactor: { retention_enabled: true, delete_request_store: filesystem }
  # Chart Loki mặc định xoá PVC khi thu về 0 bản sao (whenScaled: Delete), làm mất WAL và log chưa đẩy lên kho.
  singleBinary: { replicas: 1, persistence: { size: 2Gi, enableStatefulSetAutoDeletePVC: false } }
  write: { replicas: 0 }
  read: { replicas: 0 }
  backend: { replicas: 0 }
  gateway: { enabled: false }
  chunksCache: { enabled: false }
  resultsCache: { enabled: false }
  minio: { enabled: false }
  lokiCanary: { enabled: false }
  test: { enabled: false }
  sidecar: { rules: { enabled: false } }
lokiColdCopy: { enabled: false }
grafana: { enabled: false }
thanos: { enabled: false }
