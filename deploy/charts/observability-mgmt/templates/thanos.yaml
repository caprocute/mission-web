{{- $v := .Values }}
{{- $t := $v.thanos }}
{{- if $t.enabled }}
{{- $img := include "obs.image" (list $t.image "thanos") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: thanos-query
  namespace: observability
  labels: { app.kubernetes.io/name: thanos-query, app.kubernetes.io/part-of: vt-observability }
spec:
  replicas: {{ $t.query.replicas | int }}
  selector: { matchLabels: { app.kubernetes.io/name: thanos-query } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: thanos-query, app.kubernetes.io/part-of: vt-observability }
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "obs.podSec" . | nindent 8 }}
      containers:
        - name: thanos
          image: {{ $img }}
          args:
            - query
            - --http-address=0.0.0.0:9090
            - --grpc-address=0.0.0.0:10901
            # Khử trùng cặp Prometheus của mỗi cell (TL-04 mục 10.4).
            - --query.replica-label=prometheus_replica
            - --endpoint=dnssrv+_grpc._tcp.thanos-store.observability.svc
            {{- range $t.sidecarEndpoints }}
            - --endpoint={{ . }}
            {{- end }}
          ports:
            - { name: http, containerPort: 9090 }
            - { name: grpc, containerPort: 10901 }
          readinessProbe: { httpGet: { path: /-/ready, port: http } }
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { cpu: "2", memory: 2Gi }
          securityContext:
            {{- include "obs.secCtx" . | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-query
  namespace: observability
spec:
  selector: { app.kubernetes.io/name: thanos-query }
  ports: [{ name: http, port: 9090 }]
---
apiVersion: v1
kind: Service
metadata:
  name: thanos-store
  namespace: observability
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: thanos-store }
  ports: [{ name: grpc, port: 10901 }]
{{- range $comp := list "store" "compactor" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: thanos-{{ $comp }}
  namespace: observability
  labels: { app.kubernetes.io/name: thanos-{{ $comp }}, app.kubernetes.io/part-of: vt-observability }
spec:
  serviceName: thanos-{{ $comp }}
  # Compactor chỉ được chạy một bản trên mỗi bucket.
  replicas: {{ ternary 1 ($t.store.replicas | int) (eq $comp "compactor") }}
  selector: { matchLabels: { app.kubernetes.io/name: thanos-{{ $comp }} } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: thanos-{{ $comp }}, app.kubernetes.io/part-of: vt-observability }
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- include "obs.podSec" $ | nindent 8 }}
      containers:
        - name: thanos
          image: {{ $img }}
          args:
            {{- if eq $comp "store" }}
            - store
            - --grpc-address=0.0.0.0:10901
            {{- else }}
            - compact
            - --wait
            - --deduplication.replica-label=prometheus_replica
            # Giảm độ phân giải và lưu giữ (TL-04 mục 10.4).
            - --retention.resolution-raw={{ $t.compactor.retentionRaw }}
            - --retention.resolution-5m={{ $t.compactor.retention5m }}
            - --retention.resolution-1h={{ $t.compactor.retention1h }}
            {{- end }}
            - --http-address=0.0.0.0:10902
            - --data-dir=/data
            - --objstore.config-file=/etc/thanos/objstore.yml
          ports:
            - { name: http, containerPort: 10902 }
            {{- if eq $comp "store" }}
            - { name: grpc, containerPort: 10901 }
            {{- end }}
          resources:
            requests: { cpu: 500m, memory: 4Gi }
            limits: { cpu: "2", memory: 4Gi }
          securityContext:
            {{- include "obs.secCtx" $ | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: objstore, mountPath: /etc/thanos, readOnly: true }
      volumes:
        - name: objstore
          secret: { secretName: {{ $t.objstoreSecret }} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: {{ ternary $t.compactor.storage $t.store.storage (eq $comp "compactor") }} } }
{{- end }}
{{- end }}
