# Cấu hình kube-linter cho golden và chart thử của vt-service.
checks:
  addAllBuiltIn: true
  exclude:
    # Ảnh tham chiếu theo digest, không có tag: kiểm tra latest-tag không áp dụng.
    - latest-tag
    # Chính sách NetworkPolicy default-deny của namespace do cell-base (INF-08) tạo, không nằm trong chart này.
    - no-node-affinity
    # Service account tên theo service, không dùng default; kube-linter không đọc được SA tạo cùng chart khi lint từng tệp.
    - non-existent-service-account
    # Bỏ qua kiểm tra yêu cầu nhãn chủ sở hữu tuỳ biến của kube-linter (không thuộc quy ước TL-04).
    - required-annotation-email
    - required-label-owner
    # DNS theo mặc định của cụm (ndots do CoreDNS cell quản lý); TL-04 không yêu cầu dnsConfig riêng từng pod.
    - dnsconfig-options
    # restartPolicy của Pod trong Deployment luôn là Always theo mặc định API; kube-linter báo nhầm khi trường để trống.
    - restart-policy
    # Workload có HPA/ScaledObject không khai spec.replicas (bộ co giãn quản lý, minReplicas ≥ 3); kube-linter coi là 1.
    - minimum-three-replicas
    # Phân bố pod dùng topologySpreadConstraints theo vùng và node (TL-04 mục 3.4) thay cho podAntiAffinity.
    - no-anti-affinity
