    gotenberg:
      autoscaling:
        keda:
          minReplicas: 2
          maxReplicas: 16
notification-service:
  autoscaling:
    keda:
      minReplicas: 3
      maxReplicas: 6
integration-gateway:
  autoscaling:
    hpa:
      minReplicas: 3
      maxReplicas: 4
ledger-service:
  autoscaling:
    keda:
      minReplicas: 3
      maxReplicas: 6
esign-service:
  autoscaling:
    hpa:
      minReplicas: 2
      maxReplicas: 4
ai-gateway:
  thanhPhan:
    ai-gateway:
      autoscaling:
        hpa:
          minReplicas: 2
          maxReplicas: 4
    vllm:
      autoscaling:
        keda:
          minReplicas: 2
          maxReplicas: 3
analytics:
  thanhPhan:
    analytics-api:
      autoscaling:
        hpa:
          minReplicas: 2
          maxReplicas: 4
    cube:
      autoscaling:
        hpa:
          minReplicas: 3
          maxReplicas: 6
    superset:
