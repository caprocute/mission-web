          maxReplicas: 3
search:
  autoscaling:
    keda:
      minReplicas: 2
      maxReplicas: 4
  api:
    replicas:
      min: 2
      max: 3
web-frontend:
  autoscaling:
    hpa:
      minReplicas: 2
      maxReplicas: 3
org-service:
  replicaCount: 3
kafka:
  cheDo: tach
  brokers:
    replicas: 3
    resources:
      cpu: '8'
      memory: 32Gi
  controllers:
    replicas: 3
    resources:
      cpu: '1'
      memory: 4Gi
  topics:
    scoringInputPartitions: 48
    ledgerAppendPartitions: 6
  connect:
    replicas:
      min: 3
      max: 3

# Node pool máy ảo cho Cluster API và Cluster Autoscaler (INF-16 đọc). Pool máy vật lý không co giãn nên không ghi ở đây.
nodePools:
  system: { size: VM-8-32, min: 3, max: 3 }
  ingress: { size: VM-16-32, min: 3, max: 4 }
  app-general: { size: VM-16-64, min: 6, max: 12 }
  app-worker: { size: VM-16-64, min: 3, max: 12 }
