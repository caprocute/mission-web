apiVersion: v1
kind: Service
metadata:
  name: valkey-headless
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: { app.kubernetes.io/name: valkey }
  ports:
    - { name: valkey, port: 6379, targetPort: valkey, appProtocol: tcp }
    - { name: bus, port: 16379, targetPort: bus, appProtocol: tcp }
---
# Điểm vào khám phá cụm cho client (client cụm sau đó nối thẳng các pod qua tên trong valkey-headless).
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: valkey }
  ports:
    - { name: valkey, port: 6379, targetPort: valkey, appProtocol: tcp }
    {{- if .Values.metrics.enabled }}
    - { name: metrics, port: 9121, targetPort: metrics }
    {{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: valkey
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: valkey }
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: valkey-tls
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  secretName: valkey-tls
  duration: {{ .Values.tls.duration }}
  renewBefore: {{ .Values.tls.renewBefore }}
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  usages: [server auth, client auth]
  commonName: valkey.{{ .Values.namespace }}.svc
  dnsNames:
    - valkey.{{ .Values.namespace }}.svc
    - "*.valkey-headless.{{ .Values.namespace }}.svc"
    - "*.valkey-headless.{{ .Values.namespace }}.svc.cluster.local"
    - localhost
  issuerRef:
    {{- toYaml .Values.tls.issuerRef | nindent 4 }}
