{{- /* Tệp ACL (băm SHA-256) và mật khẩu đồng bộ replica, dựng từ OpenBao bằng ESO; không có mật khẩu trong chart. */}}
{{- $v := .Values }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey-acl
  namespace: {{ $v.namespace }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $v.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $v.externalSecrets.secretStore.kind }}
    name: {{ $v.externalSecrets.secretStore.name }}
  target:
    name: valkey-acl
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        users.acl: |
          user default off
          {{- range $ten, $u := $v.users }}
          user {{ $ten }} on #{{ printf "{{ index . %q | sha256sum }}" (replace "-" "_" $ten) }} resetchannels {{ $u.rules }}
          {{- end }}
        sao-chep.conf: |
          masterauth {{ "{{ .vt_replica }}" }}
        vt-admin: {{ "{{ .vt_admin }}" | quote }}
        vt-exporter: {{ "{{ .vt_exporter }}" | quote }}
  data:
    {{- range $ten, $u := $v.users }}
    - secretKey: {{ replace "-" "_" $ten }}
      remoteRef:
        key: {{ $v.externalSecrets.path }}/{{ $ten }}
        property: password
    {{- end }}
