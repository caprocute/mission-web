{{- $v := .Values }}
{{- $ns := $v.namespace }}
# Bổ sung cho default-deny của cell-base (TL-04 mục 3.6). OpenBao nhận 8200 từ namespace ứng dụng được liệt kê,
# cert-manager, ESO, quan sát và CronJob xoay khoá; 8201 chỉ giữa các node; gọi ra kube-apiserver (TokenReview,
# gắn nhãn pod), instance PostgreSQL (secret động) và HSM.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao
  namespace: {{ $ns }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "openbao.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "openbao.selector" . | nindent 14 }}
      ports: [{ port: 8200, protocol: TCP }, { port: 8201, protocol: TCP }]
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: openbao-xoay-khoa } }
        {{- range (concat $v.clientNamespaces (list $v.certManager.namespace $v.eso.namespace $v.observabilityNamespace)) }}
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ . }} } }
        {{- end }}
      ports: [{ port: 8200, protocol: TCP }]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "openbao.selector" . | nindent 14 }}
      ports: [{ port: 8200, protocol: TCP }, { port: 8201, protocol: TCP }]
    - to:
        {{- range $v.postgresNamespaces }}
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ . }} } }
          podSelector: { matchLabels: { cnpg.io/podRole: instance } }
        {{- end }}
      ports: [{ port: 5432, protocol: TCP }]
    {{- with $v.hsmCidrs }}
    - to:
        {{- range . }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports:
        {{- range $v.hsmPorts }}
        - { port: {{ . }}, protocol: TCP }
        {{- end }}
    {{- end }}
{{- if $v.rotation.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: openbao-xoay-khoa
  namespace: {{ $ns }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: openbao-xoay-khoa } }
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "openbao.selector" . | nindent 14 }}
      ports: [{ port: 8200, protocol: TCP }]
    {{- if $v.rotation.pushgateway }}
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $v.observabilityNamespace }} } }
      ports: [{ port: 9091, protocol: TCP }]
    {{- end }}
{{- end }}
{{- if $v.cilium }}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: openbao-kube-apiserver
  namespace: {{ $ns }}
  labels:
    {{- include "openbao.labels" . | nindent 4 }}
spec:
  description: OpenBao gọi TokenReview cho auth kubernetes và gắn nhãn pod của service_registration.
  endpointSelector:
    matchLabels:
      {{- range $k, $val := fromYaml (include "openbao.selector" .) }}
      k8s:{{ $k }}: {{ $val }}
      {{- end }}
  egress:
    - toEntities: [kube-apiserver]
{{- end }}
