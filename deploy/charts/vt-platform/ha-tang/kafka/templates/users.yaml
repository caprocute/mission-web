{{- /* KafkaUser mTLS và ACL theo danh mục (SEC-57, TL-04 mục 9.5): đọc đúng topic trong cột "Tiêu thụ chính", nhóm
tiêu thụ là tiền tố tên tài khoản, ghi và đọc hàng đợi <topic>.retry/.dlq.<tài khoản>; chỉ kafka-connect ghi topic từ
bảng outbox; sys.audit.v1 chỉ fluent-bit và audit-writer được ghi. */}}
{{- $v := .Values }}
{{- $dm := include "kafka.danhMuc" . | fromYaml }}
{{- $users := mergeOverwrite (deepCopy $dm.nguoiDung) $v.nguoiDungThem }}
{{- $tatCaDlq := list }}
{{- range $dm.capLoi }}{{ $tatCaDlq = append $tatCaDlq (printf "%s.dlq.%s" .topic .consumer) }}{{ end }}
{{- range $ten, $u := $users }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ $ten }}
  namespace: {{ $v.namespace }}
  labels:
    strimzi.io/cluster: {{ $v.cluster }}
    {{- include "kafka.labels" $ | nindent 4 }}
spec:
  authentication:
    type: tls
  authorization:
    type: simple
    acls:
      {{- range $t := $u.doc }}
      - resource: { type: topic, name: {{ $t }}, patternType: literal }
        operations: [Read, Describe]
      {{- range $loai := list "retry" "dlq" }}
      - resource: { type: topic, name: {{ printf "%s.%s.%s" $t $loai $ten }}, patternType: literal }
        operations: [Read, Write, Describe]
      {{- end }}
      {{- end }}
      {{- range $u.ghi }}
      - resource: { type: topic, name: {{ . }}, patternType: literal }
        operations: [Write, Describe]
      {{- end }}
      {{- if $u.hoLoi }}
      {{- range $tatCaDlq }}
      - resource: { type: topic, name: {{ . }}, patternType: literal }
        operations: [Read, Describe]
      {{- end }}
      {{- end }}
      {{- if eq $ten "kafka-connect" }}
      {{- /* Topic nội bộ của Connect (tạo sẵn ở connect.yaml), nhóm của cụm Connect. */}}
      - resource: { type: topic, name: {{ $v.connect.groupId }}-, patternType: prefix }
        operations: [Read, Write, Describe, DescribeConfigs]
      - resource: { type: group, name: {{ $v.connect.groupId }}, patternType: literal }
        operations: [Read, Describe]
      {{- end }}
      {{- if or $u.doc $u.hoLoi (eq $ten "kafka-connect") }}
      - resource: { type: group, name: {{ $ten }}, patternType: prefix }
        operations: [Read, Describe]
      {{- end }}
{{- end }}
