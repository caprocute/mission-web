{{- /* INF-28 · MirrorMaker 2 của bản sao ấm (TL-04 "Kafka: MirrorMaker 2"): chạy ở TTDL chờ (global.siteRole standby),
kéo topic từ cụm của TTDL primary, IdentityReplicationPolicy giữ nguyên tên topic, loại hàng đợi retry và replay, đồng
bộ offset nhóm tiêu thụ mỗi 30 s. Chiều nhân bản suy ra từ vai trò TTDL nên đảo cùng commit đổi primarySite (DR-10,
DR-16). Bên nguồn mở listener liên TTDL (kafka.yaml) và tài khoản chỉ đọc {{ .Values.mirrorMaker.sourceUser }}; topic
offset-syncs đặt ở đích để tài khoản nguồn không cần quyền ghi. */}}
{{- $v := .Values }}
{{- $m := $v.mirrorMaker }}
{{- if $m.enabled }}
{{- $self := toString $v.global.site }}
{{- $role := toString $v.global.siteRole }}
{{- if not (has $self $m.sites) }}{{ fail (printf "kafka: mirrorMaker.enabled cần global.site thuộc %v, có %q" $m.sites $self) }}{{ end }}
{{- if not (has $role (list "primary" "standby")) }}{{ fail (printf "kafka: mirrorMaker.enabled cần global.siteRole primary hoặc standby, có %q" $role) }}{{ end }}
{{- $peer := first (without $m.sites $self) }}
{{- if eq $role "standby" }}
{{- $chinhSach := "org.apache.kafka.connect.mirror.IdentityReplicationPolicy" }}
---
apiVersion: kafka.strimzi.io/v1
kind: KafkaMirrorMaker2
metadata:
  name: mm2-{{ $peer }}-to-{{ $self }}
  namespace: {{ $v.namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  version: {{ $v.kafkaVersion }}
  image: {{ include "kafka.anh" $v.image }}
  replicas: {{ $m.replicas }}
  target:
    alias: {{ $self }}
    bootstrapServers: {{ $v.cluster }}-kafka-bootstrap.{{ $v.namespace }}.svc:9093
    groupId: mm2-{{ $self }}
    configStorageTopic: mm2-{{ $self }}-configs
    offsetStorageTopic: mm2-{{ $self }}-offsets
    statusStorageTopic: mm2-{{ $self }}-status
    tls:
      trustedCertificates:
        - { secretName: {{ $v.cluster }}-cluster-ca-cert, pattern: "*.crt" }
    authentication:
      type: tls
      certificateAndKey: { secretName: {{ $m.targetUser }}, certificate: user.crt, key: user.key }
    config:
      config.storage.replication.factor: -1
      offset.storage.replication.factor: -1
      status.storage.replication.factor: -1
  mirrors:
    - source:
        alias: {{ $peer }}
        bootstrapServers: {{ printf $m.sourceBootstrapFormat $v.global.cell $peer }}
        tls:
          trustedCertificates:
            - { secretName: {{ printf $m.sourceCaSecretFormat $peer }}, pattern: "*.crt" }
        authentication:
          type: tls
          certificateAndKey: { secretName: {{ $m.sourceUser }}, certificate: user.crt, key: user.key }
      topicsPattern: {{ $m.topicsPattern | quote }}
      topicsExcludePattern: {{ $m.topicsExcludePattern | quote }}
      groupsPattern: {{ $m.groupsPattern | quote }}
      sourceConnector:
        tasksMax: {{ $m.sourceTasksMax }}
        config:
          replication.policy.class: {{ $chinhSach }}
          replication.factor: -1
          offset-syncs.topic.location: target
          offset-syncs.topic.replication.factor: -1
          sync.topic.acls.enabled: "false"
          sync.topic.configs.enabled: "false"
          refresh.topics.interval.seconds: 60
      checkpointConnector:
        tasksMax: {{ $m.checkpointTasksMax }}
        config:
          replication.policy.class: {{ $chinhSach }}
          offset-syncs.topic.location: target
          checkpoints.topic.replication.factor: -1
          sync.group.offsets.enabled: "true"
          sync.group.offsets.interval.seconds: 30
          emit.checkpoints.interval.seconds: 30
  resources:
    {{- toYaml $m.resources | nindent 4 }}
  metricsConfig:
    type: jmxPrometheusExporter
    valueFrom:
      configMapKeyRef: { name: mm2-metrics, key: metrics-config.yml }
  template:
    pod:
      securityContext:
        {{- toYaml $v.podSecurityContext | nindent 8 }}
    connectContainer:
      securityContext:
        {{- toYaml $v.containerSecurityContext | nindent 8 }}
---
# Chỉ số độ trễ nhân bản cho cảnh báo của bản sao ấm (replication-latency-ms, record-age-ms của MirrorSourceConnector).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mm2-metrics
  namespace: {{ $v.namespace }}
  labels:
    {{- include "kafka.labels" . | nindent 4 }}
data:
  metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: 'kafka.connect.mirror<type=MirrorSourceConnector, target=(.+), topic=(.+), partition=([0-9]+)><>([a-z-]+)'
        name: kafka_connect_mirror_source_connector_$4
        labels: { target: "$1", topic: "$2", partition: "$3" }
      - pattern: 'kafka.connect.mirror<type=MirrorCheckpointConnector, source=(.+), target=(.+), group=(.+), topic=(.+), partition=([0-9]+)><>([a-z-]+)'
        name: kafka_connect_mirror_checkpoint_connector_$6
        labels: { source: "$1", target: "$2", group: "$3", topic: "$4", partition: "$5" }
---
# Tài khoản MirrorMaker 2 ở cụm đích: ghi mọi topic được nhân bản, topic nội bộ mm2-*, nhóm tiêu thụ (đồng bộ offset).
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ $m.targetUser }}
  namespace: {{ $v.namespace }}
  labels:
    strimzi.io/cluster: {{ $v.cluster }}
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  authentication: { type: tls }
  authorization:
    type: simple
    acls:
      - resource: { type: topic, name: "*", patternType: literal }
        operations: [Read, Write, Create, Describe, DescribeConfigs, Alter, AlterConfigs]
      - resource: { type: group, name: "*", patternType: literal }
        operations: [Read, Describe, Alter]
      - resource: { type: cluster }
        operations: [Describe, DescribeConfigs]
{{- else }}
---
# Tài khoản chỉ đọc cho MirrorMaker 2 của TTDL chờ (mm2-{{ $self }}-to-{{ $peer }}): đọc topic, mô tả nhóm để
# chép offset; không ghi gì ở cụm nguồn (offset-syncs đặt ở đích).
apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: {{ $m.sourceUser }}
  namespace: {{ $v.namespace }}
  labels:
    strimzi.io/cluster: {{ $v.cluster }}
    {{- include "kafka.labels" . | nindent 4 }}
spec:
  authentication: { type: tls }
  authorization:
    type: simple
    acls:
      - resource: { type: topic, name: "*", patternType: literal }
        operations: [Read, Describe, DescribeConfigs]
      - resource: { type: group, name: "*", patternType: literal }
        operations: [Describe]
      - resource: { type: cluster }
        operations: [Describe]
{{- end }}
{{- end }}
