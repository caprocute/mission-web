# PostgreSQL của cell (INF-11). global.sizing (S, M, L, compact) chọn kích thước từ bảng `hoSo` dưới đây theo TL-05;
# hồ sơ compact tự gộp sáu cụm thành hai (TL-05 "PostgreSQL"). Toàn bộ mật khẩu nạp từ OpenBao qua External Secrets.
global:
  cell: ""
  sizing: L

# Namespace theo vùng (TL-04 mục 3.5): cụm vùng ứng dụng ở data-pg, pg-ledger và pg-secure ở secure-data.
namespaces: { app: data-pg, secure: secure-data }
# Namespace của operator CNPG (cổng trạng thái 8000 của instance manager).
operatorNamespace: cnpg-system

image:
  # Ảnh PostgreSQL 17 bản standard (có pgvector cho CSDL ai) qua Harbor, ghim digest (SEC-55).
  repository: harbor.vt.local/platform/postgresql
  tag: 17.6-standard-bookworm
  digest: sha256:a62c149a342b2b1955dda3a9d75e2c6851622e43302a577f393271c19a3c8622

# true: gộp theo TL-05 (pg-core chứa core, flowable, platform, iam; pg-ledger chứa ledger, esign, ai). Rỗng: tự
# bật khi global.sizing là compact.
consolidated: ""

instances: 3
# Dừng instance (CNPG): PgBouncer giữ kết nối máy chủ nên smart shutdown không bao giờ tự xong; chờ mặc định 180 s
# làm primary bị xoá nằm ở Terminating và chuyển đổi dự phòng chậm hơn mục tiêu 30 s (đo trên kind). Hạ còn 5 s
# rồi chuyển fast shutdown; stopDelay đủ cho fast shutdown ghi checkpoint.
shutdown: { smartShutdownTimeout: 5, stopDelay: 60, switchoverDelay: 60 }
storageClass: nvme-local

# CSDL dữ liệu tenant theo TL-03 (silo một CSDL, bridge mỗi tỉnh một CSDL, pool td_pool). Đặt theo cell.
tenantDatabases: [td_mau]

# Tham số chung cho mọi cụm (CR mẫu pg-core TL-04 mục 4.5). Tham số theo bộ nhớ tính ở _helpers.tpl:
# shared_buffers 25% RAM, effective_cache_size 75% RAM, maintenance_work_mem 1/64 RAM (suy luận từ tỷ lệ mẫu L).
parameters:
  work_mem: "32MB"
  wal_compression: "lz4"
  checkpoint_timeout: "15min"
  checkpoint_completion_target: "0.9"
  random_page_cost: "1.1"
  effective_io_concurrency: "256"
  max_parallel_workers_per_gather: "4"
  archive_timeout: "60s"
  idle_in_transaction_session_timeout: "60s"
  statement_timeout: "30s"
  lock_timeout: "5s"
  log_min_duration_statement: "1000"
  auto_explain.log_min_duration: "2000"
  track_io_timing: "on"
  ssl_min_protocol_version: "TLSv1.3"

# Kích thước mỗi instance theo hồ sơ (TL-05 bảng "PostgreSQL", TL-04 mục 4.5). maxConn: max_connections (TL-05
# "Ngân sách kết nối theo hồ sơ" cho pg-core; cụm khác 200, suy luận). pool: số instance PgBouncer mỗi Pooler.
hoSo:
  L:
    pooler: 3
    pg-core:     { cpu: 32, memGi: 256, data: 6Ti,   wal: 1Ti,   maxConn: 400, pool: "large" }
    pg-flowable: { cpu: 16, memGi: 64,  data: 2Ti,   wal: 500Gi, maxConn: 300 }
    pg-platform: { cpu: 16, memGi: 64,  data: 3Ti,   wal: 500Gi, maxConn: 300 }
    pg-iam:      { cpu: 4,  memGi: 16,  data: 200Gi, wal: "",    maxConn: 200 }
    pg-ledger:   { cpu: 8,  memGi: 32,  data: 2Ti,   wal: 300Gi, maxConn: 200 }
    pg-secure:   { cpu: 8,  memGi: 64,  data: 1Ti,   wal: "",    maxConn: 200 }
  M:
    pooler: 3
    pg-core:     { cpu: 16, memGi: 128, data: 4Ti,   wal: 512Gi, maxConn: 300 }
    pg-flowable: { cpu: 8,  memGi: 32,  data: 1Ti,   wal: 256Gi, maxConn: 200 }
    pg-platform: { cpu: 8,  memGi: 32,  data: 2560Gi, wal: 256Gi, maxConn: 200 }
    pg-iam:      { cpu: 2,  memGi: 8,   data: 100Gi, wal: "",    maxConn: 100 }
    pg-ledger:   { cpu: 4,  memGi: 16,  data: 1536Gi, wal: 256Gi, maxConn: 100 }
    pg-secure:   { cpu: 4,  memGi: 24,  data: 1Ti,   wal: "",    maxConn: 100 }
  S:
    pooler: 2
    pg-core:     { cpu: 8, memGi: 64, data: 2Ti,   wal: 256Gi, maxConn: 200 }
    pg-flowable: { cpu: 4, memGi: 16, data: 512Gi, wal: 128Gi, maxConn: 100 }
    pg-platform: { cpu: 4, memGi: 16, data: 1Ti,   wal: 128Gi, maxConn: 100 }
    pg-iam:      { cpu: 2, memGi: 8,  data: 50Gi,  wal: "",    maxConn: 100 }
    pg-ledger:   { cpu: 2, memGi: 8,  data: 512Gi, wal: 128Gi, maxConn: 100 }
    pg-secure:   { cpu: 2, memGi: 16, data: 300Gi, wal: "",    maxConn: 100 }
  compact:
    pooler: 2
    pg-core:     { cpu: 8, memGi: 48, data: 1Ti,   wal: 200Gi, maxConn: 200 }
    pg-ledger:   { cpu: 2, memGi: 12, data: 100Gi, wal: "",    maxConn: 100 }

# Pool PgBouncer theo (CSDL, người dùng) mỗi instance (TL-04 mục 4.7, TL-05). CNPG Pooler chỉ có default_pool_size
# chung, nên: default_pool_size = pool lớn nhất, max_db_connections = tổng ngân sách của CSDL (khớp bất đẳng thức
# phía máy chủ), và CONNECTION LIMIT của vai trò svc_ = số instance × pool của module (wiki 14).
pgbouncer:
  # Ảnh PgBouncer của CNPG qua Harbor, ghim digest (SEC-55), thay ảnh mặc định của operator.
  image:
    repository: harbor.vt.local/platform/pgbouncer
    tag: 1.24.1
    digest: sha256:9bce905b0be1ce9c0de8c694ef0cfb8d3707f7dbfb4b51213fc867b5d66b87c3
  maxClientConn: 1000
  reservePoolSize: 3
  queryWaitTimeout: 5
  maxPreparedStatements: 200
  # Bridge: mỗi CSDL tỉnh tối đa 12 kết nối máy chủ mỗi instance (TL-05); 0 = dùng tổng ngân sách.
  maxDbConnectionsPerTenantDb: 0
  # Ngân sách theo hồ sơ cho mission-core trên pg-core (TL-05: compact 8, S 13, M 20, L 40).
  poolCore:
    L:       { task: 14, okr: 6, appraisal: 6, product: 5, config: 3, policy: 2, dossier: 2, oversight: 2, org_replica: 1 }
    M:       { task: 7,  okr: 3, appraisal: 3, product: 2, config: 2, policy: 1, dossier: 1, oversight: 1, org_replica: 1 }
    S:       { task: 4,  okr: 2, appraisal: 2, product: 1, config: 1, policy: 1, dossier: 1, oversight: 1, org_replica: 1 }
    compact: { task: 1,  okr: 1, appraisal: 1, product: 1, config: 1, policy: 1, dossier: 1, oversight: 1, org_replica: 1 }
  resources: { requests: { cpu: 500m, memory: 256Mi }, limits: { cpu: "2", memory: 512Mi } }
  # Pool mỗi người dùng của các cụm còn lại theo hồ sơ (suy luận: L lấy workflow 60 kết nối máy chủ trên 3 instance,
  # M bằng nửa L, S khoảng một phần ba, compact vừa ngân sách 200 kết nối của pg-core gộp). org_replica do
  # mission-core ghi theo sự kiện tổ chức, tính vào poolCore với 1 kết nối (suy luận).
  poolKhac:
    L:       { pg-flowable: 20, pg-platform: 8, pg-iam: 10, pg-ledger: 10, pg-secure: 8 }
    M:       { pg-flowable: 10, pg-platform: 4, pg-iam: 5,  pg-ledger: 5,  pg-secure: 4 }
    S:       { pg-flowable: 6,  pg-platform: 3, pg-iam: 3,  pg-ledger: 3,  pg-secure: 3 }
    compact: { pg-flowable: 6,  pg-platform: 2, pg-iam: 3,  pg-ledger: 3,  pg-secure: 2 }

# Bố trí CSDL và schema theo TL-03 trong sáu cụm của TL-04/TL-05 (bảng ánh xạ ở wiki 14). tenantSchemas: schema
# trong mỗi CSDL tenant; databases: CSDL cố định và schema của nó. Mỗi schema có bốn vai trò svc_, ro_, mig_, cdc_.
layout:
  pg-core:     { zone: app, tenantSchemas: [config, policy, okr, task, product, appraisal, dossier, oversight, org_replica] }
  pg-flowable: { zone: app, databases: { flowable: [flowable] } }
  pg-platform: { zone: app, tenantSchemas: [org, scoring, evidence, docgen], databases: { cell_shared: [notify, integ] } }
  pg-iam:      { zone: app, databases: { iam: [iam] } }
  pg-ledger:   { zone: secure, databases: { ledger: [ledger] } }
  pg-secure:   { zone: secure, databases: { esign: [esign], ai: [ai] }, extensions: { ai: [vector] } }
# Gộp ở hồ sơ compact (TL-05): cụm đích ← các cụm nguồn.
consolidation:
  pg-core: [pg-core, pg-flowable, pg-platform, pg-iam]
  pg-ledger: [pg-ledger, pg-secure]
# Giới hạn kết nối của vai trò không phải svc_ (TL-03 mẫu: ro 20, cdc 5; mig suy luận).
roleLimits: { ro: 20, cdc: 5, mig: 10 }

# Ai được nối tới cụm (NetworkPolicy, TL-04 mục 3.6). rw/ro: namespace được nối Pooler tương ứng; migration: pod
# có nhãn vt.io/db-migration=true trong các namespace rw được nối thẳng dịch vụ <cụm>-rw (Flyway bằng vai trò mig_);
# cdc: namespace của Debezium (bản sao logic không đi qua PgBouncer). Cụm gộp nhận hợp của các cụm nguồn.
clients:
  pg-core:     { rw: [core], ro: [core, analytics] }
  pg-flowable: { rw: [core, workers] }
  pg-platform: { rw: [platform, workers, analytics], ro: [analytics, sao-luu] }   # sao-luu: kiểm mẫu minh chứng (INF-18)
  pg-iam:      { rw: [identity] }
  pg-ledger:   { rw: [secure] }
  pg-secure:   { rw: [secure] }
cdcNamespaces: [data-kafka]
observabilityNamespace: observability
# Cilium: thêm CiliumNetworkPolicy cho phép instance manager và Pooler gọi kube-apiserver.
cilium: true

# Bố trí node (TL-04 mục 3.3): cụm ứng dụng trên pool CSDL, pg-ledger và pg-secure trên security-zone.
placement:
  app:
    nodeSelector: { vt.io/pool: postgres }
    tolerations: [{ key: vt.io/pool, operator: Equal, value: postgres, effect: NoSchedule }]
  secure:
    nodeSelector: { vt.io/zone: secure }
    tolerations: [{ key: vt.io/zone, operator: Equal, value: secure, effect: NoSchedule }]
  # required ở cụm thật (ba vùng sự cố); compact chỉ một vùng nên hạ về preferred và khoá theo hostname.
  antiAffinity: required

# Mật khẩu vai trò: ExternalSecret từ OpenBao (ADR-17), khoá <path>/<cụm>/<vai trò>; INF-13 thay bằng secret động.
externalSecrets:
  enabled: true
  secretStore: { kind: ClusterSecretStore, name: openbao-cell }
  path: kv/data-pg
  refreshInterval: 1h

# Tài khoản quản trị của secret engine database trong OpenBao (INF-13, TL-04 mục 9.4): OpenBao tạo người dùng
# động "IN ROLE svc_<schema>" nên bao_admin cần ADMIN OPTION trên các vai trò svc_ của cụm. Từ PostgreSQL 16 quyền
# này chỉ siêu người dùng cấp được, nên khối SQL chạy một lần lúc initdb (postInitSQLRefs, CNPG chạy bằng postgres):
# tạo trước svc_<schema> rồi cấp cho bao_admin; managed.roles sau đó nhận quản lý các vai trò đó như thường.
# bao_admin không nằm trong managed.roles: CNPG đồng bộ toàn bộ thành viên vai trò theo inRoles và sẽ thu hồi các
# GRANT ... WITH ADMIN ở trên. Mật khẩu khởi tạo lấy từ OpenBao (<path>/<cụm>/bao_admin) và bị OpenBao đổi ngay bằng
# rotate-root. Schema thêm sau initdb: chạy khối cấp quyền theo runbook
# ops/runbooks/openbao-van-hanh.md.
baoAdmin:
  enabled: true
  name: bao_admin
  clusters: [pg-core]
  namespace: secure-data
  connectionLimit: 10

# Job cấp quyền theo TL-03 (chạy bằng vai trò mig_<schema>, không cần superuser).
grantsJob:
  enabled: true
  image:
    repository: harbor.vt.local/platform/postgresql
    digest: sha256:a62c149a342b2b1955dda3a9d75e2c6851622e43302a577f393271c19a3c8622

monitoring:
  enablePodMonitor: true

# Sao lưu theo thời điểm bằng plugin Barman Cloud (INF-17, TL-04 mục 8.2, bảng lịch sao lưu): mỗi cụm một ObjectStore
# trỏ tới bucket bk-cell-<mã>-pg của kho sao lưu ceph-sn-bk (bucket và Object Lock khai ở rgw-cell
# values-kho-sao-luu.yaml), WAL liên tục (archive_timeout 60 s ở parameters) và bản nền hằng ngày 01:30 từ standby,
# sau đối chiếu điểm OPS-21 lúc 00:30. retentionPolicy chỉ để CNPG đánh dấu bản hết hạn trong danh mục: khoá S3
# không có quyền xoá, vòng đời của bucket dọn bản quá 35 ngày. Bản cuối tháng, cuối năm do job giu-dai-han của chart
# backup-cell chép sang dai-han/.
backup:
  enabled: true
  # Plugin barman-cloud.cloudnative-pg.io (plugin-barman-cloud v0.15.1) phải cài cùng CNPG trong cnpg-system.
  plugin: barman-cloud.cloudnative-pg.io
  # Tên ObjectStore: <tiền tố>-<cụm> (TL-04: bk-sn-pg-core).
  objectStorePrefix: bk-sn
  endpoint: https://s3-bk.sn.vt.local
  # Bucket: rỗng là bk-cell-<global.cell>-pg; đường dẫn đích s3://<bucket>/<cụm>.
  bucket: ""
  # CA nội bộ để kiểm TLS của RGW (Secret trust bundle của cert-manager trong namespace của cụm); null khi dùng http.
  endpointCA: { name: vt-noi-bo-ca, key: ca.crt }
  # Khoá S3 của cell (OpenBao kv/cell-<mã>/backup/pg, SEC-10) thành Secret bk-sn-s3-pg trong namespace của cụm.
  credentials:
    secretName: bk-sn-s3-pg
    path: ""          # rỗng: kv/cell-<global.cell>/backup/pg
  retentionPolicy: 35d
  wal: { compression: zstd, encryption: AES256, maxParallel: 8 }
  # Nén: CRD ObjectStore của plugin v0.15.1 nhận WAL bzip2, gzip, lz4, snappy, xz, zstd; bản nền bzip2, gzip, lz4,
  # snappy (không có zstd như mẫu TL-04, wiki 14), chọn lz4. Kiểm bằng kubeconform phải đặt schema ghim
  # vt-platform/ci/crd-schemas (sinh từ CRD v0.15.1) trước kho datree: kho datree còn giữ CRD cũ (v0.6) chưa có lz4
  # cho bản nền nên báo sai 6 ObjectStore.
  data: { compression: lz4, encryption: AES256, jobs: 4, immediateCheckpoint: false }
  sidecar:
    resources:
      requests: { cpu: 500m, memory: 512Mi }
      limits: { cpu: "2", memory: 1Gi }
  # Lịch CNPG (có trường giây) tính theo UTC: 18:30:00 UTC là 01:30 giờ Việt Nam, đúng mốc TL-04 (sau OPS-21 00:30).
  schedule: "0 30 18 * * *"
  target: prefer-standby
  # Đích mạng của instance tới kho sao lưu (NetworkPolicyPeer): mặc định khối địa chỉ RGW kho sao lưu khai theo cell;
  # ở kind là pod MinIO trong cụm.
  egressTo: []
  egressPort: 443

# INF-28 · Bản sao ấm ở TTDL thứ hai (TL-04 "PostgreSQL: CloudNativePG và Barman Cloud", replica cluster; DR-10,
# DR-16). Bật ở values của cả hai TTDL (cells/<cell>/values-<site>.yaml): mỗi cụm khai cùng một manifest theo
# distributed topology của CNPG (replica.self, replica.primary, externalClusters cho cả hai TTDL). Cụm nào là
# primary suy ra từ global.siteRole do ApplicationSet tính từ primarySite trong cells/<cell>/cell.yaml, nên chuyển
# vùng có kế hoạch là một commit đổi primarySite: CNPG hạ cấp cụm cũ, ghi WAL cuối rồi promote cụm mới.
replica:
  enabled: false
  sites: [hl, sn]
  # TTDL khởi tạo cụm bằng initdb (giữ cố định sau lần dựng đầu, bootstrap không đổi khi chuyển vùng); TTDL kia
  # dựng bằng pg_basebackup từ cụm này.
  initdbSite: hl
  # Địa chỉ dịch vụ rw của cụm ở từng TTDL, các %s lần lượt: tên cụm, namespace, mã cell, TTDL (TL-04: ví dụ
  # pg-core-rw.data-pg.cell-hcm-hl.vt.local). Mạng liên TTDL và DNS nội bộ xuất các tên này.
  hostFormat: "%s-rw.%s.cell-%s-%s.vt.local"
  # Chứng thư client streaming_replica (do CA của cụm bên kia ký) và CA máy chủ của cụm bên kia, đồng bộ qua
  # OpenBao PKI (tên Secret: %s là tên cụm, rồi TTDL của CA).
  replicationSecretFormat: "%s-replication"
  caSecretFormat: "%s-ca-%s"
  # Dải địa chỉ node của cụm TTDL kia được mở 5432 tới instance (luồng WAL hai chiều để quay về, DR-16).
  peerCIDRs: []
  # Nguồn WAL dự phòng từ kho Barman Cloud của INF-17 (ObjectStore <backup.objectStorePrefix>-<cụm>, cần
  # backup.enabled): khi luồng streaming đứt, cụm chờ đọc WAL của TTDL kia từ kho. Hai TTDL ghi chung một bucket nên
  # serverName phải khác nhau: TTDL initdbSite giữ tên cụm (restore-check và runbook sao lưu của INF-17 không đổi),
  # TTDL kia dùng <cụm>-<ttdl> (cùng quy ước với global-pg).
  walArchive:
    enabled: true
