{{- /*
Mật khẩu bốn vai trò mỗi schema, nạp từ OpenBao (ADR-17) vào secret kiểu basic-auth mà managed.roles của CNPG và
ứng dụng đọc. Khoá OpenBao: <path>/<cụm>/<vai trò>, thuộc tính password. Không có mật khẩu nào trong chart.
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- $root := . }}
{{- $v := .Values }}
{{- $cums := fromYaml (include "data-pg.clusters" .) }}
{{- range $ten, $c := $cums }}
{{- range $s := fromYamlArray (include "data-pg.schemas" $c) }}
{{- range $loai := list "mig" "svc" "ro" "cdc" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $ten }}-{{ $loai }}-{{ $s | replace "_" "-" }}
  namespace: {{ include "data-pg.ns" (dict "root" $root "zone" $c.zone) }}
  labels:
    {{- include "data-pg.labels" $root | nindent 4 }}
spec:
  refreshInterval: {{ $v.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $v.externalSecrets.secretStore.kind }}
    name: {{ $v.externalSecrets.secretStore.name }}
  target:
    name: {{ $ten }}-{{ $loai }}-{{ $s | replace "_" "-" }}
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: {{ $loai }}_{{ $s }}
        password: "{{ "{{ .password }}" }}"
  data:
    - secretKey: password
      remoteRef:
        key: {{ $v.externalSecrets.path }}/{{ $ten }}/{{ $loai }}_{{ $s }}
        property: password
{{- end }}
{{- end }}
{{- end }}
{{- end }}
