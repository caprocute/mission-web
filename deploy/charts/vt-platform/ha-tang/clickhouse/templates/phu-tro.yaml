{{- $v := .Values }}
{{- $ns := $v.namespace }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: clickhouse-tls
  namespace: {{ $ns }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  secretName: clickhouse-tls
  duration: {{ $v.tls.duration }}
  renewBefore: {{ $v.tls.renewBefore }}
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
  usages: [server auth, client auth]
  commonName: clickhouse-analytics.{{ $ns }}.svc
  dnsNames:
    - clickhouse-analytics.{{ $ns }}.svc
    - "*.{{ $ns }}.svc"
    - "*.{{ $ns }}.svc.cluster.local"
  issuerRef:
    {{- toYaml $v.tls.issuerRef | nindent 4 }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-users
  namespace: {{ $ns }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $v.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $v.externalSecrets.secretStore.kind }}
    name: {{ $v.externalSecrets.secretStore.name }}
  target:
    name: clickhouse-users
  data:
    {{- range $ten, $u := $v.users }}
    - { secretKey: {{ $ten }}, remoteRef: { key: {{ $v.externalSecrets.path }}/{{ $ten }}, property: password } }
    {{- end }}
---
{{- $khach := list }}
{{- range $ten, $u := $v.users }}{{ if $u.namespace }}{{ $khach = append $khach $u.namespace }}{{ end }}{{ end }}
# Bổ sung default-deny của cell-base: chỉ cổng TLS 8443/9440 cho client, 9010 sao chép giữa bản sao, 2181/9234
# Keeper trong namespace; operator đọc 8443 và cổng số liệu 8888 của nó.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse
  namespace: {{ $ns }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: clickhouse }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse } }
      ports: [{ port: 9010, protocol: TCP }, { port: 9440, protocol: TCP }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $v.operatorNamespace }} } }
        {{- range ($khach | uniq | sortAlpha) }}
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ . }} } }
        {{- end }}
      ports: [{ port: 8443, protocol: TCP }, { port: 9440, protocol: TCP }]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse } }
      ports: [{ port: 9010, protocol: TCP }, { port: 9440, protocol: TCP }]
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse-keeper } }
      ports: [{ port: 2181, protocol: TCP }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-keeper
  namespace: {{ $ns }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: clickhouse-keeper }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse } }
        - podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse-keeper } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ $v.operatorNamespace }} } }
      ports: [{ port: 2181, protocol: TCP }]
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse-keeper } }
      ports: [{ port: 9234, protocol: TCP }]
  egress:
    - to:
        - podSelector: { matchLabels: { app.kubernetes.io/name: clickhouse-keeper } }
      ports: [{ port: 9234, protocol: TCP }, { port: 2181, protocol: TCP }]
{{- with $v.saoLuu }}{{ if .enabled }}
---
# Khoá S3 của cell trên kho sao lưu (OpenBao kv/cell-<mã>/backup/ch, quyền đọc, ghi, liệt kê; không xoá).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .credentials.secretName }}
  namespace: {{ $ns }}
  labels:
    {{- include "clickhouse.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $v.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $v.externalSecrets.secretStore.kind }}
    name: {{ $v.externalSecrets.secretStore.name }}
  target:
    name: {{ .credentials.secretName }}
    creationPolicy: Owner
  data:
    {{- range $k := list "ACCESS_KEY_ID" "ACCESS_SECRET_KEY" }}
    - secretKey: {{ $k }}
      remoteRef: { key: {{ $v.saoLuu.credentials.path | default (printf "kv/cell-%s/backup/ch" ($v.global.cell | lower)) }}, property: {{ $k }} }
    {{- end }}
{{- with .egressTo }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-ra-kho-sao-luu
  namespace: {{ $ns }}
  labels:
    {{- include "clickhouse.labels" $ | nindent 4 }}
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: clickhouse }
  policyTypes: [Egress]
  egress:
    - to:
        {{- toYaml . | nindent 8 }}
      ports: [{ port: {{ $v.saoLuu.egressPort }}, protocol: TCP }]
{{- end }}
{{- end }}{{ end }}
