{{- $v := .Values }}
{{- $ns := $v.namespace }}
{{- $hs := index $v.hoSo ($v.global.sizing | default "L") }}
{{- if not $hs }}{{ fail (printf "clickhouse: không có hồ sơ định cỡ %s" $v.global.sizing) }}{{ end }}
{{- $motVung := eq ($v.global.sizing | default "L") "compact" }}
apiVersion: clickhouse-keeper.altinity.com/v1
kind: ClickHouseKeeperInstallation
metadata:
  name: keeper
  namespace: {{ $ns }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  defaults:
    templates:
      podTemplate: keeper
      dataVolumeClaimTemplate: keeper-data
  configuration:
    clusters:
      - name: keeper
        layout:
          replicasCount: 3
  templates:
    podTemplates:
      - name: keeper
        metadata:
          labels: { app.kubernetes.io/name: clickhouse-keeper }
        spec:
          automountServiceAccountToken: false
          securityContext:
            {{- include "clickhouse.podSec" . | nindent 12 }}
          nodeSelector:
            {{- toYaml $v.placement.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml $v.placement.tolerations | nindent 12 }}
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: {{ ternary "kubernetes.io/hostname" "topology.kubernetes.io/zone" $motVung }}
              whenUnsatisfiable: DoNotSchedule
              labelSelector: { matchLabels: { app.kubernetes.io/name: clickhouse-keeper } }
          containers:
            - name: clickhouse-keeper
              image: {{ include "clickhouse.anh" $v.keeperImage | quote }}
              resources:
                requests: { cpu: {{ $hs.keeper.cpu | quote }}, memory: {{ $hs.keeper.memory }} }
                limits: { cpu: {{ $hs.keeper.cpu | quote }}, memory: {{ $hs.keeper.memory }} }
              securityContext:
                {{- include "clickhouse.ctrSec" . | nindent 16 }}
    volumeClaimTemplates:
      - name: keeper-data
        spec:
          storageClassName: {{ $v.storageClass }}
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: {{ $v.keeperDisk }} } }
---
apiVersion: clickhouse.altinity.com/v1
kind: ClickHouseInstallation
metadata:
  name: analytics
  namespace: {{ $ns }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  defaults:
    templates:
      podTemplate: clickhouse
      dataVolumeClaimTemplate: data
  configuration:
    zookeeper:
      nodes:
        - { host: keeper-keeper.{{ $ns }}.svc, port: 2181 }
    profiles:
      readonly/readonly: 1
    users:
      # default chỉ dùng nội bộ pod; người dùng khác qua mật khẩu từ OpenBao (SEC-57).
      default/networks/ip: ["::1", "127.0.0.1"]
      {{- range $ten, $u := $v.users }}
      {{ $ten }}/password:
        valueFrom: { secretKeyRef: { name: clickhouse-users, key: {{ $ten }} } }
      {{ $ten }}/profile: {{ $u.profile }}
      {{ $ten }}/networks/ip: ["0.0.0.0/0"]
      {{- with $u.grants }}
      {{ $ten }}/grants/query: {{ toJson . }}
      {{- end }}
      {{- end }}
    files:
      config.d/tls.xml: |
        <clickhouse>
          <http_port remove="1"/>
          <tcp_port remove="1"/>
          <interserver_http_port remove="1"/>
          <https_port>8443</https_port>
          <tcp_port_secure>9440</tcp_port_secure>
          <interserver_https_port>9010</interserver_https_port>
          <openSSL>
            <server>
              <certificateFile>/etc/clickhouse-server/tls/tls.crt</certificateFile>
              <privateKeyFile>/etc/clickhouse-server/tls/tls.key</privateKeyFile>
              <caConfig>/etc/clickhouse-server/tls/ca.crt</caConfig>
              <verificationMode>relaxed</verificationMode>
              <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1,tlsv1_2</disableProtocols>
              <preferServerCiphers>true</preferServerCiphers>
            </server>
            <client>
              <certificateFile>/etc/clickhouse-server/tls/tls.crt</certificateFile>
              <privateKeyFile>/etc/clickhouse-server/tls/tls.key</privateKeyFile>
              <caConfig>/etc/clickhouse-server/tls/ca.crt</caConfig>
              <verificationMode>strict</verificationMode>
              <disableProtocols>sslv2,sslv3,tlsv1,tlsv1_1,tlsv1_2</disableProtocols>
            </client>
          </openSSL>
        </clickhouse>
      {{- with $v.saoLuu }}{{ if .enabled }}
      # Kho sao lưu phía Nam cho BACKUP/RESTORE (INF-18, TL-04 mục 8.8): khoá S3 không viết trong câu lệnh mà lấy từ
      # biến môi trường do Secret ESO nạp; tên tập hợp dùng trong câu lệnh: S3({{ .namedCollection }}, '<tên bản>').
      config.d/sao-luu.xml: |
        <clickhouse>
          <named_collections>
            <{{ .namedCollection }}>
              <url>{{ include "clickhouse.urlSaoLuu" $ }}</url>
              <access_key_id from_env="BK_SN_ACCESS_KEY_ID"/>
              <secret_access_key from_env="BK_SN_SECRET_ACCESS_KEY"/>
            </{{ .namedCollection }}>
          </named_collections>
        </clickhouse>
      {{- end }}{{ end }}
    clusters:
      - name: analytics
        secure: "yes"
        insecure: "no"
        layout:
          shardsCount: {{ $hs.shards }}
          replicasCount: {{ $hs.replicas }}
  templates:
    podTemplates:
      - name: clickhouse
        metadata:
          labels: { app.kubernetes.io/name: clickhouse }
        spec:
          automountServiceAccountToken: false
          securityContext:
            {{- include "clickhouse.podSec" . | nindent 12 }}
          nodeSelector:
            {{- toYaml $v.placement.nodeSelector | nindent 12 }}
          tolerations:
            {{- toYaml $v.placement.tolerations | nindent 12 }}
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: {{ ternary "kubernetes.io/hostname" "topology.kubernetes.io/zone" $motVung }}
              whenUnsatisfiable: DoNotSchedule
              labelSelector: { matchLabels: { app.kubernetes.io/name: clickhouse } }
          containers:
            - name: clickhouse
              image: {{ include "clickhouse.anh" $v.image | quote }}
              resources:
                requests: { cpu: {{ $hs.cpu | quote }}, memory: {{ $hs.memory }} }
                limits: { cpu: {{ $hs.cpu | quote }}, memory: {{ $hs.memory }} }
              {{- with $v.saoLuu }}{{ if .enabled }}
              env:
                - { name: BK_SN_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: {{ .credentials.secretName }}, key: ACCESS_KEY_ID } } }
                - { name: BK_SN_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: {{ .credentials.secretName }}, key: ACCESS_SECRET_KEY } } }
              {{- end }}{{ end }}
              securityContext:
                {{- include "clickhouse.ctrSec" . | nindent 16 }}
              volumeMounts:
                - { name: tls, mountPath: /etc/clickhouse-server/tls, readOnly: true }
          volumes:
            - name: tls
              secret: { secretName: clickhouse-tls, defaultMode: 0440 }
    volumeClaimTemplates:
      - name: data
        spec:
          storageClassName: {{ $v.storageClass }}
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: {{ $hs.disk }} } }
