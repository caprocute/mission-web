# OpenSearch (INF-11) qua OpenSearch Kubernetes Operator 3.0 (API opensearch.org/v1); lý do chọn ở wiki 14.
global:
  cell: ""
  sizing: L

namespace: data-search
version: 2.19.3
image:
  repository: harbor.vt.local/dockerhub/opensearchproject/opensearch
  tag: 2.19.3
  digest: sha256:e96cc6ae1500a073d973c0906f30f7cf4d9c461f32f855f9242a2da933660cdd

# TL-05 bảng "OpenSearch và ClickHouse": compact, S ba nút vai trò kép; M, L ba nút quản lý và ba nút dữ liệu.
# disk: dung lượng mỗi nút dữ liệu (M theo TL-05 phụ lục A; hồ sơ khác suy luận từ GD-18 × 3 năm × 2 bản).
hoSo:
  compact: { kep: { cpu: "2", memory: 8Gi, heap: 4g, disk: 100Gi } }
  S:       { kep: { cpu: "4", memory: 16Gi, heap: 8g, disk: 500Gi } }
  M:
    quanLy: { cpu: "1", memory: 2Gi, heap: 1g, disk: 10Gi }
    duLieu: { cpu: "6", memory: 24Gi, heap: 12g, disk: 1536Gi }
  L:
    quanLy: { cpu: "2", memory: 4Gi, heap: 2g, disk: 10Gi }
    duLieu: { cpu: "8", memory: 32Gi, heap: 16g, disk: 2Ti }

storageClass: nvme-local
placement:
  nodeSelector: { vt.io/pool: search }
  tolerations: [{ key: vt.io/pool, operator: Equal, value: search, effect: NoSchedule }]
  # vm.max_map_count=262144 đặt sẵn trên node pool data-search (kubeadm của Cluster API); Pod Security restricted
  # không cho init container đặc quyền nên không bật setVMMaxMapCount.
  setVMMaxMapCount: false

tls:
  issuerRef: { kind: ClusterIssuer, name: openbao-pki-cell }
  duration: 2160h
  renewBefore: 720h
  # DN của chứng thư nút và chứng thư quản trị (dùng cho securityadmin của operator).
  nodesDn: "CN=opensearch-node,O=vt-platform"
  adminDn: "CN=opensearch-admin,O=vt-platform"

# Mật khẩu ở OpenBao <path>/<tên>, thuộc tính password. admin chỉ cho operator; service dùng người dùng riêng.
externalSecrets:
  secretStore: { kind: ClusterSecretStore, name: openbao-cell }
  path: kv/opensearch
  refreshInterval: 1h

# Vai trò theo service (chỉ mục do search-service sở hữu, TL-03; snapshot theo TL-04 mục 6.8).
roles:
  search-service:
    indexPatterns: ["okr-*", "mission-*", "evidence-*", "org-*"]
    allowedActions: [crud, create_index, manage_aliases, indices_monitor]
    clusterPermissions: [cluster_monitor, cluster_composite_ops]
  # Khôi phục thử hằng tuần của backup-cell (INF-18): đọc danh mục snapshot, khôi phục vào khoi-phuc-thu-*, đếm tài liệu
  # của chỉ mục gốc rồi xoá chỉ mục tạm; không ghi được chỉ mục thật.
  sao-luu:
    indexPatterns: ["okr-*", "mission-*", "evidence-*", "org-*"]
    allowedActions: [indices_monitor]
    them:
      - { indexPatterns: ["khoi-phuc-thu-*"], allowedActions: [indices_all] }
    clusterPermissions: [cluster_monitor, "cluster:admin/snapshot/get", "cluster:admin/repository/get", "cluster:admin/snapshot/restore"]
users:
  search-service: { roles: [search-service], namespace: platform }
  sao-luu: { roles: [sao-luu], namespace: sao-luu }
  vt-giam-sat: { roles: [readall_and_monitor] }

observabilityNamespace: observability
operatorNamespace: opensearch-operator-system

# Snapshot sang kho sao lưu phía Nam (INF-18, TL-04 mục 8.8, bảng lịch sao lưu): repo bk-sn trên bucket
# bk-cell-<mã>-os (Object Lock 14 ngày), chính sách Snapshot Management daily-to-sn tạo 02:00, xoá 04:00, giữ 7–14
# bản. Plugin repository-s3 cài lúc khởi động (operator chạy opensearch-plugin install); môi trường không ra Internet
# đặt plugin là URL tệp zip trên kho nội bộ cùng phiên bản OpenSearch (suy luận). Khoá S3 ở OpenBao
# kv/cell-<mã>/backup/os (ACCESS_KEY_ID, ACCESS_SECRET_KEY), quyền đọc, ghi, liệt kê và tạo delete marker.
snapshot:
  enabled: true
  repository: bk-sn
  bucket: ""             # rỗng: bk-cell-<global.cell>-os
  basePath: opensearch
  endpoint: s3-bk.sn.vt.local
  protocol: https
  region: sn-bk
  plugin: repository-s3
  credentials: { secretName: bk-sn-s3-os, path: "" }   # path rỗng: kv/cell-<mã>/backup/os
  policy:
    name: daily-to-sn
    description: Snapshot hằng ngày sang kho sao lưu phía Nam
    timezone: Asia/Ho_Chi_Minh
    tao: "0 2 * * *"
    xoa: "0 4 * * *"
    maxCount: 14
    minCount: 7
    indices: "okr-*,mission-*,evidence-*,org-*"
  # Đích mạng tới RGW kho sao lưu (NetworkPolicyPeer), khai theo cell như backup-cell.
  egressTo: []
  egressPort: 443
