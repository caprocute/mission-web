{{- $g := .Values.gateway }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $g.name }}
  namespace: egress
data:
  envoy.yaml: |
    # Proxy CONNECT: chỉ mở đường hầm tới đích:cổng có trong danh sách (lớp 1); Cilium toFQDNs chặn lại ở mạng (lớp 2).
    admin:
      address: { socket_address: { address: 127.0.0.1, port_value: 9901 } }
    static_resources:
      listeners:
        - name: connect
          address: { socket_address: { address: 0.0.0.0, port_value: {{ $g.port }} } }
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: egress
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                          log_format:
                            json_format:
                              "@timestamp": "%START_TIME%"
                              event.dataset: "egress.connect"
                              destination.address: "%REQ(:AUTHORITY)%"
                              http.response.status_code: "%RESPONSE_CODE%"
                              source.address: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
                              event.duration: "%DURATION%"
                    route_config:
                      virtual_hosts:
                        - name: duoc-phep
                          domains:
                            {{- range .Values.destinations }}
                            {{- $ten := default .fqdn .pattern }}
                            {{- range .ports }}
                            - {{ printf "%s:%v" $ten . | quote }}
                            {{- end }}
                            {{- end }}
                          routes:
                            - match: { connect_matcher: {} }
                              route:
                                cluster: dynamic_forward_proxy
                                upgrade_configs: [{ upgrade_type: CONNECT, connect_config: {} }]
                        - name: tu-choi
                          domains: ["*"]
                          routes:
                            - match: { connect_matcher: {} }
                              direct_response: { status: 403 }
                            - match: { prefix: "/" }
                              direct_response: { status: 403 }
                    http_filters:
                      - name: envoy.filters.http.dynamic_forward_proxy
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                          dns_cache_config: { name: dns, dns_lookup_family: V4_ONLY }
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: dynamic_forward_proxy
          lb_policy: CLUSTER_PROVIDED
          cluster_type:
            name: envoy.clusters.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
              dns_cache_config: { name: dns, dns_lookup_family: V4_ONLY }
