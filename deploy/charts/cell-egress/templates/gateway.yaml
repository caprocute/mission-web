{{- $g := .Values.gateway }}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" $g.image.digest) }}{{ fail "cell-egress: ảnh egress gateway phải ghim digest sha256 (SEC-55)" }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $g.name }}
  namespace: egress
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $g.name }}
  namespace: egress
  labels: { app.kubernetes.io/name: {{ $g.name }}, app.kubernetes.io/part-of: vt-platform }
spec:
  replicas: {{ $g.replicas }}
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $g.name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: {{ $g.name }}, app.kubernetes.io/part-of: vt-platform }
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ $g.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
        # Lắng nghe cổng 443 mà không cần quyền root hay NET_BIND_SERVICE (sysctl an toàn, Pod Security cho phép).
        sysctls:
          - { name: net.ipv4.ip_unprivileged_port_start, value: "0" }
      {{- with $g.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app.kubernetes.io/name: {{ $g.name }} }
      containers:
        - name: envoy
          image: "{{ $g.image.repository }}@{{ $g.image.digest }}"
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-format", "%L%m%d %T.%e %t envoy] [%t][%n]%v"]
          ports:
            - { name: connect, containerPort: {{ $g.port }}, protocol: TCP }
          readinessProbe:
            tcpSocket: { port: connect }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: connect }
            periodSeconds: 10
          resources:
            {{- toYaml $g.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: cau-hinh, mountPath: /etc/envoy, readOnly: true }
      volumes:
        - name: cau-hinh
          configMap: { name: {{ $g.name }} }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $g.name }}
  namespace: egress
  labels: { app.kubernetes.io/name: {{ $g.name }} }
spec:
  selector: { app.kubernetes.io/name: {{ $g.name }} }
  ports:
    # appProtocol tcp: waypoint xử lý ở tầng 4 (đường hầm CONNECT không qua bộ lọc HTTP của waypoint).
    - { name: connect, port: {{ $g.port }}, targetPort: connect, protocol: TCP, appProtocol: tcp }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $g.name }}
  namespace: egress
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: {{ $g.name }} }
