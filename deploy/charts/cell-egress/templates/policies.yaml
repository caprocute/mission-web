{{- $g := .Values.gateway }}
# Chỉ egress gateway ra ngoài cụm, và chỉ tới FQDN trong danh sách (TL-04 mục 9.5, SEC-36). Truy vấn DNS đi qua
# proxy DNS của Cilium để toFQDNs học địa chỉ IP; luồng ngoài danh sách bị chặn và Hubble ghi lại.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-allowlist
  namespace: egress
spec:
  endpointSelector:
    matchLabels: { app.kubernetes.io/name: {{ $g.name }} }
  egress:
    - toEndpoints:
        - matchLabels: { k8s:io.kubernetes.pod.namespace: kube-system, k8s-app: kube-dns }
      toPorts:
        - ports: [{ port: "53", protocol: UDP }, { port: "53", protocol: TCP }]
          rules: { dns: [{ matchPattern: "*" }] }
    {{- range .Values.destinations }}
    # {{ .name }}
    - toFQDNs:
        {{- if .fqdn }}
        - matchName: {{ .fqdn | quote }}
        {{- else }}
        - matchPattern: {{ .pattern | quote }}
        {{- end }}
      toPorts:
        - ports:
            {{- range .ports }}
            - { port: {{ . | quote }}, protocol: TCP }
            {{- end }}
    {{- end }}
---
# Người gọi trong vùng ứng dụng và bảo mật tới egress gateway (cổng ứng dụng, và HBONE khi không qua waypoint).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $g.name }}-ingress
  namespace: egress
spec:
  podSelector:
    matchLabels: { app.kubernetes.io/name: {{ $g.name }} }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - { key: kubernetes.io/metadata.name, operator: In, values: {{ toJson .Values.callerNamespaces }} }
      ports:
        - { protocol: TCP, port: {{ $g.port }} }
        - { protocol: TCP, port: 15008 }
---
# Lớp mesh: chỉ danh tính thuộc namespace người gọi được mở đường hầm (thực thi ở waypoint của namespace egress).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ $g.name }}
  namespace: egress
spec:
  targetRefs:
    - kind: Service
      group: ""
      name: {{ $g.name }}
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: {{ toJson .Values.callerNamespaces }}
      to:
        - operation:
            ports: [{{ $g.port | quote }}]
{{- if .Values.denyWorld.enabled }}
---
# Mọi pod ngoài namespace egress (và kube-system: CoreDNS chuyển tiếp DNS ra máy chủ phân giải của node) không ra
# được ngoài cụm (SEC-36). Luật từ chối của Cilium thắng mọi luật cho phép, nên không chính sách nào khác mở lại được.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: chan-ra-ngoai-cum
spec:
  description: Chặn ra ngoài cụm cho mọi pod ngoài namespace egress (SEC-36, INF-09)
  enableDefaultDeny: { ingress: false, egress: false }
  endpointSelector:
    matchExpressions:
      - { key: k8s:io.kubernetes.pod.namespace, operator: NotIn, values: ["egress", "kube-system"] }
  egressDeny:
    {{- if .Values.denyWorld.exceptCIDRs }}
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except: {{ toJson .Values.denyWorld.exceptCIDRs }}
    {{- else }}
    - toEntities: ["world"]
    {{- end }}
{{- end }}
{{- if .Values.alerts.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vt-egress
  namespace: observability
  labels: { app.kubernetes.io/part-of: vt-observability }
spec:
  groups:
    - name: egress
      rules:
        # SEC-36: một luồng ra ngoài cụm bị chặn (đích ngoài danh sách hoặc pod ngoài namespace egress).
        - alert: EgressFlowDenied
          expr: sum by (source) (rate(hubble_drop_total{reason="POLICY_DENIED", destination!~".*\\.svc\\.cluster\\.local|10\\..*"}[5m])) > 0
          for: 1m
          labels: { severity: warning, sec: SEC-36 }
          annotations:
            summary: "Luồng ra ngoài bị chặn từ {{`{{ $labels.source }}`}}"
            description: "Hubble ghi luồng ra ngoài cụm bị chính sách chặn. Kiểm tra đích có cần đưa vào danh sách cổng ra (SVC-13) hay là dấu hiệu bất thường."
        # SEC-32: NetworkPolicy chặn luồng trong cụm kéo dài (cấu hình lệch hoặc thử dò quét).
        - alert: NetworkPolicyDropsSustained
          expr: sum by (source) (rate(hubble_drop_total{reason="POLICY_DENIED"}[10m])) > 1
          for: 10m
          labels: { severity: warning, sec: SEC-32 }
          annotations:
            summary: "Luồng bị NetworkPolicy chặn kéo dài từ {{`{{ $labels.source }}`}}"
            description: "Hubble ghi luồng bị chặn liên tục hơn 10 phút. Đối chiếu với bảng luồng được phép (TL-04 mục 3.6)."
{{- end }}
