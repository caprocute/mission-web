apiVersion: v1
kind: Service
metadata:
  name: {{ include "workflow-service.fullname" . }}
  namespace: {{ include "workflow-service.namespace" . }}
  labels:
    {{- include "workflow-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 8081
      targetPort: management
      protocol: TCP
      name: management
  selector:
    {{- include "workflow-service.apiSelectorLabels" . | nindent 4 }}
