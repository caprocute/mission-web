apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Values.api.name }}-pdb
  namespace: {{ include "workflow-service.namespace" . }}
  labels:
    {{- include "workflow-service.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "workflow-service.apiSelectorLabels" . | nindent 6 }}
