# Cấu hình Helm chart SVC-06 workflow-service (TL-01 mục 5.6.3 & chương 8 mục 8.8 · DV-06-01).
# Tách 2 Deployment dùng chung image:
# - workflow-api: WF_ASYNC_ENABLED=false, co giãn theo CPU 3..12 pod, kèm cửa sổ tăng trước mốc hạn (INF-16)
# - workflow-executor: WF_ASYNC_ENABLED=true, KEDA 2..10 pod theo số job Flowable đến hạn (TL-04 mục 6.6, INF-16)

image:
  repository: harbor.invalid/mission/workflow-service
  tag: "0.1.0"
  pullPolicy: IfNotPresent

api:
  name: workflow-api
  replicaCount: 3
  asyncEnabled: "false"
  hpa:
    enabled: true
    minReplicas: 3
    maxReplicas: 12
    targetCpuUtilizationPercentage: 70
  # Số pod tối thiểu trong cửa sổ deadline-default (TL-04 mục 6.4): "workflow API 6" trước hạn báo cáo quý,
  # "workflow 8" trước hạn hồ sơ năm. Có cửa sổ thì HPA được thay bằng ScaledObject (CPU + cron).
  tangTruoc:
    dauQuy: 6
    hoSoNam: 8

executor:
  name: workflow-executor
  replicaCount: 2
  asyncEnabled: "true"
  keda:
    enabled: true
    minReplicaCount: 2
    maxReplicaCount: 10
    pollingInterval: 15
    cooldownPeriod: 600
    cpuUtilization: 75
    # Trigger chính theo TL-04 mục 6.6; query rỗng thì dùng trigger postgresql ở dưới.
    prometheus:
      serverAddress: http://prometheus-operated.observability.svc:9090
      query: max(flowable_async_jobs_due_unlocked{namespace="core"})
      threshold: "400"
      activationThreshold: "50"
    targetQueryValue: "500"
    query: >-
      SELECT count(*) FROM flowable.act_ru_job
      WHERE lock_owner_ IS NULL AND (duedate_ IS NULL OR duedate_ <= now())
    authenticationRefName: keda-flowable-pg
  # Cửa sổ tăng trước: "executor 6" trước hạn báo cáo quý (TL-04 mục 6.4); "workflow 8" trước hạn hồ sơ năm
  # áp cho cả API và executor (suy luận).
  tangTruoc:
    dauQuy: 6
    hoSoNam: 8

# behavior chuẩn của HPA cho service API (TL-04 mục 6.2), dùng cho cả hai ScaledObject.
behavior:
  scaleUp:
    stabilizationWindowSeconds: 0
    selectPolicy: Max
    policies:
      - { type: Percent, value: 100, periodSeconds: 30 }
      - { type: Pods, value: 4, periodSeconds: 30 }
  scaleDown:
    stabilizationWindowSeconds: 600
    policies:
      - { type: Percent, value: 20, periodSeconds: 120 }

database:
  url: jdbc:postgresql://pg-flowable-pooler-rw.data-pg.svc:5432/flowable?currentSchema=flowable
  appSecret: flowable-db-svc-flowable
  migrationSecret: flowable-db-mig-flowable

oidc:
  issuerUri: https://sso.invalid/realms/mission

otel:
  endpoint: http://otel-collector.observability:4317

migration:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 600

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 1Gi

jvm:
  opts: "-XX:MaxRAMPercentage=70.0 -XX:+UseZGC -XX:+ZGenerational -XX:+ExitOnOutOfMemoryError -Djava.io.tmpdir=/tmp"

podDisruptionBudget:
  minAvailable: 2

networkPolicy:
  enabled: true
  ingressNamespaces: [gateway, mission-core]
  monitoringNamespace: observability
  databaseNamespace: flowable-db
  databasePort: 5432

serviceAccount:
  create: true
  name: ""

# DV-06-11 · TL-01 bảng "Chỉ số giám sát Flowable" (G2): cảnh báo hai ngưỡng và bảng Grafana. Ngưỡng lấy đúng bảng
# TL-01; đổi theo cell khi đo thực tế (YC-PT-19: chưa đo tải ở giai đoạn này).
monitoring:
  alerts:
    enabled: true
    runbookBase: https://runbook.vt.local/okr
    namespace: core
    thresholds:
      dueUnlocked: { warning: 2000, critical: 10000 }
      acquireLagP95Seconds: { warning: 10, critical: 60 }
      deadletterPerHour: { warning: 10, critical: 100 }
      optimisticLockingRatio: { warning: 0.005, critical: 0.02 }
      completeP95Seconds: { warning: 0.3, critical: 0.8 }
      externalWorkerP95Seconds: { warning: 30, critical: 300 }
      ruExecutionRows: { warning: 5000000, critical: 10000000 }
      historyGrowthFactor: { warning: 1.5 }
      definitionCacheMissRatio: { warning: 0.01, critical: 0.05 }
      poolUsageRatio: { warning: 0.7, critical: 0.9 }
      activeDefinitions: { warning: 300, critical: 1000 }
  dashboard:
    enabled: true
    # Nhãn để sidecar Grafana nạp ConfigMap (kube-prometheus-stack mặc định grafana_dashboard="1").
    label: grafana_dashboard
    folder: Mission / Workflow

# DL-12 · DV-06-10: cảnh báo bản sao tổ chức (org_replica_lag_ms) và đối soát R1 của workflow-service
# (templates/reconcile-alerts.yaml). lagTargetMs là độ trễ mục tiêu p99 của TL-03 mục 10.4 (ECST tổ chức sang
# org_replica, 5 giây); chưa đo tải (YC-PT-19). runbookBase, namespace để trống thì lấy theo monitoring.alerts.
reconcile:
  alerts:
    enabled: true
    lagTargetMs: 5000
