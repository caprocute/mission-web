apiVersion: v1
kind: Service
metadata:
  name: {{ include "org-service.fullname" . }}
  labels:
    {{- include "org-service.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "org-service.selector" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: management
      port: 8081
      targetPort: management
