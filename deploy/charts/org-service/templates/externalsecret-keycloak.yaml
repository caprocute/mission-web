{{- $s := .Values.keycloak.clientSecret }}
{{- if $s.externalSecret.enabled }}
# DV-04-07: bí mật client org-service để gọi Admin API Keycloak, đồng bộ từ OpenBao (SEC-10, SEC-11); repo không
# chứa giá trị. Cùng khoá OpenBao mà chart iam dùng khi nạp client org-service vào realm.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $s.name }}
  namespace: {{ include "org-service.namespace" . }}
  labels:
    {{- include "org-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $s.externalSecret.refreshInterval }}
  secretStoreRef:
    kind: {{ $s.externalSecret.secretStoreRef.kind }}
    name: {{ $s.externalSecret.secretStoreRef.name }}
  target:
    name: {{ $s.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $s.key }}
      remoteRef:
        key: {{ $s.externalSecret.remoteRef.key }}
        property: {{ $s.externalSecret.remoteRef.property }}
{{- end }}
