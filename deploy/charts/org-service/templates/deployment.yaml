apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "org-service.fullname" . }}
  labels:
    {{- include "org-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "org-service.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "org-service.selector" . | nindent 8 }}
        mission.vn/svc: SVC-04
    spec:
      serviceAccountName: {{ include "org-service.serviceAccount" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: org-service
          image: {{ include "org-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "org-service.securityContext" . | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 8081
          env:
            - name: ORG_DB_URL
              value: {{ .Values.database.url | quote }}
            - name: ORG_DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.appSecret }}
                  key: username
            - name: ORG_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.appSecret }}
                  key: password
            - name: OIDC_ISSUER_URI
              value: {{ .Values.oidc.issuerUri | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: JAVA_TOOL_OPTIONS
              value: {{ .Values.jvm.opts | quote }}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
