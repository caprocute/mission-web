{{- if .Values.networkPolicy.enabled }}
# Mặc định chặn (HA-TANG.md mục 2): chỉ mở API cho cổng và mission-core, cổng quản trị cho giám sát,
# đi ra chỉ tới CSDL, DNS, Keycloak (JWKS qua cổng 443) và bộ thu OpenTelemetry.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "org-service.fullname" . }}
  namespace: {{ include "org-service.namespace" . }}
  labels:
    {{- include "org-service.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "org-service.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingressNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }}
      ports:
        - port: 8081
          protocol: TCP
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.databaseNamespace }}
      ports:
        - port: {{ .Values.networkPolicy.databasePort }}
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        - port: 443
          protocol: TCP
        - port: 4318
          protocol: TCP
{{- end }}
