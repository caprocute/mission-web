apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "org-service.fullname" . }}
  labels:
    {{- include "org-service.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "org-service.selector" . | nindent 6 }}
