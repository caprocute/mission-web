{{- $v := .Values }}
{{- include "gdns.digest" (list $v.pdns.image "pdns.image") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: pdns-conf
  namespace: {{ $v.namespace }}
data:
  vt.conf: |
    local-address=0.0.0.0
    launch=gpgsql
    gpgsql-host={{ $v.pdns.db.host }}
    gpgsql-port={{ $v.pdns.db.port }}
    gpgsql-dbname={{ $v.pdns.db.name }}
    gpgsql-user={{ $v.pdns.db.user }}
    enable-lua-records=yes
    lua-health-checks-interval={{ $v.pdns.luaHealthCheckInterval }}
    api=yes
    webserver=yes
    webserver-address=0.0.0.0
    webserver-port=8081
    # Chỉ trong cụm (NetworkPolicy giới hạn thêm tới dns-sync và tenant-registry).
    webserver-allow-from=10.0.0.0/8
    # Không hỏi máy chủ secpoll của PowerDNS (không gọi ra ngoài).
    security-poll-suffix=
    disable-axfr=yes
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pdns
  namespace: {{ $v.namespace }}
  labels: { app.kubernetes.io/name: pdns }
spec:
  replicas: {{ $v.pdns.replicas }}
  selector: { matchLabels: { app.kubernetes.io/name: pdns } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pdns }
      annotations:
        checksum/conf: {{ toJson $v.pdns | sha256sum | trunc 16 }}
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 953, runAsGroup: 953, fsGroup: 953, seccompProfile: { type: RuntimeDefault } }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app.kubernetes.io/name: pdns } } }
      containers:
        - name: pdns
          image: {{ $v.pdns.image }}
          ports:
            - { name: dns-udp, containerPort: 53, protocol: UDP }
            - { name: dns-tcp, containerPort: 53, protocol: TCP }
            - { name: api, containerPort: 8081 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL], add: [NET_BIND_SERVICE] }
          resources: {{ toJson $v.pdns.resources }}
          readinessProbe: { tcpSocket: { port: 53 }, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: 8081 }, periodSeconds: 10 }
          volumeMounts:
            - { name: conf, mountPath: /etc/powerdns/pdns.d/vt.conf, subPath: vt.conf, readOnly: true }
            - { name: bi-mat, mountPath: /etc/powerdns/pdns.d/bi-mat.conf, subPath: bi-mat.conf, readOnly: true }
            - { name: run, mountPath: /var/run/pdns }
      volumes:
        - { name: conf, configMap: { name: pdns-conf } }
        - { name: bi-mat, secret: { secretName: pdns-bi-mat } }
        - { name: run, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: pdns-dns
  namespace: {{ $v.namespace }}
spec:
  type: {{ $v.pdns.service.type }}
  {{- with $v.pdns.service.loadBalancerIP }}
  loadBalancerIP: {{ . }}
  {{- end }}
  externalTrafficPolicy: {{ ternary "Local" "Cluster" (eq $v.pdns.service.type "LoadBalancer") }}
  selector: { app.kubernetes.io/name: pdns }
  ports:
    - { name: dns-udp, port: 53, targetPort: 53, protocol: UDP }
    - { name: dns-tcp, port: 53, targetPort: 53, protocol: TCP }
---
# Cổng HTTP API cho dns-sync và tenant-registry (OPS-07); địa chỉ khớp provisioning.dns.apiUrl của tenant-registry.
apiVersion: v1
kind: Service
metadata:
  name: pdns-api
  namespace: {{ $v.namespace }}
spec:
  selector: { app.kubernetes.io/name: pdns }
  ports: [{ name: api, port: 8081, targetPort: 8081 }]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdns
  namespace: {{ $v.namespace }}
spec:
  minAvailable: 2
  selector: { matchLabels: { app.kubernetes.io/name: pdns } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pdns
  namespace: {{ $v.namespace }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: pdns } }
  policyTypes: [Ingress, Egress]
  ingress:
    - ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - from:
        - podSelector: { matchLabels: { app.kubernetes.io/name: dns-sync } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: global } }
          podSelector: { matchLabels: { app.kubernetes.io/name: tenant-registry } }
      ports: [{ port: 8081 }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: registry-db } } }]
      ports: [{ port: 5432 }]
    # Kiểm tra sức khoẻ ifurlup tới các VIP của tên miền chung.
    - to:
        {{- range $v.common }}{{ range .vips }}{{ range . }}
        - ipBlock: { cidr: {{ . }}/32 }
        {{- end }}{{ end }}{{ end }}
      ports: [{ port: 443 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
{{- if eq $v.site $v.primarySite }}
---
# Tạo vùng và bản ghi LUA của tên miền chung, idempotent (replace-rrset). Chỉ ở TTDL giữ primary của pg-registry, vì
# bên kia là bản sao chỉ đọc. Không đụng bản ghi cell (của dns-sync) và
# bản ghi tenant (của OPS-07). Chạy sau mỗi lần đồng bộ của Argo CD.
apiVersion: batch/v1
kind: Job
metadata:
  name: pdns-vung
  namespace: {{ $v.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 953, runAsGroup: 953, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: pdnsutil
          image: {{ $v.pdns.image }}
          command: ["sh", "-ec"]
          args:
            - |
              pdnsutil list-zone {{ $v.zone }} >/dev/null 2>&1 || pdnsutil create-zone {{ $v.zone }} {{ first $v.nameservers }}
              pdnsutil replace-rrset {{ $v.zone }} @ NS 3600 {{ range $v.nameservers }}{{ . }}. {{ end }}
              {{- range $v.common }}
              pdnsutil replace-rrset {{ $v.zone }} {{ .name }} LUA {{ .ttl }} "$(cat /etc/pdns-vung/{{ .name }}.lua)"
              {{- end }}
              pdnsutil rectify-zone {{ $v.zone }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 128Mi } }
          volumeMounts:
            - { name: conf, mountPath: /etc/powerdns/pdns.d/vt.conf, subPath: vt.conf, readOnly: true }
            - { name: bi-mat, mountPath: /etc/powerdns/pdns.d/bi-mat.conf, subPath: bi-mat.conf, readOnly: true }
            - { name: vung, mountPath: /etc/pdns-vung, readOnly: true }
      volumes:
        - { name: conf, configMap: { name: pdns-conf } }
        - { name: bi-mat, secret: { secretName: pdns-bi-mat } }
        - { name: vung, configMap: { name: pdns-vung } }
{{- end }}
---
# Nội dung bản ghi LUA của tên miền chung (Job pdns-vung đọc từ tệp để không phải lồng dấu nháy trong shell).
apiVersion: v1
kind: ConfigMap
metadata:
  name: pdns-vung
  namespace: {{ $v.namespace }}
data:
  {{- range $v.common }}
  {{ .name }}.lua: {{ include "gdns.ifurlup" . | quote }}
  {{- end }}
{{- if $v.externalSecrets.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pdns-bi-mat
  namespace: {{ $v.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef: {{ toJson $v.externalSecrets.secretStoreRef }}
  target:
    name: pdns-bi-mat
    template:
      data:
        bi-mat.conf: |
          api-key={{ "{{" }} .apiKey {{ "}}" }}
          gpgsql-password={{ "{{" }} .dbPassword {{ "}}" }}
        api-key: '{{ "{{" }} .apiKey {{ "}}" }}'
  data:
    - { secretKey: apiKey, remoteRef: { key: {{ $v.externalSecrets.pdnsPath }}, property: api-key } }
    - { secretKey: dbPassword, remoteRef: { key: {{ $v.externalSecrets.pdnsPath }}, property: db-password } }
{{- end }}
