# Ca kiểm promtool cho rules/canh-bao-toi-thieu.yaml: mỗi cảnh báo có ca kích hoạt và ca không kích hoạt.
rule_files:
- ../canh-bao-toi-thieu.yaml
evaluation_interval: 30s
tests:
- interval: 1m
  external_labels:
    cell: g4
  input_series:
  - series: vt_scoring_lag_seconds_bucket{le="60"}
    values: 0+10x40
  - series: vt_scoring_lag_seconds_bucket{le="120"}
    values: 0+100x40
  - series: vt_scoring_lag_seconds_bucket{le="+Inf"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 25m
    alertname: ScoringLagHigh
    exp_alerts:
    - exp_labels:
        severity: warning
        doi: sre
        service: scoring
      exp_annotations:
        summary: Độ trễ từ minh chứng đã xác nhận tới điểm đã tính p99 1m 59s (SLO-SCORE 60 s)
        runbook_url: https://runbook.vt.local/okr/scoring-lag
- interval: 1m
  external_labels:
    cell: g4
  input_series:
  - series: vt_scoring_lag_seconds_bucket{le="60"}
    values: 0+100x40
  - series: vt_scoring_lag_seconds_bucket{le="+Inf"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 25m
    alertname: ScoringLagHigh
    exp_alerts: []
- interval: 1m
  external_labels:
    cell: g4
  input_series:
  - series: vt_outbox_pending_events{service="task"}
    values: 20000x10
  alert_rule_test:
  - eval_time: 5m
    alertname: OutboxBacklog
    exp_alerts:
    - exp_labels:
        severity: critical
        doi: sre-dba
        service: task
      exp_annotations:
        summary: 'Outbox của task tồn đọng: 20000'
        runbook_url: https://runbook.vt.local/okr/outbox
- interval: 1m
  external_labels:
    cell: g4
  input_series:
  - series: vt_outbox_pending_events{service="task"}
    values: 500x10
  - series: vt_outbox_oldest_pending_age_seconds{service="task"}
    values: 5x10
  alert_rule_test:
  - eval_time: 5m
    alertname: OutboxBacklog
    exp_alerts: []
- interval: 1m
  external_labels:
    cell: g4
  input_series:
  - series: vt_ledger_lag_seconds_bucket{le="30"}
    values: 0+10x40
  - series: vt_ledger_lag_seconds_bucket{le="60"}
    values: 0+100x40
  - series: vt_ledger_lag_seconds_bucket{le="+Inf"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 25m
    alertname: LedgerLagHigh
    exp_alerts:
    - exp_labels:
        severity: warning
        doi: sre
        slo: ledger
      exp_annotations:
        summary: Độ trễ ghi sổ cái p99,9 59.97s (SLO-LEDGER 30 s)
        runbook_url: https://runbook.vt.local/okr/ledger-lag
- interval: 1m
  external_labels:
    cell: g4
  input_series:
  - series: vt_ledger_lag_seconds_bucket{le="30"}
    values: 0+100x40
  - series: vt_ledger_lag_seconds_bucket{le="+Inf"}
    values: 0+100x40
  alert_rule_test:
  - eval_time: 25m
    alertname: LedgerLagHigh
    exp_alerts: []
- interval: 1m
  external_labels:
    cell: g4
  input_series:
  - series: ledger_verify_failures_total
    values: 0 0 0 1 1 1
  alert_rule_test:
  - eval_time: 4m
    alertname: LedgerChainBroken
    exp_alerts:
    - exp_labels:
        severity: critical
        doi: soc
      exp_annotations:
        summary: Kiểm tra chuỗi băm sổ cái thất bại
        runbook_url: https://runbook.vt.local/okr/dr-14
- interval: 1m
  external_labels:
    cell: g4
  input_series:
  - series: ledger_verify_failures_total
    values: '0x5'
  alert_rule_test:
  - eval_time: 4m
    alertname: LedgerChainBroken
    exp_alerts: []
- interval: 1m
