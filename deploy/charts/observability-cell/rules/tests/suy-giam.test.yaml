# Ca kiểm promtool cho rules/suy-giam.yaml: mỗi mức có ca kích hoạt và ca không kích hoạt; mức 2 dùng luật ghi
# slo:api_availability_errors:ratio_rate5m của slo-api.yaml.
rule_files:
- ../suy-giam.yaml
- ../slo-api.yaml
evaluation_interval: 30s
tests:
# Mức 1: ở maxReplicas và p95 đọc khoảng 450 ms.
- interval: 1m
  input_series:
  - series: kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler="keda-hpa-mission-core"}
    values: 24x20
  - series: kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler="keda-hpa-mission-core"}
    values: 24x20
  - series: apisix_http_latency_bucket{type="request", kind="read", le="300"}
    values: 0+10x20
  - series: apisix_http_latency_bucket{type="request", kind="read", le="500"}
    values: 0+100x20
  - series: apisix_http_latency_bucket{type="request", kind="read", le="+Inf"}
    values: 0+100x20
  alert_rule_test:
  - eval_time: 12m
    alertname: DegradeLevel1
    exp_alerts:
    - exp_labels: { severity: control, doi: sre, degrade_level: "1" }
      exp_annotations:
        summary: "mission-core ở số bản tối đa và p95 đọc trên 300 ms: suy giảm mức 1"
        runbook_url: https://runbook.vt.local/okr/suy-giam-ba-muc
# Mức 1 không kích hoạt khi chưa ở maxReplicas dù chậm.
- interval: 1m
  input_series:
  - series: kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler="keda-hpa-mission-core"}
    values: 20x20
  - series: kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler="keda-hpa-mission-core"}
    values: 24x20
  - series: apisix_http_latency_bucket{type="request", kind="read", le="300"}
    values: 0+10x20
  - series: apisix_http_latency_bucket{type="request", kind="read", le="+Inf"}
    values: 0+100x20
  alert_rule_test:
  - eval_time: 12m
    alertname: DegradeLevel1
    exp_alerts: []
# Mức 2: 5xx 2%.
- interval: 1m
  input_series:
  - series: apisix_http_status{code="200", cell="g4"}
    values: 0+98x10
  - series: apisix_http_status{code="503", cell="g4"}
    values: 0+2x10
  alert_rule_test:
  - eval_time: 9m
    alertname: DegradeLevel2
    exp_alerts:
    - exp_labels: { severity: control, doi: sre, degrade_level: "2", cell: g4 }
      exp_annotations:
        summary: "Tỷ lệ lỗi 5xx hoặc hàng chờ kết nối CSDL vượt ngưỡng: suy giảm mức 2"
        runbook_url: https://runbook.vt.local/okr/suy-giam-ba-muc
# Mức 2: Hikari có kết nối chờ, không có lỗi.
- interval: 1m
  input_series:
  - series: apisix_http_status{code="200", cell="g4"}
    values: 0+100x10
  - series: hikaricp_connections_pending{pool="mission"}
    values: 3x10
  alert_rule_test:
  - eval_time: 9m
    alertname: DegradeLevel2
    exp_alerts:
    - exp_labels: { severity: control, doi: sre, degrade_level: "2" }
      exp_annotations:
        summary: "Tỷ lệ lỗi 5xx hoặc hàng chờ kết nối CSDL vượt ngưỡng: suy giảm mức 2"
        runbook_url: https://runbook.vt.local/okr/suy-giam-ba-muc
# Mức 2 không kích hoạt: 5xx 0,5%, Hikari không chờ.
- interval: 1m
  input_series:
  - series: apisix_http_status{code="200", cell="g4"}
    values: 0+995x10
  - series: apisix_http_status{code="503", cell="g4"}
    values: 0+5x10
  - series: hikaricp_connections_pending{pool="mission"}
    values: 0x10
  alert_rule_test:
  - eval_time: 9m
    alertname: DegradeLevel2
    exp_alerts: []
# Mức 3: primary pg-core 95% CPU; bản sao 99% không tính.
- interval: 1m
  input_series:
  - series: container_cpu_usage_seconds_total{namespace="data-pg", pod="pg-core-1", container="postgres"}
    values: 0+57x10
  - series: kube_pod_container_resource_limits{namespace="data-pg", pod="pg-core-1", container="postgres", resource="cpu"}
    values: 1x10
  - series: cnpg_pg_replication_in_recovery{namespace="data-pg", pod="pg-core-1"}
    values: 0x10
  alert_rule_test:
  - eval_time: 8m
    alertname: DegradeLevel3
    exp_alerts:
    - exp_labels: { severity: control, doi: sre, degrade_level: "3" }
      exp_annotations:
        summary: "CPU primary PostgreSQL 95%: suy giảm mức 3, chỉ nhận ghi ưu tiên"
        runbook_url: https://runbook.vt.local/okr/suy-giam-ba-muc
- interval: 1m
  input_series:
  - series: container_cpu_usage_seconds_total{namespace="data-pg", pod="pg-core-2", container="postgres"}
    values: 0+59x10
  - series: kube_pod_container_resource_limits{namespace="data-pg", pod="pg-core-2", container="postgres", resource="cpu"}
    values: 1x10
  - series: cnpg_pg_replication_in_recovery{namespace="data-pg", pod="pg-core-2"}
    values: 1x10
  alert_rule_test:
  - eval_time: 8m
    alertname: DegradeLevel3
    exp_alerts: []
