apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tenant-registry.fullname" . }}
  labels:
    {{- include "tenant-registry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "tenant-registry.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tenant-registry.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tenant-registry.serviceAccount" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "tenant-registry.selector" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "tenant-registry.selector" . | nindent 14 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: tenant-registry
          image: {{ include "tenant-registry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            - name: OIDC_JWKS_URL
              value: {{ .Values.env.oidcJwksUrl | quote }}
            - name: OIDC_ISSUERS
              value: {{ .Values.env.oidcIssuers | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.env.oidcAudience | quote }}
            - name: STEP_UP_MAX_AGE
              value: {{ .Values.env.stepUpMaxAge | quote }}
            - name: ROUTING_COOKIE_DOMAIN
              value: {{ .Values.routingCookie.domain | quote }}
            - name: RESOLVE_CACHE_TTL
              value: {{ .Values.resolve.cacheTtl | quote }}
            - name: RESOLVE_STALE_MAX
              value: {{ .Values.resolve.staleMax | quote }}
            - name: ROUTING_COOKIE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.routingCookie.secretName }}
                  key: {{ .Values.routingCookie.keyCurrent }}
            - name: ROUTING_COOKIE_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.routingCookie.secretName }}
                  key: {{ .Values.routingCookie.keyPrevious }}
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
