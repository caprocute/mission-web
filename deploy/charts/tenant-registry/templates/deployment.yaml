apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tenant-registry.fullname" . }}
  labels:
    {{- include "tenant-registry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "tenant-registry.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tenant-registry.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tenant-registry.serviceAccount" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: {{ .Values.topologySpread.maxSkew }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "tenant-registry.selector" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "tenant-registry.selector" . | nindent 14 }}
      terminationGracePeriodSeconds: 30
      {{- if or .Values.provisioning.enabled .Values.move.enabled }}
      volumes:
      {{- end }}
      {{- if .Values.move.enabled }}
        - name: move-secrets
          secret:
            secretName: {{ .Values.move.secretName }}
            defaultMode: 0400
      {{- end }}
      {{- if .Values.provisioning.enabled }}
      # Token chiếu hạn 1 giờ, chỉ để gọi API Kubernetes tạo Certificate (cert-manager); không gắn token mặc định.
        - name: kube-api
          projected:
            sources:
              - serviceAccountToken:
                  path: k8s-token
                  expirationSeconds: 3600
                  audience: {{ .Values.provisioning.certManager.tokenAudience | quote }}
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
      {{- end }}
      containers:
        - name: tenant-registry
          image: {{ include "tenant-registry.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: LOG_LEVEL
              value: {{ .Values.env.logLevel | quote }}
            - name: OIDC_JWKS_URL
              value: {{ .Values.env.oidcJwksUrl | quote }}
            - name: OIDC_ISSUERS
              value: {{ .Values.env.oidcIssuers | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.env.oidcAudience | quote }}
            - name: STEP_UP_MAX_AGE
              value: {{ .Values.env.stepUpMaxAge | quote }}
            - name: ROUTING_COOKIE_DOMAIN
              value: {{ .Values.routingCookie.domain | quote }}
            - name: RESOLVE_CACHE_TTL
              value: {{ .Values.resolve.cacheTtl | quote }}
            - name: RESOLVE_STALE_MAX
              value: {{ .Values.resolve.staleMax | quote }}
            - name: C2_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.c2Key.secretName }}
                  key: {{ .Values.c2Key.key }}
            - name: TENANT_POOL_MAX
              value: {{ .Values.tenantRules.poolMax | quote }}
            - name: TENANT_BRIDGE_MAX
              value: {{ .Values.tenantRules.bridgeMax | int64 | quote }}
            - name: TENANT_SILO_REQUIRED_ABOVE
              value: {{ .Values.tenantRules.siloRequiredAbove | int64 | quote }}
            - name: TENANT_SILO_SECTORS
              value: {{ .Values.tenantRules.siloSectors | quote }}
            - name: TENANT_SILO_CODES
              value: {{ .Values.tenantRules.siloCodes | quote }}
            - name: CELL_CAPACITY_THRESHOLD
              value: {{ .Values.tenantRules.capacityThreshold | quote }}
            - name: TENANT_DOMAIN_SUFFIX
              value: {{ .Values.tenantRules.domainSuffix | quote }}
            - name: TENANT_LIMIT
              value: {{ .Values.tenantRules.tenantLimit | quote }}
            - name: ACCOUNT_LIMIT
              value: {{ .Values.tenantRules.accountLimit | int64 | quote }}
            - name: ACCOUNT_SYNC_INTERVAL
              value: {{ .Values.tenantRules.accountSyncInterval | quote }}
            - name: ROUTING_COOKIE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.routingCookie.secretName }}
                  key: {{ .Values.routingCookie.keyCurrent }}
            - name: ROUTING_COOKIE_KEY_PREVIOUS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.routingCookie.secretName }}
                  key: {{ .Values.routingCookie.keyPrevious }}
                  optional: true
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.secretName }}
                  key: {{ .Values.database.secretKey }}
            {{- with .Values.provisioning }}
            {{- if .enabled }}
            - name: PROVISION_KEYCLOAK_URL
              value: {{ .keycloakUrl | quote }}
            - name: PROVISION_KEYCLOAK_REALM
              value: {{ .keycloakRealm | quote }}
            - name: PROVISION_TOKEN_URL
              value: {{ .tokenUrl | quote }}
            - name: PROVISION_CORE_URL
              value: {{ .coreUrl | quote }}
            - name: PROVISION_ORG_URL
              value: {{ .orgUrl | quote }}
            - name: PROVISION_CLIENT_ID
              value: {{ .clientId | quote }}
            - name: PROVISION_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: PROVISION_CLIENT_SECRET
            - name: PDNS_API_URL
              value: {{ .dns.apiUrl | quote }}
            - name: PDNS_ZONE
              value: {{ .dns.zone | quote }}
            - name: PDNS_SERVER_ID
              value: {{ .dns.serverId | quote }}
            - name: PDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: PDNS_API_KEY
            - name: CERT_K8S_API
              value: {{ .certManager.apiServer | quote }}
            - name: CERT_NAMESPACE
              value: {{ .certManager.namespace | quote }}
            - name: CERT_ISSUER
              value: {{ .certManager.issuer | quote }}
            - name: CERT_ISSUER_KIND
              value: {{ .certManager.issuerKind | quote }}
            - name: CERT_WAIT
              value: {{ .certManager.wait | quote }}
            - name: CERT_TOKEN_FILE
              value: /var/run/secrets/tenant-registry/k8s-token
            - name: CERT_CA_FILE
              value: /var/run/secrets/tenant-registry/ca.crt
            - name: PROMETHEUS_URL
              value: {{ .prometheusUrl | quote }}
            - name: REPLICA_LAG_QUERY
              value: {{ .replicaLagQuery | quote }}
            - name: PROVISION_MAX_ATTEMPTS
              value: {{ .maxAttempts | quote }}
            - name: PROVISION_BACKOFF
              value: {{ .backoff | quote }}
            - name: PROVISION_STEP_TIMEOUT
              value: {{ .stepTimeout | quote }}
            - name: ACTIVATION_RPO
              value: {{ .activationRpo | quote }}
            - name: READINESS_INTERVAL
              value: {{ .readinessInterval | quote }}
            {{- end }}
            {{- end }}
            {{- if .Values.move.enabled }}
            - name: MOVE_CELL_DB_FILE
              value: /var/run/secrets/tenant-registry-move/cell-db.json
            - name: MOVE_OBJECTS_FILE
              value: /var/run/secrets/tenant-registry-move/objects.json
            - name: MOVE_LEDGER_URL
              value: {{ .Values.move.ledgerUrl | quote }}
            - name: MOVE_POLL_EVERY
              value: {{ .Values.move.pollEvery | quote }}
            - name: MOVE_CATCHUP_TIMEOUT
              value: {{ .Values.move.catchUpTimeout | quote }}
            - name: MOVE_FREEZE_TIMEOUT
              value: {{ .Values.move.freezeTimeout | quote }}
            - name: MOVE_RETENTION
              value: {{ .Values.move.retention | quote }}
            - name: MOVE_PURGE_INTERVAL
              value: {{ .Values.move.purgeInterval | quote }}
            {{- end }}
          {{- if or .Values.provisioning.enabled .Values.move.enabled }}
          volumeMounts:
            {{- if .Values.provisioning.enabled }}
            - name: kube-api
              mountPath: /var/run/secrets/tenant-registry
              readOnly: true
            {{- end }}
            {{- if .Values.move.enabled }}
            - name: move-secrets
              mountPath: /var/run/secrets/tenant-registry-move
              readOnly: true
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop: ["ALL"]
