apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "tenant-registry.fullname" . }}
  labels:
    {{- include "tenant-registry.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "tenant-registry.selector" . | nindent 6 }}
