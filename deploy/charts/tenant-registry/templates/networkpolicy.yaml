{{- if .Values.networkPolicy.enabled }}
# Chặn mặc định: pod của release không nhận và không gửi lưu lượng nào ngoài các luồng mở ở policy sau.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tenant-registry.fullname" . }}-default-deny
  labels:
    {{- include "tenant-registry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tenant-registry.fullname" . }}-allow
  labels:
    {{- include "tenant-registry.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tenant-registry.selector" . | nindent 6 }}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- toYaml .Values.networkPolicy.monitoringFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        {{- toYaml .Values.networkPolicy.databaseTo | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.databasePort }}
    - to:
        {{- toYaml .Values.networkPolicy.keycloakTo | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.keycloakPort }}
    {{- if .Values.networkPolicy.openbaoTo }}
    - to:
        {{- toYaml .Values.networkPolicy.openbaoTo | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.openbaoPort }}
    {{- end }}
    {{- if and .Values.networkPolicy.idpProbeEgress .Values.networkPolicy.idpProbeEgress.enabled }}
    - to:
        - ipBlock:
            cidr: {{ .Values.networkPolicy.idpProbeEgress.cidr }}
            except:
              {{- toYaml .Values.networkPolicy.idpProbeEgress.except | nindent 14 }}
      ports:
        {{- range .Values.networkPolicy.idpProbeEgress.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
