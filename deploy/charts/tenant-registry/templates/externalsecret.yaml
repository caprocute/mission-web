{{- if .Values.externalSecrets.enabled }}
# Đồng bộ khoá HMAC cookie định tuyến từ OpenBao (HA-TANG.md mục 2: bí mật chỉ nằm trong OpenBao).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.routingCookie.secretName }}
  labels:
    {{- include "tenant-registry.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ .Values.routingCookie.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.routingCookie.keyCurrent }}
      remoteRef:
        key: {{ .Values.externalSecrets.routingKeyPath }}
        property: current
    - secretKey: {{ .Values.routingCookie.keyPrevious }}
      remoteRef:
        key: {{ .Values.externalSecrets.routingKeyPath }}
        property: previous
---
# Khoá mã hoá dữ liệu C2 (DV-03-03).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.c2Key.secretName }}
  labels:
    {{- include "tenant-registry.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ .Values.c2Key.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.c2Key.key }}
      remoteRef:
        key: {{ .Values.externalSecrets.c2KeyPath }}
        property: key
{{- end }}
