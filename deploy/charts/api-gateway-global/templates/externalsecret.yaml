{{- if .Values.externalSecrets.enabled }}
{{- $v := .Values }}
# Khoá HMAC cookie định tuyến dùng chung với SVC-03 và cổng cell; bí mật chỉ nằm trong OpenBao (HA-TANG.md mục 2).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $v.routingCookie.secretName }}
  namespace: {{ $v.namespace }}
  labels:
    {{- include "gw-global.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $v.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $v.externalSecrets.secretStoreRef.kind }}
    name: {{ $v.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ $v.routingCookie.secretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $v.routingCookie.keyCurrent }}
      remoteRef: { key: {{ $v.externalSecrets.routingKeyPath }}, property: current }
    - secretKey: {{ $v.routingCookie.keyPrevious }}
      remoteRef: { key: {{ $v.externalSecrets.routingKeyPath }}, property: previous }
---
# Bí mật client credentials apisix-global (vai trò service_client) để gọi registry/resolve.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $v.registry.clientSecretRef.name }}
  namespace: {{ $v.namespace }}
  labels:
    {{- include "gw-global.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ $v.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: {{ $v.externalSecrets.secretStoreRef.kind }}
    name: {{ $v.externalSecrets.secretStoreRef.name }}
  target:
    name: {{ $v.registry.clientSecretRef.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $v.registry.clientSecretRef.key }}
      remoteRef: { key: {{ $v.externalSecrets.registryClientPath }}, property: client-secret }
{{- end }}
