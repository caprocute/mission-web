# Hằng số của công thức tầng ứng dụng và tác vụ lô (TL-05 "Công thức"), không phải giả định GD.
congThuc:
  heSoDuPhongVung: 1.5          # maxReplicas >= ceil(1,5 × n_s): mất một trong ba vùng lúc đỉnh
  scoring: { gioTinhLai: 2, hoSoMoiGiayMoiPod: 50, heSoMucTieu1Gio: 2 }
  gotenberg: { giayCpuMoiPhieu: 1.5, gioSinhPhieu: 4, hieuSuat: 0.5, vcpuMoiPod: 2 }

# Ngân sách kết nối CSDL (TL-04 mục 4.7, TL-05 "Ngân sách kết nối theo hồ sơ" và kiểm CPU primary pg-core).
ketNoi:
  cJob: 20                      # Flyway, đối soát hằng đêm
  cAdmin: 10                    # truy cập quản trị qua PAM
  # C_direct + R (Debezium, bản sao, sao lưu, giám sát và dự trữ) theo hồ sơ.
  trucTiepVaDuTru: { compact: 35, S: 35, M: 50, L: 50 }
  # Kiểm ngược CPU primary pg-core: mỗi pod mission-core đặt ~600 câu lệnh/giây lên primary, 0,6 ms CPU mỗi câu,
  # primary dùng tối đa 70% CPU (TL-04 mục 4.7).
  cauLenhMoiPodTrenPrimary: 600
  msCpuMoiCauLenh: 0.6
  tyLeCpuPrimaryToiDa: 0.7
  # Số kết nối hoạt động tới primary nên trong khoảng 2–4 lần vCPU (khuyến nghị, chỉ cảnh báo).
  ketNoiTrenVcpu: { min: 2, max: 4 }
  # Pool mỗi pod của các service khác (TL-04 mục 4.7): workflow API và executor tới pg-flowable.
  poolMoiPod: { workflow-service: 10 }
