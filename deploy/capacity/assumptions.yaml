# Giả định định cỡ GD-01..GD-26 (TL-05 "Danh mục giả định định cỡ"; INF-03). Tệp tham số của vòng hiệu chuẩn TL-05:
# sau mỗi chiến dịch thử tải hoặc kỳ đánh giá quý, đổi giá trị bằng merge request, ghi giá trị cũ vào lichSu, đặt
# loai: so-do, ngayDo và kichBan, rồi chạy tinh_dinh_co.py để tính lại bảng và so với values đang chạy.
# Trường: giaTri (số hoặc bảng số máy đọc), donVi, nguon (mục tài liệu), loai (gia-dinh | so-do), ngayDo (YYYY-MM-DD,
# rỗng khi chưa đo), kichBan (PERF hoặc chỉ số vận hành dùng để kiểm chứng), lichSu (các giá trị trước).
phienBan: TL-05 v1.0
gd:
  GD-01:
    ten: Số tài khoản thiết kế của cell
    giaTri: { compact: 50000, S: 300000, M: 800000, L: 1200000, tranL: 1500000 }
    donVi: tài khoản
    nguon: TL-05 (compact), TL-04 mục 4.2 (S, M, L)
    loai: gia-dinh
    ngayDo: ""
    kichBan: số tài khoản thật trong registry.tenant_cell
  GD-02:
    ten: Tỷ lệ người dùng đồng thời trên tài khoản
    giaTri: 0.05
    donVi: tỷ lệ
    nguon: Baseline mục 3.1 (300.000 / 6.000.000)
    loai: gia-dinh
    ngayDo: ""
    kichBan: Faro RUM, số phiên hoạt động giờ cao điểm
  GD-03:
