apiVersion: v1
kind: Pod
metadata:
  name: dat-chuan
  namespace: ung-dung
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
  - name: app
    image: harbor.vt.local/platform/mau@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    securityContext:
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 128Mi
    readinessProbe: &id001
      httpGet:
        path: /healthz
        port: 8081
    livenessProbe: *id001
---
