apiVersion: apps/v1
kind: Deployment
metadata:
  name: dat-ba-replica
  namespace: ung-dung
spec:
  selector:
    matchLabels:
      app: dat-ba-replica
  template:
    metadata:
      labels:
        app: dat-ba-replica
    spec:
      containers:
      - name: app
        image: harbor.vt.local/platform/mau@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: dat-ba-replica
  replicas: 3
