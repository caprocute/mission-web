# Vùng điều phối toàn cục tại phía Nam (INF-20; TL-04 mục 2.6, TL-05). Tách khỏi cụm quản trị từ QM-3: 3 × VM-16-64 ở
# QM-3, 4 × VM-24-96 ở QM-4, 7 × VM-24-96 ở QM-5 (đổi perZone và flavor). Chạy chủ động cùng global-hl (NFR-04 99,95%).
# Chứa SVC-03, APISIX lớp ngoài, PowerDNS và dns-sync, pg-registry, origin CDN, kho gốc Policy Pack và UI Pack.
# Pool dữ liệu nhỏ cho pg-registry (ba instance, mỗi vùng một máy) để CSDL không tranh tài nguyên với ứng dụng.
clusterName: global-sn
cell: global
namespace: capi-global
zones: [sn-a, sn-b, sn-c]
racks: { sn-a: sn-a-r01, sn-b: sn-b-r01, sn-c: sn-c-r01 }
controlPlane:
  replicas: 3
pools:
  app-general:
    enabled: true
    perZone: [1, 1, 1]
    capacity: { cpu: "16", memory: 64Gi }
    labels: { vt.io/pool: app-general, vt.io/vai-tro: global }
  data-postgres-small:
    enabled: true
    perZone: [1, 1, 1]
    labels: { vt.io/pool: postgres, vt.io/pg-size: small }
    taint: { key: vt.io/pool, value: postgres, effect: NoSchedule }
clusterAutoscaler:
  enabled: false
