# INF-28 · Cụm chờ ấm của cell G4 tại TTDL phía Nam (TL-04 "Topology hai trung tâm dữ liệu"): lớp dữ liệu đủ kích
# thước như cell-g4-hl (CNPG replica cluster nhận WAL, Kafka nhận MirrorMaker 2, cùng số node PostgreSQL, Kafka,
# tìm kiếm, vùng an toàn), lớp ứng dụng ở mức tối thiểu và để Cluster Autoscaler tăng khi chuyển vùng (DR-10).
# Thông số provider của Viettel Cloud (cloud, mạng, flavor, ảnh) là giá trị chờ hạ tầng: khi được cấp, chỉ thay
# ở deploy/environments/viettel-cloud/cell-g4-hl.yaml và render với -f tệp đó; không sửa khuôn cell-cluster.
clusterName: cell-g4-sn
cell: g4
kubernetesVersion: v1.36.0
zones: [sn-a, sn-b, sn-c]

controlPlane:
  replicas: 3

pools:
  system:
    enabled: true
    perZone: [1, 1, 1]
    labels: { vt.io/pool: system }
    taint: { key: CriticalAddonsOnly, value: "true", effect: NoSchedule }
  ingress:
    enabled: true
    autoscale: { min: 1, max: 2 }
    # Dung lượng node theo cỡ VM-16-32 của TL-05 (INF-16, chú thích cho Cluster Autoscaler).
    capacity: { cpu: "16", memory: 32Gi }
    labels: { vt.io/pool: ingress }
    taint: { key: vt.io/pool, value: ingress, effect: NoSchedule }
  app-general:
    enabled: true
    # Chờ ấm: mỗi vùng một node, tăng tới mức của Hoà Lạc khi chuyển vùng (max giữ nguyên).
    autoscale: { min: 1, max: 6 }
    capacity: { cpu: "16", memory: 64Gi }
    labels: { vt.io/pool: app-general }
  app-worker:
    enabled: true
    # Chờ ấm: tác vụ nền gần như không chạy ở phía Nam trước khi chuyển vùng.
    autoscale: { min: 1, max: 6 }
    capacity: { cpu: "16", memory: 64Gi }
    labels: { vt.io/pool: worker }
    taint: { key: vt.io/pool, value: worker, effect: NoSchedule }
  data-postgres-large:
    enabled: true
    perZone: [1, 1, 1]
    labels: { vt.io/pool: postgres, vt.io/pg-size: large }
    taint: { key: vt.io/pool, value: postgres, effect: NoSchedule }
  data-postgres-small:
    enabled: true
    perZone: [1, 1, 1]
    labels: { vt.io/pool: postgres, vt.io/pg-size: small }
    taint: { key: vt.io/pool, value: postgres, effect: NoSchedule }
  data-kafka:
    enabled: true
    perZone: [2, 2, 2]
    labels: { vt.io/pool: kafka }
    taint: { key: vt.io/pool, value: kafka, effect: NoSchedule }
  data-search:
    enabled: true
    perZone: [3, 2, 2]
    labels: { vt.io/pool: search }
    taint: { key: vt.io/pool, value: search, effect: NoSchedule }
  security-zone:
    enabled: true
    perZone: [1, 1, 1]
    labels: { vt.io/pool: secure, vt.io/zone: secure }
    taint: { key: vt.io/zone, value: secure, effect: NoSchedule }
  gpu:
    # Pool GPU chỉ có ở cell HCM và HN (TL-04 mục 3.3).
    enabled: false
    perZone: [1, 0, 0]
    labels: { vt.io/pool: gpu }
    taint: { key: nvidia.com/gpu, value: present, effect: NoSchedule }
