{{- $v := .Values }}
{{- $name := include "cell-cluster.req" (list $v.clusterName "clusterName") }}
{{- $i := $v.infrastructure }}
apiVersion: cluster.x-k8s.io/v1beta1
kind: Cluster
metadata:
  name: {{ $name }}
  namespace: {{ $v.namespace }}
  labels:
    vt.io/cell: {{ $v.cell | quote }}
spec:
  clusterNetwork:
    pods: { cidrBlocks: [{{ $v.network.podCIDR }}] }
    services: { cidrBlocks: [{{ $v.network.serviceCIDR }}] }
  controlPlaneRef:
    apiVersion: controlplane.cluster.x-k8s.io/v1beta1
    kind: KubeadmControlPlane
    name: {{ $name }}-cp
  infrastructureRef:
    apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
    kind: OpenStackCluster
    name: {{ $name }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackCluster
metadata:
  name: {{ $name }}
  namespace: {{ $v.namespace }}
spec:
  identityRef:
    type: Secret
    cloudName: {{ include "cell-cluster.req" (list $i.cloudName "infrastructure.cloudName") }}
    name: {{ include "cell-cluster.req" (list $i.identitySecret "infrastructure.identitySecret") }}
  externalNetwork:
    filter: { name: {{ include "cell-cluster.req" (list $i.externalNetwork "infrastructure.externalNetwork") }} }
  managedSubnets:
    - cidr: {{ include "cell-cluster.req" (list $i.nodeCIDR "infrastructure.nodeCIDR") }}
  apiServerLoadBalancer: { enabled: true }
  # Ba master trên ba vùng sự cố (TL-04 mục 3.2, hình 3.1).
  controlPlaneAvailabilityZones: {{ toJson $v.zones }}
  # Cilium quản lý NetworkPolicy; nhóm bảo mật của OpenStack chỉ mở cổng control plane và node.
  managedSecurityGroups:
    allowAllInClusterTraffic: true
---
apiVersion: controlplane.cluster.x-k8s.io/v1beta1
kind: KubeadmControlPlane
metadata:
  name: {{ $name }}-cp
  namespace: {{ $v.namespace }}
spec:
  replicas: {{ $v.controlPlane.replicas | int }}
  version: {{ $v.kubernetesVersion }}
  # Nâng cấp lần lượt từng master (OPS-15).
  rolloutStrategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1 }
  machineTemplate:
    infrastructureRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: OpenStackMachineTemplate
      name: {{ $name }}-cp
  kubeadmConfigSpec:
    # Tệp chính sách kiểm toán và cấu hình mã hoá etcd đặt lên mọi master trước kubeadm (INF-19, TL-04 mục 9.3).
    files:
      - path: /etc/kubernetes/audit-policy.yaml
        owner: root:root
        permissions: "0600"
        content: |
          {{- $.Files.Get "files/audit-policy.yaml" | nindent 10 }}
      - path: /etc/kubernetes/encryption-config.yaml
        owner: root:root
        permissions: "0600"
        content: |
          {{- $.Files.Get "files/encryption-config.yaml" | nindent 10 }}
    clusterConfiguration:
      # Cờ API server cố định theo kube-bench và TL-04 mục 9.3 (SEC-27, SEC-29, SEC-30, SEC-31).
      apiServer:
        extraArgs:
          anonymous-auth: "false"
          authorization-mode: Node,RBAC
          enable-admission-plugins: NodeRestriction
          profiling: "false"
          audit-policy-file: /etc/kubernetes/audit-policy.yaml
          audit-log-path: /var/log/kubernetes/audit/audit.log
          audit-log-maxage: "7"
          audit-log-maxbackup: "10"
          audit-log-maxsize: "200"
          # KMS v2 qua plugin OpenBao Transit (socket /var/run/kms/openbao.sock).
          encryption-provider-config: /etc/kubernetes/encryption-config.yaml
          tls-min-version: {{ include "cell-cluster.tlsMin" $v.apiServer.tlsMinVersion }}
          service-account-lookup: "true"
          # kubectl của người vận hành: OIDC Keycloak vận hành (realm platform-ops, MFA). Tiền tố "oidc:" tách tên và
          # nhóm OIDC khỏi system:* (một nhóm Keycloak tên system:masters không thể thành cluster-admin).
          oidc-issuer-url: {{ include "cell-cluster.req" (list $v.apiServer.oidc.issuerUrl "apiServer.oidc.issuerUrl") }}
          oidc-client-id: {{ $v.apiServer.oidc.clientId }}
          oidc-username-claim: preferred_username
          oidc-groups-claim: groups
          oidc-username-prefix: "oidc:"
          oidc-groups-prefix: "oidc:"
        extraVolumes:
          - { name: audit-policy, hostPath: /etc/kubernetes/audit-policy.yaml, mountPath: /etc/kubernetes/audit-policy.yaml, readOnly: true, pathType: File }
          - { name: audit-log, hostPath: /var/log/kubernetes/audit, mountPath: /var/log/kubernetes/audit, readOnly: false, pathType: DirectoryOrCreate }
          - { name: encryption-config, hostPath: /etc/kubernetes/encryption-config.yaml, mountPath: /etc/kubernetes/encryption-config.yaml, readOnly: true, pathType: File }
          - { name: kms-socket, hostPath: /var/run/kms, mountPath: /var/run/kms, readOnly: false, pathType: DirectoryOrCreate }
      controllerManager:
        extraArgs:
          profiling: "false"
          terminated-pod-gc-threshold: "1000"
      scheduler:
        extraArgs: { profiling: "false" }
      etcd:
        local:
          extraArgs:
            cipher-suites: TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
    initConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          cloud-provider: external
          node-labels: vt.io/cell={{ $v.cell }}
    joinConfiguration:
      nodeRegistration:
        kubeletExtraArgs:
          cloud-provider: external
          node-labels: vt.io/cell={{ $v.cell }}
---
apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: OpenStackMachineTemplate
metadata:
  name: {{ $name }}-cp
  namespace: {{ $v.namespace }}
spec:
  template:
    spec:
      flavor: {{ include "cell-cluster.req" (list $v.controlPlane.flavor "controlPlane.flavor") }}
      image: { filter: { name: {{ include "cell-cluster.req" (list $i.image "infrastructure.image") }} } }
      {{- with $i.sshKeyName }}
      sshKeyName: {{ . }}
      {{- end }}
