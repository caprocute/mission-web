# Tên cụm, ví dụ cell-g4-hl (cell G4, TTDL Hòa Lạc).
clusterName: ""
namespace: capi-cells
cell: ""
# Kubernetes n-1 (TL-04 mục 3.1); bản vá cụ thể ghim theo bảng phiên bản trong kho GitOps.
kubernetesVersion: v1.36.0
zones: [hl-a, hl-b, hl-c]
# Tủ máy theo vùng (nhãn vt.io/rack); node VM nhận giá trị của vùng, node vật lý ghi đè theo máy khi có.
racks: { hl-a: hl-a-r01, hl-b: hl-b-r01, hl-c: hl-c-r01 }
network:
  podCIDR: 10.244.0.0/16
  serviceCIDR: 10.96.0.0/12

# Provider hạ tầng: OpenStack (CAPO). Máy vật lý cấp qua flavor bare metal (Ironic). Mọi giá trị dưới đây là
# của môi trường, khai trong values của cell; để trống thì render dừng với thông báo.
infrastructure:
  cloudName: ""
  identitySecret: ""
  externalNetwork: ""
  nodeCIDR: ""
  image: ""
  sshKeyName: ""

kubelet:
  containerLogMaxSize: 100Mi
  containerLogMaxFiles: 5
# Volume đệm Fluent Bit mỗi node (TL-04 mục 10.3).
logBuffer:
  sizeGiB: 20

controlPlane:
  replicas: 3
  flavor: ""

# Chín node pool (TL-04 mục 3.3). perZone: số node mỗi vùng; autoscale: min/max mỗi vùng cho Cluster Autoscaler
# (chỉ ingress, app-general, app-worker). Pool dữ liệu và vùng bảo mật không co giãn.
pools: {}

# Cluster Autoscaler của cụm (TL-04 mục 6.5, INF-16). Chạy ở cụm quản trị, cùng namespace với các
# MachineDeployment: đọc và co giãn MachineDeployment bằng quyền trong cụm (incluster), nhìn node và pod Pending
# của cụm cell qua kubeconfig do Cluster API sinh (Secret <clusterName>-kubeconfig, khoá value). Bản Kubernetes
# của cụm là 1.36 nhưng Cluster Autoscaler mới nhất có chart là 1.35.0; đổi sang 1.36 khi phát hành (wiki 14).
clusterAutoscaler:
  enabled: true
  image:
    repository: harbor.vt.local/k8s-registry/autoscaling/cluster-autoscaler
    digest: sha256:2fc9433dd3b47baef0e68d6b1110b770a3c93db10c7bead4c5bc6cb21c72b875
  # Ba MachineDeployment một pool (một mỗi vùng) phải tăng đều nhau.
  balanceSimilarNodeGroups: true
  expander: least-waste
  scaleDownUnneededTime: 10m
  scaleDownDelayAfterAdd: 10m
  # Pod giữ chỗ chạy ở PriorityClass -10; Cluster Autoscaler vẫn thêm node cho chúng (mặc định chỉ bỏ qua pod
  # dưới -10), nên luôn có khoảng đệm 2 node.
  expendablePodsPriorityCutoff: -10
  resources:
    requests: { cpu: 100m, memory: 512Mi }
    limits: { cpu: "1", memory: 512Mi }
