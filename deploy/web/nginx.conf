server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # Tệp có băm nội dung: cache vĩnh viễn (TL-01 SVC-17 "Phục vụ và nhúng")
  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }
  # Tệp điều khiển phiên bản: cache ngắn
  location ~* (index\.html|federation\.manifest\.json|remoteEntry\.json|config\.json|current\.json)$ {
    add_header Cache-Control "max-age=60";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }
  # Remote nằm dưới /remotes/<project> (WEB-015): tệp thiếu trả 404, không rơi về index.html
  # của shell, để remoteRoutes() hiện RemoteUnavailablePage thay vì nạp nhầm HTML.
  location /remotes/ {
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }
  location / {
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;
    try_files $uri $uri/ /index.html;
  }
}
