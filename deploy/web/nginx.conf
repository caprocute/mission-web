# HSTS khi yêu cầu gốc là HTTPS: chính nginx nhận TLS hoặc APISIX/CDN báo qua X-Forwarded-Proto.
map "$scheme:$http_x_forwarded_proto" $vt_hsts {
  default "";
  "~^https:" "max-age=31536000; includeSubDomains";
  "~:https$" "max-age=31536000; includeSubDomains";
}

server {
  listen 8080;
  root /usr/share/nginx/html;
  server_tokens off;

  # Nguồn ngoài được phép trong CSP (API, IdP, remote khác nguồn, UI Pack trên CDN): 40-runtime-config.sh
  # sinh từ biến môi trường lúc container khởi động; giá trị mặc định là chỉ cùng nguồn.
  set $csp_connect "";
  set $csp_assets "";
  set $csp_frame "";
  set $csp_ancestors "";
  include /tmp/runtime/csp-nguon.conf*;

  include /etc/nginx/mission/security-headers.conf;

  # Kiểm tra sống cho probe của chart web-frontend (INF-02, TL-04 mục 5.2).
  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
  # Cấu hình chạy do 40-runtime-config.sh sinh: ưu tiên thư mục ghi được /tmp/runtime khi container
  # chạy với hệ thống tệp gốc chỉ đọc (chart web-frontend), nếu không có thì lấy trong thư mục html.
  location ~ ^/(config\.json|federation\.manifest\.json)$ {
    include /etc/nginx/mission/security-headers.conf;
    add_header Cache-Control "max-age=60";
    add_header Access-Control-Allow-Origin "*";
    root /tmp/runtime;
    try_files $uri @html;
  }
  location @html {
    include /etc/nginx/mission/security-headers.conf;
    add_header Cache-Control "max-age=60";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }
  # Trang shell (WEB-014): mỗi yêu cầu một nonce ($request_id, 128 bit ngẫu nhiên) thay cho chỗ giữ
  # __CSP_NONCE__ mà Angular CLI gắn vào thẻ script, style và thuộc tính ngCspNonce; CSP chặt theo
  # TL-01 (SEC-19) kèm Trusted Types. Không cache vì nonce đổi theo yêu cầu.
  location = /index.html {
    include /etc/nginx/mission/security-headers.conf;
    add_header Cache-Control "no-store";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'strict-dynamic' 'nonce-$request_id'$csp_assets; style-src 'self' 'nonce-$request_id'$csp_assets; img-src 'self' data: blob:$csp_assets; font-src 'self' data:$csp_assets; connect-src 'self'$csp_connect; frame-src 'self'$csp_frame; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'$csp_frame; frame-ancestors 'self'$csp_ancestors; require-trusted-types-for 'script'; trusted-types angular angular#bundler vt-federation native-federation es-module-shims" always;
    sub_filter "__CSP_NONCE__" $request_id;
    sub_filter_once off;
    try_files $uri =404;
  }
  # Tệp có băm nội dung: cache vĩnh viễn (TL-01 SVC-17 "Phục vụ và nhúng")
  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    include /etc/nginx/mission/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }
  # Tệp điều khiển phiên bản: cache ngắn
  location ~* (federation\.manifest\.json|remoteEntry\.json|config\.json|current\.json)$ {
    include /etc/nginx/mission/security-headers.conf;
    add_header Cache-Control "max-age=60";
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }
  # Remote nằm dưới /remotes/<project> (WEB-015): tệp thiếu trả 404, không rơi về index.html
  # của shell, để remoteRoutes() hiện RemoteUnavailablePage thay vì nạp nhầm HTML.
  location /remotes/ {
    include /etc/nginx/mission/security-headers.conf;
    add_header Access-Control-Allow-Origin "*";
    try_files $uri =404;
  }
  # Mọi tuyến của ứng dụng trả index.html qua location bên trên để có nonce và CSP.
  location / {
    try_files $uri /index.html;
  }
}
