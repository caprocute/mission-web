# CSP mặc định cho mọi phản hồi không phải trang shell (WEB-053, ZAP 10038): tệp tĩnh, JSON, trang lỗi
# do nginx sinh. Không cho nạp gì và không cho nhúng khung; tệp js/css/json được tài liệu khác tải
# không bị header này ảnh hưởng. Trang shell và trang nhận kết quả đăng nhập có CSP riêng.
add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
