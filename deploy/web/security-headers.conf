# Header bảo mật dùng chung (WEB-014, SEC-24, TL-01 mục bảo mật). Được include trong mọi location có
# add_header riêng, vì nginx không kế thừa add_header của cấp ngoài khi cấp trong đã khai báo.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(self), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
# HSTS chỉ khi yêu cầu tới qua HTTPS (trực tiếp hoặc sau bộ cân bằng tải); giá trị rỗng thì nginx không gửi.
add_header Strict-Transport-Security $vt_hsts always;
