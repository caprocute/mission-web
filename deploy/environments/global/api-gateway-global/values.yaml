# APISIX lớp ngoài của vùng điều phối toàn cục, production (DV-01-04). Ba vùng sẵn sàng ở hai TTDL (TL-04 mục 2):
# GeoDNS trả VIP đang khoẻ của app.danhgia.vn theo kiểm tra /healthz/edge (INF-20, chart global-dns, edge-health).
# Digest ảnh do pipeline ghi (SEC-55); khoá HMAC và bí mật client chỉ nằm trong OpenBao.
commonHosts: ["app.danhgia.vn"]
apisix:
  replicas: 3
  autoscaling: { enabled: true, minReplicas: 3, maxReplicas: 9, cpuUtilization: 70 }
registry:
  url: http://tenant-registry.global.svc.cluster.local:8080
  tokenUrl: https://sso.global.danhgia.vn/realms/platform/protocol/openid-connect/token
  clientId: apisix-global
cache:
  ttlSeconds: 300
  discoveryTtlSeconds: 300
  staleSeconds: 3600
routingCookie:
  domain: .danhgia.vn
externalSecrets:
  enabled: true
  secretStoreRef: { kind: ClusterSecretStore, name: openbao-global }
# Đường quản trị SVC-03 (giữ như mặc định của chart) và /healthz/edge cho GeoDNS (INF-20): PowerDNS kiểm
# https://app.danhgia.vn/healthz/edge trên từng VIP, edge-health trả OK khi SVC-03 và pg-registry ở TTDL này khoẻ.
globalRoutes:
  - name: registry
    paths: ["/api/v1/registry*", "/api/v1/config/tenants*", "/api/v1/jobs*"]
    service: tenant-registry
    namespace: global
    port: 8080
  - name: healthz-edge
    paths: ["/healthz/edge"]
    service: edge-health
    namespace: edge
    port: 8080
