# CRD tối thiểu (lược đồ mở) cho kiểm thử trên API server thật không có operator: chỉ để lưu và vá đối tượng mà
# bộ điều khiển suy giảm (INF-25) và vtctl (INF-26) đọc ghi. Không dùng cho cụm thật (CRD thật do chart APISIX, KEDA).
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: { name: apisixpluginconfigs.apisix.apache.org }
spec:
  group: apisix.apache.org
  scope: Namespaced
  names: { kind: ApisixPluginConfig, plural: apisixpluginconfigs, singular: apisixpluginconfig, shortNames: [apc] }
  versions:
    - name: v2
      served: true
      storage: true
      schema: { openAPIV3Schema: { type: object, x-kubernetes-preserve-unknown-fields: true } }
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata: { name: scaledobjects.keda.sh }
spec:
  group: keda.sh
  scope: Namespaced
  names: { kind: ScaledObject, plural: scaledobjects, singular: scaledobject, shortNames: [so] }
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema: { openAPIV3Schema: { type: object, x-kubernetes-preserve-unknown-fields: true } }
