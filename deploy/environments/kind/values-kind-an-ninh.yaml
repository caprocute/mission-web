# Giá trị security-cell cho cụm kind (INF-19): cụm gọn cluster-gon.yaml (1 control plane + 1 worker); Tetragon chưa
# cài trên kind nên tắt chính sách; kênh SOC tắt (không có webhook thật); tài nguyên nhỏ; ảnh kéo thẳng từ registry gốc
# theo đúng digest của chart (nạp vào node bằng nap-anh.sh). Dùng cùng kiem-thu-an-ninh.sh.
cell: kind
images:
  falco: { repository: docker.io/falcosecurity/falco }
  falcosidekick: { repository: docker.io/falcosecurity/falcosidekick }
  kubeBench: { repository: docker.io/aquasec/kube-bench }
  kured: { repository: ghcr.io/kubereboot/kured }
  busybox: { repository: docker.io/library/busybox }
  pushgateway: { repository: docker.io/prom/pushgateway }
falco:
  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
falcosidekick:
  replicas: 1
  soc:
    enabled: false
tetragon:
  enabled: false
kubeBench:
  targets:
    - name: master
      checks: master,controlplane,etcd,policies
      count: 1
      nodeSelector: { node-role.kubernetes.io/control-plane: "" }
      tolerations:
        - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
    - name: node
      checks: node
      count: 2
      nodeSelector: {}
      tolerations:
        - { operator: Exists }
kured:
  enabled: false
egressProbe:
  schedule: "*/5 * * * *"
