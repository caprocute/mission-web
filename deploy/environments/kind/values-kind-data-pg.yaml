# data-pg thu nhỏ cho kind (INF-11, kiem-thu-du-lieu.sh): chỉ cụm pg-core, một CSDL tenant, hai schema, ảnh minimal.
global: { sizing: compact }
consolidated: "false"
tenantDatabases: [td_a]
layout:
  pg-core: { zone: app, tenantSchemas: [task, okr] }
  pg-flowable: null
  pg-platform: null
  pg-iam: null
  pg-ledger: null
  pg-secure: null
clients:
  pg-core: { rw: [core], ro: [core] }
image:
  repository: ghcr.io/cloudnative-pg/postgresql
  tag: 17.6-minimal-bookworm
  digest: sha256:d45d7a78ec14e80476974c6b123bf929ddb5908f4f4581c275bbe85e61fb93bc
storageClass: standard
hoSo:
  compact:
    pooler: 2
    pg-core: { cpu: 1, memGi: 1, data: 2Gi, wal: "", maxConn: 100 }
pgbouncer:
  image:
    repository: ghcr.io/cloudnative-pg/pgbouncer
    tag: 1.24.1
    digest: sha256:9bce905b0be1ce9c0de8c694ef0cfb8d3707f7dbfb4b51213fc867b5d66b87c3
  resources: { requests: { cpu: 50m, memory: 64Mi }, limits: { cpu: 500m, memory: 128Mi } }
placement:
  app: { nodeSelector: null, tolerations: [] }
externalSecrets: { enabled: false }
# Không có OpenBao trên kind: bỏ khối initdb tạo bao_admin (Secret pg-core-bao-admin-khoi-tao chỉ do ESO sinh; thiếu
# nó thì Job initdb treo ở bước gắn volume).
baoAdmin: { enabled: false }
grantsJob:
  image:
    repository: ghcr.io/cloudnative-pg/postgresql
    digest: sha256:d45d7a78ec14e80476974c6b123bf929ddb5908f4f4581c275bbe85e61fb93bc
monitoring: { enablePodMonitor: false }
# Sao lưu (INF-17) tới RGW zone sn trên kind đóng vai kho sao lưu (HTTP, không SSE): Secret bk-sn-s3-pg tạo tay.
backup:
  endpoint: http://172.18.0.51:8080
  endpointCA: null
  wal: { compression: zstd, encryption: "", maxParallel: 2 }
  data: { compression: lz4, encryption: "", jobs: 1, immediateCheckpoint: true }
  sidecar:
    resources:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 256Mi }
  egressTo: [{ ipBlock: { cidr: 172.18.0.51/32 } }]
  egressPort: 8080
