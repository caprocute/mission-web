# Mẫu tệp digest của một môi trường tạm (INF-21). Pipeline PR (INF-05) dựng và ký ảnh của nhánh rồi ghi
# deploy/environments/pr/digests/pr-<số PR>.yaml lên nhánh moi-truong-pr của kho GitOps bằng bước vtGitopsBump
# (commit có chữ ký); khi PR đóng, pipeline xoá tệp. Tệp mẫu này không khớp mẫu pr-*.yaml nên không sinh Application;
# tests/chay-kiem-thu.sh dùng nó để render thử. Digest dưới đây là giá trị giả, không phải ảnh thật.
images:
