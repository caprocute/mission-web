  org-service: { repository: harbor.vt.local/okr-pr/org-service, digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111" }
  workflow-service: { repository: harbor.vt.local/okr-pr/workflow-service, digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111" }
  scoring-service: { repository: harbor.vt.local/okr-pr/scoring-service, digest: "sha256:1111111111111111111111111111111111111111111111111111111111111111" }
