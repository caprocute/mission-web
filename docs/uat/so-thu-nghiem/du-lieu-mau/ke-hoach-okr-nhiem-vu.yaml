  - {nguoi: Nguyễn Văn Cán Bộ,  tieu_chi_chung: 100%, giai_phap_dot_pha: có}
  - {nguoi: Lê Văn Lãnh Đạo,    tieu_chi_chung: 100%, giai_phap_dot_pha: có, nguoi_dung_dau: có, tap_the_dat_chi_tieu: có}

