[project]
name = "mission-analytics-cube"
version = "0.1.0"
description = "Lớp ngữ nghĩa Cube của kho phân tích (DV-15-03, SVC-15/ADR-14): kiểm thử chỉ số chuẩn"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "testcontainers>=4.9",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S608", "S310"]

[tool.pytest.ini_options]
markers = ["integration: cần Docker (ClickHouse, Cube)"]
