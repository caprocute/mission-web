# DV-15-03 · QT-16 (BR-16-01, BR-16-04) → SCR-1602 (số minh chứng chờ nghiệm thu) → fact_evidence (DV-15-01).
# Kho chỉ có trạng thái và khoá, không có nội dung minh chứng (C2).
cubes:
  - name: evidence
    title: Minh chứng
    description: Minh chứng của sản phẩm nhiệm vụ
    sql_table: cube_evidence
    meta:
      phien_ban: "2026.4"
    joins:
      - name: org_unit
        relationship: many_to_one
        sql: "{CUBE}.tenant_id = {org_unit}.tenant_id AND {CUBE}.org_unit_id = {org_unit}.id"
      - name: period
        relationship: many_to_one
        sql: "{CUBE}.tenant_id = {period}.tenant_id AND {CUBE}.period_id = {period}.id"
    dimensions:
      - name: tenant_id
        sql: "{CUBE}.tenant_id"
        type: string
        public: false
      - name: id
        sql: "toString({CUBE}.id)"
        type: string
        primary_key: true
        public: false
      - name: trang_thai
        title: Trạng thái minh chứng
        sql: "{CUBE}.current_status"
        type: string
      - name: nguon
        title: Nguồn minh chứng
        sql: "{CUBE}.source_type"
        type: string
      - name: ngay_tao
        title: Ngày tạo
        sql: "{CUBE}.created_at"
        type: time
    measures:
      - name: so_minh_chung
        title: Số minh chứng
        type: count
      - name: so_cho_nghiem_thu
        title: Số minh chứng chờ nghiệm thu
        description: Minh chứng đã nộp hoặc đang nghiệm thu
        type: count
        filters:
          - sql: "{CUBE}.current_status IN ('DA_NOP', 'DANG_NGHIEM_THU')"
    pre_aggregations:
      - name: theo_don_vi_ky
        type: rollup
        external: false
        measures: [so_minh_chung, so_cho_nghiem_thu]
        dimensions: [tenant_id, org_unit.id, org_unit.ma, org_unit.ten, org_unit.org_path_dang,
                     org_unit.org_path_chuyen_mon, period.id, period.ma, period.ten]
        refresh_key:
          every: 5 minute
        indexes:
          - name: theo_tenant_nhanh
            columns: [tenant_id]
