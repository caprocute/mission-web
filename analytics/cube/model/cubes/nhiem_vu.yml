# DV-15-03 · QT-16 (BR-16-01) → SCR-1601 (task.ty_le_dung_han, task.so_viec_cham), SCR-1602 (số ngày chậm bình quân)
# → view cube_task trên fact_task, fact_task_assignee (V010). Nhiệm vụ gắn đơn vị chủ trì đang hiệu lực (resolved_unit_id: đơn vị
# được giao, hoặc đơn vị phân công chính của cá nhân chủ trì).
# Định nghĩa (suy luận, ghi ở wiki/14): hạn hiệu lực = hạn gia hạn nếu có, ngược lại hạn ban đầu; "đã đến hạn" là việc
# đã hoàn thành hoặc chưa hoàn thành mà quá hạn hiệu lực; số ngày chậm tính theo ngày lịch.
cubes:
  - name: task
    title: Nhiệm vụ
    description: Nhiệm vụ được giao, theo đơn vị chủ trì
    sql_table: cube_task
    meta:
      phien_ban: "2026.4"
    joins:
      - name: org_unit
        relationship: many_to_one
        sql: "{CUBE}.tenant_id = {org_unit}.tenant_id AND {CUBE}.org_unit_id = {org_unit}.id"
      - name: period
        relationship: many_to_one
        sql: "{CUBE}.tenant_id = {period}.tenant_id AND {CUBE}.period_id = {period}.id"
    dimensions:
      - name: tenant_id
        sql: "{CUBE}.tenant_id"
        type: string
        public: false
      - name: id
        sql: "toString({CUBE}.id)"
        type: string
        primary_key: true
        public: false
      - name: nhom
        title: Loại nhiệm vụ
        sql: "{CUBE}.task_group"
        type: string
      - name: trong_tam
        title: Nhiệm vụ trọng tâm
        sql: "{CUBE}.is_key_task = 1"
        type: boolean
      - name: han
        title: Hạn hoàn thành
        sql: "toDateTime({CUBE}.han, 'Asia/Ho_Chi_Minh')"
        type: time
      - name: ngay_giao
        title: Ngày giao
        sql: "{CUBE}.assigned_at"
        type: time
      - name: ngay_hoan_thanh
        title: Ngày hoàn thành
        sql: "{CUBE}.completed_at"
        type: time
    measures:
      - name: so_viec
        title: Số nhiệm vụ
        type: count
      - name: so_den_han
        title: Số nhiệm vụ đã đến hạn
        description: Nhiệm vụ đã hoàn thành hoặc đã quá hạn mà chưa hoàn thành
        type: count
        filters:
          - sql: "{CUBE}.status = 'HOAN_THANH' OR {CUBE}.dang_cham"
      - name: so_dung_han
        title: Số nhiệm vụ hoàn thành đúng hạn
        type: count
        filters:
          - sql: "{CUBE}.status = 'HOAN_THANH' AND {CUBE}.ngay_lech <= 0"
      - name: ty_le_dung_han
        title: Nhiệm vụ đúng hạn
        description: Tỷ lệ phần trăm nhiệm vụ hoàn thành đúng hạn trên số nhiệm vụ đã đến hạn
        type: number
        sql: "round(100.0 * {tu_dung_han} / nullIf({mau_den_han}, 0), 1)"
        format: percent
      - name: so_viec_cham
        title: Việc chậm cần chỉ đạo
        description: Nhiệm vụ chưa hoàn thành đã quá hạn
        type: count
        filters:
          - sql: "{CUBE}.dang_cham"
      - name: so_viec_tre
        title: Số nhiệm vụ trễ hạn
        description: Nhiệm vụ đang chậm hoặc đã hoàn thành sau hạn
        type: count
        filters:
          - sql: "{CUBE}.ngay_lech > 0 AND ({CUBE}.status = 'HOAN_THANH' OR {CUBE}.dang_cham)"
      # Bản riêng của các số đếm dùng làm tử số, mẫu số: ClickHouse hiểu sai bí danh khi cùng một measure vừa được chọn
      # vừa nằm trong biểu thức tỷ lệ của truy vấn trên pre-aggregation (lỗi hàm gộp lồng nhau).
      - name: tu_dung_han
        type: count
        filters:
          - sql: "{CUBE}.status = 'HOAN_THANH' AND {CUBE}.ngay_lech <= 0"
        public: false
      - name: mau_den_han
        type: count
        filters:
          - sql: "{CUBE}.status = 'HOAN_THANH' OR {CUBE}.dang_cham"
        public: false
      - name: mau_viec_tre
        type: count
        filters:
          - sql: "{CUBE}.ngay_lech > 0 AND ({CUBE}.status = 'HOAN_THANH' OR {CUBE}.dang_cham)"
        public: false
      - name: tong_ngay_cham
        title: Tổng số ngày chậm
        type: sum
        sql: "if({CUBE}.ngay_lech > 0 AND ({CUBE}.status = 'HOAN_THANH' OR {CUBE}.dang_cham), {CUBE}.ngay_lech, 0)"
        public: false
      - name: so_ngay_cham_binh_quan
        title: Số ngày chậm bình quân
        description: Số ngày lịch chậm bình quân của các nhiệm vụ trễ hạn
        type: number
        sql: "round({tong_ngay_cham} / nullIf({mau_viec_tre}, 0), 1)"
    pre_aggregations:
      - name: theo_don_vi_ky
        type: rollup
        external: false
        measures: [so_viec, so_den_han, so_dung_han, so_viec_cham, so_viec_tre, tu_dung_han, mau_den_han, mau_viec_tre,
                   tong_ngay_cham]
        dimensions: [tenant_id, nhom, org_unit.id, org_unit.ma, org_unit.ten, org_unit.org_path_dang,
                     org_unit.org_path_chuyen_mon, period.id, period.ma, period.ten, period.luong]
        refresh_key:
          every: 5 minute
        indexes:
          - name: theo_tenant_nhanh
            columns: [tenant_id]
