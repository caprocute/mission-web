# DV-15-03 · QT-16 → SCR-1601 (trường Kỳ), SCR-1602 → dim_period (DV-15-01).
cubes:
  - name: period
    title: Kỳ đánh giá
    description: Kỳ đánh giá (quý, năm) của tenant
    sql_table: cube_period
    meta:
      phien_ban: "2026.4"
    dimensions:
      - name: tenant_id
        sql: "{CUBE}.tenant_id"
        type: string
        public: false
      - name: id
        title: Mã định danh kỳ
        sql: "toString({CUBE}.id)"
        type: string
        primary_key: true
        public: true
      - name: ma
        title: Mã kỳ
        sql: "{CUBE}.code"
        type: string
      - name: ten
        title: Kỳ
        sql: "{CUBE}.name"
        type: string
      - name: loai
        title: Loại kỳ
        sql: "{CUBE}.kind"
        type: string
      - name: luong
        title: Luồng đánh giá
        description: Luồng Đảng hoặc luồng Nhà nước
        sql: "{CUBE}.flow"
        type: string
      - name: bat_dau
        title: Ngày bắt đầu kỳ
        sql: "toDateTime({CUBE}.start_date)"
        type: time
      - name: ket_thuc
        title: Ngày kết thúc kỳ
        sql: "toDateTime({CUBE}.end_date)"
        type: time
