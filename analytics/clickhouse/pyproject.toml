[project]
name = "mission-analytics-clickhouse"
version = "0.1.0"
description = "Kho phân tích ClickHouse của cell (DV-15-01, SVC-15/ADR-14): migration và kiểm thử"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "testcontainers>=4.9",
    "confluent-kafka>=2.6",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S608"]
"migrate.py" = ["S608"]

[tool.pytest.ini_options]
markers = ["integration: cần Docker (ClickHouse, Kafka)"]
