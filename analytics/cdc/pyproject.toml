[project]
name = "mission-analytics-cdc"
version = "0.1.0"
description = "cdc-config-gen: cấu hình connector Debezium phân tích sinh từ phân loại cột (DV-15-02, SVC-15/ADR-14)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "testcontainers>=4.9",
    "confluent-kafka>=2.6",
    "psycopg[binary]>=3.2",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S103", "S105", "S106", "S311", "S603", "S608"]
# Tên schema, bảng ghép vào SQL sinh ra chỉ gồm [a-z0-9_] (lấy bằng regex \w+ từ V005 của kho ClickHouse).
"cdc_config_gen.py" = ["S608"]

[tool.pytest.ini_options]
markers = ["integration: cần Docker (PostgreSQL, Kafka, Debezium Connect)"]
