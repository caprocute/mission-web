[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaly-job"
version = "0.1.0"
description = "SVC-15 job phát hiện bất thường hằng đêm trên ClickHouse, phát EVT-20 (DV-15-07)"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.28,<1",
    "confluent-kafka>=2.6,<3",
    "fastavro>=1.13.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "testcontainers>=4.9",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
]

[project.scripts]
anomaly-job = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
app = ["rules/*.sql"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "S608", "S310"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: cần Docker (ClickHouse, Kafka, Apicurio)"]
