[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gateway"
version = "0.1.0"
description = "SVC-14 ai-gateway: cổng mô hình ngôn ngữ chỉ đọc của nền tảng Mission"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "asyncpg>=0.30,<1",
    "httpx>=0.28,<1",
    "pyjwt[crypto]>=2.10,<3",
    "prometheus-client>=0.21,<1",
    "jsonschema>=4.23,<5",
    "pypdf>=6.21.2,<7",
    "aiokafka>=0.14.0,<1",
    "fastavro>=1.13.1,<2",
    "pillow>=11,<13",
    "av>=14,<18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "anyio>=4.6",
    "testcontainers[postgres]>=4.9",
    "psycopg[binary]>=3.2",
    "ruff>=0.8",
    "mypy>=1.13",
    "pip-audit>=2.7",
    "openapi-core>=0.19",
    "pyyaml>=6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.guard" = ["c2_fields.json"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
mypy_path = "../vtplatform"

[[tool.mypy.overrides]]
module = ["vtplatform.*"]
follow_imports = "silent"
ignore_errors = true

[[tool.mypy.overrides]]
module = ["asyncpg.*", "yaml.*", "jsonschema.*", "aiokafka.*", "docker.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# vtplatform (NEN-018) nạp từ mã nguồn vì pyproject của thư viện trỏ readme ra ngoài thư mục gói.
pythonpath = [".", "../vtplatform"]
markers = ["integration: cần Docker (Testcontainers PostgreSQL 17 + pgvector)"]
