clientScopesCondition=Phạm vi mong đợi
clientScopesConditionTooltip=Danh sách phạm vi client mong đợi. Điều kiện đúng nếu yêu cầu của client khớp với một trong các phạm vi client. Điều này còn phụ thuộc vào phạm vi client là mặc định hay tùy chọn theo “Loại phạm vi” đã cấu hình.
clientScopesHelp=Dùng các phạm vi được yêu cầu hoặc gán sẵn cho client để quyết định có áp dụng chính sách cho client hay không. Điều kiện được đánh giá trong yêu cầu phân quyền và/hoặc yêu cầu token OpenID Connect.
clientScopesRolesScope=Nếu chưa định nghĩa ánh xạ phạm vi vai trò, mọi người dùng đều được dùng phạm vi client này. Nếu đã định nghĩa, người dùng phải là thành viên của ít nhất một trong các vai trò.
clientSecret=Khóa bí mật client
