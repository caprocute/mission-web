mapperTypeMsadLdsUserAccountControlMapper=msad-user-account-control-mapper
mapperTypeMsadLdsUserAccountControlMapperHelp=Bộ ánh xạ dành riêng cho MSAD LDS. Có thể tích hợp trạng thái tài khoản người dùng MSAD LDS vào trạng thái tài khoản Keycloak (tài khoản đang bật, mật khẩu hết hạn…). Bộ ánh xạ đọc các thuộc tính “msDS-UserAccountDisabled”, “msDS-UserPasswordExpired” và “pwdLastSet” để làm việc này. Ví dụ, nếu “pwdLastSet” bằng 0, người dùng Keycloak phải cập nhật mật khẩu. Ví dụ khác, nếu “msDS-UserAccountDisabled” là “TRUE”, người dùng Keycloak cũng bị vô hiệu hóa. Bộ ánh xạ này cũng xử lý được mã ngoại lệ từ quá trình xác thực người dùng LDAP.
mapperTypeMsadUserAccountControlManager=msad-user-account-control-mapper
mapperTypeMsadUserAccountControlManagerHelp=Bộ ánh xạ dành riêng cho MSAD. Có thể tích hợp trạng thái tài khoản người dùng MSAD vào trạng thái tài khoản Keycloak (tài khoản bật, mật khẩu hết hạn…), dựa trên thuộc tính MSAD userAccountControl và pwdLastSet. Ví dụ, nếu pwdLastSet là 0, người dùng Keycloak phải cập nhật mật khẩu; nếu userAccountControl là 514 (tài khoản bị tắt), người dùng Keycloak cũng bị tắt. Bộ ánh xạ cũng xử lý được mã ngoại lệ khi xác thực người dùng LDAP.
