usermodel.clientRoleMapping.clientId.label=Client ID
usermodel.clientRoleMapping.clientId.tooltip=Client ID cho ánh xạ vai trò. Chỉ vai trò client của client này được thêm vào token. Nếu không đặt, vai trò client của mọi client sẽ được thêm vào token.
usermodel.clientRoleMapping.rolePrefix.label=Tiền tố vai trò client
usermodel.clientRoleMapping.rolePrefix.tooltip=Tiền tố được thêm vào trước tên mỗi vai trò client (không bắt buộc).
usermodel.clientRoleMapping.tokenClaimName.tooltip=Tên claim chèn vào token. Có thể là tên đầy đủ như “address.street”; khi đó một đối tượng JSON lồng nhau được tạo. Để tránh lồng nhau và dùng dấu chấm theo nghĩa đen, thêm dấu gạch chéo ngược trước dấu chấm (\\.). Có thể dùng token đặc biệt ${client_id}; token này được thay bằng client ID thực tế. Ví dụ: “resource_access.${client_id}.roles”. Tùy chọn này đặc biệt hữu ích khi thêm vai trò từ mọi client, tức là “Client ID” bị tắt, và muốn lưu vai trò client của từng client riêng biệt.
usermodel.prop.label=Thuộc tính
usermodel.prop.tooltip=Tên phương thức thuộc tính trong giao diện UserModel. Ví dụ, giá trị “email” tham chiếu phương thức UserModel.getEmail().
