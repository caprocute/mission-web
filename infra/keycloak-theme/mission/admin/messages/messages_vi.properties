validatingPublicKeyId=ID khóa công khai kiểm tra
validatingPublicKeyIdHelp=ID tường minh của khóa công khai kiểm tra ở trên. Để trống nếu luôn dùng khóa trên bất kể ID khóa do IDP ngoài chỉ định; đặt giá trị nếu chỉ dùng khóa khi ID khóa từ IDP ngoài khớp.
validatingX509Certs=Chứng thư X509 kiểm tra
validatingX509CertsHelp=Các chứng thư công khai Keycloak dùng để kiểm tra chữ ký của yêu cầu và phản hồi SAML từ IDP bên ngoài khi tắt “Use metadata descriptor URL”. Có thể nhập nhiều chứng thư, cách nhau bằng dấu phẩy (,). Có thể nhập lại chứng thư từ URL metadata descriptor bằng thao tác “Import Keys” trên trang nhà cung cấp định danh. Thao tác này tải các chứng thư hiện tại từ endpoint metadata và gán vào cấu hình của chính tùy chọn này. Bấm Lưu để lưu hẳn các chứng thư đã nhập lại.
