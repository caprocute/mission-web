userObjectClasses=Lớp đối tượng người dùng
userObjectClassesHelp=Mọi giá trị của thuộc tính objectClass LDAP cho người dùng trong LDAP, phân cách bằng dấu phẩy. Ví dụ: “inetOrgPerson, organizationalPerson”. Người dùng Keycloak mới tạo sẽ được ghi vào LDAP với tất cả các lớp đối tượng này, và bản ghi người dùng LDAP hiện có chỉ được tìm thấy nếu chứa đủ các lớp đối tượng này.
