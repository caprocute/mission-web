usersPermissionsHint=Quyền chi tiết để quản lý mọi người dùng trong realm. Có thể định nghĩa các chính sách khác nhau về ai được phép quản lý người dùng trong realm.
usersResources=Người dùng
uuidLdapAttribute=Thuộc tính LDAP UUID
uuidLdapAttributeHelp=Tên thuộc tính LDAP dùng làm định danh đối tượng duy nhất (UUID) cho các đối tượng trong LDAP. Với nhiều máy chủ LDAP là “entryUUID”, nhưng một số khác. Ví dụ với Active Directory là “objectGUID”. Nếu máy chủ LDAP không hỗ trợ khái niệm UUID, có thể dùng thuộc tính bất kỳ khác có giá trị duy nhất giữa các người dùng LDAP trong cây, ví dụ “uid” hoặc “entryDN”.
validPostLogoutRedirectURIs=Mẫu URI hợp lệ mà trình duyệt có thể chuyển hướng tới sau khi đăng xuất thành công. Giá trị “+” hoặc để trống sẽ dùng danh sách URI chuyển hướng hợp lệ. Giá trị “-” không cho phép URI chuyển hướng nào sau đăng xuất. Cho phép ký tự đại diện đơn giản như “http://example.com/*”. Cũng có thể chỉ định đường dẫn tương đối như /my/relative/path/*. Đường dẫn tương đối tính theo URL gốc của client; nếu chưa chỉ định, dùng URL gốc của máy chủ xác thực.
validPostLogoutRedirectURIsHelp=Mẫu URI hợp lệ mà trình duyệt có thể chuyển hướng tới sau khi đăng xuất thành công. Giá trị “+” hoặc để trống sẽ dùng danh sách URI chuyển hướng hợp lệ. Giá trị “-” không cho phép URI chuyển hướng nào sau đăng xuất. Cho phép ký tự đại diện đơn giản như “http://example.com/*”. Cũng có thể chỉ định đường dẫn tương đối như /my/relative/path/*. Đường dẫn tương đối tính theo URL gốc của client; nếu chưa chỉ định, dùng URL gốc của máy chủ xác thực.
validPostLogoutRedirectUri=URI chuyển hướng hợp lệ sau đăng xuất
validRedirectURIs=Mẫu URI hợp lệ mà trình duyệt được chuyển hướng tới sau khi đăng nhập thành công. Cho phép ký tự đại diện đơn giản như “http://example.com/*”. Có thể dùng đường dẫn tương đối như /my/relative/path/*; đường dẫn tương đối tính từ URL gốc của client, nếu chưa chỉ định thì dùng URL gốc của máy chủ xác thực. Với SAML, đặt mẫu URI hợp lệ nếu dựa vào URL dịch vụ tiếp nhận nhúng trong yêu cầu đăng nhập.
validRedirectURIsHelp=Mẫu URI hợp lệ mà trình duyệt được chuyển hướng tới sau khi đăng nhập thành công. Cho phép ký tự đại diện đơn giản như “http://example.com/*”. Có thể dùng đường dẫn tương đối như /my/relative/path/*; đường dẫn tương đối tính từ URL gốc của client, hoặc URL gốc của máy chủ xác thực nếu chưa chỉ định. Với SAML, bắt buộc đặt mẫu URI hợp lệ nếu dựa vào URL dịch vụ tiếp nhận nhúng trong yêu cầu đăng nhập.
validRedirectUri=URI chuyển hướng hợp lệ
validRequestURIs=URI yêu cầu hợp lệ
validRequestURIsHelp=Danh sách URI hợp lệ dùng làm giá trị tham số “request_uri” trong yêu cầu xác thực OpenID Connect. Không hỗ trợ các khả năng như URI chuyển hướng hợp lệ, ví dụ ký tự đại diện hay đường dẫn tương đối.
