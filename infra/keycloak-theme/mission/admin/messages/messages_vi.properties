clientRolesHelp=Điều kiện kiểm tra client có một trong các vai trò client chỉ định hay không để quyết định áp dụng chính sách. Điều kiện này cho phép quản trị viên client tạo vai trò client có tên chỉ định trên client để bảo đảm chính sách client tương ứng được áp dụng cho các yêu cầu của client đó. Điều kiện được kiểm tra trong hầu hết yêu cầu OpenID Connect (yêu cầu phân quyền, yêu cầu token, yêu cầu tới điểm cuối introspection…).
