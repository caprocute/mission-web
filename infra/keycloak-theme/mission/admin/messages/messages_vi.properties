usermodel.realmRoleMapping.rolePrefix.tooltip=Tiền tố được thêm vào trước tên mỗi vai trò realm (không bắt buộc).
username=Tên đăng nhập
usernameHelperText=Nhập tên đăng nhập của người dùng tại nhà cung cấp định danh này.
usernameLdapAttribute=Thuộc tính LDAP tên đăng nhập
usernameLdapAttributeHelp=Tên thuộc tính LDAP được ánh xạ thành tên đăng nhập Keycloak. Với nhiều máy chủ LDAP, có thể là “uid”. Với Active Directory, có thể là “sAMAccountName” hoặc “cn”. Thuộc tính này cần có giá trị ở mọi bản ghi người dùng LDAP muốn nhập vào Keycloak.
usernameTemplateImporter=Định dạng tên đăng nhập khi nhập.
users=Người dùng
usersAddedError=Không thể thêm người dùng vào nhóm: {{error}}
usersAdded_one=Đã thêm {{count}} người dùng vào nhóm
usersAdded_other=Đã thêm {{count}} người dùng vào nhóm
usersDN=Users DN
usersDNHelp=DN đầy đủ của nhánh cây LDAP chứa người dùng. DN này là cha của các người dùng LDAP. Ví dụ “ou=users,dc=example,dc=com” nếu người dùng điển hình có DN dạng “uid=john,ou=users,dc=example,dc=com”.
