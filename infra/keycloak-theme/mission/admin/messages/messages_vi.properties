userGroupsRetrieveStrategy=Cách truy xuất nhóm người dùng
userGroupsRetrieveStrategyHelp=Chỉ định cách lấy nhóm của người dùng. LOAD_GROUPS_BY_MEMBER_ATTRIBUTE nghĩa là lấy bằng truy vấn LDAP mọi nhóm có “member” là người dùng. GET_GROUPS_FROM_USER_MEMBEROF_ATTRIBUTE nghĩa là lấy từ thuộc tính “memberOf” của người dùng hoặc thuộc tính khác chỉ định tại “Thuộc tính LDAP Member-Of”.
userHelp=Tùy chọn chọn người dùng để tạo access token mẫu. Nếu không chọn, sẽ không tạo access token mẫu khi đánh giá.
userID=ID người dùng
userIDClaim=Claim ID
userIDClaimHelp=Tên claim trong tài liệu JSON do endpoint hồ sơ người dùng trả về, biểu thị mã định danh duy nhất của người dùng. Nếu không cung cấp, mặc định là `sub`.
userId=ID người dùng
userIdHelperText=Nhập ID duy nhất của người dùng cho nhà cung cấp định danh này.
userInfo=User info
userInfoResponseEncryptionContentEncryptionAlgorithm=Thuật toán mã hóa nội dung phản hồi user info
userInfoResponseEncryptionContentEncryptionAlgorithmHelp=Thuật toán JWA dùng mã hóa nội dung khi mã hóa phản hồi của điểm cuối User Info. Nếu đã chỉ định thuật toán quản lý khóa mã hóa phản hồi User Info, giá trị mặc định là A128CBC-HS256.
userInfoResponseEncryptionKeyManagementAlgorithm=Thuật toán quản lý khóa mã hóa phản hồi user info
userInfoResponseEncryptionKeyManagementAlgorithmHelp=Thuật toán JWA dùng quản lý khóa khi mã hóa phản hồi của điểm cuối User Info. Cần thiết lập nếu muốn mã hóa phản hồi User Info. Nếu để trống, phản hồi không được mã hóa.
userInfoSettings=Thiết lập user info
userInfoSignedResponseAlgorithm=Thuật toán ký phản hồi user info
userInfoSignedResponseAlgorithmHelp=Thuật toán JWA dùng để ký phản hồi của User Info Endpoint. Nếu đặt “unsigned”, phản hồi User Info sẽ không được ký và trả về ở định dạng application/json.
userInfoUrl=URL User Info
