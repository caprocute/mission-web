userRoleMappingUpdatedSuccess=Đã cập nhật gán vai trò người dùng
userRolesRetrieveStrategy=Cách truy xuất vai trò người dùng
userRolesRetrieveStrategyHelp=Chỉ định cách truy xuất vai trò của người dùng. LOAD_ROLES_BY_MEMBER_ATTRIBUTE nghĩa là vai trò được lấy bằng truy vấn LDAP tìm mọi vai trò có “member” là người dùng. GET_ROLES_FROM_USER_MEMBEROF nghĩa là vai trò được lấy từ thuộc tính “memberOf” của người dùng, hoặc từ các thuộc tính khác chỉ định trong “Thuộc tính LDAP Member-Of”. LOAD_ROLES_BY_MEMBER_ATTRIBUTE chỉ áp dụng cho Active Directory, nghĩa là vai trò của người dùng được lấy đệ quy bằng phần mở rộng LDAP_MATCHING_RULE_IN_CHAIN.
userSaved=Đã lưu người dùng
