clientOfflineSessionIdle=Thời gian chờ phiên ngoại tuyến client
clientOfflineSessionIdleHelp=Thời gian phiên ngoại tuyến của client được phép không hoạt động trước khi hết hạn. Token ngoại tuyến bị vô hiệu khi phiên ngoại tuyến của client hết hạn. Tùy chọn này không ảnh hưởng đến phiên SSO chung của người dùng. Nếu không đặt, dùng giá trị Thời gian chờ phiên ngoại tuyến của realm.
clientOfflineSessionMax=Thời hạn tối đa phiên ngoại tuyến client
clientOfflineSessionMaxHelp=Thời gian tối đa trước khi phiên ngoại tuyến của client hết hạn. Nếu bật Offline Session Max Limited ở cấp realm, token ngoại tuyến sẽ mất hiệu lực khi phiên ngoại tuyến của client hết hạn. Tùy chọn này không ảnh hưởng đến phiên SSO chung của người dùng. Nếu để trống, dùng giá trị Offline Session Max của realm.
