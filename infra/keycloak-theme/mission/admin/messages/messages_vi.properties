clientSignature=Yêu cầu chữ ký client
clientSignatureHelp=Client có ký các yêu cầu và phản hồi SAML không? Có cần kiểm tra chữ ký không?
clientType=Loại client
clientTypeHelp=“OpenID Connect” cho phép client xác minh danh tính người dùng cuối dựa trên xác thực do máy chủ phân quyền thực hiện. “SAML” hỗ trợ các kịch bản xác thực và phân quyền trên web, kể cả đăng nhập một lần (SSO) liên miền, dùng token bảo mật chứa assertion để truyền thông tin.
clientUpdaterContext=Điều kiện kiểm tra ngữ cảnh tạo hoặc cập nhật client để xác định có áp dụng chính sách hay không. Ví dụ, kiểm tra client được tạo bằng admin REST API hay đăng ký client động OIDC. Với trường hợp sau, kiểm tra đó là đăng ký client ANONYMOUS hay đăng ký client AUTHENTICATED bằng Initial access token hoặc Registration access token, v.v.
clientUpdaterSourceGroups=Nhóm
clientUpdaterSourceGroupsHelp=Điều kiện kiểm tra nhóm của thực thể đang tạo/cập nhật client để xác định có áp dụng chính sách hay không.
clientUpdaterSourceGroupsTooltip=Tên các nhóm cần kiểm tra. Điều kiện đúng nếu thực thể tạo hoặc cập nhật client là thành viên của một hoặc nhiều nhóm đã chỉ định. Nhóm được chỉ định bằng tên đơn giản, phải trùng tên nhóm Keycloak. Không hỗ trợ phân cấp nhóm.
clientUpdaterSourceHost=Điều kiện kiểm tra máy chủ/tên miền của thực thể đang tạo/cập nhật client để xác định có áp dụng chính sách hay không.
clientUpdaterSourceRoles=Vai trò của chủ thể cập nhật
clientUpdaterSourceRolesHelp=Điều kiện kiểm tra vai trò của thực thể đang tạo/cập nhật client để xác định có áp dụng chính sách hay không.
clientUpdaterSourceRolesTooltip=Điều kiện được kiểm tra khi đăng ký hoặc cập nhật client; điều kiện đúng nếu thực thể (thường là người dùng) đang tạo hoặc cập nhật client thuộc vai trò đã chỉ định. Để tham chiếu vai trò realm, dùng tên vai trò realm, ví dụ “my_realm_role”. Để tham chiếu vai trò client, dùng client_id.role_name; ví dụ “my_client.my_client_role” là vai trò client “my_client_role” của client “my_client”.
