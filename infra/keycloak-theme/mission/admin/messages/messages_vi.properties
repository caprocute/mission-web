clientSessionIdleHelp=Thời gian phiên client được phép không hoạt động trước khi hết hạn. Token mất hiệu lực khi phiên client hết hạn. Tùy chọn này không ảnh hưởng đến phiên SSO chung của người dùng. Nếu để trống, dùng giá trị SSO Session Idle chuẩn.
clientSessionMax=Thời gian tối đa phiên client
clientSessionMaxHelp=Thời gian tối đa trước khi phiên client hết hạn. Token bị vô hiệu khi phiên hết hạn. Tùy chọn này không ảnh hưởng đến phiên SSO chung của người dùng. Nếu không đặt, dùng giá trị Thời gian tối đa phiên SSO tiêu chuẩn.
clientSessionSettings=Thiết lập phiên client
