userInitiatedActionLifespan=Thời hạn thao tác do người dùng khởi tạo
userInitiatedActionLifespanHelp=Thời gian tối đa trước khi giấy phép thao tác do người dùng gửi (ví dụ thư quên mật khẩu) hết hạn. Nên đặt ngắn vì người dùng thường phản hồi nhanh thao tác do chính mình tạo.
