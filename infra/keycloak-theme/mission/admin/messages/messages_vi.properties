useDiscoveryEndpoint=Dùng điểm cuối discovery
useDiscoveryEndpointHelp=Nếu bật, điểm cuối discovery được dùng để lấy cấu hình nhà cung cấp. Keycloak có thể tải cấu hình từ điểm cuối và tự động cập nhật khi nguồn thay đổi.
useEntityDescriptor=Dùng entity descriptor
useEntityDescriptorHelp=Nhập siêu dữ liệu từ SAML entity descriptor của IDP từ xa.
useJwksUrl=Dùng URL JWKS
useJwksUrlHelp=Nếu BẬT, khóa công khai của nhà cung cấp định danh được tải từ URL JWKS chỉ định. Cách này rất linh hoạt vì khóa mới được tải lại khi nhà cung cấp định danh sinh cặp khóa mới. Nếu TẮT, dùng khóa công khai (hoặc chứng thư) trong cơ sở dữ liệu Keycloak; do đó khi cặp khóa của nhà cung cấp định danh thay đổi, cần nhập lại khóa mới vào cơ sở dữ liệu Keycloak.
useKerberosForPasswordAuthentication=Dùng Kerberos để xác thực mật khẩu
useKerberosForPasswordAuthenticationHelp=Dùng mô-đun đăng nhập Kerberos để xác thực tên đăng nhập/mật khẩu với máy chủ Kerberos thay vì xác thực với máy chủ LDAP qua Directory Service API.
useLowerCaseBearerType=Dùng kiểu bearer chữ thường trong phản hồi token
useLowerCaseBearerTypeHelp=Nếu bật, phản hồi token sẽ đặt loại “bearer” dạng chữ thường. Mặc định, máy chủ đặt loại “Bearer” theo RFC6750.
useMetadataDescriptorUrl=Dùng URL metadata descriptor
useMetadataDescriptorUrlHelp=Nếu bật, chứng thư dùng kiểm tra chữ ký được tải về và lưu đệm từ “URL metadata descriptor”. Thao tác “Tải lại khóa” dùng để làm mới chứng thư trong bộ đệm. Nếu tắt, dùng chứng thư ở tùy chọn “Chứng thư X509 kiểm tra” và phải cập nhật thủ công khi IDP thay đổi.
useRealmRolesMapping=Dùng gán vai trò realm
useRealmRolesMappingHelp=Nếu bật, gán vai trò LDAP được ánh xạ sang gán vai trò realm trong Keycloak; nếu không, ánh xạ sang gán vai trò client.
useRefreshTokenForClientCredentialsGrant=Dùng refresh token cho client credentials grant
useRefreshTokenForClientCredentialsGrantHelp=Nếu bật, refresh_token sẽ được tạo và thêm vào phản hồi token khi dùng client_credentials grant. Mục 4.4.3 của OAuth 2.0 RFC6749 nêu rằng không nên sinh refresh_token khi dùng client_credentials grant. Nếu tắt, không sinh refresh_token và phiên người dùng liên quan sẽ bị gỡ.
useRefreshTokens=Dùng refresh token
useRefreshTokensHelp=Nếu bật, refresh_token sẽ được tạo và thêm vào phản hồi token. Nếu tắt, không tạo refresh_token.
useRfc9068AccessTokenType=Dùng “at+jwt” làm kiểu header của access token
useRfc9068AccessTokenTypeHelp=Nếu bật, access token có header type “at+jwt” theo RFC9068. Nếu tắt, header type là “JWT”.
useTruststoreSpi=Dùng Truststore SPI
useTruststoreSpiHelp=Chỉ định kết nối LDAP có dùng Truststore SPI với kho tin cậy cấu hình trong tùy chọn dòng lệnh hay không. “Luôn luôn” nghĩa là luôn dùng. “Không bao giờ” nghĩa là không dùng. Lưu ý: kể cả khi chưa cấu hình kho tin cậy Keycloak, java cacerts mặc định hoặc chứng thư chỉ định bởi thuộc tính “javax.net.ssl.trustStore” vẫn được dùng.
