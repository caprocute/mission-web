# APISIX chế độ standalone (dev): đọc route từ apisix.yaml, không cần etcd.
apisix:
  node_listen: 9080
  enable_admin: false
  # Máy chủ dev và container không bật IPv6.
  enable_ipv6: false
  # DNS của Docker trả TTL 600 s: container service tạo lại (deploy-backend.sh) có IP mới, worker còn giữ IP cũ thì
  # trả 502 tới mười phút. Giữ kết quả phân giải tên upstream tối đa 5 s.
  dns_resolver_valid: 5
deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml
# Biến môi trường mà apisix.yaml đọc bằng ${{...}} phải được khai cho tiến trình worker của nginx.
nginx_config:
  envs:
    - KEYCLOAK_PUBLIC_ISSUER
plugins:
  - cors
  - fault-injection
  - limit-count
  - openid-connect
  - proxy-rewrite
  - request-id
  - opentelemetry
