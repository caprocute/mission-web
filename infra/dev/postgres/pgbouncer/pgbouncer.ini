;; =============================================================================
;; NEN-020 · NEN-033 · TL-03 "Quy hoạch kết nối và PgBouncer", TL-04 mục 3.
;; Cấu hình PgBouncer chế độ transaction cho môi trường dev (cổng 35433 -> 6432).
;; =============================================================================

[databases]
mission = host=postgres port=5432 dbname=mission
flowable = host=postgres port=5432 dbname=flowable
ledger = host=postgres port=5432 dbname=ledger
keycloak = host=postgres port=5432 dbname=keycloak
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /tmp/userlist.txt

;; Chế độ gộp kết nối theo giao dịch (TL-03: HikariCP kết nối qua PgBouncer)
pool_mode = transaction
max_prepared_statements = 200
default_pool_size = 20
min_pool_size = 2
reserve_pool_size = 5
reserve_pool_timeout = 3
max_client_conn = 2000
max_db_connections = 100

;; Đặt lại trạng thái phiên sau mỗi giao dịch để không rò rỉ app.current_tenant_id
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits,options,search_path

;; Thời gian chờ an toàn
server_idle_timeout = 120
server_lifetime = 1800
server_connect_timeout = 5
query_wait_timeout = 10
client_idle_timeout = 0

admin_users = mission_admin
stats_users = mission_admin
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
pidfile = /tmp/pgbouncer.pid
unix_socket_dir = /tmp
