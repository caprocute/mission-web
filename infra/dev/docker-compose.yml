# =============================================================================
# HẠ TẦNG DEV DÙNG CHUNG — DỰ ÁN MISSION (QĐ 366 · OKR/KPI)
# =============================================================================
# Ánh xạ công nghệ theo TL-01 Phụ lục B & TL-04:
#   - PostgreSQL 17 (+ pg_partman) + PgBouncer (transaction mode)
#   - Valkey 8, Keycloak 26
#   - OPA 1.x (RBAC/ABAC Rego), OpenBao 2.x (Transit KEK + KV v2)
#   - Kafka 3.9 (KRaft, không ZooKeeper), Apicurio Registry 3.x, Debezium 3.x
#   - MinIO (S3 tương thích Ceph RGW), OpenSearch 2.x (thay Elasticsearch)
#   - OpenTelemetry Collector, Prometheus, Loki, Tempo, Grafana
#
# Toàn bộ cổng host nằm trong dải 35xxx và đều cấu hình động qua biến môi trường
# trong .env để hỗ trợ kết nối qua cổng hầm SSH (SSH local port forwarding)
# khi máy chủ dev hạn chế mở cổng tường lửa.
#
# Các profile khởi chạy:
#   core     (mặc định): postgres, pgbouncer, valkey, keycloak
#   security           : opa, openbao, openbao-init
#   events             : kafka, apicurio, debezium
#   search             : minio, minio-init, opensearch
#   obs                : otel-collector, prometheus, loki, tempo, grafana
#   all                : tất cả dịch vụ trên
# =============================================================================

name: mission-dev

services:
  # ---------------------------------------------------------------------------
  # PROFILE: core — CSDL, bộ gộp kết nối PgBouncer, bộ nhớ đệm, xác thực OIDC
  # ---------------------------------------------------------------------------
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: mission/postgres:17-partman
    container_name: mission-dev-postgres
    restart: unless-stopped
    profiles: ["core", "all"]
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mission_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Chưa đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:-mission}
      DB_ROLE_PASSWORD_DEFAULT: ${DB_ROLE_PASSWORD_DEFAULT:-${POSTGRES_PASSWORD}}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Chưa đặt KEYCLOAK_DB_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-35432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/migrate-roles.sh:/usr/local/bin/migrate-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mission_admin} -d ${POSTGRES_DB:-mission}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p0
    container_name: mission-dev-pgbouncer
    restart: unless-stopped
    profiles: ["core", "all"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mission_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-mission}
      DB_ROLE_PASSWORD_DEFAULT: ${DB_ROLE_PASSWORD_DEFAULT:-${POSTGRES_PASSWORD}}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "${PGBOUNCER_PORT:-35433}:6432"
    volumes:
      - ./postgres/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./postgres/pgbouncer/entrypoint.sh:/etc/pgbouncer/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/etc/pgbouncer/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-mission_admin} -d ${POSTGRES_DB:-mission}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  valkey:
    image: valkey/valkey:8-alpine
    container_name: mission-dev-valkey
    restart: unless-stopped
    profiles: ["core", "all"]
    command:
      - "valkey-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--requirepass"
      - "${VALKEY_PASSWORD:?Chưa đặt VALKEY_PASSWORD trong .env}"
    ports:
      - "${VALKEY_PORT:-35379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mission-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: mission-dev-keycloak
    restart: unless-stopped
    profiles: ["core", "all"]
    command:
      - "start-dev"
      - "--import-realm"
      - "--http-port=8080"
      - "--health-enabled=true"
      - "--metrics-enabled=true"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Chưa đặt KEYCLOAK_ADMIN_PASSWORD trong .env}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${KEYCLOAK_PORT:-35080}:8080"
    volumes:
      - ./keycloak/realm-mission.json:/opt/keycloak/data/import/realm-mission.json:ro
      - ../keycloak-theme/mission:/opt/keycloak/themes/mission:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - mission-net

  # ---------------------------------------------------------------------------
  # PROFILE: security — Phân quyền OPA 1.x (Rego) & Quản lý khoá OpenBao 2.x
  # ---------------------------------------------------------------------------
  opa:
    image: openpolicyagent/opa:1.4.0
    container_name: mission-dev-opa
    restart: unless-stopped
    profiles: ["security", "all"]
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--watch"
      - "/policies"
    ports:
      - "${OPA_PORT:-35181}:8181"
    volumes:
      - ./opa/policies:/policies:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "data.okrkpi.authz.allow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  openbao:
    image: quay.io/openbao/openbao:2.2.0
    container_name: mission-dev-openbao
    restart: unless-stopped
    profiles: ["security", "all"]
    command:
      - "server"
      - "-dev"
      - "-dev-listen-address=0.0.0.0:8200"
      - "-dev-root-token-id=${OPENBAO_DEV_ROOT_TOKEN:-mission_openbao_dev_token}"
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN:-mission_openbao_dev_token}
      BAO_ADDR: http://127.0.0.1:8200
    ports:
      - "${OPENBAO_PORT:-35820}:8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  openbao-init:
    image: quay.io/openbao/openbao:2.2.0
    container_name: mission-dev-openbao-init
    profiles: ["security", "all"]
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_DEV_ROOT_TOKEN: ${OPENBAO_DEV_ROOT_TOKEN:-mission_openbao_dev_token}
    volumes:
      - ./openbao/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    networks:
      - mission-net

  # ---------------------------------------------------------------------------
  # PROFILE: events — Kafka KRaft, Apicurio Registry 3.x, Debezium Connect 3.x
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: mission-dev-kafka
    restart: unless-stopped
    profiles: ["events", "all"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${DEV_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-35094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "${KAFKA_PORT:-35092}:9092"
      - "${KAFKA_EXTERNAL_PORT:-35094}:9094"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-Cluster.sh cluster-id --bootstrap-server localhost:9092 || /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - mission-net

  apicurio:
    image: quay.io/apicurio/apicurio-registry:3.0.9
    container_name: mission-dev-apicurio
    restart: unless-stopped
    profiles: ["events", "all"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mission}?currentSchema=apicurio
      APICURIO_DATASOURCE_USERNAME: ${APICURIO_DB_USER:-apicurio}
      APICURIO_DATASOURCE_PASSWORD: ${DB_ROLE_PASSWORD_DEFAULT:-${POSTGRES_PASSWORD}}
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "*"
    ports:
      - "${APICURIO_PORT:-35081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/apis/registry/v3/system/info >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  debezium:
    image: quay.io/debezium/connect:3.0.0.Final
    container_name: mission-dev-debezium
    restart: unless-stopped
    profiles: ["events", "all"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: _debezium_configs
      OFFSET_STORAGE_TOPIC: _debezium_offsets
      STATUS_STORAGE_TOPIC: _debezium_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      DEBEZIUM_DB_USER: ${DEBEZIUM_DB_USER:-cdc_debezium}
    ports:
      - "${DEBEZIUM_PORT:-35083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  # ---------------------------------------------------------------------------
  # PROFILE: search — MinIO (S3) & OpenSearch 2.x
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-02-18T16-25-55Z
    container_name: mission-dev-minio
    restart: unless-stopped
    profiles: ["search", "all"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mission_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Chưa đặt MINIO_ROOT_PASSWORD trong .env}
    ports:
      - "${MINIO_API_PORT:-35900}:9000"
      - "${MINIO_CONSOLE_PORT:-35901}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mission-net

  minio-init:
    image: minio/mc:RELEASE.2025-02-15T10-36-16Z
    container_name: mission-dev-minio-init
    profiles: ["search", "all"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/mission-evidence &&
      mc mb --ignore-existing local/mission-dossier &&
      mc mb --ignore-existing local/mission-ui-pack &&
      mc mb --ignore-existing local/mission-backup &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mission_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - mission-net

  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: mission-dev-opensearch
    restart: unless-stopped
    profiles: ["search", "all"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT:-35200}:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  # ---------------------------------------------------------------------------
  # PROFILE: obs — Quan sát hệ thống (OTel, Prometheus, Loki, Tempo, Grafana)
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: mission-dev-otel
    restart: unless-stopped
    profiles: ["obs", "all"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-35317}:4317"
      - "${OTEL_HTTP_PORT:-35318}:4318"
    networks:
      - mission-net

  tempo:
    image: grafana/tempo:2.7.1
    container_name: mission-dev-tempo
    restart: unless-stopped
    profiles: ["obs", "all"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TEMPO_PORT:-35320}:3200"
    networks:
      - mission-net

  loki:
    image: grafana/loki:3.3.2
    container_name: mission-dev-loki
    restart: unless-stopped
    profiles: ["obs", "all"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki_data:/loki
    ports:
      - "${LOKI_PORT:-35310}:3100"
    networks:
      - mission-net

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mission-dev-prometheus
    restart: unless-stopped
    profiles: ["obs", "all"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-35990}:9090"
    networks:
      - mission-net

  grafana:
    image: grafana/grafana:11.5.1
    container_name: mission-dev-grafana
    restart: unless-stopped
    profiles: ["obs", "all"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Chưa đặt GRAFANA_ADMIN_PASSWORD trong .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-35300}:3000"
    networks:
      - mission-net

volumes:
  pg_data:
  valkey_data:
  kafka_data:
  minio_data:
  opensearch_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:

networks:
  mission-net:
    name: mission-dev-net
    driver: bridge
