# =============================================================================
# HẠ TẦNG DEV DÙNG CHUNG — DỰ ÁN MISSION (QĐ 366 · OKR/KPI)
# =============================================================================
# Ánh xạ công nghệ theo TL-01 Phụ lục B & TL-04:
#   - PostgreSQL 17 (+ pg_partman) + PgBouncer (transaction mode)
#   - Valkey 8, Keycloak 26
#   - OPA 1.x (RBAC/ABAC Rego), OpenBao 2.x (Transit KEK + KV v2)
#   - Kafka 3.9 (KRaft, không ZooKeeper), Apicurio Registry 3.x, Debezium 3.x
#   - MinIO (S3 tương thích Ceph RGW), OpenSearch 2.x (thay Elasticsearch)
#   - OpenTelemetry Collector, Prometheus, Loki, Tempo, Grafana
#
# Toàn bộ cổng host nằm trong dải 35xxx và đều cấu hình động qua biến môi trường
# trong .env để hỗ trợ kết nối qua cổng hầm SSH (SSH local port forwarding)
# khi máy chủ dev hạn chế mở cổng tường lửa.
#
# Các profile khởi chạy:
#   core     (mặc định): postgres, pgbouncer, valkey, keycloak
#   security           : opa, openbao, openbao-init
#   events             : kafka, apicurio, debezium
#   search             : minio, minio-init, opensearch
#   obs                : otel-collector, prometheus, loki, tempo, grafana
#   backend            : gotenberg (chuyển DOCX sang PDF/A-2b cho document-service, DV-11-01),
#                        llm-mock (máy chủ mô hình nhỏ chạy CPU, API tương thích vLLM cho ai-gateway, DV-14-01),
#                        apisix (cổng API dev 35000) và các service backend dựng từ repo, cổng 351xx (INF-22);
#                        cần bật cùng core, security, events: xem scripts/deploy-backend.sh
#   analytics          : clickhouse (kho phân tích một nút của SVC-15, DV-15-01; migration ở analytics/clickhouse),
#                        cube (lớp ngữ nghĩa, DV-15-03), superset (dashboard nhúng qua Cube SQL API, DV-15-05)
#   all                : tất cả dịch vụ trên, trừ APISIX và service backend dựng từ repo
# =============================================================================

name: mission-dev

# ---------------------------------------------------------------------------
# Khối dùng chung của service backend dựng từ repo (INF-22, profile backend).
# Trong mạng compose, service gọi hạ tầng bằng tên dịch vụ và cổng trong container (pgbouncer:6432,
# kafka:9092...), không qua cổng 35xxx của máy. Token của Keycloak mang `iss` theo địa chỉ trình duyệt và
# kiểm thử khói dùng (KEYCLOAK_PUBLIC_URL, mặc định http://127.0.0.1:35080), còn JWKS lấy qua đường nội bộ
# keycloak:8080, nên mỗi service đặt issuer công khai cùng jwk-set-uri nội bộ.
# ---------------------------------------------------------------------------
x-backend-java-env: &backend-java-env
  SERVER_PORT: "8080"
  MANAGEMENT_PORT: "8081"
  DB_HOST: pgbouncer
  DB_PORT: "6432"
  DB_NAME: ${POSTGRES_DB:-mission}
  DB_PASSWORD: ${DB_ROLE_PASSWORD_DEFAULT:-}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  APICURIO_REGISTRY_URL: http://apicurio:8080/apis/registry/v2
  APICURIO_REGISTRY_V3_URL: http://apicurio:8080/apis/registry/v3
  KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:35080}/realms/mission
  OIDC_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:35080}/realms/mission
  KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/mission/protocol/openid-connect/certs
  SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/mission/protocol/openid-connect/certs
  REDIS_HOST: valkey
  REDIS_PORT: "6379"
  SPRING_DATA_REDIS_PASSWORD: ${VALKEY_PASSWORD:-}
  OPA_URL: http://opa:8181/v1/data/mission/authz
  # Bộ uỷ quyền okrkpi.opa (vt-platform-starter): bật mặc định ở dev; OPA nằm ở container opa, không cùng pod,
  # nên timeout lấy từ .env (mặc định 5s; qua đường hầm đo được 1,8–2,5 s) thay cho 50/100 ms của TL-01.
  OPA_ENABLED: ${OPA_ENABLED:-true}
  OPA_BASE_URL: http://opa:8181
  OPA_CONNECT_TIMEOUT: ${OPA_CONNECT_TIMEOUT:-5s}
  OPA_READ_TIMEOUT: ${OPA_READ_TIMEOUT:-5s}
  OPENBAO_URL: http://openbao:8200
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
  TZ: Asia/Ho_Chi_Minh

# Service backend và APISIX chỉ thuộc profile backend, không thuộc `all`: ảnh Java cần jar dựng trước
# (deploy-backend.sh), nên `docker compose --profile all up` của hạ tầng không kéo theo chúng.
# Cổng quản trị 8081 chỉ mở trong mạng compose; compose kiểm readiness bằng curl trong container.
# Bộ nhớ: Dockerfile.java đặt -XX:MaxRAMPercentage=70, không có giới hạn container thì mỗi JVM tính 70% RAM của cả
# máy, mười service tranh nhau và bị OOM trên máy 16 GB. Mỗi service Java có mem_limit và -Xmx riêng qua .env
# (<SERVICE>_MEM_LIMIT, <SERVICE>_XMX; service nhỏ dùng chung JAVA_MEM_LIMIT, JAVA_XMX); -Xmx thắng
# MaxRAMPercentage, phần chênh giữa mem_limit và -Xmx dành cho metaspace, luồng, bộ đệm ngoài heap.
# ExitOnOutOfMemoryError để container khởi động lại (restart: unless-stopped) thay vì treo nửa sống.
x-backend-java: &backend-java
  restart: unless-stopped
  profiles: ["backend"]
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/actuator/health/readiness"]
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 60s
  networks:
    - mission-net

x-backend-go: &backend-go
  restart: unless-stopped
  profiles: ["backend"]
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/readyz"]
    interval: 15s
    timeout: 5s
    retries: 20
    start_period: 20s
  networks:
    - mission-net

services:
  # ---------------------------------------------------------------------------
  # PROFILE: core — CSDL, bộ gộp kết nối PgBouncer, bộ nhớ đệm, xác thực OIDC
  # ---------------------------------------------------------------------------
  postgres:
    build:
      context: ./postgres
      dockerfile: Dockerfile
    image: mission/postgres:17-partman
    container_name: mission-dev-postgres
    restart: unless-stopped
    profiles: ["core", "all"]
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=512MB"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-${PG_SUPERUSER:-mission_admin}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${PG_SUPERUSER_PASSWORD:?Chưa đặt POSTGRES_PASSWORD hay PG_SUPERUSER_PASSWORD trong .env}}
      POSTGRES_DB: ${POSTGRES_DB:-mission}
      DB_ROLE_PASSWORD_DEFAULT: ${DB_ROLE_PASSWORD_DEFAULT:-${POSTGRES_PASSWORD:-${PG_SUPERUSER_PASSWORD:-}}}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Chưa đặt KEYCLOAK_DB_PASSWORD trong .env}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${POSTGRES_PORT:-35432}:5432"
    volumes:
      - ${POSTGRES_DATA:-pg_data}:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/migrate-roles.sh:/usr/local/bin/migrate-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-${PG_SUPERUSER:-mission_admin}} -d ${POSTGRES_DB:-mission}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p0
    container_name: mission-dev-pgbouncer
    restart: unless-stopped
    profiles: ["core", "all"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-${PG_SUPERUSER:-mission_admin}}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${PG_SUPERUSER_PASSWORD:-}}
      POSTGRES_DB: ${POSTGRES_DB:-mission}
      DB_ROLE_PASSWORD_DEFAULT: ${DB_ROLE_PASSWORD_DEFAULT:-${POSTGRES_PASSWORD:-${PG_SUPERUSER_PASSWORD:-}}}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    ports:
      - "${PGBOUNCER_PORT:-35433}:6432"
    volumes:
      - ./postgres/pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./postgres/pgbouncer/entrypoint.sh:/etc/pgbouncer/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/etc/pgbouncer/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U ${POSTGRES_USER:-${PG_SUPERUSER:-mission_admin}} -d ${POSTGRES_DB:-mission}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  valkey:
    image: valkey/valkey:8-alpine
    container_name: mission-dev-valkey
    restart: unless-stopped
    profiles: ["core", "all"]
    command:
      - "valkey-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "512mb"
      - "--maxmemory-policy"
      - "allkeys-lru"
      - "--requirepass"
      - "${VALKEY_PASSWORD:?Chưa đặt VALKEY_PASSWORD trong .env}"
    ports:
      - "${VALKEY_PORT:-35379}:6379"
    volumes:
      - ${VALKEY_DATA:-valkey_data}:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mission-net

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    container_name: mission-dev-keycloak
    restart: unless-stopped
    profiles: ["core", "all"]
    command:
      - "start-dev"
      - "--import-realm"
      - "--http-port=8080"
      - "--health-enabled=true"
      - "--metrics-enabled=true"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Chưa đặt KEYCLOAK_ADMIN_PASSWORD trong .env}
      # Giá trị thay cho ${...} trong realm-mission.json khi nhập realm (tài khoản thử, client dịch vụ).
      KC_TEST_USER_PASSWORD: ${KC_TEST_USER_PASSWORD:-}
      KC_TEST_OTP_SECRET: ${KC_TEST_OTP_SECRET:-}
      MISSION_CORE_CLIENT_SECRET: ${MISSION_CORE_CLIENT_SECRET:-}
      ORG_SERVICE_CLIENT_SECRET: ${ORG_SERVICE_CLIENT_SECRET:-}
      PROVISION_CLIENT_SECRET: ${PROVISION_CLIENT_SECRET:-}
      # Gốc web thêm vào redirect URI của client mission-web; thiếu biến thì Keycloak 26 từ chối nhập realm
      # vì "${WEB_ORIGIN}/*" không phải URI hợp lệ.
      WEB_ORIGIN: ${WEB_ORIGIN:-http://127.0.0.1:35000}
      KC_HOSTNAME_STRICT: "false"
      KC_PROXY_HEADERS: xforwarded
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${KEYCLOAK_PORT:-35080}:8080"
    volumes:
      - ./keycloak/realm-mission.json:/opt/keycloak/data/import/realm-mission.json:ro
      - ../keycloak-theme/mission:/opt/keycloak/themes/mission:ro
      # ASVS 2.1.7: danh sách mật khẩu phổ biến cho passwordBlacklist của realm dev.
      - ./keycloak/password-blacklists:/opt/keycloak/data/password-blacklists:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - mission-net

  # ---------------------------------------------------------------------------
  # PROFILE: security — Phân quyền OPA 1.x (Rego) & Quản lý khoá OpenBao 2.x
  # ---------------------------------------------------------------------------
  opa:
    image: openpolicyagent/opa:1.4.0
    container_name: mission-dev-opa
    restart: unless-stopped
    profiles: ["security", "all"]
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--watch"
      - "/policies"
    ports:
      - "${OPA_PORT:-35181}:8181"
    # Gói chính sách thật okrkpi (NEN-040, sinh từ ma trận phân quyền) như bundle của cụm thật; thư mục gắn ở
    # /policies/okrkpi để generated/data.json nằm đúng data.okrkpi.generated. Mission-core hỏi
    # /v1/data/okrkpi/authz/decision; bản khởi tạo ./opa/policies chỉ từ chối mặc định nên mọi API trả 403.
    volumes:
      - ../../backend/opa/okrkpi:/policies/okrkpi:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "data.okrkpi.authz.allow"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  openbao:
    image: quay.io/openbao/openbao:2.2.0
    container_name: mission-dev-openbao
    restart: unless-stopped
    profiles: ["security", "all"]
    command:
      - "server"
      - "-dev"
      - "-dev-listen-address=0.0.0.0:8200"
      - "-dev-root-token-id=${OPENBAO_DEV_ROOT_TOKEN:-mission_openbao_dev_token}"
    cap_add:
      - IPC_LOCK
    environment:
      BAO_DEV_ROOT_TOKEN_ID: ${OPENBAO_DEV_ROOT_TOKEN:-mission_openbao_dev_token}
      BAO_ADDR: http://127.0.0.1:8200
    ports:
      - "${OPENBAO_PORT:-35820}:8200"
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  openbao-init:
    image: quay.io/openbao/openbao:2.2.0
    container_name: mission-dev-openbao-init
    profiles: ["security", "all"]
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      OPENBAO_ADDR: http://openbao:8200
      OPENBAO_DEV_ROOT_TOKEN: ${OPENBAO_DEV_ROOT_TOKEN:-mission_openbao_dev_token}
    volumes:
      - ./openbao/init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    networks:
      - mission-net

  # ---------------------------------------------------------------------------
  # PROFILE: events — Kafka KRaft, Apicurio Registry 3.x, Debezium Connect 3.x
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.1
    container_name: mission-dev-kafka
    restart: unless-stopped
    profiles: ["events", "all"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Ba listener cho client (INF-22):
      #   INTERNAL kafka:9092   cho container cùng mạng mission-net (Debezium, Apicurio, backend profile);
      #   TUNNEL   cổng KAFKA_PORT (mặc định 35092), quảng bá 127.0.0.1 để dùng được trên chính máy chủ
      #            và qua hầm SSH (-L 35092:127.0.0.1:35092), khớp mặc định KAFKA_BOOTSTRAP_SERVERS của backend;
      #   EXTERNAL cổng KAFKA_EXTERNAL_PORT (mặc định 35094), quảng bá DEV_HOST khi tường lửa mở cổng.
      # Địa chỉ thật chỉ nằm trong .env, không ghi vào repo.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,TUNNEL://:9095,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${DEV_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-35094},TUNNEL://${KAFKA_TUNNEL_ADVERTISED_HOST:-127.0.0.1}:${KAFKA_PORT:-35092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,TUNNEL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      # TUNNEL chỉ mở trên loopback của máy chủ; truy cập từ máy trạm đi qua hầm SSH.
      - "${KAFKA_TUNNEL_BIND:-127.0.0.1}:${KAFKA_PORT:-35092}:9095"
      - "${KAFKA_EXTERNAL_PORT:-35094}:9094"
    volumes:
      - ${KAFKA_DATA:-kafka_data}:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-Cluster.sh cluster-id --bootstrap-server localhost:9092 || /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - mission-net

  # Tạo đủ topic theo danh mục production (kafka/topics.txt) mỗi lần bật profile events; chạy một lần rồi thoát,
  # chạy lại không đổi gì (--if-not-exists). Thay cho bước tay ./scripts/create-topics.sh.
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: mission-dev-kafka-init
    restart: "no"
    profiles: ["events", "all"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_LOCAL_EXEC: "1"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_PARTITIONS: ${KAFKA_PARTITIONS:-3}
      TOPICS_FILE: /kafka-init/topics.txt
    entrypoint: ["bash", "/kafka-init/create-topics.sh"]
    volumes:
      - ./scripts/create-topics.sh:/kafka-init/create-topics.sh:ro
      - ./kafka/topics.txt:/kafka-init/topics.txt:ro
    networks:
      - mission-net

  apicurio:
    # 3.3.3 khớp serde và maven plugin của backend; 3.0.9 không tìm được phiên bản theo nội dung (POST
    # /search/versions luôn rỗng) nên serde với FIND_LATEST_ARTIFACT=false (org-republish) không phân giải lược đồ.
    image: quay.io/apicurio/apicurio-registry:3.3.3
    container_name: mission-dev-apicurio
    restart: unless-stopped
    profiles: ["events", "all"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mission}?currentSchema=apicurio
      APICURIO_DATASOURCE_USERNAME: ${APICURIO_DB_USER:-apicurio}
      APICURIO_DATASOURCE_PASSWORD: ${DB_ROLE_PASSWORD_DEFAULT:-${POSTGRES_PASSWORD:-${PG_SUPERUSER_PASSWORD:-}}}
      QUARKUS_HTTP_CORS_ENABLED: "true"
      QUARKUS_HTTP_CORS_ORIGINS: "*"
    ports:
      - "${APICURIO_PORT:-35081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/apis/registry/v3/system/info >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  debezium:
    image: quay.io/debezium/connect:3.0.0.Final
    container_name: mission-dev-debezium
    restart: unless-stopped
    profiles: ["events", "all"]
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: _debezium_configs
      OFFSET_STORAGE_TOPIC: _debezium_offsets
      STATUS_STORAGE_TOPIC: _debezium_status
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      DEBEZIUM_DB_USER: ${DEBEZIUM_DB_USER:-cdc_debezium}
    ports:
      - "${DEBEZIUM_PORT:-35083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/connectors >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  # ---------------------------------------------------------------------------
  # PROFILE: search — MinIO (S3) & OpenSearch 2.x
  # ---------------------------------------------------------------------------
  # MinIO đã ngừng phát hành ảnh trên Docker Hub và quay.io (10/2025): tag cũ không kéo được nữa. Ghim đúng tag
  # đang có sẵn trên máy chủ dev; máy mới không có ảnh này thì đặt MINIO_IMAGE (ví dụ ảnh Chainguard ghim digest, có sẵn mc và sh;
  # xem README mục 2.1). Chạy bằng root để đọc được thư mục dữ liệu cũ (MINIO_DATA) với mọi ảnh.
  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    user: "0:0"
    container_name: mission-dev-minio
    restart: unless-stopped
    profiles: ["search", "all"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mission_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Chưa đặt MINIO_ROOT_PASSWORD trong .env}
    ports:
      - "${MINIO_API_PORT:-35900}:9000"
      - "${MINIO_CONSOLE_PORT:-35901}:9001"
    volumes:
      - ${MINIO_DATA:-minio_data}:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mission-net

  # Ảnh minio đã có sẵn `mc` (healthcheck ở trên dùng nó), nên tạo bucket bằng chính ảnh đó, không cần ảnh minio/mc.
  minio-init:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-04-22T22-12-26Z}
    container_name: mission-dev-minio-init
    profiles: ["search", "all"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/mission-evidence &&
      mc mb --ignore-existing local/mission-dossier &&
      mc mb --ignore-existing local/mission-templates &&
      mc mb --ignore-existing local/mission-ui-pack &&
      mc mb --ignore-existing local/mission-backup &&
      exit 0
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-mission_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    networks:
      - mission-net

  opensearch:
    build:
      context: ./opensearch
      args: { OPENSEARCH_VERSION: 2.19.2 }
      secrets: [ca_bundle]
    image: mission-dev/opensearch:2.19.2-icu
    container_name: mission-dev-opensearch
    restart: unless-stopped
    profiles: ["search", "all"]
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${OPENSEARCH_PORT:-35200}:9200"
    volumes:
      - ${OPENSEARCH_DATA:-opensearch_data}:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  # ---------------------------------------------------------------------------
  # PROFILE: obs — Quan sát hệ thống (OTel, Prometheus, Loki, Tempo, Grafana)
  # ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.119.0
    container_name: mission-dev-otel
    restart: unless-stopped
    profiles: ["obs", "all"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "${OTEL_GRPC_PORT:-35317}:4317"
      - "${OTEL_HTTP_PORT:-35318}:4318"
    networks:
      - mission-net

  tempo:
    image: grafana/tempo:2.7.1
    container_name: mission-dev-tempo
    restart: unless-stopped
    profiles: ["obs", "all"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
      - ${TEMPO_DATA:-tempo_data}:/var/tempo
    ports:
      - "${TEMPO_PORT:-35320}:3200"
    networks:
      - mission-net

  loki:
    image: grafana/loki:3.3.2
    container_name: mission-dev-loki
    restart: unless-stopped
    profiles: ["obs", "all"]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ${LOKI_DATA:-loki_data}:/loki
    ports:
      - "${LOKI_PORT:-35310}:3100"
    networks:
      - mission-net

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mission-dev-prometheus
    restart: unless-stopped
    profiles: ["obs", "all"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${PROMETHEUS_DATA:-prometheus_data}:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-35990}:9090"
    networks:
      - mission-net

  grafana:
    image: grafana/grafana:11.5.1
    container_name: mission-dev-grafana
    restart: unless-stopped
    profiles: ["obs", "all"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Chưa đặt GRAFANA_ADMIN_PASSWORD trong .env}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
      - ${GRAFANA_DATA:-grafana_data}:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-35300}:3000"
    networks:
      - mission-net

  # ---------------------------------------------------------------------------
  # PROFILE: backend — dịch vụ phụ trợ cho microservice (DV-11-01)
  # ---------------------------------------------------------------------------
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: mission-dev-gotenberg
    restart: unless-stopped
    profiles: ["backend", "all"]
    command:
      - "gotenberg"
      - "--api-timeout=60s"
      - "--libreoffice-auto-start=true"
    ports:
      - "${GOTENBERG_PORT:-35330}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mission-net

  # clamd cho worker quét minh chứng của evidence-service (DV-08-04, SEC-47). Lần đầu freshclam tải cơ sở dữ liệu
  # chữ ký (vài phút, cần mạng ra database.clamav.net), nên start_period dài. StreamMaxLength không nhỏ hơn
  # EVIDENCE_MAX_FILE_BYTES (mặc định 50 MB). Hành trình QA-05 dùng tệp thử EICAR.
  clamav:
    image: clamav/clamav:1.4
    container_name: mission-dev-clamav
    restart: unless-stopped
    profiles: ["backend"]
    environment:
      CLAMD_CONF_StreamMaxLength: 60M
    volumes:
      - clamav_db:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks:
      - mission-net

  # Máy chủ mô hình nhỏ chạy CPU cho ai-gateway (DV-14-01): llama.cpp server có API tương thích OpenAI như vLLM,
  # mô hình Qwen2.5-0.5B-Instruct GGUF (giấy phép Apache 2.0) tải từ Hugging Face lần đầu. ai-gateway trỏ tới bằng
  # LLM_MODE=openai, LLM_BASE_URL=http://127.0.0.1:${LLM_MOCK_PORT}; mặc định ai-gateway dùng bản giả lập trong mã.
  llm-mock:
    image: ghcr.io/ggml-org/llama.cpp:server-b11804
    container_name: mission-dev-llm-mock
    restart: unless-stopped
    profiles: ["backend", "all"]
    command:
      - "-hf"
      - "Qwen/Qwen2.5-0.5B-Instruct-GGUF:Q4_K_M"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "4096"
      - "--parallel"
      - "2"
      - "--alias"
      - "viettel-llm-vi"
    ports:
      - "${LLM_MOCK_PORT:-35340}:8080"
    volumes:
      - llm_cache:/root/.cache/llama.cpp
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - mission-net

  # HSM giả lập cho esign-service (DV-10-03): khởi tạo token SoftHSM2 "mission-dev" vào infra/dev/softhsm/tokens.
  # PKCS#11 là thư viện nạp vào tiến trình JVM nên esign-service chạy trên máy dev dùng libsofthsm2 của máy đó
  # với SOFTHSM2_CONF trỏ tới cùng thư mục token (xem README mục SoftHSM2). PIN chỉ ở infra/dev/.env.
  softhsm-init:
    build: ./softhsm
    image: mission-dev/softhsm:2.6
    container_name: mission-dev-softhsm-init
    profiles: ["backend", "all"]
    restart: "no"
    command: ["/opt/mission/init-token.sh"]
    environment:
      ESIGN_HSM_PIN: ${ESIGN_HSM_PIN:?Đặt ESIGN_HSM_PIN trong infra/dev/.env}
      ESIGN_HSM_SO_PIN: ${ESIGN_HSM_SO_PIN:?Đặt ESIGN_HSM_SO_PIN trong infra/dev/.env}
    volumes:
      - ./softhsm/tokens:/var/lib/softhsm/tokens
    networks:
      - mission-net

  # Máy chủ dấu thời gian RFC 3161 giả lập (DV-10-03, YC-PT-13): openssl ts -reply sau một HTTP server tối giản;
  # gốc tin cậy xuất ra infra/dev/softhsm/tsa/ca.pem cho ESIGN_TSA_TRUST_ANCHORS.
  tsa-mock:
    build: ./softhsm
    image: mission-dev/softhsm:2.6
    container_name: mission-dev-tsa-mock
    restart: unless-stopped
    profiles: ["backend", "all"]
    command: ["/opt/mission/tsa-mock.sh"]
    ports:
      - "${TSA_MOCK_PORT:-35350}:8318"
    volumes:
      - ./softhsm/tsa:/var/lib/tsa
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8318/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mission-net

  # ---------------------------------------------------------------------------
  # PROFILE: backend — cổng API dev và service backend dựng từ repo (INF-22)
  # ---------------------------------------------------------------------------
  # Cổng API dev SVC-01: định tuyến theo tiền tố module tới service sở hữu, kiểm JWT realm mission bằng
  # openid-connect (apisix/apisix.yaml). Ảnh ghim cùng digest với deploy/charts/api-gateway.
  apisix:
    image: apache/apisix:3.13.0-debian@sha256:c5c7a55ebb5c07abc210dbb963a37f41030e12c91d23bacedbaa168fec633bd7
    container_name: mission-dev-apisix
    restart: unless-stopped
    profiles: ["backend"]
    environment:
      # Issuer công khai của token (claim iss), thay vào apisix.yaml lúc nạp.
      KEYCLOAK_PUBLIC_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:35080}/realms/mission
    ports:
      - "${APISIX_PORT:-35000}:9080"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    networks:
      - mission-net

  # SVC-17 web: shell và mọi remote phục vụ bằng nginx (deploy/web), không mở cổng riêng mà đi sau APISIX qua
  # tuyến `web` (/*) của apisix.yaml, nên trình duyệt mở http://<máy>:${APISIX_PORT} và gọi /api cùng nguồn,
  # không cần CORS. config.json sinh lúc khởi động từ biến dưới đây (deploy/web/40-runtime-config.sh): issuer là
  # địa chỉ Keycloak trình duyệt thấy (KEYCLOAK_PUBLIC_URL), cùng giá trị APISIX kiểm claim iss. Gốc web
  # (WEB_ORIGIN) phải là địa chỉ APISIX để Keycloak nhận redirect URI của client mission-web.
  web:
    build:
      context: ../..
      # trien-khai-lai.sh đặt deploy/web/Dockerfile.co-san khi web đã build ở máy trạm (WEB_BUILD=may-tram).
      dockerfile: ${WEB_DOCKERFILE:-deploy/web/Dockerfile}
      secrets: [ca_bundle]
    image: mission-dev/web:dev
    container_name: mission-dev-web
    restart: unless-stopped
    profiles: ["backend", "web"]
    environment:
      CELL: DEV
      TENANT: ${WEB_TENANT:-default}
      API_BASE_URL: /api
      AUTH_ENABLED: ${WEB_AUTH_ENABLED:-true}
      AUTH_ISSUER: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:35080}/realms/mission
      AUTH_CLIENT_ID: mission-web
      # Issuer HTTP ngoài địa chỉ vòng lặp (server dev mở thẳng bằng IP, chưa có TLS) cần cờ này; mặc định tắt.
      AUTH_ALLOW_HTTP: ${WEB_AUTH_ALLOW_HTTP:-false}
      # Máy chủ thật qua APISIX; module chưa có máy chủ giữ giả lập theo WEB_MOCK_API_MODULES (WEB-070).
      USE_MOCK_API: ${WEB_USE_MOCK_API:-false}
      MOCK_API_MODULES: ${WEB_MOCK_API_MODULES:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - mission-net

  # Ảnh Java dựng từ jar trong target/ của mô-đun (scripts/deploy-backend.sh chạy `mvnw package` trước);
  # Dockerfile dev chung ở backend/Dockerfile.java. Migration không chạy lúc khởi động: deploy-backend.sh
  # chạy Flyway bằng tài khoản mig_<schema> trước khi bật service.
  mission-core:
    <<: *backend-java
    build:
      context: ../../backend/mission-core
      dockerfile: ../../infra/dev/backend/Dockerfile.java
    image: mission-dev/mission-core:dev
    container_name: mission-dev-mission-core
    mem_limit: ${MISSION_CORE_MEM_LIMIT:-1536m}
    environment:
      <<: *backend-java-env
      JAVA_TOOL_OPTIONS: "-Xmx${MISSION_CORE_XMX:-1g} -XX:+ExitOnOutOfMemoryError"
      SERVICE_NAME: mission-core
      AUTH_ENABLED: ${MISSION_CORE_AUTH_ENABLED:-true}
      # Đối chiếu cel-js khi chạy kiểm thử Policy Pack (CORE-05-07, BR-15-07); thiếu thì lần chạy luôn "Chưa đạt".
      MISSION_POLICY_CELJS_URL: http://cel-js-runner:8080
    ports:
      - "${MISSION_CORE_PORT:-35100}:8080"
      # Cổng quản trị chỉ mở trên loopback của máy chủ (health.sh, Prometheus cục bộ).
      - "127.0.0.1:${MISSION_CORE_MGMT_PORT:-35101}:8081"

  # Bộ chạy cel-js mà mission-core gọi để đối chiếu hai engine khi chạy ca vàng (CORE-05-07). Không mở cổng ra
  # ngoài: chỉ mission-core gọi trong mạng compose.
  cel-js-runner:
    build:
      context: ../..
      dockerfile: backend/services/cel-js-runner/Dockerfile
    image: mission-dev/cel-js-runner:dev
    container_name: mission-dev-cel-js-runner
    restart: unless-stopped
    profiles: ["backend"]
    networks:
      - mission-net

  # SVC-04: dữ liệu ở schema org (CSDL mission), migration chạy bằng hồ sơ Spring `migrate` với mig_org.
  org-service:
    <<: *backend-java
    build:
      context: ../../backend/services/org-service
      dockerfile: ../../../infra/dev/backend/Dockerfile.java
    image: mission-dev/org-service:dev
    container_name: mission-dev-org-service
    mem_limit: ${ORG_SERVICE_MEM_LIMIT:-${JAVA_MEM_LIMIT:-768m}}
    environment:
      <<: *backend-java-env
      JAVA_TOOL_OPTIONS: "-Xmx${ORG_SERVICE_XMX:-${JAVA_XMX:-384m}} -XX:+ExitOnOutOfMemoryError"
      PORT: "8080"
      ORG_DB_URL: jdbc:postgresql://pgbouncer:6432/${POSTGRES_DB:-mission}?currentSchema=org&prepareThreshold=0
      ORG_DB_PASSWORD: ${DB_ROLE_PASSWORD_DEFAULT:-}
      ORG_MIG_DB_PASSWORD: ${DB_ROLE_PASSWORD_DEFAULT:-}
      # Lệnh org-republish (hồ sơ republish) dùng serde Apicurio 3 qua API v3, khác giá trị v2 dùng chung ở trên.
      APICURIO_REGISTRY_URL: http://apicurio:8080/apis/registry/v3
      # setMyContext ghi ngữ cảnh làm việc vào thuộc tính người dùng qua Admin API Keycloak (client org-service,
      # wiki trang 14 mục 23); thiếu base-url thì PUT /org/me/context trả 503
      OKRKPI_ORG_KEYCLOAK_BASE_URL: http://keycloak:8080
      OKRKPI_ORG_KEYCLOAK_CLIENT_SECRET: ${ORG_SERVICE_CLIENT_SECRET:-}
    ports:
      - "${ORG_SERVICE_PORT:-35111}:8080"

  # SVC-06: Flowable ở CSDL flowable, schema flowable.
  workflow-service:
    <<: *backend-java
    build:
      context: ../../backend/services/workflow-service
      dockerfile: ../../../infra/dev/backend/Dockerfile.java
    image: mission-dev/workflow-service:dev
    container_name: mission-dev-workflow-service
    mem_limit: ${WORKFLOW_SERVICE_MEM_LIMIT:-1g}
    environment:
      <<: *backend-java-env
      JAVA_TOOL_OPTIONS: "-Xmx${WORKFLOW_SERVICE_XMX:-640m} -XX:+ExitOnOutOfMemoryError"
      DB_NAME: flowable
      CORE_BASE_URL: http://mission-core:8080/api/v1
      # Flyway của chính service (schema flowable) chạy lúc khởi động bằng mig_flowable, nối thẳng PostgreSQL
      # (khoá tư vấn của Flyway không đi qua PgBouncer chế độ transaction); ứng dụng vẫn dùng svc_flowable.
      FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/flowable
      SPRING_FLYWAY_USER: mig_flowable
      SPRING_FLYWAY_PASSWORD: ${DB_ROLE_PASSWORD_DEFAULT:-}
    ports:
      - "${WORKFLOW_SERVICE_PORT:-35112}:8080"

  # SVC-07.
  scoring-service:
    <<: *backend-java
    build:
      context: ../../backend/services/scoring-service
      dockerfile: ../../../infra/dev/backend/Dockerfile.java
    image: mission-dev/scoring-service:dev
    container_name: mission-dev-scoring-service
    mem_limit: ${SCORING_SERVICE_MEM_LIMIT:-${JAVA_MEM_LIMIT:-768m}}
    environment:
      <<: *backend-java-env
      JAVA_TOOL_OPTIONS: "-Xmx${SCORING_SERVICE_XMX:-${JAVA_XMX:-384m}} -XX:+ExitOnOutOfMemoryError"
      MISSION_CORE_URL: http://mission-core:8080
    ports:
      - "${SCORING_SERVICE_PORT:-35113}:8080"

  # SVC-11: dựng biểu mẫu qua gotenberg, lưu tệp ở MinIO (profile search).
  document-service:
    <<: *backend-java
    build:
      context: ../../backend/services/document-service
      dockerfile: ../../../infra/dev/backend/Dockerfile.java
    image: mission-dev/document-service:dev
    container_name: mission-dev-document-service
    mem_limit: ${DOCUMENT_SERVICE_MEM_LIMIT:-1g}
    environment:
      <<: *backend-java-env
      JAVA_TOOL_OPTIONS: "-Xmx${DOCUMENT_SERVICE_XMX:-640m} -XX:+ExitOnOutOfMemoryError"
      # Schema tự chứa outbox, inbox, idempotency (phân vùng DEFAULT), không dùng phần chung V0_x của
      # vt-db-migration. deploy-backend.sh áp trước bằng MigrationRunner (chỉ thư mục riêng); Flyway lúc khởi động
      # bằng mig_docgen giữ lại cho lần bật service riêng lẻ, cùng thư mục nên không trùng.
      FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mission}
      SPRING_FLYWAY_USER: mig_docgen
      SPRING_FLYWAY_PASSWORD: ${DB_ROLE_PASSWORD_DEFAULT:-}
      DOCGEN_CORE_URL: http://mission-core:8080
      GOTENBERG_URL: http://gotenberg:3000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "${DOCUMENT_SERVICE_PORT:-35114}:8080"

  # SVC-08: API và worker quét chung một container ở dev, quét bằng clamd của dịch vụ clamav (đặt
  # EVIDENCE_SCAN_ENABLED=false trong .env để tắt khi không bật clamav).
  evidence-service:
    <<: *backend-java
    build:
      context: ../../backend/services/evidence-service
      dockerfile: ../../../infra/dev/backend/Dockerfile.java
    image: mission-dev/evidence-service:dev
    container_name: mission-dev-evidence-service
    mem_limit: ${EVIDENCE_SERVICE_MEM_LIMIT:-${JAVA_MEM_LIMIT:-768m}}
    environment:
      <<: *backend-java-env
      JAVA_TOOL_OPTIONS: "-Xmx${EVIDENCE_SERVICE_XMX:-${JAVA_XMX:-384m}} -XX:+ExitOnOutOfMemoryError"
      GOTENBERG_URL: http://gotenberg:3000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
      EVIDENCE_SCAN_ENABLED: ${EVIDENCE_SCAN_ENABLED:-true}
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
    ports:
      - "${EVIDENCE_SERVICE_PORT:-35115}:8080"

  # SVC-10: ký số qua nhà cung cấp giả lập ở dev (ESIGN_FAKE_PROVIDER), HSM tắt.
  esign-service:
    <<: *backend-java
    build:
      context: ../../backend/services/esign-service
      dockerfile: ../../../infra/dev/backend/Dockerfile.java
    image: mission-dev/esign-service:dev
    container_name: mission-dev-esign-service
    mem_limit: ${ESIGN_SERVICE_MEM_LIMIT:-${JAVA_MEM_LIMIT:-768m}}
    environment:
      <<: *backend-java-env
      JAVA_TOOL_OPTIONS: "-Xmx${ESIGN_SERVICE_XMX:-${JAVA_XMX:-384m}} -XX:+ExitOnOutOfMemoryError"
      # Schema tự chứa outbox, inbox, idempotency (phân vùng DEFAULT), không dùng phần chung V0_x của
      # vt-db-migration. deploy-backend.sh áp trước bằng MigrationRunner (chỉ thư mục riêng); Flyway lúc khởi động
      # bằng mig_esign giữ lại cho lần bật service riêng lẻ, cùng thư mục nên không trùng.
      FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mission}
      SPRING_FLYWAY_USER: mig_esign
      SPRING_FLYWAY_PASSWORD: ${DB_ROLE_PASSWORD_DEFAULT:-}
      ESIGN_FAKE_PROVIDER: ${ESIGN_FAKE_PROVIDER:-true}
    ports:
      - "${ESIGN_SERVICE_PORT:-35116}:8080"

  # SVC-13: chỉ có cổng nội bộ /internal/v1, không có tuyến qua APISIX.
  integration-gateway:
    <<: *backend-java
    build:
      context: ../../backend/services/integration-gateway
      dockerfile: ../../../infra/dev/backend/Dockerfile.java
    image: mission-dev/integration-gateway:dev
    container_name: mission-dev-integration-gateway
    mem_limit: ${INTEGRATION_GATEWAY_MEM_LIMIT:-${JAVA_MEM_LIMIT:-768m}}
    environment:
      <<: *backend-java-env
      JAVA_TOOL_OPTIONS: "-Xmx${INTEGRATION_GATEWAY_XMX:-${JAVA_XMX:-384m}} -XX:+ExitOnOutOfMemoryError"
    ports:
      - "${INTEGRATION_GATEWAY_PORT:-35117}:8080"

  # SVC-15: đọc ClickHouse và Cube (profile analytics).
  analytics-api:
    <<: *backend-java
    build:
      context: ../../backend/services/analytics-api
      dockerfile: ../../../infra/dev/backend/Dockerfile.java
    image: mission-dev/analytics-api:dev
    container_name: mission-dev-analytics-api
    mem_limit: ${ANALYTICS_API_MEM_LIMIT:-${JAVA_MEM_LIMIT:-768m}}
    environment:
      <<: *backend-java-env
      JAVA_TOOL_OPTIONS: "-Xmx${ANALYTICS_API_XMX:-${JAVA_XMX:-384m}} -XX:+ExitOnOutOfMemoryError"
      OPA_URL: http://opa:8181
      MISSION_CORE_URL: http://mission-core:8080
      ANALYTICS_CLICKHOUSE_URL: http://clickhouse:8123
      ANALYTICS_CUBE_PASSWORD: ${ANALYTICS_CUBE_PASSWORD:-}
      ANALYTICS_TOKEN_URL: http://keycloak:8080/realms/mission/protocol/openid-connect/token
      CUBE_URL: http://cube:4000
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-}
      SUPERSET_URL: http://superset:8088
      SUPERSET_SERVICE_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:-}
      VALKEY_URL: redis://valkey:6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      GOTENBERG_URL: http://gotenberg:3000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-}
    ports:
      - "${ANALYTICS_API_PORT:-35118}:8080"

  # SVC-16: chỉ mục OpenSearch (profile search).
  search:
    <<: *backend-java
    build:
      context: ../../backend/services/search
      dockerfile: ../../../infra/dev/backend/Dockerfile.java
    image: mission-dev/search:dev
    container_name: mission-dev-search
    mem_limit: ${SEARCH_SERVICE_MEM_LIMIT:-${JAVA_MEM_LIMIT:-768m}}
    environment:
      <<: *backend-java-env
      JAVA_TOOL_OPTIONS: "-Xmx${SEARCH_SERVICE_XMX:-${JAVA_XMX:-384m}} -XX:+ExitOnOutOfMemoryError"
      OPA_URL: http://opa:8181
      OPENSEARCH_URL: http://opensearch:9200
    ports:
      - "${SEARCH_SERVICE_PORT:-35119}:8080"

  # Service Go dựng trong Docker từ services-go/ (backend/Dockerfile.go). Chuỗi kết nối CSDL ghép mật khẩu
  # svc_<schema>, nên DB_ROLE_PASSWORD_DEFAULT không được chứa ký tự phải mã hoá URL (@ : / ? #).
  # SVC-03: schema registry (CSDL mission).
  tenant-registry:
    <<: *backend-go
    build:
      context: ../../services-go
      dockerfile: ../infra/dev/backend/Dockerfile.go
      args: { SERVICE: tenant-registry, CMD: tenant-registry }
      secrets: [ca_bundle]
    image: mission-dev/tenant-registry:dev
    container_name: mission-dev-tenant-registry
    environment:
      APP_ENV: dev
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://svc_registry:${DB_ROLE_PASSWORD_DEFAULT:-}@pgbouncer:6432/${POSTGRES_DB:-mission}?search_path=registry
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:35080}/realms/mission
      OIDC_ISSUERS: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:35080}/realms/mission
      OIDC_JWKS_URL: http://keycloak:8080/realms/mission/protocol/openid-connect/certs
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_ADDR: valkey:6379
      OPA_URL: http://opa:8181
      TZ: Asia/Ho_Chi_Minh
      # Saga cấp phát (DV-03-05, VH-04): Organization, IdP, tài khoản quản trị tạo trên Keycloak dev thật bằng client
      # tenant-registry-provisioner; PowerDNS, cert-manager, API nội bộ mission-core, org-service (cây tổ chức) là bộ
      # giả lập provision-gia-lap. Chưa cấu hình PROVISION_CELL_DB_FILE nên bỏ qua bước CSDL bridge và KEK (chế độ dev).
      PROVISION_KEYCLOAK_URL: http://keycloak:8080
      PROVISION_KEYCLOAK_REALM: mission
      PROVISION_TOKEN_URL: http://keycloak:8080/realms/mission/protocol/openid-connect/token
      PROVISION_CLIENT_ID: tenant-registry-provisioner
      PROVISION_CLIENT_SECRET: ${PROVISION_CLIENT_SECRET:-}
      PROVISION_CORE_URL: http://provision-gia-lap:8080
      PROVISION_ORG_URL: http://provision-gia-lap:8080
      PDNS_API_URL: http://provision-gia-lap:8080
      PDNS_ZONE: okr.dev.local
      PDNS_API_KEY: gia-lap-dev
      CERT_K8S_API: http://provision-gia-lap:8080
      CERT_NAMESPACE: apisix
      CERT_ISSUER: dev-gia-lap
      CERT_TOKEN_FILE: /run/provision/k8s-token-gia-lap
      PROVISION_BACKOFF: 2s
      # Khoá mã hoá cột C2 (base64 đúng 32 byte) và khoá ký cookie định tuyến cell (base64, tối thiểu 32 byte);
      # thiếu thì service dừng ngay lúc đọc cấu hình.
      C2_KEY: ${REGISTRY_C2_KEY:-}
      ROUTING_COOKIE_KEY: ${REGISTRY_ROUTING_COOKIE_C2_KEY:-}
    volumes:
      - ./provision/k8s-token-gia-lap:/run/provision/k8s-token-gia-lap:ro
    depends_on:
      provision-gia-lap:
        condition: service_healthy
    ports:
      - "${TENANT_REGISTRY_PORT:-35110}:8080"

  # Bộ giả lập hệ ngoài của saga cấp phát (YC-PT-13, VH-04): chỉ dùng dev, không mở cổng ra máy chủ.
  provision-gia-lap:
    <<: *backend-go
    build:
      context: ../../services-go
      dockerfile: ../infra/dev/backend/Dockerfile.go
      args: { SERVICE: tenant-registry, CMD: provision-gia-lap }
      secrets: [ca_bundle]
    image: mission-dev/provision-gia-lap:dev
    container_name: mission-dev-provision-gia-lap
    environment:
      HTTP_ADDR: ":8080"
      GIA_LAP_CO_CAY: "1"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  # SVC-09: sổ cái ở CSDL ledger.
  ledger-service:
    <<: *backend-go
    build:
      context: ../../services-go
      dockerfile: ../infra/dev/backend/Dockerfile.go
      args: { SERVICE: ledger, CMD: ledger-service }
      secrets: [ca_bundle]
    image: mission-dev/ledger-service:dev
    container_name: mission-dev-ledger-service
    environment:
      APP_ENV: dev
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://svc_ledger:${DB_ROLE_PASSWORD_DEFAULT:-}@pgbouncer:6432/ledger?search_path=ledger
      READONLY_DATABASE_URL: postgres://ro_ledger:${DB_ROLE_PASSWORD_DEFAULT:-}@pgbouncer:6432/ledger?search_path=ledger
      KAFKA_BROKERS: kafka:9092
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:35080}/realms/mission
      OIDC_ISSUERS: ${KEYCLOAK_PUBLIC_URL:-http://127.0.0.1:35080}/realms/mission
      OIDC_JWKS_URL: http://keycloak:8080/realms/mission/protocol/openid-connect/certs
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${LEDGER_SERVICE_PORT:-35120}:8080"

  # SVC-12: schema notify (CSDL mission); kênh email, SMS, đẩy tắt cho tới khi cấu hình ở .env.
  notification-service:
    <<: *backend-go
    build:
      context: ../../services-go
      dockerfile: ../infra/dev/backend/Dockerfile.go
      args: { SERVICE: notification, CMD: notification-service }
      secrets: [ca_bundle]
    image: mission-dev/notification-service:dev
    container_name: mission-dev-notification-service
    environment:
      APP_ENV: dev
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://svc_notify:${DB_ROLE_PASSWORD_DEFAULT:-}@pgbouncer:6432/${POSTGRES_DB:-mission}?search_path=notify
      READONLY_DATABASE_URL: postgres://ro_notify:${DB_ROLE_PASSWORD_DEFAULT:-}@pgbouncer:6432/${POSTGRES_DB:-mission}?search_path=notify
      KAFKA_BROKERS: kafka:9092
      VALKEY_ADDRS: valkey:6379
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:-}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-35121}:8080"

  # ---------------------------------------------------------------------------
  # PROFILE: analytics — Kho phân tích ClickHouse của SVC-15 (DV-15-01, ADR-14)
  # ---------------------------------------------------------------------------
  # Một nút có Keeper nhúng và cụm `cell_dev` một shard một bản sao, để DDL `ON CLUSTER` và
  # `ReplicatedReplacingMergeTree` của analytics/clickhouse/migrations chạy y như cụm của INF-11.
  # Đọc topic cdc.* từ Kafka qua cổng nội bộ kafka:9092; áp migration: xem analytics/clickhouse/README.md.
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    container_name: mission-dev-clickhouse
    restart: unless-stopped
    profiles: ["analytics", "all"]
    environment:
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Đặt CLICKHOUSE_PASSWORD trong .env}
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-35123}:8123"
    volumes:
      - ${CLICKHOUSE_DATA:-clickhouse_data}:/var/lib/clickhouse
      - ./clickhouse/config.d/cell-dev.xml:/etc/clickhouse-server/config.d/cell-dev.xml:ro
      - ./clickhouse/users.d/migrator.xml:/etc/clickhouse-server/users.d/migrator.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  # Lớp ngữ nghĩa Cube (DV-15-03): mô hình và cấu hình ở analytics/cube. Chạy sau khi đã áp migration kho
  # (analytics/clickhouse/migrate.py). Bộ đệm và hàng đợi trong bộ nhớ, một tiến trình; Cube Store và nhiều bản sao
  # là phần triển khai cụm (INF).
  cube:
    image: cubejs/cube:v1.3.60
    container_name: mission-dev-cube
    restart: unless-stopped
    profiles: ["analytics", "all"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CUBEJS_DB_TYPE: clickhouse
      CUBEJS_DB_HOST: clickhouse
      CUBEJS_DB_PORT: "8123"
      CUBEJS_DB_NAME: ${ANALYTICS_DB:-analytics_dev}
      CUBEJS_DB_USER: ${ANALYTICS_DB:-analytics_dev}_cube
      CUBEJS_DB_PASS: ${ANALYTICS_CUBE_PASSWORD:?Đặt ANALYTICS_CUBE_PASSWORD trong .env}
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:?Đặt CUBEJS_API_SECRET trong .env}
      CUBEJS_DEV_MODE: "false"
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
      CUBEJS_REFRESH_WORKER: "true"
      CUBE_REFRESH_TENANTS: ${CUBE_REFRESH_TENANTS:-}
      CUBEJS_TELEMETRY: "false"
      # SQL API (Postgres wire) chỉ cho Superset nhúng (DV-15-05); không mở cổng ra máy chủ.
      CUBEJS_PG_SQL_PORT: "15432"
      CUBEJS_SQL_USER: ${CUBE_SQL_USER:-superset_ky_thuat}
      CUBEJS_SQL_PASSWORD: ${CUBE_SQL_PASSWORD:?Đặt CUBE_SQL_PASSWORD trong .env}
    ports:
      - "${CUBE_PORT:-35400}:4000"
    volumes:
      - ../../analytics/cube/cube.js:/cube/conf/cube.js:ro
      - ../../analytics/cube/model:/cube/conf/model:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:4000/readyz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - mission-net

  # Superset 4.x nhúng (DV-15-05, ADR-14): nguồn dữ liệu duy nhất là Cube SQL API; người xem không đăng nhập mà dùng
  # guest token do analytics-api cấp. CSDL siêu dữ liệu SQLite trong volume (production dùng PostgreSQL riêng, INF).
  superset:
    build:
      context: ../../analytics/superset
    image: mission-dev-superset:4.1.2
    container_name: mission-dev-superset
    restart: unless-stopped
    profiles: ["analytics", "all"]
    depends_on:
      cube:
        condition: service_healthy
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:?Đặt SUPERSET_SECRET_KEY trong .env}
      SUPERSET_METADATA_URI: sqlite:////app/superset_home/superset.db
      SUPERSET_WEB_ORIGINS: ${SUPERSET_WEB_ORIGINS:-http://localhost:4200}
      SUPERSET_GUEST_TOKEN_SECRET: ${SUPERSET_GUEST_TOKEN_SECRET:?Đặt SUPERSET_GUEST_TOKEN_SECRET trong .env}
      SUPERSET_COOKIE_SECURE: "false"
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER:-quan_tri}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:?Đặt SUPERSET_ADMIN_PASSWORD trong .env}
      SUPERSET_SERVICE_USER: ${SUPERSET_SERVICE_USER:-analytics_api}
      SUPERSET_SERVICE_PASSWORD: ${SUPERSET_SERVICE_PASSWORD:?Đặt SUPERSET_SERVICE_PASSWORD trong .env}
      CUBE_SQL_USER: ${CUBE_SQL_USER:-superset_ky_thuat}
      CUBE_SQL_PASSWORD: ${CUBE_SQL_PASSWORD:?Đặt CUBE_SQL_PASSWORD trong .env}
      CUBE_SQL_HOST: cube:15432
    ports:
      - "${SUPERSET_PORT:-35088}:8088"
    volumes:
      - superset_home:/app/superset_home
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - mission-net

# Chỗ lưu dữ liệu (INF-22): mặc định là volume có tên mission-dev_<tên>. Đặt biến *_DATA trong .env thành
# đường dẫn tuyệt đối để dùng thư mục gắn sẵn (bind), như máy chủ dev dùng chung đang lưu ở <thư mục>/data/<dịch vụ>.
volumes:
  clickhouse_data:
  pg_data:
  valkey_data:
  kafka_data:
  minio_data:
  opensearch_data:
  tempo_data:
  loki_data:
  prometheus_data:
  grafana_data:
  llm_cache:
  superset_home:
  clamav_db:

networks:
  mission-net:
    name: mission-dev-net
    driver: bridge

# Chứng thư gốc bổ sung cho bước dựng ảnh (go mod download, apk, npm ci) khi máy dựng ra Internet qua proxy chặn
# TLS: đặt BUILD_CA_BUNDLE trỏ tới tệp PEM; để trống thì dùng /dev/null (tệp rỗng, Dockerfile bỏ qua).
secrets:
  ca_bundle:
    file: ${BUILD_CA_BUNDLE:-/dev/null}
