name: vt_form_engine
description: >-
  Bộ dựng biểu mẫu động từ JSON Schema và CEL cho ứng dụng di động Mission (MOB-06),
  cùng màn hình phiếu tự đánh giá. Dùng chung bộ ca vàng với vt-cel và @vt/form-engine.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  yaml: ^3.1.3
